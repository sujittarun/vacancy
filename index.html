     A fixed slot rather than a callout that chases the finger: this is what
     Apple's Stocks and Health do, and it costs nothing in edge cases — no
     flipping near the left or right end, no clamping, no collision with the
     sheet header — while a following tooltip needs all three. The trade is
     eye travel, and over a 46px bar there is almost none to trade.
     The slot keeps its height whether or not anything is in it, so reading a
     night still moves nothing on the screen. */
  const say = el("div","strip-say");
  /* The callout. It tracks the finger sideways but never vertically — its y is
     the strip's, which is fixed, so it cannot bob about while you read. That
     one decision removes every case a normal tooltip has to handle: no flipping
     above/below, no collision with the sheet header, no separate placement rule
     for touch and mouse.
     It carries the seven nights around the one you are on, because a thumb pad
     covers roughly EIGHT of these bars — more than a week. What the finger
     hides is therefore never a single night, it is the run of vacancy around
     it, which is exactly what the person on the phone is asking about. */
  const call = el("div","strip-call");
  const read = el("div","strip-read");
  read.setAttribute("aria-live","polite");
  const readD = el("b"), readW = el("span");
  const mini = el("div","strip-mini");
  /* The date and the seven nights share the top line, and the sentence sits
     under both. Stacked three-high the card outgrew its slot and the sheet's
     own scroller clipped the date clean off the top — the card cannot overflow
     upward, so it has to be short enough not to want to. */
  const top = el("div","sc-top");
  top.append(readD, mini);
  read.append(top, readW);
  call.append(read);
  say.append(call);

  /* The legend stays below and stays put. It is context, not a readout, so it
     no longer has to blink out of the way to make room for one. */
  const foot = el("div","strip-foot");
  const k = el("div","strip-k");
  k.append(el("span","lbl","Today"), el("span","lbl", `${occPct(fi)}% booked`), el("span","lbl","+9 weeks"));
  foot.append(k);
  return {wrap, strip, head, say, call, mini, foot, readD, readW};
}

/* The next run of free nights at or after `from`, which is what turns "not
   available" into something you can still act on. */
function nextFree(fi, from){
  for(let d = Math.max(0, from); d < DAYS; d++){
    if(occ[fi][d]) continue;
    let n = 0; while(d + n < DAYS && !occ[fi][d + n]) n++;
    return {from: d, nights: n};
  }
  return null;
}

/* DAYS-1 is the last sellable NIGHT. A check-out is the morning AFTER a night,
   so a legal check-out index runs to DAYS and past it, and clamping one to
   DAYS-1 prints a date the guest is still occupying. Measured: LP-101's
   C. Varghese ends on day 68 and the room sheet said "in until 18 Oct" against
   a real check-out of 24 Oct — six days early, on the app's own wrong-row
   failure mode dressed as a date. It also made two screens contradict each
   other about a booking just taken: the form said "Leaves 19 Oct", the sheet
   said "in until 18 Oct". fmt() handles any index; the clamp bought nothing. */
function openSheet(fi, day){
  const fl = flats[fi];
  roomHead(fi);

  const S = roomStrip(fi);
  sheetB.append(S.say, S.wrap, S.foot);
  attachStripScrub(S.wrap, S.strip, S.head, S.say, S.call, S.mini, S.readD, S.readW, fi);

  /* ── the one thing you probably came for ──────────────────────────────────
     Decided by the room's state rather than always being the same button, so
     the largest target on screen is never the wrong one. */
  /* The day this sheet was opened FOR, when it was given one. pickedNight is a
     single global cursor shared by a 14-night strip and a 63-day sheet, so a
     jump that set it past the strip left the grid painted on one date while
     the sheet booked another — the tile said "free from 30 Aug", the button
     said "Book 7 Sep". */
  const bDay = (day == null ? pickedNight : day), bN = stayNights;
  /* freeSpan, not freeRange — this was the one guard the horizon change did not
     migrate, and it left the room sheet contradicting the booking form it
     launches. At the edge of the book, freeRange goes false the moment
     bDay + bN passes DAYS, so on a flat with nothing booked at all the sheet's
     primary action read "Not free for those nights" and offered one night,
     while openBooking one tap away said "Leaves 20 Oct · free to the end of
     this book · Book 3 nights". The sheet is the screen the operator reads out
     mid-call, so its version is the one that loses the booking. */
  const canTake = freeSpan(fi, bDay, bDay + bN);
  const act = el("div","roomAct");

  if(canTake){
    const b = el("button","bigAct", `Book ${bN === 1 ? fmtL(bDay) : fmt(bDay) + " → " + fmt(bDay + bN)}`);
    b.append(el("s", null, bN === 1 ? "one night" : bN + " nights"));
    b.onclick = ()=>{ haptic(12); openBooking(fi, bDay, bN); };
    act.append(b);
  }else{
    const busy = resv.find(r => r.fi === fi && r.start < bDay + bN && r.end > bDay);
    const nxt = nextFree(fi, bDay);
    const why = el("div","actWhy");
    why.innerHTML = busy
      ? (isBlock(busy)
          ? `<b>${esc(busy.reason || "Out of service")}</b> until ${esc(fmt(busy.end))}`
          : busy.openEnd
            ? `<b>${esc(busy.guest)}</b> is in · no end date recorded`
            : `<b>${esc(busy.guest)}</b> is in until ${esc(fmt(busy.end))}`)
      : `Not free for those nights`;
    act.append(why);
    if(nxt){
      // a dead end is a wasted screen — offer the nearest thing that can be sold
      const b = el("button","bigAct", `Book from ${fmt(nxt.from)}`);
      b.append(el("s", null, `next free · ${nxt.nights} night${nxt.nights>1?"s":""}`));
      b.onclick = ()=>{ haptic(12); openBooking(fi, nxt.from, Math.min(nxt.nights, 3)); };
      act.append(b);
    }
  }

  const routes = el("div","roomRoutes");
  const rFault = el("button", null, "Log a fault");
  rFault.append(el("s", null, "stays on sale"));
  rFault.onclick = ()=>{ haptic(9); openIssueForm(fi, day); };
  const rOut = el("button", null, "Out of service");
  rOut.append(el("s", null, "cannot be sold"));
  rOut.onclick = ()=>{ haptic(9); openBlockForm(fi, day); };
  routes.append(rFault, rOut);
  act.append(routes);
  sheetB.append(act);

  /* ── what is true about this room, read only ─────────────────────────────── */
  const mine = resv.filter(r=>r.fi===fi && r.end>0 && r.start<DAYS).sort((a,b)=>a.start-b.start);
  const s1 = el("div","sheet-s");
  s1.append(el("span","lbl", `Coming up · ${mine.length}`),
            el("span","lbl", `₹${fl.rate.toLocaleString("en-IN")} / night`));
  sheetB.appendChild(s1);
  const bl = el("div","card"); bl.style.margin="0 20px";
  if(!mine.length) bl.appendChild(el("div","empty","Nothing booked in the next nine weeks."));
  // a glance, not an archive — the strip above already carries the whole shape,
  // and anything past the next few is a scroll nobody performs
  const SHOW = 5;
  mine.slice(0, SHOW).forEach(r=>{
    const row = el("div","row bk");
    row._resv = r;
    const when = Math.max(r.start,0) === 0 ? "Now" : fmt(Math.max(r.start,0));
    const m = el("div","meta");
    /* Neither the end date nor the night count is knowable for a tenancy the
       import window cut. 176n is the width of the window, and 18 Nov is where
       it stopped — printed here they read as the operator's own figures. */
    m.innerHTML = `<b>${esc(r.guest)}</b>`
                + `<em>${when} → ${r.openEnd ? "no end recorded" : esc(fmt(r.end)) + " · " + r.nights + "n"} · ${esc(r.src)}</em>`;
    const end = el("div","rowend");
    end.appendChild(!isBlock(r) && r.amount ? moneyPill(r, fi, day)
      : el("span","pill", r.openEnd ? "open" : `${r.nights}n`));
    const x2 = el("button","rowx","✕");
    x2.setAttribute("aria-label", `Cancel ${r.guest}'s booking in ${fl.id}`);
    armConfirm(x2, {rest:"✕", armed:"Cancel?",
      run:()=>{ cancelWithUndo(r, fi); closeSheet(); refreshScreen(); }});
    /* Small on purpose. Moving a guest is a real thing to want and a rare thing
       to do, so it sits on the guest's own row at the size of a glyph — not a
       pill, not a card, not a third route competing with Book. */
    if(!isBlock(r) && r.start >= 0){
      const mvb = el("button","rowx rowmv");
      mvb.innerHTML = SVG_SWAP;
      mvb.setAttribute("aria-label", `Move ${r.guest} to another flat`);
      mvb.onclick = ev=>{ ev.stopPropagation(); haptic(9);
        openGuestMove(r, ()=> openSheet(fi, day)); };
      end.appendChild(mvb);
    }
    end.appendChild(x2);
    row.append(m, end);
    bl.appendChild(row);
  });
  if(mine.length > SHOW){
    const more = el("div","rowMore", `${mine.length - SHOW} more in the strip above`);
    bl.appendChild(more);
  }
  sheetB.appendChild(bl);

  const mine2 = openIssues(fi);
  if(mine2.length){
    const win = batchWindow(fi, 1);
    const s3 = el("div","sheet-s");
    s3.append(el("span","lbl", `Needs fixing · ${mine2.length}`),
              el("span","lbl", win ? `empty ${fmt(win.from)} for ${win.nights}n` : "no gap yet"));
    sheetB.appendChild(s3);
    const il = el("div","card"); il.style.margin = "0 20px";
    mine2.forEach(x2=>{
      const row = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(x2.fault || "Issue")}</b>`
                  + `<em>${esc(x2.note || "no note")} · logged ${x2.on === 0 ? "today" : fmt(x2.on)}</em>`;
      const end = el("div","rowend");
      end.appendChild(el("span", "paid " + (x2.urgency === "urgent" ? "due" : "clear"),
                         x2.urgency === "whenever" ? "can wait" : x2.urgency));
      const done = el("button","rowx","✓");
      done.setAttribute("aria-label", `Mark ${x2.fault || "this issue"} fixed`);
      /* This used to arm on the first tap and close on the second, recording
         nothing. It now opens the form that asks the two things worth keeping,
         which is its own confirmation — a sheet you can back out of. */
      done.onclick = ()=>{
        haptic(12);
        openFixedForm({
          /* No pre-fill here. A logged fault keeps who was lined up inside its
             note text ("… · for Ramesh"), and digging a name back out of prose
             would pre-select the wrong person the first time somebody's note
             ended in the word "for". The crew list already ranks whoever has
             done this fault here before, which is the same answer, honestly. */
          fi, fault: x2.fault || "",
          assigned: "", assignedPhone: "",
          line: `<b>${esc(x2.fault || "Issue")}</b> · logged `
              + `${x2.on === 0 ? "today" : fmt(x2.on)}${x2.note ? " · " + esc(x2.note) : ""}`,
          cta: "Mark it fixed",
          back: ()=> openSheet(fi, day),
          onDone: d=>{
            closeIssue(x2, d.fixer, d.phone, d.cost);
            openSheet(fi, day); refreshScreen();
          }
        });
      };
      end.appendChild(done);
      row.append(m, end);
      il.appendChild(row);
    });
    sheetB.appendChild(il);
    if(mine2.length > 1 && win){
      const b = el("p");
      b.style.cssText = "margin:9px 20px 0;font-size:12px;line-height:1.55;color:var(--txt-3)";
      b.textContent = `All ${mine2.length} could go in one visit while it sits empty from `
        + `${fmt(win.from)} — one trip instead of ${mine2.length}, and no night lost.`;
      sheetB.appendChild(b);
    }
  }

  const s2 = el("div","sheet-s");
  s2.append(el("span","lbl","Open stretches"), el("span","lbl","sellable"));
  sheetB.appendChild(s2);
  const gl = el("div","card"); gl.style.margin="0 20px";
  let d=0, any=false, shown=0;
  while(d<DAYS){
    if(occ[fi][d]){ d++; continue; }
    let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++;
    if(shown >= SHOW){ d += n; any = true; continue; }
    shown++;
    const row = el("button","row"); any=true;
    row.append(el("div","id", `${n}n`));
    const m = el("div","meta");
    m.innerHTML = `${fmtL(d)}<em>through ${fmtL(Math.min(d+n,DAYS-1))}</em>`;
    row.append(m, el("span", n===1 ? "pill warn" : "pill good", n===1 ? "orphan night" : "open"));
    const at = d, len = n;
    row.onclick = ()=>{ haptic(9); openBooking(fi, at, Math.min(len, 3)); };
    gl.appendChild(row);
    d += n;
  }
  if(!any) gl.appendChild(el("div","empty","Solidly booked for the whole horizon."));
  sheetB.appendChild(gl);

  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* ══════════════ moving a guest ══════════════════════════════════════════════
   Ask can already spot that one shuffle would rescue a stay it otherwise has to
   refuse. It used to stop at spotting it: tapping the option opened the room
   that WOULD be freed, and nobody had moved, which made the whole feature a
   suggestion the operator then had to carry out by hand somewhere else.

   This finishes it. And because it is the one action that changes something a
   guest has already been told — their room number — it is the one action that
   asks first, and the one that shows what it is about to do rather than
   describing it. The guest crosses the gap between two rooms with their bag.
   A record silently changing its flat_id would be the same operation and a
   completely different thing to agree to.                                    */
const SVG_BAG = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<rect x="3.2" y="6.6" width="13.6" height="10.2" rx="2.2"/>'
  + '<path d="M7.6 6.6V4.4a1.4 1.4 0 0 1 1.4-1.4h2a1.4 1.4 0 0 1 1.4 1.4v2.2"/>'
  + '<path d="M3.2 11.4h13.6"/></svg>';

/* two rooms trading places — the same idea as the bag, at label size */
const SVG_SWAP = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3.5 7h11M11.5 4 14.5 7l-3 3"/>'
  + '<path d="M16.5 13h-11M8.5 16 5.5 13l3-3"/></svg>';


function openMove(mv, askDay, onFreed, opts){
  opts = opts || {};
  const from = flats[mv.frees], n = mv.moves.length;
  let booked = false, done = [], busy = false;
  const timers = [];
  const later = (fn, ms)=>{
    const id = setTimeout(()=>{ const i = timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); }, ms);
    timers.push(id); return id;
  };
  /* Fast enough to read as one movement, not as a sequence to sit through.
     The old 300/460/110 put 848ms between tapping Move and being able to do
     anything else — on a phone that is not a flourish, it is a wait. These
     keep the arc legible and give the whole move back in under half a second. */
  const OPEN = 160, FLY = 280, STEP = 70;

  const abandoned = ()=>{
    if(booked || !done.length) return;
    /* A move started from a guest's own row is its own reason. `booked` is set
       only inside the go button's handler, so it was the sole evidence the
       moves had a purpose — and openGuestMove reuses this same stage for a move
       whose purpose IS the move. Dismissing that sheet by any of its four
       ordinary routes (swipe, scrim, tab switch, the sheet's own ✕, which calls
       closeSheet directly) produced a warning saying "A. Fernandes was moved
       but TT-101 was never booked — so nobody was moved for a reason", which is
       false, with a button that reverts a correct move. PRODUCT.md says outright
       that a guest may be moved for no reason but the operator's and that this
       glyph exists for exactly that. Confirm it instead. */
    if(opts.deliberate){
      const k = done.length;
      toast("", k === 1
        ? `<b>${esc(done[0].c.m.booking.guest)}</b> is now in `
          + `${esc(flats[done[0].booking.fi].id)}.`
        : `<b>${k} guests moved.</b>`, null);
      return;
    }
    const k = done.length, names = done.map(d => d.c.m.booking.guest);
    toast("warn", `<b>${k === 1 ? esc(names[0]) + " was moved" : k + " guests were moved"}</b> `
      + `but ${esc(from.id)} was never booked — so nobody was moved for a reason.`,
      null, {label: k === 1 ? "Put them back" : `Put all ${k} back`, run:()=>{
        const failed = [];
        done.slice().reverse().forEach(d=>{ if(!moveBooking(d.booking, d.was)) failed.push(d); });
        haptic(14); refreshScreen();
        toast(failed.length ? "bad" : "",
          failed.length ? `<b>${failed.length} could not go back</b> — those rooms have been taken since.`
                        : `<b>Everyone is back where they were.</b>`, null);
      }});
  };

  sheetWipe();
  sheetOwn(()=>{ timers.splice(0).forEach(clearTimeout); abandoned(); });

  const t = el("div");
  t.innerHTML = `<div class="n">${esc(opts.title || "Free up " + from.id)}</div>`
              + `<div class="m">${n === 1 ? "one guest moves" : n + " guests move"} · nobody loses a night</div>`;
  const x = el("button", null, "✕"); x.setAttribute("aria-label","Close");
  x.onclick = ()=> closeSheet();
  sheetH.append(t, x);

  const stage = el("div","movestage");
  stage.setAttribute("role","group");
  stage.setAttribute("aria-label", (n === 1 ? "One guest moves" : n + " guests move") + " out of " + from.id);
  const fly = el("div","mfly"); fly.setAttribute("aria-hidden","true");

  /* a party is a collapsible row: the grid animates, the inner box clips */
  const party = ()=>{
    const p = el("div","mparty"), inner = el("div","mpin");
    p.append(inner); p.inner = inner; return p;
  };

  const src = el("div","mroom"); src.setAttribute("role","group");
  const srcHead = el("div","mhead"), srcTag = el("span","mtag");
  srcHead.append(el("b", null, from.id), el("s", null, from.type + " · " + from.bshort), srcTag);
  const srcParty = party();
  src.append(srcHead, srcParty);

  const gap = el("div","mgap"); gap.setAttribute("aria-hidden","true"); gap.appendChild(el("i"));
  const dests = el("div","mdests");

  const chipFor = m =>{
    const c = el("div","mguest");
    c.innerHTML = '<div class="mguest-fx"><div class="mguest-in">'
      + '<span class="bag">' + SVG_BAG + '</span>'
      + '<span class="who"><b>' + esc(m.booking.guest) + '</b>'
      + '<s>' + esc(fmt(m.booking.start)) + '–' + esc(fmt(m.booking.end)) + '</s></span>'
      + '</div></div>';
    return c;
  };

  const rooms = new Map(), chips = [];
  mv.moves.map((m,i)=>({m,i}))
    .sort((a,b)=> (a.m.booking.start - b.m.booking.start) || (a.i - b.i))
    .forEach(({m})=>{
      const to = flats[m.to];
      let d = rooms.get(m.to);
      if(!d){
        const row = el("div","mdest"); row.setAttribute("role","group");
        const head = el("div","mhead");
        head.append(el("b", null, to.id), el("s", null, to.type + " · " + to.bshort));
        const pt = party();
        row.append(head, pt); dests.appendChild(row);
        d = {row, party:pt, fi:m.to, want:[]}; rooms.set(m.to, d);
      }
      /* home is where they are; away is the space kept for them, hidden until
         they land. No dashed outline announcing a move nobody has agreed to. */
      const home = chipFor(m), away = chipFor(m);
      away.classList.add("away");
      srcParty.inner.appendChild(home);
      d.party.inner.appendChild(away);
      d.want.push(m.booking.guest);
      chips.push({home, away, m, dest:d});
    });
  srcParty.classList.add("open");
  stage.append(src, gap, dests, fly);

  const worst = mv.moves.find(m => !m.sameBuilding);
  const pitch = `Everyone keeps their own nights, their room is never smaller. `
    + (mv.sameBuilding && mv.sameType
        ? `<b>Same building, same size</b> throughout — the kind of move nobody notices.`
        : worst
        ? `<b>${esc(flats[worst.booking.fi].bname)} → ${esc(flats[worst.to].bname)}</b> for `
          + `${esc(worst.booking.guest)} — a different building, so that one is worth a call.`
        : `Same building throughout${mv.sameType ? "" : ", and nobody ends up in a smaller flat"}.`);
  const firstNote = n === 1
    ? "Nothing else changes — same dates, same money, same guest. They will need telling their room number."
    : `Nothing else changes — same dates, same money. All ${n} will need telling their new room number.`;

  const why = el("p","movewhy");
  const go = el("button","bkgo movego");
  const undoBtn = el("button","moveundo away");
  const note = el("p","movenote");

  const atHome = ()=> chips.filter(c => !c.home.classList.contains("away"));

  const restate = ()=>{
    const staying = atHome().length;
    src.classList.toggle("lit", !staying);
    srcParty.classList.toggle("open", staying > 0);
    srcTag.textContent = staying ? (staying === 1 ? "1 guest" : staying + " guests") : "Free";
    src.setAttribute("aria-label", from.id + ", " + from.type + ", " + from.bshort
      + (staying ? " — " + staying + (staying === 1 ? " guest to move" : " guests to move") : " — free"));
    rooms.forEach(d=>{
      const here = [...d.party.inner.children].filter(c => !c.classList.contains("away"));
      d.row.classList.toggle("filled", here.length > 0);
      d.party.classList.toggle("open", here.length > 0);
      d.row.setAttribute("aria-label", flats[d.fi].id + ", " + flats[d.fi].type + ", " + flats[d.fi].bshort
        + (here.length ? " — now holding " + here.map(c => c.querySelector("b").textContent).join(", ")
                       : " — free, " + d.want.join(" and ") + " would move here"));
    });
  };

  const speak = ()=>{
    restate();
    const left = atHome(), m = left.length;
    if(!m){
      why.innerHTML = `<b class="ok">${esc(from.id)} is free.</b> `
        + (n === 1 ? `${esc(chips[0].m.booking.guest)} is in ${esc(flats[chips[0].m.to].id)}`
                   : `All ${n} are in their new rooms`) + ` for the same nights.`;
      go.textContent = opts.cta || `Book ${from.id}`;
      go.onclick = ()=>{ haptic(14); booked = true; sheetOwn(null);
        if(onFreed) onFreed(mv.frees); else openBooking(mv.frees, askDay, 1); };
      note.textContent = n === 1
        ? "Tell them the new room number when you next speak to them."
        : `Tell all ${n} their new room numbers when you next speak to them.`;
    }else if(m === n){
      why.innerHTML = pitch;
      go.textContent = n === 1 ? `Move ${chips[0].m.booking.guest}` : `Move all ${n}`;
      go.onclick = start;
      note.textContent = firstNote;
    }else{
      const stuck = done.map(d => d.c.m.booking.guest);
      why.innerHTML = `<b>${esc(from.id)} is not free.</b> `
        + `${esc(stuck.join(" and "))} ${stuck.length === 1 ? "is" : "are"} still moved; `
        + `${m === 1 ? "one guest is" : m + " guests are"} back in ${esc(from.id)}.`;
      go.textContent = m === 1 ? `Move ${left[0].m.booking.guest} again` : `Move the other ${m}`;
      go.onclick = start;
      note.textContent = "Nothing else changes — same dates, same money.";
    }
    undoBtn.classList.toggle("away", !done.length);
    undoBtn.textContent = done.length === 1 ? "↩ Put them back" : `↩ Put all ${done.length} back`;
    undoBtn.disabled = false;
    go.disabled = false;
  };

  speak();
  why.setAttribute("role","status"); why.setAttribute("aria-live","polite");
  sheetB.append(stage, why, go, undoBtn, note);
  sheet.classList.add("on"); scrim.classList.add("on"); sheetB.scrollTop = 0;

  /* ── the flight ────────────────────────────────────────────────────────────
     Beat one: the room opens. Beat two: the guest walks across. They are two
     movements because they are two events, and running them together makes the
     landing point move while something is travelling towards it. */
  function carry(pairs, after){
    if(!pairs.length){ if(after) after(); return; }
    busy = true;
    const still = calm;
    pairs.forEach(p => p.openRow());            // make space first
    if(still){
      // Reduced motion still has to be the same EVENT, not a different one:
      // whoever left has to stop being where they were. Landing the arrival
      // without hiding the departure leaves the same guest in both rooms.
      pairs.forEach(p =>{ p.fromEl.classList.add("away"); p.land(); });
      busy = false; if(after) after(); return;
    }

    later(()=>{
      const box = stage.getBoundingClientRect();
      stage.classList.add("carrying");
      pairs.forEach((p,i)=>{
        const a = p.fromEl.getBoundingClientRect();
        const b = p.toEl.getBoundingClientRect();
        const f = p.fromEl.cloneNode(true);
        /* ADD the flier class, never REPLACE the element's own. Overwriting
           className threw away `.mguest`, and with it `.mguest s{text-decoration
           :none}` — so the <s> carrying the guest's dates fell back to the
           browser default and the chip flew across the screen with a LINE
           THROUGH IT. Invisible in a screenshot because the flier only exists
           for 280ms; perfectly legible on a phone, where it reads as the app
           striking the booking out before moving it. */
        f.classList.add("mflier");
        f.style.width = a.width + "px";
        f.style.setProperty("--x0", (a.left - box.left).toFixed(1) + "px");
        f.style.setProperty("--y0", (a.top  - box.top ).toFixed(1) + "px");
        f.style.setProperty("--x1", (b.left - box.left).toFixed(1) + "px");
        f.style.setProperty("--y1", (b.top  - box.top ).toFixed(1) + "px");
        f.style.setProperty("--bow", Math.max(9, Math.min(20,
          Math.hypot(b.left - a.left, b.top - a.top) * .1)).toFixed(0) + "px");
        f.style.setProperty("--delay", (i * STEP) + "ms");
        f.style.setProperty("--fly", FLY + "ms");
        fly.appendChild(f);
        p.fromEl.classList.add("away");          // it is in the air now
        later(()=>{ p.land(); f.remove(); haptic(7); }, i * STEP + FLY - 20);
      });
      later(()=>{
        stage.classList.remove("carrying");
        fly.textContent = "";
        busy = false;
        if(after) after();
      }, (pairs.length - 1) * STEP + FLY + 40);
    }, OPEN);
  }

  function start(){
    if(busy) return;
    const going = atHome();
    if(!going.length) return;
    go.disabled = true; undoBtn.disabled = true; haptic(12);
    const moved = [];
    for(const c of going){
      const r = moveBooking(c.m.booking, c.m.to);
      if(!r){
        moved.slice().reverse().forEach(d => moveBooking(d.booking, d.was));
        go.disabled = false; undoBtn.disabled = false; haptic(20);
        toast("warn", `<b>${esc(flats[c.m.to].id)} went while you were deciding.</b> `
          + `Nobody has been moved.`, c.m.to);
        return;
      }
      moved.push({booking:c.m.booking, was:r.from, c});
    }
    done = done.concat(moved);
    refreshScreen();
    carry(going.map(c=>({
      fromEl: c.home, toEl: c.away,
      openRow: ()=>{ c.dest.party.classList.add("open"); c.dest.row.classList.add("filled"); },
      land: ()=>{ c.away.classList.remove("away"); }
    })), ()=>{ haptic(16); speak(); });
  }

  undoBtn.onclick = ()=>{
    if(busy || !done.length) return;
    undoBtn.disabled = true; go.disabled = true; haptic(10);
    const returned = [], stuck = [];
    done.slice().reverse().forEach(d=>{ (moveBooking(d.booking, d.was) ? returned : stuck).push(d); });
    returned.reverse(); stuck.reverse();
    done = stuck;
    refreshScreen();
    if(stuck.length)
      toast("bad", `<b>${stuck.length} could not go back</b> — `
        + `${stuck.length === 1 ? "that room has" : "those rooms have"} been taken since.`, null);
    if(!returned.length){ speak(); return; }
    carry(returned.map(d=>({
      fromEl: d.c.away, toEl: d.c.home,
      openRow: ()=>{ srcParty.classList.add("open"); },
      land: ()=>{
        d.c.home.classList.remove("away");
        if(![...d.c.dest.party.inner.children].some(k => !k.classList.contains("away"))){
          d.c.dest.party.classList.remove("open");
          d.c.dest.row.classList.remove("filled");
        }
      }
    })), ()=>{ haptic(14); speak(); });
  };
}
/* ── booking, on its own screen ───────────────────────────────────────────────
   It sets its own dates. The old form inherited them from the Rooms tab and
   apologised for it in help text — "change the dates on the Rooms tab" — which
   is what a broken flow sounds like when nobody fixes it.                     */
/* ══ THE COST SHEET ═══════════════════════════════════════════════════════════
   The one place this app asks the operator for a number instead of reading one.

   Lotus Pond is sixteen of forty-six flats and appears in no revenue sheet and
   no cost sheet in the entire workbook. Every instinct says fill it in — take
   Banjara Hills' rent per flat, scale it, show a portfolio profit that looks
   complete. That number would be wrong by whatever Lotus Pond's actual rent is,
   it would be indistinguishable on screen from the four that are real, and it
   would make the one useful thing the app noticed disappear.

   So the app refuses, and offers the fix instead. Nothing here is pre-filled
   with a guess. The line names come from Object.keys across FIN_COST — their
   own rows, their own spelling — so a building costed here is costed the same
   way as the four their sheet already covers, and the break-even readout fills
   in live as they type, using the "Break even per flat" row their Costing sheet
   already has.

   Saved under the operator's own key, merged over the workbook's model on read,
   so re-running import-finance.py never overwrites what they typed.          */
/* ══ ONE RATE, FIFTEEN MONTHS ═════════════════════════════════════════════════
   A rate for a single month is the least useful shape a rate can take. Nobody
   asks "what is occupancy" — they ask "which way is it going", and answering
   that needed the whole series, which only existed as one blended revenue line
   on the card above. Tapping a rate opens it.

   Drawn as a column per month on the same axis the rest of the tab uses, with
   the selected month lit and the rest at rest. The scale runs from zero for a
   rupee rate — a bar chart that starts at its own minimum exaggerates every
   wobble into a story — and from zero to a hundred for a percentage, because
   that is the range the quantity actually has. */
const RATES = {
  occ:    {name:"Occupied",         unit:"%",  sub:"nights sold of nights available",
           get:t => t.occ * 100,    fmt:v => Math.round(v) + "%",  max:100},
  adr:    {name:"Average room rate", unit:"₹", sub:"what a sold night earns",
           get:t => t.adr,          fmt:v => money(v),             max:null},
  revpar: {name:"Per available night", unit:"₹", sub:"revenue ÷ every night you had to sell",
           get:t => t.revpar,       fmt:v => money(v),             max:null},
};
function openRate(key, monthKey){
  const R = RATES[key];
  const monName = k => MON[+k.split("-")[1]-1] + " " + k.split("-")[0];
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">${esc(R.name)}</div><div class="m">${esc(R.sub)}</div>`;
  const x = el("button", null, "✕"); x.setAttribute("aria-label","Close");
  x.onclick = closeSheet;
  sheetH.append(t, x);

  const series = FIN.map(r=>{
    const f = finRows(r[0]);
    return {key:r[0], v: f.totals ? R.get(f.totals) : null, t: f.totals};
  }).filter(p=> p.v != null);
  const top = R.max || Math.max(...series.map(p=>p.v)) * 1.08;

  const box = el("div"); box.style.cssText = "padding:16px 20px 0";
  const cur = series.find(p=>p.key === monthKey) || series[series.length-1];
  const head = el("div","headline");
  head.append(el("b",null,R.fmt(cur.v)));
  head.append(el("s",null, monName(cur.key)));
  box.appendChild(head);

  const rail = el("div","raterail");
  rail.setAttribute("role","img");
  rail.setAttribute("aria-label", `${R.name} by month, ${series.length} months`);
  const readout = el("div","ratesay");
  const paint = k =>{
    const p = series.find(z=>z.key===k) || cur;
    head.querySelector("b").textContent = R.fmt(p.v);
    head.querySelector("s").textContent = monName(p.key);
    /* against the same month a year earlier, where there IS one */
    const [yy,mm] = p.key.split("-").map(Number);
    const prevY = series.find(z=> z.key === `${yy-1}-${String(mm).padStart(2,"0")}`);
    const prevM = series[series.indexOf(p) - 1];
    const say = [];
    if(prevM) say.push(`${R.fmt(prevM.v)} the month before`);
    if(prevY) say.push(`<b>${R.fmt(prevY.v)}</b> the same month last year`);
    readout.innerHTML = say.length ? say.join(" · ") : "no earlier month to compare with";
    [...rail.children].forEach(c=> c.classList.toggle("on", c.dataset.k === p.key));
  };
  series.forEach(p=>{
    const cell = el("button","rcol" + (p.key === cur.key ? " on" : ""));
    cell.dataset.k = p.key;
    const col = el("i"); col.style.height = Math.max(3, p.v / top * 118) + "px";
    cell.append(col, el("s", null, MON[+p.key.split("-")[1]-1][0]));
    cell.setAttribute("aria-label", `${monName(p.key)}, ${R.fmt(p.v)}`);
    cell.onclick = ()=>{ haptic(6); paint(p.key); };
    rail.appendChild(cell);
  });
  box.append(rail, readout);

  /* the same series, per building, because a portfolio average hides which one
     moved — the whole argument of the card this was opened from */
  const per = el("div"); per.style.cssText = "margin-top:18px";
  per.appendChild(el("div","lbl","BY BUILDING · " + monName(cur.key).toUpperCase()));
  const rows = finRows(cur.key).rows.filter(r=> r.state !== "absent")
    .sort((a,b2)=> R.get(b2) - R.get(a));
  const hi = Math.max(...rows.map(R.get), 1);
  rows.forEach(r=>{
    const ln = el("div","cs-r");
    const bar = el("i"); bar.style.width = (R.get(r) / hi * 100).toFixed(1) + "%";
    ln.append(el("b",null,r.name), bar, el("s",null,R.fmt(R.get(r))));
    per.appendChild(ln);
  });
  box.appendChild(per);

  const note = el("p");
  note.style.cssText = "margin:16px 0 22px;font-size:11.5px;line-height:1.55;color:var(--txt-3)";
  note.innerHTML = key === "revpar"
    ? `Revenue ÷ every night you had to sell, empty ones included — so a full house at a poor rate and a `
      + `half-empty one at a good rate both show up honestly. It can still be dragged down by a building `
      + `whose revenue line does not cover all its nights` + (()=>{
          const fl = finRows(monthKey).rows.filter(r=> r.state === "floor");
          return fl.length
            ? `: ${fl.map(r=>`${esc(r.name)} bills ${r.billed} of the ${r.book} it sold`).join(", ")}, so `
              + `${fl.length>1?"those figures are floors":"that figure is a floor"}, not ${fl.length>1?"rates":"a rate"}.`
            : `. Every building here bills the nights it sold.`;
        })()
    : key === "adr"
    ? `What a night earns <b>when it sells</b>. On its own it says nothing about how many sold — `
      + `that is Occupied, and the two multiply into per available night.`
    : `Nights sold ÷ nights you had, across the ${
          finRows(monthKey).rows.filter(r=>r.state!=="absent").length
        } buildings your monthly sheets price. `
      + `Lotus Pond is not in it — it has no revenue line, so it has no rate either, and averaging it in `
      + `at zero would be worse than leaving it out.`;
  box.appendChild(note);
  sheetB.appendChild(box);
  paint(cur.key);
  sheet.classList.add("on"); scrim.classList.add("on");
}

/* Which building's costs. A list, not a dropdown: five rows the operator reads
   by name, each already saying what it costs today so the one that is wrong is
   the one that looks wrong. */
/* ── LOG AN EXPENSE ──────────────────────────────────────────────────────────
   Four fields and a Save, because this is the thing an operator does standing
   in a corridor holding a receipt. The date defaults to today and the building
   to the one they came from, so the common case is: amount, tap Save.        */
function openExpense(code, monthKey, after){
  sheetWipe();
  const B = buildingsOf();
  if(!code && B.length) code = B[0].code;
  const t = el("div");
  t.innerHTML = `<div class="n">Log an expense</div>`
              + `<div class="m">a one-off, on the day it happened</div>`;
  const x = el("button", null, "✕");
  x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
  sheetH.append(t, x);

  const why = el("p");
  why.style.cssText = "margin:14px 20px 2px;font-size:12.5px;line-height:1.55;color:var(--txt-2)";
  why.innerHTML = `This lands in the month you date it and nowhere else. Your standing figures stay `
    + `as they are — a line you log for a month is charged at what you logged, and one you do not is `
    + `charged at the standing figure.`;
  sheetB.appendChild(why);

  const form = el("div","bkform");
  const mk = (label, node)=>{
    const row = el("label");
    row.style.cssText = "display:flex;align-items:center;gap:10px";
    const nm = el("span", null, label);
    nm.style.cssText = "flex:1 1 auto;font-size:12.5px;color:var(--txt-2)";
    row.append(nm, node); form.appendChild(row); return node;
  };
  const bSel = el("select");
  bSel.style.cssText = "flex:0 0 170px";
  bSel.setAttribute("aria-label","Which building this expense is for");
  B.forEach(b=>{ const o = el("option", null, b.name); o.value = b.code;
    if(b.code === code) o.selected = true; bSel.appendChild(o); });
  mk("Building", bSel);

  const lSel = el("select");
  lSel.style.cssText = "flex:0 0 170px";
  lSel.setAttribute("aria-label","Which cost line this belongs to");
  const fillLines = ()=>{
    const keep = lSel.value;
    lSel.textContent = "";
    costLines(bSel.value).forEach(k=>{ const o = el("option", null, k); o.value = k;
      if(k === keep) o.selected = true; lSel.appendChild(o); });
    if(!keep) lSel.value = "Maintenance";
  };
  fillLines();
  bSel.onchange = fillLines;
  mk("Cost line", lSel);

  const amt = el("input");
  amt.type = "tel"; amt.inputMode = "numeric"; amt.placeholder = "₹";
  amt.setAttribute("aria-label","What it cost");
  amt.style.cssText = "flex:0 0 170px;text-align:right";
  mk("Amount", amt);

  const when = el("input");
  when.type = "date";
  when.setAttribute("aria-label","The day it was paid");
  when.style.cssText = "flex:0 0 170px";
  /* Today, unless the operator is looking at another month — in which case the
     month on screen is the one they mean, and its last day is the safest guess
     for a bill they are entering after the fact. */
  const today = dayISO(0);
  when.value = (monthKey && monthKey !== today.slice(0,7))
    ? monthKey + "-" + String(new Date(+monthKey.slice(0,4), +monthKey.slice(5,7), 0).getDate()).padStart(2,"0")
    : today;
  mk("Paid on", when);
  /* The two answers that cover almost every receipt, as buttons, with the
     picker left for the rest. Offered only when the month on screen contains
     them — on a past month "Today" would silently file the expense outside the
     month the operator is looking at, which is the one mistake this control
     could make. */
  const chips = el("div","daychips");
  chips.style.justifyContent = "flex-end";
  const opts = [["Today", dayISO(0)], ["Yesterday", dayISO(-1)]]
    .filter(([,d])=> !monthKey || monthOf(d) === monthKey);
  opts.forEach(([lab, d])=>{
    const c = el("button", null, lab);
    c.type = "button";
    c.onclick = ()=>{ haptic(9); when.value = d; syncChips(); paint(); };
    chips.appendChild(c);
  });
  function syncChips(){
    [...chips.children].forEach((c,i)=> c.setAttribute("aria-pressed", when.value === opts[i][1]));
  }
  if(opts.length){ form.appendChild(chips); when.addEventListener("input", syncChips); }

  const note = el("input");
  /* The label already says Note; a placeholder repeating it in more words only
     had room to show two thirds of itself. */
  note.type = "text"; note.placeholder = "Optional";
  note.setAttribute("aria-label","What the expense was for");
  note.style.cssText = "flex:0 0 170px";
  mk("Note", note);

  const live = el("div");
  live.style.cssText = "margin:8px 0 2px;font-size:12px;line-height:1.5;color:var(--txt-3)";
  const paint = ()=>{
    const v = Math.round(+amt.value || 0), mk2 = monthOf(when.value);
    if(!v || !mk2){ live.textContent = "Nothing entered yet."; return; }
    const b = B.find(z=> z.code === bSel.value);
    const std = costFor(bSel.value)[lSel.value];
    live.innerHTML = `<b>${money(v)}</b> against ${esc(b ? b.name : bSel.value)} in `
      + `${MON[+mk2.slice(5,7)-1]} ${mk2.slice(0,4)}`
      + (std ? ` — replacing the standing ${esc(lSel.value)} of ${money(std)} for that month alone.` : ".");
  };
  [amt, when].forEach(n=> n.addEventListener("input", paint));
  [bSel, lSel].forEach(n=> n.addEventListener("change", paint));
  if(opts.length) syncChips();
  paint();
  form.appendChild(live);

  const go = el("button","bkgo","Save");
  go.onclick = ()=>{
    const v = Math.round(+amt.value || 0);
    if(!(v > 0) || !when.value) return;
    expenses.push({id: "e" + Date.now() + Math.round(Math.random()*1e4),
                   code: bSel.value, line: lSel.value, amount: v,
                   on: when.value, note: note.value.trim() || undefined});
    expSave();
    track("expense_logged", {code: bSel.value, line: lSel.value, month: monthOf(when.value)});
    logAct("expense", `Logged ${money(v)} · ${lSel.value} · `
      + `${(B.find(z=>z.code===bSel.value)||{}).name || bSel.value} · paid ${when.value}`);
    haptic(18); closeSheet(); refreshScreen();
    const b = B.find(z=> z.code === bSel.value);
    toast("", `<b>${money(v)} logged.</b> ${esc(b ? b.name : bSel.value)} · ${esc(lSel.value)} · `
      + `${esc(when.value)}`, null);
    if(after) after();
  };
  form.appendChild(go);
  sheetB.appendChild(form);
  sheet.classList.add("on"); scrim.classList.add("on");
}

/* ── THE MONTH'S LEDGER ──────────────────────────────────────────────────────
   Everything dated into this month, typed or read out of the book, with the
   repairs marked so the operator can see the app is counting what they already
   logged against a flat rather than waiting to be told twice. */
function openLedger(monthKey){
  sheetWipe();
  const rows = ledgerFor(monthKey);
  const B = buildingsOf();
  const name = c => (B.find(b=> b.code === c) || {}).name || c;
  const monName = k => MON[+k.split("-")[1]-1] + " " + k.split("-")[0];
  const t = el("div");
  t.innerHTML = `<div class="n">Expenses · ${esc(monName(monthKey))}</div>`
              + `<div class="m">${rows.length} entr${rows.length===1?"y":"ies"} · `
              + `${money(rows.reduce((a,r)=> a + r.amount, 0))}</div>`;
  const x = el("button", null, "✕");
  x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
  sheetH.append(t, x);

  const add = el("button","bkgo","Log an expense");
  add.style.cssText = "margin:14px 20px 4px;width:calc(100% - 40px)";
  add.onclick = ()=>{ haptic(10); openExpense(null, monthKey, ()=> openLedger(monthKey)); };
  sheetB.appendChild(add);

  if(!rows.length){
    const e = el("div","empty",
      `Nothing logged for ${monName(monthKey)}. A repair you close against a flat with a bill on it `
      + `appears here on its own.`);
    e.style.cssText = "margin:10px 20px";
    sheetB.appendChild(e);
  }
  const list = el("div","card");
  list.style.cssText = "margin:12px 20px 20px";
  rows.forEach(r=>{
    const row = el("div","row bk");
    const m = el("div","meta");
    m.innerHTML = `<b>${esc(r.line)}</b> · ${esc(name(r.code))}`
      + `<em>${esc(r.on)}${r.note ? " · " + esc(r.note) : ""}${
          r.kind === "repair" ? " · from the book" : ""}</em>`;
    const e2 = el("div","rowend");
    e2.append(el("span","paid clear", money(r.amount)));
    /* Only what was typed here can be deleted here. A repair invoice belongs to
       the issue that carries it — removing it from this list would leave the
       flat's own record saying it was paid, and the two would disagree. */
    if(r.kind === "typed"){
      const del = el("button","rowx", "✕");
      del.setAttribute("aria-label", `Remove this ${r.line} expense of ${money(r.amount)}`);
      del.onclick = ()=>{
        const i = expenses.findIndex(z=> z.id === r.id);
        if(i < 0) return;
        expenses.splice(i, 1); expSave(); haptic(14);
        refreshScreen(); openLedger(monthKey);
      };
      e2.append(del);
    }
    row.append(m, e2);
    list.appendChild(row);
  });
  if(rows.length) sheetB.appendChild(list);
  sheet.classList.add("on"); scrim.classList.add("on");
}

function openCosts(r){
  const monName = k => MON[+k.split("-")[1]-1] + " " + k.split("-")[0];
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">${esc(r.name)}</div>`
              + `<div class="m">${r.flats} flats · what it costs to run for a month</div>`;
  const x = el("button", null, "✕");
  x.setAttribute("aria-label","Close");
  x.onclick = closeSheet;
  sheetH.append(t, x);

  const why = el("p");
  why.style.cssText = "margin:14px 20px 2px;font-size:12.5px;line-height:1.55;color:var(--txt-2)";
  why.innerHTML = r.state === "absent"
    ? `Your workbook prices four buildings. <b>${esc(r.name)}</b> is not one of them, so the app cannot say `
      + `what it keeps — and will not guess. It sold <b>${r.book} nights</b> in ${MON[+finMonth.split("-")[1]-1]}. `
      + `Fill in what it costs and it joins the ranking.`
    : `These are the figures from your Costing sheet. Change one and every number on the Profit tab follows. `
      + `<b>Fixed</b> is contracted and known before the month starts — rent, salaries. <b>Varies</b> is a real `
      + `bill with a different figure each month. <b>One-off</b> happens when it happens, so its monthly figure `
      + `is only an average until you log a real one.`;
  sheetB.appendChild(why);

  const form = el("div","bkform");
  const inputs = {};
  const live = el("div");
  live.style.cssText = "margin:4px 0 2px;font-size:12px;line-height:1.5;color:var(--txt-3)";
  const cur = costFor(r.code);

  /* A building the workbook does not price needs BOTH sides, not just costs.
     Its nights are already counted off the Availability tab; what nobody has
     written down anywhere is what those nights earned. Asking for the one
     unknown — and only for the month on screen — is what lets the row join the
     ranking instead of sitting under a rule forever. */
  let revIn = null;
  if(r.state === "absent"){
    const box = el("label");
    box.style.cssText = "display:flex;align-items:center;gap:10px;padding-bottom:4px;"
      + "margin-bottom:6px;border-bottom:1px solid var(--line)";
    const nm = el("span", null, `Took in over ${monName(finMonth)}`);
    nm.style.cssText = "flex:1 1 auto;font-size:12.5px;color:var(--txt)";
    revIn = el("input");
    revIn.type = "tel"; revIn.inputMode = "numeric"; revIn.placeholder = "₹";
    revIn.setAttribute("aria-label", `What ${r.name} took in over ${monName(finMonth)}`);
    revIn.style.cssText = "flex:0 0 118px;text-align:right;padding:9px 11px";
    const had = (finUser[finMonth] || {})[r.code];
    if(had) revIn.value = had;
    box.append(nm, revIn);
    form.appendChild(box);
  }

  const paint = ()=>{
    const tot = Object.values(inputs).reduce((a,i)=> a + (+i.value || 0), 0);
    const rev = revIn ? (+revIn.value || 0) : (r.revenue || 0);
    if(!tot && !rev){ live.textContent = "Nothing entered yet."; return; }
    const bits = [];
    if(tot) bits.push(`<b>${money(tot)}</b> a month · ${money(tot / r.flats)} per flat`);
    /* Break-even in the currency the operator can act on. With no rate to work
       from, the useful number is the rate itself: what a night has to average
       across the nights already sold before the building covers itself. */
    if(tot && r.book) bits.push(`needs <b>${money(tot / r.book)}</b> a night across its ${r.book} nights to cover itself`);
    if(tot && rev) bits.push(`<b>${rev - tot >= 0 ? "+" : "−"}${money(Math.abs(rev - tot))}</b> kept, `
      + `${Math.round((rev - tot) / rev * 100)}% margin`);
    /* What the kinds add up to, live, so the operator can see the consequence
       of calling a line fixed rather than variable while they are doing it. */
    const fx = Object.keys(inputs).reduce((a,k)=>
      a + ((kinds[k] && kinds[k].value) === "fixed" ? (+inputs[k].value || 0) : 0), 0);
    if(tot) bits.push(`<b>${money(fx)}</b> of it fixed and known before the month starts`);
    live.innerHTML = bits.join("<br>");
  };
  if(revIn) revIn.addEventListener("input", paint);
  /* THE KIND IS PART OF THE FIGURE. The defaults are a reading of a serviced-
     apartment business, not of THIS one — an operator whose power is on a fixed
     commercial tariff, or who pays a maintenance retainer, has a different
     answer, and a classification they cannot correct is worse than none. It
     sits beside the amount because it changes what the amount MEANS. */
  const kinds = {};
  const KINDS = [["fixed","Fixed"],["varies","Varies"],["one-off","One-off"]];
  costLines(r.code).forEach(k=>{
    const row = el("label");
    row.style.cssText = "display:flex;align-items:center;gap:8px";
    const nm = el("span", null, k);
    nm.style.cssText = "flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--txt-2);"
      + "white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    const kSel = el("select");
    kSel.style.cssText = "flex:0 0 96px;padding:9px 24px 9px 9px;font-size:12px";
    kSel.setAttribute("aria-label", `What kind of cost ${k} is for ${r.name}`);
    KINDS.forEach(([v,lab])=>{ const o = el("option", null, lab); o.value = v;
      if(v === kindOf(r.code, k)) o.selected = true; kSel.appendChild(o); });
    kinds[k] = kSel;
    const inp = el("input");
    inp.type = "tel"; inp.inputMode = "numeric"; inp.placeholder = "₹";
    inp.setAttribute("aria-label", k + " for " + r.name);
    inp.style.cssText = "flex:0 0 104px;text-align:right;padding:9px 11px";
    if(cur[k] != null) inp.value = cur[k];
    inp.addEventListener("input", paint);
    kSel.addEventListener("change", paint);
    inputs[k] = inp;
    row.append(nm, kSel, inp);
    form.appendChild(row);
  });
  /* ADD A LINE. Their sheet has eleven; a building has more than eleven costs,
     and the first bill that does not fit one of the eleven is the moment a
     fixed list stops being a model and starts being a lie. */
  const addRow = el("div");
  addRow.style.cssText = "display:flex;gap:8px;margin-top:10px;padding-top:11px;border-top:1px solid var(--line)";
  const nm2 = el("input"); nm2.type = "text"; nm2.placeholder = "Another cost — internet, tax…";
  nm2.setAttribute("aria-label","Name of a cost line to add");
  nm2.style.cssText = "flex:1 1 auto;padding:9px 11px;font-size:12.5px";
  const amt2 = el("input"); amt2.type = "tel"; amt2.inputMode = "numeric"; amt2.placeholder = "₹";
  amt2.setAttribute("aria-label","Amount for the new cost line");
  amt2.style.cssText = "flex:0 0 92px;text-align:right;padding:9px 11px";
  const addBtn = el("button","invAdd","Add");
  addBtn.onclick = ()=>{
    const k = nm2.value.trim(), v = Math.round(+amt2.value || 0);
    if(!k || v <= 0) return;
    if(inputs[k]){ inputs[k].value = v; nm2.value = amt2.value = ""; paint(); haptic(10); return; }
    costUser[r.code] = Object.assign({}, costUser[r.code], {[k]: v});
    jset(COST_STORE, costUser); finBust();
    haptic(14); openCosts(r);                       // redrawn with the new line in place
  };
  addRow.append(nm2, amt2, addBtn);
  form.appendChild(addRow);
  form.appendChild(live);
  const go = el("button","bkgo","Save");
  go.onclick = ()=>{
    const next = {};
    /* A line left blank or zeroed is REMOVED, not stored as zero — a building
       with no laundry bill should show ten lines, not eleven with a nought. */
    Object.keys(inputs).forEach(k=>{ const v = +inputs[k].value; if(v > 0) next[k] = Math.round(v); });
    if(!Object.keys(next).length) delete costUser[r.code]; else costUser[r.code] = next;
    jset(COST_STORE, costUser);
    logAct("costs", `Changed what ${r.name} costs · ${money(costTotal(r.code) || 0)} a month`);
    /* Only what DIFFERS from the default is stored, so improving the defaults
       later still reaches every operator who never disagreed with them. */
    const kn = {};
    Object.keys(kinds).forEach(k=>{
      const v = kinds[k].value;
      if(next[k] != null && v !== (COST_KIND[k] || "varies")) kn[k] = v;
    });
    if(!Object.keys(kn).length) delete costKind[r.code]; else costKind[r.code] = kn;
    jset(KIND_STORE, costKind);
    finBust();
    if(revIn){
      const v = Math.round(+revIn.value || 0);
      const m = finUser[finMonth] = finUser[finMonth] || {};
      if(v > 0) m[r.code] = v; else delete m[r.code];
      if(!Object.keys(m).length) delete finUser[finMonth];
      jset(FINU_STORE, finUser);
      finBust();
    }
    haptic(18); closeSheet(); refreshScreen();
    const done = costTotal(r.code) && (!revIn || +revIn.value > 0);
    toast("", done
      ? `<b>${esc(r.name)} is in the ranking.</b> ${money(costTotal(r.code))} a month against `
        + `what it took in over ${esc(monName(finMonth))}.`
      : `<b>${esc(r.name)} saved.</b> ` + (revIn && !(+revIn.value > 0)
          ? `It still needs what it took in over ${esc(monName(finMonth))} before it can be ranked.`
          : `It still needs a cost line before it can be ranked.`), null);
  };
  form.appendChild(go);
  sheetB.appendChild(form);
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
}

function openBooking(fi, from, nights){
  const fl = flats[fi];
  roomHead(fi, ()=> openSheet(fi, from));

  let day = Math.max(0, Math.min(from|0, DAYS-1));
  let n   = Math.max(1, nights|0 || 1);
  const capFrom = d => { let k = 0; while(k < 60 && d + k < DAYS && !occ[fi][d + k]) k++; return k; };
  /* capFrom stops for two completely different reasons and used to report both
     as the same number: it ran into a booking, or it ran out of book. The state
     line assumed the first, so arriving 16 Oct for 3 nights read "Leaves 19 Oct
     · the night after is taken" when TT-101 has nothing at or after day 59 and
     day 63 is outside the horizon entirely — a refusal explained by a guest who
     cannot exist. The rest of the file already makes this distinction: roomTile
     prints "Free 4+n" when a run reaches the edge. */
  const atEdge = d => d + capFrom(d) >= DAYS;

  const form = el("div","bkform");

  /* when */
  const whenCap = el("div","bkcap");
  whenCap.append(el("span",null,"Arriving"), el("span",null,"Nights"));
  const whenRow = el("div","bkrow");
  const dayBox = el("div","stepWide");
  const dLess = el("button",null,"−"), dMore = el("button",null,"+"), dLab = el("b");
  dLess.setAttribute("aria-label","A day earlier"); dMore.setAttribute("aria-label","A day later");
  dayBox.append(dLess, dLab, dMore);
  const nBox = el("div","step");
  const nLess = el("button",null,"−"), nMore = el("button",null,"+"), nLab = el("b");
  nLess.setAttribute("aria-label","Fewer nights"); nMore.setAttribute("aria-label","More nights");
  nBox.append(nLess, nLab, nMore);
  whenRow.append(dayBox, nBox);

  const state = el("div","bkstate");

  const phone = el("input");
  phone.type = "tel"; phone.inputMode = "numeric"; phone.autocomplete = "tel";
  /* The form has never required a number — go.disabled follows availability
     alone — and Crescent Stays' own book carries none at all, so on day one
     every stay they enter goes in without one. The label says so in the
     accessible name rather than in the placeholder, which has one line to name
     the field and should spend it on the field's name. */
  phone.placeholder = "Phone Number";
  phone.setAttribute("aria-label", `Guest phone number for ${fl.id} — optional`);
  phoneField(phone);
  const who = el("input");
  who.type = "text"; who.placeholder = "Guest name"; who.autocomplete = "off";
  who.setAttribute("aria-label", `Guest name for ${fl.id}`);
  const back = el("div","bkback"); back.style.display = "none";

  const capRow = el("div","bkcap");
  capRow.append(el("span",null,"Total for the stay"), el("span",null,"Guests"));
  const row = el("div","bkrow");
  const amtWrap = el("div","bkamt");
  amtWrap.appendChild(el("s", null, "₹"));
  const amt = el("input");
  amt.type = "text"; amt.inputMode = "numeric"; amt.placeholder = "Total";
  amt.setAttribute("aria-label","Total agreed for the stay");
  amtWrap.appendChild(amt);
  let pax = 2, touchedAmt = false;
  amt.addEventListener("input", ()=>{ touchedAmt = true; });
  const step = el("div","step");
  const pLess = el("button",null,"−"), pMore = el("button",null,"+"), paxN = el("b","","2");
  pLess.setAttribute("aria-label","Fewer guests"); pMore.setAttribute("aria-label","More guests");
  const setPax = v => { pax = Math.max(1, Math.min(12, v)); paxN.textContent = pax;
    pLess.disabled = pax <= 1; pMore.disabled = pax >= 12; haptic(5); };
  pLess.onclick = ()=> setPax(pax-1); pMore.onclick = ()=> setPax(pax+1);
  step.append(pLess, paxN, pMore); setPax(2);
  row.append(amtWrap, step);

  let src = "Direct";
  const srcRow = el("div","srcRow");
  SRC.forEach(s=>{
    const c = el("button", null, s);
    c.setAttribute("aria-pressed", s === src);
    c.onclick = ()=>{ src = s; haptic(8);
      [...srcRow.children].forEach(o=>o.setAttribute("aria-pressed", o.textContent === src)); };
    srcRow.appendChild(c);
  });

  const go = el("button","bkgo","");

  function paint(){
    const cap = capFrom(day);
    /* At the edge of the book a stay may run past it — addBooking validates only
       the span the book can hold, and recompute() has always clamped. Refusing
       here was refusing to RECORD a long, high-value booking that exists. */
    const edge = atEdge(day);
    const maxN = edge ? 60 : cap;
    n = Math.max(1, Math.min(n, Math.max(1, maxN)));
    dLab.textContent = day === 0 ? "Tonight" : fmtL(day);
    nLab.textContent = n;                       // the caption above says NIGHTS
    dLess.disabled = day <= 0; dMore.disabled = day >= DAYS-1;
    nLess.disabled = n <= 1;   nMore.disabled = n >= maxN;
    const ok = cap > 0 && freeSpan(fi, day, day + n);
    state.classList.toggle("bad", !ok);
    if(ok){
      state.textContent = `Leaves ${fmt(day + n)}`
        + (cap > n ? ` · free for ${cap} night${cap>1?"s":""} from here`
           : edge  ? " · free to the end of this book"
           :         " · the night after is taken");
    }else{
      const busy = resv.find(r => r.fi === fi && r.start <= day && r.end > day);
      state.textContent = busy
        ? `${isBlock(busy) ? (busy.reason || "Out of service") : busy.guest} holds ${fmtL(day)}`
        : `${fl.id} is not free on ${fmtL(day)}`;
    }
    if(!touchedAmt) amt.value = (fl.rate || 0) * n ? String((fl.rate || 0) * n) : "";
    go.textContent = ok ? `Book ${n} night${n>1?"s":""}` : "Not available";
    go.disabled = !ok;
  }
  dLess.onclick = ()=>{ day = Math.max(0, day-1); haptic(5); paint(); };
  dMore.onclick = ()=>{ day = Math.min(DAYS-1, day+1); haptic(5); paint(); };
  nLess.onclick = ()=>{ n = Math.max(1, n-1); haptic(5); paint(); };
  nMore.onclick = ()=>{ n = n+1; haptic(5); paint(); };

  phone.addEventListener("input", ()=>{
    const seen = guestByPhone(phone.value);
    if(!seen){ back.style.display = "none"; return; }
    if(!who.value.trim()) who.value = seen.name;
    if(PLATFORMS.indexOf(src) < 0){
      src = "Repeat guest";
      [...srcRow.children].forEach(o=>o.setAttribute("aria-pressed", o.textContent === src));
    }
    back.style.display = "";
    back.textContent = seen.stays === 1
      ? `${seen.name} has stayed once before · last ${fmt(seen.last)}`
      : `${seen.name} has stayed ${seen.stays} times · last ${fmt(seen.last)}`;
  });

  const take = ()=>{
    if(go.disabled) return;
    if(addBooking(fi, day, n, who.value.trim(), src,
                  {phone: phone.value, pax, amount: amt.value}   /* same: keep the decimal */)){
      haptic(18); closeSheet(); refreshScreen();
    }else{
      haptic(30); go.textContent = "Just taken";
      setTimeout(()=>{ openSheet(fi, day); refreshScreen(); }, 900);
    }
  };
  go.onclick = take;
  who.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); who.blur(); take(); }});

  form.append(whenCap, whenRow, state, phone, who, back, capRow, row, srcRow, go);
  sheetB.append(form);
  /* AFTER the row is in the document, because the question is how wide it came
     out. Seven channels do not fit a phone — measured at 375px, the row scrolls
     and "MakeMyTrip" was cut mid-word with nothing to say the rest existed,
     which reads as a rendering fault rather than as more content. Asked before
     the append, every width is 0 and the answer is a confident "it all fits";
     asked in a rAF, it is never answered at all in a backgrounded tab. */
  edges(srcRow, "x");
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
  setTimeout(()=> phone.focus(), 120);
}

/* ── out of service, on its own screen ────────────────────────────────────── */

/* ── a glyph for each thing that breaks ───────────────────────────────────────
   Monoline, 24-box, one weight, no fills — the same drawing rules as the tab
   icons, so the grid reads as part of this app rather than a sticker sheet. */
const FAULT_ICON = {

  "Pest control":'<circle cx="12" cy="13" r="5"/><path d="M12 8V6M9 5l1.5 2M15 5l-1.5 2M7 11l-3-1M7 16l-3 2M17 11l3-1M17 16l3 2"/>',
  "Chimney":'<path d="M3 14.5l9-6 9 6"/><path d="M5.5 13v7.5h13V13"/><path d="M9.5 20.5v-4h5v4"/><path d="M9 5.5c0-1.2 1.2-1.6 1.2-2.8M14 5.5c0-1.2 1.2-1.6 1.2-2.8"/>',
