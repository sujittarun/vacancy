  if(stamp !== finCacheKey){ finCache = {}; finCacheKey = stamp; }
  if(finCache[monthKey]) return finCache[monthKey];
  return (finCache[monthKey] = finRowsCalc(monthKey));
}
/* ── THE APP'S OWN BOOK AS A MONTH ───────────────────────────────────────────
   The workbook was how this app learned the past; it is not how it learns from
   here. Its newest sheet is Jul 2026 and there is no Aug26 — so the Profit tab
   stopped at July while the operator's own August sat in the app, 923 nights
   sold across 243 bookings, unread.

   What the book can answer EXACTLY is nights: a stay either covered a night or
   it did not, and that is a census, not a sample. What it answers badly is
   money, because most rows carry no amount — 45 of those 243. So this returns
   both, and marks how much of the month's sold time has a figure against it.
   The card decides what it is allowed to say; this only measures.            */
function appMonth(monthKey){
  const [y, mo] = monthKey.split("-").map(Number);
  const d0 = Math.round((new Date(y, mo-1, 1) - dateAt(0)) / 86400000);
  const d1 = Math.round((new Date(y, mo, 0)   - dateAt(0)) / 86400000) + 1;
  const per = {};
  bookings().forEach(r=>{
    const a = Math.max(r.start, d0), b = Math.min(r.end, d1);
    if(b <= a) return;
    const n = b - a, code = flats[r.fi] && flats[r.fi].code;
    if(!code) return;
    const g = per[code] = per[code] || {nights:0, revenue:0, priced:0, rows:0, pricedNights:0};
    g.nights += n; g.rows++;
    /* Apportioned per night, never whole: a stay running 28 Aug – 4 Sep does
       not earn all of its money in August, and booking the total into the
       arrival month is how one card came to disagree with another about the
       same stay. */
    if(r.amount && r.nights){
      g.revenue += r.amount * (n / r.nights); g.priced++; g.pricedNights += n;
    }
  });
  return per;
}
/* Every month the app's book touches that the workbook has no sheet for, up to
   and including the one running now. Nothing beyond it: a future month has
   a full month's cost and a handful of nights, and the difference is not a
   loss, it is a calendar. */
function appMonths(){
  const have = new Set(FIN.map(r => r[0]));
  const key = d => { const t = dateAt(d);
    return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0"); };
  const now = key(0), out = [];
  const seen = new Set();
  bookings().forEach(r=>{
    for(let d = Math.max(r.start, -400); d < Math.min(r.end, DAYS); d++){
      const k = key(d);
      if(seen.has(k) || have.has(k) || k > now) continue;
      seen.add(k); out.push(k);
    }
  });
  return out.sort();
}

function finRowsCalc(monthKey){
  const row = FIN.find(r => r[0] === monthKey);
  const [y, mo] = monthKey.split("-").map(Number);
  const days = new Date(y, mo, 0).getDate();
  const drop = (FIN_DROP.find(d => d[0] === monthKey) || [])[1];
  const B = buildingsOf();
  const out = {month: monthKey, days, drop, rows: [],
               coverage: {complete: 0, floor: 0, absent: 0}};
  if(!row){
    const per = appMonth(monthKey);
    if(!Object.keys(per).length) return Object.assign(out, {totals: null});
    out.source = "app";
    ["TT","MP","TN","BH","LP"].forEach(code=>{
      const flatN = flats.filter(f => f.code === code).length;
      if(!flatN) return;
      const g = per[code] || {nights:0, revenue:0, priced:0, rows:0, pricedNights:0};
      const b = B.find(x => x.code === code), cap = flatN * days;
      const cost = costTotal(code, monthKey);
      const r = {code, name: b ? b.name : code, short: b ? b.short : code,
                 flats: flatN, cap, book: g.nights, bookOcc: cap ? g.nights/cap : 0,
                 billed: g.nights, revenue: Math.round(g.revenue), cost,
                 rows: g.rows, priced: g.priced, pricedNights: g.pricedNights,
                 /* the share of SOLD TIME that carries a figure — the only
                    coverage number that means anything about revenue */
                 cover: g.nights ? g.pricedNights / g.nights : 0,
                 state: cost == null ? "absent" : "app"};
      /* A break-even mark is cost ÷ a rate, and this building's rate comes off
         its priced nights alone — Telecom Nagar's came off ONE. Drawn anyway it
         is a confident tick in a plausible place built on nothing. */
      r.canState = r.cover >= 0.8;
      out.coverage[r.state === "absent" ? "absent" : "floor"] += flatN;
      if(r.state !== "absent"){
        r.occ = cap ? g.nights / cap : 0;
        r.adr = g.pricedNights ? g.revenue / g.pricedNights : 0;
        r.revpar = cap ? g.revenue / cap : 0;
        r.net = r.revenue - cost;
        r.margin = r.revenue ? r.net / r.revenue : 0;
        r.beNights = r.adr ? cost / r.adr : Infinity;
        r.be = cap ? r.beNights / cap : Infinity;
        r.head = r.occ - r.be;
        r.unreachable = r.be > 1;
      }
      out.rows.push(r);
    });
    const live = out.rows.filter(r => r.state === "app");
    out.totals = live.length ? {
      revenue: live.reduce((s,r)=> s + r.revenue, 0),
      cost:    live.reduce((s,r)=> s + r.cost, 0),
      nights:  live.reduce((s,r)=> s + r.book, 0),
      cap:     live.reduce((s,r)=> s + r.cap, 0),
      flats:   live.reduce((s,r)=> s + r.flats, 0),
      rows:    live.reduce((s,r)=> s + r.rows, 0),
      priced:  live.reduce((s,r)=> s + r.priced, 0),
      floor:   true, app: true,
    } : null;
    if(out.totals){
      const t = out.totals, pn = live.reduce((s,r)=> s + r.pricedNights, 0);
      t.cover = t.nights ? pn / t.nights : 0;
      t.net = t.revenue - t.cost;
      t.margin = t.revenue ? t.net / t.revenue : 0;
      t.occ = t.cap ? t.nights / t.cap : 0;
      t.adr = pn ? t.revenue / pn : 0;
      t.revpar = t.cap ? t.revenue / t.cap : 0;
      /* WHAT THE MONTH IS ALLOWED TO SAY. Cost is complete the moment a month
         starts; revenue arrives one typed amount at a time. Subtracting one
         from the other at 18% coverage printed -Rs 9,82,170 for August — a
         catastrophic loss that is entirely a data-entry gap, and the single
         most misleading number this app could put on a screen. */
      t.canState = t.cover >= 0.8;
    }
    return out;
  }

  ["TT","MP","TN","BH","LP"].forEach((code, i)=>{
    const cell = row[i + 1];
    if(!cell) return;
    let [billed, revenue, book] = cell;
    /* Supplied by the operator for a building the workbook does not price. The
       nights are the book's own count, so what they are asked for is the one
       thing nobody has written down: what those nights earned. */
    const mine = (finUser[monthKey] || {})[code];
    if(billed == null && mine > 0){ revenue = mine; billed = book; }
    /* flats from the LIVE inventory, never a constant. The operator can add or
       retire a flat in the inventory editor, and a capacity that did not follow
       would quietly move every occupancy and every break-even on this screen. */
    const flatN = flats.filter(f => f.code === code).length;
    if(!flatN) return;
    const b = B.find(x => x.code === code);
    const cap = flatN * days;
    const cost = costTotal(code, monthKey);
    const ratio = billed ? book / billed : null;
    const state = billed == null || cost == null ? "absent"
                : (ratio > 1 + FIN_TOL || ratio < 1 - FIN_TOL) ? "floor"
                : "complete";
    out.coverage[state] += flatN;
    const r = {code, name: b ? b.name : code, short: b ? b.short : code,
               flats: flatN, cap, book, bookOcc: cap ? book / cap : 0,
               billed, revenue, cost, state, ratio};
    if(state !== "absent"){
      r.occ    = cap ? billed / cap : 0;
      r.adr    = billed ? revenue / billed : 0;
      r.revpar = cap ? revenue / cap : 0;
      r.net    = revenue - cost;
      r.margin = revenue ? r.net / revenue : 0;
      r.beNights = r.adr ? cost / r.adr : Infinity;
      r.be     = cap ? r.beNights / cap : Infinity;
      r.head   = r.occ - r.be;
      /* A building that cannot break even however full it gets is a different
         sentence from one that is merely empty, and it must not be drawn as
         one whose costs are unknown — that picture is spoken for. */
      r.unreachable = r.be > 1;
    }
    out.rows.push(r);
  });

  const priced = out.rows.filter(r => r.state !== "absent");
  out.totals = priced.length ? {
    revenue: priced.reduce((s,r)=> s + r.revenue, 0),
    cost:    priced.reduce((s,r)=> s + r.cost, 0),
    nights:  priced.reduce((s,r)=> s + r.billed, 0),
    cap:     priced.reduce((s,r)=> s + r.cap, 0),
    flats:   priced.reduce((s,r)=> s + r.flats, 0),
    floor:   priced.some(r => r.state === "floor"),
  } : null;
  if(out.totals){
    const t = out.totals;
    t.net = t.revenue - t.cost;
    t.margin = t.revenue ? t.net / t.revenue : 0;
    t.occ = t.cap ? t.nights / t.cap : 0;
    t.adr = t.nights ? t.revenue / t.nights : 0;
    t.revpar = t.cap ? t.revenue / t.cap : 0;
  }
  /* Said out loud in the console, the same discipline as owedStats' partition
     check: a revenue line that stops covering its own nights is a bookkeeping
     change, and the app noticing before the operator does is the point. */
  out.rows.filter(r => r.state === "floor").forEach(r =>{
    const k = monthKey + r.code;
    if(finWarned[k]) return;
    finWarned[k] = 1;
    console.warn("finRows: revenue line short of the book",
      {month: monthKey, code: r.code, billed: r.billed, book: r.book, ratio: +r.ratio.toFixed(2)});
  });
  return out;
}

function owedStats(){
  const bk = bookings().filter(r => r.amount && dueFrom(r) > 0);
  const gone  = bk.filter(r => r.end <= 0);
  /* IN THE FLAT NOW — its own state, and the one the card was missing.
     Everybody who had arrived but not left fell into "later · not collectable
     yet", and on the real book that was 98.5% of the money: four guests
     standing in four flats, two of them checking out inside 48 hours with
     ₹72,200 between them, filed under the heading that means "no hurry". The
     summary then said the balance was "with guests still to arrive", which was
     true of ₹5,000 of ₹3,22,950.

     A guest in the room is the EASIEST money in the book to collect and the
     window closes when they hand the keys back. It is not "later". */
  const here  = bk.filter(r => r.end > 0 && r.start <= 0);
  const soon  = bk.filter(r => r.end > 0 && r.start > 0 && r.start <= 7);
  const later = bk.filter(r => r.end > 0 && r.start > 7);
  const sum = a => a.reduce((s,r)=> s + dueFrom(r), 0);
  const out = {total: sum(bk), count: bk.length,
          here: sum(here), hereN: here.length,
          /* of those, the ones whose door closes within two days */
          going: sum(here.filter(r => r.end <= 2)), goingN: here.filter(r => r.end <= 2).length,
          soon: sum(soon), soonN: soon.length,
          gone: sum(gone), goneN: gone.length,
          later: sum(later), laterN: later.length,
          platform: bookings().reduce((s,r)=> s + withPlatform(r), 0)};
  /* the assertion the card never made. If a fifth state is ever added to the
     book this fires in the console rather than shipping a card that silently
     hides a fifth of the money. */
  if(out.soon + out.gone + out.later + out.here !== out.total)
    console.warn("owedStats: rows do not partition the total",
      {soon:out.soon, gone:out.gone, later:out.later, here:out.here, total:out.total});
  return out;
}

/* Repeat business, which is the cheapest revenue there is — no commission, no
   listing, no photographs. Only visible at all because a booking now carries a
   phone number. */
/* WHAT COUNTS AS THE SAME PERSON. A phone number is proof; a name is a guess.
   This matched on the number alone, and the imported book carries none at all —
   0 of 877 rows — so the card was permanently empty on the only book the
   operator actually has, while that same book held 162 names recurring across
   595 of its rows. An honest refusal that can never stop refusing is not much
   better than a wrong number: it just fails quietly instead of loudly.

   So: match on whatever the book has, and say which. Numbers when there are
   enough of them, names otherwise — and when it is names, the card says so,
   because two guests called Aditya are one guest to this function and the
   operator is the only one who can tell them apart. */
const nameKey = s => String(s || "").trim().toLowerCase().replace(/\s+/g," ");
/* Placeholders are not people. These are what the import writes when the sheet
   had no name, and left in they become the book's biggest "repeat guest". */
const NOT_A_NAME = /^(guest|long stay|block(ed)?|maintenance|owner( use)?|na|n\/a|-+|\?+)$/;
function guestStats(){
  const all = bookings().filter(r => !NOT_A_NAME.test(nameKey(r.guest)));
  const phoned = all.filter(r => r.phone);
  /* Eight, the same floor the lead-time median uses. Below it the numbers that
     do exist are too few to read a rate from, so fall back rather than refuse. */
  const byPhone = phoned.length >= 8;
  const bk  = byPhone ? phoned : all.filter(r => nameKey(r.guest));
  const key = byPhone ? (r => digits10(r.phone)) : (r => nameKey(r.guest));
  const by = {};
  bk.forEach(r=> (by[key(r)] = by[key(r)] || []).push(r));
  const people = Object.values(by);
  const repeat = people.filter(p => p.length > 1);
  const repeatRows = repeat.reduce((a,p)=> a.concat(p), []);
  const onceRows = people.filter(p => p.length === 1).map(p => p[0]);
  /* PER NIGHT, NOT PER BOOKING. Comparing booking totals answers "who books
     longer", not "who is worth more": on the real book this put one 95-night
     tenancy against a one-night stay and reported the difference as spending.
     Per night is the only comparison the two sides can both survive.

     And it needs a sample on BOTH sides. The same card would otherwise print
     "returning guests spend 57% more" from exactly one priced repeat booking
     against four priced first-timers. Five each, below which there is no
     comparison to draw rather than a small one. */
  const priced = rows => rows.filter(r => r.amount && r.nights);
  const avg = rows => { const v = priced(rows);
    return v.length ? v.reduce((s,r)=> s + r.amount / r.nights, 0) / v.length : 0; };
  const CMP = 5;
  const cmp = priced(repeatRows).length >= CMP && priced(onceRows).length >= CMP;
  return {people: people.length, repeat: repeat.length, idBy: byPhone ? "phone" : "name",
          cmp, pricedRepeat: priced(repeatRows).length, pricedOnce: priced(onceRows).length,
          bookings: bk.length, repeatBookings: repeatRows.length,
          share: bk.length ? repeatRows.length / bk.length : 0,
          avgRepeat: avg(repeatRows), avgOnce: avg(onceRows),
          /* Stays break the tie, because on a book where almost nothing carries
             an amount a pure spend sort leaves everyone below the first name in
             arbitrary order. */
          top: repeat.map(p=>({name: p[p.length-1].guest, phone: p[0].phone, stays: p.length,
                               spend: p.reduce((s,r)=> s + (r.amount||0), 0)}))
                     .sort((a,b)=> b.spend - a.spend || b.stays - a.stays)};
}

/* ── FINDING A PERSON ────────────────────────────────────────────────────────
   Ask could only ever answer "is anything free". Typing a guest's name into it
   produced a confident answer about TONIGHT — the parser recognises no date in
   "Venkatarao", falls back to its default, and reports on rooms free this
   evening. A wrong answer to a question nobody asked.

   The operator's actual question is the oldest one in the trade: when did this
   person stay, and are they coming back. The book has 708 rows and 444 names in
   it and could always answer that; nothing was asking.

   Matched on the name, and on the number where the book has one — same identity
   rule the repeat-guest card settled on, for the same reason: a phone is proof,
   a name is a guess, and the imported book carries no numbers at all. */
function findPeople(q){
  const raw = String(q || "").trim();
  if(raw.length < 2) return [];
  const digits = raw.replace(/\D/g, "");
  const byPhone = digits.length >= 6;
  const needle = nameKey(raw);
  const hit = r => byPhone
    ? (r.phone && digits10(r.phone).indexOf(digits.slice(-10)) >= 0)
    : nameKey(r.guest).indexOf(needle) >= 0;
  const by = {};
  bookings().forEach(r=>{
    if(NOT_A_NAME.test(nameKey(r.guest))) return;
    if(!hit(r)) return;
    (by[nameKey(r.guest)] = by[nameKey(r.guest)] || []).push(r);
  });
  return Object.values(by).map(rows=>{
    rows.sort((a,b)=> a.start - b.start);
    const last = rows[rows.length-1];
    return {
      name: last.guest,
      phone: (rows.find(r=>r.phone) || {}).phone || null,
      rows,
      /* three states, because "when did they come" and "are they coming" are
         different questions and the answer to both is on this screen */
      past:  rows.filter(r=> r.end <= 0),
      here:  rows.filter(r=> r.start <= 0 && r.end > 0),
      ahead: rows.filter(r=> r.start > 0),
      nights: rows.reduce((a,r)=> a + (r.openEnd ? 0 : r.nights), 0),
      billed: rows.reduce((a,r)=> a + (r.amount || 0), 0),
      open:   rows.some(r=> r.openEnd),
    };
  }).sort((a,b)=>{
    /* A NAME THAT STARTS WITH WHAT YOU TYPED COMES FIRST. "ra" matches 97
       people somewhere in the middle of their names and two dozen at the front,
       and the ones the operator is reaching for are almost always the second
       kind — Rajkumar, Ramesh — not Venkatarao. */
    const pa = nameKey(a.name).indexOf(needle) === 0 ? 0 : 1;
    const pb = nameKey(b.name).indexOf(needle) === 0 ? 0 : 1;
    return pa - pb || b.rows.length - a.rows.length || (b.billed - a.billed);
  });
}
/* Ask is an availability box first. A person only takes it over when the query
   could not have been about availability at all: the parser found no date and
   no piece of inventory in it, and somebody in the book answers to it. A phone
   number is unambiguous enough to win outright. */
function personQuery(q, p){
  const raw = String(q || "").trim();
  if(raw.length < 2) return null;
  const digits = raw.replace(/\D/g, "");
  if(digits.length >= 6) return findPeople(raw);
  if(!/[a-z]/i.test(raw)) return null;
  if(p && (p.how !== "tonight" || p.flat != null || p.type || p.bldg)) return null;
  if(/^(tonight|today|tomorrow|now|free|empty|any|anything)$/i.test(raw)) return null;
  const found = findPeople(raw);
  if(found.length) return found;
  /* A NAME THAT IS NOT IN THE BOOK IS STILL A NAME. Returning null here sent a
     misspelt guest back to the availability parser, which finds no date in it,
     falls back to its default and reports confidently on rooms free tonight —
     the exact wrong answer that started this. Anything short enough to be a
     name gets told plainly that nobody answers to it; a longer sentence is a
     pasted enquiry and still belongs to the parser. */
  return raw.split(/\s+/).length <= 3 && raw.length <= 30 ? [] : null;
}

/* What keeping the place standing actually costs — the invoice plus the nights
   the repair took off the market, which is the half that never appears on any
   bill and is usually the larger one. */
function upkeepStats(){
  const jobs = resv.filter(isBlock);
  let bill = 0, lost = 0, nights = 0;
  const byFlat = {};
  const add = (fi, b, l, n)=>{
    bill += b; lost += l; nights += n;
    const g = byFlat[fi] = byFlat[fi] || {fi, bill:0, lost:0, jobs:0, nights:0};
    g.bill += b; g.lost += l; g.jobs++; g.nights += n;
  };
  jobs.forEach(r=>{ const c = outageCost(r); add(r.fi, c.bill, c.lost, c.nights); });
  /* A fault fixed while the flat stayed on sale still has an invoice — it just
     has no lost nights, which is the whole point of fixing it in a gap. Leaving
     these out made "what upkeep costs" a total of only the work that also cost
     you nights, which flatters the number in exactly the wrong direction. */
  const fixedIssues = issues.filter(x => x.fixed != null && x.cost);
  fixedIssues.forEach(x=> add(x.fi, x.cost, 0, 0));
  /* `jobs` stays the count of spells OUT OF SERVICE, because that is the phrase
     the panel prints. A fault fixed while the flat kept selling is real work
     with a real invoice, but calling it a spell out of service would be a lie
     in the one sentence that is meant to separate the two halves. It gets its
     own count instead — and a high one is the good news on this screen. */
  return {bill, lost, nights, total: bill + lost,
          jobs: jobs.length, onSale: fixedIssues.length,
          open: openIssues().length,
          flats: Object.values(byFlat).sort((a,b)=> (b.bill+b.lost) - (a.bill+a.lost))};
}

let pulseSeg = "now", pulseDir = 0;
let finMonth = "";     // which month the Profit segment is showing
const PULSE_SEGS = ["now","money","profit","rooms","guests","upkeep"];

/* Move between Pulse segments. Direction is remembered so the deck arrives from
   the side you travelled, which is the whole difference between a screen that
   changed and a place you moved to. */
function pulseGo(dir){
  const at = PULSE_SEGS.indexOf(pulseSeg);
  const to = at + dir;
  if(to < 0 || to >= PULSE_SEGS.length) return false;
  pulseSeg = PULSE_SEGS[to]; pulseDir = dir;
  haptic(9); renderTrends();
  return true;
}
function renderTrends(){
  const s = document.getElementById("scr-trends");
  s.textContent = "";
  // one chokepoint: both ways of changing segment come through here
  try{ sessionStorage.setItem("vacancy.seg", pulseSeg); }catch(e){}
  /* Every panel below reads a distribution across the portfolio, and with no
     flats there is no distribution — the occupancy curve comes back empty and
     the first card reads curve[0]. Reachable in one move: clear the sample
     inventory before adding your own. Say so instead of showing a blank tab. */
  if(!NF){
    const tsg = document.getElementById("tabseg");
    if(tsg){ tsg.hidden = true; tsg.textContent = ""; }
    const e = el("div","tcard");
    e.append(el("h3",null,"Nothing to read yet"),
             el("div","cap","there are no flats in the book"));
    const b = el("div","body");
    b.appendChild(el("div","empty",
      "Add your apartments under Rooms → Inventory and this fills in on its own — "
      + "occupancy, which nights sell, how each building is doing."));
    e.appendChild(b);
    s.appendChild(e);
    return;
  }
  const all = []; for(let d=0; d<DAYS; d++) all.push(d);

  /* ── one question per segment ────────────────────────────────────────────────
     Pulse was nine cards in a single scroll: what to do today sat above how the
     year is going, and each new measure pushed the actionable ones further down.
     They answer different questions on different clocks — act now, earn, fill,
     return, spend — so they get a bar rather than a queue. */
  const SEGS = [["now","Now"],["money","Money"],["profit","Profit"],["rooms","Rooms"],
                ["guests","Guests"],["upkeep","Upkeep"]];
  const seg = SEGS.some(s=>s[0] === pulseSeg) ? pulseSeg : "now";
  // the chips live in the header, not in this scroll — see .tabseg
  const bar = document.getElementById("tabseg");
  bar.textContent = ""; bar.hidden = false;
  SEGS.forEach(([k,label])=>{
    const b2 = el("button", null, label);
    b2.setAttribute("role","tab");
    b2.setAttribute("aria-selected", k === seg);
    if(k === "now" && todayBoard().count) b2.append(el("i","dot"));
    b2.onclick = ()=>{
      if(k === seg) return;
      pulseDir = SEGS.findIndex(x=>x[0]===k) > SEGS.findIndex(x=>x[0]===seg) ? 1 : -1;
      pulseSeg = k; haptic(9); renderTrends();
    };
    bar.appendChild(b2);
  });
  requestAnimationFrame(()=>{
    const on = bar.querySelector('[aria-selected="true"]');
    if(on && on.scrollIntoView) on.scrollIntoView({block:"nearest", inline:"center"});
  });

  const deck = el("div","deck");
  if(pulseDir && !calm){
    deck.classList.add("slide");
    deck.style.setProperty("--from", (pulseDir > 0 ? 26 : -26) + "px");
  }
  pulseDir = 0;
  const card = (title, cap)=>{
    const c = el("div","tcard");
    c.append(el("h3",null,title), el("div","cap",cap));
    const b = el("div","body"); c.appendChild(b);
    deck.appendChild(c);
    return {c, b};
  };
  const said = (c, html)=>{ const p = el("p","said"); p.innerHTML = html; c.appendChild(p); };
  /* A chart that only draws is a picture. Touch a bar and it says what it is in
     words, and where there is something to do about it, offers the route. The
     readout sits in a fixed slot under the chart so nothing reflows and the
     cards below never jump.                                                   */
  const vbars = (rows, accIdx, tell)=>{
    const wrap = el("div","vwrap");
    const w = el("div","vbars");
    const max = Math.max(...rows.map(r=>r.v), 0.0001);
    const out = el("div","vsay");
    let picked = -1;
    const bars = [];
    rows.forEach((r,i)=>{
      const b = el(tell ? "button" : "div", "vbar" + (i===accIdx ? " acc" : ""));
      b.append(el("div","v", r.label));
      const col = el("div","col"); const fill = el("i");
      fill.style.height = "100%";
      fill.style.setProperty("--v", Math.max(.02, r.v/max).toFixed(3));
      col.appendChild(fill);
      b.append(col, el("div","k", r.k));
      if(tell){
        b.setAttribute("aria-label", r.k + ", " + r.label);
        b.onclick = ()=>{
          picked = picked === i ? -1 : i;
          bars.forEach((z,j)=> z.classList.toggle("on", j === picked));
          out.textContent = "";
          if(picked < 0){ wrap.classList.remove("telling"); return; }
          const said2 = tell(rows[i], i);
          if(!said2){ wrap.classList.remove("telling"); return; }
          wrap.classList.add("telling");
          const inner = el("div","vsay-in");
          const line = el("div","vsay-l"); line.innerHTML = said2.text;
          inner.append(line);
          if(said2.go){
            const a2 = el("button","vsay-go", said2.go.label);
            a2.onclick = ev=>{ ev.stopPropagation(); haptic(10); said2.go.run(); };
            inner.append(a2);
          }
          out.append(inner);
          haptic(7);
        };
      }
      bars.push(b);
      w.appendChild(b);
    });
    wrap.append(w, out);
    return wrap;
  };
  const hbars = (rows, lowKey)=>{
    const w = el("div","pat"); w.style.padding = "0";
    rows.forEach(r=>{
      const row = el("div","patrow" + (r.k===lowKey ? " low" : ""));
      row.append(el("div","k", r.k));
      const t = el("div","t"); const i = el("i");
      i.style.setProperty("--v", Math.max(.02, r.pct).toFixed(3));
      t.appendChild(i);
      row.append(t, el("div","v", r.right));
      w.appendChild(row);
    });
    return w;
  };

  /* 0 — the board. Grouped by the response each thing needs. */
  const board = todayBoard();
  if(seg === "now" && board.count){
    const {c,b} = card("Worth doing now", "today and tomorrow · what expires if ignored");
    b.style.justifyContent = "flex-start";
    const wrap = el("div","board");

    /* DECIDE — questions only the operator can answer */
    if(board.decide.length){
      const sec = el("div","bsec");
      sec.appendChild(el("div","lbl", board.decide.length === 1 ? "Needs a decision" : `${board.decide.length} need a decision`));
      board.decide.slice(0,3).forEach(dcd=>{
        const box = el("div","decide");
        box.append(el("b",null,dcd.title), el("s",null,dcd.why));
        const ans = el("div","nudge");
        const yes = el("button","nudgeBtn yes","Back in service");
        yes.onclick = ev=>{
          ev.stopPropagation(); haptic(12);
          const r = dcd.block, fl2 = flats[r.fi];
          openFixedForm({
            fi: r.fi, fault: r.fault || "",
            assigned: r.fixer || "", assignedPhone: r.fixer_phone || "",
            line: `<b>${esc(r.fault || r.reason || "Out of service")}</b> · ${esc(fl2.id)} `
                + `out since ${fmt(Math.max(r.start, 0))}`,
            cta: "Back in service",
            back: closeSheet,
            onDone: d=>{ releaseBlock(r, d); closeSheet(); refreshScreen(); }
          });
        };
        const still = el("button","nudgeBtn","Still out ⌄");
        still.onclick = ev=>{ ev.stopPropagation(); haptic(10);
          // the two answers are replaced by the stepper, so the stepper has to
          // carry the way back — otherwise the only exit from a question the
          // operator opened by accident is to leave the tab
          ans.remove();
          attachDaysSlider(box, dcd.block, ()=>{
            box.querySelectorAll(".exts").forEach(e=>e.remove());
            box.appendChild(ans);
            haptic(8);
          });
        };
        ans.append(yes, still);
        box.appendChild(ans);
        sec.appendChild(box);
      });
      if(board.decide.length > 3){
        const more = el("div","lbl");
        more.style.margin = "0 2px";
        more.textContent = `+${board.decide.length - 3} more waiting on you`;
        sec.appendChild(more);
      }
      wrap.appendChild(sec);
    }

    /* TO DO — work that must happen */
    if(board.todo.length){
      const sec = el("div","bsec");
      sec.appendChild(el("div","lbl","To do"));
      board.todo.forEach(t=>{
        const row = el("button","line");
        const tx = el("div","t");
        tx.append(el("b",null,t.label), el("s",null,t.note));
        row.append(tx, el("span","chev","›"));
        row.onclick = ()=>{ haptic(10); t.open(); };
        sec.appendChild(row);
      });
      wrap.appendChild(sec);
    }

    /* PERISHING — nights with a clock on them */
    if(board.days.length || board.extras.length){
      const sec = el("div","bsec");
      sec.appendChild(el("div","lbl","Perishing · sell or lose"));
      if(board.days.length){
        const duo = el("div","duo");
        board.days.forEach(dd=>{
          const cell = el("button","dcell" + (dd.d === 0 ? " urgent" : ""));
          cell.append(el("div","k", dd.d === 0 ? "Tonight" : "Tomorrow"),
                      el("div","n", String(dd.n)),
                      el("div","s", dd.soft ? "unsold · softer than usual" : "unsold"),
                      el("div","d", `−${dd.depth}%`));
          cell.setAttribute("aria-label", `${dd.n} flats unsold ${dd.d===0?"tonight":"tomorrow"} — open the list`);
          cell.onclick = ()=>{ haptic(10); dd.open(); };
          duo.appendChild(cell);
        });
        sec.appendChild(duo);
      }
      board.extras.forEach(x=>{
        const row = el("button","line");
        const tx = el("div","t");
        tx.append(el("b",null,x.label), el("s",null,x.note));
        row.append(tx, el("span","pill now", x.pill), el("span","chev","›"));
        row.onclick = ()=>{ haptic(10); x.open(); };
        sec.appendChild(row);
      });
      wrap.appendChild(sec);
    }

    b.appendChild(wrap);
  } else if(seg === "now"){
    // the all-clear belongs to Now; it was leaking onto every other segment
    const line = el("div","allclear");
    line.append(el("div","tick","✓"));
    const t = el("div");
    t.innerHTML = `<b>Nothing needs attention today.</b> No cleans between guests, no flat due back from maintenance, and every room tonight is sold.`;
    line.appendChild(t);
    deck.appendChild(line);
  }


  /* ── PROFIT ────────────────────────────────────────────────────────────────
     Expenses drawn in the currency of occupancy. See finRows() and the CSS
     note on .wrow for why the threshold is a mark under the bar rather than a
     line across it, and why one rule — solid is billed, hatch is counted but
     not billed — draws all five rows without naming any of them.             */
  if(seg === "profit"){
    if(!FIN.length){
      deck.appendChild(el("div","empty","No months have been read from your workbook yet."));
    } else {
    const appK = appMonths();
    const keys = FIN.map(r=>r[0]).concat(appK);
    if(keys.indexOf(finMonth) < 0) finMonth = keys[keys.length-1];
    const F = finRows(finMonth);
    const pct = v => Math.max(0, Math.min(1, v));
    const monName = k => { const [y,m] = k.split("-").map(Number);
      return MON[m-1] + " " + y; };

    /* THE MONTH ROW — on the page ground, not in a card, because two cards
       read it; and not in the header, because a month is a lie above Now,
       Rooms, Guests and Upkeep. */
    const mo = el("div","finmo");
    const prev = el("button",null,"‹"), next = el("button",null,"›");
    prev.setAttribute("aria-label","The month before"); next.setAttribute("aria-label","The month after");
    const at = keys.indexOf(finMonth);
    prev.disabled = at <= 0; next.disabled = at >= keys.length-1;
    const lab = el("div","lab");
    lab.append(el("b",null,monName(finMonth)),
               el("s",null, F.source === "app"
                 ? `from your own bookings · not yet in your sheet`
                 : `${FIN.length} months read · ${FIN_DROP.length} refused`));
    const step = d => { const k = keys[at+d]; if(!k) return; finMonth = k; haptic(9); renderTrends(); };
    prev.onclick = ()=>step(-1); next.onclick = ()=>step(1);
    mo.append(prev, lab, next);
    deck.appendChild(mo);

    /* ── CARD 1 — the waterline ───────────────────────────────────────── */
    {
      const {c,b} = card("Which buildings pay for themselves",
        `${monName(finMonth)} · sold against what each has to sell to cover itself`);
      const totalFlats = F.coverage.complete + F.coverage.floor + F.coverage.absent;
      const strip = el("div","covstrip");
      [["complete",F.coverage.complete],["floor",F.coverage.floor],["absent",F.coverage.absent]]
        .forEach(([k,n])=>{ if(!n) return;
          const sp = el("span","c-"+k); sp.style.width = (n/totalFlats*100).toFixed(2)+"%";
          if(k==="floor") sp.style.background =
            "repeating-linear-gradient(135deg,color-mix(in srgb,var(--free) 62%,transparent) 0 5px,transparent 5px 10px)";
          strip.appendChild(sp); });
      strip.setAttribute("role","img");
      strip.setAttribute("aria-label", F.source === "app"
        ? `${F.coverage.floor} flats read from your own bookings, ${F.coverage.absent} with no cost line`
        : `${F.coverage.complete} flats priced completely, ${F.coverage.floor} priced short of the book, ${F.coverage.absent} in no sheet`);
      b.appendChild(strip);
      const absent = F.rows.filter(r=>r.state==="absent");
      if(absent.length){
        const note = el("button","covnote", F.source === "app"
          ? `${F.coverage.absent} flats at ${absent.map(r=>r.name).join(" and ")} have no cost line, so they are left out →`
          : `${F.coverage.absent} flats at ${absent.map(r=>r.name).join(" and ")} are in no revenue or cost sheet →`);
        note.onclick = ()=>{ haptic(10); openCosts(absent[0]); };
        b.appendChild(note);
      }
      const head = el("div","headline");
      const t = F.totals;
      /* COST IS COMPLETE THE DAY A MONTH STARTS; REVENUE ARRIVES ONE TYPED
         AMOUNT AT A TIME. Subtract them at 19% priced and August reads
         −₹9,82,170 — a catastrophic loss that is entirely a gap in data entry,
         and the most misleading number this app could print. The month still
         appears, because what the book knows about NIGHTS is exact and worth
         seeing; it just leads with that instead. */
      const thinMonth = t && t.app && !t.canState;
      if(thinMonth){
        head.append(el("b",null, Math.round(t.occ*100) + "%"));
        head.append(el("s",null, `of your ${t.cap.toLocaleString("en-IN")} nights sold · `
          + `${t.priced} of ${t.rows} bookings carry an amount`));
      } else {
        head.append(el("b",null, t ? money(t.net) : "—"));
        const s2 = el("s"); s2.innerHTML = t
          ? `kept · <span class="hi">${t.flats} of ${totalFlats} flats</span>`
          : "nothing priced this month";
        head.append(s2);
      }
      b.appendChild(head);

      /* THE BAR NEEDS A KEY, ONCE. Two tones, a tick and sometimes a hatch is
         four pieces of vocabulary, and the card was asking the operator to
         infer all of them from a caption. Said plainly here and never again. */
      /* A key for marks that are not on the bars. On an app-sourced month there
         is no split and no tick — the rows draw sold nights and nothing else —
         so naming three things the reader cannot find is worse than no key. */
      if(!thinMonth){
        const key = el("div","wkey");
        key.innerHTML = `<span><i class="k-cover"></i>paying its costs</span>`
                      + `<span><i class="k-kept"></i>kept</span>`
                      + `<span><i class="k-tick"></i>break-even</span>`;
        b.appendChild(key);
      }
      /* THE ANSWER OPENS UNDER THE ROW YOU TOUCHED. It used to open in a fixed
         slot below all five, so tapping Telecom Nagar at the top meant
         scrolling past four other buildings to read about it — the reader
         hunting for their own answer, which is the failure this whole tab
         exists to avoid. Each row now carries its own readout directly beneath
         it, and only one is open at a time, so nothing below the touched row
         moves further than the row's own growth. */
      const rowsBox = el("div","wrows");
      let openRow = null; const made = [];
      const complete = F.rows.filter(r=>r.state==="complete").sort((a,b2)=> a.head - b2.head);
      const floors   = F.rows.filter(r=>r.state==="floor" || r.state==="app")
                             .sort((a,b2)=> a.head - b2.head);

      const drawRow = (r)=>{
        const row = el("button","wrow" + (r.state==="complete" && r.net < 0 ? " short" : ""));
        const n = el("div","n");
        const nm = el("b", null, r.name);
        n.appendChild(nm);
        if(r.state === "floor"){ const p2 = el("span","pill now","understated"); n.appendChild(p2); }
        if(r.state === "app" && !r.canState){
          const p2 = el("span","pill now", `${Math.round(r.cover*100)}% priced`); n.appendChild(p2);
        }
        const right = el("em");
        if(r.state === "absent"){ const p2 = el("span","pill now","Add costs →"); n.appendChild(p2); }
        /* "AT LEAST" IS NOT A THING YOU CAN SAY ABOUT A NEGATIVE. A floor under
           a loss is not a floor, it is a bigger loss — and at 6% priced the
           subtraction is measuring how little has been typed in, not how the
           building did. The row shows the one thing it knows exactly instead. */
        else if(r.state === "app" && !r.canState)
          right.textContent = `${r.book} night${r.book===1?"":"s"} sold`;
        else right.textContent = (r.state==="floor" ? "at least " : "") +
                                 (r.net >= 0 ? "+" : "−") + money(Math.abs(r.net));
        n.appendChild(right);
        row.appendChild(n);

        /* ONE RULE: solid is nights the sheet bills, hatch is nights the book
           counted that it does not. And the solid part is split at break-even
           — dim while it is still paying the rent, lit once it is not. */
        const track = el("div","t");
        const thin = r.state === "app" && !r.canState;
        const billedOcc = r.state==="absent" ? 0 : pct(r.occ);
        const be = (r.state==="absent" || thin) ? null : pct(r.be);
        const put = (cls, from, to)=>{
          if(to <= from + 0.0005) return;
          const i2 = el("i", cls);
          i2.style.left = (from*100).toFixed(2)+"%";
          i2.style.width = ((to-from)*100).toFixed(2)+"%";
          i2.style.setProperty("--v","1");
          track.appendChild(i2);
        };
        if(be === null && thin){ put("only", 0, billedOcc); }   // sold, and that is all it claims
        else if(be === null) { /* nothing billed at all — the hatch below says it */ }
        else if(billedOcc <= be){ put("cover only", 0, billedOcc); }   // still paying for itself
        else { put("cover", 0, be); put("kept", be, billedOcc); }
        const bookOcc = pct(r.bookOcc);
        if(bookOcc > billedOcc + 0.001){
          const h = el("u");
          h.style.left = (billedOcc*100).toFixed(2)+"%";
          h.style.width = ((bookOcc-billedOcc)*100).toFixed(2)+"%";
          track.appendChild(h);
        }
        row.appendChild(track);

        /* The threshold also gets a hard mark on its own rail below, on the one
           ground the card surface offers, so the exact point is readable even
           where the two fill segments meet at low contrast. */
        const rail = el("div","rail" + (r.state==="absent" || thin ? " nocost" : ""));
        if(r.state !== "absent" && !thin){
          const tick = el("span","tick" + (r.unreachable ? " over" : ""), r.unreachable ? "›" : "");
          tick.style.left = (Math.min(be,1)*100).toFixed(2)+"%";
          rail.appendChild(tick);
          if(r.head < 0 || r.unreachable){
            const hr = el("span","hr");
            hr.style.left = (billedOcc*100).toFixed(2)+"%";
            hr.style.width = Math.max(Math.min(be,1)-billedOcc, 0.02)*100 + "%";
            hr.style.background = "var(--hot)";
            rail.appendChild(hr);
          }
        }
        row.appendChild(rail);

        if(r.state !== "absent" && !thin){
          const p = el("div","pcts");
          /* Placed at a fraction along the bar, clamped so a label near either
             end sits inside the card instead of centred on the edge. */
          const at = (node, frac, cls)=>{
            const f = pct(frac);
            if(f < 0.10){ node.style.left = "0"; node.classList.add("edgeL"); }
            else if(f > 0.90){ node.style.right = "0"; node.style.textAlign = "right"; }
            else { node.style.left = (f*100).toFixed(1)+"%"; node.style.transform = "translateX(-50%)"; }
            p.appendChild(node);
          };
          /* BARE PERCENTAGES. Positioning a label means it has to be narrow
             enough to sit at a point without reaching the next one — "44%
             covers costs" is 105px on a 305px bar and collided with everything.
             The key above the rows already says which mark is which, so the
             number is the whole job. */
          at(el("span","p-be",   Math.round(r.be*100) + "%"), r.be);
          at(el("span","p-sold", Math.round(billedOcc*100) + "%"), billedOcc);
          row.appendChild(p);
        }
        const cap2 = el("div","cap2");
        cap2.textContent = r.state === "absent"
          ? `${r.flats} flats · ${r.book} nights sold in ${MON[+finMonth.split("-")[1]-1]} · no revenue line and no cost line`
          : `${money(r.revenue)} in · ${money(r.cost)} to run`
            + (r.state==="floor" ? ` · covers ${r.billed} of ${r.book} nights sold` : "");
        row.appendChild(cap2);

        const wrap = el("div","vwrap");
        const out = el("div","vsay");
        wrap.append(row, out);
        row.onclick = ()=>{
          if(r.state === "absent"){ haptic(10); openCosts(r); return; }
          const already = wrap.classList.contains("telling");
          /* one at a time: a second open readout doubles the scroll and the
             operator is comparing two buildings by memory anyway */
          if(openRow && openRow !== wrap){ openRow.classList.remove("telling"); openRow.querySelector(".vsay").textContent = ""; }
          made.forEach(z=> z.classList.remove("on"));
          out.textContent = "";
          if(already){ wrap.classList.remove("telling"); openRow = null; rowsBox.classList.remove("picked"); return; }
          rowsBox.classList.add("picked"); row.classList.add("on");
          wrap.classList.add("telling"); openRow = wrap;
          const inner = el("div","vsay-in"), line = el("div","vsay-l");
          line.innerHTML = (r.state === "app" && !r.canState)
            /* The row knows its nights exactly and its money hardly at all, so
               it says the first and asks for the second. Naming the gap in
               bookings rather than in rupees is what makes it actionable: the
               operator cannot type a revenue figure, but they can put amounts
               on the stays they already have. */
            ? `<b>${esc(r.name)}</b> sold <b>${r.book} of its ${r.cap} nights</b> — `
              + `${Math.round(r.bookOcc*100)}% — and that count is exact, straight off your book. `
              + `What it earned is not: <b>${r.priced} of its ${r.rows} bookings carry an amount</b>, `
              + `covering ${Math.round(r.cover*100)}% of the nights it sold. Until that gets closer to all of `
              + `them, subtracting ${money(r.cost)} of costs from ${money(r.revenue)} would measure your typing, `
              + `not this building. Put amounts on the stays and this row fills itself in.`
            : r.state === "floor"
            ? `<b>${esc(r.name)}</b> sold ${r.book} of its ${r.cap} nights — ${Math.round(r.bookOcc*100)}%. `
              + `Your monthly sheet accounts for ${r.billed} of them, ${Math.round(r.occ*100)}%. The rest is billed `
              + `outside this sheet, so <b>${money(r.net)} is a floor, not a figure</b>. Its cost line covers all `
              + `${r.flats} flats and its revenue covers fewer, and headroom rises with both nights and revenue — `
              + `so this row can only go up.`
            /* IN NIGHTS, WHICH IS WHAT THE OPERATOR SELLS. This said "keeps 42p
               in the rupee" and "occupancy could fall 32 points", and both had
               to be asked about. "p" is paise and "points" are the gap between
               two percentages rather than a percentage of one — correct, and
               neither is the unit anybody runs a building in.

               Worse, "could fall" turned a measurement into a warning: nothing
               here forecasts a fall, and framing the distance between two marks
               as a risk makes a healthy building sound precarious. The same gap
               read forwards is the profit, counted in nights. */
            : (r.unreachable
                ? `<b>${esc(r.name)}</b> cannot cover ${money(r.cost)} at ${money(r.adr)} a night however full `
                  + `it gets. <b>The rate is the problem, not the fill.</b>`
                : r.head >= 0
                ? `<b>${esc(r.name)}</b> needs ${Math.ceil(r.beNights)} of its ${r.cap} nights to cover itself. `
                  + `It sold ${r.billed}. <b>The ${r.billed - Math.ceil(r.beNights)} nights past that mark are `
                  + `the ${money(r.net)} it kept.</b>`
                : `<b>${esc(r.name)}</b> needs ${Math.ceil(r.beNights)} of its ${r.cap} nights to cover itself `
                  + `and sold ${r.billed}. <b>It is ${Math.ceil(r.beNights) - r.billed} nights short.</b>`);
          inner.appendChild(line);
          /* AND HOW FAR THAT FIGURE CAN BE TRUSTED. The sentence above computes
             a break-even and a profit off the cost, so it has to say what the
             cost is made of: rent is contracted and known, an electricity
             average is not. Without this the two arrive in the same type, and
             the reader has no way to tell a lease from a guess. */
          if(r.cost){
            const cmv = costMonth(r.code, finMonth);
            if(cmv.estimated){
              const sure = el("div","vsay-l");
              sure.style.cssText = "margin-top:9px;color:var(--txt-2);font-weight:500";
              const soft = Object.keys(cmv.lines)
                .filter(k => cmv.basis[k] !== "actual" && cmv.kind[k] !== "fixed" && +cmv.lines[k] > 0)
                .sort((a,b2)=> cmv.lines[b2] - cmv.lines[a]);
              sure.innerHTML = `<b>${Math.round(cmv.certainty*100)}% of that cost is known</b> — `
                + `${money(cmv.known)} of contracted lines and anything you logged. The other `
                + `${money(cmv.estimated)} is an average across ${soft.length} line${soft.length===1?"":"s"}`
                + (soft.length ? `, mostly ${esc(soft[0])}` : "")
                + `. Log those and this row stops being an estimate.`;
              inner.appendChild(sure);
            }
          }
          /* WHERE THE MONEY GOES. The row could only ever say "₹4,62,000 out",
             which reads as one bill — and because rent is 55-68% of it, a
             reader lands on "that must be the rent". It is eleven lines: rent,
             salaries, electricity, water, laundry, refills, maintenance, AMC,
             replacements, contingency and bonuses, all from their own Costing
             sheet under their own names. Shown biggest first, because that is
             the order anything can be done about them in. */
          if(r.cost){
            const cm = costMonth(r.code, finMonth);
            const lines = Object.entries(cm.lines)
              .filter(([,v])=> +v > 0).sort((a2,b2)=> b2[1] - a2[1]);
            const tbl = el("div","costsplit");
            /* WHICH FIGURE IS A FACT AND WHICH IS AN ESTIMATE. A line the
               operator logged this month is what they actually paid; the rest
               are the standing model. Both are charged, so both are shown — but
               they are not the same kind of number and the row says so, because
               a half-logged line understates and only the operator can tell. */
            /* THE HEADER SAYS HOW MUCH OF IT IS KNOWN, not how many rows are
               ticked. A count of lines treats rent and bonuses as equals; the
               operator wants to know what share of the MONEY is a fact. */
            tbl.appendChild(el("div","cs-h", `Where the ${money(r.cost)} goes`
              + (cm.estimated
                  ? ` · ${money(cm.known)} known, ${money(cm.estimated)} estimated`
                  : ` · all of it known`)));
            lines.forEach(([k,v])=>{
              const known = cm.basis[k] === "actual" || cm.kind[k] === "fixed";
              const ln = el("div","cs-r" + (cm.basis[k] === "actual" ? " act" : "")
                                         + (known ? "" : " est"));
              const bar = el("i"); bar.style.width = (v / lines[0][1] * 100).toFixed(1) + "%";
              ln.append(el("b",null,k), bar, el("s",null,money(v)));
              ln.title = cm.basis[k] === "actual" ? `${k} — what you logged for this month`
                       : cm.kind[k] === "fixed"   ? `${k} — fixed, the same every month`
                       : cm.kind[k] === "one-off" ? `${k} — happens when it happens; this is an average until you log one`
                       :                            `${k} — a different figure every month; this is an average until you log the bill`;
              tbl.appendChild(ln);
            });
            const edit = el("button","vsay-go","Change these figures →");
            edit.onclick = ev=>{ ev.stopPropagation(); haptic(10); openCosts(r); };
            tbl.appendChild(edit);
            inner.appendChild(tbl);
          }
          out.appendChild(inner); haptic(7);
        };
        made.push(row);
        return wrap;
      };

      /* ONE RULE, NOT TWO. Two full-width headings each carrying five words of
         explanation was more chrome than the four ranked rows above them, and
         both said the same thing in different words: this building's figures
         are not comparable with the ones above. The rule now says that once,
         and which KIND of not-comparable each row is rides on the row itself,
         where the badge already was. */
      complete.forEach(r=> rowsBox.appendChild(drawRow(r)));
      const odd = floors.concat(absent);
      /* NOT COMPARABLE WITH WHAT? The heading divides two groups, so it needs
         something above it to divide from. On a month read from the app's own
         book every row is in this group, and the label sat at the very top
         separating the list from nothing. */
      if(odd.length){
        if(complete.length){
          const g = el("div","wgroup");
          /* Two words. Which KIND of not-comparable each one is rides on the row,
             where its badge already says "understated" or "Add costs". */
          g.appendChild(el("div","lbl", "NOT COMPARABLE"));
          rowsBox.appendChild(g);
        }
        odd.forEach(r=> rowsBox.appendChild(drawRow(r)));
      }
      b.appendChild(rowsBox);

      /* A ROUTE TO THE COSTS THAT DOES NOT START WITH FINDING A READOUT. Editing
         them was only reachable by tapping a building, reading its breakdown and
         then finding a button inside it — three steps down a path nobody takes
         unless they already know it is there. The costs ARE the model this whole
         card is computed from; changing them belongs on the card. */
      const edit = el("button","costsbtn");
      edit.innerHTML = `<span>Edit what a building costs</span><em>${
        F.rows.filter(x=>x.state!=="absent").length} priced · ${
        F.rows.filter(x=>x.state==="absent").length} still to cost</em>`;
      edit.onclick = ()=>{
        haptic(9);
        /* one building and there is nothing to choose between */
        const pick = F.rows.filter(x=> x.state !== "absent" || true);
        if(pick.length === 1) return openCosts(pick[0]);
        openCostPicker(pick);
      };
      b.appendChild(edit);

      /* ONE-OFFS HAVE A HOME NOW. The standing editor above answers "what does
         this building cost in a normal month"; this answers "what did we
         actually pay out in THIS one", which is a different question and was
         previously unanswerable — the only way to record a plumber was to raise
         the standing Maintenance line and charge it every month forever. */
      const led = ledgerFor(finMonth);
      const logged = led.reduce((a,z)=> a + z.amount, 0);
      const fromBook = led.filter(z=> z.kind === "repair").length;
      const exp = el("button","costsbtn");
      exp.style.marginTop = "7px";
      exp.innerHTML = `<span>${logged ? "Expenses this month" : "Log an expense"}</span><em>${
        logged
          ? money(logged) + " · " + led.length + " entr" + (led.length===1?"y":"ies")
            + (fromBook ? " · " + fromBook + " from the book" : "")
          : "one-offs, dated"}</em>`;
      exp.onclick = ()=>{ haptic(9);
        if(led.length) openLedger(finMonth); else openExpense(null, finMonth); };
      b.appendChild(exp);

      const best = complete[complete.length-1], worst = complete[0];
      said(c, F.source === "app" && F.totals && !F.totals.canState
        ? `This month is not in your monthly sheet yet, so it is read from the app's own book. The nights are `
          + `exact — a stay either covered a night or it did not — and they say you sold `
          + `<span class="hi">${Math.round(F.totals.occ*100)}%</span> of ${monName(finMonth)}. The money is `
          + `the part that is missing: ${F.totals.priced} of ${F.totals.rows} bookings carry an amount. `
          + `Add amounts as you take bookings and this month becomes a profit figure like the ones behind it, `
          + `without you touching a spreadsheet again.`
        : complete.length >= 2
        ? `Ranked by rupees, the biggest building wins for being big. Ranked by how far each one runs past its `
          + `own break-even, <span class="hi">${esc(best.name)}</span> is the strongest — it covers itself in `
          + `${Math.ceil(best.beNights)} of its ${best.cap} nights, where <span class="hi">${esc(worst.name)}</span> `
          + `needs ${Math.ceil(worst.beNights)} of ${worst.cap}. That is the comparison a column of profits hides.`
        : `The mark under each bar is what that building has to sell to cover itself. Everything past it is profit.`);
    }

    /* ── CARD 2 — the fifteen months, cost drawn as a constant base ────── */
    {
      const {c,b} = card("Is it getting better",
        `revenue against what it costs · ${monName(FIN[0][0])} → ${monName(FIN[FIN.length-1][0])}`);
      const all = FIN.map(r=> finRows(r[0]));
      const maxRev = Math.max(...all.map(f=> f.totals ? f.totals.revenue : 0), 1);
      const rail = el("div","finrail");
      rail.setAttribute("role","img");
      rail.setAttribute("aria-label",
        `Revenue by month, ${FIN.length} months, each column split at the cost line`);
      /* the months the gate refused get a slot with no column, not a closed-up
         gap: a rail that shuts the hole teaches the operator their book has
         fourteen months in it */
      const slots = [];
      FIN.forEach((r,i)=>{
        if(i){
          const [py,pm] = FIN[i-1][0].split("-").map(Number);
          let ny = py, nm = pm + 1; if(nm > 12){ nm = 1; ny++; }
          const gapKey = `${ny}-${String(nm).padStart(2,"0")}`;
          if(gapKey !== r[0]) slots.push({gap:true, key:gapKey});
        }
        slots.push({gap:false, key:r[0], f:all[i]});
      });
      slots.forEach(sl=>{
        if(sl.gap){ const g = el("div","s gap"); g.title = "not drawn"; rail.appendChild(g); return; }
        const cell = el("div","s" + (sl.key === finMonth ? " on" : ""));
        const col = el("div","col");
        const t = sl.f.totals;
        const h = t ? Math.max(6, Math.round(t.revenue / maxRev * 120)) : 6;
        col.style.height = h + "px";
        if(t){
          const base = el("em");
          base.style.height = Math.round(t.cost / t.revenue * h) + "px";
          const cap2 = el("i");
          cap2.style.height = (h - Math.round(t.cost / t.revenue * h)) + "px";
          col.append(cap2, base);
        }
        cell.appendChild(col);
        rail.appendChild(cell);
      });
      b.appendChild(rail);
      const labs = el("div","finmon");
      slots.forEach((sl,i)=>{
        const [yy,mm] = sl.key.split("-").map(Number);
        const sp = el("span", i && slots[i-1].key.slice(0,4) !== sl.key.slice(0,4) ? "yr" : null,
                      MON[mm-1][0]);
        labs.appendChild(sp);
      });
      b.appendChild(labs);
      /* Was five lines saying "the dark base never changes height". The drawing
         says that; a caption repeating it is teaching a reader who has already
         looked. What the picture CANNOT say is why the base is flat, and that
         is six words. */
      /* "EVERY MONTH" WAS TRUE UNTIL THE LEDGER EXISTED. The base was flat
         because every month charged the same standing model, and the caption
         said so. A logged expense makes one month cost more or less than its
         neighbours, and the base stops being flat — so the caption has to
         check rather than assert. It is the same failure this file keeps
         finding: a sentence that was measured once and then kept. */
      const costs = all.filter(f=>f.totals).map(f=> f.totals.cost);
      const flat = costs.length && costs.every(v => v === costs[0]);
      const lo = Math.min(...costs), hi = Math.max(...costs);
      b.appendChild(Object.assign(el("div","railkey"), {innerHTML:
        `<span><i class="k-cost"></i>costs · ${
          !costs.length ? "none read"
          : flat ? money(costs[0]) + " every month"
          : money(lo) + " to " + money(hi) + " · what you logged"}</span>`
      + `<span><i class="k-kept"></i>kept</span>`}));
    }

    /* ── CARD 3 — the three rates, and what changed ────────────────────── */
    {
      const {c,b} = card("The three rates, and what changed",
        `${monName(finMonth)} · the buildings your sheet prices`);
      const T = F.totals;
      const at = keys.indexOf(finMonth);
      const back = (k, n)=>{ const [y,m] = k.split("-").map(Number);
        let mm = m - n, yy = y; while(mm < 1){ mm += 12; yy--; }
        return `${yy}-${String(mm).padStart(2,"0")}`; };
      const tot = k => { const kk = keys.indexOf(k); return kk < 0 ? null : finRows(k).totals; };
      /* A quarter is only comparable when all three of its months were read.
         Substituting a two-month quarter for a three-month one is how a panel
         reports a 68% collapse that is really a missing sheet. */
      const qOf = k => { const [y,m] = k.split("-").map(Number);
        const q0 = Math.floor((m-1)/3)*3 + 1;
        return Array.from({length:3}, (_,i)=>{ let mm=q0+i, yy=y; return `${yy}-${String(mm).padStart(2,"0")}`; }); };
      const qSum = ks => { const parts = ks.map(tot);
        if(parts.some(p=>!p)) return null;
        return {revenue: parts.reduce((s,p)=>s+p.revenue,0), nights: parts.reduce((s,p)=>s+p.nights,0),
                cap: parts.reduce((s,p)=>s+p.cap,0), cost: parts.reduce((s,p)=>s+p.cost,0)}; };
      const qName = ks => MON[+ks[0].split("-")[1]-1] + "–" + MON[+ks[2].split("-")[1]-1]
                        + " " + ks[2].slice(2,4);
      /* Each rate opens its own fifteen months. A single figure for one month
         is the least useful form a rate can take — the operator's question is
         never "what is it" but "which way is it going" — and the trend was
         only ever available as one blended revenue line on the card above. */
      const opps = el("div","opps");
      const tile = (key, v, lab)=>{
        const d = el("button","opp tap");
        d.append(el("b",null,v), el("s",null,lab));
        d.setAttribute("aria-label", `${lab}, ${v} — see fifteen months`);
        d.onclick = ()=>{ haptic(9); openRate(key, finMonth); };
        opps.appendChild(d);
      };
      if(T){
        tile("occ",    Math.round(T.occ*100) + "%", `${T.nights} of ${T.cap} nights`);
        tile("adr",    money(T.adr),    "average room rate");
        tile("revpar", money(T.revpar), "per available night");
      }
      b.appendChild(opps);

      const rows = el("div","card");
      const pcx = (a, b2)=> b2 ? (a/b2 - 1) : null;
      const line = (label, what, pctv, detail)=>{
        const r2 = el("div","row bk");
        const L = el("div","meta"); L.innerHTML = `<b>${label}</b><em>${what}</em>`;
        const pill = el("span","paid clear",
          pctv == null ? detail
          : (pctv >= 0 ? "▲ " : "▼ ") + Math.abs(pctv*100).toFixed(1) + "%");
        r2.append(L, pill); rows.appendChild(r2);
      };
      const prevM = tot(back(finMonth,1));
      line("Month on month",
           prevM ? `${monName(back(finMonth,1))} → ${monName(finMonth)}` : "the month before was not read",
           prevM && T ? pcx(T.revenue, prevM.revenue) : null, "no comparison");
      /* Walk back to the most recent quarter all three of whose months were
         read. July sits in an open quarter, and comparing a one-month quarter
         with a three-month one is how a panel reports a 68% collapse that is
         really a calendar. The row NAMES BOTH ENDS, so showing the last
         complete pair is a statement rather than a substitution. */
      let anchorQ = qOf(finMonth), guard = 0;
      while(!qSum(anchorQ) && guard++ < 8) anchorQ = qOf(back(anchorQ[0], 1));
      const thisQ = qSum(anchorQ);
      const prevKs = qOf(back(anchorQ[0], 1)), prevQ = qSum(prevKs);
      line("Quarter on quarter",
           thisQ && prevQ ? `${qName(anchorQ)} vs ${qName(prevKs)}` : "needs two complete quarters",
           thisQ && prevQ ? pcx(thisQ.revenue, prevQ.revenue) : null, "not complete");
      const yrKs = anchorQ.map(k=> back(k,12)), yrQ = qSum(yrKs);
      line("Same quarter last year",
           thisQ && yrQ ? `${qName(anchorQ)} vs ${qName(yrKs)}` : "first year on record",
           thisQ && yrQ ? pcx(thisQ.revenue, yrQ.revenue) : null, "no comparison");
      const yrM = tot(back(finMonth,12));
      line("Same month last year",
           yrM ? `${monName(back(finMonth,12))} → ${monName(finMonth)}` : "first year on record",
           yrM && T ? pcx(T.revenue, yrM.revenue) : null, "no comparison");
      /* Refused, always, with the date it becomes possible: every 12-month
         window inside this range contains the month the gate threw out. */
      const firstFull = (()=>{ const bad = FIN_DROP.map(d=>d[0]).filter(k=> k >= FIN[0][0]);
        if(!bad.length) return null;
        const [y,m] = bad[bad.length-1].split("-").map(Number);
        let yy = y+1, mm = m; return `${yy}-${String(mm).padStart(2,"0")}`; })();
      line("Rolling twelve months", "every twelve-month window has a hole in it",
           null, firstFull ? "not until " + monName(firstFull) : "not yet");
      b.appendChild(rows);
      said(c, `These are revenue. There is no percentage on profit: costs are the same every month, so profit `
        + `moves by exactly the rupees revenue moved.`);
    }

    }
  }

  /* 1 — the booking curve */

  /* ── MONEY ─────────────────────────────────────────────────────────────── */
  if(seg === "money"){
    const M = moneyStats();
    /* THE SAME QUESTION HAS A REAL ANSWER, and it is not in the forward book.
       When the priced sample cannot carry an extrapolation (see moneyStats),
       the figure comes from the workbook — where fifteen closed months actually
       measured a rate — and the card says which book it read. Two cards in one
       app answering "what is a night worth" an order of magnitude apart is
       worse than either answer alone. */
    const W = FIN.length ? finRows(FIN[FIN.length-1][0]) : null;
    const useBook = !M.usable && W && W.totals;
    const src = useBook ? W.totals : M;
    const revpar = useBook ? W.totals.revpar : M.revpar;
    const adr    = useBook ? W.totals.adr    : M.adr;
    const {c,b} = card("What a night is worth",
      useBook ? `revenue per available night · ${MON[+W.month.split("-")[1]-1]} ${W.month.slice(0,4)}, from your workbook`
              : "revenue per available night");
    const head = el("div","headline");
    head.append(el("b", null, money(revpar)));
    head.append(el("s", null, `per available night · ${money(adr)} average when sold`));
    b.appendChild(head);
    /* The rate card must cover the same flats the achieved rate does, or the
       "discount" is partly the difference between two portfolios. When the
       figure comes from the workbook it covers the buildings the sheet prices —
       30 of 38 flats — so the card average is taken over those same flats. */
    const priceCodes = useBook ? new Set(W.rows.filter(r=>r.state!=="absent").map(r=>r.code)) : null;
    const lot = priceCodes ? flats.filter(f=> priceCodes.has(f.code)) : flats;
    const listed = lot.length ? lot.reduce((a,f)=> a + (f.rate||0), 0) / lot.length : M.listed;
    b.appendChild(vbars([
      {v: revpar,   label: Math.round(revpar/100)/10 + "k", k:"RevPAR"},
      {v: adr,      label: Math.round(adr/100)/10 + "k",    k:"Achieved"},
      {v: listed,   label: Math.round(listed/100)/10 + "k",   k:"Listed"},
    ], 0));
    const gap = adr >= listed
      ? "holding your rate"
      : `discounting about <span class="hi">${Math.round((1 - adr/listed)*100)}%</span> off the card`;
    said(c, M.priced === 0 && !useBook
      ? `No amounts recorded yet, so there is nothing to average. Put a figure on a booking and this fills in.`
      : useBook
      ? `Only <b>${M.shortPriced} of your ${M.shortN}</b> ordinary stays ahead carry an amount — too few to `
        + `price a night from, and the long tenancies that do carry one bill at a different rate entirely. So `
        + `this reads your workbook: <b>${money(revpar)}</b> is what an available night earned in `
        + `${MON[+W.month.split("-")[1]-1]}. You are ${gap}. Put amounts on the bookings ahead and it switches `
        + `to your own book.`
      : `Occupancy alone cannot tell you this: a full house at a poor rate and a half-empty one at a good rate `
        + `look the same on an occupancy chart. <b>${money(revpar)}</b> is what each of your ${M.sellable.toLocaleString("en-IN")} `
        + `sellable nights earns on average. The gap between <b>achieved</b> and <b>listed</b> is what you are actually `
        + `discounting — you are ${gap}.`
        + (M.coverage < 0.95 ? ` Based on the <b>${M.priced} of ${M.total}</b> bookings that carry an amount.` : ""));
  }

  if(seg === "money"){
    const O = owedStats();
    const {c,b} = card("What you are owed", "agreed but not in hand");
    const head = el("div","headline");
    head.append(el("b", null, money(O.total)));
    head.append(el("s", null, `across ${O.count} booking${O.count===1?"":"s"}`));
    b.appendChild(head);
    const rows = el("div","card");
    /* These three ARE the headline, split three ways and nothing left over. */
    [["Already left", O.gone, O.goneN, "has to be chased", "due"],
     ["In the flat now", O.here, O.hereN,
      O.going ? `${O.goingN} check${O.goingN===1?"s":""} out within two days` : "collect before they go",
      O.going ? "due" : "clear"],
     ["Arriving within a week", O.soon, O.soonN, "collect at the door", "clear"],
     ["Arriving later", O.later, O.laterN, "not collectable yet", "clear"]]
      .forEach(([k, v, n, why, tone])=>{
        if(!v) return;
        const r = el("div","row bk");
        const m = el("div","meta");
        m.innerHTML = `<b>${esc(k)}</b><em>${esc(why)}${n != null ? ` · ${n} booking${n===1?"":"s"}` : ""}</em>`;
        const e = el("div","rowend");
        e.append(el("span", "paid " + tone, money(v)));
        r.append(m, e);
        rows.appendChild(r);
      });
    if(!O.total && !O.platform) rows.appendChild(el("div","empty","Nothing outstanding — every booking is settled."));
    b.appendChild(rows);
    /* The platform payout is a SEPARATE POT, not a slice of the one above — it
       is money the guest has already paid, sitting with Airbnb or Booking.com.
       Listed among the rows it read as a fifth of what the operator is owed
       being already handled, when in fact none of it is in that number at all.
       Its own card, with its own sentence saying so. */
    if(O.platform){
      const p = el("div","card");
      const r = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>Sitting with a platform</b><em>already paid by the guest · `
                  + `not part of the ${money(O.total)} above</em>`;
      const e = el("div","rowend");
      e.append(el("span","paid clear", money(O.platform)));
      r.append(m, e);
      p.appendChild(r);
      b.appendChild(p);
    }
    said(c, O.gone > 0
      ? `<b>${money(O.gone)}</b> is owed by guests who have already gone, which is the money that quietly never arrives. `
        + (O.here ? `<b>${money(O.here)}</b> is with guests in the flats tonight — the easiest in the book to collect, `
                  + `and only until they hand the keys back. ` : "")
        + `<b>${money(O.soon)}</b> arrives this week.`
      : O.here
      ? `Nothing <b>with a figure on it</b> has walked out unpaid. <b>${money(O.here)}</b> is with guests in the flats tonight`
        + (O.going ? `, and <b>${money(O.going)}</b> of it leaves within two days` : "")
        + ` — collect at the door, because after that it is the kind that quietly never arrives.`
      : `Nothing with a figure on it has walked out unpaid. The balance is with guests still to arrive, `
        + `which is the easy kind to collect.`);
  }

  /* ── GUESTS ────────────────────────────────────────────────────────────── */
  if(seg === "guests"){
    const G = guestStats();
    const {c,b} = card("Guests who come back", "repeat business in the book");
    /* A RATE NEEDS A DENOMINATOR. The operator's book carries no phone numbers
       at all, so this printed "0%" at 39px over "0 of 0 people have stayed
       before" — a repeat rate measured on nobody, in the same type the app uses
       for figures it stands behind. Zero percent is a finding; zero percent OF
       ZERO is an empty set, and the two must not look alike.

       Eight, the same floor the lead-time median uses: below it there is no rate
       and the headline says what is missing instead. */
    const head = el("div","headline");
    if(G.bookings >= 8){
      head.append(el("b", null, Math.round(G.share*100) + "%"));
      head.append(el("s", null, `of bookings · ${G.repeat} of ${G.people} `
        + `${G.idBy === "name" ? "names" : "people"} have stayed before`));
    } else {
      head.append(el("b", null, String(G.bookings)));
      head.append(el("s", null, G.bookings
        ? `bookings to match on — too few to read a repeat rate from`
        : `bookings with a guest on them, so there is nothing to match on yet`));
    }
    b.appendChild(head);
    if(G.cmp) b.appendChild(vbars([
      {v: G.avgOnce,  label: money(Math.round(G.avgOnce)),  k:"First time"},
      {v: G.avgRepeat,label: money(Math.round(G.avgRepeat)),k:"Returning"},
    ], G.avgRepeat >= G.avgOnce ? 1 : 0));
    const top = el("div","card");
    G.top.slice(0,5).forEach(g=>{
      const r = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(g.name)}</b><em>${g.stays} stays${g.phone ? " · " + esc(g.phone) : ""}</em>`;
      const e = el("div","rowend");
      /* ZERO RUPEES IS NOT NO RUPEES. Most rows on the operator's book carry no
         amount at all, and printing a crisp Rs 0 against a guest who has stayed
         three times says they were worth nothing rather than that nobody wrote
         the figure down. */
      e.append(g.spend ? el("span","paid clear", money(g.spend))
                       : el("span","paid none", "no amount"));
      /* No number, no call button. A ☎ that dials "tel:" is a control that
         looks live and does nothing, which is worse than no control. */
      if(g.phone){
        const call = el("a","rowx");
        call.href = "tel:" + String(g.phone).replace(/[^\d+]/g,"");
        call.textContent = "☎";
        call.setAttribute("aria-label", "Call " + g.name);
        e.append(call);
      }
      r.append(m, e);
      top.appendChild(r);
    });
    if(!G.top.length) top.appendChild(el("div","empty","Nobody has booked twice yet — this fills in as guests return."));
    b.appendChild(top);
    said(c, G.repeat
      ? `Repeat guests are the cheapest revenue there is: no commission, no listing, no photographs. `
        + (!G.cmp
            ? `Whether yours are also worth more a night is not something this book can say yet — `
              + `${G.pricedRepeat} returning and ${G.pricedOnce} first-time bookings carry an amount.`
            : G.avgRepeat > G.avgOnce
            ? `Yours are also worth <span class="hi">${Math.round((G.avgRepeat/G.avgOnce - 1)*100)}% more a night</span> than first-timers.`
            : `They are worth about the same a night as a first-timer here, so the saving is the commission you did not pay.`)
        + (G.idBy === "name"
            ? ` These are matched on the name, because none of your bookings carry a phone number — so two guests `
              + `sharing one are counted as the same person here. Adding numbers as you take bookings makes this `
              + `exact, and gives you someone to actually ring.`
            : ` The numbers are in the export — that list is who to message when a week looks thin.`)
      : `This only counts once a guest turns up twice, so it grows with use. Entering a phone number as you take `
        + `each booking is what makes it exact.`);
  }

  /* ── UPKEEP ────────────────────────────────────────────────────────────── */
  if(seg === "upkeep"){
    const U = upkeepStats();
    const {c,b} = card("What upkeep costs", "the bill, and the nights it took");
    const head = el("div","headline");
    head.append(el("b", null, money(U.total)));
    head.append(el("s", null, `${U.jobs} spell${U.jobs===1?"":"s"} out of service · ${U.nights} night${U.nights===1?"":"s"} lost`
      + (U.onSale ? ` · ${U.onSale} fixed without going out` : "")));
    b.appendChild(head);
    if(U.total) b.appendChild(vbars([
      {v: U.bill, label: Math.round(U.bill/100)/10 + "k", k:"Invoices"},
      {v: U.lost, label: Math.round(U.lost/100)/10 + "k", k:"Lost nights"},
    ], U.lost > U.bill ? 1 : 0));
    said(c, U.total
      ? `The invoice is the half everybody counts. <b>${money(U.lost)}</b> is the half nobody does — the nights the flat `
        + `could not be sold while the work happened`
        + (U.lost > U.bill ? `, and here it is the <span class="hi">larger</span> of the two. That is the argument for paying more for someone who can come today.` : `.`)
        + (U.open ? ` ${U.open} thing${U.open===1?" is":"s are"} still waiting to be fixed.` : "")
      : `Nothing has gone out of service yet. When it does, this counts the bill and the nights together.`);
  }

  if(seg === "upkeep"){
    const U = upkeepStats();
    const {c,b} = card("Which flats cost you", "repairs and lost nights, by flat");
    const rows = el("div","card");
    U.flats.slice(0,6).forEach(g=>{
      const r = el("button","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(flats[g.fi].id)}</b><em>${g.jobs} spell${g.jobs===1?"":"s"} · ${g.nights} night${g.nights===1?"":"s"} lost</em>`;
      const e = el("div","rowend");
      e.append(el("span","paid " + (g.bill + g.lost > 0 ? "due" : "clear"), money(g.bill + g.lost)));
      r.append(m, e);
      r.onclick = ()=>{ haptic(9); openSheet(g.fi); };
      rows.appendChild(r);
    });
    if(!U.flats.length) rows.appendChild(el("div","empty","No flat has been out of service yet."));
    b.appendChild(rows);
    said(c, U.flats.length > 1
      ? `A flat that keeps appearing here is telling you something an average never will — that the money is going `
        + `into one address. Tap one to see what kept breaking.`
      : `Once a few repairs are logged this ranks the flats, which is how a quietly expensive one gets noticed.`);
  }

  if(seg === "upkeep"){
    const F = fixers();
    const {c,b} = card("Whose work sticks", "and whose comes back");
    const rows = el("div","card");
    F.forEach(g=>{
      const r = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(g.name)}</b><em>${g.jobs} job${g.jobs===1?"":"s"}`
                  + (g.spend ? ` · ${money(g.spend)}` : "") + `</em>`;
      const e = el("div","rowend");
      e.append(el("span", "paid " + (g.back ? "due" : "clear"),
                 g.back ? `${g.back} came back` : "none came back"));
      if(g.phone){
        const call = el("a","rowx");
        call.href = "tel:" + String(g.phone).replace(/[^\d+]/g,"");
        call.textContent = "☎";
        call.setAttribute("aria-label", "Call " + g.name);
        e.append(call);
      }
      r.append(m, e);
      rows.appendChild(r);
    });
    if(!F.length) rows.appendChild(el("div","empty","Nobody recorded yet. Put a name against a repair and this builds itself."));
    b.appendChild(rows);
    const worst = F[0];
    said(c, worst && worst.back
      ? `<b>${esc(worst.name)}</b> has had <span class="hi">${worst.back} of ${worst.jobs}</span> jobs come back within a month. `
        + `The trade calls this first-time fix rate; below about seven in ten, a cheaper tradesman costs more than a dearer one `
        + `because you pay for the second visit and lose the nights twice.`
      : `Nothing has come back within a month, which is what good work looks like. This is the number worth watching `
        + `before deciding who to keep calling.`);
  }

  if(seg === "rooms"){
    const curve = bookingCurve();
    const {c,b} = card("How your book fills", "occupancy by week ahead");
    const near = curve[0], far = curve[curve.length-1];
    const head = el("div","headline");
    head.append(el("b",null, Math.round(near.pct*100)+"%"));
    head.append(el("s",null, `this week, falling to ${Math.round(far.pct*100)}% by week ${curve.length}`));
    b.appendChild(head);
    b.appendChild(vbars(curve.map((x,i)=>({v:x.pct, label:Math.round(x.pct*100)+"", k:"W"+(i+1)})), 0,
      (r, i)=>{
        const from = i*7, to = Math.min(from+7, DAYS);
        let free = 0;
        for(let d = from; d < to; d++) for(let j = 0; j < NF; j++)
          if(!blk[j][d] && !occ[j][d]) free++;
        return {text: `<b>${fmt(from)} → ${fmt(to-1)}</b> · ${Math.round(r.v*100)}% booked · `
