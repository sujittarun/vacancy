<!--
  DIRECTION CONTRACT — Vacancy

  THESIS: The vacant room is the lit one. Booked is recessed material sitting close to
  the ground; free is high-luminance and pops off it — he is hunting vacancy, so vacancy
  glows. Refuses the ledger world shipped previously (paper, ruling, stamps) and the
  category default of pastel booking pills on white.

  OWN-WORLD: Near-monochrome instrument. #08090C ground, layered charcoal surfaces,
  hairline structure, one amber accent (#FFA23A) reserved for now/live. Big tight-tracked
  tabular numerals. Radii step from 22px sheets down to 2px data cells. One spring curve.

  STORY: He glances and knows how full he is; a caller names dates and he answers in one
  sentence; he checks a month and sees which weekends are gone.

  FIRST VIEWPORT: Tonight — a 76px free-room count over an occupancy meter, the next
  seven nights as a scroll-snapped strip, then all forty rooms as a tile field.

  FORM: Three concepts the user selected (10 Glance, 6 Month, 9 Word) integrated as one
  app with a blurred bottom tab bar and a shared spring-up room sheet.
-->
<meta charset="utf-8">
<title>Vacancy — 38 apartments, four ways to read them</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#08090C">

<!-- ── the theme is decided before the first pixel ──────────────────────────────
     Blocking and in the head on purpose. Two things depend on it:
       1. No flash. A theme applied from the main script runs after the first
          paint, so a light-mode phone would open on a black screen and blink.
       2. One code path. Because data-theme is ALWAYS present from here on, the
          stylesheet needs no @media (prefers-color-scheme) block and every
          light-only rule is written once, under :root[data-theme="light"].
     It also fixes a real bug: the toggle used to forget your choice on reload.
     Choosing a theme pins it; never choosing follows the phone, live.        -->
<script>
(function(){
  var KEY = "vacancy.theme", root = document.documentElement, saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  var sys = matchMedia("(prefers-color-scheme: light)");
  var apply = function(t){
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "light" ? "#E5E9F0" : "#08090C");
  };
  apply(saved === "light" || saved === "dark" ? saved : (sys.matches ? "light" : "dark"));
  // a phone that switches at sunset should switch with it, unless told otherwise
  sys.addEventListener("change", function(e){
    try{ if(localStorage.getItem(KEY)) return; }catch(err){}
    apply(e.matches ? "light" : "dark");
  });
  window.setTheme = function(t){
    apply(t); try{ localStorage.setItem(KEY, t); }catch(e){}
  };
})();
</script>

<style>
/* ══════════════════════ tokens ══════════════════════ */
:root{
  /* ── GEOMETRY — the same in every theme, so it is declared once, here ──────
     Five radii, going by SIZE rather than by kind: a corner is optical, so a
     38px icon button and a 56px full-width button genuinely should not share
     one. The rule is nesting — a thing inside a thing takes the step below it,
     which is what keeps a card's corner and the corner of the chip inside it
     concentric instead of accidentally equal. There were 22 distinct container
     radii before, ten of them a pixel from another, which is not a difference
     anyone chose or can see.

     These belong in :root and nowhere else. They were briefly declared inside
     the light block, and because ~70 of the rules that use them carry no
     [data-theme] guard, every one of those was invalid-at-computed-value-time
     in dark: `border-radius:var(--r-lg)` fell back to 0 and dark shipped with
     square corners on the sheet, both bars, and every pill, chip, field and
     card. A token in a theme block is a token that only exists in that theme.
     check-css.mjs blocks on this now. */
  --shell:430px;          /* the app is a phone-shaped column at any window size */
  --r-xs:9px;    /* ≤40px — room tiles, pills, the small round controls */
  --r-sm:11px;   /* 40–56px — chips, calendar cells, most buttons       */
  --r-md:14px;   /* 56–80px — the night strip, list rows, big fields    */
  --r-lg:18px;   /* cards and panes                                     */
  --r-xl:26px;   /* the sheet, and the bar that mirrors it              */

  /* The surface ladder's DARK values. Light overrides all of these in its own
     block. They are declared here rather than only there for the same reason
     the radii are: the moment any rule using them loses its guard, an
     undeclared token is not a fallback, it is nothing. Dark's are aliases of
     the frosted tokens it already ships, so naming them changes no pixels. */
  --s-flat:transparent;
  --s-raise:var(--g1);
  --s-cell:var(--g1);
  --s-float:var(--g3);
  --s-sunk:var(--g-sunk);
  --s-ink:var(--free);
  --s-raise-press:var(--press);
  --s-sunk-press:rgba(255,255,255,.09);
  --rim-raise:var(--g-edge);
  --rim-sunk:var(--sunk-edge);
  --rim-hair:var(--line);

  /* ── MATERIAL OPTICS — the one place glass is switched on or off ──────────
     Three depths, and every surface in the app reads its filter from one of
     them. Change a line here and every instance of that depth changes; there
     are no per-component blur literals left to hunt.

       --tint-0  data. The 45 room tiles, the calendar cells, the night strip.
                 NEVER glass in either theme: a counted number has to stay
                 sharp, and 45 backdrop-filters is a frame-rate bill for
                 nothing. Always `none`.
       --tint-1  panes and controls — cards, chips, fields, troughs.
       --tint-2  floating chrome — the sheet, both bars, a toast, the callout.

     DARK IS FLAT ON PURPOSE. --tint-1 is `none` here, so a card in dark is a
     dark fill on a dark ground and nothing else: that is the near-black the
     app is supposed to look like, and blurring a near-black ground buys
     nothing you can see anyway — it only costs a compositor pass per pane.
     --tint-2 keeps its blur because the sheet and the bars are the only
     surfaces with genuinely busy, moving content sliding underneath them, and
     that is what separation is for. To make dark fully flat, set --tint-2 to
     none as well; to bring the panes back, give --tint-1 var(--blur-1). */
  --tint-0:none;
  --tint-1:none;
  --tint-2:var(--blur-2);

  --bg:#08090C; --surface:#101219; --surface-2:#181B24; --surface-3:#1F2330;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  /* --txt-3 was #5C6579 and failed AA on every ground it is used on — 3.41 on
     --bg, 3.20 on --surface, 2.94 on --surface-2, against a 4.5 floor, across
     roughly forty-five rules of 10.5px uppercase label. --held-ink was #69738A
     and measured 3.46 on --held: that is the room number on every booked tile,
     and PRODUCT.md names reading the wrong row as THE failure mode of this app.
     Booked stays the recessed state — the fill still carries that — but its
     number is now readable. Found by measuring the rendered page rather than
     reading the table, while checking light. */
  --txt:#FFFFFF; --txt-2:#98A1B5; --txt-3:#868FA2;
  --free:#EAEFF9; --free-ink:#0A0C11; --held:#1B1F2A; --held-ink:#7E8AA3;
  --oos:#4E586E;
  --cal-ico:invert(1);   /* the OS calendar glyph is dark ink; dark needs it flipped */
  --now:#FFA23A; --now-ink:#FFA23A; --hot:#FF5F52;
  /* --ink is --free under another name. They hold the same value here, but they
     are not the same idea: --free is a WORLD STATE (this room is sellable) and
     --ink is a UI ROLE (this control is primary). Light mode is free to move one
     without the other, and this split is what stops the next person reaching for
     --free as a generic dark fill. */
  --ink:#EAEFF9; --ink-on:#0A0C11;
  /* One step above whatever it sits on. Dark's ladder climbs toward white and
     light's descends from it, so "raised" is not one colour — an element keyed
     to a fixed surface reads raised in one theme and recessed in the other,
     which in a system whose only rule is "the vacant room is the lit one" is a
     language error, not a shade being slightly off. */
  --raise:#1F2330;
  /* CRYSTAL, in the dark. The material was light-only, so a phone that prefers
     dark — which is the default this app opens in — saw no glass at all. Same
     optics inverted: a narrow bright streak, a rim that is a light hairline
     rather than a white edge, and the pane's thickness read as a dark line
     under the bottom instead of a bright one on top.

     The opacities are higher than light's. That is arithmetic again: in dark a
     FREE room tile is near-white, so chrome text sits on a pale backdrop rather
     than a dark one, and 52% would put white type on mid-grey. At 68% the grid
     still moves visibly under the bar and the type still clears. */
  --g1:rgba(24,28,38,.64);
  --g2:rgba(14,17,25,.68);
  --g3:rgba(19,23,32,.88);
  --g-tab:rgba(19,23,32,.72);   /* as light's: only strong ink rides on it */
  --g-sunk:rgba(255,255,255,.055);
  --g-edge:rgba(255,255,255,.13);
  --g-edge-2:rgba(255,255,255,.20);
  --g-inner:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.5);
  --blur-1:blur(18px) saturate(150%);
  --blur-2:blur(26px) saturate(160%);
  --blur-3:blur(34px) saturate(165%);
  --sheen:linear-gradient(128deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.02) 17%,
                          rgba(255,255,255,0) 34%);
  --sheen-soft:linear-gradient(128deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%);
  --lift:0 1px 1px rgba(0,0,0,.5), 0 3px 7px -3px rgba(0,0,0,.62);
  --lift-2:0 1px 2px rgba(0,0,0,.55), 0 9px 20px -10px rgba(0,0,0,.72);
  --on-glass:#EDF1F8;
  /* The two materials that carry STATE rather than depth: a trough cut into a
     pane, and the pane that lifts back out of it. They are tokens rather than
     literals because dark's raised pane is a LIGHTER DARK, not a near-white.
     Near-white is the vacancy semantic in this theme — every free room tile is
     one — so lending it to a selected control is the language error the file
     warns about above, not a shade being slightly off. It is also how the
     "1 night" chip shipped for a moment as white type on a white pane. */
  --sunk-edge:rgba(255,255,255,.09);
  --g-sunk-inner:inset 0 1px 2px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.06);
  --pane:var(--raise);
  --pane-inner:inset 0 1px 0 rgba(255,255,255,.14);
  --press:rgba(46,53,70,.86);   /* the pane brightening under a finger */
  --bar:var(--g2);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
  --spring:linear(0,.0088,.0352 2.2%,.1428 4.9%,.5106 12%,.6672,.7896,.8752,.9345 20.6%,.9707,.9955 26.2%,1.0122,1.0202 32.1%,1.0193 37.1%,1.0083 45.4%,1.0003 55.4%,.9986 71%,1);
  --out:cubic-bezier(.22,1,.36,1);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* There is no @media (prefers-color-scheme:light) block. The theme is stamped
   onto <html> as data-theme before first paint (see the head script below), so
   light has exactly ONE code path. The two-guard version of this file needed
   every light-only rule written twice, and a rule added to one guard and not
   the other breaks only for users who touched the toggle — which is precisely
   the silent-regression shape that produced this rewrite. */
:root[data-theme="light"]{
  /* ── LIGHT IS ITS OWN DESIGN, NOT AN INVERSION ────────────────────────────
     The first light mode was the dark palette flipped. Flipping puts --bg,
     --surface, --surface-2, --surface-3 and --held inside a 7%-lightness fog
     where nothing reads as raised, and it resolves "vacant = maximum contrast"
     into a solid near-black tile — which on a white page reads as a redaction,
     not as a lit window. Measured casualties: the room number on 45 booked
     tiles at 1.98:1, its type label at 1.50:1, every 10.5px uppercase label at
     ~3.0:1, the out-of-service hatch at 1.087:1 (invisible), the top bar at
     1.044:1 against the page.

     So: a real floor (--bg drops 7.8 L* below white) with white as the only
     ceiling, a strictly monotonic ladder down from it, and --free lifted off
     pure black to a deep slate that carries a shadow — an object lying on the
     page rather than a hole cut through it. --surface-3 deliberately sits BELOW
     --held here: light has no headroom above white, so depth runs downward and
     surface-3 is the pressed well, not a raised plate. Do not "fix" that.      */
  --bg:#E5E9F0; --surface:#FFFFFF; --surface-2:#DBDFE9; --surface-3:#B7C0D2;
  --line:rgba(13,16,23,.15); --line-2:rgba(13,16,23,.26);
  /* Both secondaries are darker than a light theme would normally want them,
     and that is the price of a sheet you can see through. Measured: over the
     worst ground the sheet can sit on — a run of near-black FREE tiles, dimmed
     by the scrim, seen through the pane — the lightest ink that still clears
     4.5 is rgb(57,63,78). The old --txt-3 (#596174) managed 2.67 there. So the
     greys come down to meet the glass.
     Hierarchy therefore stops being carried by lightness and is carried by
     size and weight instead, which is what the top bar already does and what
     this design system says type should be doing anyway. */
  --txt:#0D1017; --txt-2:#2D3442; --txt-3:#363C4A;
  /* BOOKED IS THE RECESSED STATE, and at #C9D0DE it had stopped being a state
     at all: measured against the light ground it reached 1.04:1 on the ground's
     brighter regions — the tile and the page were the same colour, and once the
     room grid moved down the page under its filter row, identical tiles read as
     different greys depending which building they sat under.

     The fill alone could not be darkened. Light renders the tile's 9px label at
     .9 opacity, and at anything past #C2CAD9 that composite drops under AA —
     which only lifts the worst ground case to 1.11, barely moving the problem.
     So the ink moves with the fill, the same pairing this file already made
     once when --held-ink was #69738A and measured 3.46 here.

     Searched over both ramps, scoring the ground's BRIGHTEST region rather than
     its mean, because that is where the tile disappeared:
        before   ground 1.04-1.16   number 6.11   9px label 4.92
        now      ground 1.28-1.43   number 6.37   9px label 5.18
     The tile gains a quarter of a stop against its worst ground and both inks
     on it gain as well. --free still dominates at 8.2:1, so booked stays quiet
     and vacancy still owns the loud end of the scale. */
  --free:#1C2331; --free-ink:#F2F5FB; --held:#B2BCD0; --held-ink:#2F3642;
  --oos:#747E92;
  --cal-ico:none;
  /* One orange cannot be both a live fill and 4.5:1 text on white. --now is the
     fill and keeps dark's hue (OkLCh H 64.7 against dark's 64.2, so the accent
     is the same colour in both themes); --now-ink is every accented word, rule
     and thin bar. The old #C96A00 was not desaturated, it was dark — 41.8 L*
     below its ground, which is the definition of brown. */
  --now:#F59300; --now-ink:#8A4A00; --hot:#B8281A;
  --ink:#1C2331; --ink-on:#F2F5FB;
  --raise:#FFFFFF;
  /* --bar predates the material and was never folded into it, so the top bar
     sat at 88% — effectively solid — while every rule around it said glass.
     It IS the L2 material; it should not have a second opinion. */
  --bar:var(--g2);
  --scrim:rgba(28,32,42,.32);   /* the sheet is glass over the screen, not over a blackout */
  --shadow:0 1px 2px rgba(13,16,23,.15), 0 12px 32px -12px rgba(13,16,23,.38);
  --shadow-sm:0 1px 2px rgba(13,16,23,.12), 0 4px 12px -4px rgba(13,16,23,.22);
}
:root[data-theme="dark"]{
  --bg:#08090C; --surface:#101219; --surface-2:#181B24; --surface-3:#1F2330;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#FFFFFF; --txt-2:#98A1B5; --txt-3:#868FA2;
  --free:#EAEFF9; --free-ink:#0A0C11; --held:#1B1F2A; --held-ink:#7E8AA3;
  --oos:#4E586E;
  --cal-ico:invert(1);
  --now:#FFA23A; --now-ink:#FFA23A; --hot:#FF5F52;
  --ink:#EAEFF9; --ink-on:#0A0C11;
  --raise:#1F2330;
  /* CRYSTAL, in the dark. The material was light-only, so a phone that prefers
     dark — which is the default this app opens in — saw no glass at all. Same
     optics inverted: a narrow bright streak, a rim that is a light hairline
     rather than a white edge, and the pane's thickness read as a dark line
     under the bottom instead of a bright one on top.

     The opacities are higher than light's. That is arithmetic again: in dark a
     FREE room tile is near-white, so chrome text sits on a pale backdrop rather
     than a dark one, and 52% would put white type on mid-grey. At 68% the grid
     still moves visibly under the bar and the type still clears. */
  --g1:rgba(24,28,38,.64);
  --g2:rgba(14,17,25,.68);
  --g3:rgba(19,23,32,.88);
  --g-tab:rgba(19,23,32,.72);   /* as light's: only strong ink rides on it */
  --g-sunk:rgba(255,255,255,.055);
  --g-edge:rgba(255,255,255,.13);
  --g-edge-2:rgba(255,255,255,.20);
  --g-inner:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.5);
  --blur-1:blur(18px) saturate(150%);
  --blur-2:blur(26px) saturate(160%);
  --blur-3:blur(34px) saturate(165%);
  --sheen:linear-gradient(128deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.02) 17%,
                          rgba(255,255,255,0) 34%);
  --sheen-soft:linear-gradient(128deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%);
  --lift:0 1px 1px rgba(0,0,0,.5), 0 3px 7px -3px rgba(0,0,0,.62);
  --lift-2:0 1px 2px rgba(0,0,0,.55), 0 9px 20px -10px rgba(0,0,0,.72);
  --on-glass:#EDF1F8;
  /* The two materials that carry STATE rather than depth: a trough cut into a
     pane, and the pane that lifts back out of it. They are tokens rather than
     literals because dark's raised pane is a LIGHTER DARK, not a near-white.
     Near-white is the vacancy semantic in this theme — every free room tile is
     one — so lending it to a selected control is the language error the file
     warns about above, not a shade being slightly off. It is also how the
     "1 night" chip shipped for a moment as white type on a white pane. */
  --sunk-edge:rgba(255,255,255,.09);
  --g-sunk-inner:inset 0 1px 2px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.06);
  --pane:var(--raise);
  --pane-inner:inset 0 1px 0 rgba(255,255,255,.14);
  --press:rgba(46,53,70,.86);   /* the pane brightening under a finger */
  --bar:var(--g2);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── press answers instantly; the spring is for the release ───────────────────
   Every control here springs on `transform`, and a spring is a ~380ms curve. Run
   it on the way *down* and the button appears to lag the thumb by a third of a
   second — the single largest reason an app that is fast still feels slow. The
   press is therefore a fast ease and only the release springs back. Same two
   rules, opposite directions, which is how a physical button behaves.        */
.ghost:active, .tabbar button:active, .tile:active, .night:active, .opp:active,
.dcell:active, .line:active, .nudgeBtn:active, .day:active,
.field button:active, .copybtn:active, .chips button:active, .step button:active,
.srcRow button:active, .bkgo:active, .paid.due:active, .bookbtn:active,
.blockbtn:active, .invAdd:active, .invSave:active, .pill:active, .gate .go:active,
.rowx:active, .toast:active{
  transition-duration:.085s; transition-timing-function:cubic-bezier(.3,0,.1,1);
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ui);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5; overscroll-behavior:none;
}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
/* A LONG PRESS IS A GESTURE, NOT A SELECTION. Holding a room tile is how you
   see its timeline, and on a touch device the browser's own long-press ran
   first: it selected the word "BOOKED", raised the copy bubble, and the peek
   either never appeared or appeared under a selection highlight. Nothing in
   this app is a button AND a passage of text, so no button is selectable, and
   the iOS callout is off for the same reason. Inputs are untouched — they are
   the one place a selection is the point. */
button{background:none;border:0;padding:0;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--now);outline-offset:2px;border-radius:4px}

/* ══════════════════════ shell ══════════════════════ */
/* ── THE SHELL IS A PHONE, ON ANY SCREEN ─────────────────────────────────────
   This app is one-handed and phone-first — 375x812 is the design target and
   every measurement in DESIGN.md is taken there. With no cap it simply stretched
   to whatever the window was, and the Month calendar was where that stopped
   being cosmetic: seven `1fr` columns across 1280px made each day cell 170x194
   instead of 47x55, so a 224px trough held 2,467px of grid and the operator saw
   one and a bit weeks of a nine-week calendar, the rest clipped.

   Every other layer — tabbar, sheet, scrim, toasts — is position:absolute inside
   this element, so capping it here carries all of them without touching one of
   their rules.

   430px, not 375: the width of a large phone, so the column looks deliberate on
   a laptop rather than starved, and every internal measurement stays fluid
   inside it. The hairline only appears once the window is actually wider than
   the shell, so a real phone never wears an edge it has no room for. */
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:var(--shell);margin-inline:auto}
@media (min-width:calc(430px + 1px)){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

.topbar{
  position:relative;z-index:30;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;
  background:var(--bar);backdrop-filter:var(--tint-2);
  -webkit-backdrop-filter:var(--tint-2);
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;gap:0;
}
.topbar-r{display:flex;align-items:center;gap:12px}
/* large title condenses on scroll — transform/opacity only, never layout */
.topbar h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.022em;flex:1;min-width:0;
  transform-origin:left center;transition:transform .2s var(--out);will-change:transform}
.topbar .sub{font-size:12px;color:var(--txt-3);font-weight:450;letter-spacing:0;display:block;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .16s var(--out)}
.topbar.tight h1{transform:scale(.84)}
.topbar.tight .sub{opacity:.5}
@media (prefers-reduced-motion:reduce){.topbar h1,.topbar .sub{transition:none}}
.ghost{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-xs);
  background:var(--surface-2);font-size:12px;font-weight:550;color:var(--txt-2);
  border:1px solid var(--line);transition:transform .35s var(--spring), background .18s;
}
.ghost:active{transform:scale(.94);background:var(--surface-3)}

.screens{flex:1;min-height:0;position:relative}
/* ── pull down to reload ──────────────────────────────────────────────────────
   Added to the home screen this runs standalone: no address bar, no reload
   button, and therefore no way to start the app again short of killing it. The
   gesture every phone owner already has is the pull, so that is the one it
   answers to.

   It sits BEHIND the screens rather than being pushed ahead of them. A screen
   is `position:absolute;inset:0`, so translating it down uncovers this instead
   of shoving a strip of chrome around, and the whole indicator costs one
   transform on an element nobody scrolls.                                    */
.ptr{
  position:absolute;left:0;right:0;top:0;height:64px;z-index:0;
  display:grid;place-items:center;pointer-events:none;
}
.ptr i{
  display:block;width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line-2);border-top-color:var(--txt-3);
  opacity:var(--ptr-o,0);
  transform:rotate(calc(var(--ptr-p,0) * 300deg)) scale(calc(.55 + var(--ptr-p,0) * .45));
}
/* armed: it stops following the finger and starts spinning, which is the only
   moment the gesture has to promise something is actually going to happen */
.ptr.armed i{border-top-color:var(--now);animation:ptrSpin .7s linear infinite}
@keyframes ptrSpin{to{transform:rotate(360deg) scale(1)}}
.screen.pulling{transition:none}
.screen.letgo{transition:transform .42s var(--spring)}
@media (prefers-reduced-motion:reduce){
  .ptr.armed i{animation:none;border-top-color:var(--now)}
  .screen.letgo{transition:transform .16s linear}
}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:22px 20px calc(112px + var(--safe-b));
  display:flex;flex-direction:column;gap:30px;
  visibility:hidden;opacity:0;pointer-events:none;
}
.screen.on{visibility:visible;opacity:1;pointer-events:auto}
/* a scrolling flex column must not shrink its sections to fit — that clips
   any child with overflow:hidden (the calendar card) down to a sliver */
.screen > *{flex:0 0 auto}

/* ── entry, once ──────────────────────────────────────────────────────────────
   A staggered entrance is a first-impression device. On a tab this operator
   swipes to fifty times a day it stops being polish and becomes a wait: the
   last section used to settle two thirds of a second after the thumb landed.
   So it plays the first time a screen is opened and never again — the class
   below is added after that first paint. Delight belongs to moments, not to
   every arrival.                                                             */
.screen.on:not(.seen) > *{animation:rise .34s var(--out) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.screen.on > *:nth-child(2){animation-delay:.03s}
.screen.on > *:nth-child(3){animation-delay:.06s}
.screen.on > *:nth-child(4){animation-delay:.09s}
.screen.on > *:nth-child(5){animation-delay:.12s}
/* Matched to the rule it is replacing, :not(.seen) and all. A media query adds
   no specificity of its own, so `.screen.on > *` (0,2,0) never beat
   `.screen.on:not(.seen) > *` (0,3,0): someone who asked their phone for no
   motion got the full staggered rise anyway, and then fade fired as a SECOND
   unwanted animation when .seen landed at 480ms. */
@media (prefers-reduced-motion:reduce){
  .screen.on:not(.seen) > *{animation:fade .2s backwards}
  @keyframes fade{from{opacity:0}}
}

.tabbar{
  position:absolute;left:14px;right:14px;bottom:calc(12px + var(--safe-b));z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;
  background:var(--bar);backdrop-filter:var(--tint-2);
  -webkit-backdrop-filter:var(--tint-2);
  border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);
}
.tabbar button{
  padding:9px 4px 8px;border-radius:var(--r-md);display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--txt-3);font-size:10.5px;font-weight:600;
  /* transform is in the list because :active scales this to .95 and it was the
     only property not being transitioned — so the most-tapped control in a
     four-tab app was the one control that snapped instead of springing. */
  letter-spacing:.01em;
  transition:color .2s, background .3s var(--out), transform .35s var(--spring);
}
.tabbar button .ic{width:19px;height:19px;display:block}
.tabbar button[aria-selected="true"]{color:var(--txt);background:var(--surface-2)}
.tabbar button:active{transform:scale(.95)}

/* ══════════════════════ primitives ══════════════════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden}
.lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 11px}
.sect .lbl:last-child, .sheet-s .lbl:last-child, .strip-k .lbl:not(:first-child){
  text-transform:none;letter-spacing:.005em;font-weight:500;font-size:11.5px}
.stack{display:flex;flex-direction:column}
.gap-l{gap:22px} .gap-m{gap:12px} .gap-s{gap:8px}

/* room tile — the atom of the whole app */
.tile{
  position:relative;border-radius:var(--r-xs);padding:9px 8px 8px;text-align:left;
  background:var(--held);border:1px solid transparent;
  transition:transform .38s var(--spring), background .2s;
  min-height:56px;display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{transform:scale(.93)}
/* HELD, AND SHOWING. The peek opens as a panel elsewhere on the screen, so
   without this the tile the operator's thumb is on gives no sign it is the one
   being described — with 38 tiles and a thumb covering one, that is a real
   question. It holds the pressed geometry rather than springing back, and takes
   the app's focus ring so the link between finger and panel is unmistakable. */
.tile.peeking{transform:scale(.93);box-shadow:0 0 0 2px var(--now);z-index:2}
.tile b{display:block;font-size:13px;font-weight:620;letter-spacing:-.01em;color:var(--held-ink)}
.tile s{display:block;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--held-ink);opacity:.62;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.free{background:var(--free)}
.tile.free b{color:var(--free-ink)}
.tile.free s{color:var(--free-ink);opacity:.58}
/* a turnover room is let tonight — it just has to be cleaned first, so it reads
   as booked and carries a corner flag rather than a split fill that eats the text */
.tile.oos{background:repeating-linear-gradient(135deg,
  var(--held) 0 6px, color-mix(in srgb,var(--held) 55%, var(--bg)) 6px 12px)}
.tile.oos b, .tile.oos s{color:var(--held-ink)}
.tile.oos s{opacity:.9}
.tile.turn{background:var(--held)}
.tile.turn b{color:var(--held-ink)}
.tile.turn s{color:var(--now);opacity:1}
.tile.turn::after{content:"";position:absolute;top:0;right:0;width:17px;height:17px;
  background:var(--now);clip-path:polygon(100% 0,0 0,100% 100%);border-top-right-radius:9px}
/* an orphan night — free, but wedged between two bookings, so hard to sell */
.tile .flag{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;
  /* The ring was 2px of var(--free) — the same fill as the tile underneath it,
     so the dot had nothing to separate FROM and measured 1.74:1 in dark. This
     is the whole signal that a free night is wedged between two bookings and
     will not sell at rate, on a 6px dot. A hairline of the tile's own INK
     first, then the fill, is the same trick the boundary states already use. */
  background:var(--now);box-shadow:0 0 0 1px var(--free-ink), 0 0 0 3px var(--free)}

/* stay-length dial — reshapes the whole fortnight */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;background:var(--surface);
  border-radius:var(--r-xs);box-shadow:var(--shadow-sm);transition:transform .44s var(--spring);
  pointer-events:none}
.seg button{position:relative;z-index:1;padding:9px 2px;font-size:12.5px;font-weight:600;
  letter-spacing:-.008em;color:var(--txt-3);transition:color .22s}
.seg button[aria-pressed="true"]{color:var(--txt)}
@media (prefers-reduced-motion:reduce){.seg-ind{transition:none}}

/* month key */
.key{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.keyitem{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-2);line-height:1.4}
.keychip{flex:0 0 auto;width:34px;height:38px;border-radius:var(--r-xs);background:var(--surface);
  border:1px solid var(--line);position:relative;display:grid;place-items:center}
.keychip u{text-decoration:none;font-size:15px;font-weight:680;letter-spacing:-.03em}
.keychip i{position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:2px;background:var(--surface-3)}
.keychip i b{display:block;height:100%;width:58%;border-radius:2px;background:var(--free)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;
  font-size:11px;font-weight:600;letter-spacing:.01em;background:var(--surface-2);color:var(--txt-2);
  border:1px solid var(--line);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--free) 14%,transparent);color:var(--txt);border-color:var(--line-2)}
.pill.warn{background:color-mix(in srgb,var(--hot) 15%,transparent);color:var(--hot);border-color:transparent}
.pill.now{background:color-mix(in srgb,var(--now) 16%,transparent);color:var(--now);border-color:transparent}

/* room list row, shared by Month + Ask + sheet */
.row{display:grid;grid-template-columns:60px 1fr auto;gap:11px;align-items:center;
  padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;
  transition:background .16s}
.row:last-child{border-bottom:0}
/* A booking row carries money, which is wide, so it drops the separate date
   column — the dates are already spelled out on the second line, and the guest's
   name is what the eye is actually hunting for. */
.row.bk{grid-template-columns:1fr auto}
.row.bk .meta b{font-size:13.5px;font-weight:620;color:var(--txt);letter-spacing:-.015em}
.row:active{background:var(--surface-2)}
.row .id{font-size:13.5px;font-weight:640;letter-spacing:-.02em;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--txt-2);line-height:1.35;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A room row is one line and ellipsises — right for "3 BHK · TreeTops", wrong
   for a move, where the sentence ends in the destination room number and that
   number is the whole answer. "Move S. Kulkarni to TT-2…" is not an answer. */
.row.move .meta{white-space:normal;overflow:visible;text-overflow:clip}
/* a room number never breaks across a line. PRODUCT.md calls confusing TT-203
   with TT-204 the failure mode of this app, and "TT-" on one line with "203" on
   the next is the same mistake with extra steps. */
.row.move .meta .rm{white-space:nowrap;text-decoration:none}
.row.move .meta em{white-space:normal;line-height:1.4}
.row.move{align-items:flex-start}
.row.move .id, .row.move .pill{margin-top:2px}
.row .meta b{color:var(--txt);font-weight:560}
.row .meta em{font-style:normal;display:block;color:var(--txt-3);font-size:11.5px;margin-top:2px}

.empty{padding:30px 20px;text-align:center;color:var(--txt-3);font-size:13px;line-height:1.55}

/* ══════════════════════ TONIGHT ══════════════════════ */
/* the day's operations — what actually has to happen, not another copy of the free count */
.ops{padding:2px 2px 0}
.ops-date{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.ops-date b{font-size:23px;font-weight:680;letter-spacing:-.032em}
.ops-date s{text-decoration:none;font-size:12.5px;color:var(--txt-3);font-weight:500}
.ops-row{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
/* THREE BUTTONS THAT DID NOT LOOK LIKE BUTTONS. Left-aligned text in equal
   thirds reads as a table — the operator asked whether it was even tappable —
   and the only affordance was an :active background nobody sees until after
   they have committed to the tap. Centred, so the trio balances, and each
   label carries the same "›" the app already uses wherever something opens.
   Padding drops 8px→6px and tracking .055em→.03em to pay for the glyph:
   "TURNAROUND" had 16px of slack and ellipsised outright on a narrower phone. */
.op{padding:14px 6px 12px;text-align:center;position:relative;border-right:1px solid var(--line);
  transition:background .16s}
.op:last-child{border-right:0}
.op:active{background:var(--surface-2)}
.op b{display:block;font-size:30px;font-weight:690;letter-spacing:-.04em;line-height:1}
.op s{display:block;text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--txt-3);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The button already carries an aria-label naming what it opens, so this is
   decoration and must not be read out as content. */
.op s::after{content:"›";margin-left:4px;font-weight:700;opacity:.75;speak:never}
.op.zero b{color:var(--txt-3)}
.op.alert b{color:var(--now)}
.op.alert s{color:var(--now)}
.op .dot{position:absolute;top:12px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--now)}

.nights{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 20px 2px 0;margin:0 -20px 0 0;scrollbar-width:none}
.nights::-webkit-scrollbar{display:none}
.night{flex:0 0 78px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px 10px 11px;display:flex;flex-direction:column;gap:9px;
  transition:transform .38s var(--spring)}
.night:active{transform:scale(.95)}
.night .d{display:flex;align-items:baseline;justify-content:space-between;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-3)}
.night .d em{font-style:normal;font-size:11.5px;font-weight:650;letter-spacing:-.01em;
  text-transform:none;color:var(--txt-2);flex:0 0 auto}
.night.today .d em{color:var(--now)}
.night .n{font-size:25px;font-weight:680;letter-spacing:-.035em;line-height:1}
.night .t{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.night .t i{display:block;height:100%;background:var(--free);border-radius:2px}
.night.today{border-color:color-mix(in srgb,var(--now) 55%,transparent);
  background:color-mix(in srgb,var(--now) 8%,var(--surface))}
.night.today .d{color:var(--now)}
.night.full .n{color:var(--hot)}
.night.full .t i{background:var(--hot)}
/* A selection ring made of a 1px border PLUS a 1px outer spread shadow is two
   rings, and they cannot stay parallel: the outer one inherits the element's
   border-radius rather than radius+spread, so it runs wide at the corners and
   tight on the straights. That is the uneven black edge. An INSET ring shares
   the border's own rounded rect exactly, so border + inset reads as one clean
   2px ring on every side. Same fix wherever a ring is doubled. */
.night.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
/* ── EVERY ROOM, BY PROPERTY ────────────────────────────────────────────────
   Thirty-eight tiles in one undifferentiated field is ten rows of scrolling
   with no landmarks, and the operator does not think in one portfolio — the
   five buildings are in five parts of Hyderabad and get visited separately.
   So the grid is cut by building, and the same row of chips that names the
   buildings also filters to one. Chips reuse .tabseg, which is already the
   app's word for "pick one of these"; the counts on them are live, so the row
   doubles as a per-building free count for the night in the dial. */
/* Its own control, not a copy of the tab chips. Those are 12.5px pills sized
   for a thumb travelling a top bar; this row sits mid-screen above a dense
   grid and has to carry six items without shouting over the tiles it filters.

   So: smaller type, tighter box, and the COUNT BROKEN OUT into its own badge —
   which is the part the operator is actually reading. The badge is tinted by
   what it says (free reads in the free colour, nought reads muted), so the row
   is a per-building availability glance first and a filter second, and the eye
   can skip the names entirely when it just wants to know where the space is.

   The right edge fades rather than being cut off by the card, because the row
   scrolls and a hard clip hides that fact. */
.roomfilt{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  margin:0 -20px;padding:1px 20px 3px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent 100%)}
.roomfilt::-webkit-scrollbar{display:none}
.roomfilt button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:5px 7px 5px 10px;border-radius:var(--r-xs);
  /* base for the no-glass path; the material block above overrides both of
     these for the unchosen state */
  background:var(--surface-2);border:1px solid var(--line);
  font-size:11.5px;font-weight:600;letter-spacing:-.005em;color:var(--txt-2);
  white-space:nowrap;transition:transform .38s var(--spring),background .18s,color .18s}
.roomfilt button:active{transform:scale(.95);transition-duration:.085s}
.roomfilt button i{font-style:normal;min-width:17px;padding:1.5px 4px;border-radius:5px;
  font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;
  font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--free) 17%,transparent);color:var(--free)}
/* nought free is not a quantity to celebrate — it drops to the muted pair */
.roomfilt button i.none{background:var(--surface-3);color:var(--txt-3)}
.roomfilt button[aria-selected="true"]{background:var(--free);color:var(--free-ink);
  border-color:transparent}
.roomfilt button[aria-selected="true"] i{background:color-mix(in srgb,var(--free-ink) 20%,transparent);
  color:var(--free-ink)}
.roomfilt button[aria-selected="true"] i.none{background:color-mix(in srgb,var(--free-ink) 13%,transparent);
  color:color-mix(in srgb,var(--free-ink) 68%,transparent)}
/* Closer, and quieter. Splitting one continuous field of 38 tiles into five
   groups gave every group a heading and a rule, and that chrome ended up
   competing with the tiles it was meant to organise — the grid stopped reading
   as one dense block. The heading earns its line; it does not need a cut across
   the card as well. */
.bsec + .bsec{margin-top:9px}
.bsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin:0 0 5px;padding-bottom:3px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.bsec-h b{font-size:11px;font-weight:680;letter-spacing:.07em;text-transform:uppercase;
  color:var(--txt-2)}
.bsec-h s{text-decoration:none;font-size:11px;font-weight:600;color:var(--txt-3);
  white-space:nowrap;flex:0 0 auto}
.bsec-h s.none{color:var(--txt-3);opacity:.7}

/* ══════════════════════ MONTH — perspective panels ══════════════════════ */
.monthbar{margin:-4px 2px 14px}
.mbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar i.sold{background:var(--free)}
.mbar i.soon{background:var(--now)}
.mcap{margin-top:8px;font-size:12px;color:var(--txt-3);line-height:1.45}
.mcap b{color:var(--txt);font-weight:650}
.mcap em{font-style:normal;color:var(--now)}

/* a date running emptier than its own weekday usually does */
.day.soft .fn{color:var(--now)}
.day.soft .gg i{background:var(--now)}
.day.soft::after{content:"";position:absolute;top:6px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--now)}

/* ══════════════════════ TRENDS — swipeable card deck ══════════════════════ */
/* A vertical stack, not a carousel. Horizontal decks hide their contents behind
   a gesture with no preview — you cannot tell what is there or how much. On a
   phone, vertical scroll is the native, discoverable motion; nothing hides. */
.deck{display:flex;flex-direction:column;gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);padding:15px 14px 14px;display:flex;flex-direction:column;
  transition:opacity .3s var(--out), transform .34s var(--out)}
.tcard.pending{opacity:0;transform:translateY(12px)}
@media (prefers-reduced-motion:reduce){
  .tcard.pending{opacity:1;transform:none}
  .tcard{transition:none}
}
.tcard h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.018em}
.tcard .cap{margin:3px 0 12px;font-size:11.5px;color:var(--txt-3);letter-spacing:.01em}
.tcard .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.tcard .body > .act:first-child{border-top:0}
.tcard .said{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--txt-2)}
.tcard .said b{color:var(--txt)}
.tcard .said .hi{color:var(--now);font-weight:600}
/* bars grow from nothing as their section arrives — transform only, no layout */
.vbar .col i, .patrow .t i, .wrow .t i, .wrow .hr{transition:transform .42s var(--out)}
.vbar .col i{width:100%;transform-origin:bottom;transform:scaleY(var(--v,1))}
.patrow .t i{width:100%;transform-origin:left center;transform:scaleX(var(--v,1))}
.tcard.pending .vbar .col i{transform:scaleY(0)}
.tcard.pending .patrow .t i,
.tcard.pending .wrow .t i, .tcard.pending .wrow .hr{transform:scaleX(0)}
@media (prefers-reduced-motion:reduce){
  .tcard.pending .vbar .col i{transform:scaleY(var(--v,1))}
  .tcard.pending .patrow .t i,
  .tcard.pending .wrow .t i, .tcard.pending .wrow .hr{transform:scaleX(var(--v,1))}
  .vbar .col i, .patrow .t i, .wrow .t i, .wrow .hr{transition:none}
}

/* opportunity tiles — a number and a label; the detail lives one tap away */
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;
  box-shadow:var(--shadow-sm);transition:transform .38s var(--spring)}
.opp:active{transform:scale(.96)}
.opp b{font-size:27px;font-weight:700;letter-spacing:-.04em;line-height:1}
.opp s{text-decoration:none;font-size:11px;color:var(--txt-2);line-height:1.3}
.opp.hot b{color:var(--now)}
.opp.zero b{color:var(--txt-3)}
.opp.zero s{color:var(--txt-3)}

/* When there is genuinely nothing to act on, one quiet line beats an empty
   card. It still confirms the check happened — silence alone is ambiguous. */
.allclear{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm)}
.allclear .tick{flex:0 0 auto;width:18px;height:18px;border-radius:50%;
  background:color-mix(in srgb,var(--free) 18%,transparent);display:grid;place-items:center;
  color:var(--free);font-size:11px;font-weight:700;margin-top:1px}
.allclear div{font-size:12.5px;line-height:1.5;color:var(--txt-2)}
.allclear b{color:var(--txt);font-weight:600}

/* ── the board ───────────────────────────────────────────────────────────────
   Grouped by the response each thing needs, so a decision never looks like a
   discount idea, and extra items thicken a figure instead of adding a row. */
.board{display:flex;flex-direction:column;gap:13px}
.bsec{display:flex;flex-direction:column;gap:6px}
.bsec > .lbl{margin:0 2px}

/* DECIDE — a question with its answers attached */
.decide{padding:12px 13px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--hot) 7%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--hot) 26%,transparent)}
.decide > b{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.decide > s{display:block;text-decoration:none;font-size:11.5px;color:var(--txt-2);
  margin-top:3px;line-height:1.4}

/* PERISHING — figures side by side, not two list rows saying the same thing */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcell{padding:11px 11px 10px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;
  transition:transform .38s var(--spring)}
.dcell:active{transform:scale(.96)}
.dcell .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}
.dcell .n{font-size:26px;font-weight:700;letter-spacing:-.045em;line-height:1.05}
.dcell .s{font-size:11px;color:var(--txt-2);line-height:1.35}
.dcell .d{margin-top:6px;align-self:flex-start;font-size:11px;font-weight:650;color:var(--now);
  background:color-mix(in srgb,var(--now) 15%,transparent);padding:3px 8px;border-radius:7px}
.dcell.urgent{border-color:color-mix(in srgb,var(--now) 38%,transparent);
  background:color-mix(in srgb,var(--now) 7%,var(--surface-2))}
.dcell.urgent .n{color:var(--now)}
/* --txt-3 is calibrated against a plain surface. An urgent cell is not one: it
   carries an amber wash, and once that wash mixed into the glass pane the label
   landed at 4.05:1 at 9.5px, under the 4.5 it owes. The wash is the thing that
   changed, so the ink on it changes too. */
.dcell.urgent .k{color:var(--txt-2)}

/* one-line rows for everything that is simply a count with a destination */
.line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);width:100%;text-align:left;
  transition:transform .38s var(--spring)}
.line:active{transform:scale(.98)}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:13px;font-weight:620;letter-spacing:-.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .t s{display:block;text-decoration:none;font-size:11px;color:var(--txt-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .chev{flex:0 0 auto;color:var(--txt-3);font-size:16px;line-height:1}

/* the advert summary — what you have to sell, in words a guest understands */
.advert{margin:16px 20px 0;padding:15px 16px 16px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--now) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--now) 28%,transparent)}
.advert-head{font-size:19px;font-weight:680;letter-spacing:-.025em;color:var(--now);margin:5px 0 12px}
.advert-list{display:flex;flex-direction:column;gap:8px}
.advert-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.advert-row b{font-size:14px;font-weight:620;letter-spacing:-.012em;white-space:nowrap;flex:0 0 auto}
.advert-row s{text-decoration:none;font-size:12.5px;color:var(--txt-2);text-align:right;min-width:0}

/* the action feed — what to do, above everything you have to interpret */
.act{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;
  border-bottom:1px solid var(--line);width:100%;text-align:left}
.act:last-child{border-bottom:0}
.act:active{background:var(--surface-2)}
.act .mark{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--txt-3);margin-top:5px}
.act.warn .mark{background:var(--hot)}
.act.good .mark{background:var(--now)}
.act .txt{flex:1;min-width:0}
.act > .pill{flex:0 0 auto;margin-top:2px}
/* The `\n` that used to sit before white-space was a literal backslash-n in the
   stylesheet, not a newline. CSS reads it as an escape, the declaration it
   started is discarded, and the single-line ellipsis this rule exists for could
   never fire. */
.act .txt b{display:block;font-size:13.5px;font-weight:620;letter-spacing:-.012em;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .txt s{text-decoration:none;font-size:11.5px;color:var(--txt-3);
  line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.nudge{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}

/* days slider — drag to choose how much longer the flat stays out */
.exts{margin-top:10px;padding:10px 12px 9px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line)}
.exts-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.exts-head b{font-size:11.5px;font-weight:600;color:var(--txt-2);letter-spacing:.01em}
.exts-head u{text-decoration:none;font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--now)}
.exts-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.exts-when{font-size:11.5px;color:var(--txt-3);line-height:1.4}
.exts-when b{color:var(--txt-2);font-weight:600}
.nudgeBtn{padding:7px 11px;border-radius:var(--r-xs);background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--txt-2);
  transition:transform .3s var(--out)}
.nudgeBtn:active{transform:scale(.95)}
.nudgeBtn.yes{background:var(--free);color:var(--free-ink);border-color:transparent}

.headline{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.headline b{font-size:clamp(30px,9.5vw,40px);font-weight:700;letter-spacing:-.04em;line-height:.9}
.headline s{text-decoration:none;font-size:12.5px;color:var(--txt-2);line-height:1.4}

/* vertical bar chart used by the booking curve and turnaround load */
.vbars{display:flex;gap:5px;align-items:flex-end;height:132px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;
  justify-content:flex-end}
.vbar .col{width:100%;background:var(--surface-2);border-radius:5px;display:flex;
  align-items:flex-end;overflow:hidden;flex:1}
.vbar .col i{display:block;width:100%;background:var(--free);border-radius:5px}
.vbar.acc .col i{background:var(--now)}
.vbar .v{font-size:10.5px;font-weight:650;color:var(--txt-2)}
.vbar .k{font-size:9.5px;font-weight:600;color:var(--txt-3);white-space:nowrap}
.vbar.acc .v,.vbar.acc .k{color:var(--now)}

/* pattern bars, shared by weekday and building */
.pat{display:flex;flex-direction:column;gap:9px;padding:14px 16px}
.patrow{display:grid;grid-template-columns:74px 1fr 38px;gap:10px;align-items:center}
.patrow .k{font-size:12px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patrow .t{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.patrow .t i{display:block;height:100%;background:var(--free);border-radius:5px}
.patrow .v{font-size:12px;font-weight:640;text-align:right;color:var(--txt-2)}
.patrow.low .t i{background:var(--now)}
.patrow.low .k, .patrow.low .v{color:var(--now)}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 16px 6px;align-items:end}
.wkcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.wkcol .bar{width:100%;height:56px;background:var(--surface-2);border-radius:5px;
  display:flex;align-items:flex-end;overflow:hidden}
.wkcol .bar i{display:block;width:100%;background:var(--free);border-radius:5px}
.wkcol.low .bar i{background:var(--now)}
.wkcol .d{font-size:10px;font-weight:600;color:var(--txt-3)}
.wkcol .p{font-size:10.5px;font-weight:650;color:var(--txt-2)}
.wkcol.low .p, .wkcol.low .d{color:var(--now)}
.insight{padding:0 16px 14px;font-size:12.5px;line-height:1.55;color:var(--txt-2);margin:0}
.insight b{color:var(--txt)}
.insight .hi{color:var(--now);font-weight:600}
/* An accented WORD, as a class rather than an inline style. Three
   sentences were setting style="color:var(--now)" straight on a <b>, and
   an inline colour cannot be reached by any stylesheet rule — so light's
   --now-ink mapping could never correct them and they shipped at 2.03:1.
   --now is the FILL in this system and never a text colour. */
.hi-now{color:var(--now)}

/* ══════════════════════ MONTH ══════════════════════ */
/* ══ THE MONTH TAB IS A FRAME, NOT A PAGE ═══════════════════════════════════
   Measured before changing anything: 1705px on an 812px screen with 8 free
   flats listed, and 3730px — four and a half screens — on the emptiest night in
   the book, when 41 are free. The answer began at y=1065 every time. So the
   INPUT owned 1.1 screens and the ANSWER was never on screen at the same time
   as the dates that produced it. Mid-call that is exactly the wrong way round:
   the calendar is the question, the list is the thing being read down the phone.

   The tab stops scrolling. Two bounded troughs move instead — the calendar and
   the flat list — and everything else is fixed chrome between them. The answer
   is then invariant in its own size: 8 free or 45 free, not one pixel of the
   frame moves, because the list scrolls inside its own box.

   Two things this breaks if they are not fixed in the same commit, both found
   by building it and driving it rather than by reasoning about it:
     - pull-to-refresh reads `screen.scrollTop > 0` to decide it is at the top.
       A screen that cannot scroll reports 0 forever, so the gesture armed from
       anywhere, including a downward drag inside a trough already scrolled
       200px. Measured: the screen took a 32.7px transform and the app reloaded
       mid-call. The gate now asks the TROUGH under the finger.
     - the sweep HUD compensated for its own appearance by nudging
       screen.scrollTop. On a screen that cannot scroll that is a silent no-op,
       and the grid dropped 70px under a live finger with the pressed cell
       leaving it entirely — DESIGN.md's headline bug, resurrected. The HUD is
       now fixed chrome below the grid and cannot move it at all, so the
       compensation is deleted rather than repaired. */
#scr-month{
  overflow:hidden;
  display:flex;flex-direction:column;
  padding:10px 20px calc(97px + var(--safe-b));
  gap:0;
}
/* The calendar scrolls inside its own box — four weeks while you are choosing,
   two once you have chosen. See the calLean note in the script: the answer is
   what the tab is for, and it was getting 198px of an 812px screen because the
   grid held its full height long after its job was done.
   The change only ever happens on release, never under a finger, which is the
   one thing this screen must not do. The transition below is kept for the day
   the class is toggled in place, but note renderMonth rebuilds this element on
   every change, so today it does not actually play — a fresh element has no
   previous height to animate from. */
.calscroll{
  flex:0 0 auto;height:224px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  transition:height .34s var(--out);
}
.calscroll.lean{height:112px}
/* ── A FADE MEANS "THERE IS MORE THIS WAY", so it may only appear where there
   IS more. Faded unconditionally, the top edge dimmed the very first row of
   dates while sitting at scrollTop 0 with nothing above it — the fade was not
   softening a slice, it was inventing one, on the row most likely to be read.
   Same on the chip row's right edge when every chip already fits.
   So the classes are driven by scroll position and each edge earns itself. */
.calscroll, .chipstrip{
  --fade-t:#000 0, #000 0;
  --fade-b:#000 100%, #000 100%;
}
.calscroll{
  -webkit-mask-image:linear-gradient(to bottom, var(--fade-t), var(--fade-b));
  mask-image:linear-gradient(to bottom, var(--fade-t), var(--fade-b));
}
.calscroll.moreAbove{ --fade-t:transparent 0, #000 16px }
.calscroll.moreBelow{ --fade-b:#000 calc(100% - 16px), transparent 100% }
.srcRow{
  --fade-t:#000 0, #000 0;
  --fade-b:#000 100%, #000 100%;
}
.chipstrip, .srcRow{
  -webkit-mask-image:linear-gradient(to right, var(--fade-t), var(--fade-b));
  mask-image:linear-gradient(to right, var(--fade-t), var(--fade-b));
}
.chipstrip.moreAbove, .srcRow.moreAbove{ --fade-t:transparent 0, #000 20px }
.chipstrip.moreBelow, .srcRow.moreBelow{ --fade-b:#000 calc(100% - 24px), transparent 100% }
@media (prefers-reduced-motion:reduce){ .calscroll{transition:none} }
.calscroll::-webkit-scrollbar{display:none}
/* the month divider pins to the top of the trough, so which month you are
   looking at is answered without the paging that used to answer it */
/* nothing sticky inside the trough — see the .mlab note; the month name lives
   in the chrome above it instead */
/* the answer takes whatever is left and scrolls inside it */
.listtrough{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

/* ── ONE CALENDAR, NOT THREE PAGES ─────────────────────────────────────────
   The book is 63 days — three months, eleven week-rows, about 700px. It was
   being paged into three screens behind two 36px arrows, and that paging was
   the whole reason a stay could not cross a month: both arrows had to reset the
   selection to give the new month something to show, so the arrival you had
   just tapped went with them. It also put the app's headline gesture out of
   reach of the most ordinary request in the business, because a sweep drags
   across one grid and the grid was one month.

   So the months run on. The label between them is the separator, and a range
   that crosses a boundary is now one continuous band you can see whole rather
   than two halves in two views you can never see at once. The arrows are gone,
   which also returns the top-right corner to the title.

   Each label carries its own month's fullness, so the number that used to sit
   in the title row is still there and is now attached to the month it
   describes rather than to whichever page you happened to be on. */
/* The month divider speaks in the voice the grid already has. Directly above
   it sits M T W T F S S — 10px, uppercase, letter-spaced, --txt-3 — and that is
   what a label for this grid looks like here. The month was arriving in a
   different one: 15px semibold ink over a second line of caption, two heavy
   blocks in a calendar whose actual content is the numbers.

   It also said "Rest of August 2026" against "September 2026", which read as
   two different kinds of thing rather than the same thing twice. The grid
   visibly starts mid-month; saying so was pedantry. And the year only appears
   when the horizon actually crosses one, which it does about once a year.

   What separates the months now is a hairline and a change of month name, which
   is all a separator has to be. */
/* THE FULL-WIDTH DIVIDER IS GONE, and with it the row it cost. It spanned all
   seven columns, which forced the grid to break at every month — so a month
   ending mid-week left a stub row and the next opened with its own lead pads.
   Two part-empty rows per boundary, ~55px each, on the screen whose whole
   problem is that the answer does not fit.

   What replaced it is smaller and says more: the weeks run on unbroken, and the
   1st carries a hairline seam down its left edge and names its own month. The
   month you are scrolled to is still stated above the trough, which is where
   that label went for its own reasons — sticking text to the top of a scrolling
   trough needs an opaque background, and in light theme the page ground is a
   gradient, so the strip painted rgb(229,233,240) over rgb(216,223,236) with a
   visible edge no flat colour fixes. */
/* the month you are looking at, in the fixed chrome above the trough */
/* min-height is the FILLED height, not a guess under it: reserve what the text
   will need so the line cannot grow when the text arrives. */
.monthnow{
  display:flex;align-items:baseline;gap:8px;margin:0 2px 7px;min-height:15px;
}
.monthnow b{font-size:10px;font-weight:650;letter-spacing:.09em;
  text-transform:uppercase;color:var(--txt-2)}

.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{text-align:center;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--txt-3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{
  aspect-ratio:1/1.14;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);
  padding:7px 6px 12px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
  transition:transform .38s var(--spring), border-color .2s;
}
.day:active{transform:scale(.92)}
/* A pad is the empty run before a month's 1st. It cleared the fill and the
   border but not the SHADOW the shared .day material rule casts, so an
   invisible cell still dropped a shadow — four faint rounded ghosts sitting in
   the grid once the months ran on and the pads moved out of the top corner.
   The light theme's own pad rule happened to clear it; dark never did, which is
   why it only showed up in one theme. Cleared here, so one rule covers both. */
.day.pad{background:transparent;border-color:transparent;box-shadow:none;pointer-events:none}
.day .dd{font-size:10px;font-weight:600;color:var(--txt-3);line-height:1}
.day .fn{font-size:clamp(16px,4.8vw,21px);font-weight:680;letter-spacing:-.035em;line-height:1}
.day .gg{position:absolute;left:6px;right:6px;bottom:6px;height:3px;border-radius:2px;
  background:var(--surface-3);overflow:hidden}
.day .gg i{display:block;height:100%;background:var(--free);border-radius:2px}
.day.today{border-color:color-mix(in srgb,var(--now) 60%,transparent)}
.day.today .dd{color:var(--now)}
.day.none .fn{color:var(--hot)}
.day.none .gg i{background:var(--hot)}
/* The seam where one month becomes the next, now that the grid runs on through
   it. A hairline down the left edge of the 1st and nothing else — the cell's own
   label already says "1 Sep", and the sticky month name above the trough says
   which month you are scrolled to. Subtle on purpose: a month boundary is a
   fact about the calendar, not about the rooms. */
/* THE SEAM, and only on the one boundary that shares a row. Every later month
   opens on its own row, and starting a row is already the mark — a rule down
   the left edge of the card would be pointing at nothing.

   Dashed rather than solid, and taller than the cell, so it reads as a fold in
   the calendar rather than as a border belonging to the cell beside it: this is
   the one place in the grid where two months are touching. */
/* Drawn as the cell's OWN left border, not as a pseudo-element in the gap.
   .day is overflow:hidden, so a ::before at left:-4px is clipped away and the
   seam simply did not appear — it was in the CSS and invisible on the phone.
   A border is not clipped by the box it belongs to. */
.day.mstart.seam{border-left:2px dashed var(--txt-2)}
.day.mstart.seam .dd{color:var(--txt)}
/* .day.mstart .dd and .day.today .dd are both (0,3,0) and mstart is written
   later, so on the twelve days a year that today IS a 1st, today's own accent
   lost to the month label's colour. Light theme never had it — its today rule
   is (0,5,0) and wins — so this is the dark half only. */
.day.today.mstart .dd, .day.today.mstart.seam .dd{color:var(--now)}
/* "1 Sep" has to hold one line in a 35px inner width, or it wraps onto the
   free count underneath it — which is what it did: the month sat on top of the
   number the cell exists to show. */
.day.mstart .dd{color:var(--txt-2);white-space:nowrap;font-size:9px;letter-spacing:-.01em}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink), var(--shadow-sm)}

/* ── THE PICKER HEAD ────────────────────────────────────────────────────────
   The two dates the operator is about to read down the phone, stated once, at
   the top, in the order they get said: arrival, then departure, then how many
   nights that is. The month grid underneath is where you change them; this is
   where you check them.

   The underline is not decoration — it says which end the NEXT tap sets. The
   calendar has always worked in two taps and the only thing that ever said so
   was a sentence below the grid, read once and then invisible. A moving
   underline says it continuously, in the place you are already looking.

   Both fields are buttons: tapping one arms that end directly, so correcting a
   departure no longer means re-picking the arrival first. */
/* One line. Two rows cost 108px on a screen whose whole problem is that the
   answer does not fit, and 56 of those pixels is a whole flat in the list
   below. The nights control moves back beside the dates, which only worked once
   the dates got shorter. */
.pick{
  display:flex;align-items:center;gap:10px;margin:0 0 12px;
  border-bottom:1px solid var(--line);padding-bottom:10px;
}
.pick .pfs{display:flex;align-items:stretch;flex:1 1 auto;min-width:0}
.pick .pf{
  flex:1;min-width:0;text-align:left;padding:1px 0 7px;background:none;border:0;
  display:flex;flex-direction:column;gap:4px;position:relative;
}
.pick .pf + .pf{padding-left:11px;margin-left:11px;border-left:1px solid var(--line)}
.pick .pf s{
  text-decoration:none;font-size:9px;font-weight:650;letter-spacing:.08em;
  color:var(--txt-3);text-transform:uppercase;
}
.pick .pf b{font-size:16.5px;font-weight:670;letter-spacing:-.025em;color:var(--txt);
  line-height:1;white-space:nowrap}
.pick .pf.empty b{color:var(--txt-3);font-weight:600}
/* the underline rides under the field whose end the next tap sets */
.pick .pf::after{
  content:"";position:absolute;left:0;bottom:0;height:2px;width:0;
  border-radius:2px;background:var(--ink);
  transition:width .3s var(--out);
}
.pick .pf + .pf::after{left:11px}
.pick .pf.on::after{width:26px}
.pick .pf.on s{color:var(--txt)}
@media (prefers-reduced-motion:reduce){ .pick .pf::after{transition:none} }
/* how many nights that is — the number the caller actually asked for */
/* the nights readout is also the nights CONTROL — see the note at its call
   site. 44px targets on both buttons: this is a thing a thumb uses mid-call,
   and the month arrows it replaces were 36px, under the minimum. */
.picks .pn{
  flex:0 0 auto;display:flex;align-items:center;gap:2px;
  border-radius:999px;white-space:nowrap;
  background:color-mix(in srgb,var(--free) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--free) 26%,transparent);
}
.picks .pn b{
  min-width:54px;text-align:center;
  font-size:11.5px;font-weight:640;letter-spacing:-.005em;color:var(--txt);
}
.picks .pn button{
  width:32px;height:32px;flex:0 0 auto;border:0;background:none;border-radius:999px;
  font-size:16px;font-weight:600;color:var(--txt-2);line-height:1;
  display:grid;place-items:center;
  transition:transform .35s var(--spring), color .18s;
}
/* the tappable area is bigger than the ink, which is how a 34px control can
   still be a 44px target without a 44px hole in the layout */
.picks .pn button::after{content:"";position:absolute;width:44px;height:44px}
.picks .pn button{position:relative}
.picks .pn button:active{transform:scale(.88);transition-duration:.085s}
.picks .pn button[disabled]{opacity:.3;pointer-events:none}

/* ── the shortcuts an operator is actually asked for ────────────────────────
   Not a generic set. These are the four spans a caller names on the phone, so
   the common case stops being two taps on a grid and becomes one. Clear is
   plain text, deliberately quieter than the four — it undoes, it does not
   offer. */
/* The nights control is PINNED and only the chips scroll. It shared one
   scrolling row with them, which meant the primary control on this row could be
   scrolled off the screen — caught with the row at its end, showing a lone "+"
   where the stepper had been. A control you can lose is not a control. */
.picks{display:flex;gap:8px;align-items:center;margin-top:12px;min-width:0}
.chipstrip{
  flex:1 1 auto;min-width:0;display:flex;gap:7px;align-items:center;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.chipstrip::-webkit-scrollbar{display:none}
/* 35px tall, which is under the 44px minimum, on the row that exists to make
   the common request one tap. Nobody caught it because the chips LOOK
   comfortable — the ink is the right size, the target was not. Same trick the
   nights stepper uses: the tappable area is bigger than the pill, so the row
   keeps its height and the thumb gets its 44px. */
.chipstrip button{
  position:relative;
  flex:0 0 auto;padding:7px 12px;border-radius:999px;
  font-size:12.5px;font-weight:600;letter-spacing:-.005em;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  transition:transform .35s var(--spring), background .18s;
}
.chipstrip button::after{
  content:"";position:absolute;left:0;right:0;top:50%;
  height:44px;transform:translateY(-50%);
}
.chipstrip button:active{transform:scale(.94);transition-duration:.085s}
.chipstrip button.on{background:var(--ink);color:var(--ink-on);border-color:transparent}
.chipstrip .pclear{margin-left:auto;background:none;border:0;color:var(--txt-3);padding:7px 4px}

/* press-and-hold, then sweep across dates to pick a stay */
.cal{touch-action:pan-y}
.cal.sweeping{touch-action:none}
/* ── A RANGE IS ONE SPAN, NOT TWENTY-TWO HIGHLIGHTED BOXES ──────────────────
   Each selected cell used to carry its own fill and its own border, so a
   three-week stay read as a field of separate tiles the eye had to count. The
   band is drawn instead as a layer that BLEEDS half the grid gap either side,
   so neighbouring cells meet with no seam and the selection reads as a single
   object: "the 22nd to the 25th", which is what the operator says out loud.

   Caps are placed deliberately rather than per cell: the two ends of the range,
   and the two ends of every week, because a band that runs off the right edge
   and resumes at the left is how a multi-week stay is drawn on paper. The
   caller's arrival and departure keep a solid fill on top — they are the two
   dates being read down the phone, and everything between them is context.

   The cell's own background goes off while it is in a range. Left on, the band
   would sit behind a second opaque rectangle and every seam would come back. */
.day.rng, .day.rngA, .day.rngB{
  background:transparent;border-color:transparent;overflow:visible;
  /* the band is painted BEHIND the content at z-index -1, and isolate keeps
     that -1 inside this cell rather than letting it fall behind the card. The
     first attempt raised the content instead, with `> *{position:relative}` —
     which silently un-pinned .gg, an absolutely-positioned bar, into the flex
     flow, so every free-room count in the range wore its own progress bar as a
     strikethrough. Lower the paint, never re-position the content. */
  isolation:isolate;
}
.day.rng::before, .day.rngA::before, .day.rngB::before{
  content:"";position:absolute;inset:0 -3.5px;z-index:-1;
  background:color-mix(in srgb,var(--free) 17%,var(--surface));
}
/* the caps — set from the render loop, which knows the column and the ends */
.day.capL::before{left:0;border-top-left-radius:var(--r-sm);border-bottom-left-radius:var(--r-sm)}
.day.capR::before{right:0;border-top-right-radius:var(--r-sm);border-bottom-right-radius:var(--r-sm)}
/* the two dates that get said out loud */
.day.rngA::after, .day.rngB::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:var(--free);border-radius:var(--r-sm);
}
/* the date on the band, lifted off --txt-3. Measured on the dark band it came
   out at 3.63:1 against a 4.5 floor — a 10px label on a fill that is lighter
   than the cell it replaced. --txt-2 is the token that clears it in both. */
.day.rng .dd{color:var(--txt-2)}
.day.rngA .dd, .day.rngB .dd{color:color-mix(in srgb,var(--free-ink) 62%,transparent)}
.day.rngA .fn, .day.rngB .fn{color:var(--free-ink)}
.day.rngA .gg, .day.rngB .gg{background:color-mix(in srgb,var(--free-ink) 18%,transparent)}
.day.rngA .gg i, .day.rngB .gg i{background:var(--free-ink)}
.day.rng .fn, .day.rngA .fn, .day.rngB .fn{transition:none}

/* takes no layout until a sweep starts, or it leaves a hole in the page */
/* The count line. It used to appear only during a sweep, above the grid, and
   pay for its own appearance by nudging the screen's scrollTop — which is how
   it came to drag the calendar out from under a thumb. It is permanent chrome
   now, below the grid, at a fixed height: it cannot move the grid because it
   never changes size, and the compensation it needed is deleted rather than
   repaired.
   It also earns its 44px the rest of the time. Resting, it answers the tab's
   whole question — how many flats are free for the dates chosen. Sweeping, the
   same line counts live under the thumb. One line, two jobs, no layout shift
   between them. */
.hud{
  flex:0 0 auto;height:44px;overflow:hidden;
  display:flex;align-items:center;gap:9px;margin:10px 2px 0;
  pointer-events:none;
}
.hud .n{font-size:21px;font-weight:690;letter-spacing:-.035em;line-height:1;
  flex:0 0 auto;font-variant-numeric:tabular-nums}
.hud .n.none{color:var(--hot)}
.hud .t{font-size:12px;color:var(--txt-2);line-height:1.35;min-width:0}
.hud .t b{color:var(--txt);font-weight:600}
/* sweeping: the same line, told apart by weight rather than by moving */
.hud.on .t b{color:var(--now)}
.sweephint{font-size:11.5px;color:var(--txt-3);margin:8px 2px 0;line-height:1.5}
.sweephint b{color:var(--txt-2);font-weight:600}

/* ══════════════════════ ASK ══════════════════════ */
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-md);padding:4px 4px 4px 15px;box-shadow:var(--shadow-sm);
  transition:border-color .2s}
.field:focus-within{border-color:color-mix(in srgb,var(--now) 65%,transparent)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;padding:13px 0;font-size:16px;
  font-weight:450;letter-spacing:-.011em}
.field input::placeholder{color:var(--txt-3)}
.field button:active{transform:scale(.93)}
/* one slot: paste into an empty box, clear a full one */
.field button.slot{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--txt-2);flex:0 0 auto;
  transition:transform .38s var(--spring), background .2s, color .2s}
.field button.slot:active{transform:scale(.9);transition-duration:.085s;color:var(--txt)}
.field button.slot[hidden]{display:none}
.field button.mic{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--txt-2);flex:0 0 auto;
  transition:transform .38s var(--spring), background .2s, color .2s}
.field.hear button.mic{background:var(--now);color:var(--ink-on);border-color:transparent;
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 55%,transparent)}
  60%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.field.hear button.mic{animation:none}}

.copybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copybtn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;
  color:var(--txt-2);transition:transform .38s var(--spring), color .2s, background .2s}
.copybtn:active{transform:scale(.95)}
.copybtn.done{background:var(--free);color:var(--free-ink);border-color:transparent}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chips button{padding:8px 12px;border-radius:var(--r-xs);background:var(--surface-2);border:1px solid var(--line);
  font-size:12.5px;font-weight:500;color:var(--txt-2);transition:transform .38s var(--spring), color .18s}
.chips button:active{transform:scale(.94);color:var(--txt)}
/* what was asked here before — quieter than the standing suggestions */
.chips.recent{margin-top:9px;align-items:center}
