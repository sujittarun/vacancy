/* ── account, sync state and conflicts ───────────────────────────────────────
   The pill in the top bar is never allowed to flatter the truth: it says
   whether this is the sample book or the real one, and whether what you just
   typed has actually reached the server. An operator who thinks a booking
   saved when it did not will sell the room twice.                            */
.pill{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--txt-2);letter-spacing:.01em;
  transition:transform .35s var(--spring), background .18s;white-space:nowrap;
}
.pill:active{transform:scale(.94)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--txt-3);flex:0 0 auto}
.pill.live i{background:#3FBF6A}
.pill.wait i{background:var(--now)}
.pill.off  i{background:var(--hot)}
/* the queue depth is the honest bit — it counts what has not landed yet */
.pill.wait, .pill.off{color:var(--txt)}

/* toast — a conflict is news, not an error, so it reads as a sentence */
.toasts{
  position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 16px;pointer-events:none;
}
.toast{
  width:100%;max-width:460px;pointer-events:auto;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 14px;
  font-size:13px;line-height:1.45;color:var(--txt-2);
  animation:toastIn .42s var(--out) both;
}
.toast b{color:var(--txt);font-weight:650}
.toast.warn{border-color:color-mix(in srgb, var(--now) 55%, transparent)}
.toast.bad{border-color:color-mix(in srgb, var(--hot) 55%, transparent)}
.toast .tclose{
  display:block;margin-top:9px;padding:0;background:none;border:none;
  font-family:var(--ui);font-size:12.5px;font-weight:650;color:var(--now);
  text-align:left;transition:transform .3s var(--spring);
}
button.tclose:active{transform:scale(.94);transition-duration:.085s}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} }

/* ── the preview strip inside a form ──────────────────────────────────────────
   The same nine weeks, with the pending change painted on. "4 nights from
   16 Aug" is a sentence; this is the picture, and it moves as the steppers do,
   so the consequence is seen before it is agreed to.                         */
.prevwrap{margin:0 0 2px}
.strip.prev{height:34px;padding:0;gap:1px}
.strip.prev i{transition:background .18s var(--out), transform .22s var(--spring)}
.strip.prev i.pending{background:var(--now);transform:scaleY(1.14)}
.strip.prev i.b.pending{height:100%;align-self:stretch}
.prevk{display:flex;justify-content:space-between;padding:6px 2px 0}

/* ── what broke, and who fixed it ─────────────────────────────────────────────
   The flag appears the moment a fault is chosen, inside the block form, so the
   history arrives while the decision is being made rather than in a report. */
.faultRow{margin-top:2px}
.tyRow.soft button{background:none;border-color:var(--line);color:var(--txt-3);font-weight:520}
.faultFlag{
  border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.5;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--txt-2);
  animation:flagIn .3s var(--out) both;
}
.faultFlag.hot{background:color-mix(in srgb,var(--now) 13%,transparent);
  border-color:color-mix(in srgb,var(--now) 40%,transparent)}
.faultFlag b{color:var(--txt);font-weight:650}
.faultFlag em{font-style:normal;color:var(--now);font-weight:600}
.faultFlag .ff-a{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.faultFlag .ff-call, .faultFlag .ff-same{
  padding:7px 11px;border-radius:9px;font-size:12px;font-weight:620;
  text-decoration:none;white-space:nowrap;transition:transform .3s var(--spring);
}
.faultFlag .ff-call{background:var(--now);color:#12100c}
.faultFlag .ff-same{background:var(--surface);border:1px solid var(--line-2);color:var(--txt-2)}
.faultFlag .ff-call:active, .faultFlag .ff-same:active{transform:scale(.95);transition-duration:.085s}
@keyframes flagIn{from{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.faultFlag{animation:none}}

/* what the ceiling hid, said plainly rather than left as silence */
.movecap{margin:9px 4px 0;font-size:11.5px;line-height:1.45;color:var(--txt-3)}

/* ── the way past the wall ────────────────────────────────────────────────────
   Sits under the stepper only once the stepper has run out of room, so it reads
   as the answer to the sentence above it rather than as a permanent option. */
.wallmove{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:2px 10px;width:100%;text-align:left;margin-top:9px;
  padding:10px 11px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);
  transition:transform .3s var(--spring), background .18s;
  animation:wallIn .3s var(--out) both;
}
.wallmove:active{transform:scale(.975);transition-duration:.085s}
/* headline and prize share the top row; the reasoning runs the full width
   underneath, so a two-line name never has to squeeze past the pill */
.wm-h{grid-area:1/1;display:flex;align-items:center;gap:7px;min-width:0}
.wm-h svg{width:15px;height:15px;flex:0 0 15px;color:var(--now)}
.wm-h b{font-size:13px;font-weight:640;color:var(--txt);line-height:1.3}
.wm-g{
  grid-area:1/2;align-self:start;
  font-size:12px;font-weight:700;color:var(--free-ink);
  background:var(--free);border-radius:8px;padding:5px 8px;white-space:nowrap;
}
.wm-s{grid-area:2/1/auto/-1;font-size:11.5px;color:var(--txt-2);line-height:1.45}
.wm-s b{color:var(--txt);font-weight:640}
@keyframes wallIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
/* the same slot when the answer is no — deliberately not a card, so a dead end
   never looks like something to tap */
.wallno{
  margin-top:8px;font-size:11.5px;line-height:1.45;color:var(--txt-3);
  animation:wallIn .3s var(--out) both;
}
.wallno b{color:var(--txt-2);font-weight:640}
@media (prefers-reduced-motion:reduce){
  .wallmove,.wallno{animation:none}
}

/* ── the people who fix things ────────────────────────────────────────────────
   Not names to pick from — people with a record. Whoever touched this exact
   fault in this exact flat comes first, because they hold the warranty, and the
   number under each is the one that decides who to ring next.                */
.fixers{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:-2px}
.fixers::-webkit-scrollbar{display:none}
.fixers[hidden]{display:none}
.fixer{
  flex:0 0 auto;min-width:126px;text-align:left;
  padding:9px 11px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;
  transition:transform .3s var(--spring), border-color .18s, background .18s;
}
.fixer:active{transform:scale(.96);transition-duration:.085s}
.fixer.on{background:var(--free);border-color:transparent}
.fixer.on .fx-n b{color:var(--free-ink)}
.fixer.on .fx-r{color:color-mix(in srgb, var(--free-ink) 60%, transparent)}
.fx-n{display:flex;align-items:baseline;gap:6px;min-width:0}
.fx-n b{font-size:13px;font-weight:650;color:var(--txt);white-space:nowrap}
.fx-n em{font-style:normal;font-size:10px;font-weight:650;color:var(--now);white-space:nowrap}
.fixer.on .fx-n em{color:var(--free-ink);opacity:.7}
.fx-r{font-size:10.5px;color:var(--txt-3);white-space:nowrap}
.fx-r.bad{color:var(--now)}


/* ── what broke: a grid, not a wall of pills ──────────────────────────────────
   Ten appliances as ten text pills wrapped into three ragged rows and read as a
   wall. This is the Rooms tab's own tile geometry, reused: even cells, a glyph
   that carries at a glance, the label under it so nothing is a guessing game,
   and a badge saying how many times THIS flat has broken THIS thing. Typing
   filters it, so the long tail never needs a second screen.                   */
.ffind{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line)}
.ffind:focus-within{border-color:var(--now-ink)}
.ffind svg{width:15px;height:15px;flex:0 0 15px;stroke:var(--txt-3);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.ffind input{flex:1;min-width:0;border:0;background:none;font-size:12.5px;outline:none;color:var(--txt)}
.ffind input::placeholder{color:var(--txt-3)}
/* --txt-2 on a --line-2 disc measures 4.09:1 in light and 4.33 in dark — under
   the floor on a 10px glyph, which is the worst place to be marginal. */
.ffind button{flex:0 0 auto;width:17px;height:17px;border-radius:50%;background:var(--line-2);
  color:var(--txt);font-size:10px;line-height:1;display:grid;place-items:center}
/* an author display: wins over the UA rule the hidden attribute relies on, so
   the clear button has to opt out explicitly or it is always on screen */
.ffind button[hidden]{display:none}

.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ftile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:62px;border-radius:10px;position:relative;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  transition:transform .3s var(--spring),background .18s,color .18s;
}
.ftile:active{transform:scale(.94);transition-duration:.085s}
.ftile[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.ftile svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ftile span{font-size:9px;font-weight:620;letter-spacing:-.01em;text-align:center;
  line-height:1.12;padding:0 3px;overflow:hidden;display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2}
.ftile i{position:absolute;top:4px;right:5px;font-style:normal;font-size:8px;font-weight:700;
  color:var(--now-ink);letter-spacing:.02em}
.ftile[aria-pressed="true"] i{color:var(--free-ink);opacity:.75}
.fnone{font-size:12px;color:var(--txt-3);padding:4px 2px}

/* ── who is fixing it, chosen by what broke ───────────────────────────────────
   Not a directory. The people who have actually done THIS thing, in the order
   the evidence puts them — this flat first, then the other forty-four — with
   the reason they are on the list, because a name on its own is trivia.
   Nobody is pre-selected: the app is offering, not deciding.                  */
.crew{display:flex;flex-direction:column;gap:6px}
.mate{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:10px 12px;border-radius:11px;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  transition:transform .3s var(--spring),background .18s,color .18s;
}
.mate:active{transform:scale(.98);transition-duration:.085s}
.mate[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.mate .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.mate .mt b{font-size:13.5px;font-weight:650;color:var(--txt)}
.mate[aria-pressed="true"] .mt b{color:var(--free-ink)}
.mate .mt em{font-style:normal;font-size:11px;color:var(--txt-3)}
.mate[aria-pressed="true"] .mt em{color:color-mix(in srgb,var(--free-ink) 62%,transparent)}
.mate .mr{flex:0 0 auto;font-size:10.5px;color:var(--txt-3);text-align:right;white-space:nowrap}
.mate .mr.bad{color:var(--now-ink)}
.mate[aria-pressed="true"] .mr{color:color-mix(in srgb,var(--free-ink) 62%,transparent)}
/* Scoped to the UNSELECTED state, for the third time in this file. A modifier
   written after a state rule at equal specificity wins, and "background:none"
   over a state that had just set a dark fill left white knockout text on a
   transparent card — invisible. A modifier describes the RESTING look; the
   state owns what happens when it is chosen. */
.mate.new:not([aria-pressed="true"]){border-style:dashed;background:none}
.crewidle{font-size:12px;color:var(--txt-3);line-height:1.5}

/* ── offers, not restatements ────────────────────────────────────────────────
   A renovation must not cost six presses on "+" while a phone is at an ear.
   These are one-tap jumps to the two numbers that are actually likely: every
   free night there is, and the length the last one of these took here. Offered,
   never pre-filled — nights loaded behind a tap you did not mean is money spent
   unread. */
.bkjump{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.bkjump button{
  padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;
  color:var(--txt-2);background:var(--surface-2);border:1px dashed var(--line-2);
  transition:transform .3s var(--spring),background .18s,color .18s;
}
.bkjump button:active{transform:scale(.95);transition-duration:.085s}
.bkjump button b{color:var(--txt);font-weight:660}
/* the note and the bill share a line: the bill is short and always optional */
.bkpair{display:flex;gap:8px}
.bkpair input:first-child{flex:1;min-width:0}
/* 96px, not 112: the note is the field with something to say, and at 112 its
   own example rendered as "Note — e.g. compressor r". */
.bkpair input.money{flex:0 0 96px;text-align:right;font-variant-numeric:tabular-nums}

/* the running total, stated once at the top rather than boxed in the middle */
.bkline{margin:0;font-size:12px;line-height:1.5;color:var(--txt-2)}
.bkline b{color:var(--txt);font-weight:640}
.bkline .acc{color:var(--now-ink);font-weight:640}
.bkline.bad b{color:var(--hot)}

/* ── the peek ─────────────────────────────────────────────────────────────────
   Sits above everything, takes no pointer events, and never moves the grid
   underneath it — the whole value is that your place is exactly where you left
   it when the thumb lifts.                                                    */
.peek{
  position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 74px);
  z-index:90;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;
  box-shadow:var(--shadow);padding:14px 15px 13px;
  max-width:460px;margin:0 auto;
  opacity:0;transform:translateY(-8px) scale(.97);
  transition:opacity .16s var(--out), transform .28s var(--spring);
}
.peek.on{opacity:1;transform:none}
.peek-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.peek-h b{font-size:19px;font-weight:680;letter-spacing:-.028em}
.peek-h s{text-decoration:none;font-size:12px;color:var(--txt-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .strip{padding:0;height:26px}
.peek-l{margin-top:11px;font-size:13.5px;font-weight:600;color:var(--txt)}
.peek-s{margin-top:3px;font-size:12px;color:var(--txt-3)}
@media (prefers-reduced-motion:reduce){ .peek{transition:opacity .12s} }

/* ── sign in ─────────────────────────────────────────────────────────────────
   One screen, done once on this phone. The session is remembered, so this is
   not a thing the operator meets every morning.                              */
.gate{
  position:fixed;inset:0;z-index:120;background:var(--bg);
  display:none;flex-direction:column;justify-content:center;
  padding:32px max(24px,calc((100% - 420px)/2));
  opacity:0;transition:opacity .3s var(--out);
}
.gate.on{display:flex;opacity:1}
.gate h2{margin:0 0 6px;font-size:27px;font-weight:680;letter-spacing:-.028em}
.gate p.lede{margin:0 0 26px;font-size:14px;line-height:1.5;color:var(--txt-2)}
.gate p.lede b{color:var(--txt);font-weight:640}
.gate label{display:block;font-size:11px;font-weight:650;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.gate input{
  width:100%;padding:13px 14px;margin:0 0 16px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
  font-family:var(--ui);font-size:16px;   /* 16px or iOS zooms the page on focus */
}
.gate input:focus{outline:none;border-color:var(--line-2);background:var(--surface-3)}
.gate .go{
  width:100%;padding:14px;border-radius:11px;border:none;
  background:var(--free);color:var(--free-ink);
  font-family:var(--ui);font-size:15px;font-weight:650;
  transition:transform .35s var(--spring), opacity .2s;
}
.gate .go:active{transform:scale(.98)}
.gate .go[disabled]{opacity:.5}
.gate .err{
  margin:0 0 16px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.45;
  background:color-mix(in srgb, var(--hot) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--hot) 40%, transparent);color:var(--txt);
}
.gate .alt{
  display:block;width:100%;margin-top:22px;padding:12px;text-align:center;
  background:none;border:none;font-family:var(--ui);
  font-size:13px;font-weight:560;color:var(--txt-3);
}
.gate .alt b{color:var(--txt-2)}

@media (min-width:720px){
  .screen{padding:26px max(20px,calc((100% - 640px)/2)) calc(110px + var(--safe-b))}
  .topbar{padding-left:max(20px,calc((100% - 640px)/2));padding-right:max(20px,calc((100% - 640px)/2))}
  .tabbar{left:50%;right:auto;transform:translateX(-50%);width:360px}
  .sheet{left:50%;transform:translate(-50%,101%);width:min(560px,100%);border-radius:22px 22px 0 0}
  .sheet.on{transform:translate(-50%,0)}
}
/* ══════════════════ light: a material, not a coat of paint ══════════════════
   Apple's own guidance is the part most "liquid glass" work skips: the material
   belongs to the layer you REACH FOR — navigation, controls, things that float
   over content — while content itself stays a calm, readable surface. Glassing
   every card is how a phone app turns into a fog bank, and this one's whole job
   is reading a number correctly at arm's length while somebody waits on the
   phone. So the ladder below gets *more* opaque and *more* blurred the closer a
   surface is to you, exactly like real frosted panes stacked in depth, and the
   45-tile data field stays solid glass-free.

   Four levels, one token set, no per-component CSS.                          */
:root[data-theme="light"]{
  /* CRYSTAL — thin, hard glass rather than a frosting.
     What makes it read as glass is the optics, not the blur: a bright specular
     streak across one shoulder, a near-white rim, and a dark hairline under the
     bottom edge that the eye takes for the thickness of the pane. The blur is
     deliberately tiny — 6px, where the usual reach is 20–30 — which is also why
     it is the cheapest translucent material of the ten to render.

     One deviation from the sample, stated rather than smuggled: the sample sat
     at 32% and measured 1.5:1 for body text over a black room tile. These are
     at 62/72/86%, which keeps every pane comfortably legible and loses none of
     the character, because the character was never the transparency. */
  /* Transparency goes where something is actually behind it, and where the type
     can afford it. The top bar has the whole screen scrolling under it and
     carries one 20px/690 title, so it can be halfway to clear. The sheet has
     arbitrary content behind it and carries 12–13px body, so it cannot: a pane
     you cannot read is not a material, it is a mistake. */
  /* Chrome carries its own secondary ink, and it is nearly as dark as the
     primary. That is arithmetic, not taste: at 52% over a free room tile the
     composite lands near #929292, where --txt-2 measures 2.83:1 and anything
     legible has to be close to black. So the top bar's subtitle and the tab
     labels stop leaning on colour for hierarchy and lean on size and weight
     instead — 20px/690 against 11.5px/400 — which is what this design system
     says type should be doing anyway. */
  --on-glass:#262A33;
  /* HEAVY blur, not the thin hard pane this started as. The first pass ran at
     6/9/12px on the argument that the optics do the work and the blur is only
     cost — true of a thin crystal edge, wrong for the material actually being
     asked for. What makes Apple's glass read as glass at a glance is the
     backdrop going soft and saturated behind it, and that also BUYS the
     transparency: a pane over mush stays legible at an opacity that would be
     unreadable over a sharp grid. So the blur goes up and the fill comes down
     together — they are one decision, not two. Saturation is what stops a
     heavy blur turning everything grey. */
  /* Three surfaces, three answers, because they do not sit over the same thing
     and do not carry the same type. Measured, not chosen:
       cards   float over the page ground, which is light, and still clear AA
               at .32 — so they can be as thin as they like. .40.
       bars    scroll over the room grid, where a FREE tile is near-black in
               this theme. .52 is where the subtitle lands at 4.79 and the next
               step down fails. It stays.
       tab bar also floats over that grid, but carries nothing except --on-glass
               and --txt, which clear at .56. So it gets to be the glassiest
               thing on screen, and it is the one you watch the rooms move
               under. .58.
       sheet   carries 11px --txt-3 over a scrimmed page. It could not move
               while the greys were where they were — it measured 4.10 even at
               .80. The greys came down to meet it, so now it can: .62, where
               the same worst case measures above its floor again. This is the
               surface everything else sits ON, so nothing inside the sheet
               could look like glass until this one did. */
  --g1:rgba(255,255,255,.40);   /* L1 content — cards, day cells            */
  --g2:rgba(255,255,255,.52);   /* L2 chrome  — bars: big type, real backdrop */
  --g3:rgba(255,255,255,.62);   /* L3 floating— sheet, toasts: small type   */
  --g-tab:rgba(255,255,255,.58);/* the tab bar alone: only strong ink on it  */
  --g-sunk:rgba(13,16,23,.06);  /* recessed: an ink tint, never a paler white */
  --g-edge:rgba(255,255,255,.95);
  --g-edge-2:rgba(255,255,255,1);
  /* the cross-section: light along the top inside edge, shadow along the bottom */
  --g-inner:inset 0 1px 0 rgba(255,255,255,1), inset 0 -1px 0 rgba(13,16,23,.10);
  --blur-1:blur(18px) saturate(180%);
  --blur-2:blur(26px) saturate(180%);
  --blur-3:blur(34px) saturate(180%);
  /* The specular sweep. A real pane catches the light across one shoulder, and
     this is the single strongest tell that a surface is glass rather than a
     translucent rectangle. It rides in background-image, not a ::before, so it
     can never land on top of the content it belongs behind. */
  /* narrow and bright, the way light catches an edge — not a soft wash */
  --sheen:linear-gradient(128deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.06) 17%,
                          rgba(255,255,255,0) 34%);
  --sheen-soft:linear-gradient(128deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.04) 15%,
                          rgba(255,255,255,0) 32%);
  /* tight shadows: a thin pane sits close to what it is on */
  --lift:0 1px 1px rgba(13,16,23,.14), 0 3px 7px -3px rgba(13,16,23,.20);
  --lift-2:0 1px 2px rgba(13,16,23,.16), 0 9px 20px -10px rgba(13,16,23,.30);
  /* state, not depth — see the dark block for why these are tokens */
  /* An INK hairline, not a white one. A trough on a light pane used to be
     ringed in 50% white, which on an 80%-white sheet was a white line on a
     white surface — the search field on the fault form had a 6% fill and an
     invisible border, so there was no box on screen at all, only a placeholder
     floating in space. A recess has to be drawn by something darker than what
     it is cut into. */
  --sunk-edge:rgba(13,16,23,.14);
  --g-sunk-inner:inset 0 1px 2px rgba(13,16,23,.10), inset 0 -1px 0 rgba(255,255,255,.65);
  --pane:rgba(255,255,255,.94);
  --pane-inner:inset 0 1px 0 #fff;
  --press:rgba(255,255,255,.86);

  /* ── LIQUID GLASS ─────────────────────────────────────────────────────────
     Not the same material as the frosted panes above, and the difference is
     the blur: 3px, not 26. Liquid glass is CLEAR in the middle and busy at the
     EDGE. Everything that makes it read as glass lives in the rim — a bright
     top lip, a dark under-edge, an inner glow that falls off fast, and one
     specular streak across a shoulder. Blurring the middle is frosted bathroom
     glass, which is the mistake the rest of this file is currently making.

     ADAPTIVE TINT is the other half, and it is what makes a clear pane usable
     at all. At 3px the backdrop stays legible, which means it competes with
     the label sitting on it — a near-black room tile under a dark word. So the
     filter compresses whatever is behind into a narrow band before it reaches
     the eye: brightness lifts it, contrast(<1) squeezes it toward the middle.
     Measured through the sheet, a backdrop ranging 150→209 comes out 169→217.
     The SHAPE of what is behind still shows — that is the glass — but the
     range it can occupy no longer includes anything the ink cannot beat.

     Light only, deliberately. The same trick inverted for dark needs
     brightness ~0.25 to keep white type off a near-white tile, and that is
     dark enough to stop being glass at all. Dark keeps the frosted pane it
     already has and already measures clean. */
  --lg-fill:rgba(255,255,255,.10);
  --lg-tint:blur(3px) saturate(180%) brightness(1.25) contrast(.7);
  --lg-edge:rgba(255,255,255,.55);
  --lg-rim:
    inset 0 1.5px 0 rgba(255,255,255,.85),      /* the top lip, catching light */
    inset 0 -1.5px 0 rgba(255,255,255,.22),     /* the under-edge, bouncing it */
    inset 0 20px 26px -20px rgba(255,255,255,.60),
    inset 0 -22px 30px -22px rgba(255,255,255,.28),
    inset 0 0 0 1px rgba(255,255,255,.18),      /* the pane's own thickness    */
    0 12px 28px -12px rgba(13,16,23,.30),       /* what it casts on the page   */
    0 2px 5px rgba(13,16,23,.13);
  --lg-sheen:linear-gradient(133deg,
    rgba(255,255,255,.70) 0%, rgba(255,255,255,.12) 16%,
    rgba(255,255,255,0) 36%, rgba(255,255,255,0) 70%,
    rgba(255,255,255,.16) 94%, rgba(255,255,255,.40) 100%);
}

/* ── L0 · the environment ────────────────────────────────────────────────────
   Something has to be behind the glass or the blur returns the colour it
   started with. Deliberately near-neutral: the reference palettes reach for
   blue, violet and teal blooms, and this app bans blue on purpose — it is the
   default accent of every scheduling tool alive — while amber is the only
   colour allowed to mean anything. So the environment is light and shade, not
   hue: one soft source top-left, cool weight top-right, a low pool beneath. */
/* A blurred flat colour is the same flat colour in either theme, so dark gets a
   ground with structure as well — far quieter than light's, because a dark
   ground shows its seams much sooner. */
:root[data-theme="dark"] body{
  background:
    radial-gradient(900px 520px at 6% -12%,  rgba(58,68,92,.55),  rgba(58,68,92,0) 52%),
    radial-gradient(700px 420px at 104% 2%,  rgba(38,46,66,.58),  rgba(38,46,66,0) 50%),
    radial-gradient(760px 640px at 42% 112%, rgba(30,36,52,.68),  rgba(30,36,52,0) 55%),
    var(--bg);
  background-attachment:fixed;
}
:root[data-theme="light"] body{
  /* A blurred flat colour is the same flat colour, so a card floating on a
     smooth ground shows nothing however transparent it is. The ground therefore
     carries real variation — a bright source top-left, cool mass top-right, a
     low pool beneath and a band across the middle — enough for a pane to have
     something to pick up, nowhere near enough to read as decoration. */
  background:
    radial-gradient(1150px 660px at 8% -12%,  rgba(255,255,255,1),    rgba(255,255,255,0) 56%),
    radial-gradient(760px 460px at 104% 0%,   rgba(139,163,205,.50),  rgba(139,163,205,0) 52%),
    radial-gradient(900px 520px at 50% 44%,   rgba(255,255,255,.55),  rgba(255,255,255,0) 46%),
    radial-gradient(860px 760px at 40% 114%,  rgba(158,175,210,.55),  rgba(158,175,210,0) 56%),
    var(--bg);
  background-attachment:fixed;
}

/* ── L1 · content ────────────────────────────────────────────────────────────
   Readable first. Light translucency, gentle blur, the softer sweep.        */
/* .ops-row was the largest opaque thing left on the screen — a solid white
   panel carrying arriving / leaving / turnaround. It is a content surface like
   any card, so it takes the content material. */
.card,
.tcard,
.night,
.day,
.ops-row{
  background-color:var(--g1);
  background-image:var(--sheen-soft);
  -webkit-backdrop-filter:var(--blur-1); backdrop-filter:var(--blur-1);
  border-color:var(--g-edge);
  box-shadow:var(--lift), var(--g-inner);
}
:root[data-theme="light"] .card{border-radius:18px}
:root[data-theme="light"] .tcard{border-radius:20px}

/* ── L2 · chrome ─────────────────────────────────────────────────────────────
   The layer you reach for. Stronger blur, clearer edge, the full sweep.     */
.topbar,
.tabbar,
.tabseg{
  -webkit-backdrop-filter:var(--blur-2); backdrop-filter:var(--blur-2);
}
.tabbar{
  background-color:var(--g-tab);
  background-image:var(--sheen);
  border-color:var(--g-edge);
  border-radius:22px;
  box-shadow:var(--lift-2), var(--g-inner);
}
/* the selected tab is a pane set INTO the bar, not a chip painted on it */
.tabbar button[aria-selected="true"]{
  background:var(--raise);
  box-shadow:inset 0 0 0 1px var(--g-edge-2), 0 2px 8px -3px rgba(13,16,23,.22);
}
.topbar{
  box-shadow:0 1px 0 rgba(13,16,23,.05), 0 10px 24px -16px rgba(13,16,23,.30);
}
/* the two strings that ride over whatever is scrolling underneath */
/* the two strings that ride over whatever is scrolling underneath — the ink is
   a token, so each theme brings its own and the rule is written once */
.topbar .sub,#scrSub{color:var(--on-glass)}
.tabbar button{color:var(--on-glass)}

/* ── L3 · floating ───────────────────────────────────────────────────────────
   Nearest to the eye, so the most opaque and the most blurred — a sheet you
   cannot read through is not a failure of transparency, it is depth.        */
.sheet{
  background-color:var(--g3);
  background-image:var(--sheen);
  -webkit-backdrop-filter:var(--blur-3); backdrop-filter:var(--blur-3);
  border-top:1px solid var(--g-edge-2);
  border-radius:26px 26px 0 0;
}
.toast,
.peek{
  background-color:var(--g3);
  background-image:var(--sheen);
  -webkit-backdrop-filter:var(--blur-3); backdrop-filter:var(--blur-3);
  border-color:var(--g-edge);
  box-shadow:var(--lift-2), var(--g-inner);
}

/* ── recessed ────────────────────────────────────────────────────────────────
   A trough cannot be a paler white: white on white has nowhere to go. It is a
   translucent INK tint over the same pane, so it still reads as cut in.     */
/* Every selector here is guarded against its own selected state. Glass is the
   DEFAULT material; a chosen chip has a material of its own and must keep it.
   Without the guards these rules sit later in the sheet at equal specificity
   and win — which is how a selected chip ended up as near-white text on a
   near-white trough, i.e. invisible, and how the placeholder guests ended up
   looking like they had already moved. State beats material, always. */
.seg,
.field,
.ghost:not(.on),
.chips button:not([aria-pressed="true"]),
.tyRow button:not([aria-pressed="true"]),
.step,
.stepWide,
.srcRow button:not([aria-pressed="true"]),
.fixer:not(.on),
.ffind,
.ftile:not([aria-pressed="true"]),
.mate:not([aria-pressed="true"]),
.dcell:not(.urgent),
/* Everything else that was still a flat --surface-2 chip. These were the last
   opaque neutrals on screen: the small round buttons on a booking row, the
   copy button, the "still out" answer, the pills, the two accessories in the
   Ask field, and the explanation panel under a room's main action. They are
   the same kind of thing as the chips above them and there was no reason for
   them to be a different material — they were simply written before there was
   one. The guards keep every SELECTED and every SEMANTIC state out: a chosen
   chip, the dark primary answers, the amber and red washes all keep their own
   surface, because state and meaning both beat material. */
.rowx,
.copybtn,
.actWhy,
.line,
.nudgeBtn:not(.yes),
.pill:not(.good):not(.now):not(.warn):not(.live):not(.due),
.field button.slot,
.field button.mic:not(.on),
.wallmove{
  background-color:var(--g-sunk);
  -webkit-backdrop-filter:var(--blur-1); backdrop-filter:var(--blur-1);
  border-color:var(--sunk-edge);
  /* the cut edge: a shadow along the TOP inside, which is what tells the eye a
     thing is set into a surface rather than laid on it. Without it a trough is
     only a slightly darker rectangle, which at 6% is no rectangle at all. */
  box-shadow:var(--g-sunk-inner);
}
/* and the thing that lifts back OUT of a trough is the brightest pane there is
   — brightest RELATIVE to its theme, which in dark is a lighter dark. */
.seg-ind,
.mguest:not(.berth)>.mguest-fx{
  background:var(--pane);
  background-image:var(--sheen-soft);
  box-shadow:var(--lift), var(--pane-inner);
  border-color:var(--g-edge-2);
}
/* An empty place kept for someone is EMPTY. The first glass pass matched
   `.mguest-fx` at equal specificity and later in the sheet, repainting every
   placeholder as a solid chip — so the sheet showed all the guests already
   standing in their new rooms before anyone had agreed to move. A dashed 1px
   border is not a difference. An absent surface is. */
.mguest.berth>.mguest-fx{
  background:transparent;background-image:none;box-shadow:none;
  border-color:color-mix(in srgb, var(--txt-3) 55%, transparent);
}

/* ── a surface that means something keeps its meaning ────────────────────────
   These carry an alert or an accent wash. They take the glass BEHAVIOUR and
   keep their own colour, mixed into the pane rather than replaced by it —
   plain glass over `.decide` turned "needs a decision" into a card.
   The wash mixes into var(--g3), the floating pane of whichever theme is on,
   so the alert stays an alert on either ground.                            */
.decide{
  background-color:color-mix(in srgb, var(--hot) 13%, var(--g3));
  border-color:color-mix(in srgb, var(--hot) 55%, transparent);
}
.advert,
.dcell.urgent{
  background-color:color-mix(in srgb, var(--now) 17%, var(--g3));
  border-color:color-mix(in srgb, var(--now-ink) 45%, transparent);
}
.decide,
.advert,
.dcell.urgent{
  background-image:var(--sheen-soft);
  -webkit-backdrop-filter:var(--blur-1); backdrop-filter:var(--blur-1);
  box-shadow:var(--lift), var(--g-inner);
}

:root[data-theme="light"] .pill.now,:root[data-theme="light"] .op.alert b,

:root[data-theme="light"] .op .dot,:root[data-theme="light"] .act.good .mark,

<script>
"use strict";
/* ═══════════════ demonstration data — invented, not real ═══════════════ */
const DAYS = 63;
const DOW  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWF = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const today = new Date(); today.setHours(0,0,0,0);
const dateAt = i => { const d = new Date(today); d.setDate(d.getDate()+i); return d; };
const fmt  = i => { const d=dateAt(i); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtL = i => { const d=dateAt(i); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260806);

/* The real portfolio. `plan` lists unit types smallest-first so studios and smaller
   flats sit on the lower floors; `per` is units per floor. Flat numbers follow
   <floor><unit>, e.g. TT-101, LP-403. */
const BUILDINGS = [
  {code:"TT", name:"TreeTops",      short:"TreeTops",   per:4, plan:[["Studio",1],["2 BHK",1],["3 BHK",12]]},
  {code:"TN", name:"Telecom Nagar", short:"Telecom N",  per:1, plan:[["3 BHK",3]]},
  {code:"MP", name:"Madhapur",      short:"Madhapur",   per:2, plan:[["Studio",1],["3 BHK",3]]},
  {code:"BH", name:"Banjara Hills", short:"Banjara H",  per:3, plan:[["Studio",2],["2 BHK",10]]},
  {code:"LP", name:"Lotus Pond",    short:"Lotus Pond", per:3, plan:[["2 BHK",2],["3 BHK",10]]},
];
const RATE = {"Studio":[1600,2600], "2 BHK":[3000,4400], "3 BHK":[4200,6200]};
const NAMES = ["R. Menon","S. Kulkarni","A. Fernandes","D. Iyer","K. Bhatt","M. Sequeira","P. Rao",
  "T. Nayar","J. Dcosta","V. Shetty","N. Pillai","H. Chandra","L. Mathew","G. Saldanha","B. Kaur",
  "F. Noronha","Y. Deshpande","C. Varghese","E. Pinto","U. Reddy"];
const SRC = ["Airbnb","Direct call","Walk-in","Booking.com","Repeat guest"];
/* Declared here rather than beside the money helpers because the demo generator
   runs during boot, well before that block is evaluated. */
const PAY_METHODS = ["Cash","UPI","Bank","Card","Platform"];
const PLATFORMS = ["Airbnb","Booking.com"];
/* The things a serviced flat actually has. The kitchen was three appliances
   short — a chimney, a microwave and a gas stove are not "Other", they are
   what breaks. */
const FAULTS_BASE = ["AC","Geyser","Plumbing","Electrical","Wi-Fi","Fridge",
                     "Washing machine","Chimney","Microwave","Gas stove",
                     "Furniture","Pest control","Other"];
/* And the list learns. Anything typed against "Other" is remembered as its own
   kind, so the second time the geyser filter goes it is a tap rather than a
   sentence — and every one of them then carries its own history, its own repeat
   warning and its own set of people who have fixed it. */
let customFaults = [];
const titleCase = s => s.trim().replace(/\s+/g," ")
  .replace(/^./, c => c.toUpperCase()).slice(0, 28);
function allFaults(){
  // "Other" stays last however many are learned — it is the escape hatch
  const base = FAULTS_BASE.filter(f => f !== "Other");
  return base.concat(customFaults, ["Other"]);
}
function learnFault(name){
  const t = titleCase(name || "");
  if(t.length < 2) return "";
  const known = allFaults().find(f => f.toLowerCase() === t.toLowerCase());
  if(known) return known;                       // already a kind, use its casing
  customFaults.push(t);
  save();
  return t;
}
/* What each of those actually turns out to be, in the words an operator would
   use on the phone to the person fixing it. The free-text box was asking them
   to type a sentence the app could have offered — and a note nobody types is a
   note nobody reads back six weeks later when the same thing fails again. */
const SYMPTOMS = {
  "AC":              ["not cooling","leaking water","noisy","remote dead"],
  "Geyser":          ["slow to heat","no hot water","leaking","tripping the switch"],
  "Plumbing":        ["tap dripping","drain blocked","low pressure","leak under the sink"],
  "Electrical":      ["socket dead","lights flickering","MCB tripping","fan not working"],
  "Wi-Fi":           ["drops out","very slow","router dead","no signal in one room"],
  "Fridge":          ["not cooling","freezing everything","noisy","door seal gone"],
  "Washing machine": ["not draining","not spinning","leaking","door stuck"],
  "Furniture":       ["door off its runner","broken leg","torn upholstery","handle come off"],
  "Pest control":    ["cockroaches","ants","mosquitoes","rodents"],
};
const REPEAT_WINDOW = 120;   // days a same-fault return still counts as "again"
const HELD_WINDOW   = 30;    // a fix that fails this fast is the fixer's to answer for
const URGENCY = ["whenever","soon","urgent"];
/* Declared up here with the other boot-time constants: the demo seeder runs
   during start-up, long before the maintenance block further down is reached. */
let issues = [];

/* ── inventory ───────────────────────────────────────────────────────────────
   The flats are editable and persist on the device. Bookings are held against
   flat IDs, so renaming or removing a flat remaps them rather than corrupting
   them.                                                                        */
const INV_STORE = "vacancy.inventory.v1";
const UNIT_TYPES = ["Studio","1 BHK","2 BHK","3 BHK","4 BHK"];

function defaultInventory(){
  const out = [];
  BUILDINGS.forEach(b=>{
    const types = [];
    b.plan.forEach(([t,count])=>{ for(let k=0;k<count;k++) types.push(t); });
    types.forEach((type,idx)=>{
      const floor = Math.floor(idx / b.per) + 1;
      const unit  = (idx % b.per) + 1;
      const [lo,hi] = RATE[type];
      out.push({ id:`${b.code}-${floor}0${unit}`, code:b.code, bname:b.name, bshort:b.short,
                 floor, type, rate: lo + Math.round(rng()*(hi-lo)/100)*100 });
    });
  });
  return out;
}
function loadInventory(){
  try{
    const raw = localStorage.getItem(INV_STORE);
    if(!raw) return null;
    const rows = JSON.parse(raw);
    if(!Array.isArray(rows) || !rows.length) return null;
    return rows.filter(r => r && r.id && r.type);
  }catch(e){ return null; }
}
function saveInventory(){
  if(MODE === "live") return;        // signed in, the cloud cache is the store
  try{ localStorage.setItem(INV_STORE, JSON.stringify(
    flats.map(f=>({id:f.id, code:f.code, bname:f.bname, bshort:f.bshort,
                   floor:f.floor, type:f.type, rate:f.rate}))
  )); }catch(e){}
}

let flats = loadInventory() || defaultInventory();
flats.forEach(f=>{ f.pop = f.pop ?? (0.55 + rng()*0.45); });
let NF = flats.length;
let flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));

/* Swap the inventory and carry the bookings across by ID.
   `renames` maps old id -> new id so a renumbered flat keeps its bookings. */
function applyInventory(next, renames){
  renames = renames || {};
  const prev = flats;
  const held = resv.map(r => {
    const was = flats[r.fi] && flats[r.fi].id;
    return {...r, _id: renames[was] || was};
  });
  flats = next;
  flats.forEach(f=>{ f.pop = f.pop ?? 0.6; });
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));
  resv = held.filter(r => flatIndex[r._id] !== undefined)
             .map(r => { const {_id, ...rest} = r; return {...rest, fi:flatIndex[_id]}; });
  if(MODE === "live") syncInventory(prev);
  recompute(); saveInventory(); save(); cacheSave();
}

/* Inventory edits are rare and small — a flat renumbered, a building added — so
   this diffs rather than replacing wholesale. A removed flat takes its stays
   with it, which is what the cascade in the schema is for; a renumbered one
   keeps them, because bookings hang off the flat's id and not its number.    */
function syncInventory(prev){
  const bidFor = {};
  prev.concat(flats).forEach(f=>{ if(f.bid && f.code && !bidFor[f.code]) bidFor[f.code] = f.bid; });
  const seen = [];
  flats.forEach(f=>{ if(seen.indexOf(f.code) < 0) seen.push(f.code); });

  flats.forEach(f=>{
    if(!bidFor[f.code]){                       // a building nobody has seen before
      const bid = uuid();
      bidFor[f.code] = bid;
      enqueue({k:"bld+", id:bid, body:{code:f.code, name:f.bname,
        short_name: f.bshort || f.bname, sort_order: seen.indexOf(f.code)}});
    }
    f.bid = bidFor[f.code];
  });

  const before = Object.fromEntries(prev.filter(f=>f.uid).map(f=>[f.uid, f]));
  flats.forEach(f=>{
    const body = {building_id:f.bid, code:f.id, floor:f.floor|0,
                  unit_type:f.type, nightly_rate:f.rate || null};
    if(!f.uid){ f.uid = uuid(); enqueue({k:"flat+", id:f.uid, body}); return; }
    const o = before[f.uid];
    if(o && (o.id !== f.id || o.floor !== f.floor || o.type !== f.type
             || o.rate !== f.rate || o.bid !== f.bid)) enqueue({k:"flat~", id:f.uid, body});
  });

  const keep = new Set(flats.map(f=>f.uid));
  prev.forEach(f=>{ if(f.uid && !keep.has(f.uid)) enqueue({k:"flat-", id:f.uid}); });
}
/* ── perspective ─────────────────────────────────────────────────────────────
   An unsold night is perishable stock: once the date passes it can never be
   sold again. These turn the calendar from "what is" into "what is about to be
   lost", which is the thing an operator can still act on.                     */
function monthStats(days){
  let sold = 0, open = 0, openValue = 0, soon = 0, soonValue = 0, total = 0, blocked = 0;
  days.forEach(d=>{
    flats.forEach((f,i)=>{
      if(blk[i][d]){ blocked++; return; }        // out of service — not sellable, not sold
      total++;
      if(occ[i][d]) sold++;
      else { open++; openValue += f.rate; if(d < 7){ soon++; soonValue += f.rate; } }
    });
  });
  return {total, sold, open, openValue, soon, soonValue, blocked,
          pct: total ? sold/total : 0};
}

/* "22 free" tells you nothing on its own — is that a bad Saturday or a normal
   Tuesday? This compares each date against how that weekday usually runs, which
   is the one thing you cannot read off the raw count. */
/* ── trends ──────────────────────────────────────────────────────────────────
   All of this reads the forward book — the app has no past yet. Manual bookings
   now record the day they were taken (`bookedOn`), so genuine lead-time history
   accumulates from first use rather than being invented. */
const inHorizon = () => bookings().filter(r => r.end > 0 && r.start < DAYS);

/* How the book thins as you look further out. This is the honest version of
   "pace": it shows the booking window, so 30% five weeks out reads as normal
   rather than alarming. */
function bookingCurve(){
  const weeks = [];
  for(let w = 0; w*7 < DAYS; w++){
    let sold = 0, total = 0;
    for(let d = w*7; d < Math.min((w+1)*7, DAYS); d++)
      for(let i = 0; i < NF; i++){ if(blk[i][d]) continue; total++; if(occ[i][d]) sold++; }
    if(total) weeks.push({w, pct: sold/total});
  }
  return weeks;
}

function groupOcc(days, keyOf){
  const acc = new Map();
  flats.forEach((f,i)=>{
    const k = keyOf(f);
    if(!acc.has(k)) acc.set(k, {k, sold:0, total:0, units:0});
    acc.get(k).units++;
  });
  days.forEach(d=> flats.forEach((f,i)=>{
    if(blk[i][d]) return;                        // out of service leaves the denominator
    const a = acc.get(keyOf(f)); a.total++; if(occ[i][d]) a.sold++;
  }));
  return [...acc.values()].map(a=>({...a, pct: a.total ? a.sold/a.total : 0}))
                          .sort((x,y)=> x.pct - y.pct);
}

function stayMix(){
  const rs = inHorizon();
  const buckets = [{k:"1 night",lo:1,hi:1},{k:"2",lo:2,hi:2},{k:"3",lo:3,hi:3},
                   {k:"4–6",lo:4,hi:6},{k:"7+",lo:7,hi:999}];
  const out = buckets.map(b=>({...b, n: rs.filter(r=> r.nights>=b.lo && r.nights<=b.hi).length}));
  const alos = rs.length ? rs.reduce((s,r)=>s+r.nights,0) / rs.length : 0;
  return {out, alos, total: rs.length};
}

function sourceMix(){
  const rs = inHorizon(), m = new Map();
  rs.forEach(r=> m.set(r.src, (m.get(r.src)||0) + 1));
  return {rows: [...m.entries()].map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n), total: rs.length};
}

/* Same-day changeovers per day — this is the cleaning crew's week, and almost
   nothing at this scale surfaces it. */
function turnLoad(n){
  const out = [];
  for(let d = 0; d < n; d++) out.push({d, n: dayOps(d).turnovers.length});
  return out;
}

/* How broken up the empty time is. Ten scattered single nights are far harder
   to sell than one ten-night hole, and the raw vacancy count hides that. */
function fragmentation(){
  let runs = 0, orphans = 0, nights = 0;
  flats.forEach((f,fi)=>{
    let d = 0;
    while(d < DAYS){
      if(occ[fi][d]){ d++; continue; }
      let n = 0; while(d+n < DAYS && !occ[fi][d+n]) n++;
      if(d + n < DAYS){ runs++; nights += n; if(n === 1) orphans++; }
      d += n;
    }
  });
  return {runs, orphans, nights, avg: runs ? nights/runs : 0};
}

/* ── the cheapest booking you will ever take ─────────────────────────────────
   A guest is already in the flat. The night after they leave is empty. Asking
   them to stay one more night costs nothing — no listing, no commission, no
   clean between. When that empty stretch is bounded by the next booking, the
   extension fills the gap exactly, and a one-night gap is the orphan nobody
   can sell. No small-operator tool surfaces this; they all wait for demand to
   arrive instead of looking at who is already standing in the room.        */
const OPP_HORIZON = 14;              // opportunities are only actionable near-term

function extensionOffers(){
  const out = [];
  bookings().forEach(r=>{
    const e = r.end;                                  // check-out morning = first free night
    // you can only realistically make this offer to a guest whose stay is imminent —
    // a checkout a fortnight away is not a conversation you can have today
    if(e < 0 || e > 7) return;
    if(occ[r.fi][e]) return;                          // someone else already has that night
    let n = 0; while(e+n < DAYS && !occ[r.fi][e+n]) n++;
    if(!n) return;
    const bounded = e + n < DAYS;                     // a later booking closes the gap
    const inHouse = r.start <= 0 && r.end > 0;        // they are in the flat right now
    out.push({
      r, fi:r.fi, from:e, nights:n, bounded, inHouse,
      orphan: bounded && n === 1,
      score: (inHouse ? 100 : 0)
           + (bounded && n === 1 ? 70 : bounded && n <= 3 ? 40 : 0)
           + Math.max(0, 30 - e),                     // sooner beats later
    });
  });
  return out.sort((a,b)=> b.score - a.score);
}

/* ── blocks that outlive their reason ────────────────────────────────────────
   The expensive failure is not taking a flat out of service — it is forgetting
   to put it back. A flat marked "AC repair" in March is still blocked in June
   because nobody revisited it, quietly out of inventory the whole time. So the
   app asks, around the date the flat was due back, whether it actually is. */
function blockNudges(){
  const out = [];
  resv.filter(isBlock).forEach(r=>{
    const due = r.end;                       // first night back on sale
    if(due >= -7 && due <= 2){
      out.push({r, kind:"due", due,
        when: due < 0 ? `came back ${-due} day${-due>1?"s":""} ago`
            : due === 0 ? "comes back today"
            : due === 1 ? "comes back tomorrow"
            : `comes back in ${due} days`});
    } else if(due > 2 && r.nights >= 21){
      out.push({r, kind:"long", due,
        when: `out for ${r.nights} nights — ${Math.max(0, Math.min(due,DAYS))} still to come`});
    }
  });
  return out.sort((a,b)=> a.due - b.due);
}

/* Single empty nights wedged between two bookings, inside the fortnight. These
   are the nights nobody books at a normal rate, so they are the ones worth
   advertising cheap. */
function orphanNights(){
  const out = [];
  for(let d = 0; d < Math.min(OPP_HORIZON, DAYS); d++){
    flats.forEach((f,i)=>{
      if(occ[i][d]) return;
      const closedBefore = d === 0 || occ[i][d-1];
      const closedAfter  = d+1 < DAYS && occ[i][d+1];
      if(closedBefore && closedAfter) out.push({fi:i, d});
    });
  }
  return out.sort((a,b)=> a.d - b.d);
}

/* ── what actually belongs in a to-do list ───────────────────────────────────
   Only things that are true today or tomorrow, that stop being true if
   ignored, and that have one clear action. A standing condition — "16 orphan
   nights exist somewhere in the next fortnight" — is still 16 tomorrow, so it
   is analysis, not a task, and putting it here is what makes a list people
   stop reading. Everything longer-range lives in the sections below.        */
const NOW = 1;                       // today and tomorrow

/* Three different kinds of thing were being rendered as one flat list, which
   made a maintenance decision look identical to a discount idea and grew a row
   for every extra item. They are grouped by the response they need instead:

     DECIDE   — a question only you can answer, with its answer attached
     TO DO    — work that must happen, counted not enumerated
     PERISHING— inventory with a clock on it, shown as figures side by side

   Nothing here is more than two days out. */
/* Drag to say how much longer a flat stays out, capped at the nights actually
   available so a block can never be dragged over a guest. */
/* ── how much longer is it out ────────────────────────────────────────────────
   This was a drag slider with absolutely-positioned end labels, and those
   labels sat below the 34px track and collided with the line underneath — the
   overlap you could see. It was also the only slider left in an app that speaks
   steppers everywhere else, and it predates them.

   A stepper cannot overlap anything, needs no ticks, and reads its own value.
   The cap is the more useful half anyway: "back on Thursday" and, when a guest
   is holding the nights after, saying so instead of silently refusing to slide
   any further — which is why it sometimes stopped at two days with no
   explanation.                                                               */
/* Whoever holds the first night this block cannot have. It was being looked up
   as "the next guest to arrive", which quietly skips a guest who is already in
   the flat right now — a lapsed block would then name somebody a fortnight away
   as the reason it could not extend by a single day.                          */
function blockWall(block){
  const from = Math.max(block.end, 0);
  return resv.filter(r => r.fi === block.fi && !isBlock(r) && r.end > from)
             .sort((a,b)=> a.start - b.start)[0] || null;
}

/* The offer itself. Null when nobody can move — silence is the honest answer,
   and a card that says "no options" is a card the operator learns to skip. */
function wallOffer(block, wall, onDone){
  if(!wall) return null;
  const quiet = t =>{ const q = el("div","wallno"); q.innerHTML = t; return q; };
  const nights = wall.end - Math.max(wall.start, 0);

  // a guest who has already let themselves in is not being asked to pack
  if(wall.start < 0)
    return quiet(`<b>${esc(wall.guest)}</b> is already in there until `
      + `${esc(fmt(wall.end))} — nobody moves a guest mid-stay.`);

  const mv = moveFor(wall);
  if(!mv)
    return quiet(`Nowhere free to put <b>${esc(wall.guest)}</b> for all `
      + `${nights} of their nights, so this really is the wall.`);

  const gained = extendAfter(block, mv);
  const now = maxExtend(block);
  if(gained <= now)
    return quiet(`Even moving <b>${esc(wall.guest)}</b> buys nothing — `
      + `the nights behind them are taken too.`);

  const to = flats[mv.moves[0].to], n = mv.moves.length;
  const till = Math.min(Math.max(block.end, 0) + gained, DAYS - 1);

  const card = el("button","wallmove");
  const gain = el("span","wm-g", "+" + (gained - now) + (gained - now === 1 ? " day" : " days"));
  const head = el("div","wm-h");
  head.innerHTML = SVG_SWAP + `<b>${n === 1
      ? esc(wall.guest) + " could move to " + esc(to.id)
      : n + " guests could move out of the way"}</b>`;
  const sub = el("div","wm-s");
  sub.innerHTML = (n === 1
      ? (mv.sameBuilding && mv.sameType ? "Same building, same size" :
         mv.sameBuilding ? "Same building" : "A different building — worth a call")
      : `${mv.sameBuilding ? "All in the same building" : "Across buildings"}`)
    + ` · then ${esc(flats[block.fi].id)} can stay out to <b>${esc(fmtL(till))}</b>`;
  card.append(head, gain, sub);
  card.onclick = ev=>{
    ev.stopPropagation(); haptic(10);
    openMove(mv, Math.max(block.end, 0), ()=>{
      const bought = gained - now;
      extendBlock(block, extendAfter(block, mv));
      closeSheet(); haptic(18); refreshScreen();
      // the same number the card promised, not a different true one
      toast("", `<b>${esc(flats[block.fi].id)} stays out to `
        + `${esc(fmtL(Math.min(Math.max(block.end, 0), DAYS-1)))}.</b> `
        + `Moving ${esc(wall.guest)} bought ${bought} of those days.`, null);
      if(onDone) onDone();
    }, {title: `Keep ${flats[block.fi].id} out longer`,
        cta:   `Keep it out to ${fmtL(till)}`});
  };
  return card;
}

function attachDaysSlider(host, block, onCancel){
  const room = maxExtend(block);
  const box = el("div","exts");
  const backOut = ()=>{
    if(onCancel){ onCancel(); return; }
    box.remove();
  };
  if(room <= 0){
    const none = el("div","exts-when");
    none.style.marginTop = "8px";
    const nextUp = blockWall(block);
    none.innerHTML = nextUp
      ? `Cannot stay out any longer — <b>${esc(nextUp.guest)}</b> `
        + (nextUp.start < 0 ? `is in there until ${esc(fmt(nextUp.end))}.`
                            : `arrives ${esc(fmt(nextUp.start))}.`)
      : `Cannot stay out any longer — the nights after are taken.`;
    box.appendChild(none);
    const offer0 = wallOffer(block, nextUp);
    if(offer0) box.appendChild(offer0);
    const foot0 = el("div","exts-foot");
    const back0 = el("button","nudgeBtn","Back");
    back0.onclick = ev=>{ ev.stopPropagation(); backOut(); };
    foot0.append(back0);
    box.appendChild(foot0);
    host.appendChild(box);
    return;
  }
  let days = Math.min(3, room);

  const cap = el("div","bkcap");
  cap.append(el("span", null, "Keep it out for"));
  const row = el("div","step nightStep");
  const less = el("button", null, "−"), more = el("button", null, "+"), lab = el("b");
  less.setAttribute("aria-label","One day fewer"); more.setAttribute("aria-label","One day more");
  row.append(less, lab, more);

  const when = el("div","bkstate");
  const offerSlot = el("div");
  const go = el("button","nudgeBtn","Keep it out");
  const back = el("button","nudgeBtn","Cancel");
  back.onclick = ev=>{ ev.stopPropagation(); backOut(); };
  const foot = el("div","exts-foot");
  foot.append(back, go);

  const paint = ()=>{
    days = Math.max(1, Math.min(room, days));
    lab.textContent = days + (days === 1 ? " day" : " days");
    less.disabled = days <= 1; more.disabled = days >= room;
    const back = Math.min(Math.max(block.end, 0) + days, DAYS - 1);
    const capped = days >= room;
    const nextUp = capped ? blockWall(block) : null;
    when.innerHTML = `Back on sale <b>${esc(fmtL(back))}</b>`
      + (nextUp ? ` · that is as far as it goes, ${esc(nextUp.guest)} `
                  + (nextUp.start < 0 ? `is in until ${esc(fmt(nextUp.end))}` : `arrives ${esc(fmt(nextUp.start))}`)
                : capped ? ` · as far as the free nights allow` : "");
    go.textContent = `Keep it out ${days} more day${days>1?"s":""}`;
    // the way past the wall only appears once you have actually hit it
    offerSlot.textContent = "";
    const o = wallOffer(block, nextUp); if(o) offerSlot.appendChild(o);
  };
  less.onclick = ev=>{ ev.stopPropagation(); days--; haptic(5); paint(); };
  more.onclick = ev=>{ ev.stopPropagation(); days++; haptic(5); paint(); };
  go.onclick = ev=>{ ev.stopPropagation(); extendBlock(block, days); haptic(18); refreshScreen(); };

  box.append(cap, row, when, offerSlot, foot);
  host.appendChild(box);
  paint();
}

function todayBoard(){
  const norm = weekdayFreeNorm();

  const decide = blockNudges().filter(n=>n.due <= NOW + 1).map(n=>({
    block:n.r, fi:n.r.fi,
    title:`Is ${flats[n.r.fi].id} back in service?`,
    why:`${n.r.reason.toLowerCase()} · ${n.when}${n.r.note ? " · " + n.r.note : ""}`,
  }));

  const todo = [];
  for(let d=0; d<=NOW; d++){
    const turns = dayOps(d).turnovers.map(t=>({fi:t.fi, d,
      meta:`<b>${t.out.guest}</b> out, <b>${t.in.guest}</b> in<em>${fmtL(d)}</em>`, pill:"clean"}));
    if(turns.length) todo.push({
      label:`Clean ${turns.length} flat${turns.length>1?"s":""} ${d===0?"today":"tomorrow"}`,
      note:"check-out and check-in the same day",
      open:()=>openFlatList(`${turns.length} to clean`, `${fmtL(d)} · check-out and check-in the same day`, turns)});
  }

  /* Logged faults never reached this board, which made logging one feel like
     writing into a drawer. Only two kinds belong here, because this card is
     things that stop being true if ignored: anything marked urgent, and
     anything at all on a flat with a guest arriving in the next two days —
     after that it is somebody else's problem to walk into. */
  {
    const urgent = openIssues().filter(x => x.urgency === "urgent");
    const arrivingSoon = openIssues().filter(x => x.urgency !== "urgent"
      && bookings().some(r => r.fi === x.fi && r.start >= 0 && r.start <= NOW + 1));
    const pressing = urgent.concat(arrivingSoon);
    if(pressing.length){
      const rows = pressing.map(x=>({fi:x.fi, d:0,
        meta:`<b>${esc(x.fault || "Issue")}</b> · ${esc(flats[x.fi].id)}`
           + `<em>${esc(x.note || "no note")}`
           + (x.urgency === "urgent" ? " · marked urgent" : " · a guest arrives within two days") + `</em>`,
        pill: x.urgency === "urgent" ? "urgent" : "before they arrive"}));
      todo.push({
        label: urgent.length && arrivingSoon.length
          ? `Fix ${pressing.length}: ${urgent.length} urgent, ${arrivingSoon.length} before a guest arrives`
          : urgent.length ? `Fix ${urgent.length} urgent thing${urgent.length>1?"s":""}`
          : `Fix ${arrivingSoon.length} thing${arrivingSoon.length>1?"s":""} before a guest arrives`,
        note: "logged faults on flats that are still on sale",
        open: ()=> openFlatList(`${pressing.length} to fix`,
          "still on sale, and wanted before the next guest", rows)});
    }
  }

  /* Money the operator can only collect while the guest is standing there.
     Arrivals are derived from dates and so are always right — which is exactly
     why this belongs here instead of behind a check-in button somebody has to
     remember to press. Platform bookings are deliberately absent: the guest owes
     nothing, and putting them on a chase list is how the column loses its
     meaning. */
  for(let d=0; d<=NOW; d++){
    const owing = bookings().filter(r => r.start === d && dueFrom(r) > 0);
    if(!owing.length) continue;
    const total = owing.reduce((s,r)=> s + dueFrom(r), 0);
    todo.push({
      label:`Collect ${money(total)} from ${owing.length} arrival${owing.length>1?"s":""} ${d===0?"today":"tomorrow"}`,
      note:"balance still due when they arrive",
      open:()=>openFlatList(`${money(total)} to collect`, `${fmtL(d)} · arriving with a balance`,
        owing.map(r=>({fi:r.fi, d,
          meta:`<b>${esc(r.guest)}</b>${r.phone ? " · " + esc(r.phone) : ""}`
             + `<em>${money(dueFrom(r))} of ${money(r.amount)} · ${esc(r.src)}</em>`,
          pill: money(dueFrom(r))})))});
  }

  const days = [];
  for(let d=0; d<=NOW; d++){
    const free = flats.map((f,i)=>i).filter(i=>!occ[i][d]);
    if(!free.length) continue;
    const depth = d===0 ? 25 : 20;
    const rows = free.map(i=>({fi:i, d,
      meta:`<b>${flats[i].type}</b> · ${flats[i].bshort}<em>free ${runFrom(i,d)} night${runFrom(i,d)>1?"s":""} from ${fmt(d)}</em>`,
      pill:`−${depth}%`}));
    days.push({d, n:free.length, depth,
      soft: free.length - norm[dateAt(d).getDay()] >= 2,
      open:()=>openFlatList(`${free.length} unsold ${d===0?"tonight":fmt(d)}`,
        d===0 ? "gone at midnight" : "one day left to sell", rows,
        {depth, when: d===0 ? `tonight, ${fmtL(0)}` : fmtL(d),
         lead:"These nights stop existing the morning after. Anything you take for them beats nothing."})});
  }

  const orph = orphanNights().filter(o=>o.d <= NOW).map(o=>({fi:o.fi, d:o.d,
    meta:`<b>${flats[o.fi].type}</b> · ${flats[o.fi].bshort}<em>${fmtL(o.d)} · booked either side</em>`,
    pill:"−25%"}));
  const ext = extensionOffers().filter(x=>x.from <= NOW + 1).map(x=>({fi:x.fi, d:x.from,
    meta:`Offer <b>${x.r.guest}</b> a discounted extra night<em>leaves ${fmt(x.from)} · ${x.nights} night${x.nights>1?"s":""} empty after</em>`,
    pill: x.orphan ? "closes a gap" : `+${x.nights}n`}));

  const extras = [];
  if(orph.length) extras.push({
    label:`${orph.length} single spare night${orph.length>1?"s":""}`,
    note:"booked either side, so they will not sell at a normal rate", pill:"−25%",
    open:()=>openFlatList(`${orph.length} single spare night${orph.length>1?"s":""}`,
      "booked either side · today and tomorrow", orph,
      {depth:25, when: orph.length===1 ? fmtL(orph[0].d) : "single nights, today and tomorrow",
       lead:"A single night between two bookings will not sell at a normal rate — most guests want two or more. The alternative is leaving it empty."})});
  if(ext.length) extras.push({
    label:`Offer ${ext.length} guest${ext.length>1?"s":""} an extra night`,
    note:"checking out soon, with the flat empty behind them", pill:"−20%",
    open:()=>openFlatList(`${ext.length} extension offer${ext.length>1?"s":""}`,
      "guests leaving today or tomorrow", ext,
      {lead:"A discounted extra night beats an empty one, and costs no commission and no clean in between. Speak to each guest before they check out."})});

  return {decide, todo, days, extras,
          count: decide.length + todo.length + days.length + extras.length};
}


function leadTimes(){
  const rs = resv.filter(r => typeof r.bookedOn === "number" && r.start >= r.bookedOn);
  if(!rs.length) return null;
  const days = rs.map(r => r.start - r.bookedOn).sort((a,b)=>a-b);
  return {n: days.length, median: days[Math.floor(days.length/2)],
          avg: days.reduce((a,b)=>a+b,0)/days.length};
}

function weekdayFreeNorm(){
  const acc = Array.from({length:7}, ()=>({sum:0,n:0}));
  for(let d=0; d<DAYS; d++){ const w = dateAt(d).getDay(); acc[w].sum += freeCount(d); acc[w].n++; }
  return acc.map(a => a.n ? a.sum/a.n : 0);
}
function softDates(norm){
  const out = [];
  const margin = Math.max(3, NF*0.09);
  for(let d=0; d<Math.min(DAYS,25); d++){          // only what there is still time to act on
    const f = freeCount(d), m = norm[dateAt(d).getDay()];
    if(f - m >= margin) out.push({d, free:f, norm:m, over:f-m});
  }
  return out.sort((a,b)=> b.over - a.over);
}

function weekdayPattern(days){
  const acc = Array.from({length:7}, ()=>({sold:0,total:0}));
  days.forEach(d=>{
    const w = dateAt(d).getDay();
    for(let i=0;i<NF;i++){ if(blk[i][d]) continue; acc[w].total++; if(occ[i][d]) acc[w].sold++; }
  });
  return acc.map(a => a.total ? a.sold/a.total : null);
}

const buildingsOf = ()=>{
  const seen = new Map();
  flats.forEach(f=>{ if(!seen.has(f.code)) seen.set(f.code, {code:f.code, name:f.bname, short:f.bshort}); });
  return [...seen.values()];
};

/* ── bookings ────────────────────────────────────────────────────────────────
   `resv` is the single source of truth. occ[] and chg[] are derived from it, so
   adding or cancelling a booking is just a mutation plus recompute().          */
let resv = [];
let occ = [], chg = [], blk = [];

/* These four sit here, immediately under the state they read, because the
   demo seeders below run during boot and reach for them. A `const` declared
   further down the file is not merely later — it is in its temporal dead zone,
   and the seeder dies with "cannot access before initialization". That has
   happened four times in this file now; keeping the primitives above their
   first caller is the fix that stops it happening a fifth. */
function freeRange(fi,a,b){ for(let d=a;d<b;d++){ if(d<0||d>=DAYS||occ[fi][d]) return false; } return true; }
function runFrom(fi,d){ let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++; return n; }
const SIZE = {"Studio":0, "1 BHK":1, "2 BHK":2, "3 BHK":3};
/* How many guests one booking may be worth disturbing. There IS a number — six
   people repacking for one arrival is a reorganisation, not a shuffle, and the
   search cost grows with it — but the number is not the app's opinion to keep
   to itself, and it should sit where a real operator would already have said no
   — eight, not four. Anything beyond it is counted and said out loud, so
   "no options" never quietly means "options you were not shown". */
const MOVE_CEILING = 8;
let movesBeyondCeiling = 0;

/* A block is an entry with kind:"block" — a flat out of service for maintenance,
   a deep clean or owner use. It occupies nights exactly like a booking so it can
   never be sold, but it is NOT a booking: it has no guest, it is excluded from
   arrivals, departures, turnarounds, stay length, source mix and extensions, and
   for occupancy it leaves the denominator rather than joining the numerator —
   otherwise blocking a flat would flatter your occupancy figure. */
const isBlock = r => r.kind === "block";
const bookings = () => resv.filter(r => !isBlock(r));

function recompute(){
  occ = flats.map(()=>new Uint8Array(DAYS));
  chg = flats.map(()=>new Uint8Array(DAYS));
  blk = flats.map(()=>new Uint8Array(DAYS));
  resv.forEach(r=>{
    for(let k=Math.max(r.start,0); k<Math.min(r.end,DAYS); k++){
      occ[r.fi][k]=1;
      if(isBlock(r)) blk[r.fi][k]=1;
    }
  });
  // a night that is booked AND is somebody's check-out morning is a same-day
  // turnaround — blocks never create one
  bookings().forEach(r=>{
    if(r.end>=0 && r.end<DAYS && occ[r.fi][r.end] && !blk[r.fi][r.end]) chg[r.fi][r.end]=1;
  });
}

/* Demand is not flat, and a demo with no pattern in it makes the Month panels
   look like they have nothing to say. Weekends carry the week and locations
   differ — which is what the weekday and building views exist to surface. */
const DOW_DEMAND = [0.86, 0.58, 0.55, 0.60, 0.80, 1.25, 1.20];   // Sun … Sat
const BLD_DEMAND = {TT:1.05, TN:0.72, MP:1.35, BH:0.66, LP:1.10};

const DEMO_PHONE = {}, DEMO_NUMBERS = [];
function generateDemo(){
  resv = []; DEMO_NUMBERS.length = 0;
  flats.forEach((fl,fi)=>{
    const bF = BLD_DEMAND[fl.code] ?? 1;
    let d = -2 - Math.floor(rng()*8);        // stays already in progress, some checking out today
    while(d < DAYS){
      const dt = dateAt(Math.max(d,0));
      const dw = dt.getDay();
      // guests book close to the date, so the far weeks are genuinely thinner
      const lead = 0.34 + 0.66 * Math.exp(-Math.max(0,d)/26);
      if(rng() > fl.pop * bF * DOW_DEMAND[dw] * lead){ d += 1; continue; }
      let n;
      if(dw === 5)      n = 2 + (rng() < .35 ? 1 : 0);   // Friday arrivals cover the weekend
      else if(dw === 6) n = 1 + (rng() < .5  ? 1 : 0);
      else              n = 1 + Math.floor(rng()*3);
      if(rng() < .12)   n += 3 + Math.floor(rng()*5);    // the occasional long stay
      const start=d, end=d+n;
      // end >= 0 keeps stays that check out this morning — they are today's departures
      if(end>=0 && start<DAYS){
        const guest = NAMES[Math.floor(rng()*NAMES.length)];
        const src = SRC[Math.floor(rng()*SRC.length)];
        // Most guests come once. Roughly one booking in six reuses an earlier
        // number, which is about the repeat rate a well-run short-let sees — and
        // it means the phone lookup has something true to find without claiming
        // somebody has stayed two dozen times.
        let ph;
        if(DEMO_NUMBERS.length && rng() < .17){
          ph = DEMO_NUMBERS[Math.floor(rng()*DEMO_NUMBERS.length)];
          DEMO_PHONE[ph] = DEMO_PHONE[ph] || guest;
        }else{
          ph = "9" + String(100000000 + Math.floor(rng()*899999999));
          DEMO_NUMBERS.push(ph); DEMO_PHONE[ph] = guest;
        }
        const amount = Math.round((fl.rate * n) / 100) * 100;
        // a returning number keeps the name it was first booked under
        const row = {fi, start, end, nights:n, guest: DEMO_PHONE[ph] || guest, src,
                     phone: ph, pax: 1 + Math.floor(rng()*4),
                     amount, pays: []};
        // platform bookings are settled by the guest before arrival; direct ones
        // usually carry an advance and a balance still to collect
        if(PLATFORMS.indexOf(src) >= 0) row.pays.push({id:"d"+resv.length, amount, method:"Platform", on:Math.max(start-3,-9)});
        else if(rng() < .62) row.pays.push({id:"d"+resv.length,
          amount: Math.round(amount * (rng() < .5 ? .5 : .3) / 100) * 100,
          method: rng() < .7 ? "UPI" : "Cash", on: Math.max(start - 2, -9)});
        resv.push(row);
      }
      // a well-run short-let re-lets back-to-back roughly a third of the time,
      // which is exactly what creates a same-day turnaround
      d = end + (rng() < .3 ? 0 : 1 + Math.floor(rng()*4));
    }
  });
}

/* A demo with no flats out of service never shows the maintenance side of the
   app, so seed a few — including one due back tomorrow, which is what makes
   the "is it back in service?" question appear. */
function seedDemoBlocks(){
  /* Two of these are the same AC in the same flat, six weeks apart and the
     second one inside the month after Ramesh's visit — which is the whole
     point of the feature and is invisible without a history to find. */
  const wants = [
    {reason:"Maintenance", note:"compressor topped up", start:-26, nights:2, at:"BH",
     fault:"AC", fixer:"Ramesh", phone:"9848012345", cost:1400},
    {reason:"Maintenance", note:"not cooling again",    start:-3,  nights:4, at:"BH",
     fault:"AC", fixer:"Ramesh", phone:"9848012345", cost:1200},
    {reason:"Maintenance", note:"geyser leaking",       start:-20, nights:2, at:"TT",
     fault:"Geyser", fixer:"Iqbal", phone:"9700045566", cost:900},
    {reason:"Deep clean",  note:"quarterly clean",      start: 4,  nights:2, at:"LP"},
    {reason:"Renovation",  note:"bathroom re-tiling",   start: 8,  nights:6, at:"TT",
     fault:"Plumbing", fixer:"Iqbal", phone:"9700045566"},
  ];
  wants.forEach(w=>{
    // occ only covers today onward, so nights before today must be checked
    // against the reservations themselves or a block can overlap a past stay
    const fits = (i, s) => {
      const to = s + w.nights, from = Math.max(s, 0);
      if(resv.some(r => r.fi === i && r.start < to && r.end > s)) return false;
      for(let d = from; d < to; d++) if(d < DAYS && occ[i][d]) return false;
      return true;
    };
    /* Spread them across buildings so the demo does not put every block in one
       block — except a repeat fault, which is only a repeat if it is the SAME
       flat. When the remembered flat is busy on the requested nights the answer
       is to slide the dates, not to give up and use a different flat: a second
       AC failure in a different apartment is not a fault coming back, and the
       whole "who fixed this last time" feature then has nothing to show. */
    let start = w.start, fi = -1;
    const want = w.fault ? DEMO_FAULT_FLAT[w.at + w.fault] : undefined;
    if(want !== undefined){
      for(const shift of [0,1,-1,2,-2,3,4,5,6,7]){
        if(fits(want, w.start + shift)){ fi = want; start = w.start + shift; break; }
      }
    }
    if(fi < 0) fi = flats.findIndex((f,i)=> f.code === w.at && fits(i, start));
    if(fi < 0) fi = flats.findIndex((f,i)=> fits(i, start));
    if(fi < 0) return;
    if(w.fault) DEMO_FAULT_FLAT[w.at + w.fault] = fi;
    resv.push({fi, start, end: start + w.nights, nights:w.nights, kind:"block",
               reason:w.reason, note:w.note, guest:"Out of service", src:"Block",
               fault:w.fault, fixer:w.fixer, fixer_phone:w.phone, cost:w.cost});
    recompute();                       // so the next block sees this one
  });
}
const DEMO_FAULT_FLAT = {};

/* One flat out of service whose wall a shuffle could actually push back.

   Every other block is placed blind, so whether the guest standing at the end
   of it happens to be movable is luck — and the offer to move them is invisible
   unless the demo contains a case where it fires. This finds a short stay a few
   days out that has somewhere to go, and puts a block in front of it.        */
function seedMoveableWall(){
  const cands = resv.filter(r => !isBlock(r) && r.start >= 2 && r.start <= 12
                                 && r.end - r.start <= 6);
  let best = null;
  for(const B of cands){
    for(const gap of [2,3,1]){
      const end = B.start - gap, start = end - 3;
      if(end < 0 || end > 2) continue;         // it has to be a decision due now
      // the block's own nights and the gap after it must both be clear
      if(resv.some(r => r.fi === B.fi && r.start < B.start && r.end > start)) continue;
      const row = {fi:B.fi, start, end, nights: end - start, kind:"block",
                   reason:"Maintenance", note:"kitchen chimney rewire",
                   guest:"Out of service", src:"Block", fault:"Electrical",
                   fixer:"Ramesh", fixer_phone:"9848012345", cost:2200};
      resv.push(row); recompute();
      const mv = moveFor(B);
      // a shuffle that buys one night is not worth a guest changing rooms, and
      // a demo of it teaches the wrong lesson — hold out for a real one
      const gain = mv ? extendAfter(row, mv) - maxExtend(row) : 0;
      resv.pop(); recompute();
      if(gain >= 3 && (!best || gain > best.gain)) best = {row, gain};
    }
  }
  if(!best) return false;
  resv.push(best.row); recompute();
  return true;
}

/* A festival weekend, staggered.

   Filling every flat for the SAME three nights would make the window
   unbookable and the shuffle impossible at once — there would be nowhere to
   move anyone to. A real book is not blocked like that: it is blocked by stays
   that cross the window at different angles, and that is exactly what leaves
   room to shuffle. So half the flats are busy over the front of the window and
   half over the back. Nothing is free for all three nights, plenty is free for
   part of it, and one flat is deliberately held by two back-to-back stays so
   the multi-guest case appears beside the single-guest one. */
const FULL_FROM = 18, FULL_NIGHTS = 3;
function seedFullHouse(){
  const A = FULL_FROM, B = A + FULL_NIGHTS;
  resv = resv.filter(r => !(r.start < B && r.end > A));
  const cash = (f, n) => Math.round(f.rate * n / 100) * 100;
  const num = i => "9" + String(100000000 + i * 7919).slice(0, 9);
  /* Two flats are deliberately held by MORE than one stay, so the shuffle has
     something bigger than a single move to offer. Without them every option in
     the window is one guest and the multi-guest case is invisible in the demo. */
  const chain = (i, f, cuts)=>{
    cuts.forEach(([s,e],k)=> resv.push({fi:i, start:s, end:e, nights:e-s,
      guest:NAMES[(3 + k*6 + i) % NAMES.length], src:SRC[(k+i) % SRC.length],
      phone:num(i + k*40), pax:2, amount:cash(f, e-s), pays:[]}));
  };
  flats.forEach((f, i)=>{
    if(i === 2){                                   // two guests → a 2-move option
      chain(i, f, [[A, A+1], [A+1, B]]);
      return;
    }
    if(i === 4){                                   // three guests → a 3-move option
      chain(i, f, [[A, A+1], [A+1, A+2], [A+2, B]]);
      return;
    }
    const front = i % 2 === 0;
    const s = front ? A : A + 1;
    const e = front ? A + 1 : B;
    resv.push({fi:i, start:s, end:e, nights:e - s,
               guest: NAMES[(i * 7) % NAMES.length], src: SRC[(i * 3) % SRC.length],
               phone:num(i), pax:2, amount:cash(f, e - s), pays:[]});
  });
}

/* A few things wrong with flats that are still perfectly sellable — which is
   the ordinary case, and invisible unless the demo has some. */
function seedDemoIssues(){
  issues = [];
  const want = [
    {code:"TT", fault:"Geyser", note:"slow to heat, guest mentioned it", urgency:"soon", on:-9},
    {code:"TT", fault:"Wi-Fi",  note:"drops in the back bedroom",        urgency:"whenever", on:-4},
    {code:"MP", fault:"AC",     note:"due its six-month service",        urgency:"soon", on:-15},
    {code:"BH", fault:"Furniture", note:"wardrobe door off its runner",  urgency:"whenever", on:-2},
    {code:"LP", fault:"Plumbing",  note:"kitchen tap dripping",          urgency:"urgent", on:-1},
  ];
  const used = {};
