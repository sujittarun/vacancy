        sel = {a: pendingStart, n: d - pendingStart};
        pendingStart = null;
      } else {
        sel = {a: d, n: 1};
        pendingStart = d;
      }
      revealPanel = true; haptic(9); renderMonth();
    };
    grid.appendChild(c);
  });
  cal.style.padding = "0";
  cal.append(dow, grid);
  attachSweep(grid, hud);

  /* Two paragraphs used to sit under the calendar explaining what the numbers
     mean and how to drag. Both were teaching, and teaching that is read once
     costs a section forever. What survives is the one line that is NEWS — a
     date running emptier than its weekday usually does — and only while a
     selection is in progress, the line that says what the next tap does. */
  const worst = soft[0];
  const key = el("p","insight");
  key.style.padding = "0 2px";
  if(pendingStart !== null){
    key.innerHTML = `Arriving <b>${fmtL(pendingStart)}</b> — now tap the departure date.`;
  }else if(worst){
    key.innerHTML = `<span class="hi">${fmtL(worst.d)} is running empty for a ${DOWF[dateAt(worst.d).getDay()]}</span>`
      + ` — ${worst.free} free against about ${Math.round(worst.norm)} on a normal one. The amber dots mark the rest.`;
  }else{
    key.remove();
  }

  s.append(nav, hud, cal);
  if(key.parentNode !== null || key.innerHTML) s.append(key);

  /* one panel for whatever is selected — a single night is just n = 1 */
  {
    const {a, n} = sel;
    const free = flats.map((f,i)=>i).filter(i=>freeRange(i, a, a+n));
    const panel = el("div","stack gap-s");
    const h = el("div","sect");
    h.append(el("span","lbl", n === 1 ? fmtL(a) : `${fmt(a)} → ${fmt(a+n)}`),
             el("span","lbl", n === 1 ? `${free.length} of ${NF} free`
                                      : `${n} nights · ${free.length} free`));
    const list = el("div","card");
    if(!free.length){
      list.appendChild(el("div","empty", n === 1
        ? "Fully booked that night. Nothing left to sell."
        : `No flat is free for all ${n} nights. Ask can suggest moving one guest to open one up.`));
    }
    free.forEach(fi=> list.appendChild(roomRow(fi, a, null)));
    panel.append(h, list);
    s.appendChild(panel);
    if(revealPanel){
      revealPanel = false;
      requestAnimationFrame(()=> panel.scrollIntoView({behavior: calm?"auto":"smooth", block:"nearest"}));
    }
  }
}

/* ═══════════════ SCREEN 4 — TRENDS ═══════════════ */

/* ══════════════ what the money is doing ═════════════════════════════════════
   Occupancy alone hides the thing that pays: a full house at a poor rate and a
   half-empty one at a good rate look identical on an occupancy chart. RevPAR
   folds price and occupancy into one number and is what operators actually run
   on. Everything here is honest about coverage — a booking with no amount
   recorded is excluded and SAID to be excluded, rather than quietly dragging
   the average down.                                                          */
function moneyStats(){
  const bk = bookings().filter(r => r.end > 0 && r.start < DAYS);
  let nightsSold = 0, revenue = 0, priced = 0, pricedNights = 0;
  bk.forEach(r=>{
    const n = Math.max(0, Math.min(r.end, DAYS) - Math.max(r.start, 0));
    nightsSold += n;
    if(r.amount && r.nights){
      priced++; pricedNights += n;
      revenue += r.amount * (n / r.nights);   // only the nights inside the horizon
    }
  });
  let sellable = 0;
  for(let d = 0; d < DAYS; d++) for(let i = 0; i < NF; i++) if(!blk[i][d]) sellable++;
  const adr = pricedNights ? revenue / pricedNights : 0;
  // scale the priced sample up to every sold night, so RevPAR is not understated
  // simply because some bookings have no figure against them
  const projected = pricedNights ? adr * nightsSold : 0;
  return {nightsSold, sellable, revenue, adr, priced, total: bk.length,
          coverage: bk.length ? priced / bk.length : 0,
          revpar: sellable ? projected / sellable : 0,
          listed: NF ? flats.reduce((s,f)=> s + (f.rate||0), 0) / NF : 0};
}

/* Money already agreed and not yet in hand, split by whether you can still do
   anything about it. A guest who has left owing is a different job from one who
   arrives on Tuesday. */
function owedStats(){
  const bk = bookings().filter(r => r.amount && dueFrom(r) > 0);
  const soon = bk.filter(r => r.start >= 0 && r.start <= 7);
  const gone = bk.filter(r => r.end <= 0);
  const sum = a => a.reduce((s,r)=> s + dueFrom(r), 0);
  return {total: sum(bk), count: bk.length,
          soon: sum(soon), soonN: soon.length,
          gone: sum(gone), goneN: gone.length,
          platform: bookings().reduce((s,r)=> s + withPlatform(r), 0)};
}

/* Repeat business, which is the cheapest revenue there is — no commission, no
   listing, no photographs. Only visible at all because a booking now carries a
   phone number. */
function guestStats(){
  const bk = bookings().filter(r => r.phone && r.end > 0 && r.start < DAYS);
  const by = {};
  bk.forEach(r=> (by[digits10(r.phone)] = by[digits10(r.phone)] || []).push(r));
  const people = Object.values(by);
  const repeat = people.filter(p => p.length > 1);
  const repeatRows = repeat.reduce((a,p)=> a.concat(p), []);
  const onceRows = people.filter(p => p.length === 1).map(p => p[0]);
  const avg = rows => { const v = rows.filter(r=>r.amount);
    return v.length ? v.reduce((s,r)=> s + r.amount, 0) / v.length : 0; };
  return {people: people.length, repeat: repeat.length,
          bookings: bk.length, repeatBookings: repeatRows.length,
          share: bk.length ? repeatRows.length / bk.length : 0,
          avgRepeat: avg(repeatRows), avgOnce: avg(onceRows),
          top: repeat.map(p=>({name: p[p.length-1].guest, phone: p[0].phone, stays: p.length,
                               spend: p.reduce((s,r)=> s + (r.amount||0), 0)}))
                     .sort((a,b)=> b.spend - a.spend)};
}

/* What keeping the place standing actually costs — the invoice plus the nights
   the repair took off the market, which is the half that never appears on any
   bill and is usually the larger one. */
function upkeepStats(){
  const jobs = resv.filter(isBlock);
  let bill = 0, lost = 0, nights = 0;
  const byFlat = {};
  const add = (fi, b, l, n)=>{
    bill += b; lost += l; nights += n;
    const g = byFlat[fi] = byFlat[fi] || {fi, bill:0, lost:0, jobs:0, nights:0};
    g.bill += b; g.lost += l; g.jobs++; g.nights += n;
  };
  jobs.forEach(r=>{ const c = outageCost(r); add(r.fi, c.bill, c.lost, c.nights); });
  /* A fault fixed while the flat stayed on sale still has an invoice — it just
     has no lost nights, which is the whole point of fixing it in a gap. Leaving
     these out made "what upkeep costs" a total of only the work that also cost
     you nights, which flatters the number in exactly the wrong direction. */
  const fixedIssues = issues.filter(x => x.fixed != null && x.cost);
  fixedIssues.forEach(x=> add(x.fi, x.cost, 0, 0));
  /* `jobs` stays the count of spells OUT OF SERVICE, because that is the phrase
     the panel prints. A fault fixed while the flat kept selling is real work
     with a real invoice, but calling it a spell out of service would be a lie
     in the one sentence that is meant to separate the two halves. It gets its
     own count instead — and a high one is the good news on this screen. */
  return {bill, lost, nights, total: bill + lost,
          jobs: jobs.length, onSale: fixedIssues.length,
          open: openIssues().length,
          flats: Object.values(byFlat).sort((a,b)=> (b.bill+b.lost) - (a.bill+a.lost))};
}

let pulseSeg = "now", pulseDir = 0;
const PULSE_SEGS = ["now","money","rooms","guests","upkeep"];

/* Move between Pulse segments. Direction is remembered so the deck arrives from
   the side you travelled, which is the whole difference between a screen that
   changed and a place you moved to. */
function pulseGo(dir){
  const at = PULSE_SEGS.indexOf(pulseSeg);
  const to = at + dir;
  if(to < 0 || to >= PULSE_SEGS.length) return false;
  pulseSeg = PULSE_SEGS[to]; pulseDir = dir;
  haptic(9); renderTrends();
  return true;
}
function renderTrends(){
  const s = document.getElementById("scr-trends");
  s.textContent = "";
  // one chokepoint: both ways of changing segment come through here
  try{ sessionStorage.setItem("vacancy.seg", pulseSeg); }catch(e){}
  /* Every panel below reads a distribution across the portfolio, and with no
     flats there is no distribution — the occupancy curve comes back empty and
     the first card reads curve[0]. Reachable in one move: clear the sample
     inventory before adding your own. Say so instead of showing a blank tab. */
  if(!NF){
    const tsg = document.getElementById("tabseg");
    if(tsg){ tsg.hidden = true; tsg.textContent = ""; }
    const e = el("div","tcard");
    e.append(el("h3",null,"Nothing to read yet"),
             el("div","cap","there are no flats in the book"));
    const b = el("div","body");
    b.appendChild(el("div","empty",
      "Add your apartments under Rooms → Inventory and this fills in on its own — "
      + "occupancy, which nights sell, how each building is doing."));
    e.appendChild(b);
    s.appendChild(e);
    return;
  }
  const all = []; for(let d=0; d<DAYS; d++) all.push(d);

  /* ── one question per segment ────────────────────────────────────────────────
     Pulse was nine cards in a single scroll: what to do today sat above how the
     year is going, and each new measure pushed the actionable ones further down.
     They answer different questions on different clocks — act now, earn, fill,
     return, spend — so they get a bar rather than a queue. */
  const SEGS = [["now","Now"],["money","Money"],["rooms","Rooms"],
                ["guests","Guests"],["upkeep","Upkeep"]];
  const seg = SEGS.some(s=>s[0] === pulseSeg) ? pulseSeg : "now";
  // the chips live in the header, not in this scroll — see .tabseg
  const bar = document.getElementById("tabseg");
  bar.textContent = ""; bar.hidden = false;
  SEGS.forEach(([k,label])=>{
    const b2 = el("button", null, label);
    b2.setAttribute("role","tab");
    b2.setAttribute("aria-selected", k === seg);
    if(k === "now" && todayBoard().count) b2.append(el("i","dot"));
    b2.onclick = ()=>{
      if(k === seg) return;
      pulseDir = SEGS.findIndex(x=>x[0]===k) > SEGS.findIndex(x=>x[0]===seg) ? 1 : -1;
      pulseSeg = k; haptic(9); renderTrends();
    };
    bar.appendChild(b2);
  });
  requestAnimationFrame(()=>{
    const on = bar.querySelector('[aria-selected="true"]');
    if(on && on.scrollIntoView) on.scrollIntoView({block:"nearest", inline:"center"});
  });

  const deck = el("div","deck");
  if(pulseDir && !calm){
    deck.classList.add("slide");
    deck.style.setProperty("--from", (pulseDir > 0 ? 26 : -26) + "px");
  }
  pulseDir = 0;
  const card = (title, cap)=>{
    const c = el("div","tcard");
    c.append(el("h3",null,title), el("div","cap",cap));
    const b = el("div","body"); c.appendChild(b);
    deck.appendChild(c);
    return {c, b};
  };
  const said = (c, html)=>{ const p = el("p","said"); p.innerHTML = html; c.appendChild(p); };
  /* A chart that only draws is a picture. Touch a bar and it says what it is in
     words, and where there is something to do about it, offers the route. The
     readout sits in a fixed slot under the chart so nothing reflows and the
     cards below never jump.                                                   */
  const vbars = (rows, accIdx, tell)=>{
    const wrap = el("div","vwrap");
    const w = el("div","vbars");
    const max = Math.max(...rows.map(r=>r.v), 0.0001);
    const out = el("div","vsay");
    let picked = -1;
    const bars = [];
    rows.forEach((r,i)=>{
      const b = el(tell ? "button" : "div", "vbar" + (i===accIdx ? " acc" : ""));
      b.append(el("div","v", r.label));
      const col = el("div","col"); const fill = el("i");
      fill.style.height = "100%";
      fill.style.setProperty("--v", Math.max(.02, r.v/max).toFixed(3));
      col.appendChild(fill);
      b.append(col, el("div","k", r.k));
      if(tell){
        b.setAttribute("aria-label", r.k + ", " + r.label);
        b.onclick = ()=>{
          picked = picked === i ? -1 : i;
          bars.forEach((z,j)=> z.classList.toggle("on", j === picked));
          out.textContent = "";
          if(picked < 0){ wrap.classList.remove("telling"); return; }
          const said2 = tell(rows[i], i);
          if(!said2){ wrap.classList.remove("telling"); return; }
          wrap.classList.add("telling");
          const inner = el("div","vsay-in");
          const line = el("div","vsay-l"); line.innerHTML = said2.text;
          inner.append(line);
          if(said2.go){
            const a2 = el("button","vsay-go", said2.go.label);
            a2.onclick = ev=>{ ev.stopPropagation(); haptic(10); said2.go.run(); };
            inner.append(a2);
          }
          out.append(inner);
          haptic(7);
        };
      }
      bars.push(b);
      w.appendChild(b);
    });
    wrap.append(w, out);
    return wrap;
  };
  const hbars = (rows, lowKey)=>{
    const w = el("div","pat"); w.style.padding = "0";
    rows.forEach(r=>{
      const row = el("div","patrow" + (r.k===lowKey ? " low" : ""));
      row.append(el("div","k", r.k));
      const t = el("div","t"); const i = el("i");
      i.style.setProperty("--v", Math.max(.02, r.pct).toFixed(3));
      t.appendChild(i);
      row.append(t, el("div","v", r.right));
      w.appendChild(row);
    });
    return w;
  };

  /* 0 — the board. Grouped by the response each thing needs. */
  const board = todayBoard();
  if(seg === "now" && board.count){
    const {c,b} = card("Worth doing now", "today and tomorrow · what expires if ignored");
    b.style.justifyContent = "flex-start";
    const wrap = el("div","board");

    /* DECIDE — questions only the operator can answer */
    if(board.decide.length){
      const sec = el("div","bsec");
      sec.appendChild(el("div","lbl", board.decide.length === 1 ? "Needs a decision" : `${board.decide.length} need a decision`));
      board.decide.slice(0,3).forEach(dcd=>{
        const box = el("div","decide");
        box.append(el("b",null,dcd.title), el("s",null,dcd.why));
        const ans = el("div","nudge");
        const yes = el("button","nudgeBtn yes","Back in service");
        yes.onclick = ev=>{
          ev.stopPropagation(); haptic(12);
          const r = dcd.block, fl2 = flats[r.fi];
          openFixedForm({
            fi: r.fi, fault: r.fault || "",
            assigned: r.fixer || "", assignedPhone: r.fixer_phone || "",
            line: `<b>${esc(r.fault || r.reason || "Out of service")}</b> · ${esc(fl2.id)} `
                + `out since ${fmt(Math.max(r.start, 0))}`,
            cta: "Back in service",
            back: closeSheet,
            onDone: d=>{ releaseBlock(r, d); closeSheet(); refreshScreen(); }
          });
        };
        const still = el("button","nudgeBtn","Still out ⌄");
        still.onclick = ev=>{ ev.stopPropagation(); haptic(10);
          // the two answers are replaced by the stepper, so the stepper has to
          // carry the way back — otherwise the only exit from a question the
          // operator opened by accident is to leave the tab
          ans.remove();
          attachDaysSlider(box, dcd.block, ()=>{
            box.querySelectorAll(".exts").forEach(e=>e.remove());
            box.appendChild(ans);
            haptic(8);
          });
        };
        ans.append(yes, still);
        box.appendChild(ans);
        sec.appendChild(box);
      });
      if(board.decide.length > 3){
        const more = el("div","lbl");
        more.style.margin = "0 2px";
        more.textContent = `+${board.decide.length - 3} more waiting on you`;
        sec.appendChild(more);
      }
      wrap.appendChild(sec);
    }

    /* TO DO — work that must happen */
    if(board.todo.length){
      const sec = el("div","bsec");
      sec.appendChild(el("div","lbl","To do"));
      board.todo.forEach(t=>{
        const row = el("button","line");
        const tx = el("div","t");
        tx.append(el("b",null,t.label), el("s",null,t.note));
        row.append(tx, el("span","chev","›"));
        row.onclick = ()=>{ haptic(10); t.open(); };
        sec.appendChild(row);
      });
      wrap.appendChild(sec);
    }

    /* PERISHING — nights with a clock on them */
    if(board.days.length || board.extras.length){
      const sec = el("div","bsec");
      sec.appendChild(el("div","lbl","Perishing · sell or lose"));
      if(board.days.length){
        const duo = el("div","duo");
        board.days.forEach(dd=>{
          const cell = el("button","dcell" + (dd.d === 0 ? " urgent" : ""));
          cell.append(el("div","k", dd.d === 0 ? "Tonight" : "Tomorrow"),
                      el("div","n", String(dd.n)),
                      el("div","s", dd.soft ? "unsold · softer than usual" : "unsold"),
                      el("div","d", `−${dd.depth}%`));
          cell.setAttribute("aria-label", `${dd.n} flats unsold ${dd.d===0?"tonight":"tomorrow"} — open the list`);
          cell.onclick = ()=>{ haptic(10); dd.open(); };
          duo.appendChild(cell);
        });
        sec.appendChild(duo);
      }
      board.extras.forEach(x=>{
        const row = el("button","line");
        const tx = el("div","t");
        tx.append(el("b",null,x.label), el("s",null,x.note));
        row.append(tx, el("span","pill now", x.pill), el("span","chev","›"));
        row.onclick = ()=>{ haptic(10); x.open(); };
        sec.appendChild(row);
      });
      wrap.appendChild(sec);
    }

    b.appendChild(wrap);
  } else if(seg === "now"){
    // the all-clear belongs to Now; it was leaking onto every other segment
    const line = el("div","allclear");
    line.append(el("div","tick","✓"));
    const t = el("div");
    t.innerHTML = `<b>Nothing needs attention today.</b> No cleans between guests, no flat due back from maintenance, and every room tonight is sold.`;
    line.appendChild(t);
    deck.appendChild(line);
  }

  /* 1 — the booking curve */

  /* ── MONEY ─────────────────────────────────────────────────────────────── */
  if(seg === "money"){
    const M = moneyStats();
    const {c,b} = card("What a night is worth", "revenue per available night");
    const head = el("div","headline");
    head.append(el("b", null, money(M.revpar)));
    head.append(el("s", null, `per available night · ${money(M.adr)} average when sold`));
    b.appendChild(head);
    b.appendChild(vbars([
      {v: M.revpar, label: Math.round(M.revpar/100)/10 + "k", k:"RevPAR"},
      {v: M.adr,    label: Math.round(M.adr/100)/10 + "k",    k:"Achieved"},
      {v: M.listed, label: Math.round(M.listed/100)/10 + "k", k:"Listed"},
    ], 0));
    said(c, M.priced === 0
      ? `No amounts recorded yet, so there is nothing to average. Put a figure on a booking and this fills in.`
      : `Occupancy alone cannot tell you this: a full house at a poor rate and a half-empty one at a good rate `
        + `look the same on an occupancy chart. <b>${money(M.revpar)}</b> is what each of your ${M.sellable.toLocaleString("en-IN")} `
        + `sellable nights earns on average. The gap between <b>achieved</b> and <b>listed</b> is what you are actually `
        + `discounting — ${M.adr >= M.listed ? "you are holding your rate" : `about <span class="hi">${Math.round((1 - M.adr/M.listed)*100)}%</span> off`}.`
        + (M.coverage < 0.95 ? ` Based on the <b>${M.priced} of ${M.total}</b> bookings that carry an amount.` : ""));
  }

  if(seg === "money"){
    const O = owedStats();
    const {c,b} = card("What you are owed", "agreed but not in hand");
    const head = el("div","headline");
    head.append(el("b", null, money(O.total)));
    head.append(el("s", null, `across ${O.count} booking${O.count===1?"":"s"}`));
    b.appendChild(head);
    const rows = el("div","card");
    [["Arriving within a week", O.soon, O.soonN, "collect at the door"],
     ["Already left", O.gone, O.goneN, "has to be chased"],
     ["Sitting with a platform", O.platform, null, "coming to you, do not chase"]]
      .forEach(([k, v, n, why])=>{
        if(!v) return;
        const r = el("div","row bk");
        const m = el("div","meta");
        m.innerHTML = `<b>${esc(k)}</b><em>${esc(why)}${n != null ? ` · ${n} booking${n===1?"":"s"}` : ""}</em>`;
        const e = el("div","rowend");
        e.append(el("span", "paid " + (k === "Already left" ? "due" : "clear"), money(v)));
        r.append(m, e);
        rows.appendChild(r);
      });
    if(!O.total && !O.platform) rows.appendChild(el("div","empty","Nothing outstanding — every booking is settled."));
    b.appendChild(rows);
    said(c, O.gone > 0
      ? `<b>${money(O.gone)}</b> is owed by guests who have already gone, which is the money that quietly never arrives. `
        + `The rest is collectable while they are standing in front of you.`
      : `Nothing has walked out unpaid. The balance is with guests still to arrive, which is the easy kind to collect.`);
  }

  /* ── GUESTS ────────────────────────────────────────────────────────────── */
  if(seg === "guests"){
    const G = guestStats();
    const {c,b} = card("Guests who come back", "repeat business in the book");
    const head = el("div","headline");
    head.append(el("b", null, Math.round(G.share*100) + "%"));
    head.append(el("s", null, `of bookings · ${G.repeat} of ${G.people} people have stayed before`));
    b.appendChild(head);
    if(G.avgRepeat && G.avgOnce) b.appendChild(vbars([
      {v: G.avgOnce,  label: Math.round(G.avgOnce/100)/10 + "k",  k:"First time"},
      {v: G.avgRepeat,label: Math.round(G.avgRepeat/100)/10 + "k",k:"Returning"},
    ], G.avgRepeat >= G.avgOnce ? 1 : 0));
    const top = el("div","card");
    G.top.slice(0,5).forEach(g=>{
      const r = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(g.name)}</b><em>${g.stays} stays · ${esc(g.phone)}</em>`;
      const e = el("div","rowend");
      e.append(el("span","paid clear", money(g.spend)));
      const call = el("a","rowx");
      call.href = "tel:" + String(g.phone).replace(/[^\d+]/g,"");
      call.textContent = "☎";
      call.setAttribute("aria-label", "Call " + g.name);
      e.append(call);
      r.append(m, e);
      top.appendChild(r);
    });
    if(!G.top.length) top.appendChild(el("div","empty","Nobody has booked twice yet — this fills in as numbers repeat."));
    b.appendChild(top);
    said(c, G.repeat
      ? `Repeat guests are the cheapest revenue there is: no commission, no listing, no photographs. `
        + (G.avgRepeat > G.avgOnce
            ? `Yours also spend <span class="hi">${Math.round((G.avgRepeat/G.avgOnce - 1)*100)}% more</span> than first-timers.`
            : `They are worth about the same as a first-timer here, so the saving is the commission you did not pay.`)
        + ` The numbers are in the export — that list is who to message when a week looks thin.`
      : `This only counts once a phone number turns up twice, so it grows with use. It is worth entering numbers `
        + `even on walk-ins for exactly this reason.`);
  }

  /* ── UPKEEP ────────────────────────────────────────────────────────────── */
  if(seg === "upkeep"){
    const U = upkeepStats();
    const {c,b} = card("What upkeep costs", "the bill, and the nights it took");
    const head = el("div","headline");
    head.append(el("b", null, money(U.total)));
    head.append(el("s", null, `${U.jobs} spell${U.jobs===1?"":"s"} out of service · ${U.nights} night${U.nights===1?"":"s"} lost`
      + (U.onSale ? ` · ${U.onSale} fixed without going out` : "")));
    b.appendChild(head);
    if(U.total) b.appendChild(vbars([
      {v: U.bill, label: Math.round(U.bill/100)/10 + "k", k:"Invoices"},
      {v: U.lost, label: Math.round(U.lost/100)/10 + "k", k:"Lost nights"},
    ], U.lost > U.bill ? 1 : 0));
    said(c, U.total
      ? `The invoice is the half everybody counts. <b>${money(U.lost)}</b> is the half nobody does — the nights the flat `
        + `could not be sold while the work happened`
        + (U.lost > U.bill ? `, and here it is the <span class="hi">larger</span> of the two. That is the argument for paying more for someone who can come today.` : `.`)
        + (U.open ? ` ${U.open} thing${U.open===1?" is":"s are"} still waiting to be fixed.` : "")
      : `Nothing has gone out of service yet. When it does, this counts the bill and the nights together.`);
  }

  if(seg === "upkeep"){
    const U = upkeepStats();
    const {c,b} = card("Which flats cost you", "repairs and lost nights, by flat");
    const rows = el("div","card");
    U.flats.slice(0,6).forEach(g=>{
      const r = el("button","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(flats[g.fi].id)}</b><em>${g.jobs} spell${g.jobs===1?"":"s"} · ${g.nights} night${g.nights===1?"":"s"} lost</em>`;
      const e = el("div","rowend");
      e.append(el("span","paid " + (g.bill + g.lost > 0 ? "due" : "clear"), money(g.bill + g.lost)));
      r.append(m, e);
      r.onclick = ()=>{ haptic(9); openSheet(g.fi); };
      rows.appendChild(r);
    });
    if(!U.flats.length) rows.appendChild(el("div","empty","No flat has been out of service yet."));
    b.appendChild(rows);
    said(c, U.flats.length > 1
      ? `A flat that keeps appearing here is telling you something an average never will — that the money is going `
        + `into one address. Tap one to see what kept breaking.`
      : `Once a few repairs are logged this ranks the flats, which is how a quietly expensive one gets noticed.`);
  }

  if(seg === "upkeep"){
    const F = fixers();
    const {c,b} = card("Whose work sticks", "and whose comes back");
    const rows = el("div","card");
    F.forEach(g=>{
      const r = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(g.name)}</b><em>${g.jobs} job${g.jobs===1?"":"s"}`
                  + (g.spend ? ` · ${money(g.spend)}` : "") + `</em>`;
      const e = el("div","rowend");
      e.append(el("span", "paid " + (g.back ? "due" : "clear"),
                 g.back ? `${g.back} came back` : "none came back"));
      if(g.phone){
        const call = el("a","rowx");
        call.href = "tel:" + String(g.phone).replace(/[^\d+]/g,"");
        call.textContent = "☎";
        call.setAttribute("aria-label", "Call " + g.name);
        e.append(call);
      }
      r.append(m, e);
      rows.appendChild(r);
    });
    if(!F.length) rows.appendChild(el("div","empty","Nobody recorded yet. Put a name against a repair and this builds itself."));
    b.appendChild(rows);
    const worst = F[0];
    said(c, worst && worst.back
      ? `<b>${esc(worst.name)}</b> has had <span class="hi">${worst.back} of ${worst.jobs}</span> jobs come back within a month. `
        + `The trade calls this first-time fix rate; below about seven in ten, a cheaper tradesman costs more than a dearer one `
        + `because you pay for the second visit and lose the nights twice.`
      : `Nothing has come back within a month, which is what good work looks like. This is the number worth watching `
        + `before deciding who to keep calling.`);
  }

  if(seg === "rooms"){
    const curve = bookingCurve();
    const {c,b} = card("How your book fills", "occupancy by week ahead");
    const near = curve[0], far = curve[curve.length-1];
    const head = el("div","headline");
    head.append(el("b",null, Math.round(near.pct*100)+"%"));
    head.append(el("s",null, `this week, falling to ${Math.round(far.pct*100)}% by week ${curve.length}`));
    b.appendChild(head);
    b.appendChild(vbars(curve.map((x,i)=>({v:x.pct, label:Math.round(x.pct*100)+"", k:"W"+(i+1)})), 0,
      (r, i)=>{
        const from = i*7, to = Math.min(from+7, DAYS);
        let free = 0;
        for(let d = from; d < to; d++) for(let j = 0; j < NF; j++)
          if(!blk[j][d] && !occ[j][d]) free++;
        return {text: `<b>${fmt(from)} → ${fmt(to-1)}</b> · ${Math.round(r.v*100)}% booked · `
                    + `<b>${free}</b> room-night${free===1?"":"s"} still to sell`,
                go: free ? {label:"See that week →", run:()=>{ pickedNight = from; switchTo(1); }} : null};
      }));
    const halfway = curve.findIndex(x=> x.pct < near.pct/2);
    const drop = near.pct - far.pct;
    said(c, `Bookings arrive close to the date, so the far weeks <b>should</b> look thin — that is the shape of a healthy book, not a problem. `
      + (halfway > 0
          ? `Yours halves by <span class="hi">week ${halfway+1}</span>, which is where your booking window really ends.`
          : drop > .12
            ? `Yours falls <span class="hi">${Math.round(drop*100)} points</span> across the nine weeks without halving — a longer window than most short-lets run.`
            : `Yours is <span class="hi">unusually flat</span> — the far weeks are filling about as well as the near ones, which usually means long stays rather than strong demand.`)
      + ` What matters is watching this curve week to week: a week that stops filling as it approaches is the one to act on.`);
  }

  /* 2 — which nights sell */
  if(seg === "rooms"){
    const wk = weekdayPattern(all);
    const {c,b} = card("Which nights sell", "occupancy by day of week");
    const order = [1,2,3,4,5,6,0];
    const worst = order.reduce((a,d)=> wk[d] < wk[a] ? d : a, order[0]);
    const best  = order.reduce((a,d)=> wk[d] > wk[a] ? d : a, order[0]);
    b.appendChild(vbars(order.map(d=>({v:wk[d], label:Math.round(wk[d]*100)+"", k:DOW[d][0]})),
      order.indexOf(worst),
      (r, i)=>{
        const dow = order[i];
        const days = []; for(let d2=0; d2<DAYS; d2++) if(dateAt(d2).getDay() === dow) days.push(d2);
        const emptiest = days.map(d2=>({d:d2, free:freeCount(d2)})).sort((x,y)=> y.free - x.free)[0];
        const gap = Math.round((wk[best] - wk[dow]) * 100);
        return {text: `<b>${DOWF[dow]}s</b> run at ${Math.round(wk[dow]*100)}%`
                    + (gap > 0 ? ` — <span class="hi">${gap} points</span> under ${DOWF[best]}s` : ` — your strongest night`)
                    + (emptiest ? `. Emptiest is ${fmt(emptiest.d)}, ${emptiest.free} free.` : "."),
                go: emptiest ? {label:`See ${fmt(emptiest.d)} →`, run:()=>{ pickedNight = emptiest.d; switchTo(0); }} : null};
      }));
    said(c, `<b>${DOWF[worst]}s</b> run at <span class="hi">${Math.round(wk[worst]*100)}%</span> against ${Math.round(wk[best]*100)}% on ${DOWF[best]}s — a ${Math.round((wk[best]-wk[worst])*100)} point gap. Midweek pricing, or a minimum stay that forces weekend guests to take a shoulder night, is what usually closes it.`);
  }

  /* 3 — by building */
  if(seg === "rooms"){
    const rows = groupOcc(all, f=>f.bname);
    const {c,b} = card("How each building is doing", "occupancy across the nine weeks");
    b.appendChild(hbars(rows.slice().reverse().map(r=>({k:r.k, pct:r.pct, right:Math.round(r.pct*100)+"%"})),
                        rows[0].k));
    const gap = Math.round((rows[rows.length-1].pct - rows[0].pct)*100);
    said(c, gap > 8
      ? `<b>${rows[0].k}</b> is <span class="hi">${gap} points behind</span> ${rows[rows.length-1].k}. Same city, same weeks — a gap that size is pricing, photos or listing reach, not demand.`
      : `All ${rows.length} buildings sit within ${gap} points of each other. Nothing here needs attention.`);
  }

  /* 4 — by unit type */
  if(seg === "rooms"){
    const rows = groupOcc(all, f=>f.type);
    const {c,b} = card("Which sizes sell", "occupancy by unit type");
    b.appendChild(hbars(rows.slice().reverse().map(r=>({k:`${r.k} · ${r.units} flat${r.units>1?"s":""}`,
      pct:r.pct, right:Math.round(r.pct*100)+"%"})), null));
    const lo = rows[0], hi = rows[rows.length-1];
    said(c, `Your <b>${hi.k}</b> stock runs at ${Math.round(hi.pct*100)}% while <b>${lo.k}</b> sits at <span class="hi">${Math.round(lo.pct*100)}%</span>. If the weak size is also the one you hold most of, that is where the portfolio is losing nights.`);
  }

  /* 5 — length of stay */
  if(seg === "guests"){
    const m = stayMix();
    const {c,b} = card("How long people stay", `${m.total} bookings in the next nine weeks`);
    const head = el("div","headline");
    head.append(el("b",null, m.alos.toFixed(1)));
    head.append(el("s",null, "nights, average stay"));
    b.appendChild(head);
    b.appendChild(vbars(m.out.map(x=>({v:x.n, label:String(x.n), k:x.k})), 0));
    const short = m.out[0].n / Math.max(1,m.total);
    said(c, `<span class="hi">${Math.round(short*100)}%</span> of your bookings are single nights. Every one is a full changeover — a clean, a key handover and a gap either side — for one night's income. Nudging the average from ${m.alos.toFixed(1)} to ${(m.alos+0.5).toFixed(1)} nights is usually worth more than filling extra dates.`);
  }

  /* 6 — where bookings come from */
  if(seg === "money"){
    const m = sourceMix();
    const {c,b} = card("Where bookings come from", `${m.total} bookings in the next nine weeks`);
    b.appendChild(hbars(m.rows.map(r=>({k:r.k, pct:r.n/Math.max(1,m.total),
      right:Math.round(r.n/Math.max(1,m.total)*100)+"%"})), null));
    const direct = m.rows.filter(r=>/direct|walk|repeat/i.test(r.k)).reduce((a,r)=>a+r.n,0);
    said(c, `<b>${Math.round(direct/Math.max(1,m.total)*100)}%</b> come to you directly — by phone, walk-in or a returning guest — and carry no platform commission. That share is the single number most worth growing, and it is the one the listing sites never show you.`);
  }

  /* 7 — turnaround load */
  if(seg === "rooms"){
    const load = turnLoad(14);
    const {c,b} = card("The cleaning week", "same-day turnarounds, next fortnight");
    const peak = load.reduce((a,x)=> x.n > a.n ? x : a, load[0]);
    const head = el("div","headline");
    head.append(el("b",null, String(load.reduce((a,x)=>a+x.n,0))));
    head.append(el("s",null, "rooms need a same-day turnaround in the next 14 days"));
    b.appendChild(head);
    b.appendChild(vbars(load.map(x=>({v:x.n, label:String(x.n),
      k: x.d===0 ? "T" : DOW[dateAt(x.d).getDay()][0]})), load.indexOf(peak)));
    said(c, peak.n > 0
      ? `<span class="hi">${fmtL(peak.d)}</span> is the heaviest, with ${peak.n} room${peak.n>1?"s":""} to turn between a check-out and a check-in. That is the day to have extra help booked, and almost nothing at this scale tells you it is coming.`
      : `No same-day turnarounds in the next fortnight — every check-out has a clear day behind it.`);
  }

  /* 8 — fragmentation */
  if(seg === "rooms"){
    const f = fragmentation();
    const {c,b} = card("How broken up the gaps are", "empty stretches between bookings");
    const head = el("div","headline");
    head.append(el("b",null, String(f.orphans)));
    head.append(el("s",null, `single orphan nights, out of ${f.runs} empty stretches`));
    b.appendChild(head);
    b.appendChild(hbars([
      {k:"Orphan (1 night)", pct: f.orphans/Math.max(1,f.runs), right:String(f.orphans)},
      {k:"Sellable stretches", pct:(f.runs-f.orphans)/Math.max(1,f.runs), right:String(f.runs-f.orphans)},
    ], "Orphan (1 night)"));
    said(c, `Your empty time averages <b>${f.avg.toFixed(1)} nights</b> per stretch. Ten scattered single nights are far harder to fill than one ten-night hole, so this — not the vacancy count — is the honest measure of how sellable your empty time actually is.`);
  }

  s.appendChild(deck);

  /* reveal each section as it arrives; bars grow with it */
  if(window.IntersectionObserver && !calm){
    const cards = [...deck.children];
    cards.forEach(c=> c.classList.add("pending"));
    // root is the scrolling panel, not the viewport — these live inside an
    // absolutely positioned scroller
    const io = new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.remove("pending"); io.unobserve(e.target); }
    }), {root:s, threshold:.12});
    cards.forEach(c=> io.observe(c));
    requestAnimationFrame(()=> cards[0] && cards[0].classList.remove("pending"));
    // belt and braces: nothing stays hidden even if the observer never fires
    setTimeout(()=>cards.forEach(c=>c.classList.remove("pending")), 2500);
  }

  const lead = leadTimes();
  const foot = el("p");
  foot.style.cssText = "margin:20px 2px 0;font-size:12px;line-height:1.6;color:var(--txt-3)";
  foot.innerHTML = lead
    ? `Every booking you enter records the day you took it, so lead time is now measurable: across ${lead.n} of your own bookings the typical one arrives <b style="color:var(--txt-2)">${lead.median} days</b> before check-in.`
    : `<b style="color:var(--txt-2)">There is no history here yet.</b> Everything above reads the forward book — today through ${fmtL(DAYS-1)} — because that is all the app truly knows. Each booking you enter from now records the day you took it, so lead time and week-on-week pace become real once it has been used for a while. Nothing on these cards is estimated or borrowed from elsewhere.`;
  s.appendChild(foot);
}

/* ═══════════════ SCREEN 3 — ASK ═══════════════ */
/* Questions, not syntax. The old chips were a cheat-sheet for the parser —
   "15-18", "3 bhk banjara" — which teaches the language but answers nothing.
   These are the things actually asked down a phone, and each is one tap. */
const SUGGEST = ["tonight","tomorrow","this weekend","3 nights","next week"];
let lastQuery = "tonight";
/* the last few real questions, so a repeat is a tap rather than retyping */
let recentAsks = [];

/* ══════════════════════════════════════════════════════════════════════════
   Query understanding

   Written as a small grammar rather than a pile of special cases:

       query := filters? duration? ( date ( "-" date )? )?

   Each part is consumed and its tokens REMOVED before the next part runs, so
   a number can never be read as two things at once. That single rule is what
   kept breaking before: "3 nights from friday" read the 3 as a day of the
   month, "2 bhk" read the 2 as a date, "16 sep" ignored the month entirely.

   Anything left unrecognised is simply skipped, so filler words are harmless.
   ══════════════════════════════════════════════════════════════════════════ */

const MONTHS = {jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,
  jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,
  oct:9,october:9,nov:10,november:10,dec:11,december:11};
const MONTH_ABBR = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const WEEKDAYS = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,
  thu:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const NUMWORDS = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
  ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14};
const NIGHT_UNIT = /^(n|nt|nts|night|nights)$/;
const WEEK_UNIT  = /^(w|wk|wks|week|weeks)$/;

const ord = d => (d%10===1&&d%100!==11)?"st":(d%10===2&&d%100!==12)?"nd":(d%10===3&&d%100!==13)?"rd":"th";
const nextWeekend = ()=>{ let a=0; while(a<DAYS && dateAt(a).getDay()!==5) a++; return {a, b:Math.min(a+2,DAYS)}; };
const numOf = t => /^\d{1,2}$/.test(t) ? +t : (NUMWORDS[t] ?? null);

/* Offset of the next calendar date matching dom (and month, if given) that is
   at least `minOff` days out. Rolls into next year, rejects 31 Feb, and is not
   capped by the 63-day horizon — the caller decides what to do about that. */
function absoluteOffset(dom, monthIdx, minOff){
  minOff = minOff || 0;
  const m0 = today.getMonth(), y0 = today.getFullYear();
  for(let k = 0; k < 18; k++){
    const m = (m0 + k) % 12, y = y0 + Math.floor((m0 + k) / 12);
    if(monthIdx !== null && m !== monthIdx) continue;
    const dt = new Date(y, m, dom); dt.setHours(0,0,0,0);
    if(dt.getMonth() !== m) continue;                 // e.g. 31 Feb
    const off = Math.round((dt - today) / 86400000);
    if(off >= minOff) return off;
  }
  return null;
}
function nextDow(dow, minOff){
  for(let d = minOff || 0; d < minOff + 14; d++) if(dateAt(d).getDay() === dow) return d;
  return 0;
}

function normalize(q){
  return q.toLowerCase()
    .replace(/(\d+)\s*(?:st|nd|rd|th)\b/g, "$1")                                   // 15th → 15
    .replace(/\b(\d{1,2})\s*[/.]\s*(\d{1,2})(?:\s*[/.]\s*\d{2,4})?\b/g,            // 16/9 → 16 sep
             (_,d,mo)=> `${d} ${MONTH_ABBR[(Math.min(12,Math.max(1,+mo)) - 1)]}`)
    .replace(/\b(?:to|till|until|thru|through|upto)\b/g, "-")                      // ranges → one token
    .replace(/[–—]/g, "-")
    .replace(/(\d)\s*-\s*/g, "$1 - ")
    .replace(/[^a-z0-9 \-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* Reads one date expression starting at token i. Returns null if there isn't one. */
function readDate(tk, i, minOff){
  const t = tk[i]; if(!t) return null;
  // a day of the month must be written in digits. "a"/"one" are counts, never dates —
  // otherwise "have a 3 bhk free from 16 sep" reads the "a" as the 1st.
  const digit = t => /^\d{1,2}$/.test(t) ? +t : null;
  const num = digit(t);
  const mon = MONTHS[t] ?? null;

  if(t === "today" || t === "tonight" || t === "now")
    return {d:0, label:"tonight", next:i+1};
  if(t === "tomorrow")
    return {d:1, label:"tomorrow", next:i+1};
  if(t === "day" && tk[i+1] === "after" && tk[i+2] === "tomorrow")
    return {d:2, label:"the day after tomorrow", next:i+3};

  if(t === "in" && numOf(tk[i+1]) !== null && /^days?$/.test(tk[i+2] || ""))
    return {d:numOf(tk[i+1]), label:`in ${numOf(tk[i+1])} days`, next:i+3};

  if((t === "this" || t === "next") && tk[i+1] === "weekend"){
    const w = nextWeekend();
    return {d: w.a + (t==="next" ? 7 : 0), label:`${t} weekend`, defaultNights:2, next:i+2};
  }
  if(t === "weekend"){
    const w = nextWeekend();
    return {d:w.a, label:"this weekend", defaultNights:2, next:i+1};
  }
  if((t === "this" || t === "next") && /^weeks?$/.test(tk[i+1] || "")){
    const mon1 = nextDow(1, 1);
    return {d: t==="next" ? (mon1 || 7) : 0, label:`${t} week`, defaultNights:7, next:i+2};
  }
  if((t === "this" || t === "next") && /^months?$/.test(tk[i+1] || "")){
    const dt = new Date(today.getFullYear(), today.getMonth() + (t==="next"?1:0), 1);
    dt.setHours(0,0,0,0);
    const off = Math.max(0, Math.round((dt - today)/86400000));
    return {d:off, label:`${t} month`, next:i+2};
  }
  if(t === "next" && WEEKDAYS[tk[i+1]] !== undefined){
    let d = nextDow(WEEKDAYS[tk[i+1]], minOff || 0);
    if(d < 7) d += 7;                                    // "next friday" is the one after this one
    return {d, label:`next ${tk[i+1]}`, next:i+2};
  }
  if(WEEKDAYS[t] !== undefined)
    return {d:nextDow(WEEKDAYS[t], minOff || 0), label:t, next:i+1};

  // 16 sep  |  sep 16  |  sep (→ the 1st)  |  16
  if(num !== null && MONTHS[tk[i+1]] !== undefined){
    const M = MONTHS[tk[i+1]];
    return {d:absoluteOffset(num, M, minOff), dom:num, month:M,
            label:`${num}${ord(num)} ${tk[i+1]}`, next:i+2};
  }
  if(mon !== null && digit(tk[i+1] || "") !== null){
    const D = digit(tk[i+1]);
    return {d:absoluteOffset(D, mon, minOff), dom:D, month:mon,
            label:`${D}${ord(D)} ${t}`, next:i+2};
  }
  if(mon !== null)
    return {d:absoluteOffset(1, mon, minOff), dom:1, month:mon, label:t, next:i+1};
  if(num !== null && num >= 1 && num <= 31)
    return {d:absoluteOffset(num, null, minOff), dom:num, month:null,
            label:`the ${num}${ord(num)}`, next:i+1};

  return null;
}

function parseQuery(q){
  const tk = normalize(q).split(" ").filter(Boolean);

  /* 0. a flat by name — "bh201", "BH-201", "bh 201". Taken out before anything
     else, because "201" left lying around would otherwise be read as a date and
     the answer would be about the 1st of next month. Matched against the real
     inventory rather than a pattern, so renumbering a flat cannot break it. */
  let flat = null;
  const codes = flats.map((f,i)=>({key: f.id.toLowerCase().replace(/[^a-z0-9]/g,""), i}));
  for(let i = 0; i < tk.length && !flat; i++){
    const one = tk[i].replace(/[^a-z0-9]/g,"");
    const two = one + (tk[i+1] || "").replace(/[^a-z0-9]/g,"");
    let hit = codes.find(c => c.key === one);
    if(hit){ flat = hit.i; tk.splice(i,1); break; }
    hit = codes.find(c => c.key === two);
    if(hit){ flat = hit.i; tk.splice(i,2); break; }
  }

  /* 1. filters — removed first so "2 bhk" never looks like the 2nd */
  let type = null, bldg = null;
  for(let i = tk.length - 1; i >= 0; i--){
    const t = tk[i], two = (numOf(t) !== null && /^bhk$/.test(tk[i+1] || ""));
    let m = null;
    if(two) m = numOf(t);
    else { const g = t.match(/^(\d)bhk$/); if(g) m = +g[1]; }
    if(m !== null){ type = `${m} BHK`; tk.splice(i, two ? 2 : 1); }
    else if(t === "studio"){ type = "Studio"; tk.splice(i,1); }
  }
  BUILDINGS.forEach(b=>{
    const words = b.name.toLowerCase().split(" ");
    for(let i = 0; i < tk.length; i++){
      if(tk[i] === words[0] || tk[i] === b.code.toLowerCase()){
        bldg = b.code;
        tk.splice(i, (words[1] && tk[i+1] === words[1]) ? 2 : 1);
        return;
      }
    }
  });

  /* 2. duration — removed next so "3 nights" never looks like the 3rd */
  let nights = null;
  for(let i = 0; i < tk.length; i++){
    const g = tk[i].match(/^(\d{1,2})(n|nt|nts|night|nights|w|wk|wks|week|weeks)$/);
    if(g){ nights = +g[1] * (/^w/.test(g[2]) ? 7 : 1); tk.splice(i,1); break; }
    const num = numOf(tk[i]);
    if(num === null) continue;
    if(NIGHT_UNIT.test(tk[i+1] || "")){ nights = num;     tk.splice(i,2); break; }
    if(WEEK_UNIT .test(tk[i+1] || "")){ nights = num * 7; tk.splice(i,2); break; }
  }
  if(nights === null){
    const f = tk.indexOf("fortnight");
    if(f >= 0){ nights = 14; tk.splice(f,1); }
  }

  /* 3. dates */
  let first = null;
  for(let i = 0; i < tk.length && !first; i++){
    const r = readDate(tk, i, 0);
    if(r && r.d !== null) first = r;
  }
  let second = null;
  if(first){
    let j = first.next;
    if(tk[j] === "-") j++;
    if(j < tk.length){
      const r = readDate(tk, j, first.d + 1);
      // "20-20" is one night, not the 20th of next month
      const sameBareDay = r && first.dom !== undefined && r.dom === first.dom
                            && first.month == null && r.month == null;
      if(r && r.d !== null && r.d > first.d && !sameBareDay) second = r;
    }
  }

  let start = first ? first.d : 0;
  let n = nights;
  if(second) n = second.d - first.d;                       // an explicit range wins
  if(n === null) n = (first && first.defaultNights) || 1;

  const beyond = start >= DAYS;                            // asked about a date we can't see
  const label  = !first ? "tonight"
               : second ? `${first.label} to ${second.label}`
               : first.label;

  start = Math.max(0, Math.min(DAYS - 1, start));
  n = Math.max(1, Math.min(n, DAYS - start));
  return {start, n, how:label, type, bldg, flat, beyond};
}

function renderAsk(focus){
  const s = document.getElementById("scr-ask");
  s.textContent = "";

  const top = el("div","stack");
  const field = el("div","field");
  const input = el("input");
  /* The box starts EMPTY. It used to arrive holding the last question, which
     had to be cleared a character at a time before a new one could be typed —
     and the tab focused it on open, so the keyboard covered the answer before
     anyone had asked anything. What was asked is shown above the answer
     instead, where it belongs. */
  input.type="text"; input.value = ""; input.autocomplete="off";
  input.placeholder = "Ask, or paste a message";
  input.setAttribute("enterkeyhint","search");
  input.setAttribute("aria-label","Ask about availability in plain words");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let mic = null, rec = null;
  if(SR){
    mic = el("button","mic");
    mic.setAttribute("aria-label","Speak the question");
    mic.innerHTML = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="7.4" y="2.2" width="5.2" height="9.4" rx="2.6"/><path d="M4.4 9.2a5.6 5.6 0 0 0 11.2 0M10 14.8v3"/></svg>';
    mic.onclick = ()=>{
      if(rec){ rec.stop(); return; }
      try{
        rec = new SR();
        rec.lang = navigator.language || "en-US";
        rec.interimResults = true;
        rec.continuous = false;
        rec.onresult = e=>{
          const txt = [...e.results].map(r=>r[0].transcript).join("");
          input.value = txt;
          if(e.results[e.results.length-1].isFinal){ run(); }
        };
        rec.onerror = ev=>{
          field.classList.remove("hear"); rec = null;
          input.placeholder = ev.error==="not-allowed"
            ? "Microphone blocked here — type instead" : "Didn't catch that — type instead";
        };
        rec.onend = ()=>{ field.classList.remove("hear"); rec = null; };
        rec.start(); field.classList.add("hear"); haptic(14);
      }catch(err){ field.classList.remove("hear"); rec = null; }
    };
  }
  /* ── paste the guest's own words ────────────────────────────────────────────
     A great many enquiries do not arrive as a phone call at all, they arrive as
     a WhatsApp message — "Hi, do you have a 2bhk from 15th to 18th for 4
     people?". Retyping that into a search box is absurd when the parser already
     reads exactly that shape. Copy the message, tap Paste, get the answer, then
     Copy for WhatsApp sends the reply straight back. The round trip is the
     feature; the clipboard is just where the question already is.            */
  const SVG_PASTE = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor"'
    + ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="4.6" y="3.4" width="10.8" height="13.2" rx="2.2"/>'
    + '<path d="M7.8 3.4V2.6a1.4 1.4 0 0 1 1.4-1.4h1.6a1.4 1.4 0 0 1 1.4 1.4v.8z"/></svg>';
  const SVG_CLEAR = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor"'
    + ' stroke-width="1.9" stroke-linecap="round"><path d="M5.6 5.6l8.8 8.8M14.4 5.6l-8.8 8.8"/></svg>';

  /* One slot, two jobs, and they are never wanted at the same time: an empty box
     wants the guest's message pasted in, a full one wants emptying. Clearing
     used to mean holding backspace through a whole sentence. */
  const slot = el("button","slot");
  const canPaste = !!(navigator.clipboard && navigator.clipboard.readText);
  const doPaste = async ()=>{
    haptic(10);
    try{
      const txt = (await navigator.clipboard.readText() || "").trim();
      if(!txt){ input.placeholder = "Nothing copied yet — copy their message first"; return; }
      input.value = txt.replace(/\s+/g," ").slice(0, 200);
      paintSlot(); run();
    }catch(e){
      // Safari and Firefox refuse a clipboard read without an explicit grant
      input.placeholder = "Can't read the clipboard here — paste into the box";
      input.focus();
    }
  };
  const doClear = ()=>{ haptic(8); input.value = ""; paintSlot(); run(true); input.focus(); };
  function paintSlot(){
    const full = input.value.trim().length > 0;
    slot.hidden = !full && !canPaste;
    slot.innerHTML = full ? SVG_CLEAR : SVG_PASTE;
    slot.setAttribute("aria-label", full ? "Clear the question" : "Paste a guest's message and answer it");
    slot.onclick = full ? doClear : doPaste;
  }
  paintSlot();

  /* No "Ask" button. The answer now keeps up with the typing, so a submit
     control only ever confirmed what was already on screen — and on a 375px
     field, three buttons left the placeholder truncated mid-word. Enter still
     submits for anyone who reaches for it. */
  field.append(input, slot);
  if(mic) field.append(mic);

  const chips = el("div","chips");
  const addChip = (q, label, cls)=>{
    const b = el("button", cls || null, label || q);
    b.onclick = ()=>{ input.value = q; paintSlot(); run(); };
    chips.appendChild(b);
  };
  SUGGEST.forEach(q => addChip(q));
  top.append(field, chips);
  // questions actually asked here, once there are any — a repeat is one tap
  if(recentAsks.length){
    const rec = el("div","chips recent");
    rec.append(el("span","reclbl","asked before"));
    recentAsks.forEach(q=>{ const b = el("button",null,q);
      b.onclick = ()=>{ input.value = q; paintSlot(); run(); }; rec.appendChild(b); });
    top.append(rec);
  }

  const ansWrap = el("div","stack gap-m");
  const listWrap = el("div","stack gap-s");
  s.append(top, ansWrap, listWrap);

  input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); input.blur(); run(); }});
  /* Answers while the thumb is still moving. There is no reason to make someone
     finish a sentence and reach for a button to find out there is nothing free
     — the answer can keep up. */
  let typing = null;
  input.addEventListener("input", ()=>{
    paintSlot();
    clearTimeout(typing);
    typing = setTimeout(()=> run(true), 140);
  });
  if(focus) setTimeout(()=>input.focus(),120);
  run(true);

  function remember(q){
    if(!q || SUGGEST.indexOf(q) >= 0) return;          // the standing chips are not history
    recentAsks = [q, ...recentAsks.filter(x => x !== q)].slice(0, 4);
  }

  function run(quiet){
    if(!quiet) haptic(10);
    // every route in — chip, paste, speech, Enter — lands here, so the slot is
    // kept honest here rather than at each caller
    paintSlot();
    lastQuery = input.value.trim() || "tonight";
    // only a deliberate ask becomes history — not every keystroke on the way
    if(!quiet) remember(lastQuery);
    const p = parseQuery(lastQuery);
    const a = p.start, b = p.start + p.n;
    let pool = flats.map((f,i)=>({f,i}));
    if(p.flat != null) pool = pool.filter(x=>x.i === p.flat);
    if(p.type) pool = pool.filter(x=>x.f.type===p.type);
    if(p.bldg) pool = pool.filter(x=>x.f.code===p.bldg);
    const free = pool.filter(x=>freeRange(x.i,a,b));
    const when = p.n===1 ? fmtL(a) : `${fmtL(a)} → ${fmtL(b)}`;
    const nightsTxt = p.n===1 ? "that night" : p.n===2 ? "both nights" : `all ${p.n} nights`;

    ansWrap.textContent = "";
    const ans = el("p","answer");
    ans.innerHTML = p.beyond
      ? `That's past <b class="n">${fmtL(DAYS-1)}</b> — the furthest this book goes. Showing ${when} instead.`
      : p.flat != null
      ? (free.length
          ? `<b class="y">${esc(flats[p.flat].id)}</b> is free for ${nightsTxt}, ${when}.`
          : (()=>{ const b2 = resv.find(r => r.fi===p.flat && r.start < a+p.n && r.end > a);
              return `<b class="n">${esc(flats[p.flat].id)}</b> is not free ${when}`
                + (b2 ? ` — ${esc(isBlock(b2) ? (b2.reason || "out of service") : b2.guest)} until ${fmt(Math.min(b2.end,DAYS-1))}.` : "."); })())
      : free.length
      ? `Yes — <b class="y">${free.length} room${free.length>1?"s":""}</b> free for ${nightsTxt}, ${when}.`
      : `<b class="n">Nothing</b> covers ${nightsTxt}, ${when}.`;
    const heard = el("div","heard");
    if(p.flat != null) heard.append(el("span","pill now", flats[p.flat].id));
    heard.append(el("span","pill" + (p.flat != null ? "" : " now"), p.how));
    heard.append(el("span","pill", `${p.n} night${p.n>1?"s":""}`));
    if(p.type) heard.append(el("span","pill", p.type));
    if(p.bldg) heard.append(el("span","pill", BUILDINGS.find(z=>z.code===p.bldg).name));
    ansWrap.append(ans, heard);

    if(free.length){
      const bar = el("div","copybar");
      const cp = el("button","copybtn");
      cp.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6.6" y="6.6" width="10.4" height="10.4" rx="2.4"/><path d="M13.4 3.4H4.6a1.2 1.2 0 0 0-1.2 1.2v8.8"/></svg><span>Copy for WhatsApp</span>';
      cp.onclick = async ()=>{
        const lines = free.map(x=>`${x.f.id} (${x.f.type}, ${x.f.bshort})`).join("\n");
        const text = p.n===1
          ? `Free on ${fmtL(a)} — ${free.length} room${free.length>1?"s":""}:\n${lines}`
          : `Free ${fmtL(a)} → ${fmtL(b)} (${p.n} nights) — ${free.length} room${free.length>1?"s":""}:\n${lines}`;
        const ok = await copyText(text);
        haptic(12);
        cp.querySelector("span").textContent = ok ? "Copied" : "Press and hold to copy";
        cp.classList.toggle("done", ok);
        setTimeout(()=>{ cp.querySelector("span").textContent = "Copy for WhatsApp";
                         cp.classList.remove("done"); }, 1800);
      };
      bar.append(cp, el("span","lbl", `${free.length} room${free.length>1?"s":""} · ${p.n} night${p.n>1?"s":""}`));
      ansWrap.append(bar);
    }

    listWrap.textContent = "";
    const h = el("div","sect");
    const list = el("div","card");
    if(free.length){
      h.append(el("span","lbl","Read these out"), el("span","lbl", `${fmt(a)} → ${fmt(b)}`));
      free.forEach(x=> list.appendChild(roomRow(x.i, a, null)));
    } else {
      /* before offering different dates, see if one room move rescues these dates */
      const moves = roomMoves(a, b, pool);
      if(moves.length){
        const mh = el("div","sect");
        /* Fewest-first is the right order — but with forty single-guest options
           the one room that needs two guests moved falls off the end, and the
           operator never learns the app can do it at all. So the shortlist is
           the best four, plus the best multi-guest option if none made the cut.
           It is a different shape of answer, not a worse one. */
        /* Cheapest first — but with forty single-guest options the bigger
           shuffles fall off the end and the operator never learns the app can
           do them at all. So: the best three outright, then the best example of
           every larger size not yet on the list. The ladder is visible without
           the cheap answers losing their place at the top. */
        const shown = moves.slice(0,3);
        const sizes = new Set(shown.map(m => m.moves.length));
        moves.forEach(m=>{
          if(shown.length < 6 && !sizes.has(m.moves.length)){ sizes.add(m.moves.length); shown.push(m); }
        });
        const fewest = shown[0].moves.length;
        const most = Math.max(...shown.map(m => m.moves.length));
        mh.append(el("span","lbl", fewest === most
                    ? (fewest === 1 ? "One move away" : `${fewest} moves away`)
                    : `From ${fewest === 1 ? "one move" : fewest + " moves"}`),
                  el("span","lbl", `${moves.length} option${moves.length>1?"s":""}`));
        const mcard = el("div","card");
        shown.forEach(mv=>{
          const fromF = flats[mv.frees], k = mv.moves.length;
          const r = el("button","row move");
          r.append(el("div","id", fromF.id));
          const m = el("div","meta");
          const who = k === 1
            ? `Move <b>${esc(mv.moves[0].booking.guest)}</b> to <b class="rm">${esc(flats[mv.moves[0].to].id)}</b>`
            : `Move <b>${k} guests</b> — ${mv.moves.map(x=>esc(x.booking.guest)).join(", ")}`;
          m.innerHTML = who
            + `<em>${mv.sameBuilding ? "same building" : "one changes building"}`
            + `${mv.sameType ? ", same size" : ", never smaller"}`
            + ` · then <u class="rm">${esc(fromF.id)}</u> is yours</em>`;
          r.append(m, el("span","pill now", k === 1 ? "1 move" : `${k} moves`));
          // it used to open the room that WOULD be freed, having moved nobody
          r.onclick = ()=>{ haptic(10); openMove(mv, a, fi => openBooking(fi, a, p.n)); };
          mcard.appendChild(r);
        });
        listWrap.append(mh, mcard);
        // a cap the operator cannot see is a cap that lies about the answer
        if(movesBeyondCeiling){
          const over = el("p","movecap");
          over.innerHTML = `${movesBeyondCeiling} more room${movesBeyondCeiling>1?"s":""} `
            + `could be freed, but ${movesBeyondCeiling>1?"each needs":"it needs"} more than `
            + `${MOVE_CEILING} guests moved — not a shuffle any more.`;
          listWrap.appendChild(over);
        }
      }
      h.append(el("span","lbl","What is possible instead"),
               el("span","lbl", `${p.n} nights from ${fmt(a)}`));

      /* 1. A shorter stay from the SAME date. If a guest wants thirty nights
            from today, "twenty-one is possible" is a negotiating position;
            "come back in three weeks" is a different trip and no use at all. */
      const runs = pool.map(x=>({fi:x.i, n:runFrom(x.i, a)}))
                       .filter(r=>r.n > 0)
                       .sort((x,y)=> y.n - x.n);
      if(runs.length){
        const best = runs[0].n;
        const sub = el("div","empty");
        sub.style.cssText = "text-align:left;padding:13px 14px 4px";
        sub.innerHTML = `The longest you can do from <b style="color:var(--txt)">${fmtL(a)}</b> is `
          + `<b style="color:var(--txt)">${best} night${best>1?"s":""}</b>, not ${p.n}.`;
        list.appendChild(sub);
        runs.slice(0,5).forEach(r=>{
          const fl = flats[r.fi];
          const row = el("button","row");
          row.append(el("div","id", fl.id));
          const m = el("div","meta");
          m.innerHTML = `<b>${fl.type}</b> · ${fl.bshort}`
            + `<em>${fmt(a)} → ${fmt(a + r.n)} · ${r.n} of the ${p.n} nights</em>`;
          row.append(m, el("span","pill good", `${r.n} nt`));
          row.onclick = ()=>{ haptic(9); openSheet(r.fi, a); };
          list.appendChild(row);
        });
      }

      /* 2. A different arrival, within a week. Two things can improve by
            moving: the whole stay may fit, or — far more often for a long
            request — a materially longer stay becomes possible. Showing only
            the first meant a 30-night ask got no arrival options at all. */
      const NEAR = 7;
      const bestFromA = runs.length ? runs[0].n : 0;
      const alts = [];
      for(let sh = 1; sh <= NEAR; sh++){
        [a + sh, a - sh].forEach(s2=>{
          if(s2 < 0 || s2 >= DAYS) return;
          const full = (s2 + p.n <= DAYS)
            ? pool.filter(x=>freeRange(x.i, s2, s2 + p.n)).length : 0;
          let longest = 0, at = -1;
          pool.forEach(x=>{ const r = runFrom(x.i, s2); if(r > longest){ longest = r; at = x.i; } });
          if(full > 0 || longest > bestFromA)
            alts.push({d:s2, full, longest, at, dist:Math.abs(s2 - a)});
        });
      }
      // a stay that fits in full beats a longer-but-partial one; then nearest
      alts.sort((x,y)=> (y.full>0) - (x.full>0) || y.longest - x.longest || x.dist - y.dist);

      if(alts.length){
        const sh2 = el("div","sheet-s");
        sh2.append(el("span","lbl","Or shift the arrival"), el("span","lbl","within a week"));
        list.appendChild(sh2);
        alts.slice(0,4).forEach(alt=>{
          const away = alt.d - a;
          const r = el("button","row");
          r.append(el("div","id", (away>0?"+":"−") + Math.abs(away) + "d"));
          const m = el("div","meta");
          m.innerHTML = `Arrive <b>${fmtL(alt.d)}</b>`
            + (alt.full > 0
                ? `<em>${alt.full} flat${alt.full>1?"s":""} free for all ${p.n} nights</em>`
                : `<em>up to ${alt.longest} night${alt.longest>1?"s":""} — ${flats[alt.at].id} · ${flats[alt.at].bshort}</em>`);
          r.append(m, el("span", alt.full>0 ? "pill good" : "pill",
                   alt.full>0 ? `${alt.full} free` : `${alt.longest} nt`));
          r.onclick = ()=>{ haptic(9);
            if(alt.full > 0) goMonth(alt.d); else openSheet(alt.at, alt.d); };
          list.appendChild(r);
        });
      }

      /* 3. Say when the full stay first becomes possible, however far out.
            One line — information, not a suggestion worth acting on. */
      if(!alts.some(x=>x.full > 0)){
        let soon = -1;
        for(let s2 = a + 1; s2 <= DAYS - p.n && soon < 0; s2++)
          if(pool.some(x=>freeRange(x.i, s2, s2 + p.n))) soon = s2;
        const e = el("div","empty");
        e.style.cssText = "text-align:left;padding:12px 14px";
        e.innerHTML = soon >= 0
          ? `The first date that takes all ${p.n} nights is <b style="color:var(--txt)">${fmtL(soon)}</b>, ${soon - a} days out.`
          : `No ${p.n}-night stretch exists anywhere in the next nine weeks.`;
        list.appendChild(e);
      }
    }
    listWrap.append(h, list);
  }
}

/* ═══════════════ room sheet ═══════════════ */
const sheet = document.getElementById("sheet");
const scrim = document.getElementById("scrim");
const sheetH = document.getElementById("sheetH");
const sheetB = document.getElementById("sheetB");

/* Numbers get typed with spaces, +91, brackets and none of it consistently, so
   match on the last ten digits and nothing else. */
const digits10 = s => String(s || "").replace(/\D/g,"").slice(-10);
function guestByPhone(ph){
  const key = digits10(ph);
  if(key.length < 10) return null;
  const past = bookings().filter(r => r.phone && digits10(r.phone) === key)
                         .sort((a,b) => b.start - a.start);
  return past.length ? {name: past[0].guest, stays: past.length, last: past[0].start} : null;
}

/* What is happening in one flat on one night, phrased the way it would be said
   out loud. This is the whole reason the strip is worth touching: "booked" is
   not an answer, "R. Menon · night 2 of 3" is. */
function nightStory(fi, d){
  const r = resv.find(x => x.fi === fi && x.start <= d && x.end > d);
  if(r) return isBlock(r)
    ? (r.reason || "Out of service") + (r.note ? " · " + r.note : "")
    : `${r.guest} · night ${d - r.start + 1} of ${r.end - r.start}`;
  // a free night only means something alongside the length of the gap it sits in
  let a = d; while(a > 0 && !occ[fi][a-1]) a--;
  let b = d; while(b < DAYS-1 && !occ[fi][b+1]) b++;
  const n = b - a + 1;
  return n === 1 ? "Free · a single night between bookings"
       : a === d ? `Free · ${n} nights open from here`
                 : `Free · ${n} nights open, from ${fmt(a)}`;
}

/* Put a finger anywhere on the nine weeks and read that night. Nothing resizes
   and nothing reflows: the legend and the readout share one box, and the only
   things that move are a one-pixel playhead and the touched bar. The gesture
   yields to a vertical scroll rather than fighting it — a strip you cannot
   scroll past would be a worse trade than one you cannot scrub. */
function attachStripScrub(wrap, strip, head, say, call, mini, readD, readW, fi){
  const bars = strip.children;
  let live = false, at = -1, was = null;
  const rowsIn = () => sheetB.querySelectorAll(".card .row");
  /* Seven, because it is the shape of a week and because it is about what a
     thumb covers. Odd, so the night you are on sits in the middle rather than
     off to one side. */
  const MINI = 7;
  const cells = [];
  for(let k = 0; k < MINI; k++){ const c = el("i"); cells.push(c); mini.appendChild(c); }
  /* The window slides to keep the selection centred, except at the two ends,
     where it stops rather than showing empty space for nights that do not
     exist. The selected cell then moves within the window instead — the same
     thing a calendar does in its first and last week. */
  const paintMini = d => {
    const from = Math.max(0, Math.min(DAYS - MINI, d - (MINI >> 1)));
    for(let k = 0; k < MINI; k++){
      const day = from + k, c = cells[k];
      c.className = "";
      if(!occ[fi][day]) c.classList.add("f");
      else if(blk[fi][day]) c.classList.add("b");
      if(day === 0) c.classList.add("td");
      if(day === d) c.classList.add("sel");
    }
  };

  const dayAt = x => {
    const a = bars[0].getBoundingClientRect(), z = bars[DAYS-1].getBoundingClientRect();
    const t = (x - a.left) / (z.right - a.left);
    return Math.max(0, Math.min(DAYS-1, Math.floor(t * DAYS)));
  };
  /* The run of nights the touched one belongs to: one stay, or one gap. Showing
     it is the difference between reading a pixel and reading a span. */
  const runAround = d => {
    const r = resv.find(x => x.fi === fi && x.start <= d && x.end > d);
    if(r) return {from: Math.max(r.start, 0), to: Math.min(r.end, DAYS) - 1};
    let a2 = d; while(a2 > 0 && !occ[fi][a2-1]) a2--;
    let b2 = d; while(b2 < DAYS-1 && !occ[fi][b2+1]) b2++;
    return {from: a2, to: b2};
  };
  const clearSpan = ()=>{ for(const b2 of bars) b2.classList.remove("span","on"); };
  const show = d => {
    if(d === at) return;
    clearSpan();
    const run = runAround(d);
    for(let k = run.from; k <= run.to; k++) bars[k].classList.add("span");
    at = d; bars[d].classList.add("on");
    const br = bars[d].getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    head.style.transform = `translateX(${(br.left - wr.left + br.width / 2).toFixed(1)}px)`;
    readD.textContent = d === 0 ? "Tonight" : fmtL(d);
    readW.textContent = nightStory(fi, d);
    paintMini(d);
    /* The card is centred on the touched night and then clamped inside the
       strip's own width, so it never hangs off either end. The playhead is NOT
       clamped — it stays at the true night — so near the ends the two separate
       slightly and the hairline is what still tells you exactly where you are.
       That connector is the whole reason an offset callout stays honest. */
    const sr = say.getBoundingClientRect();
    const x = br.left - sr.left + br.width / 2;
    const cw = call.offsetWidth;
    const left = Math.max(0, Math.min(sr.width - cw, x - cw / 2));
    call.style.transform = `translateX(${left.toFixed(1)}px)`;
    const r = resv.find(x => x.fi === fi && x.start <= d && x.end > d) || null;
    rowsIn().forEach(row => row.classList.toggle("lit", !!r && row._resv === r));
    // a tick only when the night belongs to something else — not 63 times a sweep
    if(r !== was){ was = r; haptic(5); }
  };
  const start = x => { live = true; at = -1; was = null;
    wrap.classList.add("reading"); say.classList.add("reading"); show(dayAt(x)); };
  const stop = () => {
    if(!live) return;
    live = false;
    clearSpan();
    at = -1;
    wrap.classList.remove("reading"); say.classList.remove("reading");
    rowsIn().forEach(row => row.classList.remove("lit"));
  };

  /* There is no vertical tripwire and no direction lock any more, because with
     touch-action:none there is no longer a competing gesture to arbitrate
     against. The old code abandoned the scrub the moment the finger drifted
     16px down from where it landed, measured against nothing — not against how
     far it had travelled sideways. A thumb pivots at its base, so a sweep
     across 63 nights is an arc, and the drift grows the further along the bar
     you get. Measured on the real bar: a straight drag tracked all 30 nights, a
     22px arc died a third of the way in, a 40px arc barely started. Whatever
     the finger does vertically now, the reading continues. */
  wrap.addEventListener("pointerdown", e=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    /* Captured on contact. Implicit capture covers touch but NOT mouse or pen,
       so without this a mouse drag dies the moment it leaves the 46px band —
       and capture is also what lets a finger stray off the strip and keep
       reading. pointerleave would fire constantly here and means only that the
       pointer left the box, never that the gesture ended. */
    try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
    start(e.clientX);
  });
  wrap.addEventListener("pointermove", e=>{
    if(!live) return;
    if(e.cancelable) e.preventDefault();
    show(dayAt(e.clientX));
  }, {passive:false});
  // capture routes both of these back here, so no window listeners accumulate
  // as sheets open and close
  ["pointerup","pointercancel"].forEach(ev => wrap.addEventListener(ev, stop));
}

/* Money rides in the booking's own row rather than on a line beneath it. A
   separate line sits between two bookings and belongs visibly to neither, and
   reading money against the wrong guest is the same class of mistake as reading
   the wrong flat — the one failure this app exists to prevent.

   Three states, and "unpaid" is never said about a platform booking: the guest
   paid, Airbnb owes you, and those two need opposite actions. */
function moneyPill(r, fi){
  const due = dueFrom(r);
  if(due > 0){
    const b = el("button","paid due", money(due) + " due");
    b.setAttribute("aria-label",
      `${money(due)} still due from ${r.guest} of ${money(r.amount)} — record a payment`);
    b.onclick = ev=>{ ev.stopPropagation(); haptic(9); openPayment(r, fi); };
    return b;
  }
  if(withPlatform(r) > 0){
    const s = el("span","paid plat","payout due");
    s.setAttribute("aria-label", `${money(r.amount)} paid by the guest to ${r.src}; payout still to come`);
    return s;
  }
  return el("span","paid clear","settled");
}

/* Recording money is two touches: the amount is already the balance, and the
   method defaults to how this booking's source is actually settled. */
function openPayment(r, fi){
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">${money(dueFrom(r))} due</div>`
              + `<div class="m">${esc(r.guest)} · ${flats[r.fi].id} · ${fmt(Math.max(r.start,0))} → ${fmt(r.end)}</div>`;
  const x = el("button", null, "✕"); x.setAttribute("aria-label","Back");
  x.onclick = ()=> openSheet(fi);
  sheetH.append(t, x);

  const form = el("div","bkform");
  const amtWrap = el("div","bkamt");
  amtWrap.appendChild(el("s", null, "₹"));
  const amt = el("input");
  amt.type = "text"; amt.inputMode = "numeric";
  amt.value = String(Math.round(dueFrom(r)));
  amt.setAttribute("aria-label","Amount received");
  amtWrap.appendChild(amt);
  form.append(amtWrap);

  let method = PLATFORMS.indexOf(r.src) >= 0 ? "Platform" : "UPI";
  const chips = el("div","srcRow");
  PAY_METHODS.forEach(mth=>{
    const c = el("button", null, mth);
    c.setAttribute("aria-pressed", mth === method);
    c.onclick = ()=>{ method = mth; haptic(8);
      [...chips.children].forEach(o => o.setAttribute("aria-pressed", o.textContent === method)); };
    chips.appendChild(c);
  });
  form.append(chips);

  const go = el("button","bkgo","Record it");
  go.onclick = ()=>{
    if(addPayment(r, (amt.value||"").replace(/[^\d-]/g,""), method)){ haptic(18); openSheet(fi); }
  };
  form.append(go);
  sheetB.append(form);

  if((r.pays || []).length){
    const s = el("div","sheet-s");
    s.append(el("span","lbl","Already received"), el("span","lbl", money(paidOn(r))));
    sheetB.append(s);
    const card = el("div","card"); card.style.margin = "0 20px";
    r.pays.forEach(p=>{
      const row = el("div","row");
      row.append(el("div","id", money(p.amount)));
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(p.method)}</b><em>${fmt(p.on || 0)}</em>`;
      const end = el("div","rowend");
      const del = el("button","rowx","✕");
      del.setAttribute("aria-label", `Remove this ${money(p.amount)} payment`);
      let armed = false, tm = null;
      del.onclick = ()=>{
        if(!armed){ armed = true; del.classList.add("arm"); del.textContent = "Remove?"; haptic(10);
          tm = setTimeout(()=>{ armed = false; del.classList.remove("arm"); del.textContent = "✕"; }, 3000);
          return; }
        clearTimeout(tm); haptic(20); dropPayment(r, p); openPayment(r, fi);
      };
      end.append(del);
      row.append(m, end);
      card.appendChild(row);
    });
    sheetB.append(card);
  }
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* Report a fault without taking the flat off the market. Two taps and a word:
   what it is, and how much it can wait. */

/* ── a preview of the change, on the flat's own nine weeks ────────────────────
   Both of these forms used to be a stack of fields describing something
   abstract: "4 nights from 16 Aug" is a sentence, not a picture, and you had to
   hold the calendar in your head to know whether it landed anywhere awkward.
   This paints the pending block straight onto the timeline as you move the
   steppers, so the consequence is visible before it is committed.            */
function previewStrip(fi){
  const wrap = el("div","prevwrap");
  const strip = el("div","strip prev");
  strip.setAttribute("role","img");
  stripBars(fi, false).forEach(i => strip.appendChild(i));
  const k = el("div","prevk");
  const kl = el("span","lbl","Today"), kr = el("span","lbl","+9 weeks");
  k.append(kl, kr);
  wrap.append(strip, k);
  wrap.paint = (from, n)=>{
    [...strip.children].forEach((b, d)=>{
      const inRange = d >= from && d < from + n;
      b.classList.toggle("pending", inRange);
    });
  };
  return wrap;
}

/* Chips ordered by what this flat actually breaks, then by what breaks most
   across the portfolio. The right answer should not be the eleventh chip. */
function faultsFor(fi){
  const mine = {}, all = {};
  resv.filter(r => isBlock(r) && r.fault).forEach(r=>{
    all[r.fault] = (all[r.fault] || 0) + 1;
    if(r.fi === fi) mine[r.fault] = (mine[r.fault] || 0) + 1;
  });
  issues.filter(x => x.fault).forEach(x=>{
    all[x.fault] = (all[x.fault] || 0) + 1;
    if(x.fi === fi) mine[x.fault] = (mine[x.fault] || 0) + 1;
  });
  const list = allFaults();
  return list.slice().sort((a,b)=>
    (mine[b]||0) - (mine[a]||0) || (all[b]||0) - (all[a]||0) || list.indexOf(a) - list.indexOf(b));
}
