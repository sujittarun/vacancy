/* ══════════════ opening a room ══════════════════════════════════════════════
   A room used to open onto every form at once: book a guest, log a fault, take
   it out of service, all expanded inline under three read-only lists. Forty-
   seven buttons and nearly four screens of scroll before anything was typed,
   because each new feature was added where it was *about* rather than where it
   belonged.

   The rule now is one surface, one job. Opening a room READS: what it is, its
   nine weeks, and the one thing you most likely came to do. Everything that
   writes is its own screen with a single commit, and Back returns here.       */

/* The room's own header, shared by every screen in the stack, so moving between
   them never feels like leaving the room. */
function roomHead(fi, backTo){
  const fl = flats[fi];
  sheetWipe();                       // it hands off to a form that fills the body
  const t = el("div");
  t.innerHTML = `<div class="n">${esc(fl.id)}</div>`
              + `<div class="m">${esc(fl.type)} · ${esc(fl.bname)} · floor ${fl.floor}</div>`;
  const x = el("button", null, backTo ? "‹" : "✕");
  x.setAttribute("aria-label", backTo ? "Back to the room" : "Close");
  x.onclick = backTo || closeSheet;
  sheetH.append(t, x);
  return x;
}

/* One night, one bar — the reading of occ/blk that BOTH strips share. It lived
   twice, once here and once in previewStrip, so a change to how a night is
   drawn had to be made in two places or the scrubbable strip and the preview
   would start disagreeing about the same flat. `seams` is the only real
   difference: the preview does not draw them because it is showing a range you
   are about to take, not a history to read. */
function stripBars(fi, seams){
  const out = [];
  const startsHere = new Set();
  if(seams) resv.filter(r => r.fi === fi).forEach(r=>{
    // where a new stay begins against an occupied night before it — the seam
    // two back-to-back bookings otherwise hide
    if(r.start > 0 && r.start < DAYS && occ[fi][r.start - 1]) startsHere.add(r.start);
  });
  for(let d=0; d<DAYS; d++){
    const i = el("i");
    if(!occ[fi][d]) i.classList.add("f");
    else if(blk[fi][d]) i.classList.add("b");
    if(d === 0) i.classList.add("td");
    if(startsHere.has(d)) i.classList.add("edge");
    out.push(i);
  }
  return out;
}

/* The nine weeks, scrubbable. Built here rather than inline so the room card
   stays readable as a list of sections. */
function roomStrip(fi){
  const wrap = el("div","stripwrap");
  const strip = el("div","strip");
  strip.setAttribute("role","img");
  strip.setAttribute("aria-label",
    `${flats[fi].id} over the next nine weeks: ${occPct(fi)} per cent booked. Touch and drag to read a night.`);
  stripBars(fi, true).forEach((i, d)=>{
    i.style.animationDelay = (d * 3) + "ms";      // 63 bars, ~190ms end to end
    strip.appendChild(i);
  });
  const head = el("i","playhead");
  wrap.append(strip, head);
  wrap.classList.add("fresh");
  // let it play once, then get out of the way of the scrub's own transforms
  setTimeout(()=> wrap.classList.remove("fresh"), 420);
  /* The readout goes ABOVE the bar. It used to sit in the foot, and measuring
     the old layout on a phone put the first line of it 8px BELOW the contact
     point — inside the ~42px disc a fingertip covers, and under the hand that
     is doing the scrubbing, which on a phone always arrives from beneath. The
     one thing you were dragging in order to read was the one thing your thumb
     was on top of.
     A fixed slot rather than a callout that chases the finger: this is what
     Apple's Stocks and Health do, and it costs nothing in edge cases — no
     flipping near the left or right end, no clamping, no collision with the
     sheet header — while a following tooltip needs all three. The trade is
     eye travel, and over a 46px bar there is almost none to trade.
     The slot keeps its height whether or not anything is in it, so reading a
     night still moves nothing on the screen. */
  const say = el("div","strip-say");
  /* The callout. It tracks the finger sideways but never vertically — its y is
     the strip's, which is fixed, so it cannot bob about while you read. That
     one decision removes every case a normal tooltip has to handle: no flipping
     above/below, no collision with the sheet header, no separate placement rule
     for touch and mouse.
     It carries the seven nights around the one you are on, because a thumb pad
     covers roughly EIGHT of these bars — more than a week. What the finger
     hides is therefore never a single night, it is the run of vacancy around
     it, which is exactly what the person on the phone is asking about. */
  const call = el("div","strip-call");
  const read = el("div","strip-read");
  read.setAttribute("aria-live","polite");
  const readD = el("b"), readW = el("span");
  const mini = el("div","strip-mini");
  /* The date and the seven nights share the top line, and the sentence sits
     under both. Stacked three-high the card outgrew its slot and the sheet's
     own scroller clipped the date clean off the top — the card cannot overflow
     upward, so it has to be short enough not to want to. */
  const top = el("div","sc-top");
  top.append(readD, mini);
  read.append(top, readW);
  call.append(read);
  say.append(call);

  /* The legend stays below and stays put. It is context, not a readout, so it
     no longer has to blink out of the way to make room for one. */
  const foot = el("div","strip-foot");
  const k = el("div","strip-k");
  k.append(el("span","lbl","Today"), el("span","lbl", `${occPct(fi)}% booked`), el("span","lbl","+9 weeks"));
  foot.append(k);
  return {wrap, strip, head, say, call, mini, foot, readD, readW};
}

/* The next run of free nights at or after `from`, which is what turns "not
   available" into something you can still act on. */
function nextFree(fi, from){
  for(let d = Math.max(0, from); d < DAYS; d++){
    if(occ[fi][d]) continue;
    let n = 0; while(d + n < DAYS && !occ[fi][d + n]) n++;
    return {from: d, nights: n};
  }
  return null;
}

function openSheet(fi, day){
  const fl = flats[fi];
  roomHead(fi);

  const S = roomStrip(fi);
  sheetB.append(S.say, S.wrap, S.foot);
  attachStripScrub(S.wrap, S.strip, S.head, S.say, S.call, S.mini, S.readD, S.readW, fi);

  /* ── the one thing you probably came for ──────────────────────────────────
     Decided by the room's state rather than always being the same button, so
     the largest target on screen is never the wrong one. */
  const bDay = Math.min(pickedNight, DAYS-1), bN = stayNights;
  const canTake = freeRange(fi, bDay, bDay + bN);
  const act = el("div","roomAct");

  if(canTake){
    const b = el("button","bigAct", `Book ${bN === 1 ? fmtL(bDay) : fmt(bDay) + " → " + fmt(bDay + bN)}`);
    b.append(el("s", null, bN === 1 ? "one night" : bN + " nights"));
    b.onclick = ()=>{ haptic(12); openBooking(fi, bDay, bN); };
    act.append(b);
  }else{
    const busy = resv.find(r => r.fi === fi && r.start < bDay + bN && r.end > bDay);
    const nxt = nextFree(fi, bDay);
    const why = el("div","actWhy");
    why.innerHTML = busy
      ? (isBlock(busy)
          ? `<b>${esc(busy.reason || "Out of service")}</b> until ${esc(fmt(Math.min(busy.end, DAYS-1)))}`
          : `<b>${esc(busy.guest)}</b> is in until ${esc(fmt(Math.min(busy.end, DAYS-1)))}`)
      : `Not free for those nights`;
    act.append(why);
    if(nxt){
      // a dead end is a wasted screen — offer the nearest thing that can be sold
      const b = el("button","bigAct", `Book from ${fmt(nxt.from)}`);
      b.append(el("s", null, `next free · ${nxt.nights} night${nxt.nights>1?"s":""}`));
      b.onclick = ()=>{ haptic(12); openBooking(fi, nxt.from, Math.min(nxt.nights, 3)); };
      act.append(b);
    }
  }

  const routes = el("div","roomRoutes");
  const rFault = el("button", null, "Log a fault");
  rFault.append(el("s", null, "stays on sale"));
  rFault.onclick = ()=>{ haptic(9); openIssueForm(fi, day); };
  const rOut = el("button", null, "Out of service");
  rOut.append(el("s", null, "cannot be sold"));
  rOut.onclick = ()=>{ haptic(9); openBlockForm(fi, day); };
  routes.append(rFault, rOut);
  act.append(routes);
  sheetB.append(act);

  /* ── what is true about this room, read only ─────────────────────────────── */
  const mine = resv.filter(r=>r.fi===fi && r.end>0 && r.start<DAYS).sort((a,b)=>a.start-b.start);
  const s1 = el("div","sheet-s");
  s1.append(el("span","lbl", `Coming up · ${mine.length}`),
            el("span","lbl", `₹${fl.rate.toLocaleString("en-IN")} / night`));
  sheetB.appendChild(s1);
  const bl = el("div","card"); bl.style.margin="0 20px";
  if(!mine.length) bl.appendChild(el("div","empty","Nothing booked in the next nine weeks."));
  // a glance, not an archive — the strip above already carries the whole shape,
  // and anything past the next few is a scroll nobody performs
  const SHOW = 5;
  mine.slice(0, SHOW).forEach(r=>{
    const row = el("div","row bk");
    row._resv = r;
    const when = Math.max(r.start,0) === 0 ? "Now" : fmt(Math.max(r.start,0));
    const m = el("div","meta");
    m.innerHTML = `<b>${esc(r.guest)}</b>`
                + `<em>${when} → ${fmt(Math.min(r.end,DAYS-1))} · ${r.nights}n · ${esc(r.src)}</em>`;
    const end = el("div","rowend");
    end.appendChild(!isBlock(r) && r.amount ? moneyPill(r, fi) : el("span","pill", `${r.nights}n`));
    const x2 = el("button","rowx","✕");
    x2.setAttribute("aria-label", `Cancel ${r.guest}'s booking in ${fl.id}`);
    let armed = false, t2 = null;
    x2.onclick = ()=>{
      if(!armed){ armed = true; x2.classList.add("arm"); x2.textContent = "Cancel?"; haptic(10);
        t2 = setTimeout(()=>{ armed=false; x2.classList.remove("arm"); x2.textContent="✕"; }, 3000);
        return; }
      clearTimeout(t2); haptic(20);
      cancelWithUndo(r, fi); closeSheet(); refreshScreen();
    };
    /* Small on purpose. Moving a guest is a real thing to want and a rare thing
       to do, so it sits on the guest's own row at the size of a glyph — not a
       pill, not a card, not a third route competing with Book. */
    if(!isBlock(r) && r.start >= 0){
      const mvb = el("button","rowx rowmv");
      mvb.innerHTML = SVG_SWAP;
      mvb.setAttribute("aria-label", `Move ${r.guest} to another flat`);
      mvb.onclick = ev=>{ ev.stopPropagation(); haptic(9);
        openGuestMove(r, ()=> openSheet(fi, day)); };
      end.appendChild(mvb);
    }
    end.appendChild(x2);
    row.append(m, end);
    bl.appendChild(row);
  });
  if(mine.length > SHOW){
    const more = el("div","rowMore", `${mine.length - SHOW} more in the strip above`);
    bl.appendChild(more);
  }
  sheetB.appendChild(bl);

  const mine2 = openIssues(fi);
  if(mine2.length){
    const win = batchWindow(fi, 1);
    const s3 = el("div","sheet-s");
    s3.append(el("span","lbl", `Needs fixing · ${mine2.length}`),
              el("span","lbl", win ? `empty ${fmt(win.from)} for ${win.nights}n` : "no gap yet"));
    sheetB.appendChild(s3);
    const il = el("div","card"); il.style.margin = "0 20px";
    mine2.forEach(x2=>{
      const row = el("div","row bk");
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(x2.fault || "Issue")}</b>`
                  + `<em>${esc(x2.note || "no note")} · logged ${x2.on === 0 ? "today" : fmt(x2.on)}</em>`;
      const end = el("div","rowend");
      end.appendChild(el("span", "paid " + (x2.urgency === "urgent" ? "due" : "clear"),
                         x2.urgency === "whenever" ? "can wait" : x2.urgency));
      const done = el("button","rowx","✓");
      done.setAttribute("aria-label", `Mark ${x2.fault || "this issue"} fixed`);
      /* This used to arm on the first tap and close on the second, recording
         nothing. It now opens the form that asks the two things worth keeping,
         which is its own confirmation — a sheet you can back out of. */
      done.onclick = ()=>{
        haptic(12);
        openFixedForm({
          /* No pre-fill here. A logged fault keeps who was lined up inside its
             note text ("… · for Ramesh"), and digging a name back out of prose
             would pre-select the wrong person the first time somebody's note
             ended in the word "for". The crew list already ranks whoever has
             done this fault here before, which is the same answer, honestly. */
          fi, fault: x2.fault || "",
          assigned: "", assignedPhone: "",
          line: `<b>${esc(x2.fault || "Issue")}</b> · logged `
              + `${x2.on === 0 ? "today" : fmt(x2.on)}${x2.note ? " · " + esc(x2.note) : ""}`,
          cta: "Mark it fixed",
          back: ()=> openSheet(fi, day),
          onDone: d=>{
            closeIssue(x2, d.fixer, d.phone, d.cost);
            openSheet(fi, day); refreshScreen();
          }
        });
      };
      end.appendChild(done);
      row.append(m, end);
      il.appendChild(row);
    });
    sheetB.appendChild(il);
    if(mine2.length > 1 && win){
      const b = el("p");
      b.style.cssText = "margin:9px 20px 0;font-size:12px;line-height:1.55;color:var(--txt-3)";
      b.textContent = `All ${mine2.length} could go in one visit while it sits empty from `
        + `${fmt(win.from)} — one trip instead of ${mine2.length}, and no night lost.`;
      sheetB.appendChild(b);
    }
  }

  const s2 = el("div","sheet-s");
  s2.append(el("span","lbl","Open stretches"), el("span","lbl","sellable"));
  sheetB.appendChild(s2);
  const gl = el("div","card"); gl.style.margin="0 20px";
  let d=0, any=false, shown=0;
  while(d<DAYS){
    if(occ[fi][d]){ d++; continue; }
    let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++;
    if(shown >= SHOW){ d += n; any = true; continue; }
    shown++;
    const row = el("button","row"); any=true;
    row.append(el("div","id", `${n}n`));
    const m = el("div","meta");
    m.innerHTML = `${fmtL(d)}<em>through ${fmtL(Math.min(d+n,DAYS-1))}</em>`;
    row.append(m, el("span", n===1 ? "pill warn" : "pill good", n===1 ? "orphan night" : "open"));
    const at = d, len = n;
    row.onclick = ()=>{ haptic(9); openBooking(fi, at, Math.min(len, 3)); };
    gl.appendChild(row);
    d += n;
  }
  if(!any) gl.appendChild(el("div","empty","Solidly booked for the whole horizon."));
  sheetB.appendChild(gl);

  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* ══════════════ moving a guest ══════════════════════════════════════════════
   Ask can already spot that one shuffle would rescue a stay it otherwise has to
   refuse. It used to stop at spotting it: tapping the option opened the room
   that WOULD be freed, and nobody had moved, which made the whole feature a
   suggestion the operator then had to carry out by hand somewhere else.

   This finishes it. And because it is the one action that changes something a
   guest has already been told — their room number — it is the one action that
   asks first, and the one that shows what it is about to do rather than
   describing it. The guest crosses the gap between two rooms with their bag.
   A record silently changing its flat_id would be the same operation and a
   completely different thing to agree to.                                    */
const SVG_BAG = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<rect x="3.2" y="6.6" width="13.6" height="10.2" rx="2.2"/>'
  + '<path d="M7.6 6.6V4.4a1.4 1.4 0 0 1 1.4-1.4h2a1.4 1.4 0 0 1 1.4 1.4v2.2"/>'
  + '<path d="M3.2 11.4h13.6"/></svg>';

/* two rooms trading places — the same idea as the bag, at label size */
const SVG_SWAP = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3.5 7h11M11.5 4 14.5 7l-3 3"/>'
  + '<path d="M16.5 13h-11M8.5 16 5.5 13l3-3"/></svg>';


function openMove(mv, askDay, onFreed, opts){
  opts = opts || {};
  const from = flats[mv.frees], n = mv.moves.length;
  let booked = false, done = [], busy = false;
  const timers = [];
  const later = (fn, ms)=>{
    const id = setTimeout(()=>{ const i = timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); }, ms);
    timers.push(id); return id;
  };
  const OPEN = 300, FLY = 460, STEP = 110;

  const abandoned = ()=>{
    if(booked || !done.length) return;
    const k = done.length, names = done.map(d => d.c.m.booking.guest);
    toast("warn", `<b>${k === 1 ? esc(names[0]) + " was moved" : k + " guests were moved"}</b> `
      + `but ${esc(from.id)} was never booked — so nobody was moved for a reason.`,
      null, {label: k === 1 ? "Put them back" : `Put all ${k} back`, run:()=>{
        const failed = [];
        done.slice().reverse().forEach(d=>{ if(!moveBooking(d.booking, d.was)) failed.push(d); });
        haptic(14); refreshScreen();
        toast(failed.length ? "bad" : "",
          failed.length ? `<b>${failed.length} could not go back</b> — those rooms have been taken since.`
                        : `<b>Everyone is back where they were.</b>`, null);
      }});
  };

  sheetWipe();
  sheetOwn(()=>{ timers.splice(0).forEach(clearTimeout); abandoned(); });

  const t = el("div");
  t.innerHTML = `<div class="n">${esc(opts.title || "Free up " + from.id)}</div>`
              + `<div class="m">${n === 1 ? "one guest moves" : n + " guests move"} · nobody loses a night</div>`;
  const x = el("button", null, "✕"); x.setAttribute("aria-label","Close");
  x.onclick = ()=> closeSheet();
  sheetH.append(t, x);

  const stage = el("div","movestage");
  stage.setAttribute("role","group");
  stage.setAttribute("aria-label", (n === 1 ? "One guest moves" : n + " guests move") + " out of " + from.id);
  const fly = el("div","mfly"); fly.setAttribute("aria-hidden","true");

  /* a party is a collapsible row: the grid animates, the inner box clips */
  const party = ()=>{
    const p = el("div","mparty"), inner = el("div","mpin");
    p.append(inner); p.inner = inner; return p;
  };

  const src = el("div","mroom"); src.setAttribute("role","group");
  const srcHead = el("div","mhead"), srcTag = el("span","mtag");
  srcHead.append(el("b", null, from.id), el("s", null, from.type + " · " + from.bshort), srcTag);
  const srcParty = party();
  src.append(srcHead, srcParty);

  const gap = el("div","mgap"); gap.setAttribute("aria-hidden","true"); gap.appendChild(el("i"));
  const dests = el("div","mdests");

  const chipFor = m =>{
    const c = el("div","mguest");
    c.innerHTML = '<div class="mguest-fx"><div class="mguest-in">'
      + '<span class="bag">' + SVG_BAG + '</span>'
      + '<span class="who"><b>' + esc(m.booking.guest) + '</b>'
      + '<s>' + esc(fmt(m.booking.start)) + '–' + esc(fmt(m.booking.end)) + '</s></span>'
      + '</div></div>';
    return c;
  };

  const rooms = new Map(), chips = [];
  mv.moves.map((m,i)=>({m,i}))
    .sort((a,b)=> (a.m.booking.start - b.m.booking.start) || (a.i - b.i))
    .forEach(({m})=>{
      const to = flats[m.to];
      let d = rooms.get(m.to);
      if(!d){
        const row = el("div","mdest"); row.setAttribute("role","group");
        const head = el("div","mhead");
        head.append(el("b", null, to.id), el("s", null, to.type + " · " + to.bshort));
        const pt = party();
        row.append(head, pt); dests.appendChild(row);
        d = {row, party:pt, fi:m.to, want:[]}; rooms.set(m.to, d);
      }
      /* home is where they are; away is the space kept for them, hidden until
         they land. No dashed outline announcing a move nobody has agreed to. */
      const home = chipFor(m), away = chipFor(m);
      away.classList.add("away");
      srcParty.inner.appendChild(home);
      d.party.inner.appendChild(away);
      d.want.push(m.booking.guest);
      chips.push({home, away, m, dest:d});
    });
  srcParty.classList.add("open");
  stage.append(src, gap, dests, fly);

  const worst = mv.moves.find(m => !m.sameBuilding);
  const pitch = `Everyone keeps their own nights, their room is never smaller. `
    + (mv.sameBuilding && mv.sameType
        ? `<b>Same building, same size</b> throughout — the kind of move nobody notices.`
        : worst
        ? `<b>${esc(flats[worst.booking.fi].bname)} → ${esc(flats[worst.to].bname)}</b> for `
          + `${esc(worst.booking.guest)} — a different building, so that one is worth a call.`
        : `Same building throughout${mv.sameType ? "" : ", and nobody ends up in a smaller flat"}.`);
  const firstNote = n === 1
    ? "Nothing else changes — same dates, same money, same guest. They will need telling their room number."
    : `Nothing else changes — same dates, same money. All ${n} will need telling their new room number.`;

  const why = el("p","movewhy");
  const go = el("button","bkgo movego");
  const undoBtn = el("button","moveundo away");
  const note = el("p","movenote");

  const atHome = ()=> chips.filter(c => !c.home.classList.contains("away"));

  const restate = ()=>{
    const staying = atHome().length;
    src.classList.toggle("lit", !staying);
    srcParty.classList.toggle("open", staying > 0);
    srcTag.textContent = staying ? (staying === 1 ? "1 guest" : staying + " guests") : "Free";
    src.setAttribute("aria-label", from.id + ", " + from.type + ", " + from.bshort
      + (staying ? " — " + staying + (staying === 1 ? " guest to move" : " guests to move") : " — free"));
    rooms.forEach(d=>{
      const here = [...d.party.inner.children].filter(c => !c.classList.contains("away"));
      d.row.classList.toggle("filled", here.length > 0);
      d.party.classList.toggle("open", here.length > 0);
      d.row.setAttribute("aria-label", flats[d.fi].id + ", " + flats[d.fi].type + ", " + flats[d.fi].bshort
        + (here.length ? " — now holding " + here.map(c => c.querySelector("b").textContent).join(", ")
                       : " — free, " + d.want.join(" and ") + " would move here"));
    });
  };

  const speak = ()=>{
    restate();
    const left = atHome(), m = left.length;
    if(!m){
      why.innerHTML = `<b class="ok">${esc(from.id)} is free.</b> `
        + (n === 1 ? `${esc(chips[0].m.booking.guest)} is in ${esc(flats[chips[0].m.to].id)}`
                   : `All ${n} are in their new rooms`) + ` for the same nights.`;
      go.textContent = opts.cta || `Book ${from.id}`;
      go.onclick = ()=>{ haptic(14); booked = true; sheetOwn(null);
        if(onFreed) onFreed(mv.frees); else openBooking(mv.frees, askDay, 1); };
      note.textContent = n === 1
        ? "Tell them the new room number when you next speak to them."
        : `Tell all ${n} their new room numbers when you next speak to them.`;
    }else if(m === n){
      why.innerHTML = pitch;
      go.textContent = n === 1 ? `Move ${chips[0].m.booking.guest}` : `Move all ${n}`;
      go.onclick = start;
      note.textContent = firstNote;
    }else{
      const stuck = done.map(d => d.c.m.booking.guest);
      why.innerHTML = `<b>${esc(from.id)} is not free.</b> `
        + `${esc(stuck.join(" and "))} ${stuck.length === 1 ? "is" : "are"} still moved; `
        + `${m === 1 ? "one guest is" : m + " guests are"} back in ${esc(from.id)}.`;
      go.textContent = m === 1 ? `Move ${left[0].m.booking.guest} again` : `Move the other ${m}`;
      go.onclick = start;
      note.textContent = "Nothing else changes — same dates, same money.";
    }
    undoBtn.classList.toggle("away", !done.length);
    undoBtn.textContent = done.length === 1 ? "↩ Put them back" : `↩ Put all ${done.length} back`;
    undoBtn.disabled = false;
    go.disabled = false;
  };

  speak();
  why.setAttribute("role","status"); why.setAttribute("aria-live","polite");
  sheetB.append(stage, why, go, undoBtn, note);
  sheet.classList.add("on"); scrim.classList.add("on"); sheetB.scrollTop = 0;

  /* ── the flight ────────────────────────────────────────────────────────────
     Beat one: the room opens. Beat two: the guest walks across. They are two
     movements because they are two events, and running them together makes the
     landing point move while something is travelling towards it. */
  function carry(pairs, after){
    if(!pairs.length){ if(after) after(); return; }
    busy = true;
    const still = calm;
    pairs.forEach(p => p.openRow());            // make space first
    if(still){
      // Reduced motion still has to be the same EVENT, not a different one:
      // whoever left has to stop being where they were. Landing the arrival
      // without hiding the departure leaves the same guest in both rooms.
      pairs.forEach(p =>{ p.fromEl.classList.add("away"); p.land(); });
      busy = false; if(after) after(); return;
    }

    later(()=>{
      const box = stage.getBoundingClientRect();
      stage.classList.add("carrying");
      pairs.forEach((p,i)=>{
        const a = p.fromEl.getBoundingClientRect();
        const b = p.toEl.getBoundingClientRect();
        const f = p.fromEl.cloneNode(true);
        f.className = "mflier";
        f.style.width = a.width + "px";
        f.style.setProperty("--x0", (a.left - box.left).toFixed(1) + "px");
        f.style.setProperty("--y0", (a.top  - box.top ).toFixed(1) + "px");
        f.style.setProperty("--x1", (b.left - box.left).toFixed(1) + "px");
        f.style.setProperty("--y1", (b.top  - box.top ).toFixed(1) + "px");
        f.style.setProperty("--bow", Math.max(9, Math.min(20,
          Math.hypot(b.left - a.left, b.top - a.top) * .1)).toFixed(0) + "px");
        f.style.setProperty("--delay", (i * STEP) + "ms");
        f.style.setProperty("--fly", FLY + "ms");
        fly.appendChild(f);
        p.fromEl.classList.add("away");          // it is in the air now
        later(()=>{ p.land(); f.remove(); haptic(7); }, i * STEP + FLY - 20);
      });
      later(()=>{
        stage.classList.remove("carrying");
        fly.textContent = "";
        busy = false;
        if(after) after();
      }, (pairs.length - 1) * STEP + FLY + 40);
    }, OPEN);
  }

  function start(){
    if(busy) return;
    const going = atHome();
    if(!going.length) return;
    go.disabled = true; undoBtn.disabled = true; haptic(12);
    const moved = [];
    for(const c of going){
      const r = moveBooking(c.m.booking, c.m.to);
      if(!r){
        moved.slice().reverse().forEach(d => moveBooking(d.booking, d.was));
        go.disabled = false; undoBtn.disabled = false; haptic(20);
        toast("warn", `<b>${esc(flats[c.m.to].id)} went while you were deciding.</b> `
          + `Nobody has been moved.`, c.m.to);
        return;
      }
      moved.push({booking:c.m.booking, was:r.from, c});
    }
    done = done.concat(moved);
    refreshScreen();
    carry(going.map(c=>({
      fromEl: c.home, toEl: c.away,
      openRow: ()=>{ c.dest.party.classList.add("open"); c.dest.row.classList.add("filled"); },
      land: ()=>{ c.away.classList.remove("away"); }
    })), ()=>{ haptic(16); speak(); });
  }

  undoBtn.onclick = ()=>{
    if(busy || !done.length) return;
    undoBtn.disabled = true; go.disabled = true; haptic(10);
    const returned = [], stuck = [];
    done.slice().reverse().forEach(d=>{ (moveBooking(d.booking, d.was) ? returned : stuck).push(d); });
    returned.reverse(); stuck.reverse();
    done = stuck;
    refreshScreen();
    if(stuck.length)
      toast("bad", `<b>${stuck.length} could not go back</b> — `
        + `${stuck.length === 1 ? "that room has" : "those rooms have"} been taken since.`, null);
    if(!returned.length){ speak(); return; }
    carry(returned.map(d=>({
      fromEl: d.c.away, toEl: d.c.home,
      openRow: ()=>{ srcParty.classList.add("open"); },
      land: ()=>{
        d.c.home.classList.remove("away");
        if(![...d.c.dest.party.inner.children].some(k => !k.classList.contains("away"))){
          d.c.dest.party.classList.remove("open");
          d.c.dest.row.classList.remove("filled");
        }
      }
    })), ()=>{ haptic(14); speak(); });
  };
}
/* ── booking, on its own screen ───────────────────────────────────────────────
   It sets its own dates. The old form inherited them from the Rooms tab and
   apologised for it in help text — "change the dates on the Rooms tab" — which
   is what a broken flow sounds like when nobody fixes it.                     */
function openBooking(fi, from, nights){
  const fl = flats[fi];
  roomHead(fi, ()=> openSheet(fi, from));

  let day = Math.max(0, Math.min(from|0, DAYS-1));
  let n   = Math.max(1, nights|0 || 1);
  const capFrom = d => { let k = 0; while(k < 60 && d + k < DAYS && !occ[fi][d + k]) k++; return k; };

  const form = el("div","bkform");

  /* when */
  const whenCap = el("div","bkcap");
  whenCap.append(el("span",null,"Arriving"), el("span",null,"Nights"));
  const whenRow = el("div","bkrow");
  const dayBox = el("div","stepWide");
  const dLess = el("button",null,"−"), dMore = el("button",null,"+"), dLab = el("b");
  dLess.setAttribute("aria-label","A day earlier"); dMore.setAttribute("aria-label","A day later");
  dayBox.append(dLess, dLab, dMore);
  const nBox = el("div","step");
  const nLess = el("button",null,"−"), nMore = el("button",null,"+"), nLab = el("b");
  nLess.setAttribute("aria-label","Fewer nights"); nMore.setAttribute("aria-label","More nights");
  nBox.append(nLess, nLab, nMore);
  whenRow.append(dayBox, nBox);

  const state = el("div","bkstate");

  const phone = el("input");
  phone.type = "tel"; phone.inputMode = "numeric"; phone.autocomplete = "tel";
  phone.placeholder = "Phone number";
  phone.setAttribute("aria-label", `Guest phone number for ${fl.id}`);
  const who = el("input");
  who.type = "text"; who.placeholder = "Guest name"; who.autocomplete = "off";
  who.setAttribute("aria-label", `Guest name for ${fl.id}`);
  const back = el("div","bkback"); back.style.display = "none";

  const capRow = el("div","bkcap");
  capRow.append(el("span",null,"Total for the stay"), el("span",null,"Guests"));
  const row = el("div","bkrow");
  const amtWrap = el("div","bkamt");
  amtWrap.appendChild(el("s", null, "₹"));
  const amt = el("input");
  amt.type = "text"; amt.inputMode = "numeric"; amt.placeholder = "Total";
  amt.setAttribute("aria-label","Total agreed for the stay");
  amtWrap.appendChild(amt);
  let pax = 2, touchedAmt = false;
  amt.addEventListener("input", ()=>{ touchedAmt = true; });
  const step = el("div","step");
  const pLess = el("button",null,"−"), pMore = el("button",null,"+"), paxN = el("b","","2");
  pLess.setAttribute("aria-label","Fewer guests"); pMore.setAttribute("aria-label","More guests");
  const setPax = v => { pax = Math.max(1, Math.min(12, v)); paxN.textContent = pax;
    pLess.disabled = pax <= 1; pMore.disabled = pax >= 12; haptic(5); };
  pLess.onclick = ()=> setPax(pax-1); pMore.onclick = ()=> setPax(pax+1);
  step.append(pLess, paxN, pMore); setPax(2);
  row.append(amtWrap, step);

  let src = "Direct";
  const srcRow = el("div","srcRow");
  ["Direct","Airbnb","Walk-in","Booking.com","Repeat guest"].forEach(s=>{
    const c = el("button", null, s);
    c.setAttribute("aria-pressed", s === src);
    c.onclick = ()=>{ src = s; haptic(8);
      [...srcRow.children].forEach(o=>o.setAttribute("aria-pressed", o.textContent === src)); };
    srcRow.appendChild(c);
  });

  const go = el("button","bkgo","");

  function paint(){
    const cap = capFrom(day);
    n = Math.max(1, Math.min(n, Math.max(1, cap)));
    dLab.textContent = day === 0 ? "Tonight" : fmtL(day);
    nLab.textContent = n;                       // the caption above says NIGHTS
    dLess.disabled = day <= 0; dMore.disabled = day >= DAYS-1;
    nLess.disabled = n <= 1;   nMore.disabled = n >= cap;
    const ok = cap > 0 && freeRange(fi, day, day + n);
    state.classList.toggle("bad", !ok);
    if(ok){
      state.textContent = `Leaves ${fmt(day + n)}` + (cap > n ? ` · free for ${cap} night${cap>1?"s":""} from here` : " · the night after is taken");
    }else{
      const busy = resv.find(r => r.fi === fi && r.start <= day && r.end > day);
      state.textContent = busy
        ? `${isBlock(busy) ? (busy.reason || "Out of service") : busy.guest} holds ${fmtL(day)}`
        : `${fl.id} is not free on ${fmtL(day)}`;
    }
    if(!touchedAmt) amt.value = (fl.rate || 0) * n ? String((fl.rate || 0) * n) : "";
    go.textContent = ok ? `Book ${n} night${n>1?"s":""}` : "Not available";
    go.disabled = !ok;
  }
  dLess.onclick = ()=>{ day = Math.max(0, day-1); haptic(5); paint(); };
  dMore.onclick = ()=>{ day = Math.min(DAYS-1, day+1); haptic(5); paint(); };
  nLess.onclick = ()=>{ n = Math.max(1, n-1); haptic(5); paint(); };
  nMore.onclick = ()=>{ n = n+1; haptic(5); paint(); };

  phone.addEventListener("input", ()=>{
    const seen = guestByPhone(phone.value);
    if(!seen){ back.style.display = "none"; return; }
    if(!who.value.trim()) who.value = seen.name;
    if(PLATFORMS.indexOf(src) < 0){
      src = "Repeat guest";
      [...srcRow.children].forEach(o=>o.setAttribute("aria-pressed", o.textContent === src));
    }
    back.style.display = "";
    back.textContent = seen.stays === 1
      ? `${seen.name} has stayed once before · last ${fmt(seen.last)}`
      : `${seen.name} has stayed ${seen.stays} times · last ${fmt(seen.last)}`;
  });

  const take = ()=>{
    if(go.disabled) return;
    if(addBooking(fi, day, n, who.value.trim(), src,
                  {phone: phone.value, pax, amount: (amt.value||"").replace(/[^\d]/g,"")})){
      haptic(18); closeSheet(); refreshScreen();
    }else{
      haptic(30); go.textContent = "Just taken";
      setTimeout(()=>{ openSheet(fi, day); refreshScreen(); }, 900);
    }
  };
  go.onclick = take;
  who.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); who.blur(); take(); }});

  form.append(whenCap, whenRow, state, phone, who, back, capRow, row, srcRow, go);
  sheetB.append(form);
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
  setTimeout(()=> phone.focus(), 120);
}

/* ── out of service, on its own screen ────────────────────────────────────── */

/* ── a glyph for each thing that breaks ───────────────────────────────────────
   Monoline, 24-box, one weight, no fills — the same drawing rules as the tab

const FAULT_ICON = {

  "Pest control":'<circle cx="12" cy="13" r="5"/><path d="M12 8V6M9 5l1.5 2M15 5l-1.5 2M7 11l-3-1M7 16l-3 2M17 11l3-1M17 16l3 2"/>',
  "Chimney":'<path d="M3 14.5l9-6 9 6"/><path d="M5.5 13v7.5h13V13"/><path d="M9.5 20.5v-4h5v4"/><path d="M9 5.5c0-1.2 1.2-1.6 1.2-2.8M14 5.5c0-1.2 1.2-1.6 1.2-2.8"/>',

const faultSvg = k => '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + (FAULT_ICON[k] || FAULT_ICON["*"]) + '</svg>';

/* Everything that can take a flat out of service, in one list. "Maintenance"
   plus "AC" was always one fact asked twice — a broken thing IS the reason — so
   the faults carry reason "Maintenance" and only the four that are not a
   breakage stay as reasons of their own. The stored shape does not change. */
/* The words an operator would actually type. "Plumbing" is the category; "tap"
   is what is dripping — and a search box that promises "tap, socket" and then
   finds nothing is worse than no search box. */
const FAULT_ALIAS = {
  "AC":"aircon air cooling cool ac",
  "Geyser":"water heater hot shower boiler",
  "Plumbing":"tap sink drain leak water toilet flush pipe basin",
  "Electrical":"socket plug switch light power mcb wiring fuse board",
  "Wi-Fi":"internet router net broadband signal wifi",
  "Fridge":"refrigerator freezer cooling",
  "Washing machine":"washer laundry washing drum",
  "Furniture":"sofa bed wardrobe chair table cupboard door drawer",
  "Chimney":"chimney hood extractor exhaust kitchen smoke filter suction",
  "Microwave":"microwave oven kitchen heating turntable",
  "Gas stove":"gas stove hob burner cooktop kitchen flame regulator cylinder",
  "Pest control":"cockroach roach ants rats rodents mosquito bugs pest",
  "Other":"something else anything",
  "Deep clean":"clean cleaning deep",
  "Owner use":"owner personal family",
  "Renovation":"paint painting renovate remodel tiles work",
  "Not ready":"ready setup furnishing new"
};
/* every word has to land somewhere, so "hot water" finds the geyser even though
   the alias says "water heater hot" — a phrase match would miss it */
const faultHit = (k, needle)=>{
  const hay = (k + " " + (FAULT_ALIAS[k] || "")).toLowerCase();
  // short words are "no", "is", "the" — requiring them finds nothing for
  // "no power", which is exactly how somebody types it
  const words = needle.split(/\s+/).filter(w => w.length > 2);
  return words.length ? words.every(w => hay.includes(w)) : hay.includes(needle);
};

const OUT_REASONS = ["Deep clean","Owner use","Renovation","Not ready"];
function outOptions(fi){
  return faultsFor(fi).map(f => ({key:f, fault:f, reason:"Maintenance"}))
    .concat(OUT_REASONS.map(r => ({key:r, fault:"", reason:r})));
}
/* How many times THIS flat has had THIS thing — the badge on the tile. */
function faultTimesHere(fi, fault){
  if(!fault) return 0;
  return resv.filter(r => isBlock(r) && r.fi === fi && r.fault === fault).length;
}

/* ── who has actually done this ───────────────────────────────────────────────
   Ranked the way the app ranks everything else: this flat first, then the other
   forty-four, then whoever is simply used most. The "why" line is the point —
   a name on its own is trivia, and the record beside it is what decides whether
   you ring this one or the next one. Nobody is pre-selected. */
function crewFor(fi, fault){
  const all = fixers();
  if(!all.length) return [];
  const here = {}, away = {};
  if(fault) resv.filter(r => isBlock(r) && r.fault === fault && r.fixer).forEach(r=>{
    const k = r.fixer.trim().toLowerCase();
    if(r.fi === fi) here[k] = (here[k] || 0) + 1; else away[k] = (away[k] || 0) + 1;
  });
  const said = g=>{
    const k = g.name.trim().toLowerCase(), n = here[k] || 0, m = away[k] || 0;
    if(n) return n === 1 ? `did the ${fault} here`
                         : `did the ${fault} here ${n === 2 ? "twice" : n + " times"}`;
    if(m) return `${fault} in ${m} other flat${m>1?"s":""}`;
    return "most used overall";
  };
  const rank = g=>{
    const k = g.name.trim().toLowerCase();
    return (here[k] ? 200 + here[k] : 0) + (away[k] ? 100 + away[k] : 0) + g.jobs;
  };
  return all.slice().sort((a,b)=> rank(b) - rank(a)).slice(0,3)
    .map(g=>({name:g.name, phone:g.phone, why:said(g),
              rec:`${g.jobs} job${g.jobs>1?"s":""} · ${g.back ? g.back + " came back" : "none came back"}`,
              bad:!!g.back}));
}

function openBlockForm(fi, day){
  const fl = flats[fi];
  roomHead(fi, ()=> openSheet(fi, day));

  let from = Math.max(0, Math.min(pickedNight, DAYS-1));
  while(from < DAYS && occ[fi][from]) from++;                 // start where it can actually go out
  if(from >= DAYS) from = Math.max(0, Math.min(pickedNight, DAYS-1));
  let outN = 1, reason = "Maintenance", fault = "", chosen = "";
  let who = "", phone = "", newHand = false, q = "", showAll = false;
  /* No 60-night ceiling here. That number is openBooking's, where it is a
     sensible maximum guest stay; copied onto a repair it made "take all 60"
     appear on a flat with 63 free nights, left the last three untakeable by any
     control on the screen, and then told you a guest held a night nobody held.
     A flat added before it goes on sale is exactly the long-void case this is
     for. */
  const capFrom = d => { let k = 0; while(d + k < DAYS && !occ[fi][d + k]) k++; return Math.max(1, k); };

  const form = el("div","bkform");
  const prev = previewStrip(fi);

  /* The running total, said once at the top. It is context, not a field: dates
     and money boxed in the middle of a form read as something to fill in. */
  const line = el("p","bkline");

  /* ── what broke ─────────────────────────────────────────────────────────── */
  const fCap = el("div","bkcap");
  fCap.append(el("span",null,"What is happening"), el("span",null,"tap one"));
  const find = el("div","ffind");
  find.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'
    + '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
  const qi = el("input");
  qi.type = "text"; qi.placeholder = "or type it — geyser, tap, socket…";
  qi.setAttribute("aria-label","Find what broke");
  const qx = el("button", null, "✕"); qx.setAttribute("aria-label","Clear"); qx.hidden = true;
  find.append(qi, qx);
  const grid = el("div","fgrid");
  const flag = el("div","faultFlag"); flag.hidden = true;
  /* "Other" means the list did not have it, so the only useful next thing is a
     box to say what it actually is. */
  const otherRow = el("div","r"); otherRow.hidden = true;
  const otherIn = el("input");
  otherIn.type = "text"; otherIn.placeholder = "What is it? — this goes in the note";
  otherRow.appendChild(otherIn);

  /* ── how long ───────────────────────────────────────────────────────────── */
  const whenCap = el("div","bkcap");
  whenCap.append(el("span",null,"Out from"), el("span",null,"Nights"));
  const whenRow = el("div","bkrow");
  const dayBox = el("div","stepWide");
  const dLess = el("button",null,"−"), dMore = el("button",null,"+"), dLab = el("b");
  dLess.setAttribute("aria-label","A day earlier"); dMore.setAttribute("aria-label","A day later");
  dayBox.append(dLess, dLab, dMore);
  const nBox = el("div","step");
  const nLess = el("button",null,"−"), nMore = el("button",null,"+"), nLab = el("b");
  nLess.setAttribute("aria-label","Fewer nights out"); nMore.setAttribute("aria-label","More nights out");
  nBox.append(nLess, nLab, nMore);
  whenRow.append(dayBox, nBox);
  const jump = el("div","bkjump");

  /* ── who is fixing it ───────────────────────────────────────────────────── */
  const whoCap = el("div","bkcap");
  const whoCapR = el("span");
  whoCap.append(el("span",null,"Who is fixing it"), whoCapR);
  const crew = el("div","crew");
  const handRow = el("div","r"); handRow.hidden = true;
  const handName = el("input"); handName.type = "text"; handName.placeholder = "Name";
  handName.setAttribute("aria-label","Name of the person fixing it");
  const handPh = el("input"); handPh.type = "tel"; handPh.inputMode = "numeric";
  handPh.placeholder = "Their number"; handPh.setAttribute("aria-label","Their phone number");
  handRow.append(handName, handPh);

  /* No bill here. Nobody knows what a repair cost before it has been done, so a
     money box on this form could only ever collect a guess — and a guess is
     exactly what "what upkeep costs" must not be counting. The bill is asked
     once, at the end, by openFixedForm. */
  const noteRow = el("div","r");
  const note = el("input");
  note.type = "text"; note.placeholder = "Note — e.g. compressor";
  note.setAttribute("aria-label","A note about the work");
  noteRow.append(note);
  const go = el("button","bkgo","");

  function paintGrid(){
    grid.textContent = "";
    const all = outOptions(fi);
    const needle = q.trim().toLowerCase();
    let list = needle ? all.filter(o => faultHit(o.key, needle)) : all;
    // eight cells is two clean rows; the rest are a tap or three letters away
    const capped = !needle && !showAll && list.length > 8;
    if(capped) list = list.slice(0, 7);
    if(!list.length){
      const none = el("div","fnone", `Nothing matches “${q.trim()}”. Try fewer letters, or pick Other.`);
      grid.appendChild(none); return;
    }
    list.forEach(o=>{
      const t = el("button","ftile");
      const on = chosen === o.key;
      t.setAttribute("aria-pressed", on);
      const times = faultTimesHere(fi, o.fault);
      t.setAttribute("aria-label", o.key + (times ? `, ${times} here before` : ""));
      t.innerHTML = faultSvg(o.key);
      t.append(el("span", null, o.key));
      if(times) t.append(el("i", null, times + "×"));
      t.onclick = ()=>{
        if(on){ chosen = ""; fault = ""; reason = "Maintenance"; }
        else { chosen = o.key; fault = o.fault; reason = o.reason; }
        haptic(8); paint();
      };
      grid.appendChild(t);
    });
    if(capped){
      const m = el("button","ftile");
      m.innerHTML = faultSvg("Other");
      m.append(el("span", null, "+" + (all.length - 7) + " more"));
      m.setAttribute("aria-label", "Show the other " + (all.length - 7));
      m.onclick = ()=>{ showAll = true; haptic(8); paintGrid(); };
      grid.appendChild(m);
    }
  }

  function paintCrew(){
    crew.textContent = "";
    whoCapR.textContent = chosen ? "who does " + chosen : "";
    if(!chosen){
      crew.append(el("p","crewidle","The right people appear once you say what is happening."));
      handRow.hidden = true;
      return;
    }
    const list = crewFor(fi, fault);
    list.forEach(c=>{
      const b = el("button","mate");
      b.setAttribute("aria-pressed", who === c.name);
      const t = el("div","mt");
      t.append(el("b", null, c.name), el("em", null, c.why));
      b.append(t, el("div","mr" + (c.bad ? " bad" : ""), c.rec));
      b.onclick = ()=>{
        if(who === c.name){ who = ""; phone = ""; }
        else { who = c.name; phone = c.phone || ""; newHand = false; }
        haptic(8); paint();
      };
      crew.appendChild(b);
    });
    const nu = el("button","mate new");
    nu.setAttribute("aria-pressed", newHand);
    const nt = el("div","mt");
    nt.append(el("b", null, list.length ? "Someone else" : "Who is fixing it"),
              el("em", null, "name and number"));
    nu.append(nt);
    nu.onclick = ()=>{ newHand = !newHand; if(newHand){ who = ""; phone = ""; }
      haptic(8); paint(); if(newHand) handName.focus(); };
    crew.appendChild(nu);
    handRow.hidden = !newHand;
  }

  function paintFlag(){
    const hist = fault ? faultHistory(fi, fault, from) : null;
    flag.textContent = "";
    if(!hist){ flag.hidden = true; return; }
    flag.hidden = false;
    flag.classList.toggle("hot", hist.insideHold);
    const l = el("div","ff-l");
    l.innerHTML = `<b>${hist.recent > 2 ? hist.recent + ordinalSuffix(hist.recent)
                        : hist.times === 2 ? "Second" : hist.times + ordinalSuffix(hist.times)}`
      + ` ${esc(fault)} fault in ${esc(fl.id)}.</b> `
      + (hist.last.fixer
          ? `${esc(hist.last.fixer)} fixed it ${hist.gap === 0 ? "and it is still out"
              : hist.gap + " day" + (hist.gap>1?"s":"") + " ago"}.`
          : `Last one ended ${hist.gap} day${hist.gap===1?"":"s"} ago, nobody recorded.`)
      + (hist.insideHold ? " <em>Inside the month — worth asking for a free look.</em>" : "");
    flag.append(l);
    if(hist.last.fixer && hist.last.fixer_phone){
      const a = el("div","ff-a");
      const call = el("a","ff-call", "Call " + hist.last.fixer);
      call.href = "tel:" + hist.last.fixer_phone.replace(/[^\d+]/g,"");
      a.append(call);
      flag.append(a);
    }
  }

  /* Two jumps worth offering, and only when they are not what is already set. */
  function paintJumps(cap){
    jump.textContent = "";
    if(cap > outN){
      const b = el("button");
      b.innerHTML = `take all <b>${cap}</b> free night${cap>1?"s":""}`;
      b.setAttribute("aria-label", `Take all ${cap} free nights, back on sale ${fmtL(from + cap)}`);
      b.onclick = ()=>{ outN = cap; haptic(8); paint(); };
      jump.appendChild(b);
    }
    const hist = fault ? faultHistory(fi, fault, from) : null;
    const k = hist && hist.last && hist.last.nights;
    if(k && k !== outN && k <= cap){
      const b = el("button");
      b.innerHTML = `take <b>${k}</b> — same as the last ${esc(fault)} here`;
      b.setAttribute("aria-label", `Take ${k} nights, the same as the last ${fault} in ${fl.id}`);
      b.onclick = ()=>{ outN = k; haptic(8); paint(); };
      jump.appendChild(b);
    }
    /* And the window where the work costs nothing sold.
       This asked batchWindow for `outN` nights, and outN is 1 when the form
       opens — so it returned the FIRST free night on the calendar however short,
       and compared it to `from` rather than to the run `from` sits inside.
       Measured across the demo: of 263 offers, 102 restated the very gap the
       operator was standing in and 57 pointed at a SHORTER one. Tapping it threw
       away a nine-night window for a two-night one, and the chip then vanished,
       so there was no way back.
       It now asks for a window strictly longer than the run in hand, and
       excludes that run by its start rather than by the cursor. */
    let runFrom = from;
    while(runFrom > 0 && !occ[fi][runFrom - 1]) runFrom--;
    const win = batchWindow(fi, Math.max(outN, capFrom(runFrom) + 1));
    if(win && win.from !== runFrom && win.nights > capFrom(runFrom)){
      const b = el("button");
      // the same word the line above uses, or the chip and the sentence disagree
      b.innerHTML = `do it <b>${win.from === 0 ? "today" : esc(fmt(win.from))}</b> instead`
        + ` — ${win.nights} free night${win.nights>1?"s":""} there`;
      b.setAttribute("aria-label",
        `Start ${fmtL(win.from)} instead, where ${fl.id} has ${win.nights} free nights`);
      b.onclick = ()=>{ from = win.from; haptic(8); paint(); };
      jump.appendChild(b);
    }
  }

  function paint(){
    const cap = capFrom(from);
    outN = Math.max(1, Math.min(outN, cap));
    dLab.textContent = from === 0 ? "Today" : fmtL(from);
    nLab.textContent = outN;
    dLess.disabled = from <= 0; dMore.disabled = from >= DAYS-1;
    nLess.disabled = outN <= 1; nMore.disabled = outN >= cap;
    const ok = freeRange(fi, from, from + outN);
    line.classList.toggle("bad", !ok);
    /* No money in this line. The nightly rate times the nights is a number the
       app can always compute and almost never means anything: these nights were
       not sold, so nothing is being lost — quoting a figure makes an ordinary
       repair look like a bill. What the operator needs here is the two dates
       and the wall. The real cost lives in Upkeep, where the invoice sits
       beside it and the sum is true. */
    line.innerHTML = ok
      ? `Out <b>${esc(from === 0 ? "today" : fmt(from))}</b> for <b>${outN} night${outN>1?"s":""}</b>`
        + ` · back on sale <b>${esc(fmt(from + outN))}</b>`
        + (()=>{
            /* "a guest holds the night after" fired whenever the run ended —
               including at the end of the nine-week calendar, which is 28 of the
               45 flats. Say it only when somebody is actually there, and say the
               right thing when what is there is another outage. */
            const after = from + outN;
            if(after >= DAYS || !occ[fi][after]) return "";
            const who2 = resv.find(r => r.fi === fi && r.start <= after && r.end > after);
            if(!who2) return "";
            return isBlock(who2)
              ? ` · <span class="acc">it is already out of service the night after</span>`
              : ` · <span class="acc">${esc(who2.guest)} holds the night after</span>`;
          })()
      : `<b>${esc(fl.id)} is already taken on ${esc(fmtL(from))}</b>`;
    otherRow.hidden = chosen !== "Other";
    paintGrid(); paintCrew(); paintFlag(); paintJumps(cap);
    go.textContent = !chosen ? "Say what is happening first"
      : ok ? `Take ${fl.id} out for ${outN} night${outN>1?"s":""}` : "Not available";
    go.disabled = !ok || !chosen;
    prev.paint(from, ok ? outN : 0);
  }

  qi.oninput = ()=>{ q = qi.value; qx.hidden = !q; paintGrid(); };
  qx.onclick = ()=>{ q = ""; qi.value = ""; qx.hidden = true; qi.focus(); paintGrid(); };
  dLess.onclick = ()=>{ from = Math.max(0, from-1); haptic(5); paint(); };
  dMore.onclick = ()=>{ from = Math.min(DAYS-1, from+1); haptic(5); paint(); };
  nLess.onclick = ()=>{ outN = Math.max(1, outN-1); haptic(5); paint(); };
  nMore.onclick = ()=>{ outN = outN+1; haptic(5); paint(); };

  go.onclick = ()=>{
    if(go.disabled) return;
    /* "Other" plus a name is a new kind of thing that breaks. Remember it, so
       next time it is a tile and a search word rather than a sentence — and so
       it accrues its own history, its own repeat warning and its own people. */
    let saveFault = fault;
    if(chosen === "Other" && otherIn.value.trim()) saveFault = learnFault(otherIn.value) || fault;
    /* If the typed name did NOT become a kind, the words still have to land
       somewhere — the field says "this goes in the note". The old guard asked
       `!saveFault`, but the Other tile is {key:"Other", fault:"Other"}, so
       saveFault is the truthy string "Other" whatever happens and the branch
       never ran. learnFault refuses a single character, so a one-letter answer
       was learned nowhere and noted nowhere: it just vanished on save. The
       honest test is whether it is still sitting on the fallback. */
    const extra = [note.value, (chosen === "Other" && saveFault === "Other") ? otherIn.value : ""]
      .filter(x=>x && x.trim()).join(" · ");
    const person = newHand ? handName.value : who;
    const num = newHand ? handPh.value : phone;
    if(addBlock(fi, from, outN, reason, extra, {fault:saveFault, fixer:person, phone:num})){
      haptic(18); closeSheet(); refreshScreen();
    }
  };

  form.append(prev, line, fCap, find, grid, otherRow, flag,
              whenCap, whenRow, jump, whoCap, crew, handRow, noteRow, go);
  sheetB.append(form);
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}
/* ══════════════ closing a repair: who fixed it, and what it cost ════════════
   Both questions are asked HERE and nowhere else, because this is the only
   moment either answer exists. The out-of-service form asks who is *going* to
   fix it — useful for the phone call, but a name on a plan is not a record of
   work done, and a bill quoted before the work is a guess. "What upkeep costs"
   was counting lost nights and nothing else; now it counts the invoice too, and
   "whose work sticks" finally sees the person who actually turned up.

   One form serves both kinds of work item — a logged fault that stayed on sale,
   and a flat that was taken out of service — because from here they are the
   same event: somebody came, it is done, this is the bill.                   */
function openFixedForm(o){
  const fi = o.fi, fault = o.fault || "";
  roomHead(fi, o.back);
  /* Pre-filled with whoever was lined up, because usually they are the one who
     came — but it is a normal selected chip, so one tap says otherwise. */
  let who = (o.assigned || "").trim(), phone = (o.assignedPhone || "").trim();
  let newHand = false;

  const form = el("div","bkform");
  const line = el("p","bkline");
  line.innerHTML = o.line;

  const whoCap = el("div","bkcap");
  whoCap.append(el("span",null,"Who fixed it"), el("span",null,"tap one"));
  const crew = el("div","crew");
  const handRow = el("div","r"); handRow.hidden = true;
  const handName = el("input"); handName.type = "text"; handName.placeholder = "Name";
  handName.setAttribute("aria-label","Name of the person who fixed it");
  const handPh = el("input"); handPh.type = "tel"; handPh.inputMode = "numeric";
  handPh.placeholder = "Their number"; handPh.setAttribute("aria-label","Their phone number");
  handRow.append(handName, handPh);

  const costCap = el("div","bkcap");
  /* "if any", not "leave blank if nothing": the right-hand caption slot is
     120px and the longer sentence wrapped to two lines. */
  costCap.append(el("span",null,"What it cost"), el("span",null,"if any"));
  const costRow = el("div","r");
  const bill = el("input","money");
  bill.type = "text"; bill.inputMode = "numeric"; bill.placeholder = "₹ bill";
  bill.setAttribute("aria-label","What the work cost");
  costRow.appendChild(bill);

  const go = el("button","bkgo", o.cta);

  function paintCrew(){
    crew.textContent = "";
    const list = crewFor(fi, fault);
    list.forEach(c=>{
      const b = el("button","mate");
      b.setAttribute("aria-pressed", !newHand && who === c.name);
      const t = el("div","mt");
      t.append(el("b", null, c.name), el("em", null, c.why));
      b.append(t, el("div","mr" + (c.bad ? " bad" : ""), c.rec));
      b.onclick = ()=>{
        if(!newHand && who === c.name){ who = ""; phone = ""; }
        else { who = c.name; phone = c.phone || ""; newHand = false; }
        haptic(8); paint();
      };
      crew.appendChild(b);
    });
    /* The assigned person may not be in the top three this list shows, and
       dropping them would silently rewrite who did the work. */
    if(who && !newHand && !list.some(c => c.name === who)){
      const b = el("button","mate");
      b.setAttribute("aria-pressed", true);
      const t = el("div","mt");
      t.append(el("b", null, who), el("em", null, "who was lined up"));
      b.append(t);
      b.onclick = ()=>{ who = ""; phone = ""; haptic(8); paint(); };
      crew.appendChild(b);
    }
    const nu = el("button","mate new");
    nu.setAttribute("aria-pressed", newHand);
    const nt = el("div","mt");
    nt.append(el("b", null, list.length || who ? "Someone else" : "Who fixed it"),
              el("em", null, "name and number"));
    nu.append(nt);
    nu.onclick = ()=>{
      newHand = !newHand;
      if(newHand){ who = ""; phone = ""; }
      haptic(8); paint();
      if(newHand) handName.focus();
    };
    crew.appendChild(nu);
  }

  function paint(){
    paintCrew();
    handRow.hidden = !newHand;
    const person = (newHand ? handName.value : who).trim();
    /* Naming somebody is what makes the record worth keeping, so the button
       says which half is still missing rather than sitting there disabled. */
    go.textContent = person ? o.cta : "Say who fixed it first";
    go.disabled = !person;
  }

  handName.oninput = paint;
  go.onclick = ()=>{
    if(go.disabled) return;
    const person = (newHand ? handName.value : who).trim();
    const num = (newHand ? handPh.value : phone).trim();
    /* toAmount keeps a minus sign, and a negative bill quietly SUBTRACTS from
       the upkeep total this field exists to make honest. Payments allow
       negatives on purpose — that is a refund. Nothing makes a negative repair. */
    const paid = (bill.value || "").replace(/[^\d.]/g, "");
    haptic(18);
    o.onDone({fixer:person, phone:num, cost:paid});
  };

  form.append(line, whoCap, crew, handRow, costCap, costRow, go);
  sheetB.append(form);
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* arrivals / departures / turnarounds for one day */
function openOps(kind, d){
  const ops = dayOps(d);
  const list = ops[kind];
  const TITLE = {arrivals:"Arriving", departures:"Leaving", turnovers:"Same-day turnaround"};
  const BLANK = {
    arrivals:"Nobody is checking in.",
    departures:"Nobody is checking out.",
    turnovers:"No room has a check-out and a check-in on the same day — no rush cleans."
  };
  sheetWipe();

  const t = el("div");
  t.innerHTML = `<div class="n">${TITLE[kind]}</div><div class="m">${fmtL(d)}${d===0?" · today":""}</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
  sheetH.append(t, x);

  if(kind === "turnovers" && list.length){
    const warn = el("p");
    warn.style.cssText = "margin:16px 20px 0;font-size:13px;line-height:1.55;color:var(--txt-2)";
    warn.innerHTML = `<b style="color:var(--now)">${list.length} room${list.length>1?"s":""} must be cleaned between a check-out and a check-in on the same day.</b> These are the ones that go wrong.`;
    sheetB.appendChild(warn);
  }

  const card = el("div","card");
  card.style.margin = "16px 20px 0";
  if(!list.length) card.appendChild(el("div","empty", BLANK[kind]));

  list.forEach(item=>{
    const fi = kind === "turnovers" ? item.fi : item.fi;
    const fl = flats[fi];
    const row = el("button","row");
    row.append(el("div","id", fl.id));
    const m = el("div","meta");
    if(kind === "arrivals"){
      m.innerHTML = `<b>${item.guest}</b> · ${item.nights} night${item.nights>1?"s":""}<em>${fl.type} · ${fl.bshort} · out ${fmt(Math.min(item.end,DAYS-1))}</em>`;
      row.append(m, el("span","pill", item.src));
    } else if(kind === "departures"){
      m.innerHTML = `<b>${item.guest}</b> · stayed ${item.nights} night${item.nights>1?"s":""}<em>${fl.type} · ${fl.bshort}</em>`;
      const next = runFrom(fi, d);
      row.append(m, el("span", next ? "pill good" : "pill", next ? `${next} nt open` : "re-let same day"));
    } else {
      m.innerHTML = `<b>${item.out.guest}</b> out → <b>${item.in.guest}</b> in<em>${fl.type} · ${fl.bshort} · ${item.in.nights} night${item.in.nights>1?"s":""}</em>`;
      row.append(m, el("span","pill warn","clean today"));
    }
    row.onclick = ()=>{ haptic(9); openSheet(fi, d); };
    card.appendChild(row);
  });
  sheetB.appendChild(card);

  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0; x.focus();
}

/* ── inventory editor ─────────────────────────────────────────────────────── */
function openInventory(editing){
  sheetWipe();

  const t = el("div");
  t.innerHTML = `<div class="n">Inventory</div><div class="m">${NF} flats · ${buildingsOf().length} buildings</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close");
  x.onclick = ()=>{ closeSheet(); refreshScreen(); };
  sheetH.append(t, x);

  buildingsOf().forEach(b=>{
    const mine = flats.map((f,i)=>({f,i})).filter(o=>o.f.code===b.code);
    const head = el("div","invHead");
    head.append(el("b",null,b.name));
    const add = el("button","invAdd","+ Add flat");
    add.onclick = ()=>{ haptic(9); openInventory({mode:"new", code:b.code}); };
    head.appendChild(add);
    sheetB.appendChild(head);

    const card = el("div","card"); card.style.margin = "0 20px";
    if(editing && editing.mode==="new" && editing.code===b.code) card.appendChild(invForm(null, b));
    mine.forEach(o=>{
      if(editing && editing.mode==="edit" && editing.id===o.f.id){
        card.appendChild(invForm(o.f, b));
        return;
      }
      const bookings = resv.filter(r=>r.fi===o.i).length;
      const row = el("button","invRow");
      row.append(el("div","fid",o.f.id));
      row.append(el("div","fty",o.f.type));
      row.append(el("div","fbk", bookings ? `${bookings} bkg` : "—"));
      row.onclick = ()=>{ haptic(9); openInventory({mode:"edit", id:o.f.id}); };
      card.appendChild(row);
    });
    sheetB.appendChild(card);
  });

  const bh = el("div","invHead");
  bh.append(el("b",null,"Add a building"));
  const bAdd = el("button","invAdd","+ New");
  bAdd.onclick = ()=>{ haptic(9); openInventory({mode:"building"}); };
  bh.appendChild(bAdd);
  sheetB.appendChild(bh);
  if(editing && editing.mode==="building"){
    const card = el("div","card"); card.style.margin="0 20px";
    card.appendChild(buildingForm());
    sheetB.appendChild(card);
  }

  const foot = el("p");
  foot.style.cssText = "margin:18px 20px 10px;font-size:12px;line-height:1.55;color:var(--txt-3)";
  foot.textContent = "Removing a flat also removes its bookings, its payments and anything logged against it.";
  sheetB.appendChild(foot);

  /* ── handing the app over ───────────────────────────────────────────────────
     The flats are real; the bookings, guests, money and faults shipped with the
     app are invented so it has something to show. This is the one button that
     separates the two — it empties everything that was made up and leaves the
     inventory standing, which is exactly the state you want before giving the
     app to whoever is going to run it. */
  const counts = {b: bookings().length, k: resv.filter(isBlock).length,
                  p: resv.reduce((s,r)=> s + (r.pays ? r.pays.length : 0), 0),
                  i: issues.length};
  const wipe = el("div","dataTools");
  wipe.style.cssText = "padding:0 20px";
  const label = `Delete all ${counts.b} test bookings`;
  const bClear = el("button","copybtn", label);
  let armed = false;
  bClear.onclick = ()=>{
    if(!armed){ armed = true; bClear.classList.add("done");
      bClear.textContent = "Erase everything except the flats?"; haptic(10);
      setTimeout(()=>{ armed=false; bClear.classList.remove("done");
        bClear.textContent = label; }, 3500);
      return; }
    haptic(24);
    clearAll();
    issues.slice().forEach(dropIssue);
    save(); cacheSave();
    openInventory();
    toast("", `<b>Cleared.</b> ${NF} flats kept · ${counts.b} bookings, ${counts.k} blocks, `
            + `${counts.p} payments and ${counts.i} logged faults removed. `
            + `The book is empty and ready for real ones.`, null);
  };
  wipe.appendChild(bClear);
  sheetB.appendChild(wipe);
  const wipeNote = el("p");
  wipeNote.style.cssText = "margin:9px 20px 0;font-size:12px;line-height:1.55;color:var(--txt-3)";
  wipeNote.textContent = "Keeps every flat and building. Removes the invented bookings, guests, "
    + "money and faults — do this once, before handing the app over.";
  sheetB.appendChild(wipeNote);

  sheet.classList.add("on"); scrim.classList.add("on");
  if(!editing) sheetB.scrollTop = 0;
}

function invForm(flat, b){
  const wrap = el("div","invForm");
  const isNew = !flat;
  let type = flat ? flat.type : "2 BHK";

  const r1 = el("div","r");
  const num = el("input");
  num.type = "text"; num.placeholder = `Flat number, e.g. ${b.code}-101`;
  num.value = flat ? flat.id : `${b.code}-`;
  num.setAttribute("aria-label","Flat number");
  const rate = el("input");
  rate.type = "number"; rate.inputMode = "numeric"; rate.placeholder = "Rate";
  rate.value = flat ? flat.rate : 3000;
  rate.style.maxWidth = "104px";
  rate.setAttribute("aria-label","Nightly rate");
  r1.append(num, rate);

  const tys = el("div","tyRow");
  UNIT_TYPES.forEach(tv=>{
    const b2 = el("button",null,tv);
    b2.setAttribute("aria-pressed", tv===type);
    b2.onclick = ()=>{ type = tv; haptic(8);
      [...tys.children].forEach(c=>c.setAttribute("aria-pressed", c.textContent===type)); };
    tys.appendChild(b2);
  });

  const acts = el("div","invActs");
  const saveBtn = el("button","invSave", isNew ? "Add flat" : "Save");
  const warn = el("div","invWarn");
  saveBtn.onclick = ()=>{
    const id = num.value.trim().toUpperCase().replace(/\s+/g,"");
    if(!id || id === `${b.code}-`){ warn.textContent = "Give the flat a number."; return; }
    if(id !== (flat && flat.id) && flatIndex[id] !== undefined){
      warn.textContent = `${id} already exists.`; return;
    }
    const digits = id.replace(/\D/g,"");
    const floor = digits.length >= 2 ? Math.max(1, +digits[0]) : 1;
    const next = flats.map(f=>({...f}));
    if(isNew){
      next.push({ id, code:b.code, bname:b.name, bshort:b.short, floor,
                  type, rate:+rate.value || 3000, pop:0.6 });
      applyInventory(next);
    } else {
      const k = next.findIndex(f=>f.id === flat.id);
      next[k] = {...next[k], id, floor, type, rate:+rate.value || next[k].rate};
      applyInventory(next, id !== flat.id ? {[flat.id]: id} : null);
    }
    haptic(16); openInventory();
  };

  const del = el("button","invDel","Remove");
  let armed = false;
  if(!isNew){
    const count = resv.filter(r=>flats[r.fi] && flats[r.fi].id===flat.id).length;
    del.onclick = ()=>{
      if(!armed){
        armed = true; del.classList.add("arm");
        del.textContent = count ? `Remove + ${count} bkg?` : "Remove?";
        haptic(10);
        setTimeout(()=>{ armed=false; del.classList.remove("arm"); del.textContent="Remove"; }, 3000);
        return;
      }
      haptic(24);
      applyInventory(flats.filter(f=>f.id!==flat.id).map(f=>({...f})));
      openInventory();
    };
    acts.append(saveBtn, del);
  } else {
    const cancel = el("button","invDel","Cancel");
    cancel.onclick = ()=>{ haptic(8); openInventory(); };
    acts.append(saveBtn, cancel);
  }

  wrap.append(r1, tys, acts, warn);
  setTimeout(()=>num.focus(), 60);
  return wrap;
}

function buildingForm(){

  const r1 = el("div","r");

  name.setAttribute("aria-label","Building name");

  code.setAttribute("aria-label","Building code");

  const warn = el("div","invWarn");
  const acts = el("div","invActs");
  const saveBtn = el("button","invSave","Add building");
  saveBtn.onclick = ()=>{
    const n = name.value.trim();
    const c = code.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!n || !c){ warn.textContent = "Name and a short code are both needed."; return; }
    if(buildingsOf().some(b=>b.code===c)){ warn.textContent = `Code ${c} is already used.`; return; }
    const next = flats.map(f=>({...f}));

  acts.append(saveBtn, cancel);
  wrap.append(r1, acts, warn);
  setTimeout(()=>name.focus(), 60);
  return wrap;
}
