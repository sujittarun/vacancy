  }

  /* 8 — fragmentation */
  {
    const f = fragmentation();
    const {c,b} = card("How broken up the gaps are", "empty stretches between bookings");
    const head = el("div","headline");
    head.append(el("b",null, String(f.orphans)));
    head.append(el("s",null, `single orphan nights, out of ${f.runs} empty stretches`));
    b.appendChild(head);
    b.appendChild(hbars([
      {k:"Orphan (1 night)", pct: f.orphans/Math.max(1,f.runs), right:String(f.orphans)},
      {k:"Sellable stretches", pct:(f.runs-f.orphans)/Math.max(1,f.runs), right:String(f.runs-f.orphans)},
    ], "Orphan (1 night)"));
    said(c, `Your empty time averages <b>${f.avg.toFixed(1)} nights</b> per stretch. Ten scattered single nights are far harder to fill than one ten-night hole, so this — not the vacancy count — is the honest measure of how sellable your empty time actually is.`);
  }

  s.appendChild(deck);

  /* reveal each section as it arrives; bars grow with it */
  if(window.IntersectionObserver && !calm){
    const cards = [...deck.children];
    cards.forEach(c=> c.classList.add("pending"));
    // root is the scrolling panel, not the viewport — these live inside an
    // absolutely positioned scroller
    const io = new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.remove("pending"); io.unobserve(e.target); }
    }), {root:s, threshold:.12});
    cards.forEach(c=> io.observe(c));
    requestAnimationFrame(()=> cards[0] && cards[0].classList.remove("pending"));
    // belt and braces: nothing stays hidden even if the observer never fires
    setTimeout(()=>cards.forEach(c=>c.classList.remove("pending")), 2500);
  }

  const lead = leadTimes();
  const foot = el("p");
  foot.style.cssText = "margin:20px 2px 0;font-size:12px;line-height:1.6;color:var(--txt-3)";
  foot.innerHTML = lead
    ? `Every booking you enter records the day you took it, so lead time is now measurable: across ${lead.n} of your own bookings the typical one arrives <b style="color:var(--txt-2)">${lead.median} days</b> before check-in.`
    : `<b style="color:var(--txt-2)">There is no history here yet.</b> Everything above reads the forward book — today through ${fmtL(DAYS-1)} — because that is all the app truly knows. Each booking you enter from now records the day you took it, so lead time and week-on-week pace become real once it has been used for a while. Nothing on these cards is estimated or borrowed from elsewhere.`;
  s.appendChild(foot);
}

/* ═══════════════ SCREEN 3 — ASK ═══════════════ */
const SUGGEST = ["anything free tonight?","3 nights from friday","this weekend",
                 "16 sep","15-18","3 bhk next week","2 bhk banjara","in 3 days"];
let lastQuery = "anything free tonight?";

/* ══════════════════════════════════════════════════════════════════════════
   Query understanding

   Written as a small grammar rather than a pile of special cases:

       query := filters? duration? ( date ( "-" date )? )?

   Each part is consumed and its tokens REMOVED before the next part runs, so
   a number can never be read as two things at once. That single rule is what
   kept breaking before: "3 nights from friday" read the 3 as a day of the
   month, "2 bhk" read the 2 as a date, "16 sep" ignored the month entirely.

   Anything left unrecognised is simply skipped, so filler words are harmless.
   ══════════════════════════════════════════════════════════════════════════ */

const MONTHS = {jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,
  jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,
  oct:9,october:9,nov:10,november:10,dec:11,december:11};
const MONTH_ABBR = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const WEEKDAYS = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,
  thu:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const NUMWORDS = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
  ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14};
const NIGHT_UNIT = /^(n|nt|nts|night|nights)$/;
const WEEK_UNIT  = /^(w|wk|wks|week|weeks)$/;

const ord = d => (d%10===1&&d%100!==11)?"st":(d%10===2&&d%100!==12)?"nd":(d%10===3&&d%100!==13)?"rd":"th";
const nextWeekend = ()=>{ let a=0; while(a<DAYS && dateAt(a).getDay()!==5) a++; return {a, b:Math.min(a+2,DAYS)}; };
const numOf = t => /^\d{1,2}$/.test(t) ? +t : (NUMWORDS[t] ?? null);

/* Offset of the next calendar date matching dom (and month, if given) that is
   at least `minOff` days out. Rolls into next year, rejects 31 Feb, and is not
   capped by the 63-day horizon — the caller decides what to do about that. */
function absoluteOffset(dom, monthIdx, minOff){
  minOff = minOff || 0;
  const m0 = today.getMonth(), y0 = today.getFullYear();
  for(let k = 0; k < 18; k++){
    const m = (m0 + k) % 12, y = y0 + Math.floor((m0 + k) / 12);
    if(monthIdx !== null && m !== monthIdx) continue;
    const dt = new Date(y, m, dom); dt.setHours(0,0,0,0);
    if(dt.getMonth() !== m) continue;                 // e.g. 31 Feb
    const off = Math.round((dt - today) / 86400000);
    if(off >= minOff) return off;
  }
  return null;
}
function nextDow(dow, minOff){
  for(let d = minOff || 0; d < minOff + 14; d++) if(dateAt(d).getDay() === dow) return d;
  return 0;
}

function normalize(q){
  return q.toLowerCase()
    .replace(/(\d+)\s*(?:st|nd|rd|th)\b/g, "$1")                                   // 15th → 15
    .replace(/\b(\d{1,2})\s*[/.]\s*(\d{1,2})(?:\s*[/.]\s*\d{2,4})?\b/g,            // 16/9 → 16 sep
             (_,d,mo)=> `${d} ${MONTH_ABBR[(Math.min(12,Math.max(1,+mo)) - 1)]}`)
    .replace(/\b(?:to|till|until|thru|through|upto)\b/g, "-")                      // ranges → one token
    .replace(/[–—]/g, "-")
    .replace(/(\d)\s*-\s*/g, "$1 - ")
    .replace(/[^a-z0-9 \-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* Reads one date expression starting at token i. Returns null if there isn't one. */
function readDate(tk, i, minOff){
  const t = tk[i]; if(!t) return null;
  // a day of the month must be written in digits. "a"/"one" are counts, never dates —
  // otherwise "have a 3 bhk free from 16 sep" reads the "a" as the 1st.
  const digit = t => /^\d{1,2}$/.test(t) ? +t : null;
  const num = digit(t);
  const mon = MONTHS[t] ?? null;

  if(t === "today" || t === "tonight" || t === "now")
    return {d:0, label:"tonight", next:i+1};
  if(t === "tomorrow")
    return {d:1, label:"tomorrow", next:i+1};
  if(t === "day" && tk[i+1] === "after" && tk[i+2] === "tomorrow")
    return {d:2, label:"the day after tomorrow", next:i+3};

  if(t === "in" && numOf(tk[i+1]) !== null && /^days?$/.test(tk[i+2] || ""))
    return {d:numOf(tk[i+1]), label:`in ${numOf(tk[i+1])} days`, next:i+3};

  if((t === "this" || t === "next") && tk[i+1] === "weekend"){
    const w = nextWeekend();
    return {d: w.a + (t==="next" ? 7 : 0), label:`${t} weekend`, defaultNights:2, next:i+2};
  }
  if(t === "weekend"){
    const w = nextWeekend();
    return {d:w.a, label:"this weekend", defaultNights:2, next:i+1};
  }
  if((t === "this" || t === "next") && /^weeks?$/.test(tk[i+1] || "")){
    const mon1 = nextDow(1, 1);
    return {d: t==="next" ? (mon1 || 7) : 0, label:`${t} week`, defaultNights:7, next:i+2};
  }
  if((t === "this" || t === "next") && /^months?$/.test(tk[i+1] || "")){
    const dt = new Date(today.getFullYear(), today.getMonth() + (t==="next"?1:0), 1);
    dt.setHours(0,0,0,0);
    const off = Math.max(0, Math.round((dt - today)/86400000));
    return {d:off, label:`${t} month`, next:i+2};
  }
  if(t === "next" && WEEKDAYS[tk[i+1]] !== undefined){
    let d = nextDow(WEEKDAYS[tk[i+1]], minOff || 0);
    if(d < 7) d += 7;                                    // "next friday" is the one after this one
    return {d, label:`next ${tk[i+1]}`, next:i+2};
  }
  if(WEEKDAYS[t] !== undefined)
    return {d:nextDow(WEEKDAYS[t], minOff || 0), label:t, next:i+1};

  // 16 sep  |  sep 16  |  sep (→ the 1st)  |  16
  if(num !== null && MONTHS[tk[i+1]] !== undefined){
    const M = MONTHS[tk[i+1]];
    return {d:absoluteOffset(num, M, minOff), dom:num, month:M,
            label:`${num}${ord(num)} ${tk[i+1]}`, next:i+2};
  }
  if(mon !== null && digit(tk[i+1] || "") !== null){
    const D = digit(tk[i+1]);
    return {d:absoluteOffset(D, mon, minOff), dom:D, month:mon,
            label:`${D}${ord(D)} ${t}`, next:i+2};
  }
  if(mon !== null)
    return {d:absoluteOffset(1, mon, minOff), dom:1, month:mon, label:t, next:i+1};
  if(num !== null && num >= 1 && num <= 31)
    return {d:absoluteOffset(num, null, minOff), dom:num, month:null,
            label:`the ${num}${ord(num)}`, next:i+1};

  return null;
}

function parseQuery(q){
  const tk = normalize(q).split(" ").filter(Boolean);

  /* 1. filters — removed first so "2 bhk" never looks like the 2nd */
  let type = null, bldg = null;
  for(let i = tk.length - 1; i >= 0; i--){
    const t = tk[i], two = (numOf(t) !== null && /^bhk$/.test(tk[i+1] || ""));
    let m = null;
    if(two) m = numOf(t);
    else { const g = t.match(/^(\d)bhk$/); if(g) m = +g[1]; }
    if(m !== null){ type = `${m} BHK`; tk.splice(i, two ? 2 : 1); }
    else if(t === "studio"){ type = "Studio"; tk.splice(i,1); }
  }
  BUILDINGS.forEach(b=>{
    const words = b.name.toLowerCase().split(" ");
    for(let i = 0; i < tk.length; i++){
      if(tk[i] === words[0] || tk[i] === b.code.toLowerCase()){
        bldg = b.code;
        tk.splice(i, (words[1] && tk[i+1] === words[1]) ? 2 : 1);
        return;
      }
    }
  });

  /* 2. duration — removed next so "3 nights" never looks like the 3rd */
  let nights = null;
  for(let i = 0; i < tk.length; i++){
    const g = tk[i].match(/^(\d{1,2})(n|nt|nts|night|nights|w|wk|wks|week|weeks)$/);
    if(g){ nights = +g[1] * (/^w/.test(g[2]) ? 7 : 1); tk.splice(i,1); break; }
    const num = numOf(tk[i]);
    if(num === null) continue;
    if(NIGHT_UNIT.test(tk[i+1] || "")){ nights = num;     tk.splice(i,2); break; }
    if(WEEK_UNIT .test(tk[i+1] || "")){ nights = num * 7; tk.splice(i,2); break; }
  }
  if(nights === null){
    const f = tk.indexOf("fortnight");
    if(f >= 0){ nights = 14; tk.splice(f,1); }
  }

  /* 3. dates */
  let first = null;
  for(let i = 0; i < tk.length && !first; i++){
    const r = readDate(tk, i, 0);
    if(r && r.d !== null) first = r;
  }
  let second = null;
  if(first){
    let j = first.next;
    if(tk[j] === "-") j++;
    if(j < tk.length){
      const r = readDate(tk, j, first.d + 1);
      // "20-20" is one night, not the 20th of next month
      const sameBareDay = r && first.dom !== undefined && r.dom === first.dom
                            && first.month == null && r.month == null;
      if(r && r.d !== null && r.d > first.d && !sameBareDay) second = r;
    }
  }

  let start = first ? first.d : 0;
  let n = nights;
  if(second) n = second.d - first.d;                       // an explicit range wins
  if(n === null) n = (first && first.defaultNights) || 1;

  const beyond = start >= DAYS;                            // asked about a date we can't see
  const label  = !first ? "tonight"
               : second ? `${first.label} to ${second.label}`
               : first.label;

  start = Math.max(0, Math.min(DAYS - 1, start));
  n = Math.max(1, Math.min(n, DAYS - start));
  return {start, n, how:label, type, bldg, beyond};
}

function renderAsk(focus){
  const s = document.getElementById("scr-ask");
  s.textContent = "";

  const top = el("div","stack");
  const field = el("div","field");
  const input = el("input");
  input.type="text"; input.value = lastQuery; input.autocomplete="off";
  input.placeholder = "anything free this weekend?";
  input.setAttribute("enterkeyhint","search");
  input.setAttribute("aria-label","Ask about availability in plain words");
  const go = el("button","go","Ask");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let mic = null, rec = null;
  if(SR){
    mic = el("button","mic");
    mic.setAttribute("aria-label","Speak the question");
    mic.innerHTML = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="7.4" y="2.2" width="5.2" height="9.4" rx="2.6"/><path d="M4.4 9.2a5.6 5.6 0 0 0 11.2 0M10 14.8v3"/></svg>';
    mic.onclick = ()=>{
      if(rec){ rec.stop(); return; }
      try{
        rec = new SR();
        rec.lang = navigator.language || "en-US";
        rec.interimResults = true;
        rec.continuous = false;
        rec.onresult = e=>{
          const txt = [...e.results].map(r=>r[0].transcript).join("");
          input.value = txt;
          if(e.results[e.results.length-1].isFinal){ run(); }
        };
        rec.onerror = ev=>{
          field.classList.remove("hear"); rec = null;
          input.placeholder = ev.error==="not-allowed"
            ? "Microphone blocked here — type instead" : "Didn't catch that — type instead";
        };
        rec.onend = ()=>{ field.classList.remove("hear"); rec = null; };
        rec.start(); field.classList.add("hear"); haptic(14);
      }catch(err){ field.classList.remove("hear"); rec = null; }
    };
  }
  field.append(input);
  if(mic) field.append(mic);
  field.append(go);
  const chips = el("div","chips");
  SUGGEST.forEach(q=>{ const b=el("button",null,q);
    b.onclick=()=>{ input.value=q; run(); }; chips.appendChild(b); });
  top.append(field, chips);

  const ansWrap = el("div","stack gap-m");
  const listWrap = el("div","stack gap-s");
  s.append(top, ansWrap, listWrap);

  go.onclick = run;
  input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); input.blur(); run(); }});
  if(focus) setTimeout(()=>input.focus(),120);
  run();

  function run(){
    haptic(10);
    lastQuery = input.value.trim() || "anything free tonight?";
    const p = parseQuery(lastQuery);
    const a = p.start, b = p.start + p.n;
    let pool = flats.map((f,i)=>({f,i}));
    if(p.type) pool = pool.filter(x=>x.f.type===p.type);
    if(p.bldg) pool = pool.filter(x=>x.f.code===p.bldg);
    const free = pool.filter(x=>freeRange(x.i,a,b));
    const when = p.n===1 ? fmtL(a) : `${fmtL(a)} → ${fmtL(b)}`;
    const nightsTxt = p.n===1 ? "that night" : p.n===2 ? "both nights" : `all ${p.n} nights`;

    ansWrap.textContent = "";
    const ans = el("p","answer");
    ans.innerHTML = p.beyond
      ? `That's past <b class="n">${fmtL(DAYS-1)}</b> — the furthest this book goes. Showing ${when} instead.`
      : free.length
      ? `Yes — <b class="y">${free.length} room${free.length>1?"s":""}</b> free for ${nightsTxt}, ${when}.`
      : `<b class="n">Nothing</b> covers ${nightsTxt}, ${when}.`;
    const heard = el("div","heard");
    heard.append(el("span","pill now", p.how));
    heard.append(el("span","pill", `${p.n} night${p.n>1?"s":""}`));
    if(p.type) heard.append(el("span","pill", p.type));
    if(p.bldg) heard.append(el("span","pill", BUILDINGS.find(z=>z.code===p.bldg).name));
    ansWrap.append(ans, heard);

    if(free.length){
      const bar = el("div","copybar");
      const cp = el("button","copybtn");
      cp.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6.6" y="6.6" width="10.4" height="10.4" rx="2.4"/><path d="M13.4 3.4H4.6a1.2 1.2 0 0 0-1.2 1.2v8.8"/></svg><span>Copy for WhatsApp</span>';
      cp.onclick = async ()=>{
        const lines = free.map(x=>`${x.f.id} (${x.f.type}, ${x.f.bshort})`).join("\n");
        const text = p.n===1
          ? `Free on ${fmtL(a)} — ${free.length} room${free.length>1?"s":""}:\n${lines}`
          : `Free ${fmtL(a)} → ${fmtL(b)} (${p.n} nights) — ${free.length} room${free.length>1?"s":""}:\n${lines}`;
        const ok = await copyText(text);
        haptic(12);
        cp.querySelector("span").textContent = ok ? "Copied" : "Press and hold to copy";
        cp.classList.toggle("done", ok);
        setTimeout(()=>{ cp.querySelector("span").textContent = "Copy for WhatsApp";
                         cp.classList.remove("done"); }, 1800);
      };
      bar.append(cp, el("span","lbl", `${free.length} room${free.length>1?"s":""} · ${p.n} night${p.n>1?"s":""}`));
      ansWrap.append(bar);
    }

    listWrap.textContent = "";
    const h = el("div","sect");
    const list = el("div","card");
    if(free.length){
      h.append(el("span","lbl","Read these out"), el("span","lbl", `${fmt(a)} → ${fmt(b)}`));
      free.forEach(x=> list.appendChild(roomRow(x.i, a, null)));
    } else {
      /* before offering different dates, see if one room move rescues these dates */
      const moves = roomMoves(a, b, pool);
      if(moves.length){
        const mh = el("div","sect");
        mh.append(el("span","lbl","One move away"),
                  el("span","lbl", `${moves.length} option${moves.length>1?"s":""}`));
        const mcard = el("div","card");
        moves.slice(0,4).forEach(mv=>{
          const from = flats[mv.frees], to = flats[mv.to], B = mv.booking;
          const r = el("button","row move");
          r.append(el("div","id", from.id));
          const m = el("div","meta");
          m.innerHTML = `Move <b>${B.guest}</b> to <b>${to.id}</b>`
            + `<em>${fmt(B.start)}–${fmt(B.end)} · ${to.type}${mv.sameBuilding ? ", same building" : ` at ${to.bshort}`}`
            + `${mv.sameType ? ", same size" : ""} · then ${from.id} is yours</em>`;
          r.append(m, el("span","pill now","frees it"));
          r.onclick = ()=>{ haptic(10); openSheet(mv.frees, a); };
          mcard.appendChild(r);
        });
        listWrap.append(mh, mcard);
      }
      h.append(el("span","lbl","Or move the dates"), el("span","lbl","nearest that work"));
      /* Search the WHOLE horizon, not a window around the asked date. A long
         stay often only fits weeks out, and "try a shorter stay" is a wrong
         answer when the stay is perfectly possible later. */
      const alts = [];
      for(let s2 = 0; s2 <= DAYS - p.n; s2++){
        if(s2 === a) continue;
        const c = pool.filter(x=>freeRange(x.i, s2, s2+p.n)).length;
        if(c) alts.push({d:s2, c, dist:Math.abs(s2-a)});
      }
      alts.sort((x,y)=> x.dist - y.dist);

      if(!alts.length){
        // nowhere fits — say how long the longest stretch actually is
        let best = {n:0, at:-1, fi:-1};
        pool.forEach(({i})=>{
          let d = 0;
          while(d < DAYS){
            if(occ[i][d]){ d++; continue; }
            let run = 0; while(d+run < DAYS && !occ[i][d+run]) run++;
            if(run > best.n) best = {n:run, at:d, fi:i};
            d += run;
          }
        });
        const e = el("div","empty");
        e.innerHTML = best.n
          ? `No ${p.n}-night stretch exists anywhere in the next nine weeks. The longest is <b style="color:var(--txt)">${best.n} nights</b> in ${flats[best.fi].id} from ${fmtL(best.at)}.`
          : "Nothing is free anywhere in the next nine weeks.";
        list.appendChild(e);
      }
      alts.slice(0,6).forEach(alt=>{
        const away = alt.d - a;
        const r = el("button","row");
        r.append(el("div","id", (away>0?"+":"−") + Math.abs(away) + "d"));
        const m = el("div","meta");
        m.innerHTML = `Arrive <b>${fmtL(alt.d)}</b> instead`
          + `<em>${alt.c} flat${alt.c>1?"s":""} free for all ${p.n} night${p.n>1?"s":""}</em>`;
        r.append(m, el("span","pill good", `${alt.c} free`));
        r.onclick = ()=>{ haptic(9); goMonth(alt.d); };
        list.appendChild(r);
      });
    }
    listWrap.append(h, list);
  }
}

/* ═══════════════ room sheet ═══════════════ */
const sheet = document.getElementById("sheet");
const scrim = document.getElementById("scrim");
const sheetH = document.getElementById("sheetH");
const sheetB = document.getElementById("sheetB");

function openSheet(fi, day){
  const fl = flats[fi];
  sheetH.textContent = ""; sheetB.textContent = "";

  const t = el("div");
  t.innerHTML = `<div class="n">${fl.id}</div><div class="m">${fl.type} · ${fl.bname} · floor ${fl.floor}</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close");
  x.onclick = closeSheet;
  sheetH.append(t, x);

  const strip = el("div","strip");
  for(let d=0;d<DAYS;d++){ const i=el("i"); if(!occ[fi][d]) i.className="f"; if(d===0) i.classList.add("td"); strip.appendChild(i); }
  const k = el("div","strip-k");
  k.append(el("span","lbl","Today"), el("span","lbl", `${occPct(fi)}% booked`), el("span","lbl","+9 weeks"));
  sheetB.append(strip, k);

  /* take a booking for the dates currently selected on the Rooms screen */
  const bDay = Math.min(pickedNight, DAYS-1), bN = stayNights;
  const span = bN === 1 ? fmtL(bDay) : `${fmt(bDay)} → ${fmt(bDay+bN)}`;
  if(freeRange(fi, bDay, bDay+bN)){
    const form = el("div","book");
    const who = el("input");
    who.type = "text"; who.placeholder = "Guest name"; who.autocomplete = "off";
    who.setAttribute("aria-label", `Guest name for ${fl.id}, ${span}`);
    const btn = el("button","bookbtn", `Book ${bN}n`);
    const take = ()=>{
      if(addBooking(fi, bDay, bN, who.value.trim(), "Direct")){
        haptic(18); closeSheet(); refreshScreen();
      } else {                                   // someone took it in another tab
        haptic(30);
        btn.textContent = "Just taken";
        setTimeout(()=>{ closeSheet(); refreshScreen(); }, 900);
      }
    };
    btn.onclick = take;
    who.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); who.blur(); take(); }});
    form.append(who, btn);
    sheetB.appendChild(form);
    const hint = el("div","lbl");
    hint.style.cssText = "margin:8px 20px 0";
    hint.textContent = `Books ${span} · change the dates on the Rooms tab`;
    sheetB.appendChild(hint);

    /* take the flat out of service for the same dates */
    const blockBtn = el("button","blockbtn", `Block these nights instead`);
    blockBtn.onclick = ()=>{
      haptic(10);
      blockBtn.remove();
      const form = el("div","invForm"); form.style.margin = "10px 20px 0";
      const chips = el("div","tyRow");
      let reason = BLOCK_REASONS[0];
      BLOCK_REASONS.forEach(rz=>{
        const b2 = el("button",null,rz);
        b2.setAttribute("aria-pressed", rz===reason);
        b2.onclick = ()=>{ reason = rz; haptic(8);
          [...chips.children].forEach(c=>c.setAttribute("aria-pressed", c.textContent===reason)); };
        chips.appendChild(b2);
      });
      const noteRow = el("div","r");
      const note = el("input");
      note.type = "text"; note.placeholder = "Note — e.g. technician booked";
      noteRow.appendChild(note);
      const acts = el("div","invActs");
      const go2 = el("button","invSave", `Block ${bN} night${bN>1?"s":""}`);
      go2.onclick = ()=>{
        if(addBlock(fi, bDay, bN, reason, note.value)){
          haptic(18); closeSheet(); refreshScreen();
        }
      };
      const cancel = el("button","invDel","Cancel");
      cancel.onclick = ()=>{ haptic(8); openSheet(fi, day); };
      acts.append(go2, cancel);
      form.append(chips, noteRow, acts);
      const hintEl = el("div","lbl");
      hintEl.style.cssText = "margin:8px 20px 0";
      hintEl.textContent = `Out of service ${span} — it comes back on sale the morning after.`;
      sheetB.insertBefore(form, hint.nextSibling);
      sheetB.insertBefore(hintEl, form.nextSibling);
      setTimeout(()=>note.focus(), 60);
    };
    sheetB.appendChild(blockBtn);
  } else {
    const blocker = resv.find(r => r.fi===fi && r.start < bDay+bN && r.end > bDay);
    const b = el("div","blocked");
    b.innerHTML = blocker
      ? `Can't take <b>${span}</b> — <b>${blocker.guest}</b> is in until ${fmt(Math.min(blocker.end,DAYS-1))}.`
      : `Not available for <b>${span}</b>.`;
    sheetB.appendChild(b);
  }

  const s1 = el("div","sheet-s");
  // the rate is whatever was set in Inventory — no longer a number this app invented
  s1.append(el("span","lbl","Upcoming bookings"),
            el("span","lbl", `₹${fl.rate.toLocaleString("en-IN")} / night`));
  sheetB.appendChild(s1);
  const bl = el("div","card"); bl.style.margin="0 20px";
  const mine = resv.filter(r=>r.fi===fi && r.end>0 && r.start<DAYS).sort((a,b)=>a.start-b.start);
  if(!mine.length) bl.appendChild(el("div","empty","No bookings in the next nine weeks — completely open."));
  mine.slice(0,14).forEach(r=>{
    const row = el("div","row");
    row.append(el("div","id", Math.max(r.start,0)===0 ? "Now" : fmt(Math.max(r.start,0))));
    const m = el("div","meta");
    m.innerHTML = `<b>${r.guest}</b> · ${r.src}<em>${fmt(Math.max(r.start,0))} → ${fmt(Math.min(r.end,DAYS-1))}</em>`;
    const end = el("div","rowend");
    end.appendChild(el("span","pill", `${r.nights}n`));
    const x = el("button","rowx","✕");
    x.setAttribute("aria-label", `Cancel ${r.guest}'s booking in ${fl.id}`);
    let armed = false, t = null;
    x.onclick = ()=>{
      if(!armed){
        armed = true; x.classList.add("arm"); x.textContent = "Cancel?"; haptic(10);
        t = setTimeout(()=>{ armed=false; x.classList.remove("arm"); x.textContent="✕"; }, 3000);
        return;
      }
      clearTimeout(t); haptic(20);
      cancelBooking(r); closeSheet(); refreshScreen();
    };
    end.appendChild(x);
    row.append(m, end);
    bl.appendChild(row);
  });
  sheetB.appendChild(bl);

  const s2 = el("div","sheet-s");
  s2.append(el("span","lbl","Open stretches"), el("span","lbl","sellable"));
  sheetB.appendChild(s2);
  const gl = el("div","card"); gl.style.margin="0 20px";
  let d=0, any=false;
  while(d<DAYS){
    if(occ[fi][d]){ d++; continue; }
    let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++;
    const row = el("div","row"); any=true;
    row.append(el("div","id", `${n}n`));
    const m = el("div","meta");
    m.innerHTML = `${fmtL(d)}<em>through ${fmtL(Math.min(d+n,DAYS-1))}</em>`;
    row.append(m, el("span", n===1 ? "pill warn" : "pill good", n===1 ? "orphan night" : "open"));
    gl.appendChild(row);
    d += n;
  }
  if(!any) gl.appendChild(el("div","empty","Solidly booked for the whole horizon."));
  sheetB.appendChild(gl);

  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
  x.focus();
}
/* arrivals / departures / turnarounds for one day */
function openOps(kind, d){
  const ops = dayOps(d);
  const list = ops[kind];
  const TITLE = {arrivals:"Arriving", departures:"Leaving", turnovers:"Same-day turnaround"};
  const BLANK = {
    arrivals:"Nobody is checking in.",
    departures:"Nobody is checking out.",
    turnovers:"No room has a check-out and a check-in on the same day — no rush cleans."
  };
  sheetH.textContent = ""; sheetB.textContent = "";

  const t = el("div");
  t.innerHTML = `<div class="n">${TITLE[kind]}</div><div class="m">${fmtL(d)}${d===0?" · today":""}</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
  sheetH.append(t, x);

  if(kind === "turnovers" && list.length){
    const warn = el("p");
    warn.style.cssText = "margin:16px 20px 0;font-size:13px;line-height:1.55;color:var(--txt-2)";
    warn.innerHTML = `<b style="color:var(--now)">${list.length} room${list.length>1?"s":""} must be cleaned between a check-out and a check-in on the same day.</b> These are the ones that go wrong.`;
    sheetB.appendChild(warn);
  }

  const card = el("div","card");
  card.style.margin = "16px 20px 0";
  if(!list.length) card.appendChild(el("div","empty", BLANK[kind]));

  list.forEach(item=>{
    const fi = kind === "turnovers" ? item.fi : item.fi;
    const fl = flats[fi];
    const row = el("button","row");
    row.append(el("div","id", fl.id));
    const m = el("div","meta");
    if(kind === "arrivals"){
      m.innerHTML = `<b>${item.guest}</b> · ${item.nights} night${item.nights>1?"s":""}<em>${fl.type} · ${fl.bshort} · out ${fmt(Math.min(item.end,DAYS-1))}</em>`;
      row.append(m, el("span","pill", item.src));
    } else if(kind === "departures"){
      m.innerHTML = `<b>${item.guest}</b> · stayed ${item.nights} night${item.nights>1?"s":""}<em>${fl.type} · ${fl.bshort}</em>`;
      const next = runFrom(fi, d);
      row.append(m, el("span", next ? "pill good" : "pill", next ? `${next} nt open` : "re-let same day"));
    } else {
      m.innerHTML = `<b>${item.out.guest}</b> out → <b>${item.in.guest}</b> in<em>${fl.type} · ${fl.bshort} · ${item.in.nights} night${item.in.nights>1?"s":""}</em>`;
      row.append(m, el("span","pill warn","clean today"));
    }
    row.onclick = ()=>{ haptic(9); openSheet(fi, d); };
    card.appendChild(row);
  });
  sheetB.appendChild(card);

  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0; x.focus();
}

/* ── inventory editor ─────────────────────────────────────────────────────── */
function openInventory(editing){
  sheetH.textContent = ""; sheetB.textContent = "";

  const t = el("div");
  t.innerHTML = `<div class="n">Inventory</div><div class="m">${NF} flats · ${buildingsOf().length} buildings</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close");
  x.onclick = ()=>{ closeSheet(); refreshScreen(); };
  sheetH.append(t, x);

  buildingsOf().forEach(b=>{
    const mine = flats.map((f,i)=>({f,i})).filter(o=>o.f.code===b.code);
    const head = el("div","invHead");
    head.append(el("b",null,b.name));
    const add = el("button","invAdd","+ Add flat");
    add.onclick = ()=>{ haptic(9); openInventory({mode:"new", code:b.code}); };
    head.appendChild(add);
    sheetB.appendChild(head);

    const card = el("div","card"); card.style.margin = "0 20px";
    if(editing && editing.mode==="new" && editing.code===b.code) card.appendChild(invForm(null, b));
    mine.forEach(o=>{
      if(editing && editing.mode==="edit" && editing.id===o.f.id){
        card.appendChild(invForm(o.f, b));
        return;
      }
      const bookings = resv.filter(r=>r.fi===o.i).length;
      const row = el("button","invRow");
      row.append(el("div","fid",o.f.id));
      row.append(el("div","fty",o.f.type));
      row.append(el("div","fbk", bookings ? `${bookings} bkg` : "—"));
      row.onclick = ()=>{ haptic(9); openInventory({mode:"edit", id:o.f.id}); };
      card.appendChild(row);
    });
    sheetB.appendChild(card);
  });

  const bh = el("div","invHead");
  bh.append(el("b",null,"Add a building"));
  const bAdd = el("button","invAdd","+ New");
  bAdd.onclick = ()=>{ haptic(9); openInventory({mode:"building"}); };
  bh.appendChild(bAdd);
  sheetB.appendChild(bh);
  if(editing && editing.mode==="building"){
    const card = el("div","card"); card.style.margin="0 20px";
    card.appendChild(buildingForm());
    sheetB.appendChild(card);
  }

  const foot = el("p");
  foot.style.cssText = "margin:18px 20px 10px;font-size:12px;line-height:1.55;color:var(--txt-3)";
  foot.textContent = "Flats and bookings are saved on this device. Removing a flat also removes its bookings.";
  sheetB.appendChild(foot);

  /* clearing the sample bookings has to live somewhere — this is the data screen */
  const wipe = el("div","dataTools");
  wipe.style.cssText = "padding:0 20px";
  const bClear = el("button","copybtn", `Clear all ${resv.length} bookings`);
  let armed = false;
  bClear.onclick = ()=>{
    if(!armed){ armed = true; bClear.classList.add("done");
      bClear.textContent = "Erase every booking?"; haptic(10);
      setTimeout(()=>{ armed=false; bClear.classList.remove("done");
        bClear.textContent = `Clear all ${resv.length} bookings`; }, 3500);
      return; }
    haptic(24); clearAll(); openInventory();
  };
  wipe.appendChild(bClear);
  sheetB.appendChild(wipe);

  sheet.classList.add("on"); scrim.classList.add("on");
  if(!editing) sheetB.scrollTop = 0;
}

function invForm(flat, b){
  const wrap = el("div","invForm");
  const isNew = !flat;
  let type = flat ? flat.type : "2 BHK";

  const r1 = el("div","r");
  const num = el("input");
  num.type = "text"; num.placeholder = `Flat number, e.g. ${b.code}-101`;
  num.value = flat ? flat.id : `${b.code}-`;
  num.setAttribute("aria-label","Flat number");
  const rate = el("input");
  rate.type = "number"; rate.inputMode = "numeric"; rate.placeholder = "Rate";
  rate.value = flat ? flat.rate : 3000;
  rate.style.maxWidth = "104px";
  rate.setAttribute("aria-label","Nightly rate");
  r1.append(num, rate);

  const tys = el("div","tyRow");
  UNIT_TYPES.forEach(tv=>{
    const b2 = el("button",null,tv);
    b2.setAttribute("aria-pressed", tv===type);
    b2.onclick = ()=>{ type = tv; haptic(8);
      [...tys.children].forEach(c=>c.setAttribute("aria-pressed", c.textContent===type)); };
    tys.appendChild(b2);
  });

  const acts = el("div","invActs");
  const saveBtn = el("button","invSave", isNew ? "Add flat" : "Save");
  const warn = el("div","invWarn");
  saveBtn.onclick = ()=>{
    const id = num.value.trim().toUpperCase().replace(/\s+/g,"");
    if(!id || id === `${b.code}-`){ warn.textContent = "Give the flat a number."; return; }
    if(id !== (flat && flat.id) && flatIndex[id] !== undefined){
      warn.textContent = `${id} already exists.`; return;
    }
    const digits = id.replace(/\D/g,"");
    const floor = digits.length >= 2 ? Math.max(1, +digits[0]) : 1;
    const next = flats.map(f=>({...f}));
    if(isNew){
      next.push({ id, code:b.code, bname:b.name, bshort:b.short, floor,
                  type, rate:+rate.value || 3000, pop:0.6 });
      applyInventory(next);
    } else {
      const k = next.findIndex(f=>f.id === flat.id);
      next[k] = {...next[k], id, floor, type, rate:+rate.value || next[k].rate};
      applyInventory(next, id !== flat.id ? {[flat.id]: id} : null);
    }
    haptic(16); openInventory();
  };

  const del = el("button","invDel","Remove");
  let armed = false;
  if(!isNew){
    const count = resv.filter(r=>flats[r.fi] && flats[r.fi].id===flat.id).length;
    del.onclick = ()=>{
      if(!armed){
        armed = true; del.classList.add("arm");
        del.textContent = count ? `Remove + ${count} bkg?` : "Remove?";
        haptic(10);
        setTimeout(()=>{ armed=false; del.classList.remove("arm"); del.textContent="Remove"; }, 3000);
        return;
      }
      haptic(24);
      applyInventory(flats.filter(f=>f.id!==flat.id).map(f=>({...f})));
      openInventory();
    };
    acts.append(saveBtn, del);
  } else {
    const cancel = el("button","invDel","Cancel");
    cancel.onclick = ()=>{ haptic(8); openInventory(); };
    acts.append(saveBtn, cancel);
  }

  wrap.append(r1, tys, acts, warn);
  setTimeout(()=>num.focus(), 60);
  return wrap;
}

function buildingForm(){
  const wrap = el("div","invForm");
  const r1 = el("div","r");
  const name = el("input"); name.type="text"; name.placeholder="Building name";
  name.setAttribute("aria-label","Building name");
  const code = el("input"); code.type="text"; code.placeholder="Code"; code.style.maxWidth="92px";
  code.setAttribute("aria-label","Building code");
  r1.append(name, code);
  const warn = el("div","invWarn");
  const acts = el("div","invActs");
  const saveBtn = el("button","invSave","Add building");
  saveBtn.onclick = ()=>{
    const n = name.value.trim();
    const c = code.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!n || !c){ warn.textContent = "Name and a short code are both needed."; return; }
    if(buildingsOf().some(b=>b.code===c)){ warn.textContent = `Code ${c} is already used.`; return; }
    const next = flats.map(f=>({...f}));
    next.push({ id:`${c}-101`, code:c, bname:n, bshort:n, floor:1, type:"2 BHK", rate:3000, pop:0.6 });
    applyInventory(next);
    haptic(16); openInventory();
  };
  const cancel = el("button","invDel","Cancel");
  cancel.onclick = ()=>{ haptic(8); openInventory(); };
  acts.append(saveBtn, cancel);
  wrap.append(r1, acts, warn);
  setTimeout(()=>name.focus(), 60);
  return wrap;
}

/* ── opportunities, one tap deep ─────────────────────────────────────────── */
/* One sheet for every "show me the flats" tap. Rows carry a flat, a line of
   detail and a pill; an optional broadcast button copies a ready message. */
function openFlatList(title, sub, rows, broadcast){
  sheetH.textContent = ""; sheetB.textContent = "";
  const t = el("div");
  t.innerHTML = `<div class="n">${title}</div><div class="m">${sub}</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
  sheetH.append(t, x);

  if(broadcast && broadcast.lead){
    const p = el("p");
    p.style.cssText = "margin:16px 20px 0;font-size:12.5px;line-height:1.55;color:var(--txt-2)";
    p.textContent = broadcast.lead;
    sheetB.appendChild(p);
  }

  const card2 = el("div","card"); card2.style.margin = "14px 20px 0";
  if(!rows.length) card2.appendChild(el("div","empty","Nothing here."));
  rows.forEach(r=>{
    const row = el("button","row");
    row.append(el("div","id", flats[r.fi].id));
    const m = el("div","meta"); m.innerHTML = r.meta;
    row.append(m, el("span","pill now", r.pill));
    row.onclick = ()=>{ haptic(9); openSheet(r.fi, r.d || 0); };
    card2.appendChild(row);
  });
  sheetB.appendChild(card2);

  if(broadcast && rows.length){
    const bar = el("div","dataTools"); bar.style.cssText = "padding:14px 20px 0";
    const cp = el("button","copybtn");
    cp.innerHTML = "<span>Copy a broadcast</span>";
    cp.onclick = async ()=>{
      const text = broadcast.head + "\n"
        + rows.slice(0,10).map(r=>`${flats[r.fi].id} · ${flats[r.fi].type} · ${flats[r.fi].bshort}`).join("\n")
        + (rows.length > 10 ? `\n+${rows.length - 10} more` : "");
      const ok = await copyText(text);
      haptic(12);
      cp.querySelector("span").textContent = ok ? "Copied" : "Press and hold to copy";
      cp.classList.toggle("done", ok);
      setTimeout(()=>{ cp.querySelector("span").textContent = "Copy a broadcast";
                       cp.classList.remove("done"); }, 1800);
    };
    bar.appendChild(cp);
    sheetB.appendChild(bar);
  }
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0; x.focus();
}

function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
scrim.onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

/* drag the sheet down to dismiss */
(function(){
  const grab = document.getElementById("grab");
  let y0=null, dy=0;
  const start = e=>{ y0=(e.touches?e.touches[0]:e).clientY; dy=0; sheet.style.transition="none"; };
  const move  = e=>{ if(y0===null) return;
    dy = Math.max(0,(e.touches?e.touches[0]:e).clientY - y0);
    sheet.style.transform = `translateY(${dy}px)`;
    if(window.innerWidth>=720) sheet.style.transform = `translate(-50%,${dy}px)`; };
  const end   = ()=>{ if(y0===null) return;
    sheet.style.transition=""; sheet.style.transform="";
    if(dy>90){ haptic(9); closeSheet(); }
    y0=null; };
  grab.addEventListener("touchstart",start,{passive:true});
  grab.addEventListener("touchmove",move,{passive:true});
  grab.addEventListener("touchend",end,{passive:true});
  grab.addEventListener("mousedown",e=>{ start(e);
    const mm=ev=>move(ev), mu=()=>{ end(); removeEventListener("mousemove",mm); removeEventListener("mouseup",mu); };
    addEventListener("mousemove",mm); addEventListener("mouseup",mu); });
})();

const SUBS = [
  ()=> "",                       // Rooms writes its own live subtitle in paint()
  ()=> "Nine weeks ahead · tap a date",
  ()=> "Ask in plain words",
  ()=> "What to act on, and how the book looks",
];
/* re-render the current screen in place after the data changes, keeping your place */
function refreshScreen(){
  const s = document.getElementById("scr-" + SCREENS[curScreen].id);
  const top = s.scrollTop;
  SCREENS[curScreen].render();
  s.scrollTop = top;
}

function switchTo(i, focusInput){
  curScreen = i;
  SCREENS.forEach((sc,j)=>{
    document.getElementById("scr-"+sc.id).classList.toggle("on", j===i);
    tabbar.children[j].setAttribute("aria-selected", j===i);
  });
  scrTitle.firstChild.nodeValue = SCREENS[i].title;
  scrSub.textContent = SUBS[i]();
  SCREENS[i].render(focusInput);
  const s = document.getElementById("scr-"+SCREENS[i].id);
  s.scrollTop = 0;
  closeSheet();
  history.replaceState(null, "", "#" + SCREENS[i].id);
}

/* the large title condenses as you scroll away from it */
(function(){
  const bar = document.querySelector(".topbar");
  SCREENS.forEach(sc=>{
    const s = document.getElementById("scr-"+sc.id);
    s.addEventListener("scroll", ()=>{
      if(!s.classList.contains("on")) return;
      bar.classList.toggle("tight", s.scrollTop > 56);
    }, {passive:true});
  });
})();

/* horizontal swipe between screens */
(function(){
  let x0=null,y0=null;
  document.querySelector(".screens").addEventListener("touchstart",e=>{
    if(sheet.classList.contains("on")) return;
    // elements that own their own horizontal gesture keep it — the calendar's
    // press-and-sweep and the fortnight strip must not flip the tab
    if(e.target.closest && e.target.closest(".cal, .nights, .deck")){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.querySelector(".screens").addEventListener("touchend",e=>{
    if(x0===null || sweepLive) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6){
      const nx = Math.max(0, Math.min(SCREENS.length-1, curScreen + (dx<0?1:-1)));
      if(nx!==curScreen){ haptic(9); switchTo(nx); }
    }
    x0=null;
  },{passive:true});
})();

/* theme toggle */
const themeBtn = document.getElementById("themeBtn");
themeBtn.onclick = ()=>{
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", now==="dark" ? "light" : "dark");
  haptic(8);
};

const deep = SCREENS.findIndex(s=>s.id === location.hash.replace("#",""));
switchTo(deep >= 0 ? deep : 0);
