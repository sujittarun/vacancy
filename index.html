                    + `<b>${free}</b> room-night${free===1?"":"s"} still to sell`,
                /* goMonth, not pickedNight+switchTo: Month reads monthOffset/sel and never
   looks at pickedNight, so this used to render "Rest of August", today still
   selected — a plausible calendar that quietly ignored the week asked for. */
                go: free ? {label:"See that week →", run:()=> goMonth(from)} : null};
      }));
    const halfway = curve.findIndex(x=> x.pct < near.pct/2);
    const drop = near.pct - far.pct;
    said(c, `Bookings arrive close to the date, so the far weeks <b>should</b> look thin — that is the shape of a healthy book, not a problem. `
      + (halfway > 0
          ? `Yours halves by <span class="hi">week ${halfway+1}</span>, which is where your booking window really ends.`
          : drop > .12
            ? `Yours falls <span class="hi">${Math.round(drop*100)} points</span> across the nine weeks without halving — a longer window than most short-lets run.`
            : `Yours is <span class="hi">unusually flat</span> — the far weeks are filling about as well as the near ones, which usually means long stays rather than strong demand.`)
      + ` What matters is watching this curve week to week: a week that stops filling as it approaches is the one to act on.`);
  }

  /* 2 — which nights sell */
  if(seg === "rooms"){
    const wk = weekdayPattern(all);
    const {c,b} = card("Which nights sell", "each day against the week around it");
    const order = [1,2,3,4,5,6,0];
    const worst = order.reduce((a,d)=> wk[d] < wk[a] ? d : a, order[0]);
    const best  = order.reduce((a,d)=> wk[d] > wk[a] ? d : a, order[0]);
    b.appendChild(vbars(order.map(d=>({v:wk[d], label:Math.round(wk[d]*100)+"", k:DOW[d][0]})),
      order.indexOf(worst),
      (r, i)=>{
        const dow = order[i];
        const days = []; for(let d2=0; d2<DAYS; d2++) if(dateAt(d2).getDay() === dow) days.push(d2);
        const emptiest = days.map(d2=>({d:d2, free:freeCount(d2)})).sort((x,y)=> y.free - x.free)[0];
        const gap = Math.round((wk[best] - wk[dow]) * 100);
        return {text: `<b>${DOWF[dow]}s</b> run at ${Math.round(wk[dow]*100)}%`
                    + (gap >= 3 ? ` — <span class="hi">${gap} points</span> under ${DOWF[best]}s`
                       : gap > 0 ? ` — level with the rest of the week` : ` — your strongest night`)
                    + (emptiest ? `. Emptiest is ${fmt(emptiest.d)}, ${emptiest.free} free.` : "."),
                /* Rooms paints a 14-night strip; every weekday bar here points
                   past it, so sending the cursor there left the grid clamped to
                   the last strip night while the date named on the button lived
                   somewhere else. Out of the strip, go to Month — the pattern
                   the insight two cards up already uses. */
                go: emptiest ? {label:`See ${fmt(emptiest.d)} →`,
                                run:()=>{ if(emptiest.d < STRIP){ setPickedNight(emptiest.d); switchTo(0); }
                                          else goMonth(emptiest.d); }} : null};
      }));
    /* A GAP HAS TO BE BIGGER THAN THE NOISE BEFORE IT IS ADVICE. This card used
       to name the weakest day, quote the gap, and prescribe midweek pricing —
       every time, whatever the gap was. On the real book the gap it quoted was
       6 points and was the booking curve; with the curve taken out (see
       weekdayPattern) the spread is 1.6 points across 57 days, which is nothing.

       Three points is the line: below it the days are the same day and the card
       says so, because "no pattern" is a finding and inventing one is not. */
    const spread = Math.round((wk[best] - wk[worst]) * 100);
    said(c, spread < 3
      ? `Nothing separates your weekdays — ${Math.round(wk[worst]*100)}% to ${Math.round(wk[best]*100)}% `
        + `across ${weekdaySamples(all)} nights, which is noise. Whatever is holding occupancy back, it is `
        + `not which day of the week it is.`
      : `<b>${DOWF[worst]}s</b> run at <span class="hi">${Math.round(wk[worst]*100)}%</span> against `
        + `${Math.round(wk[best]*100)}% on ${DOWF[best]}s. Each day is measured against the week around it, `
        + `so this is the day of the week and not simply how far ahead it falls.`);
  }

  /* 3 — by building */
  if(seg === "rooms"){
    const rows = groupOcc(all, f=>f.bname);
    const {c,b} = card("How each building is doing", "occupancy across the nine weeks");
    b.appendChild(hbars(rows.slice().reverse().map(r=>({k:r.k, pct:r.pct, right:Math.round(r.pct*100)+"%"})),
                        rows[0].k));
    const lo = rows[0], hi = rows[rows.length-1];
    const gap = Math.round((hi.pct - lo.pct)*100);
    /* The old sentence asserted a cause — "pricing, photos or listing reach,
       not demand" — from two occupancy figures, which cannot distinguish any of
       those from a long tenancy. On the real book the whole gap WAS long
       tenancies, and the card ruled out the only explanation that was true.
       Where the leader is carried by them, say so and let the operator judge. */
    const carried = hi.longShare >= 0.5;
    const shortGap = Math.round((hi.shortPct - lo.shortPct)*100);
    said(c, gap <= 8
      ? `All ${rows.length} buildings sit within ${gap} points of each other. Nothing here needs attention.`
      : carried
      ? `<b>${lo.k}</b> is <span class="hi">${gap} points behind</span> ${hi.k} — but `
        + `${hi.longNights} of ${hi.k}${/s$/.test(hi.k) ? "'" : "'s"} ${hi.sold} sold nights are stays over a month. On everything `
        + `shorter the two are ${Math.abs(shortGap)} point${Math.abs(shortGap)===1?"":"s"} apart. `
        + `The gap is a few long lets, not nightly demand.`
      : `<b>${lo.k}</b> is <span class="hi">${gap} points behind</span> ${hi.k}, on the same weeks in the `
        + `same city. Worth asking what is different about the listing before assuming it is demand.`);
  }

  /* 4 — by unit type */
  if(seg === "rooms"){
    const rows = groupOcc(all, f=>f.type);
    const {c,b} = card("Which sizes sell", "occupancy by unit type");
    b.appendChild(hbars(rows.slice().reverse().map(r=>({k:`${r.k} · ${r.units} flat${r.units>1?"s":""}`,
      pct:r.pct, right: r.thin ? `${r.sold} of ${r.total} nights` : Math.round(r.pct*100)+"%"})), null));
    /* Ranked over the buckets big enough to be a size rather than a flat. */
    const fat = rows.filter(r=> !r.thin);
    const thin = rows.filter(r=> r.thin);
    const lo = fat[0], hi = fat[fat.length-1];
    said(c, !lo || fat.length < 2
      ? `Too few of each size to compare them.`
      : `Your <b>${hi.k}</b> stock runs at ${Math.round(hi.pct*100)}% while <b>${lo.k}</b> sits at `
        + `<span class="hi">${Math.round(lo.pct*100)}%</span>.`
        + (thin.length
            ? ` ${thin.map(r=>r.k).join(" and ")} ${thin.length>1?"are":"is"} left out of that: `
              + `${thin.length>1?"they are":"it is"} ${thin.map(r=>r.units).join(" and ")} flat`
              + `${thin.length===1 && thin[0].units===1 ? "" : "s"}, so ${thin.length>1?"their":"its"} `
              + `occupancy is one room's luck rather than a fact about the size.`
            : ""));
  }

  /* 5 — length of stay */
  if(seg === "guests"){
    const m = stayMix();
    const {c,b} = card("How long people stay", `${m.total} bookings in the next nine weeks`);
    /* THE MEDIAN, NOT THE MEAN. "14.8 nights, average stay" was true and
       useless: eleven of these 46 bookings run past thirty nights and four are
       open-ended tenancies, so the mean describes the tenancies and the typical
       guest stays 4. A mean is the wrong statistic for a distribution with a
       tail like that, and the advice hung off it ("nudge the average from 14.8
       to 15.3") was advice about the tail. */
    const head = el("div","headline");
    head.append(el("b",null, String(m.median)));
    head.append(el("s",null, `nights, typical stay · ${m.alos.toFixed(1)} average`));
    b.appendChild(head);
    b.appendChild(vbars(m.out.map(x=>({v:x.n, label:String(x.n), k:x.k})), 0));
    const short = m.out[0].n / Math.max(1,m.total);
    said(c, `<span class="hi">${Math.round(short*100)}%</span> of your bookings are single nights, and every `
      + `one is a full changeover — a clean, a key handover and a gap either side — for one night's income.`
      + (m.long ? ` The average is ${m.alos.toFixed(1)} rather than ${m.median} because ${m.long} of these `
                + `run past a month; those are tenancies, not stays.` : ""));
  }

  /* 6 — where bookings come from */
  if(seg === "money"){
    const m = sourceMix();
    const {c,b} = card("Where bookings come from", `${m.total} bookings in the next nine weeks`);
    b.appendChild(hbars(m.rows.map(r=>({k:r.k, pct:r.n/Math.max(1,m.total),
      right:Math.round(r.n/Math.max(1,m.total)*100)+"%"})), null));
    const direct = m.rows.filter(r=>/direct|walk|repeat/i.test(r.k)).reduce((a,r)=>a+r.n,0);
    /* "Direct" is also where the importer puts a cell that named no channel, so
       this share is "direct, or never written down". Reporting it as a choice
       the guest made is a claim the book does not carry. */
    said(c, `<b>${Math.round(direct/Math.max(1,m.total)*100)}%</b> carry no platform — phone, walk-in, a `
      + `returning guest, or a booking whose channel was never written down. Those are the ones paying no `
      + `commission, and recording the channel as you take them is the only way to tell them apart.`);
  }

  /* 7 — turnaround load */
  if(seg === "rooms"){
    const load = turnLoad(14);
    const {c,b} = card("The cleaning week", "same-day turnarounds, next fortnight");
    const peak = load.reduce((a,x)=> x.n > a.n ? x : a, load[0]);
    const head = el("div","headline");
    head.append(el("b",null, String(load.reduce((a,x)=>a+x.n,0))));
    head.append(el("s",null, "rooms need a same-day turnaround in the next 14 days"));
    b.appendChild(head);
    b.appendChild(vbars(load.map(x=>({v:x.n, label:String(x.n),
      k: x.d===0 ? "T" : DOW[dateAt(x.d).getDay()][0]})), load.indexOf(peak)));
    said(c, peak.n > 0
      ? `<span class="hi">${fmtL(peak.d)}</span> is the heaviest, with ${peak.n} room${peak.n>1?"s":""} to turn between a check-out and a check-in. That is the day to have extra help booked, and almost nothing at this scale tells you it is coming.`
      : `No same-day turnarounds in the next fortnight — every check-out has a clear day behind it.`);
  }

  /* 8 — fragmentation */
  if(seg === "rooms"){
    const f = fragmentation();
    const {c,b} = card("How broken up the gaps are", "empty runs boxed in by a booking each side");
    const head = el("div","headline");
    head.append(el("b",null, String(f.orphans)));
    head.append(el("s",null, `single orphan nights, out of ${f.runs} empty stretches`));
    b.appendChild(head);
    b.appendChild(hbars([
      {k:"Orphan (1 night)", pct: f.orphans/Math.max(1,f.runs), right:String(f.orphans)},
      {k:"Sellable stretches", pct:(f.runs-f.orphans)/Math.max(1,f.runs), right:String(f.runs-f.orphans)},
    ], "Orphan (1 night)"));
    /* It described ten orphan nights whatever the number was — on the real book,
       one. Copy that does not read its own data is copy the reader learns to
       skip. */
    said(c, `<b>${f.nights} of your ${f.allNights.toLocaleString("en-IN")} empty nights</b> sit in `
      + `${f.runs} gap${f.runs===1?"":"s"} between two bookings, averaging ${f.avg.toFixed(1)} nights`
      + (f.orphans ? `, ${f.orphans} of them a single night` : ` with no single nights among them`)
      + `. Those are the hard ones — a night boxed in on both sides has to be sold to somebody arriving `
      + `and leaving on exactly those dates. The other ${f.openNights.toLocaleString("en-IN")} run to the `
      + `end of the book and are still ordinary open time.`);
  }

  s.appendChild(deck);

  /* reveal each section as it arrives; bars grow with it */
  if(window.IntersectionObserver && !calm){
    const cards = [...deck.children];
    cards.forEach(c=> c.classList.add("pending"));
    // root is the scrolling panel, not the viewport — these live inside an
    // absolutely positioned scroller
    const io = new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.remove("pending"); io.unobserve(e.target); }
    }), {root:s, threshold:.12});
    cards.forEach(c=> io.observe(c));
    requestAnimationFrame(()=> cards[0] && cards[0].classList.remove("pending"));
    // belt and braces: nothing stays hidden even if the observer never fires
    setTimeout(()=>cards.forEach(c=>c.classList.remove("pending")), 2500);
  }

  /* This footer is a statement about the FORWARD book — "today through 30 Oct"
     — and Profit reads fifteen closed months out of the operator's workbook
     instead. Left unscoped it told the Profit tab there was no history on a
     screen made entirely of history. It carries its own footer. */
  const lead = seg === "profit" ? null : leadTimes();
  const foot = el("p");
  if(seg === "profit"){
    const kept = FIN.length, ref = FIN_DROP.length;
    foot.style.cssText = "margin:20px 2px 0;font-size:12px;line-height:1.6;color:var(--txt-3)";
    foot.innerHTML = `Read from your workbook: revenue and nights from the monthly sheets, `
      + `${FIN.length ? MON[+FIN[0][0].split("-")[1]-1] + " " + FIN[0][0].slice(0,4) : ""}–`
      + `${FIN.length ? MON[+FIN[FIN.length-1][0].split("-")[1]-1] + " " + FIN[FIN.length-1][0].slice(0,4) : ""}, `
      + `costs from your Costing sheet, occupancy counted off the Availability tab. `
      + `<b style="color:var(--txt-2)">${FIN_DROP.length} months are not drawn</b> because they could not be `
      + `checked against the book. No interest, tax or depreciation — so <b style="color:var(--txt-2)">kept</b> `
      + `is operating profit, not net profit.`;
    s.appendChild(foot);
    return;
  }
  foot.style.cssText = "margin:20px 2px 0;font-size:12px;line-height:1.6;color:var(--txt-3)";
  foot.innerHTML = lead
    ? `Across ${lead.n} bookings you entered yourself, the typical one arrives <b style="color:var(--txt-2)">${lead.median} days</b> before check-in.`
    /* "Nothing on these cards is estimated or borrowed from elsewhere" stopped
       being true the moment the rate card started reading the workbook when the
       forward book is too thin to price a night. A footer that reassures the
       reader about a property the screen no longer has is worse than no footer. */
    : `These read the nine weeks ahead — today through ${fmtL(DAYS-1)}. The rate at the top is the exception `
      + `and says so. Lead time needs a few more bookings of your own before it means anything.`;
  s.appendChild(foot);
}

/* ═══════════════ SCREEN 3 — ASK ═══════════════ */
/* Questions, not syntax. The old chips were a cheat-sheet for the parser —
   "15-18", "3 bhk banjara" — which teaches the language but answers nothing.
   These are the things actually asked down a phone, and each is one tap. */
const SUGGEST = ["tonight","tomorrow","this weekend","3 nights","next week"];
let lastQuery = "tonight";
/* What is literally in the box, as opposed to what was asked of the data.
   The Ask screen re-renders on every refreshScreen() — which is to say after
   every move, booking, cancel or block done from a sheet opened out of an
   answer. That render used to blank the input, so backing out of a move you
   decided against left you looking at an empty box with your question gone and
   the whole search to type again. Entering the tab fresh still clears it: that
   is a deliberate choice explained where the input is built. Coming BACK to a
   question you never left is a different thing. */
let askText = "";
/* the last few real questions, so a repeat is a tap rather than retyping */
let recentAsks = [];

/* ══════════════════════════════════════════════════════════════════════════
   Query understanding

   Written as a small grammar rather than a pile of special cases:

       query := filters? duration? ( date ( "-" date )? )?

   Each part is consumed and its tokens REMOVED before the next part runs, so
   a number can never be read as two things at once. That single rule is what
   kept breaking before: "3 nights from friday" read the 3 as a day of the
   month, "2 bhk" read the 2 as a date, "16 sep" ignored the month entirely.

   Anything left unrecognised is simply skipped, so filler words are harmless.
   ══════════════════════════════════════════════════════════════════════════ */

const MONTHS = {jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,
  jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,
  oct:9,october:9,nov:10,november:10,dec:11,december:11};
const MONTH_ABBR = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const WEEKDAYS = {sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,
  thu:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
const NUMWORDS = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
  ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14};
const NIGHT_UNIT = /^(n|nt|nts|night|nights)$/;
const WEEK_UNIT  = /^(w|wk|wks|week|weeks)$/;

const ord = d => (d%10===1&&d%100!==11)?"st":(d%10===2&&d%100!==12)?"nd":(d%10===3&&d%100!==13)?"rd":"th";
/* "This weekend" means THIS one, and on the two days of the week when weekend
   enquiries actually arrive the forward scan answered about a different one.
   Standing on a Saturday the nearest future Friday is six days out; on a Sunday,
   five. So the app took "anything this weekend?" on a Saturday afternoon and
   answered about the weekend after — under the label the caller had used, with
   tonight and tomorrow, the nights they meant, never counted. It is one of the
   five default chips, so it is a one-tap route to a wrong answer.
   Saturday: tonight and tomorrow night. Sunday: tonight. Otherwise scan
   forward to Friday as before. */
const nextWeekend = ()=>{
  const dow = dateAt(0).getDay();
  if(dow === 6) return {a:0, b:Math.min(2, DAYS)};   // Saturday — Sat + Sun nights
  if(dow === 0) return {a:0, b:Math.min(1, DAYS)};   // Sunday   — tonight
  let a=0; while(a<DAYS && dateAt(a).getDay()!==5) a++;
  return {a, b:Math.min(a+2,DAYS)};
};
const numOf = t => /^\d{1,2}$/.test(t) ? +t : (NUMWORDS[t] ?? null);

/* Offset of the next calendar date matching dom (and month, if given) that is
   at least `minOff` days out. Rolls into next year, rejects 31 Feb, and is not
   capped by the 63-day horizon — the caller decides what to do about that. */
function absoluteOffset(dom, monthIdx, minOff){
  minOff = minOff || 0;
  const m0 = today.getMonth(), y0 = today.getFullYear();
  for(let k = 0; k < 18; k++){
    const m = (m0 + k) % 12, y = y0 + Math.floor((m0 + k) / 12);
    if(monthIdx !== null && m !== monthIdx) continue;
    const dt = new Date(y, m, dom); dt.setHours(0,0,0,0);
    if(dt.getMonth() !== m) continue;                 // e.g. 31 Feb
    const off = Math.round((dt - today) / 86400000);
    if(off >= minOff) return off;
  }
  return null;
}
function nextDow(dow, minOff){
  for(let d = minOff || 0; d < minOff + 14; d++) if(dateAt(d).getDay() === dow) return d;
  return 0;
}

function normalize(q){
  return q.toLowerCase()
    .replace(/(\d+)\s*(?:st|nd|rd|th)\b/g, "$1")                                   // 15th → 15
    .replace(/\b(\d{1,2})\s*[/.]\s*(\d{1,2})(?:\s*[/.]\s*\d{2,4})?\b/g,            // 16/9 → 16 sep
             (_,d,mo)=> `${d} ${MONTH_ABBR[(Math.min(12,Math.max(1,+mo)) - 1)]}`)
    .replace(/\b(?:to|till|until|thru|through|upto)\b/g, "-")                      // ranges → one token
    .replace(/[–—]/g, "-")
    .replace(/(\d)\s*-\s*/g, "$1 - ")
    .replace(/[^a-z0-9 \-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* Reads one date expression starting at token i. Returns null if there isn't one. */
function readDate(tk, i, minOff){
  const t = tk[i]; if(!t) return null;
  // a day of the month must be written in digits. "a"/"one" are counts, never dates —
  // otherwise "have a 3 bhk free from 16 sep" reads the "a" as the 1st.
  const digit = t => /^\d{1,2}$/.test(t) ? +t : null;
  const num = digit(t);
  const mon = MONTHS[t] ?? null;

  if(t === "today" || t === "tonight" || t === "now")
    return {d:0, label:"tonight", next:i+1};
  if(t === "tomorrow")
    return {d:1, label:"tomorrow", next:i+1};
  if(t === "day" && tk[i+1] === "after" && tk[i+2] === "tomorrow")
    return {d:2, label:"the day after tomorrow", next:i+3};

  if(t === "in" && numOf(tk[i+1]) !== null && /^days?$/.test(tk[i+2] || ""))
    return {d:numOf(tk[i+1]), label:`in ${numOf(tk[i+1])} days`, next:i+3};

  if((t === "this" || t === "next") && tk[i+1] === "weekend"){
    /* w.b, not a hardcoded 2. nextWeekend knows a Sunday weekend is one night,
       and both callers threw that away — so "this weekend" asked on a Sunday
       still requested Sunday AND Monday, and reported rooms unavailable because
       of a Monday the caller never mentioned. Fixing the function without
       fixing its callers fixed nothing. "next weekend" is a whole weekend by
       definition, wherever we are standing now. */
    const w = nextWeekend();
    return {d: w.a + (t==="next" ? 7 : 0), label:`${t} weekend`,
            defaultNights: t==="next" ? 2 : (w.b - w.a), next:i+2};
  }
  if(t === "weekend"){
    const w = nextWeekend();
    return {d:w.a, label:"this weekend", defaultNights: w.b - w.a, next:i+1};
  }
  if((t === "this" || t === "next") && /^weeks?$/.test(tk[i+1] || "")){
    const mon1 = nextDow(1, 1);
    return {d: t==="next" ? (mon1 || 7) : 0, label:`${t} week`, defaultNights:7, next:i+2};
  }
  if((t === "this" || t === "next") && /^months?$/.test(tk[i+1] || "")){
    const dt = new Date(today.getFullYear(), today.getMonth() + (t==="next"?1:0), 1);
    dt.setHours(0,0,0,0);
    const off = Math.max(0, Math.round((dt - today)/86400000));
    return {d:off, label:`${t} month`, next:i+2};
  }
  if(t === "next" && WEEKDAYS[tk[i+1]] !== undefined){
    let d = nextDow(WEEKDAYS[tk[i+1]], minOff || 0);
    if(d < 7) d += 7;                                    // "next friday" is the one after this one
    return {d, label:`next ${tk[i+1]}`, next:i+2};
  }
  if(WEEKDAYS[t] !== undefined)
    return {d:nextDow(WEEKDAYS[t], minOff || 0), label:t, next:i+1};

  // 16 sep  |  sep 16  |  sep (→ the 1st)  |  16
  if(num !== null && MONTHS[tk[i+1]] !== undefined){
    const M = MONTHS[tk[i+1]];
    return {d:absoluteOffset(num, M, minOff), dom:num, month:M,
            label:`${num}${ord(num)} ${tk[i+1]}`, next:i+2};
  }
  if(mon !== null && digit(tk[i+1] || "") !== null){
    const D = digit(tk[i+1]);
    return {d:absoluteOffset(D, mon, minOff), dom:D, month:mon,
            label:`${D}${ord(D)} ${t}`, next:i+2};
  }
  if(mon !== null)
    return {d:absoluteOffset(1, mon, minOff), dom:1, month:mon, label:t, next:i+1};
  if(num !== null && num >= 1 && num <= 31)
    return {d:absoluteOffset(num, null, minOff), dom:num, month:null,
            label:`the ${num}${ord(num)}`, next:i+1};

  return null;
}

function parseQuery(q){
  const tk = normalize(q).split(" ").filter(Boolean);

  /* 0. a flat by name — "bh201", "BH-201", "bh 201". Taken out before anything
     else, because "201" left lying around would otherwise be read as a date and
     the answer would be about the 1st of next month. Matched against the real
     inventory rather than a pattern, so renumbering a flat cannot break it. */
  let flat = null;
  const codes = flats.map((f,i)=>({key: f.id.toLowerCase().replace(/[^a-z0-9]/g,""), i}));
  for(let i = 0; i < tk.length && !flat; i++){
    const one = tk[i].replace(/[^a-z0-9]/g,"");
    const two = one + (tk[i+1] || "").replace(/[^a-z0-9]/g,"");
    let hit = codes.find(c => c.key === one);
    if(hit){ flat = hit.i; tk.splice(i,1); break; }
    hit = codes.find(c => c.key === two);
    if(hit){ flat = hit.i; tk.splice(i,2); break; }
  }

  /* 1. filters — removed first so "2 bhk" never looks like the 2nd */
  let type = null, bldg = null;
  for(let i = tk.length - 1; i >= 0; i--){
    const t = tk[i], two = (numOf(t) !== null && /^bhk$/.test(tk[i+1] || ""));
    let m = null;
    if(two) m = numOf(t);
    else { const g = t.match(/^(\d)bhk$/); if(g) m = +g[1]; }
    if(m !== null){ type = `${m} BHK`; tk.splice(i, two ? 2 : 1); }
    else if(t === "studio"){ type = "Studio"; tk.splice(i,1); }
  }
  /* buildingsOf(), not BUILDINGS. BUILDINGS is the boot-time SEED — nothing
     rebuilds it when the operator adds a building in the inventory editor, so
     "anything in kondapur tonight" matched nothing, the word was dropped on the
     floor, and the answer silently covered the whole portfolio. The heard row
     showed no building chip either, so the one affordance that could have
     revealed the lost filter showed nothing rather than showing it was missing.
     It ran the other way too: a seeded building whose flats had all been
     deleted still matched, and filtered the pool to nothing. The flat-number
     index two dozen lines above already derives from live `flats`. */
  buildingsOf().forEach(b=>{
    const words = b.name.toLowerCase().split(" ");
    for(let i = 0; i < tk.length; i++){
      if(tk[i] === words[0] || tk[i] === b.code.toLowerCase()){
        bldg = b.code;
        tk.splice(i, (words[1] && tk[i+1] === words[1]) ? 2 : 1);
        return;
      }
    }
  });

  /* 2. duration — removed next so "3 nights" never looks like the 3rd */
  let nights = null;
  for(let i = 0; i < tk.length; i++){
    const g = tk[i].match(/^(\d{1,2})(n|nt|nts|night|nights|w|wk|wks|week|weeks)$/);
    if(g){ nights = +g[1] * (/^w/.test(g[2]) ? 7 : 1); tk.splice(i,1); break; }
    const num = numOf(tk[i]);
    if(num === null) continue;
    if(NIGHT_UNIT.test(tk[i+1] || "")){ nights = num;     tk.splice(i,2); break; }
    if(WEEK_UNIT .test(tk[i+1] || "")){ nights = num * 7; tk.splice(i,2); break; }
  }
  if(nights === null){
    const f = tk.indexOf("fortnight");
    if(f >= 0){ nights = 14; tk.splice(f,1); }
  }

  /* 3. dates */
  let first = null;
  for(let i = 0; i < tk.length && !first; i++){
    const r = readDate(tk, i, 0);
    if(r && r.d !== null) first = r;
  }
  let second = null;
  if(first){
    let j = first.next;
    if(tk[j] === "-") j++;
    if(j < tk.length){
      const r = readDate(tk, j, first.d + 1);
      // "20-20" is one night, not the 20th of next month
      const sameBareDay = r && first.dom !== undefined && r.dom === first.dom
                            && first.month == null && r.month == null;
      if(r && r.d !== null && r.d > first.d && !sameBareDay) second = r;
    }
  }

  let start = first ? first.d : 0;
  let n = nights;
  if(second) n = second.d - first.d;                       // an explicit range wins
  if(n === null) n = (first && first.defaultNights) || 1;

  const beyond = start >= DAYS;                            // asked about a date we can't see
  const label  = !first ? "tonight"
               : second ? `${first.label} to ${second.label}`
               : first.label;

  start = Math.max(0, Math.min(DAYS - 1, start));
  /* WHAT THE CALLER ACTUALLY ASKED FOR, kept separate from what we can answer.
     `beyond` only ever tested the START. A request that begins inside the book
     and ends outside it was clamped here and then rendered as an ordinary
     answer with no flag at all — so "anything from 10 Oct to 25 Oct" (15
     nights) came back "Yes — 5 rooms free for all 9 nights", and the two
     "heard" pills contradicted each other on screen: the range said 25 Oct, the
     night count said 9. The operator says yes down the phone for a stay the app
     never looked at, and Copy for WhatsApp sends the caller a shortened range
     as the answer to their question. The refusal branch already exists for a
     start past the horizon; only the tail was silent. */
  const asked = n;
  n = Math.max(1, Math.min(n, DAYS - start));
  const clipped = !beyond && n < asked;
  return {start, n, asked, clipped, how:label, type, bldg, flat, beyond};
}

function renderAsk(focus){
  const s = document.getElementById("scr-ask");
  s.textContent = "";

  const top = el("div","stack");
  const field = el("div","field");
  const input = el("input");
  /* The box starts EMPTY. It used to arrive holding the last question, which
     had to be cleared a character at a time before a new one could be typed —
     and the tab focused it on open, so the keyboard covered the answer before
     anyone had asked anything. What was asked is shown above the answer
     instead, where it belongs. */
  input.type="text"; input.value = askText; input.autocomplete="off";
  input.placeholder = "A guest's name, or ask about dates";
  input.setAttribute("enterkeyhint","search");
  input.setAttribute("aria-label","Search a guest by name or number, or ask about availability in plain words");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let mic = null, rec = null;
  if(SR){
    mic = el("button","mic");
    mic.setAttribute("aria-label","Speak the question");
    mic.innerHTML = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="7.4" y="2.2" width="5.2" height="9.4" rx="2.6"/><path d="M4.4 9.2a5.6 5.6 0 0 0 11.2 0M10 14.8v3"/></svg>';
    mic.onclick = ()=>{
      if(rec){ rec.stop(); return; }
      try{
        rec = new SR();
        rec.lang = navigator.language || "en-US";
        rec.interimResults = true;
        rec.continuous = false;
        rec.onresult = e=>{
          const txt = [...e.results].map(r=>r[0].transcript).join("");
          input.value = txt;
          if(e.results[e.results.length-1].isFinal){ run(); }
        };
        rec.onerror = ev=>{
          field.classList.remove("hear"); rec = null;
          input.placeholder = ev.error==="not-allowed"
            ? "Microphone blocked here — type instead" : "Didn't catch that — type instead";
        };
        rec.onend = ()=>{ field.classList.remove("hear"); rec = null; };
        rec.start(); field.classList.add("hear"); haptic(14);
      }catch(err){ field.classList.remove("hear"); rec = null; }
    };
  }
  /* ── paste the guest's own words ────────────────────────────────────────────
     A great many enquiries do not arrive as a phone call at all, they arrive as
     a WhatsApp message — "Hi, do you have a 2bhk from 15th to 18th for 4
     people?". Retyping that into a search box is absurd when the parser already
     reads exactly that shape. Copy the message, tap Paste, get the answer, then
     Copy for WhatsApp sends the reply straight back. The round trip is the
     feature; the clipboard is just where the question already is.            */
  const SVG_PASTE = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor"'
    + ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="4.6" y="3.4" width="10.8" height="13.2" rx="2.2"/>'
    + '<path d="M7.8 3.4V2.6a1.4 1.4 0 0 1 1.4-1.4h1.6a1.4 1.4 0 0 1 1.4 1.4v.8z"/></svg>';
  const SVG_CLEAR = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor"'
    + ' stroke-width="1.9" stroke-linecap="round"><path d="M5.6 5.6l8.8 8.8M14.4 5.6l-8.8 8.8"/></svg>';

  /* One slot, two jobs, and they are never wanted at the same time: an empty box
     wants the guest's message pasted in, a full one wants emptying. Clearing
     used to mean holding backspace through a whole sentence. */
  const slot = el("button","slot");
  const canPaste = !!(navigator.clipboard && navigator.clipboard.readText);
  const doPaste = async ()=>{
    haptic(10);
    try{
      const txt = (await navigator.clipboard.readText() || "").trim();
      if(!txt){ input.placeholder = "Nothing copied yet — copy their message first"; return; }
      input.value = txt.replace(/\s+/g," ").slice(0, 200);
      paintSlot(); run();
    }catch(e){
      // Safari and Firefox refuse a clipboard read without an explicit grant
      input.placeholder = "Can't read the clipboard here — paste into the box";
      input.focus();
    }
  };
  const doClear = ()=>{ haptic(8); input.value = ""; paintSlot(); run(true); input.focus(); };
  function paintSlot(){
    const full = input.value.trim().length > 0;
    slot.hidden = !full && !canPaste;
    slot.innerHTML = full ? SVG_CLEAR : SVG_PASTE;
    slot.setAttribute("aria-label", full ? "Clear the question" : "Paste a guest's message and answer it");
    slot.onclick = full ? doClear : doPaste;
  }
  paintSlot();

  /* No "Ask" button. The answer now keeps up with the typing, so a submit
     control only ever confirmed what was already on screen — and on a 375px
     field, three buttons left the placeholder truncated mid-word. Enter still
     submits for anyone who reaches for it. */
  field.append(input, slot);
  if(mic) field.append(mic);

  const chips = el("div","chips");
  const addChip = (q, label, cls)=>{
    const b = el("button", cls || null, label || q);
    b.onclick = ()=>{ input.value = q; paintSlot(); run(); };
    chips.appendChild(b);
  };
  SUGGEST.forEach(q => addChip(q));
  top.append(field, chips);
  // questions actually asked here, once there are any — a repeat is one tap
  if(recentAsks.length){
    const rec = el("div","chips recent");
    rec.append(el("span","reclbl","asked before"));
    recentAsks.forEach(q=>{ const b = el("button",null,q);
      b.onclick = ()=>{ input.value = q; paintSlot(); run(); }; rec.appendChild(b); });
    top.append(rec);
  }

  const ansWrap = el("div","stack gap-m");
  const listWrap = el("div","stack gap-s");
  s.append(top, ansWrap, listWrap);

  input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); input.blur(); run(); }});
  /* Answers while the thumb is still moving. There is no reason to make someone
     finish a sentence and reach for a button to find out there is nothing free
     — the answer can keep up. */
  let typing = null;
  input.addEventListener("input", ()=>{
    paintSlot();
    clearTimeout(typing);
    typing = setTimeout(()=> run(true), 140);
  });
  if(focus) setTimeout(()=>input.focus(),120);
  run(true);

  /* ── a person's whole history, on one screen ─────────────────────────── */
  function stayLine(r){
    const from = dateAt(Math.max(r.start, -3650)), to = dateAt(r.end);
    const dd = d => d.getDate() + " " + MON[d.getMonth()]
              + (d.getFullYear() !== dateAt(0).getFullYear() ? " " + d.getFullYear() : "");
    return r.openEnd ? `${dd(from)} → no end recorded` : `${dd(from)} → ${dd(to)}`;
  }
  function showPeople(people, q){
    ansWrap.textContent = ""; listWrap.textContent = "";
    const ans = el("p","answer");
    if(!people.length){
      ans.innerHTML = `<b class="n">Nobody</b> in the book answers to “${esc(q)}”.`;
      ansWrap.append(ans);
      const note = el("p","movenote");
      note.style.margin = "8px 0 0";
      note.textContent = "Names are matched as you typed them, and part of a name works. "
        + "Only guests already in the book can be found — a booking you have not entered yet is not here.";
      ansWrap.append(note);
      return;
    }
    const one = people.length === 1;
    const SHOWN = 8;
    ans.innerHTML = one
      ? `<b class="y">${esc(people[0].name)}</b> — ${people[0].rows.length} stay${people[0].rows.length>1?"s":""} in the book.`
      : `<b class="y">${people.length} people</b> match “${esc(q)}”`
        + (people.length > SHOWN
            ? ` — the ${SHOWN} who have stayed most are below. Type more of the name to narrow it.`
            : ".");
    ansWrap.append(ans);

    people.slice(0, one ? 1 : SHOWN).forEach(g=>{
      const sect = el("div","sect");
      const right = g.here.length ? "in a flat now"
                  : g.ahead.length ? "due back"
                  : "no booking ahead";
      sect.append(el("span","lbl", esc(g.name)),
                  el("span","lbl", right));
      listWrap.append(sect);

      const card = el("div","card");
      /* One line of who they are, before the stays — the thing an operator
         reads out on the phone while the guest is still talking. */
      const head = el("div","row bk");
      const hm = el("div","meta");
      hm.innerHTML = `<b>${g.rows.length} stay${g.rows.length>1?"s":""}`
        + (g.nights ? ` · ${g.nights} night${g.nights>1?"s":""}` : "")
        + `</b><em>${g.phone ? esc(g.phone) : "no number on file"}`
        + (g.billed ? " · " + money(g.billed) + " billed" : " · no amount recorded")
        + (g.open ? " · one stay has no end date" : "") + `</em>`;
      const he = el("div","rowend");
      if(g.phone){
        const call = el("a","rowx");
        call.href = "tel:" + String(g.phone).replace(/[^\d+]/g,"");
        call.textContent = "☎";
        call.setAttribute("aria-label", "Call " + g.name);
        he.append(call);
      }
      head.append(hm, he);
      card.append(head);

      /* Newest first: "when are they coming" is asked far more often than
         "when did they first come", and the answer to the first question is
         at the top of a list sorted this way. */
      const shown = one ? g.rows.slice().reverse() : g.rows.slice(-3).reverse();
      shown.forEach(r=>{
        const row = el("div","row bk");
        const m = el("div","meta");
        const when = r.start > 0 ? "coming" : r.end > 0 ? "in the flat now" : "stayed";
        m.innerHTML = `<b>${esc(flats[r.fi] ? flats[r.fi].id : "—")}</b> · ${esc(stayLine(r))}`
          + `<em>${when}${r.openEnd ? "" : " · " + r.nights + "n"} · ${esc(r.src || "Direct")}`
          + (r.amount ? " · " + money(r.amount) : "") + `</em>`;
        const e2 = el("div","rowend");
        e2.append(el("span","pill" + (r.start > 0 ? " now" : ""), when === "coming" ? fmt(r.start) : when === "stayed" ? "past" : "now"));
        row.append(m, e2);
        /* straight to the flat and the night it starts, which is where any
           follow-up question is answered */
        row.style.cursor = "pointer";
        row.onclick = ()=>{ haptic(10); openSheet(r.fi, Math.max(r.start, 0)); };
        card.append(row);
      });
      if(!one && g.rows.length > 3)
        card.append(el("div","rowMore", `${g.rows.length - 3} more — tap the name to see them all`));
      if(!one){
        const go = el("button","rowMore", "Show only " + g.name);
        go.style.cssText = "width:100%;text-align:center;cursor:pointer";
        go.onclick = ()=>{ input.value = g.name; paintSlot(); run(); };
        card.append(go);
      }
      listWrap.append(card);
    });
  }

  function remember(q){
    if(!q || SUGGEST.indexOf(q) >= 0) return;          // the standing chips are not history
    recentAsks = [q, ...recentAsks.filter(x => x !== q)].slice(0, 4);
  }

  function run(quiet){
    if(!quiet) haptic(10);
    // every route in — chip, paste, speech, Enter — lands here, so the slot is
    // kept honest here rather than at each caller
    paintSlot();
    askText = input.value;                       // survives the next refresh
    lastQuery = input.value.trim() || "tonight";
    // only a deliberate ask becomes history — not every keystroke on the way
    if(!quiet) remember(lastQuery);
    const p = parseQuery(lastQuery);

    /* A PERSON, BEFORE A DATE. Everything below answers "what is free"; if the
       query was somebody's name it must not reach that code at all, or the tab
       answers a question that was not asked. */
    const people = personQuery(lastQuery, p);
    if(people){ showPeople(people, lastQuery); return; }

    const a = p.start, b = p.start + p.n;
    let pool = flats.map((f,i)=>({f,i}));
    if(p.flat != null) pool = pool.filter(x=>x.i === p.flat);
    if(p.type) pool = pool.filter(x=>x.f.type===p.type);
    if(p.bldg) pool = pool.filter(x=>x.f.code===p.bldg);
    const free = pool.filter(x=>freeRange(x.i,a,b));
    const when = p.n===1 ? fmtL(a) : `${fmtL(a)} → ${fmtL(b)}`;
    const nightsTxt = p.n===1 ? "that night" : p.n===2 ? "both nights" : `all ${p.n} nights`;

    ansWrap.textContent = "";
    const ans = el("p","answer");
    ans.innerHTML = p.beyond
      ? `That's past <b class="n">${fmtL(DAYS-1)}</b> — the furthest this book goes. Showing ${when} instead.`
      : p.flat != null
      ? (free.length
          ? `<b class="y">${esc(flats[p.flat].id)}</b> is free for ${nightsTxt}, ${when}.`
          : (()=>{ const b2 = resv.find(r => r.fi===p.flat && r.start < a+p.n && r.end > a);
              return `<b class="n">${esc(flats[p.flat].id)}</b> is not free ${when}`
                + (b2 ? ` — ${esc(isBlock(b2) ? (b2.reason || "out of service") : b2.guest)} until ${fmt(b2.end)}.` : "."); })())
      : free.length
      ? `Yes — <b class="y">${free.length} room${free.length>1?"s":""}</b> free for ${nightsTxt}, ${when}.`
      : `<b class="n">Nothing</b> covers ${nightsTxt}, ${when}.`;
    /* Say it BEFORE the answer, not after. A caller who asked for 15 nights is
       being answered about 9, and the operator has to know that before reading
       the "Yes" out loud. */
    if(p.clipped)
      ans.innerHTML = `<b class="n">${fmtL(a)} → ${fmtL(a + p.asked)}</b> runs past `
        + `<b class="hi-now">${fmtL(DAYS-1)}</b>, the furthest this book goes. `
        + `Of the first ${p.n} night${p.n>1?"s":""}: ` + ans.innerHTML;
    const heard = el("div","heard");
    if(p.flat != null) heard.append(el("span","pill now", flats[p.flat].id));
    heard.append(el("span","pill" + (p.flat != null ? "" : " now"), p.how));
    /* and the pill echoes what was HEARD, not what survived the clamp — two
       pills that disagree about the same request is worse than either alone */
    heard.append(el("span", "pill" + (p.clipped ? " warn" : ""),
      p.clipped ? `${p.n} of ${p.asked} nights` : `${p.n} night${p.n>1?"s":""}`));
    if(p.type) heard.append(el("span","pill", p.type));
    if(p.bldg){ const bz = buildingsOf().find(z=>z.code===p.bldg);
      heard.append(el("span","pill", bz ? bz.name : p.bldg)); }
    ansWrap.append(ans, heard);

    if(free.length){
      const bar = el("div","copybar");
      const cp = el("button","copybtn");
      cp.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6.6" y="6.6" width="10.4" height="10.4" rx="2.4"/><path d="M13.4 3.4H4.6a1.2 1.2 0 0 0-1.2 1.2v8.8"/></svg><span>Copy for WhatsApp</span>';
      cp.onclick = async ()=>{
        const lines = free.map(x=>`${x.f.id} (${x.f.type}, ${x.f.bshort})`).join("\n");
        const text = p.n===1
          ? `Free on ${fmtL(a)} — ${free.length} room${free.length>1?"s":""}:\n${lines}`
          : `Free ${fmtL(a)} → ${fmtL(b)} (${p.n} nights) — ${free.length} room${free.length>1?"s":""}:\n${lines}`;
        const ok = await copyText(text);
        haptic(12);
        cp.querySelector("span").textContent = ok ? "Copied" : "Press and hold to copy";
        cp.classList.toggle("done", ok);
        setTimeout(()=>{ cp.querySelector("span").textContent = "Copy for WhatsApp";
                         cp.classList.remove("done"); }, 1800);
      };
      bar.append(cp, el("span","lbl", `${free.length} room${free.length>1?"s":""} · ${p.n} night${p.n>1?"s":""}`));
      ansWrap.append(bar);
    }

    listWrap.textContent = "";
    const h = el("div","sect");
    const list = el("div","card");
    if(free.length){
      h.append(el("span","lbl","Read these out"), el("span","lbl", `${fmt(a)} → ${fmt(b)}`));
      free.forEach(x=> list.appendChild(roomRow(x.i, a, null)));
    } else {
      /* before offering different dates, see if one room move rescues these dates */
      const moves = roomMoves(a, b, pool);
      if(moves.length){
        const mh = el("div","sect");
        /* Fewest-first is the right order — but with forty single-guest options
           the one room that needs two guests moved falls off the end, and the
           operator never learns the app can do it at all. So the shortlist is
           the best four, plus the best multi-guest option if none made the cut.
           It is a different shape of answer, not a worse one. */
        /* Cheapest first — but with forty single-guest options the bigger
           shuffles fall off the end and the operator never learns the app can
           do them at all. So: the best three outright, then the best example of
           every larger size not yet on the list. The ladder is visible without
           the cheap answers losing their place at the top. */
        const shown = moves.slice(0,3);
        const sizes = new Set(shown.map(m => m.moves.length));
        moves.forEach(m=>{
          if(shown.length < 6 && !sizes.has(m.moves.length)){ sizes.add(m.moves.length); shown.push(m); }
        });
        const fewest = shown[0].moves.length;
        const most = Math.max(...shown.map(m => m.moves.length));
        mh.append(el("span","lbl", fewest === most
                    ? (fewest === 1 ? "One move away" : `${fewest} moves away`)
                    : `From ${fewest === 1 ? "one move" : fewest + " moves"}`),
                  el("span","lbl", `${moves.length} option${moves.length>1?"s":""}`));
        const mcard = el("div","card");
        shown.forEach(mv=>{
          const fromF = flats[mv.frees], k = mv.moves.length;
          const r = el("button","row move");
          r.append(el("div","id", fromF.id));
          const m = el("div","meta");
          const who = k === 1
            ? `Move <b>${esc(mv.moves[0].booking.guest)}</b> to <b class="rm">${esc(flats[mv.moves[0].to].id)}</b>`
            : `Move <b>${k} guests</b> — ${mv.moves.map(x=>esc(x.booking.guest)).join(", ")}`;
          m.innerHTML = who
            + `<em>${mv.sameBuilding ? "same building" : "one changes building"}`
            + `${mv.sameType ? ", same size" : ", never smaller"}`
            + ` · then <u class="rm">${esc(fromF.id)}</u> is yours</em>`;
          r.append(m, el("span","pill now", k === 1 ? "1 move" : `${k} moves`));
          // it used to open the room that WOULD be freed, having moved nobody
          r.onclick = ()=>{ haptic(10); openMove(mv, a, fi => openBooking(fi, a, p.n)); };
          mcard.appendChild(r);
        });
        listWrap.append(mh, mcard);
        // a cap the operator cannot see is a cap that lies about the answer
        if(movesBeyondCeiling){
          const over = el("p","movecap");
          over.innerHTML = `${movesBeyondCeiling} more room${movesBeyondCeiling>1?"s":""} `
            + `could be freed, but ${movesBeyondCeiling>1?"each needs":"it needs"} more than `
            + `${MOVE_CEILING} guests moved — not a shuffle any more.`;
          listWrap.appendChild(over);
        }
      }
      h.append(el("span","lbl","What is possible instead"),
               el("span","lbl", `${p.n} nights from ${fmt(a)}`));

      /* 1. A shorter stay from the SAME date. If a guest wants thirty nights
            from today, "twenty-one is possible" is a negotiating position;
            "come back in three weeks" is a different trip and no use at all. */
      const runs = pool.map(x=>({fi:x.i, n:runFrom(x.i, a)}))
                       .filter(r=>r.n > 0)
                       .sort((x,y)=> y.n - x.n);
      if(runs.length){
        const best = runs[0].n;
        const sub = el("div","empty");
        sub.style.cssText = "text-align:left;padding:13px 14px 4px";
        sub.innerHTML = `The longest you can do from <b style="color:var(--txt)">${fmtL(a)}</b> is `
          + `<b style="color:var(--txt)">${best} night${best>1?"s":""}</b>, not ${p.n}.`;
        list.appendChild(sub);
        runs.slice(0,5).forEach(r=>{
          const fl = flats[r.fi];
          const row = el("button","row");
          row.append(el("div","id", fl.id));
          const m = el("div","meta");
          m.innerHTML = `<b>${esc(fl.type)}</b> · ${esc(fl.bshort)}`
            + `<em>${fmt(a)} → ${fmt(a + r.n)} · ${r.n} of the ${p.n} nights</em>`;
          row.append(m, el("span","pill good", `${r.n} nt`));
          row.onclick = ()=>{ haptic(9); openSheet(r.fi, a); };
          list.appendChild(row);
        });
      }

      /* 2. A different arrival, within a week. Two things can improve by
            moving: the whole stay may fit, or — far more often for a long
            request — a materially longer stay becomes possible. Showing only
            the first meant a 30-night ask got no arrival options at all. */
      const NEAR = 7;
      const bestFromA = runs.length ? runs[0].n : 0;
      const alts = [];
      for(let sh = 1; sh <= NEAR; sh++){
        [a + sh, a - sh].forEach(s2=>{
          if(s2 < 0 || s2 >= DAYS) return;
          const full = (s2 + p.n <= DAYS)
            ? pool.filter(x=>freeRange(x.i, s2, s2 + p.n)).length : 0;
          let longest = 0, at = -1;
          pool.forEach(x=>{ const r = runFrom(x.i, s2); if(r > longest){ longest = r; at = x.i; } });
          if(full > 0 || longest > bestFromA)
            alts.push({d:s2, full, longest, at, dist:Math.abs(s2 - a)});
        });
      }
      // a stay that fits in full beats a longer-but-partial one; then nearest
      alts.sort((x,y)=> (y.full>0) - (x.full>0) || y.longest - x.longest || x.dist - y.dist);

      if(alts.length){
        const sh2 = el("div","sheet-s");
        sh2.append(el("span","lbl","Or shift the arrival"), el("span","lbl","within a week"));
        list.appendChild(sh2);
        alts.slice(0,4).forEach(alt=>{
          const away = alt.d - a;
          const r = el("button","row");
          r.append(el("div","id", (away>0?"+":"−") + Math.abs(away) + "d"));
          const m = el("div","meta");
          m.innerHTML = `Arrive <b>${fmtL(alt.d)}</b>`
            + (alt.full > 0
                ? `<em>${alt.full} flat${alt.full>1?"s":""} free for all ${p.n} nights</em>`
                : `<em>up to ${alt.longest} night${alt.longest>1?"s":""} — ${flats[alt.at].id} · ${flats[alt.at].bshort}</em>`);
          r.append(m, el("span", alt.full>0 ? "pill good" : "pill",
                   alt.full>0 ? `${alt.full} free` : `${alt.longest} nt`));
          r.onclick = ()=>{ haptic(9);
            if(alt.full > 0) goMonth(alt.d); else openSheet(alt.at, alt.d); };
          list.appendChild(r);
        });
      }

      /* 3. Say when the full stay first becomes possible, however far out.
            One line — information, not a suggestion worth acting on. */
      if(!alts.some(x=>x.full > 0)){
        let soon = -1;
        for(let s2 = a + 1; s2 <= DAYS - p.n && soon < 0; s2++)
          if(pool.some(x=>freeRange(x.i, s2, s2 + p.n))) soon = s2;
        const e = el("div","empty");
        e.style.cssText = "text-align:left;padding:12px 14px";
        e.innerHTML = soon >= 0
          ? `The first date that takes all ${p.n} nights is <b style="color:var(--txt)">${fmtL(soon)}</b>, ${soon - a} days out.`
          : `No ${p.n}-night stretch exists anywhere in the next nine weeks.`;
        list.appendChild(e);
      }
    }
    listWrap.append(h, list);
  }
}

/* ═══════════════ room sheet ═══════════════ */
const sheet = document.getElementById("sheet");
const scrim = document.getElementById("scrim");
const sheetH = document.getElementById("sheetH");
const sheetB = document.getElementById("sheetB");

/* Numbers get typed with spaces, +91, brackets and none of it consistently, so
   match on the last ten digits and nothing else. */
const digits10 = s => String(s || "").replace(/\D/g,"").slice(-10);
/* ── ONE PHONE NUMBER, HOWEVER IT ARRIVES ────────────────────────────────────
   A number is typed, dictated, and — most often — pasted out of WhatsApp,
   where it comes wearing "+91 ", or "0", or "+91-98765 43210". The field
   accepted every one of those verbatim, so the same guest could be stored four
   ways and match none of them: digits10() takes the last ten, which quietly
   rescues the lookups but leaves the operator staring at a field that does not
   look like a phone number.

   So the field normalises as you type. India is the only country this app is
   used in, so a 91 in front of ten digits is a country code, a single leading
   0 is the old trunk prefix, and neither belongs in a stored number.        */
function tidyPhone(raw){
  let d = String(raw == null ? "" : raw).replace(/\D/g, "");
  if(d.length > 10 && d.startsWith("91")) d = d.slice(2);   // +91, 0091, 91
  while(d.length > 10 && d.startsWith("0")) d = d.slice(1); // 0 98765 43210
  if(d.length > 10) d = d.slice(-10);                       // anything else, keep the last ten
  return d;
}
/* Attach to a field: it tidies on input and on paste, and holds the caret at
   the end rather than throwing it to the front on every keystroke — which is
   what a naive value rewrite does and why so many phone fields are miserable. */
function phoneField(inp){
  inp.maxLength = 10;
  const fix = ()=>{
    const was = inp.value, atEnd = inp.selectionStart === was.length;
    const now = tidyPhone(was);
    if(now === was) return;
    inp.value = now;
    if(atEnd){ try{ inp.setSelectionRange(now.length, now.length); }catch(e){} }
  };
  inp.addEventListener("input", fix);
  inp.addEventListener("paste", ()=> setTimeout(fix, 0));
  inp.addEventListener("blur", fix);
  return inp;
}
function guestByPhone(ph){
  const key = digits10(ph);
  if(key.length < 10) return null;
  const past = bookings().filter(r => r.phone && digits10(r.phone) === key)
                         .sort((a,b) => b.start - a.start);
  return past.length ? {name: past[0].guest, stays: past.length, last: past[0].start} : null;
}

/* What is happening in one flat on one night, phrased the way it would be said
   out loud. This is the whole reason the strip is worth touching: "booked" is
   not an answer, "R. Menon · night 2 of 3" is. */
function nightStory(fi, d){
  const r = resv.find(x => x.fi === fi && x.start <= d && x.end > d);
  if(r) return isBlock(r)
    ? (r.reason || "Out of service") + (r.note ? " · " + r.note : "")
    : `${r.guest} · night ${d - r.start + 1} of ${r.end - r.start}`;
  // a free night only means something alongside the length of the gap it sits in
  let a = d; while(a > 0 && !occ[fi][a-1]) a--;
  let b = d; while(b < DAYS-1 && !occ[fi][b+1]) b++;
  const n = b - a + 1;
  return n === 1 ? "Free · a single night between bookings"
       : a === d ? `Free · ${n} nights open from here`
                 : `Free · ${n} nights open, from ${fmt(a)}`;
}

/* Put a finger anywhere on the nine weeks and read that night. Nothing resizes
   and nothing reflows: the legend and the readout share one box, and the only
   things that move are a one-pixel playhead and the touched bar. The gesture
   yields to a vertical scroll rather than fighting it — a strip you cannot
   scroll past would be a worse trade than one you cannot scrub. */
function attachStripScrub(wrap, strip, head, say, call, mini, readD, readW, fi){
  const bars = strip.children;
  let live = false, at = -1, was = null;
  const rowsIn = () => sheetB.querySelectorAll(".card .row");
  /* Seven, because it is the shape of a week and because it is about what a
     thumb covers. Odd, so the night you are on sits in the middle rather than
     off to one side. */
  const MINI = 7;
  const cells = [];
  for(let k = 0; k < MINI; k++){ const c = el("i"); cells.push(c); mini.appendChild(c); }
  /* The window slides to keep the selection centred, except at the two ends,
     where it stops rather than showing empty space for nights that do not
     exist. The selected cell then moves within the window instead — the same
     thing a calendar does in its first and last week. */
  const paintMini = d => {
    const from = Math.max(0, Math.min(DAYS - MINI, d - (MINI >> 1)));
    for(let k = 0; k < MINI; k++){
      const day = from + k, c = cells[k];
      c.className = "";
      if(!occ[fi][day]) c.classList.add("f");
      else if(blk[fi][day]) c.classList.add("b");
      if(day === 0) c.classList.add("td");
      if(day === d) c.classList.add("sel");
    }
  };

  const dayAt = x => {
    const a = bars[0].getBoundingClientRect(), z = bars[DAYS-1].getBoundingClientRect();
    const t = (x - a.left) / (z.right - a.left);
    return Math.max(0, Math.min(DAYS-1, Math.floor(t * DAYS)));
  };
  /* The run of nights the touched one belongs to: one stay, or one gap. Showing
     it is the difference between reading a pixel and reading a span. */
  const runAround = d => {
    const r = resv.find(x => x.fi === fi && x.start <= d && x.end > d);
    if(r) return {from: Math.max(r.start, 0), to: Math.min(r.end, DAYS) - 1};
    let a2 = d; while(a2 > 0 && !occ[fi][a2-1]) a2--;
    let b2 = d; while(b2 < DAYS-1 && !occ[fi][b2+1]) b2++;
    return {from: a2, to: b2};
  };
  const clearSpan = ()=>{ for(const b2 of bars) b2.classList.remove("span","on"); };
  const show = d => {
    if(d === at) return;
    clearSpan();
    const run = runAround(d);
    for(let k = run.from; k <= run.to; k++) bars[k].classList.add("span");
    at = d; bars[d].classList.add("on");
    const br = bars[d].getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    head.style.transform = `translateX(${(br.left - wr.left + br.width / 2).toFixed(1)}px)`;
    readD.textContent = d === 0 ? "Tonight" : fmtL(d);
    readW.textContent = nightStory(fi, d);
    paintMini(d);
    /* The card is centred on the touched night and then clamped inside the
       strip's own width, so it never hangs off either end. The playhead is NOT
       clamped — it stays at the true night — so near the ends the two separate
       slightly and the hairline is what still tells you exactly where you are.
       That connector is the whole reason an offset callout stays honest. */
    const sr = say.getBoundingClientRect();
    const x = br.left - sr.left + br.width / 2;
    const cw = call.offsetWidth;
    const left = Math.max(0, Math.min(sr.width - cw, x - cw / 2));
    call.style.transform = `translateX(${left.toFixed(1)}px)`;
    const r = resv.find(x => x.fi === fi && x.start <= d && x.end > d) || null;
    rowsIn().forEach(row => row.classList.toggle("lit", !!r && row._resv === r));
    // a tick only when the night belongs to something else — not 63 times a sweep
    if(r !== was){ was = r; haptic(5); }
  };
  const start = x => { live = true; at = -1; was = null;
    wrap.classList.add("reading"); say.classList.add("reading"); show(dayAt(x)); };
  const stop = () => {
    if(!live) return;
    live = false;
    clearSpan();
    at = -1;
    wrap.classList.remove("reading"); say.classList.remove("reading");
    rowsIn().forEach(row => row.classList.remove("lit"));
  };

  /* There is no vertical tripwire and no direction lock any more, because with
     touch-action:none there is no longer a competing gesture to arbitrate
     against. The old code abandoned the scrub the moment the finger drifted
     16px down from where it landed, measured against nothing — not against how
     far it had travelled sideways. A thumb pivots at its base, so a sweep
     across 63 nights is an arc, and the drift grows the further along the bar
     you get. Measured on the real bar: a straight drag tracked all 30 nights, a
     22px arc died a third of the way in, a 40px arc barely started. Whatever
     the finger does vertically now, the reading continues. */
  wrap.addEventListener("pointerdown", e=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    /* Captured on contact. Implicit capture covers touch but NOT mouse or pen,
       so without this a mouse drag dies the moment it leaves the 46px band —
       and capture is also what lets a finger stray off the strip and keep
       reading. pointerleave would fire constantly here and means only that the
       pointer left the box, never that the gesture ended. */
    try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
    start(e.clientX);
  });
  wrap.addEventListener("pointermove", e=>{
    if(!live) return;
    if(e.cancelable) e.preventDefault();
    show(dayAt(e.clientX));
  }, {passive:false});
  // capture routes both of these back here, so no window listeners accumulate
  // as sheets open and close
  ["pointerup","pointercancel"].forEach(ev => wrap.addEventListener(ev, stop));
}

/* Money rides in the booking's own row rather than on a line beneath it. A
   separate line sits between two bookings and belongs visibly to neither, and
   reading money against the wrong guest is the same class of mistake as reading
   the wrong flat — the one failure this app exists to prevent.

   Three states, and "unpaid" is never said about a platform booking: the guest
   paid, Airbnb owes you, and those two need opposite actions. */
/* `day` threads through so the sheet can be re-opened where it was. Without
   it, openSheet's `day == null` fallback substituted the global pickedNight —
   the Rooms cursor — so recording a payment on a room reached from Month, Ask
   or Business silently re-anchored the sheet to a different date, and the
   primary action changed from "Book from 13 Sep" to "Book from 23 Aug" in
   place, with the wrong date then printed on openBooking's Arriving stepper.
   Every other back-link in this stack already carries the day. */
function moneyPill(r, fi, day){
  const due = dueFrom(r);
  if(due > 0){
    const b = el("button","paid due", money(due) + " due");
    b.setAttribute("aria-label",
      `${money(due)} still due from ${r.guest} of ${money(r.amount)} — record a payment`);
    b.onclick = ev=>{ ev.stopPropagation(); haptic(9); openPayment(r, fi, day); };
    return b;
  }
  if(withPlatform(r) > 0){
    const s = el("span","paid plat","payout due");
    s.setAttribute("aria-label", `${money(r.amount)} paid by the guest to ${r.src}; payout still to come`);
    return s;
  }
  return el("span","paid clear","settled");
}

/* Recording money is two touches: the amount is already the balance, and the
   method defaults to how this booking's source is actually settled. */
function openPayment(r, fi, day){
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">${money(dueFrom(r))} due</div>`
              + `<div class="m">${esc(r.guest)} · ${flats[r.fi].id} · ${fmt(Math.max(r.start,0))} → ${fmt(r.end)}</div>`;
  const x = el("button", null, "✕"); x.setAttribute("aria-label","Back");
  x.onclick = ()=> openSheet(fi, day);
  sheetH.append(t, x);

  const form = el("div","bkform");
  const amtWrap = el("div","bkamt");
  amtWrap.appendChild(el("s", null, "₹"));
  const amt = el("input");
  amt.type = "text"; amt.inputMode = "numeric";
  amt.value = String(Math.round(dueFrom(r)));
  amt.setAttribute("aria-label","Amount received");
  amtWrap.appendChild(amt);
  form.append(amtWrap);

  let method = PLATFORMS.indexOf(r.src) >= 0 ? "Platform" : "UPI";
  const chips = el("div","srcRow");
  PAY_METHODS.forEach(mth=>{
    const c = el("button", null, mth);
    c.setAttribute("aria-pressed", mth === method);
    c.onclick = ()=>{ method = mth; haptic(8);
      [...chips.children].forEach(o => o.setAttribute("aria-pressed", o.textContent === method)); };
    chips.appendChild(c);
  });
  form.append(chips);

  const go = el("button","bkgo","Record it");
  go.onclick = ()=>{
    /* toAmount already parses "₹1,500.50" correctly. Pre-stripping to digits
       first turned 1500.50 into "150050" — a ₹1,501 payment recorded as
       ₹1,50,050, which then clamps dueFrom to 0 and flips the row to settled. */
    if(addPayment(r, amt.value, method)){ haptic(18); openSheet(fi, day); }
  };
  form.append(go);
  sheetB.append(form);

  if((r.pays || []).length){
    const s = el("div","sheet-s");
    s.append(el("span","lbl","Already received"), el("span","lbl", money(paidOn(r))));
    sheetB.append(s);
    const card = el("div","card"); card.style.margin = "0 20px";
    r.pays.forEach(p=>{
      const row = el("div","row");
      row.append(el("div","id", money(p.amount)));
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(p.method)}</b><em>${fmt(p.on || 0)}</em>`;
      const end = el("div","rowend");
      const del = el("button","rowx","✕");
      del.setAttribute("aria-label", `Remove this ${money(p.amount)} payment`);
      armConfirm(del, {rest:"✕", armed:"Remove?",
        run:()=>{ dropPayment(r, p); openPayment(r, fi, day); }});
      end.append(del);
      row.append(m, end);
      card.appendChild(row);
    });
    sheetB.append(card);
  }
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* Report a fault without taking the flat off the market. Two taps and a word:
   what it is, and how much it can wait. */

/* ── a preview of the change, on the flat's own nine weeks ────────────────────
   Both of these forms used to be a stack of fields describing something
   abstract: "4 nights from 16 Aug" is a sentence, not a picture, and you had to
   hold the calendar in your head to know whether it landed anywhere awkward.
   This paints the pending block straight onto the timeline as you move the
   steppers, so the consequence is visible before it is committed.            */
function previewStrip(fi){
  const wrap = el("div","prevwrap");
  const strip = el("div","strip prev");
  strip.setAttribute("role","img");
  stripBars(fi, false).forEach(i => strip.appendChild(i));
  const k = el("div","prevk");
  const kl = el("span","lbl","Today"), kr = el("span","lbl","+9 weeks");
  k.append(kl, kr);
  wrap.append(strip, k);
  wrap.paint = (from, n)=>{
    [...strip.children].forEach((b, d)=>{
      const inRange = d >= from && d < from + n;
      b.classList.toggle("pending", inRange);
    });
  };
  return wrap;
}

/* Chips ordered by what this flat actually breaks, then by what breaks most
   across the portfolio. The right answer should not be the eleventh chip. */
function faultsFor(fi){
  const mine = {}, all = {};
  resv.filter(r => isBlock(r) && r.fault).forEach(r=>{
    all[r.fault] = (all[r.fault] || 0) + 1;
    if(r.fi === fi) mine[r.fault] = (mine[r.fault] || 0) + 1;
  });
  issues.filter(x => x.fault).forEach(x=>{
    all[x.fault] = (all[x.fault] || 0) + 1;
    if(x.fi === fi) mine[x.fault] = (mine[x.fault] || 0) + 1;
  });
  const list = allFaults();
  return list.slice().sort((a,b)=>
    (mine[b]||0) - (mine[a]||0) || (all[b]||0) - (all[a]||0) || list.indexOf(a) - list.indexOf(b));
}

function openIssueForm(fi, day){
  const fl = flats[fi];
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">${esc(fl.id)}</div>`
              + `<div class="m">something needs fixing · stays on sale</div>`;
  const x = el("button", null, "✕"); x.setAttribute("aria-label","Back");
  x.onclick = ()=> openSheet(fi, day);
  sheetH.append(t, x);

  const form = el("div","bkform");
  let fault = "", urgency = "soon", q = "", showAll = false, who = "";
  const prev = previewStrip(fi);
  const win0 = batchWindow(fi, 1);
  prev.paint(win0 ? win0.from : 0, 0);

  /* the same line the block form leads with, saying the one thing that differs:
     this costs nothing, because the flat stays on sale */
  const line = el("p","bkline");
  const nextIn = resv.filter(r => r.fi === fi && !isBlock(r) && r.end > 0)
                     .sort((a,b)=> a.start - b.start)[0];
  const whoNext = !nextIn ? "nobody is booked in for nine weeks"
    : nextIn.start <= 0 ? `${nextIn.guest} is in there until ${fmt(nextIn.end)}`
    : `${nextIn.guest} arrives ${fmt(nextIn.start)}`;
  line.innerHTML = `<b>${esc(fl.id)} stays on sale</b> · this costs no nights`
    + (win0 ? ` · empty from <b>${esc(fmt(win0.from))}</b> for ${win0.nights} night${win0.nights>1?"s":""},`
            + ` so a visit then is free` : "");

  const fCap = el("div","bkcap");
  fCap.append(el("span",null,"What is wrong"), el("span",null,"tap one"));
  const find = el("div","ffind");
  find.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'
    + '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
  const qi = el("input");
  qi.type = "text"; qi.placeholder = "or type it — geyser, tap, socket…";
  qi.setAttribute("aria-label","Find what is wrong");
  const qx = el("button", null, "✕"); qx.setAttribute("aria-label","Clear"); qx.hidden = true;
  find.append(qi, qx);
  const grid = el("div","fgrid");
  const flag = el("div","faultFlag"); flag.hidden = true;

  /* what it actually turns out to be, offered rather than asked for */
  const nCap = el("div","bkcap");
  const nCapR = el("span");
  nCap.append(el("span",null,"What exactly"), nCapR);
  const sRow = el("div","tyRow soft");
  const noteRow = el("div","r");
  const note = el("input");
  note.type = "text"; note.placeholder = "In your own words";
  noteRow.appendChild(note);

  const uCap = el("div","bkcap"); uCap.append(el("span",null,"How much can it wait"));
  const uSay = el("div","bkstate");
  const uWhy = {
    whenever: win0 ? `Goes on the list. It can ride along the next time someone is there — ${fl.id} is empty from ${fmt(win0.from)}.`
                   : `Goes on the list, to be picked up whenever someone is next at the flat.`,
    soon:     win0 ? `Worth a visit of its own if nobody is going anyway. ${fl.id} sits empty from ${fmt(win0.from)} for ${win0.nights} night${win0.nights>1?"s":""}, which costs nothing.`
                   : `Worth a visit of its own — this flat has no empty stretch coming up.`,
    urgent:   `Deal with it before the next guest — ${whoNext}. If it cannot wait for them, take the flat out of service instead; this note leaves it on sale.`,
  };
  const uRow = el("div","tyRow");
  [["whenever","Can wait"],["soon","Soon"],["urgent","Urgent"]].forEach(([k,label])=>{
    const b = el("button",null,label);
    b.setAttribute("aria-pressed", k === urgency);
    b.onclick = ()=>{ urgency = k; haptic(8);
      [...uRow.children].forEach((c,i)=>c.setAttribute("aria-pressed", i === URGENCY.indexOf(urgency)));
      uSay.textContent = uWhy[urgency];
      uSay.classList.toggle("bad", urgency === "urgent");
    };
    uRow.appendChild(b);
  });
  uSay.textContent = uWhy[urgency];

  const whoCap = el("div","bkcap");
  const whoCapR = el("span");
  whoCap.append(el("span",null,"Who would do it"), whoCapR);
  const crew = el("div","crew");

  const acts = el("div","invActs");
  const go = el("button","invSave","Log it");
  const cancel = el("button","invDel","Cancel");
  cancel.onclick = ()=>{ haptic(8); openSheet(fi, day); };
  acts.append(go, cancel);

  function paintGrid(){
    grid.textContent = "";
    const all = faultsFor(fi);
    const needle = q.trim().toLowerCase();
    let list = needle ? all.filter(k => faultHit(k, needle)) : all;
    const capped = !needle && !showAll && list.length > 8;
    if(capped) list = list.slice(0, 7);
    if(!list.length){
      grid.appendChild(el("div","fnone", `Nothing matches “${q.trim()}”. Try fewer letters, or pick Other.`));
      return;
    }
    list.forEach(k=>{
      const b = el("button","ftile");
      const on = fault === k;
      b.setAttribute("aria-pressed", on);
      const times = faultTimesHere(fi, k);
      b.setAttribute("aria-label", k + (times ? `, ${times} here before` : ""));
      b.innerHTML = faultSvg(k);
      b.append(el("span", null, k));
      if(times) b.append(el("i", null, times + "×"));
      b.onclick = ()=>{ fault = on ? "" : k; haptic(8); paint(); };
      grid.appendChild(b);
    });
    if(capped){
      const m = el("button","ftile");
      m.innerHTML = faultSvg("Other");
      m.append(el("span", null, "+" + (all.length - 7) + " more"));
      m.onclick = ()=>{ showAll = true; haptic(8); paintGrid(); };
      grid.appendChild(m);
    }
  }

  function paintSymptoms(){
    sRow.textContent = "";
    const list = SYMPTOMS[fault] || [];
    sRow.hidden = !list.length;
    nCapR.textContent = list.length ? "tap one, or type" : "";
    /* Both sides lowercased. Only one entry in the SYMPTOMS table carries
       capitals — "MCB tripping" — and it was being compared against a
       lowercased note, so `on` was permanently false for it: the toggle-off
       branch was unreachable and the chip never came back pressed on a repaint.
       Tapped by mistake, the only way out was selecting the note field and
       clearing the text by hand, which is exactly the fiddly one-handed typing
       this tap-based form exists to avoid. On the repaint path it lied the
       other way — nothing looked selected while the note still held the text,
       so a second symptom appended to the first rather than replacing it.
       Any symptom with a capital or a punctuation mark would have done it. */
    const same = (a,b) => a.trim().toLowerCase() === b.trim().toLowerCase();
    list.forEach(s=>{
      const b = el("button",null,s);
      b.setAttribute("aria-pressed", same(note.value, s));
      b.onclick = ()=>{
        const on = same(note.value, s);
        note.value = on ? "" : s; haptic(8);
        [...sRow.children].forEach(c=>c.setAttribute("aria-pressed", !on && same(c.textContent, s)));
      };
      sRow.appendChild(b);
    });
  }

  function paintCrew(){
    crew.textContent = "";
    whoCapR.textContent = fault ? "who does " + fault : "";
    if(!fault){
      crew.append(el("p","crewidle","The right people appear once you say what is wrong."));
      return;
    }
    const list = crewFor(fi, fault);
    if(!list.length){
      crew.append(el("p","crewidle","Nobody recorded yet — the first person you use here becomes the record."));
      return;
    }
    list.forEach(c=>{
      const b = el("button","mate");
      b.setAttribute("aria-pressed", who === c.name);
      const t2 = el("div","mt");
      t2.append(el("b", null, c.name), el("em", null, c.why));
      b.append(t2, el("div","mr" + (c.bad ? " bad" : ""), c.rec));
      b.onclick = ()=>{ who = who === c.name ? "" : c.name; haptic(8); paintCrew(); };
      crew.appendChild(b);
    });
  }

  function paintFlag(){
    const hist = fault ? faultHistory(fi, fault, DAYS) : null;
    flag.textContent = "";
    if(!hist){ flag.hidden = true; return; }
    flag.hidden = false;
    const l = el("div","ff-l");
    l.innerHTML = `<b>${hist.times}${ordinalSuffix(hist.times)} `
      + `${esc(fault)} fault in ${esc(fl.id)}.</b> `
      + (hist.last.fixer ? `${esc(hist.last.fixer)} saw it last.` : "Nobody recorded who fixed it last.");
    flag.append(l);
    if(hist.last.fixer && hist.last.fixer_phone){
      const a = el("div","ff-a");
      const call = el("a","ff-call", "Call " + hist.last.fixer);
      call.href = "tel:" + hist.last.fixer_phone.replace(/[^\d+]/g,"");
      a.append(call);
      flag.append(a);
    }
  }

  function paint(){ paintGrid(); paintSymptoms(); paintCrew(); paintFlag();
    go.textContent = fault || note.value.trim() ? "Log it" : "Say what is wrong first";
    go.disabled = !fault && !note.value.trim(); }

  qi.oninput = ()=>{ q = qi.value; qx.hidden = !q; paintGrid(); };
  qx.onclick = ()=>{ q = ""; qi.value = ""; qx.hidden = true; qi.focus(); paintGrid(); };
  note.oninput = ()=>{ go.disabled = !fault && !note.value.trim();
    go.textContent = go.disabled ? "Say what is wrong first" : "Log it"; };

  go.onclick = ()=>{
    if(go.disabled) return;
    // same rule here: a named "Other" becomes a kind of its own
    let saveFault = fault;
    if((!fault || fault === "Other") && note.value.trim() && note.value.trim().length <= 28)
      saveFault = learnFault(note.value) || fault;
    addIssue(fi, saveFault, [note.value, who ? "for " + who : ""].filter(s=>s && s.trim()).join(" · "), urgency);
    haptic(18); openSheet(fi, day); refreshScreen();
  };

  form.append(prev, line, fCap, find, grid, flag, nCap, sRow, noteRow,
              uCap, uRow, uSay, whoCap, crew, acts);
  sheetB.append(form);
  paint();

  const hint = el("p");
  hint.style.cssText = "margin:11px 20px 0;font-size:12px;line-height:1.55;color:var(--txt-3)";
  hint.textContent = `${fl.id} stays on sale — this is a note, not a block. `
    + `Nothing here costs you a night.`;
  sheetB.append(hint);
  sheet.classList.add("on"); scrim.classList.add("on");
  // no autofocus: the fast path is two taps, and a keyboard that opens itself
  // covers the grid that makes it fast
}
/* ══════════════ opening a room ══════════════════════════════════════════════
   A room used to open onto every form at once: book a guest, log a fault, take
   it out of service, all expanded inline under three read-only lists. Forty-
   seven buttons and nearly four screens of scroll before anything was typed,
   because each new feature was added where it was *about* rather than where it
   belonged.

   The rule now is one surface, one job. Opening a room READS: what it is, its
   nine weeks, and the one thing you most likely came to do. Everything that
   writes is its own screen with a single commit, and Back returns here.       */

/* The room's own header, shared by every screen in the stack, so moving between
   them never feels like leaving the room. */
function roomHead(fi, backTo){
  const fl = flats[fi];
  sheetWipe();                       // it hands off to a form that fills the body
  const t = el("div");
  t.innerHTML = `<div class="n">${esc(fl.id)}</div>`
              + `<div class="m">${esc(fl.type)} · ${esc(fl.bname)} · ${esc(floorName(fl.floor))}</div>`;
  const x = el("button", null, backTo ? "‹" : "✕");
  x.setAttribute("aria-label", backTo ? "Back to the room" : "Close");
  x.onclick = backTo || closeSheet;
  sheetH.append(t, x);
  return x;
}

/* One night, one bar — the reading of occ/blk that BOTH strips share. It lived
   twice, once here and once in previewStrip, so a change to how a night is
   drawn had to be made in two places or the scrubbable strip and the preview
   would start disagreeing about the same flat. `seams` is the only real
   difference: the preview does not draw them because it is showing a range you
   are about to take, not a history to read. */
function stripBars(fi, seams){
  const out = [];
  const startsHere = new Set();
  if(seams) resv.filter(r => r.fi === fi).forEach(r=>{
    // where a new stay begins against an occupied night before it — the seam
    // two back-to-back bookings otherwise hide
    if(r.start > 0 && r.start < DAYS && occ[fi][r.start - 1]) startsHere.add(r.start);
  });
  for(let d=0; d<DAYS; d++){
    const i = el("i");
    if(!occ[fi][d]) i.classList.add("f");
    else if(blk[fi][d]) i.classList.add("b");
    if(d === 0) i.classList.add("td");
    if(startsHere.has(d)) i.classList.add("edge");
    out.push(i);
  }
  return out;
}

/* The nine weeks, scrubbable. Built here rather than inline so the room card
   stays readable as a list of sections. */
function roomStrip(fi){
  const wrap = el("div","stripwrap");
  const strip = el("div","strip");
  strip.setAttribute("role","img");
  strip.setAttribute("aria-label",
    `${flats[fi].id} over the next nine weeks: ${occPct(fi)} per cent booked. Touch and drag to read a night.`);
  stripBars(fi, true).forEach((i, d)=>{
    i.style.animationDelay = (d * 3) + "ms";      // 63 bars, ~190ms end to end
    strip.appendChild(i);
  });
  const head = el("i","playhead");
  wrap.append(strip, head);
  wrap.classList.add("fresh");
  // let it play once, then get out of the way of the scrub's own transforms
  setTimeout(()=> wrap.classList.remove("fresh"), 420);
  /* The readout goes ABOVE the bar. It used to sit in the foot, and measuring
     the old layout on a phone put the first line of it 8px BELOW the contact
     point — inside the ~42px disc a fingertip covers, and under the hand that
     is doing the scrubbing, which on a phone always arrives from beneath. The
     one thing you were dragging in order to read was the one thing your thumb
     was on top of.
