/* ═══════════════ shared: room tile + list row ═══════════════ */
function roomTile(fi, day, stay){
  const fl = flats[fi];
  const nights = stay || 1;
  /* Same migration as the sheet and the form. With freeRange, a flat free from
     here to the end of the book was painted as unavailable and captioned
     "Free 2 of 3" whenever the dial reached past the horizon — the tile denying
     a stay addBooking accepts. `run >= DAYS - day` below already knows how to
     say "Free n+", which is this file's established idiom for "and beyond". */
  const open = freeSpan(fi, day, day + nights);
  const blocked = blk[fi][day];
  const turn = chg[fi][day] && !open;
  const run = open ? runFrom(fi, day) : 0;
  const b = el("button","tile" + (open ? " free" : blocked ? " oos" : (turn ? " turn" : "")));
  /* `open` is a verdict on the WHOLE stay the dial is asking about, but the
     wording under it was scoped to a single date — so with the dial on 3
     nights, a flat that is genuinely vacant tonight and booked from tomorrow
     read "Booked", and its aria-label said "not available on Mon 17 Aug" about
     a night it is free. 9 of 45 flats were in that state on the shipped book.
     Mid-call a caller drops from three nights to one, the operator glances at a
     grid still on the 3-night dial, and says no to nine rooms.

     Only `blocked` and `turn` are genuinely per-night facts. So when the dial
     is above one night, say what is actually known — and say what IS there,
     because "free 1 of 3" is the answer to the question the caller is about to
     ask next. "Booked" is kept only where the night really is occupied. */
  const takenTonight = !!occ[fi][day];
  const partial = !open && !blocked && !turn && !takenTonight ? runFrom(fi, day) : 0;
  const note = open
    ? freeWords(fi, day, true)
    : blocked ? (resv.find(r=>isBlock(r) && r.fi===fi && day>=r.start && day<r.end)?.reason || "Blocked")
    : turn ? "Turnaround"
    : partial ? `Free ${partial} of ${nights}`
    : "Booked";
  b.append(el("b",null,fl.id), el("s",null,note));
  if(open && run === 1) b.appendChild(el("i","flag"));   // orphan night
  /* the spoken label says what the printed one says — "Free 2+n" announced as
     "free for 2 nights" understates a flat that is free to the end of the book,
     and the two disagreeing is its own small lie */
  b.setAttribute("aria-label",
    `${fl.id}, ${fl.type}, ${open ? (run >= DAYS-day
        ? `free for ${run} nights or more from`
        : `free for ${run} night${run>1?"s":""} from`)
      : blocked ? "out of service on"
      : partial ? `free for ${partial} of ${nights} nights from`
      : "not available on"} ${fmtL(day)}`);
  b.onclick = ()=>{
    /* honoured only while it could plausibly belong to the gesture that set
       it; a stale latch must never cost a real tap */
    if(b._peeked && performance.now() - b._peeked < 400){ b._peeked = 0; return; }
    b._peeked = 0; haptic(9); openSheet(fi, day); };
  attachPeek(b, fi, day);
  return b;
}

/* ── hold a room to read it ───────────────────────────────────────────────────
   Mid-call the question is rarely "show me everything about 204" — it is "what
   about 204?", asked while the grid is still the thing you want to be looking
   at. Opening a sheet answers it and costs you your place; this answers it and
   gives the place back the moment the thumb lifts.

   Hold, read, release. Nothing to dismiss, nothing to navigate back from.    */
let peekEl = null;
function attachPeek(btn, fi, day){
  let timer = null, x0 = 0, y0 = 0, fired = false;
  /* `_peeked` is a latch that swallows the click a completed peek would
     otherwise turn into. It was being set on EVERY gesture end — pointerup,
     pointercancel and pointerleave all routed here — but only a `click` ever
     cleared it, and pointercancel is precisely the case where no click follows.
     So peeking a room and then letting the thumb drift onto a neighbour, or
     dragging to scroll (Chrome takes the touch and fires pointercancel), left
     the tile armed to eat the next real tap. Once the 330ms timer has fired,
     `timer` is null and the 10px movement guard above is dead, so the gesture
     could not be abandoned cleanly either. Nothing re-renders Rooms afterwards,
     so the flag could sit armed for the length of a call.
     Only a pointerup produces a click, so only a pointerup arms the latch — and
     it is time-bounded as well, because a latch that outlives its own gesture
     is the bug, not the mechanism. */
  const stop = ()=>{ clearTimeout(timer); timer = null; btn.classList.remove("peeking");
    if(fired){ hidePeek(); fired = false; } };
  const cancel = ()=>{ stop(); };
  const finish = ()=>{ if(fired){ btn._peeked = performance.now(); } stop(); };
  btn.addEventListener("pointerdown", e=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; fired = false;
    timer = setTimeout(()=>{ fired = true; haptic(11);
      btn.classList.add("peeking"); showPeek(fi, day); }, 330);
  });
  btn.addEventListener("pointermove", e=>{
    // a scroll is not a hold; let go of the gesture rather than fighting it
    if(timer !== null && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel();
  });
  btn.addEventListener("pointerup", finish);
  ["pointercancel","pointerleave"].forEach(ev => btn.addEventListener(ev, cancel));
}
function showPeek(fi, day){
  hidePeek();
  const fl = flats[fi];
  const p = el("div","peek");
  const h = el("div","peek-h");
  h.append(el("b", null, fl.id), el("s", null, `${fl.type} · ${fl.bshort} · ${floorName(fl.floor)}`));
  const strip = el("div","strip");
  for(let d=0; d<DAYS; d++){
    const i = el("i");
    if(!occ[fi][d]) i.classList.add("f"); else if(blk[fi][d]) i.classList.add("b");
    if(d === day) i.classList.add("td");
    strip.appendChild(i);
  }
  const line = el("div","peek-l");
  line.textContent = nightStory(fi, day);
  const nxt = bookings().filter(r => r.fi === fi && r.start > day).sort((a,b)=> a.start - b.start)[0];
  const sub = el("div","peek-s");
  sub.textContent = nxt
    ? `Next in: ${nxt.guest}, ${fmt(nxt.start)}` + (occPct(fi) ? ` · ${occPct(fi)}% booked` : "")
    : `Nothing else booked in nine weeks · ${occPct(fi)}% booked`;
  p.append(h, strip, line, sub);
  document.body.appendChild(p);
  requestAnimationFrame(()=> p.classList.add("on"));
  peekEl = p;
}
function hidePeek(){
  if(!peekEl) return;
  const p = peekEl; peekEl = null;
  p.classList.remove("on");
  setTimeout(()=> p.remove(), 200);
}

function roomRow(fi, day, tail){
  const fl = flats[fi];
  const r = el("button","row");
  r.append(el("div","id",fl.id));
  const m = el("div","meta");
  /* The floor was a second line on every row and it is not why the operator is
     reading this list — he is reading the flat, its size and its building, then
     saying one of them down the phone. Eleven pixels a row, and at 41 free rows
     that is 450px of a screen that has none to spare. It stays on the room
     sheet, which is where somebody who cares about the floor is going. */
  m.innerHTML = `<b>${esc(fl.type)}</b> · ${esc(fl.bshort)}`
              + (tail ? `<em>${esc(tail)}</em>` : "");
  r.appendChild(m);
  r.appendChild(el("span","pill good", freeWords(fi, day)));
  r.onclick = ()=>{ haptic(9); openSheet(fi, day); };
  return r;
}

/* ═══════════════ SCREEN 1 — ROOMS ═══════════════ */
const STRIP = 14;              // nights answerable without leaving this tab
const STAYS = [1,2,3,7];
/* THE CURSOR IS A NIGHT ON THE STRIP, and the strip is STRIP nights long.
   Anything further out is Month's job, which is why every jump that could land
   past the strip now routes there instead of writing a number nobody can show.

   That invariant did not exist before and the shape actively hid its absence: a
   Business jump could write 21 into a 14-night cursor, renderRooms clamped it
   into a LOCAL without writing back, and the grid painted day 13 while the
   sheet opened from it booked day 21 — two dates on one screen, each internally
   consistent. The clamps at the read sites were not safety, they were the thing
   keeping the disagreement quiet.

   One writer now. Assign through setPickedNight and the guarantee holds
   everywhere, so the readers can simply read. */
let pickedNight = 0, stayNights = 1;
const setPickedNight = d => (pickedNight = Math.max(0, Math.min(d | 0, STRIP - 1)));
const countFreeFor = (d, n) => { let c=0; for(let i=0;i<NF;i++) if(freeRange(i,d,d+n)) c++; return c; };
const soonestFor = (n, from) => { for(let d=from; d<=DAYS-n; d++) if(countFreeFor(d,n)) return d; return -1; };

/* ── One move away ──────────────────────────────────────────────────────────
   When nothing is free for a stay, a hotel manager doesn't say no — they shuffle
   a room. This finds every stay you COULD take by relocating the guests who are
   in the way.

   TWO RULES ARE HARD, not preferences, because getting either wrong is a guest
   complaint the operator did not earn:

     never smaller  — somebody who booked a 3 BHK does not get moved into a
                      studio to make room for a different booking. Ever.
     never in-house — a guest who has already checked in is not being asked to
                      pack. Only stays that have not started can move.

   Same building is strongly preferred and clearly declared when it cannot be
   had, because five buildings across Hyderabad are five different journeys to
   work, and a guest chose one of them.

   Within the ceiling there is no second-guessing how many guests may be moved.
   That is the operator's call, not the software's — two moves for one long
   booking might be obviously worth it in December and obviously not in June —
   so the count is put in front of them and the options are ranked fewest-first.
   The ceiling itself is MOVE_CEILING (three, declared with the other primitives
   above), and what it excludes is counted and shown rather than dropped.     */
function roomMoves(a, b, pool){
  const out = [];
  movesBeyondCeiling = 0;
  pool.forEach(({f: fl, i: fi})=>{
    if(freeRange(fi, a, b)) return;                      // already free, no move needed
    const blockers = resv.filter(r => r.fi === fi && r.start < b && r.end > a);
    if(!blockers.length) return;
    if(blockers.length > MOVE_CEILING){
      // only counts as "beyond the ceiling" if it could otherwise have worked
      if(!blockers.some(r => isBlock(r) || r.start < 0)) movesBeyondCeiling++;
      return;
    }
    // a block is out of service, not a guest, and cannot be asked to move;
    // neither can somebody already in the room
    if(blockers.some(r => isBlock(r) || r.start < 0)) return;

    /* Hardest first — the longest stay has the fewest places it can go, so
       placing it last is how a solvable shuffle gets wrongly rejected. */
    const order = blockers.slice().sort((x,y)=> (y.end - y.start) - (x.end - x.start));
    const claimed = [];                                  // destinations taken by earlier moves
    const moves = [];
    for(const B of order){
      const from = flats[B.fi];
      let best = null;
      for(let j = 0; j < NF; j++){
        if(j === fi) continue;
        if(SIZE[flats[j].type] < SIZE[from.type]) continue;          // never smaller — hard
        if(!freeRange(j, Math.max(B.start, 0), B.end)) continue;
        // two guests cannot be sent to the same flat for overlapping nights
        if(claimed.some(c => c.fi === j && c.start < B.end && c.end > B.start)) continue;
        const cand = {to: j,
          sameType: flats[j].type === from.type,
          sameBuilding: flats[j].code === from.code,
          bigger: SIZE[flats[j].type] > SIZE[from.type]};
        cand.score = (cand.sameType ? 4 : 0) + (cand.sameBuilding ? 2 : 0) + (cand.bigger ? 1 : 0);
        if(!best || cand.score > best.score) best = cand;
        if(cand.score === 7) break;
      }
      if(!best) return;                                  // this room cannot be freed
      claimed.push({fi: best.to, start: Math.max(B.start, 0), end: B.end});
      moves.push({booking: B, ...best});
    }
    if(!moves.length) return;
    out.push({
      frees: fi, moves,
      sameBuilding: moves.every(m => m.sameBuilding),
      sameType: moves.every(m => m.sameType),
      score: moves.reduce((s,m)=> s + m.score, 0) / moves.length,
    });
  });
  // fewest guests disturbed first, then the least noticeable move
  return out.sort((x,y)=> x.moves.length - y.moves.length || y.score - x.score);
}


/* ── moving somebody for no reason but your own ───────────────────────────────
   Every other move in this app is a consequence: a booking needs the room, or a
   repair does. Sometimes it is neither — a guest asks for a quieter side, two
   parties should be on the same floor, a long stay should not sit in the flat
   you keep showing people. So the guest's own row carries a small control, and
   this is what it lists.

   The two hard rules elsewhere are softened by exactly one step, because this
   is deliberate rather than derived: in-house guests still cannot be asked to
   pack, but a SMALLER flat is offered — separately, and labelled as a downgrade
   — since choosing to put a solo guest in a studio to free a 3 BHK is a real
   decision an operator makes, and refusing to show it would just be the app
   deciding for them. */
function whereCouldGo(b){
  if(!b || isBlock(b) || b.start < 0) return {same:[], smaller:[]};
  const from = flats[b.fi], a = Math.max(b.start, 0);
  const same = [], smaller = [];
  for(let j = 0; j < NF; j++){
    if(j === b.fi) continue;
    if(!freeRange(j, a, b.end)) continue;
    const to = flats[j];
    const o = {to: j,
      sameType: to.type === from.type,
      sameBuilding: to.code === from.code,
      bigger: SIZE[to.type] > SIZE[from.type]};
    o.score = (o.sameType ? 4 : 0) + (o.sameBuilding ? 2 : 0) + (o.bigger ? 1 : 0);
    (SIZE[to.type] < SIZE[from.type] ? smaller : same).push(o);
  }
  const rank = (x, y)=> y.score - x.score || x.to - y.to;
  return {same: same.sort(rank), smaller: smaller.sort(rank)};
}

/* The picker. One row per flat, saying why it is on the list — a room number on
   its own tells you nothing you did not already know. */
function openGuestMove(b, backTo){
  const from = flats[b.fi];
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">Move ${esc(b.guest)}</div>`
    + `<div class="m">${esc(fmt(Math.max(b.start,0)))}–${esc(fmt(b.end))} · `
    + `${b.nights} night${b.nights>1?"s":""} · in ${esc(from.id)} now</div>`;
  const x = el("button", null, "‹"); x.setAttribute("aria-label","Back to the room");
  x.onclick = backTo;
  sheetH.append(t, x);

  const wrap = el("div","bkform");
  const {same, smaller} = whereCouldGo(b);

  const list = (rows, capL, capR, cls)=>{
    if(!rows.length) return;
    const cap = el("div","bkcap");
    cap.append(el("span",null,capL), el("span",null,capR));
    wrap.append(cap);
    const card = el("div","card"); card.style.margin = "0";
    rows.slice(0, 8).forEach(o=>{
      const to = flats[o.to];
      const r = el("button","row move" + (cls ? " " + cls : ""));
      r.append(el("div","id", to.id));
      const m = el("div","meta");
      m.innerHTML = `<b>${esc(to.type)}</b> · ${esc(to.bshort)}`
        + `<em>${o.sameBuilding ? "same building" : "a different building"}`
        + `${o.sameType ? ", same size" : o.bigger ? ", bigger" : ", smaller"}</em>`;
      r.append(m, el("span","pill" + (o.sameBuilding && o.sameType ? " good" : ""),
        o.sameBuilding && o.sameType ? "easiest" : o.sameBuilding ? "same block" : "across town"));
      r.onclick = ()=>{
        haptic(10);
        const mv = {frees: b.fi, moves: [{booking: b, ...o}],
                    sameBuilding: o.sameBuilding, sameType: o.sameType, score: o.score};
        /* deliberate: the move IS the purpose here. Reached from the ⇄ on a
           guest's own row, not from "free up this flat", so there is no
           booking that was supposed to follow it. */
        /* DONE GOES WHERE THE GUEST WENT. This said "Done — back to 3B" and
           opened the flat the guest had just LEFT — which is the right ending
           for "free up this flat", where the freed room is the point, and the
           wrong one for a move started from a person. The operator taps Done,
           lands on the old room, sees no sign of the guest they just moved and
           reads it as the app not having updated. Show them the flat the guest
           is now in, which is the thing they actually wanted to confirm. */
        const day = Math.max(b.start, 0);
        openMove(mv, day, ()=> openSheet(o.to, day),
          {title: `Move ${b.guest}`, cta: `Done — see ${flats[o.to].id}`, deliberate:true});
      };
      card.appendChild(r);
    });
    wrap.append(card);
  };

  list(same, "Where to", "same size or bigger");
  list(smaller, "Smaller", "they would be downgraded", "warn");

  if(!same.length && !smaller.length){
    const none = el("p","movenote");
    none.style.margin = "4px 0 0";
    none.innerHTML = `Nowhere is free for all ${b.nights} of `
      + `<b>${esc(b.guest)}</b>'s nights, so there is nobody to swap with either. `
      + `Shorten the stay or wait for a cancellation.`;
    wrap.append(none);
  }
  sheetB.append(wrap);
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* ── the wall, and whether it can be moved ────────────────────────────────────
   An out-of-service run stops dead the day a guest arrives, and the app used to
   say so and stop there — which is a fact, not an answer. The same shuffle that
   frees a room for a booking frees it for a plumber, so the question "can this
   stay out longer" gets the same treatment: name the guest in the way, name
   where they could go, and say how much longer that buys.                     */
function moveFor(B){
  if(!B || isBlock(B) || B.start < 0) return null;      // in-house guests do not pack
  const opts = roomMoves(B.start, B.end, [{f: flats[B.fi], i: B.fi}]);
  return opts.length ? opts[0] : null;
}

/* How far the block could then run, treating the guests who are moving as gone
   and everything else — another block, a stay nobody offered to move — as the
   real wall it is. */
function extendAfter(block, mv){
  const moved = new Set(mv.moves.map(m => m.booking));
  const from = Math.max(block.end, 0);
  let n = 0;
  while(n < 30 && from + n < DAYS){
    const d = from + n;
    if(resv.some(r => r.fi === block.fi && r !== block && !moved.has(r)
                      && r.start <= d && r.end > d)) break;
    n++;
  }
  return n;
}

/* The operator's real morning question isn't "how many are free" — it's
   who is arriving, who is leaving, and which rooms have to be turned around
   between a checkout and a check-in on the same day. */
function dayOps(d){
  const arrivals = bookings().filter(r => r.start === d).sort((a,b)=> a.fi - b.fi);
  const departures = bookings().filter(r => r.end === d).sort((a,b)=> a.fi - b.fi);
  const arrivingIn = new Set(arrivals.map(r => r.fi));
  const turnovers = departures.filter(r => arrivingIn.has(r.fi))
    .map(r => ({ fi:r.fi, out:r, in:arrivals.find(a => a.fi === r.fi) }));
  return { arrivals, departures, turnovers };
}

  s.textContent = "";

  const opsDate = el("div","ops-date");

    {key:"arrivals",   label:"Arriving"},
    {key:"departures", label:"Leaving"},

  ];

    const b = el("button","op");
    const nEl = el("b"), sEl = el("s",null,o.label);

  hero.append(opsDate, opsRow);

  /* stay-length dial: every night in the strip re-counts for a stay of this many nights */

  seg.appendChild(ind);
  STAYS.forEach((v,i)=>{
    const b = el("button",null, v===1 ? "1 night" : `${v} nights`);
    b.onclick = ()=>{ haptic(9); stayNights = v; paint(); };
    seg.appendChild(b);
  });
  stayWrap.append(sh, seg);

  const nightsWrap = el("div","stack gap-s");
  const nh = el("div","sect");
  nh.append(el("span","lbl","The next two weeks"), el("span","lbl","tap an arrival night"));
  const nights = el("div","nights");
  for(let d=0; d<STRIP; d++){
    const dt = dateAt(d);
    const c = el("button","night" + (d===0?" today":""));
    c.dataset.d = d;
    const lab = el("div","d");
    // on the 1st the month replaces the weekday, so a month boundary never reads as a bare number
    lab.append(el("span",null,
      d===0 ? "TDY" : dt.getDate()===1 ? MON[dt.getMonth()].toUpperCase() : DOW[dt.getDay()].toUpperCase()));
    lab.append(el("em",null, String(dt.getDate())));
    c.append(lab, el("div","n","0"));
    const t = el("div","t"); t.appendChild(el("i"));
    c.appendChild(t);
    c.onclick = ()=>{ haptic(9); setPickedNight(d); paint(); };
    nights.appendChild(c);
  }
  nightsWrap.append(nh, nights);

  const tilesWrap = el("div","stack gap-s");
  const th = el("div","sect");
  const thLeft = el("span","lbl"), thRight = el("span","lbl");
  const reset = el("button","pill");
  reset.textContent = "Today";
  reset.style.cssText = "display:none;margin-left:8px;flex:0 0 auto";
  reset.setAttribute("aria-label","Back to tonight");
  reset.onclick = ()=>{ haptic(9); setPickedNight(0); paint(); };
  thLeft.style.cssText = "white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
  thRight.style.cssText = "white-space:nowrap;flex:0 0 auto";
  const leftBox = el("div");
  leftBox.style.cssText = "display:flex;align-items:center;min-width:0;flex:1";
  leftBox.append(thLeft, reset);
  th.append(leftBox, thRight);
  /* null is every building. Held on the screen rather than globally: it is a
     way of looking at tonight, not a setting, and it should not outlive the tab
     the way the stay dial deliberately does. */
  let roomFilt = null;
  const filt = el("div","roomfilt");
  const tiles = el("div");
  tilesWrap.append(th, filt, tiles);

  const note = el("div","dataTools");

  const inv = el("button","copybtn");
  inv.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="2.8" y="7.4" width="14.4" height="9.8" rx="2"/><path d="M2.8 11.4h14.4M7.2 7.4V4.2a1.4 1.4 0 0 1 1.4-1.4h2.8a1.4 1.4 0 0 1 1.4 1.4v3.2"/></svg>'
    + `<span>Inventory · ${NF} flats</span>`;
  inv.onclick = ()=>{ haptic(10); openInventory(); };
  note.appendChild(inv);

  s.append(hero, stayWrap, nightsWrap, tilesWrap, note);

  function paint(){
    const d = pickedNight, n = stayNights;

    // dial
    const si = STAYS.indexOf(n);
    ind.style.width = `calc((100% - 6px)/${STAYS.length})`;
    ind.style.transform = `translateX(${si*100}%)`;
    [...seg.querySelectorAll("button")].forEach((b,i)=>b.setAttribute("aria-pressed", i===si));

    // every night re-counted for a stay of n nights
    nights.querySelectorAll(".night").forEach(c=>{
      const cd = +c.dataset.d, f = countFreeFor(cd, n);
      c.classList.toggle("sel", cd === d);
      c.classList.toggle("full", f === 0);
      c.querySelector(".n").textContent = f;
      c.querySelector(".t i").style.width = (f/NF*100).toFixed(0)+"%";
      c.setAttribute("aria-label",
        `Arrive ${fmtL(cd)}, ${f} of ${NF} rooms free for ${n} night${n>1?"s":""}`);
    });

    const f = countFreeFor(d, n);

    // the day's board follows the selection, like everything else on this screen
    const dt = dateAt(d), ops = dayOps(d);
    opsDateB.textContent = `${DOWF[dt.getDay()]} ${dt.getDate()} ${MONF[dt.getMonth()]}`;
    opsDateS.textContent = d===0 ? "today" : d===1 ? "tomorrow" : `in ${d} days`;
    opEls.forEach(o=>{
      const list = ops[o.key], c = list.length;
      o.nEl.textContent = c;
      o.b.classList.toggle("zero", c === 0);
      o.b.classList.toggle("alert", o.key === "turnovers" && c > 0);
      o.b.setAttribute("aria-label",
        `Show the ${c} ${o.key === "turnovers" ? "same-day turnarounds" : o.key} on ${fmtL(d)}`);
    });

    scrSub.textContent = n === 1
      ? `${f} of ${NF} free · ${d===0 ? "tonight" : fmtL(d)}`
      : `${f} of ${NF} free · ${fmt(d)} → ${fmt(d+n)}`;

    thLeft.textContent = "Every room";
    thRight.textContent = n === 1 ? fmtL(d) : `${fmt(d)} → ${fmt(d+n)}`;
    reset.style.display = d===0 ? "none" : "inline-flex";

    tiles.textContent = "";
    filt.hidden = f === 0;
    if(f === 0){
      // a dead end is still a question worth answering: when *is* this stay possible?
      tiles.style.display = "block";
      const box = el("div","card"); box.style.padding = "20px 18px";
      const soon = soonestFor(n, d+1);
      const head = el("p");
      head.style.cssText = "margin:0;font-size:15px;font-weight:600;letter-spacing:-.018em;line-height:1.4";
      head.textContent = `No room takes a ${n}-night stay arriving ${fmtL(d)}.`;
      box.appendChild(head);

      const moves = roomMoves(d, d+n, flats.map((f,i)=>({f,i})));
      if(moves.length){
        /* roomMoves returns {frees, moves:[{booking, to, …}], …} — one entry per
           room, carrying EVERY guest that has to shift. This read used the shape
           from before the multi-guest shuffle landed (mv.to, mv.booking), which
           are both undefined now, so the dead-end card threw on B.guest and took
           the whole room grid down with it. moves[] is sorted fewest-first. */
        const mv = moves[0], from = flats[mv.frees], k = mv.moves.length;
        const B = mv.moves[0].booking, to = flats[mv.moves[0].to];
        const p = el("p");
        p.style.cssText = "margin:10px 0 0;font-size:13px;color:var(--txt-2);line-height:1.55";
        p.innerHTML = k === 1
          ? `But you are <b class="hi-now">one move away</b> — shift `
            + `<b style="color:var(--txt)">${esc(B.guest)}</b> from ${from.id} to ${to.id} `
            + `(${fmt(B.start)}–${fmt(B.end)}${mv.sameType ? ", same size" : ""}) and ${from.id} opens up.`
          : `But <b class="hi-now">${k} moves</b> would free it — shift `
            + `<b style="color:var(--txt)">${k} guests</b> out of ${from.id}, starting with `
            + `${esc(B.guest)} to ${to.id}${mv.sameType ? ", same size" : ""}.`;
        box.appendChild(p);
        /* And a way to actually do it. This card named the exact move and then
           left you to go and find it — Rooms, the flat, the guest's row, the ⇄,
           the destination: five steps to perform the one thing the sentence had
           already worked out. The Ask tab has offered the move as a tap since it
           was written; the same stage, opened the same way, with the booking
           that prompted the question waiting on the other side of it. */
        const doIt = el("button","bkgo");
        doIt.style.marginTop = "12px";
        doIt.textContent = k === 1 ? `Move ${B.guest}` : `Move ${k} guests`;
        doIt.onclick = ()=>{ haptic(12); openMove(mv, d, fi => openBooking(fi, d, n)); };
        box.appendChild(doIt);
      }
      if(soon >= 0){
        const sc = countFreeFor(soon, n);
        const p = el("p");
        p.style.cssText = "margin:8px 0 14px;font-size:13px;color:var(--txt-2);line-height:1.5";
        p.innerHTML = `Soonest it works is <b style="color:var(--txt)">${fmtL(soon)}</b> — ${sc} room${sc>1?"s":""}.`;
        const jump = el("button","copybtn");
        jump.textContent = soon < STRIP ? `Jump to ${fmt(soon)}` : `Open ${fmt(soon)} in Month`;
        jump.onclick = ()=>{ haptic(10);
          if(soon < STRIP){ setPickedNight(soon); paint(); } else goMonth(soon); };
        box.append(p, jump);
      } else {
        const p = el("p");
        p.style.cssText = "margin:8px 0 0;font-size:13px;color:var(--txt-2);line-height:1.5";
        p.textContent = `Nothing in the next nine weeks has ${n} consecutive nights open. Try a shorter stay.`;
        box.appendChild(p);
      }
      tiles.appendChild(box);
    } else {
      tiles.style.display = "";
      const B = buildingsOf();
      /* freeSpan(fi, FROM, TO) takes an END DAY, not a night count. Passing `n`
         made the third argument 1 or 3 regardless of which night was picked, so
         for any d > 0 the range ran backwards, freeRange returned vacuously
         true, and EVERY flat counted as free: 38 of 38 on a night where 18 were
         really free. Tonight was right by accident, d + n === n at d = 0, which
         is exactly why it survived being looked at. */
      const freeIn = code => flats.reduce((a,fl,fi)=>
        a + (fl.code === code ? (freeSpan(fi, d, d + n) ? 1 : 0) : 0), 0);

      /* A filter that can strand you shows only what it can reach. If the
         picked building has nothing free for this stay the chip still says so
         — a zero is an answer — but a filter left pointing at a building that
         no longer exists (deleted in the inventory editor) falls back to all. */
      if(roomFilt && !B.some(b => b.code === roomFilt)) roomFilt = null;

      filt.textContent = "";
      const chip = (code, label, count)=>{
        const b = el("button");
        b.append(el("span", null, label), el("i", count ? null : "none", String(count)));
        b.setAttribute("aria-selected", roomFilt === code);
        b.setAttribute("aria-label", code
          ? `Show only ${label}, ${count} free`
          : `Show every building, ${count} free`);
        b.onclick = ()=>{ haptic(9); roomFilt = code; paint(); };
        filt.appendChild(b);
        return b;
      };
      chip(null, "All", f);
      B.forEach(b=> chip(b.code, b.short || b.name, freeIn(b.code)));

      const show = B.filter(b=> !roomFilt || b.code === roomFilt);
      show.forEach(b=>{
        const mine = flats.map((fl,fi)=>({fl,fi})).filter(x=> x.fl.code === b.code);
        if(!mine.length) return;
        const sec = el("div","bsec");
        /* One building on screen is already named by the selected chip, so the
           header would be saying it twice. */
        if(!roomFilt){
          const h = el("div","bsec-h");
          const free = mine.reduce((a,x)=> a + (freeSpan(x.fi, d, d + n) ? 1 : 0), 0);
          const cnt = el("s", null, free ? `${free} of ${mine.length} free` : `all ${mine.length} booked`);
          if(!free) cnt.className = "none";
          h.append(el("b", null, b.short || b.name), cnt);
          sec.appendChild(h);
        }
        const g = el("div","tiles");
        mine.forEach(x=> g.appendChild(roomTile(x.fi, d, n)));
        sec.appendChild(g);
        tiles.appendChild(sec);
      });
    }

    const sel = nights.querySelector(".night.sel");
    if(sel) sel.scrollIntoView({behavior: calm?"auto":"smooth", block:"nearest", inline:"nearest"});
  }
  paint();
}

/* ═══════════════ SCREEN 2 — MONTH ═══════════════ */
let monthOffset = 0, revealPanel = false;
/* One selection, always: `sel.a` is the arrival, `sel.n` the nights. A single
   night is just n = 1. `pendingStart` is set after the first of two taps. */
let sel = {a:0, n:1}, pendingStart = null;
/* THE CALENDAR EARNS ITS HEIGHT ONLY WHILE YOU ARE CHOOSING.
   The frame fixed the scrolling but split the screen the wrong way: the
   calendar held 224px and the answer — the thing the tab exists to produce —
   got 198px, three and a bit rows, for a list that is routinely forty flats.
   Once two dates are set the grid has done its job; it does not need four weeks
   on screen while the operator reads names down the phone.
   So it leans. A completed selection collapses it to two rows and hands the
   difference to the list; touching a date, or a check-in / check-out field,
   stands it back up because those are the acts of choosing again. No new
   gesture, no dismissal, and nothing moves during a sweep — the flag is only
   ever set on release. */
let calLean = false;
let sweptJustNow = false, sweepLive = false;

/* Press-and-hold on a date, then drag: the calendar becomes a range picker and
   the readout above it counts rooms free for the WHOLE span as you move. This
   is the question a caller actually asks, answered by dragging a finger. */
/* The touch pair below has to sit on the WINDOW — a touch that ends off the grid
   must still clean up — but renderMonth() rebuilds grid and hud and calls
   attachSweep on every paint, and a window listener outlives the nodes it closed
   over. Binding them per call added two permanent listeners per render, each
   holding a detached grid and hud alive: six Rooms↔Month switches measured six of
   each added and none removed, on the tab PRODUCT.md says is swiped fifty times a
   day. So the window keeps ONE pair for the life of the page and attachSweep only
   swaps what they call. attachStripScrub states this rule in its own comment. */
let sweepNow = null;
addEventListener("touchend",    ()=>{ sweepNow && sweepNow.end();    }, {passive:true});
addEventListener("touchcancel", ()=>{ sweepNow && sweepNow.cancel(); }, {passive:true});

function attachSweep(grid, hud){
  let hold = null, live = false, a = null, b = null, hx = 0, hy = 0;

  const cellAt = (x,y)=>{
    const e = document.elementFromPoint(x,y);
    return e && e.closest ? e.closest(".day[data-d]") : null;
  };
  /* THE HUD MUST NOT MOVE THE CALENDAR.
     .hud is display:none until a sweep begins, and a display:none flex child
     contributes no gap — so switching it on adds three things at once: the
     HUD's own height, its 12px bottom margin, and a 30px column gap that did
     not exist a moment ago. Measured on the phone width: the calendar drops
     100px against a 55px cell pitch.

     That is 1.8 rows, and it happens with the thumb already pressed down. The
     sweep resolves the finger with elementFromPoint on every touchmove, so the
     first drag after the 260ms hold reads a cell almost two rows above the
     date the operator actually pressed. PRODUCT.md names reading the wrong row
     as THE failure mode of this app, and this is that failure on its headline
     gesture — the one the whole Month tab is built around.

     The scroller grew by exactly H at a point above the calendar, so scrolling
     it down by H puts every pixel below the HUD back where the thumb left it.
     Measured rather than assumed, because the HUD's height depends on whether
     its second line wraps. Reading the rect after the class change forces the
     sync layout deliberately: the compensation has to land in the same frame
     as the growth, or the calendar visibly jumps and then jumps back. */
  /* shift() is gone. It existed because the HUD appeared above the grid and
     paid for its own height by nudging the screen's scrollTop — which is how it
     came to drag the calendar out from under a thumb, and which would have gone
     silently wrong the moment the screen stopped scrolling. The HUD is fixed
     chrome below the grid now and cannot move it, so there is nothing to
     compensate for. Deleted, not repaired. */
  const paint = ()=>{
    const lo = Math.min(a,b), hi = Math.max(a,b);
    grid.querySelectorAll(".day[data-d]").forEach(c=>{
      const d = +c.dataset.d;
      c.classList.toggle("rng", d > lo && d < hi);
      c.classList.toggle("rngA", d === lo);
      c.classList.toggle("rngB", d === hi && hi !== lo);
    });
    const nights = Math.max(1, hi - lo);
    const free = flats.filter((f,i)=>freeRange(i, lo, lo + nights)).length;
    /* THE HUD CANNOT MOVE THE CALENDAR ANY MORE, and that is now structural
       rather than compensated. It used to be display:none until a sweep began,
       sitting ABOVE the grid — so arming it added its height, its margin and a
       column gap that did not exist a moment before, and the calendar dropped
       100px against a 55px cell pitch with a thumb already pressed down. The
       sweep resolves the finger with elementFromPoint on every touchmove, so
       the first drag after the hold read a cell nearly two rows above the date
       pressed. PRODUCT.md names the wrong-row read as THE failure mode here.
       That was fixed by measuring the growth and nudging scrollTop to match,
       which worked and would have failed silently the moment the screen stopped
       scrolling — as it now has. So the fix was replaced rather than kept: the
       HUD is permanent, fixed-height chrome BELOW the grid. Nothing to
       compensate, nothing to get wrong later. */
    hud.classList.add("on");
    const n = hud.querySelector(".n"), t = hud.querySelector(".t");
    n.textContent = free;
    n.classList.toggle("none", free === 0);
    t.innerHTML = `free for <b>all ${nights} night${nights>1?"s":""}</b> · ${fmt(lo)} → ${fmt(lo+nights)}`;
  };
  const clear = ()=>{
    grid.querySelectorAll(".rng,.rngA,.rngB").forEach(c=>c.classList.remove("rng","rngA","rngB"));
  };
  const begin = (cell)=>{
    live = true; sweepLive = true; a = b = +cell.dataset.d;
    grid.classList.add("sweeping");
    haptic(18); paint();
  };
  const move = (x,y)=>{
    if(!live) return;
    const cell = cellAt(x,y);
    if(cell){ const d = +cell.dataset.d; if(d !== b){ b = d; haptic(5); paint(); } }
  };
  /* Never leave the page in a half-swept state — a stuck `live` means every
     later touchmove calls preventDefault and the page stops scrolling. */
  const reset = ()=>{
    clearTimeout(hold);
    live = false; sweepLive = false;
    grid.classList.remove("sweeping");
  };
  const end = ()=>{
    const was = live, lo = Math.min(a,b), hi = Math.max(a,b);
    reset();
    if(!was) return;
    sel = {a: lo, n: Math.max(1, hi - lo)};
    pendingStart = null; sweptJustNow = true; revealPanel = true; calLean = true;
    haptic(16);
    setTimeout(()=>{ sweptJustNow = false; }, 350);
    renderMonth();
  };

  grid.addEventListener("touchstart", e=>{
    const cell = e.target.closest && e.target.closest(".day[data-d]");
    if(!cell) return;
    clearTimeout(hold);
    hx = e.touches[0].clientX; hy = e.touches[0].clientY;
    hold = setTimeout(()=>begin(cell), 260);
  }, {passive:true});
  grid.addEventListener("touchmove", e=>{
    /* ANY movement used to cancel the hold, with no slop at all — and nothing on
       screen says the hold has armed until begin() fires its haptic at 260ms.
       So a few pixels of thumb tremor while waiting silently disarmed the range
       sweep and the touch resolved as a plain tap. It only cancels now for a
       movement that could actually be the vertical scroll the guard is for:
       past 10px, and more vertical than horizontal. Desktop never had this —
       mousedown arms the same timer and no mousemove cancels it. */
    if(!live){
      const dx = Math.abs(e.touches[0].clientX - hx), dy = Math.abs(e.touches[0].clientY - hy);
      if(dy > 10 && dy > dx) clearTimeout(hold);
      return;
    }
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  // hand this render's handlers to the window pair registered once above
  sweepNow = {end, cancel: ()=>{ reset(); clear(); hud.classList.remove("on"); }};

  // desktop: hold the mouse down and drag
  grid.addEventListener("mousedown", e=>{
    const cell = e.target.closest && e.target.closest(".day[data-d]");
    if(!cell) return;
    clearTimeout(hold);
    hold = setTimeout(()=>begin(cell), 260);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = ()=>{ end(); removeEventListener("mousemove",mm); removeEventListener("mouseup",mu); };
    addEventListener("mousemove", mm); addEventListener("mouseup", mu);
  });
}
function monthList(){
  const out = [];
  for(let d=0; d<DAYS; d++){
    const dt = dateAt(d), k = dt.getFullYear()+"-"+dt.getMonth();
    if(!out.length || out[out.length-1].k!==k) out.push({k, y:dt.getFullYear(), m:dt.getMonth(), days:[]});
    out[out.length-1].days.push(d);
  }
  return out;
}
function goMonth(day){
  const ms = monthList();
  const dt = dateAt(day);
  const i = ms.findIndex(m=>m.y===dt.getFullYear() && m.m===dt.getMonth());
  if(i>=0) monthOffset = i;
  sel = {a:day, n:1}; pendingStart = null;
  switchTo(1);
  /* The months all render now, so "go to September" is a scroll rather than a
     page turn. Bring the day itself into view — the label alone would leave the
     date the caller asked about somewhere below the fold. */
  requestAnimationFrame(()=>{
    const cell = document.querySelector(`.day[data-d="${day}"]`);
    if(cell) cell.scrollIntoView({behavior: calm ? "auto" : "smooth", block:"center"});
  });
}
/* A fade means "there is more this way", so an edge only fades where there IS
   more. Toggles the two classes the mask reads, on scroll and once immediately.
   Hoisted out of renderMonth when the booking form's channel row grew past the
   width of a phone: the rule is the app's, not the calendar's, and a second
   copy of it is a second chance for the two to disagree. */
const edges = (box, axis)=>{
  const mark = ()=>{
    const pos  = axis === "x" ? box.scrollLeft : box.scrollTop;
    const size = axis === "x" ? box.clientWidth : box.clientHeight;
    const full = axis === "x" ? box.scrollWidth : box.scrollHeight;
    box.classList.toggle("moreAbove", pos > 1);
    box.classList.toggle("moreBelow", pos + size < full - 1);
  };
  box.addEventListener("scroll", mark, {passive:true});
  /* now, not next frame — rAF does not fire in a backgrounded tab and this
     decides whether the first row of dates is dimmed */
  mark();
  return mark;
};

function renderMonth(){
  const s = document.getElementById("scr-month");
  s.textContent = "";
  const ms = monthList();

  /* The month nav is gone. See the .mlab note in the stylesheet: the book is
     three months and eleven rows, and paging it was the sole reason a stay
     could not cross a boundary. monthOffset survives only as "which month did
     someone ask to look at", used by goMonth to scroll there. */

  /* live readout while sweeping a range across the calendar */
  const hud = el("div","hud");
  hud.append(el("div","n"), el("div","t"));

  const norm = weekdayFreeNorm();
  const soft = softDates(norm);
  const softSet = new Set(soft.map(x=>x.d));

  /* `bare` rather than an inline background:transparent. The inline rule
     suppressed the FILL but a stylesheet backdrop-filter is invisible to it,
     and a brightness lift over the calendar's empty regions — the pad days
     before the 1st, the gap after the 31st — is exactly the lit rectangle that
     made this look like a tray. The class turns the whole material off. */
  const cal = el("div","card bare");
  cal.style.padding = "14px";

  /* ── the picker head ──────────────────────────────────────────────────────
     The two dates about to be read down the phone, and how many nights that
     is. Which field is underlined says what the NEXT tap sets — the calendar
     has always worked in two taps and the only thing that ever said so was a
     sentence under the grid. Tapping a field arms that end, so fixing a
     departure no longer means re-picking the arrival. */
  const head = el("div","pick");
  const armed = pendingStart !== null;          // waiting for a departure
  const inD  = armed ? pendingStart : sel.a;
  const outD = armed ? null : sel.a + sel.n;
  const fIn  = el("button","pf" + (armed ? "" : " on"));
  fIn.append(el("s",null,"CHECK-IN"), el("b",null,fmtL(inD)));
  fIn.setAttribute("aria-label", `Check-in ${fmtL(inD)}. Tap to choose a new arrival.`);
  const fOut = el("button","pf" + (armed ? " on empty" : ""));
  fOut.append(el("s",null,"CHECK-OUT"),
              el("b",null, outD == null ? "Pick a date" : fmtL(outD)));
  fOut.setAttribute("aria-label", outD == null
    ? "Check-out not chosen. Tap a date to set it."
    : `Check-out ${fmtL(outD)}. Tap to choose a new departure.`);
  /* Tapping CHECK-IN clears the pending departure and starts again from this
     arrival; tapping CHECK-OUT arms the departure against the arrival already
     chosen. Both are the same two-tap model, entered from either end. */
  fIn.onclick  = ()=>{ haptic(8); pendingStart = null; calLean = false;
                       sel = {a: inD, n: Math.max(1, sel.n)}; renderMonth(); };
  fOut.onclick = ()=>{ haptic(8); pendingStart = sel.a; calLean = false; renderMonth(); };
  const fields = el("div","pfs");
  fields.append(fIn, fOut);
  head.appendChild(fields);
  /* Nights, as a control rather than a readout. Half the time the request
     arrives as a LENGTH — "from the 28th for five nights" — not as two dates,
     and answering that by hunting for the departure on a calendar is doing
     arithmetic the app can do. It also sidesteps the month boundary entirely:
     spinning to five nights never needs September to be on screen.
     Same model underneath — it moves the departure and leaves the arrival
     alone, which is what the caller just did. */
  const pn = (!armed && sel.n >= 1) ? el("div","pn") : null;
  if(pn){
    const less = el("button",null,"−"), more = el("button",null,"+");
    less.setAttribute("aria-label","One night fewer");
    more.setAttribute("aria-label","One night more");
    const nn = el("b", null, `${sel.n} night${sel.n>1?"s":""}`);
    less.disabled = sel.n <= 1;
    more.disabled = sel.a + sel.n >= DAYS;
    const setN = n => { haptic(6); sel = {a: sel.a, n: Math.max(1, Math.min(n, DAYS - sel.a))};
                        renderMonth(); };
    less.onclick = ()=> setN(sel.n - 1);
    more.onclick = ()=> setN(sel.n + 1);
    pn.append(less, nn, more);
  }
  cal.appendChild(head);

  const dow = el("div","dow");
  ["M","T","W","T","F","S","S"].forEach(d=>dow.appendChild(el("span",null,d)));
  const grid = el("div","cal");
  /* ONE UNBROKEN GRID. Restarting at every month meant a month ending mid-week
     left a stub row — 31 August alone in a row of seven — and the next month
     opened with its own lead pads. Two part-empty rows at every boundary, about
     55px each, on the screen whose whole problem is that the answer does not
     fit. Nine weeks crosses two or three boundaries.

     Now the weeks just run on, the way they do on a wall calendar: Mon 31 Aug
     sits in the same row as Tue 1 Sep. The month change is marked where it
     actually happens — a seam down the left edge of the 1st, and that cell
     naming its month instead of just its number. The sticky label above the
     trough still says which month you are looking at as you scroll, so nothing
     is lost by dropping the full-width divider that used to force the break. */

  let seamAt = -1;                       // the one 1st that shares a row with the 31st
  /* Which month starts open a NEW ROW. ms[0] is where the grid begins and ms[1]
     is the one merged boundary, so everything from ms[2] on breaks — decided
     here rather than during layout so makeDay can cap a band against it without
     depending on the order cells happen to be built in. */
  const breakBefore = new Set(ms.slice(2).map(m => m.days[0]));
  const makeDay = (d)=>{
    const dt = dateAt(d), f = freeCount(d);
    const c = el("button","day");
    if(d===0) c.classList.add("today");
    if(f===0) c.classList.add("none");
    const lo = sel.a, hi = sel.a + sel.n;
    /* Where the band is capped, decided here because this is the only place
       that knows the column. A cap closes the band: at the two ends of the
       range, and at both ends of every week — a stay that crosses a Sunday is
       drawn as two bars, the way it is on paper, not as one wrapping ribbon. */
    const col = (dt.getDay()+6)%7;
    const capL = ()=> c.classList.add("capL"), capR = ()=> c.classList.add("capR");
    if(pendingStart === d){
      // one date armed and waiting for its partner — a closed pill, no bleed
      c.classList.add("rngA"); capL(); capR();
    }
    else if(sel.n > 1){
      if(d === lo)              { c.classList.add("rngA"); capL(); if(col===6) capR(); }
      else if(d === hi)         { c.classList.add("rngB"); capR(); if(col===0) capL(); }
      else if(d > lo && d < hi) { c.classList.add("rng");
                                  if(col===0) capL(); if(col===6) capR(); }
      /* Caps at the boundaries that BREAK, and none at the one that merges.
         A band running past the 31st into a month that starts a fresh row would
         otherwise run off an edge that is not a week edge, and pick up again
         across a run of pads — the ribbon drawn through empty cells that made
         these caps necessary in the first place. Across the merged seam there
         is no break to draw: 31 August and 1 September are neighbours, and a
         stay over them is one stay. */
      if(breakBefore.has(d + 1) && d < hi) capR();
      if(breakBefore.has(d) && d > lo)     capL();
    }
    else if(d === lo)           c.classList.add("sel");
    if(softSet.has(d)) c.classList.add("soft");
    /* The 1st says which month it is, because in a continuous grid nothing else
       in the row does. Everything else is just its number, as before. */
    const first = dt.getDate() === 1;
    if(first) c.classList.add("mstart");
    if(d === seamAt) c.classList.add("seam");
    c.append(el("div","dd", first ? "1 " + MON[dt.getMonth()] : String(dt.getDate())),
             el("div","fn",String(f)));
    const g = el("div","gg"); const i = el("i");
    i.style.width = (f/NF*100).toFixed(0)+"%";
    g.appendChild(i); c.appendChild(g);
    c.setAttribute("aria-label", `${fmtL(d)}, ${f} of ${NF} rooms free`
      + (softSet.has(d) ? `, emptier than a typical ${DOWF[dt.getDay()]}` : ""));
    c.dataset.d = d;
    /* Two taps make a range, the way every booking site works: first tap is the
       arrival and shows that night, second tap sets the departure. */
    c.onclick = ()=>{
      if(sweptJustNow) return;
      if(pendingStart !== null && d > pendingStart){
        sel = {a: pendingStart, n: d - pendingStart};
        pendingStart = null;
        calLean = true;                 // chosen — give the room to the answer
      } else {
        sel = {a: d, n: 1};
        pendingStart = d;
        calLean = false;                // choosing — the grid needs its height
      }
      revealPanel = true; haptic(9); renderMonth();
    };
    grid.appendChild(c);
  };

  /* 63 days crosses a new year about once a year; the rest of the time the
     year is four characters of noise on every divider. */
  /* 63 days crosses a new year about once a year; the rest of the time the
     year is four characters of noise on the sticky label. */
  const crossesYear = ms.some(x => x.y !== ms[0].y);
  /* ONE BOUNDARY MERGES, THE REST BREAK.

     Running every month into the next saved a row at each boundary but cost
     something worth more further out: nine weeks of undifferentiated cells, in
     which September and October are one long ribbon and the eye has nothing to
     count from. Breaking at every boundary cost two part-empty rows each time,
     which is what started this.

     So the merge is spent where it is worth spending — on the boundary the
     operator is actually living through. The current month runs straight into
     the next, because "the 31st to the 3rd" is this week's booking and both
     ends have to be reachable without the grid restarting under the thumb.
     Every later month opens on its own row, the way a calendar reads, because
     out there the question is "how does October look", not "can I cross this
     Sunday".

     The merged seam is drawn; the broken ones need no mark, because starting a
     row IS the mark. */
  let col = 0;
  const cell = n => { for(let i=0;i<n;i++) grid.appendChild(el("div","day pad")); col = (col + n) % 7; };
  ms.forEach((m, mi)=>{
    const lead = (dateAt(m.days[0]).getDay()+6)%7;
    if(mi === 0){ cell(lead); }
    else if(mi === 1){
      /* merged: no break, no pads — the 1st simply follows the 31st. It carries
         the seam UNLESS it happens to fall at the start of a row anyway, where
         a rule down the left edge of the card would mark nothing. */
      seamAt = col === 0 ? -1 : m.days[0];
    } else {
      cell((7 - col) % 7 + lead);          // finish the row, then lead in
    }
    m.days.forEach(d=>{ makeDay(d); col = (col + 1) % 7; });
  });
  cal.style.padding = "0";
  /* the grid scrolls inside a bounded trough; the weekday bar stays above it as
     fixed chrome, because a header that scrolls away is a header you look for */
  const trough = el("div","calscroll" + (calLean ? " lean" : ""));
  trough.appendChild(grid);

  /* An edge only fades when there is something past it. Applied to whichever
     axis the box scrolls on, so the same two class names serve the vertical
     calendar and the horizontal chip row. */
  /* Which month is under the top of the trough, said once, above it. Recomputed
     on scroll from the first day cell still visible — cheap, and it cannot
     disagree with the grid because it is read FROM the grid. */
  const now = el("div","monthnow");
  const nowLab = el("b", null, "");
  now.appendChild(nowLab);
  const sayMonth = ()=>{
    /* MEASURED AGAINST THE GRID, NOT THE SCREEN. offsetTop is taken from the
       nearest POSITIONED ancestor, and neither .calscroll nor .cal is
       positioned — so every cell's offsetTop carried the height of everything
       above the trough (the picker head, this label, the weekday bar: 118px)
       while scrollTop is 0-based. The label ran 118px — two rows — behind the
       grid, and the LAST month in the horizon was never named at all, because
       its flip threshold sat past the end of the scroll range.

       Measured over the full scroll range at 375x812: wrong for 170px of 373,
       and the only two strings it ever showed were August and September, with
       October never appearing. Subtracting grid.offsetTop takes it to 0.

       This is the same coordinate mistake the reveal-scroll below was already
       fixed for, and it matters more since the full-width month divider went:
       at the merged seam this label and a 2px dashed rule are the only things
       marking the month change. */
    const base = grid.offsetTop;
    const top = trough.scrollTop;
    let first = null;
    for(const c of grid.querySelectorAll(".day[data-d]")){
      if(c.offsetTop - base + c.offsetHeight > top + 2){ first = c; break; }
    }
    /* Before the first layout every offsetTop is 0, so nothing satisfies the
       test above and the label stayed empty until the next frame — at which
       point it grew from its min-height and pushed the grid down 2px. Small,
       and exactly the class of thing that moves a target out from under a
       thumb. Fall back to the first cell so the label is right from the start. */
    if(!first) first = grid.querySelector(".day[data-d]");
    if(!first) return;
    const dt = dateAt(+first.dataset.d);
    nowLab.textContent = MONF[dt.getMonth()] + (crossesYear ? ` ${dt.getFullYear()}` : "");
  };
  trough.addEventListener("scroll", sayMonth, {passive:true});
  requestAnimationFrame(sayMonth);
  sayMonth();

  cal.append(now, dow, trough);
  const markCal = edges(trough, "y");

  /* ── the spans a caller actually names ────────────────────────────────────
     Not a generic set of presets. These are the four things said on the phone —
     "just tonight", "the weekend", "three nights", "a week" — so the common
     case stops being two taps on a grid and becomes one. They anchor on the
     arrival already chosen, except the weekend, which is a date rather than a
     length and so sets both ends.
     Clear is plain text, quieter on purpose: it undoes, it does not offer. */
  const bar = el("div","picks");
  /* The nights control sits with the presets, not with the dates. Both are
     answers to "how long", and putting them together leaves the picker line as
     just the two dates — which is the thing being read down the phone and had
     been sharing 335px with a 124px stepper. It also stops the tab saying
     "4 nights" twice, once here and once in the count line below. */
  if(pn) bar.appendChild(pn);
  const strip = el("div","chipstrip");   // only this scrolls
  bar.appendChild(strip);
  const wk = nextWeekend();
  /* "3 nights" is gone. The stepper beside it does 3 nights, and 4, and 9 —
     a chip that is one of the stepper's own values, sitting next to the
     stepper, is a row wider for nothing. Tonight and Weekend stay because they
     set a DATE, which the stepper cannot: they are the two spans a caller names
     without naming a date at all. "1 week" stays as the one length worth a
     single tap over seven presses. */
  const spans = [
    {label:"Tonight",  a:0,      n:1},
    {label:"Weekend",  a:wk.a,   n:Math.max(1, wk.b - wk.a)},
    {label:"1 week",   a:sel.a,  n:7},
  ];
  spans.forEach(sp=>{
    const on = !pendingStart && sel.a === sp.a && sel.n === sp.n;
    const b = el("button", on ? "on" : null, sp.label);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.onclick = ()=>{ haptic(9); pendingStart = null;
                      sel = {a: sp.a, n: Math.min(sp.n, DAYS - sp.a)};
                      revealPanel = true; calLean = true; renderMonth(); };
    strip.appendChild(b);
  });
  const clr = el("button","pclear","Clear");
  clr.onclick = ()=>{ haptic(6); pendingStart = null; sel = {a: sel.a, n: 1}; renderMonth(); };
  strip.appendChild(clr);
  cal.appendChild(bar);
  const markBar = edges(strip, "x");

  attachSweep(grid, hud);

  /* The soft-date sentence is gone too, by its own argument. The comment that
     used to sit here said "teaching that is read once costs a section forever",
     and then kept one more sentence doing exactly that: 58px explaining the
     amber dots that are already on the grid, on the tab whose measured problem
     is that the answer never fits on the screen.
     The dots stay and each carries "emptier than a typical Thursday" in its
     aria-label. A date running soft is a PLANNING fact — Business is the tab
     for planning, and this is the tab someone is on with a caller waiting. */
  s.append(cal, hud);
  /* Now that both are in the document and laid out, their scroll extents are
     real — the marks taken at construction were against an unattached box. */
  markCal(); markBar();

  /* THE ANSWER, in a trough of its own so its size cannot move the frame.
     8 free or 45 free, the layout above it is identical — which is the whole
     point of the frame. It used to append every free flat straight onto the
     page: 41 rows, 2665px, four and a half screens on the emptiest night. */
  {
    const {a, n} = sel;
    const free = flats.map((f,i)=>i).filter(i=>freeRange(i, a, a+n));

    /* The count line answers the tab's question at rest. Sweeping, paint()
       overwrites it live; it is the same 44px either way. The building count is
       there because the list is ordered by flat id, so the first rows are
       always the lowest-numbered building — on a night with 23 free across five
       buildings, the three rows in view can all be TreeTops while Banjara Hills
       sits below the fold. Saying how many buildings is one line and stops the
       window reading as the whole answer. */
    const hn = hud.querySelector(".n"), ht = hud.querySelector(".t");
    hn.textContent = free.length;
    hn.classList.toggle("none", free.length === 0);
    const bldgs = new Set(free.map(i=>flats[i].code)).size;
    /* no night count here: the control that sets it is one row up and says it */
    ht.innerHTML = `free of ${NF}`
                 + (free.length ? ` · across ${bldgs} building${bldgs>1?"s":""}` : "");

    const panel = el("div","listtrough");
    const list = el("div","card");
    if(!free.length){
      list.appendChild(el("div","empty", n === 1
        ? "Fully booked that night. Nothing left to sell."
        : `No flat is free for all ${n} nights. Ask can suggest moving one guest to open one up.`));
    }
    free.forEach(fi=> list.appendChild(roomRow(fi, a, null)));
    panel.append(list);
    s.appendChild(panel);
    if(revealPanel){
      revealPanel = false;
      /* the answer trough goes back to the top, and the calendar trough centres
         the selection — the frame does not scroll, so "reveal" means putting
         each trough where the operator expects it rather than moving the page */
      panel.scrollTop = 0;
      /* Centre the selection in the calendar trough by ARITHMETIC, synchronously.
         This was a requestAnimationFrame + scrollIntoView, and rAF does not fire
         in a backgrounded tab — measured, the trough sat at scrollTop 0 with the
         chosen dates 306px above the fold, so the operator picked a range and
         the grid showed him a different fortnight. The same trap has cost this
         session three false readings; the rule by now is that anything the
         layout depends on happens now, not next frame.
         The element is already in the document, so its offsets are real. */
      const a0 = grid.querySelector(".day.rngA") || grid.querySelector(".day.sel");
      if(a0){
        /* Rect deltas, not offsetTop. offsetTop is measured from the nearest
           POSITIONED ancestor, and .calscroll is static — so the offsets were
           relative to .screen and carried the picker line and the weekday bar
           with them. The cell landed 31px inside a 112px trough by that
           arithmetic and was still off-screen. A delta between two live rects
           cannot be wrong about which box it is in. */
        const cr = a0.getBoundingClientRect(), tr = trough.getBoundingClientRect();
        const want = trough.scrollTop + (cr.top - tr.top) - (tr.height - cr.height) / 2;
        trough.scrollTop = Math.max(0, Math.min(want, trough.scrollHeight - tr.height));
      }
      markCal();
    }
  }
}

/* ═══════════════ SCREEN 4 — TRENDS ═══════════════ */

/* ══════════════ what the money is doing ═════════════════════════════════════
   Occupancy alone hides the thing that pays: a full house at a poor rate and a
   half-empty one at a good rate look identical on an occupancy chart. RevPAR
   folds price and occupancy into one number and is what operators actually run
   on. Everything here is honest about coverage — a booking with no amount
   recorded is excluded and SAID to be excluded, rather than quietly dragging
   the average down.                                                          */
function moneyStats(){
  const bk = bookings().filter(r => r.end > 0 && r.start < DAYS);
  let nightsSold = 0, revenue = 0, priced = 0, pricedNights = 0;
  bk.forEach(r=>{
    const n = Math.max(0, Math.min(r.end, DAYS) - Math.max(r.start, 0));
    nightsSold += n;
    if(r.amount && r.nights){
      priced++; pricedNights += n;
      revenue += r.amount * (n / r.nights);   // only the nights inside the horizon
    }
  });
  let sellable = 0;
  for(let d = 0; d < DAYS; d++) for(let i = 0; i < NF; i++) if(!blk[i][d]) sellable++;
  const adr = pricedNights ? revenue / pricedNights : 0;
  // scale the priced sample up to every sold night, so RevPAR is not understated
  // simply because some bookings have no figure against them
  const projected = pricedNights ? adr * nightsSold : 0;
  /* CAN THIS SAMPLE CARRY AN EXTRAPOLATION? The line above multiplies one
     sample's rate across every sold night, and on the operator's real book that
     sample was THREE BOOKINGS — Rakesh 59 nights, Lakshmi 95, Hima 6, every one
     of them a long tenancy billed far under a nightly rate. Their average,
     Rs 1,650, then became Rs 386 RevPAR against a true Rs 3,475, printed at
     40px as "what a night is worth", and a Rs 4,887 rate card next to it made
     the app announce "about 66% off".

     Nothing was wrong with the arithmetic. What was missing was a refusal: a
     mean is not an estimate of anything until the sample looks like the thing
     it is standing in for. Two conditions, and both have to hold —

       enough bookings   a rate averaged over three stays is those three stays
       enough NIGHTS     the share that matters is of nights, not of rows: one
                         95-night tenancy is one row and a quarter of the book

     Below either, the Money card stops averaging and says what it has, and the
     answer to the same question comes from the workbook instead, where fifteen
     closed months measured it. */
  /* ENOUGH IS NOT THE SAME AS REPRESENTATIVE, and the first version of this
     gate confused them. "8 priced rows and half the nights" sounds strict and
     is trivially satisfied by exactly the sample it was written to reject: on
     this book, pricing the eight longest forward stays — four TreeTops
     tenancies, three of Lakshmi's, one of Haritha's — clears BOTH gates on 18%
     of the rows, because eight tenancies hold 65% of the nights. The card then
     prints the original defect back, verbatim: Rs 386 a night and "66% off the
     card". Verified by construction.

     The flaw is that a tenancy night and a nightly-let night are different
     products at different prices, and "what a night is worth" is a question
     about the second. A sample made of the first cannot answer it however big
     it is. So the gate counts the stays the question is actually about — the
     short ones — and asks for enough of THOSE, priced, covering enough of
     their own nights. */
  const SHORT = 14;                        // a let, rather than a tenancy
  let shortN = 0, shortPriced = 0, shortNights = 0, shortPricedNights = 0;
  bk.forEach(r=>{
    if(r.nights > SHORT) return;
    const n = Math.max(0, Math.min(r.end, DAYS) - Math.max(r.start, 0));
    shortN++; shortNights += n;
    if(r.amount && r.nights){ shortPriced++; shortPricedNights += n; }
  });
  const shortShare = shortNights ? shortPricedNights / shortNights : 0;
  const nightShare = nightsSold ? pricedNights / nightsSold : 0;
  return {nightsSold, sellable, revenue, adr, priced, total: bk.length,
          pricedNights, nightShare, shortN, shortPriced, shortShare,
          usable: shortPriced >= 8 && shortShare >= 0.5,
          coverage: bk.length ? priced / bk.length : 0,
          revpar: sellable ? projected / sellable : 0,
          listed: NF ? flats.reduce((s,f)=> s + (f.rate||0), 0) / NF : 0};
}

/* Money already agreed and not yet in hand, split by whether you can still do
   anything about it. A guest who has left owing is a different job from one who
   arrives on Tuesday. */
/* THE ROWS MUST BE A PARTITION OF THE HEADLINE.
   They were not, and the card read as if they were. Headline ₹23,64,700; rows
   "Arriving within a week" ₹3,12,800, "Already left" ₹39,900, "Sitting with a
   platform" ₹20,13,700 — summing to within 0.07% of the headline, which is
   exactly what makes them look like its parts. Measured, ZERO of the platform
   figure is inside the headline: paidOn() counts Platform payments, so
   dueFrom() zeroes them and a platform-settled booking never enters `total` at
   all, while its full amount lands in `platform`. Meanwhile the real third
   bucket — ₹20,12,000 across 238 bookings arriving beyond a week or still in
   the flat — appeared on no row. The operator concludes ₹20.5L arrives by
   itself and only ~₹3.5L needs working; all of it is owed by guests.

   So: three mutually exclusive buckets that add up to `total`, and the platform
   payout as a fourth pot on its own, because that is what it is. */
/* ══ THE WORKBOOK'S MONEY ═════════════════════════════════════════════════════
   One derived model behind the Profit segment. Everything the panel draws comes
   from here, so there is one place where a figure is either trustworthy or is
   not, rather than four surfaces each deciding for themselves.

   EXPENSES ARE MEASURED IN OCCUPANCY, not in rupees, and that is the whole
   idea of the panel. A building's monthly cost divided by its own room rate is
   the number of nights it must sell before it has paid for itself; over its
   capacity that is a break-even OCCUPANCY, which lands on exactly the same
   0–100 axis the occupancy bar already uses. Rent stops being a number beside a
   number and becomes a mark on the bar, and profit stops being a third number
   and becomes the distance past that mark. `head` — the headroom — is the only
   quantity in this app whose length on screen is profit.

   The identity that makes it cheap AND makes it honest:

       head = occ - be = occ x (1 - cost/revenue) = occ x margin

   Check it on any row: BH 92.17 x 58.71% = 54.11 points. Because headroom rises
   with both nights and revenue, a row whose nights and revenue can only rise
   has a headroom that can only rise — which is why an understated building
   prints "at least" figures instead of being dropped. A floor is information; a
   blank where a number belongs reads as a loss.

   THE THREE STATES, and nothing in the render path knows a building's name:
     complete  the sheet bills the nights the book counted
     floor     the book counted more than the sheet bills — income billed
               elsewhere, so every figure is a floor and none is a verdict
     absent    no revenue line and no cost line exist at all
   Today "floor" is TreeTops' four long tenancies and "absent" is Lotus Pond,
   but the day Madhapur signs a corporate let outside the sheet this catches it
   instead of shipping a confidently wrong ranking.                            */
/* The cost model the app actually reads: the workbook's, with anything the
   operator has typed in the cost sheet laid over the top. Declared HERE, above
   finRows, rather than beside openCosts a few thousand lines down — the primitive
   goes above its first caller, which is the rule this file learned the hard way
   four times over.

   Merged rather than replaced, so re-running import-finance.py refreshes their
   sheet's figures without touching a building they costed themselves, and a
   building the sheet has never heard of is theirs alone. */
const COST_STORE = "vacancy.costs.v1";
let costUser = jget(COST_STORE) || {};
/* Revenue the operator typed for a building their workbook does not price, one
   month at a time. Lotus Pond needs BOTH sides filling in, not just costs: the
   nights are already counted from the Availability tab, but nothing anywhere
   says what those nights earned. Keyed by month so nothing is carried across
   into a month it was not true of.                                           */
const FINU_STORE = "vacancy.revenue.v1";
let finUser = jget(FINU_STORE) || {};
/* The workbook's eleven lines, plus anything the operator has added. Their
   sheet does not carry internet, society charges, property tax or a dozen other
   things a real building has, and a cost model you cannot add a line to is a
   cost model that goes stale the first time a bill arrives. */
const costLines = code =>{
  const seen = [];
  const add = m => Object.keys(m || {}).forEach(k => { if(seen.indexOf(k) < 0) seen.push(k); });
  Object.values(FIN_COST).forEach(add);
  if(code) add(costUser[code]);
  else Object.values(costUser).forEach(add);
  return seen;
};
/* ── THE DATED LEDGER ────────────────────────────────────────────────────────
   Everything above is a STANDING model: the same figures every month, which is
   what their Costing sheet is. It has no room for "I paid a plumber Rs 8,000
   today". The only place to put that was the standing Maintenance line, which
   would then charge Rs 8,000 every month forever — so one-off spending had
   nowhere to go, and a repair logged against a flat reached the Upkeep card and
   stopped there, never touching profit.

   An expense is a DATED FACT, so it is stored as an ISO date and never as an
   offset. Bookings are stored as offsets and shifted on load, deliberately —
   "three days out" should stay three days out. An invoice is the opposite: it
   was paid on the 12th and is still the 12th tomorrow. Same reason BOOK_ON
   exists.                                                                    */
const EXP_STORE = "vacancy.expenses.v1";
let expenses = jget(EXP_STORE) || [];
const expSave = ()=>{ jset(EXP_STORE, expenses); finBust(); };
const monthOf = iso => String(iso || "").slice(0, 7);

/* WHAT THE APP ALREADY KNOWS COUNTS TOO. The operator asked whether logging a
   repair against a flat feeds the accounts, and until now the answer was no.
   Every closed issue carrying an invoice, and every out-of-service spell
   carrying one, is a real dated cost against that flat's building — so they are
   read straight out of the book rather than asking anyone to type them twice.

   The LOST NIGHTS are deliberately not here. They are real money and the Upkeep
   card is right to show them, but they are revenue that never arrived, not cash
   that left. Putting them in the cost column would charge the operator twice
   for the same empty room: once as an expense, and once as the nights missing
   from the revenue line. */
function ledgerFor(monthKey){
  const out = [];
  expenses.forEach(e=>{
    if(monthOf(e.on) !== monthKey) return;
    out.push({id:e.id, code:e.code, line:e.line, amount:e.amount, on:e.on,
              note:e.note, kind:"typed"});
  });
  issues.filter(x => x.fixed != null && x.cost).forEach(x=>{
    const f = flats[x.fi]; if(!f) return;
    const on = dayISO(x.fixed);
    if(monthOf(on) !== monthKey) return;
    out.push({id:"iss:"+x.id, code:f.code, line:"Maintenance", amount:x.cost, on,
              note:(x.fault || "Repair") + " · " + f.id, kind:"repair"});
  });
  resv.filter(r => isBlock(r) && r.cost).forEach(r=>{
    const f = flats[r.fi]; if(!f) return;
    const on = dayISO(r.start);
    if(monthOf(on) !== monthKey) return;
    out.push({id:"blk:"+(r.id||r.start+":"+r.fi), code:f.code, line:"Maintenance",
              amount:r.cost, on, note:(r.reason || "Out of service") + " · " + f.id, kind:"repair"});
  });
  return out.sort((a,b)=> a.on < b.on ? 1 : a.on > b.on ? -1 : 0);
}
/* Per building, per line, for one month. */
function ledgerLines(monthKey){
  const by = {};
  ledgerFor(monthKey).forEach(e=>{
    ((by[e.code] = by[e.code] || {})[e.line]) = (by[e.code][e.line] || 0) + e.amount;
  });
  return by;
}

const costFor = code => Object.assign({}, FIN_COST[code] || {}, costUser[code] || {});
/* ── ELEVEN LINES, THREE KINDS OF COST ───────────────────────────────────────
   Everything here was charged the way RENT is charged: one number, the same
   every month, stated with the confidence of a lease. Rent has earned that —
   it is contracted, it is known on the 1st, and it will be the same in March.
   The other ten had not.

   Electricity is a meter that is read; it is a different number every month and
   nobody knows it until the bill lands. Laundry and refills rise and fall with
   how many people actually stayed. Maintenance is a lift motor that fails in
   April and never in May — a "Rs 15,000 a month" maintenance line describes no
   month that has ever happened. Charging all eleven as a flat monthly figure
   made the app equally confident about the one it could not be wrong about and
   the one it could not possibly be right about.

   So a line declares what KIND it is, and the app stops pretending they are
   alike:

     fixed     contracted and known without being told — rent, salaries, AMC
     varies    a real cost with a different figure every month — power, water,
               laundry, refills — an average until the actual is logged
     one-off   happens when it happens — maintenance, replacements, bonuses —
               a monthly average for these is a fiction with a decimal point

   The arithmetic does not change: every line is still charged, so the profit is
   the profit. What changes is that the app can now say how much of a month's
   cost it actually KNOWS — fixed lines plus whatever was logged — which is the
   mirror of the revenue coverage gate, and the answer to "is this figure worth
   trusting". */
const COST_KIND = {
  "Rent":"fixed", "Salaries":"fixed", "AMC (Lift, Gen)":"fixed",
  "Electricity":"varies", "Water":"varies", "Laundry":"varies", "Refills":"varies",
  "Maintenance":"one-off", "Replacements":"one-off", "Bonus / gifts":"one-off",
  "Contingency":"one-off",
};
const KIND_STORE = "vacancy.costkind.v1";
let costKind = jget(KIND_STORE) || {};
/* A line the operator added is "varies" until they say otherwise — the safe
   default, because it is the one that says "this is an estimate". */
const kindOf = (code, line) =>
  (costKind[code] && costKind[code][line]) || COST_KIND[line] || "varies";

/* WHAT A MONTH ACTUALLY COST, AND HOW MUCH OF IT IS KNOWN. A line you logged
   is charged at what you logged; a line you did not is charged at its standing
   figure — the only rule that neither double-counts nor asks for two sets of
   books. On top of that each line is now marked KNOWN or ESTIMATED: a fixed
   line is known whether or not anybody logged it, because that is what fixed
   means, and everything else is an estimate until its actual arrives. */
function costMonth(code, monthKey){
  const std = costFor(code);
  const act = monthKey ? (ledgerLines(monthKey)[code] || {}) : {};
  const out = {}, basis = {}, kind = {};
  Object.keys(std).forEach(k=>{ out[k] = std[k]; basis[k] = "standing"; });
  Object.keys(act).forEach(k=>{ out[k] = act[k]; basis[k] = "actual"; });
  let known = 0, estimated = 0;
  Object.keys(out).forEach(k=>{
    kind[k] = kindOf(code, k);
    const v = +out[k] || 0;
    /* Logged beats kind: once a real figure exists for the month, the line is
       known whatever sort of cost it is. */
    if(basis[k] === "actual" || kind[k] === "fixed") known += v; else estimated += v;
  });
  const total = known + estimated;
  return {lines: out, basis, kind, known, estimated, total,
          actualLines: Object.keys(act).length,
          /* the share of the month's cost the app is not guessing at */
          certainty: total ? known / total : 0};
}
/* null still means "this building has no cost model at all", which is what puts
   Lotus Pond under the rule rather than in the ranking. A month with a ledger
   entry against a building that has no standing model is still a cost model —
   a thin one — so it counts. */
const costTotal = (code, monthKey) => {
  const m = costMonth(code, monthKey);
  return Object.keys(m.lines).length ? m.total : null; };

const FIN_TOL = 0.02;                  // a 2% drift is a rounding, not a hole
/* Card 2 draws all fifteen months, so finRows runs fifteen times per paint and
   the segment repaints on every month step, theme flip and audit walk. Cached
   on the two things that can change the answer — the inventory it counts flats
   from, and whatever the operator has typed into the cost sheet. */
let finCache = {}, finCacheKey = "";
const finBust = ()=>{ finCache = {}; finCacheKey = ""; };
/* And said ONCE. The warning is a standing property of the workbook, not an
   event: unthrottled it wrote four lines per paint and buried every other
   console message under a thousand copies of itself during a test run. */
const finWarned = {};
function finRows(monthKey){
  /* App-sourced months read the live book, so the book belongs in the stamp —
     otherwise typing an amount onto an August booking changes nothing on the
     Profit tab until something else happens to bust the cache. */
  let sig = 0;
  for(let i = 0; i < resv.length; i++){ const r = resv[i];
    sig = (sig + r.fi * 7 + r.start * 13 + r.nights * 31 + (r.amount || 0)) | 0; }
  /* Issues carry invoices now, so their fixed-state and cost belong in the
     stamp too — closing a repair with a bill moves the month that reads it. */
  let isig = 0;
  for(let i = 0; i < issues.length; i++){ const x = issues[i];
    isig = (isig + (x.fixed == null ? 0 : x.fixed * 3) + (x.cost || 0)) | 0; }
  const stamp = NF + "|" + resv.length + ":" + sig + "|i" + issues.length + ":" + isig
              + "|" + JSON.stringify(costUser) + "|" + JSON.stringify(finUser)
              + "|k" + JSON.stringify(costKind)
              + "|e" + JSON.stringify(expenses);
