/* Where the bookings came from. One list, because the demo generator and the
   booking form each used to carry their own and they had drifted apart — the
   form offered "Repeat guest", the data never produced one, and the source mix
   on the Month panel could not add up. These are the channels that actually
   appear in Crescent Stays' book. */
const SRC = ["Direct","Airbnb","Booking.com","MakeMyTrip","Agoda","Expedia","Agent"];
/* Declared here rather than beside the money helpers because the seed runs
   during boot, well before that block is evaluated. */
const PAY_METHODS = ["Cash","UPI","Bank","Card","Platform"];
/* A platform holds the guest's money and remits it later, so the stay is paid
   and the operator is owed. Direct and Agent are settled with the operator. */
const PLATFORMS = ["Airbnb","Booking.com","MakeMyTrip","Agoda","Expedia"];
/* The things a serviced flat actually has. The kitchen was three appliances
   short — a chimney, a microwave and a gas stove are not "Other", they are
   what breaks. */
const FAULTS_BASE = ["AC","Geyser","Plumbing","Electrical","Wi-Fi","Fridge",
                     "Washing machine","Chimney","Microwave","Gas stove",
                     "Furniture","Pest control","Other"];
/* And the list learns. Anything typed against "Other" is remembered as its own
   kind, so the second time the geyser filter goes it is a tap rather than a
   sentence — and every one of them then carries its own history, its own repeat
   warning and its own set of people who have fixed it. */
let customFaults = [];
const titleCase = s => s.trim().replace(/\s+/g," ")
  .replace(/^./, c => c.toUpperCase()).slice(0, 28);
function allFaults(){
  // "Other" stays last however many are learned — it is the escape hatch
  const base = FAULTS_BASE.filter(f => f !== "Other");
  return base.concat(customFaults, ["Other"]);
}
function learnFault(name){
  const t = titleCase(name || "");
  if(t.length < 2) return "";
  const known = allFaults().find(f => f.toLowerCase() === t.toLowerCase());
  if(known) return known;                       // already a kind, use its casing
  customFaults.push(t);
  save();
  return t;
}
/* What each of those actually turns out to be, in the words an operator would
   use on the phone to the person fixing it. The free-text box was asking them
   to type a sentence the app could have offered — and a note nobody types is a
   note nobody reads back six weeks later when the same thing fails again. */
const SYMPTOMS = {
  "AC":              ["not cooling","leaking water","noisy","remote dead"],
  "Geyser":          ["slow to heat","no hot water","leaking","tripping the switch"],
  "Plumbing":        ["tap dripping","drain blocked","low pressure","leak under the sink"],
  "Electrical":      ["socket dead","lights flickering","MCB tripping","fan not working"],
  "Wi-Fi":           ["drops out","very slow","router dead","no signal in one room"],
  "Fridge":          ["not cooling","freezing everything","noisy","door seal gone"],
  "Washing machine": ["not draining","not spinning","leaking","door stuck"],
  "Furniture":       ["door off its runner","broken leg","torn upholstery","handle come off"],
  "Pest control":    ["cockroaches","ants","mosquitoes","rodents"],
};
const REPEAT_WINDOW = 120;   // days a same-fault return still counts as "again"
const HELD_WINDOW   = 30;    // a fix that fails this fast is the fixer's to answer for
const URGENCY = ["whenever","soon","urgent"];
/* Declared up here with the other boot-time constants: the demo seeder runs
   during start-up, long before the maintenance block further down is reached. */
let issues = [];

/* ── inventory ───────────────────────────────────────────────────────────────
   The flats are editable and persist on the device. Bookings are held against
   flat IDs, so renaming or removing a flat remaps them rather than corrupting
   them.                                                                        */
/* v2, and the bump is the point. v1 holds the invented demo building — 45 flats
   that never existed — and loadInventory() prefers whatever is saved, so the
   real book would never have appeared on any phone that had opened the app
   before. A new key retires the old list without touching the operator's own
   edits under v1, which stay recoverable if this reading of the workbook turns
   out to be wrong. */
const INV_STORE = "vacancy.inventory.v2";
const UNIT_TYPES = ["Studio","1 BHK","2 BHK","3 BHK","4 BHK","Penthouse"];

function defaultInventory(){
  /* No longer generated. INVENTORY is the real book — see the note above it. */
  const by = Object.fromEntries(BUILDINGS.map(b=>[b.code, b]));
  return INVENTORY.map(([id, code, floor, type, rate])=>{
    const b = by[code];
    return { id, code, bname: b.name, bshort: b.short, floor, type, rate };
  });
}
function loadInventory(){
  try{
    const raw = localStorage.getItem(INV_STORE);
    if(!raw) return null;
    const rows = JSON.parse(raw);
    if(!Array.isArray(rows) || !rows.length) return null;
    return rows.filter(r => r && r.id && r.type);
  }catch(e){ return null; }
}
function saveInventory(){
  if(MODE === "live") return;        // signed in, the cloud cache is the store
  try{ localStorage.setItem(INV_STORE, JSON.stringify(
    flats.map(f=>({id:f.id, code:f.code, bname:f.bname, bshort:f.bshort,
                   floor:f.floor, type:f.type, rate:f.rate}))
  )); }catch(e){}
}

/* ── WHEN A FLAT ID RETIRES ──────────────────────────────────────────────────
   save() keys every stored row by the flat's TEXT id, and load() reads them
   back through `flatIndex[r.id] !== undefined` — which silently DROPS any row
   whose flat no longer exists. That filter was the entire migration story, and
   it was fine while ids never changed.

   Then the Lotus Pond merge retired twelve of them. Every device that had used
   the app before it held bookings on LP-101 … LP-403; on the next load those
   rows failed the lookup and were thrown away. Not renumbered, not quarantined,
   not mentioned — deleted, on the operator's own phone, by an update.

   So a retired id is now MAPPED rather than dropped. The three bedrooms of a
   floor were always one apartment, so all three point at the merged unit.    */
const FLAT_RENAMES = (()=>{
  const m = {};
  for(const fl of ["1","2","3","4"])
    for(const n of ["01","02","03"]) m["LP-" + fl + n] = "LP-" + fl;
  return m;
})();
const liveFlatId = id => {
  const to = FLAT_RENAMES[id];
  /* Only follow the rename if the target actually exists. An operator who
     deleted LP-3 in the inventory editor must not have rows resurrected onto a
     flat they retired. */
  return (to !== undefined && flatIndex[to] !== undefined) ? to : id;
};
/* Three rows that were one let become one row. Without this the trio arrives as
   three identical stays stacked on one flat, which is a triple booking the app
   would then refuse to move or cancel cleanly. Keeps the row carrying the most
   information — the amount lives on exactly one of the three. */
function collapseMerged(rows){
  const seen = new Map(), out = [];
  rows.forEach(r=>{
    if(!FLAT_RENAMES[r._wasId]) { out.push(r); return; }
    const k = r.fi + "|" + r.start + "|" + r.end + "|" + String(r.guest || "").trim().toLowerCase();
    const had = seen.get(k);
    if(!had){ seen.set(k, r); out.push(r); return; }
    had.amount = had.amount || r.amount;
    had.phone  = had.phone  || r.phone;
    had.pax    = had.pax    || r.pax;
    if((r.pays || []).length && !(had.pays || []).length) had.pays = r.pays;
  });
  return out;
}

/* A STORED INVENTORY MUST NOT FREEZE A DEVICE ON A RETIRED SHAPE. The stored
   list wins outright and is never reconciled with the shipped seed, so any
   phone that had ever opened the inventory editor kept its 46 flats forever —
   the Lotus Pond merge simply never arrived, and that device went on showing
   sixteen Lotus Pond rooms while the app's own title said thirty-eight.

   The operator's inventory is still theirs: rates, additions and deletions all
   survive. Only the retired ids are rewritten, and only when their replacement
   is in the seed — which is the one change they cannot have meant to keep. */
function migrateInventory(rows){
  if(!rows || !rows.length) return rows;
  const seedIds = new Set(INVENTORY.map(r => r[0]));
  const out = [], made = new Set();
  let changed = false;
  rows.forEach(f=>{
    const to = FLAT_RENAMES[f.id];
    if(to === undefined || !seedIds.has(to)){ out.push(f); return; }
    changed = true;
    if(made.has(to)) return;                     // the trio becomes one unit
    made.add(to);
    const seed = INVENTORY.find(r => r[0] === to);
    out.push({...f, id: to, type: seed[3],
              /* their own rate is kept if they had edited one, since the three
                 bedrooms were priced as the apartment anyway */
              rate: f.rate || seed[4]});
  });
  return changed ? out : rows;
}
let flats = migrateInventory(loadInventory()) || defaultInventory();
let NF = flats.length;
let flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));

/* Swap the inventory and carry the bookings across by ID.
   `renames` maps old id -> new id so a renumbered flat keeps its bookings. */
function applyInventory(next, renames){
  renames = renames || {};
  const prev = flats;
  /* Logged BEFORE the swap, while both shapes are still in hand — afterwards
     there is nothing left to compare against. */
  try{
    const was = prev.map(f=>f.id), now = next.map(f=>f.id);
    const gone = was.filter(id => now.indexOf(renames[id] || id) < 0);
    const made = now.filter(id => was.indexOf(id) < 0 && !Object.values(renames).includes(id));
    if(gone.length || made.length || was.length !== now.length)
      logAct("flats", `Inventory changed · ${was.length} flats → ${now.length}`
        + (made.length ? ` · added ${made.slice(0,3).join(", ")}${made.length>3?"…":""}` : "")
        + (gone.length ? ` · removed ${gone.slice(0,3).join(", ")}${gone.length>3?"…":""}` : ""));
  }catch(e){}
  const held = resv.map(r => {
    const was = flats[r.fi] && flats[r.fi].id;
    return {...r, _id: renames[was] || was};
  });
  /* Logged faults carry a flat INDEX too, and only resv was ever carried across.
     Removing a flat therefore shifted every issue after it onto the next flat —
     silently, and save() below cemented it. An urgent plumbing fault on LP-101
     came back reading LP-102, and faults on the removed flat survived pointing
     at its neighbour instead of being dropped, which is the opposite of what
     that sheet's own footer promises. A fault on the LAST flat was worse: its
     index went out of range, save() wrote no id, load() dropped it on reload,
     and if it was urgent todayBoard threw on flats[x.fi].id and took the whole
     Business tab down with it. Same treatment as resv, computed before the
     swap while the old ids are still readable. */
  const heldIssues = issues.map(x => {
    const was = flats[x.fi] && flats[x.fi].id;
    return {...x, _id: renames[was] || was};
  });
  flats = next;
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));
  resv = held.filter(r => flatIndex[r._id] !== undefined)
             .map(r => { const {_id, ...rest} = r; return {...rest, fi:flatIndex[_id]}; });
  issues = heldIssues.filter(x => flatIndex[x._id] !== undefined)
                     .map(x => { const {_id, ...rest} = x; return {...rest, fi:flatIndex[_id]}; });
  if(MODE === "live") syncInventory(prev);
  recompute(); saveInventory(); save(); cacheSave();
}

/* Inventory edits are rare and small — a flat renumbered, a building added — so
   this diffs rather than replacing wholesale. A removed flat takes its stays
   with it, which is what the cascade in the schema is for; a renumbered one
   keeps them, because bookings hang off the flat's id and not its number.    */
function syncInventory(prev){
  const bidFor = {};
  prev.concat(flats).forEach(f=>{ if(f.bid && f.code && !bidFor[f.code]) bidFor[f.code] = f.bid; });
  const seen = [];
  flats.forEach(f=>{ if(seen.indexOf(f.code) < 0) seen.push(f.code); });

  flats.forEach(f=>{
    if(!bidFor[f.code]){                       // a building nobody has seen before
      const bid = uuid();
      bidFor[f.code] = bid;
      enqueue({k:"bld+", id:bid, body:{code:f.code, name:f.bname,
        short_name: f.bshort || f.bname, sort_order: seen.indexOf(f.code)}});
    }
    f.bid = bidFor[f.code];
  });

  const before = Object.fromEntries(prev.filter(f=>f.uid).map(f=>[f.uid, f]));
  flats.forEach(f=>{
    const body = {building_id:f.bid, code:f.id, floor:f.floor|0,
                  unit_type:f.type, nightly_rate:f.rate || null};
    if(!f.uid){ f.uid = uuid(); enqueue({k:"flat+", id:f.uid, body}); return; }
    const o = before[f.uid];
    if(o && (o.id !== f.id || o.floor !== f.floor || o.type !== f.type
             || o.rate !== f.rate || o.bid !== f.bid)) enqueue({k:"flat~", id:f.uid, body});
  });

  const keep = new Set(flats.map(f=>f.uid));
  prev.forEach(f=>{ if(f.uid && !keep.has(f.uid)) enqueue({k:"flat-", id:f.uid}); });
}
/* ── perspective ─────────────────────────────────────────────────────────────
   An unsold night is perishable stock: once the date passes it can never be
   sold again. These turn the calendar from "what is" into "what is about to be
   lost", which is the thing an operator can still act on.                     */


/* "22 free" tells you nothing on its own — is that a bad Saturday or a normal
   Tuesday? This compares each date against how that weekday usually runs, which
   is the one thing you cannot read off the raw count. */
/* ── trends ──────────────────────────────────────────────────────────────────
   All of this reads the forward book — the app has no past yet. Manual bookings
   now record the day they were taken (`bookedOn`), so genuine lead-time history
   accumulates from first use rather than being invented. */
const inHorizon = () => bookings().filter(r => r.end > 0 && r.start < DAYS);

/* How the book thins as you look further out. This is the honest version of
   "pace": it shows the booking window, so 30% five weeks out reads as normal
   rather than alarming. */
function bookingCurve(){
  const weeks = [];
  for(let w = 0; w*7 < DAYS; w++){
    let sold = 0, total = 0;
    for(let d = w*7; d < Math.min((w+1)*7, DAYS); d++)
      for(let i = 0; i < NF; i++){ if(blk[i][d]) continue; total++; if(occ[i][d]) sold++; }
    if(total) weeks.push({w, pct: sold/total});
  }
  return weeks;
}

function groupOcc(days, keyOf){
  const acc = new Map();
  flats.forEach((f,i)=>{
    const k = keyOf(f);
    if(!acc.has(k)) acc.set(k, {k, sold:0, total:0, units:0});
    acc.get(k).units++;
  });
  days.forEach(d=> flats.forEach((f,i)=>{
    if(blk[i][d]) return;                        // out of service leaves the denominator
    const a = acc.get(keyOf(f)); a.total++; if(occ[i][d]) a.sold++;
  }));
  /* THIN carries through to the caller. A bucket of one flat still divides
     perfectly well — 3 nights of 63 is 5% — and that 5% then got set beside a
     31-flat bucket as though the two were the same kind of measurement, and the
     one-flat bucket was named the weak size. It is not a size, it is a flat.
     Three is the line: below it the card shows the nights and withholds the
     rate, and the comparison skips it. */
  /* How much of each bucket's occupancy is a handful of long tenancies rather
     than nights being sold. Without it the card compared TreeTops at 50% with
     Telecom Nagar at 11% and blamed "pricing, photos or listing reach" — when
     284 of TreeTops' 314 sold nights are stays over a month, and stripped of
     them TreeTops is 5%, BELOW Telecom Nagar. The gap was four tenancies. */
  const longIn = new Map();
  resv.forEach(r=>{
    if(isBlock(r)) return;
    const n = Math.min(r.end, DAYS) - Math.max(r.start, 0);
    if(n <= 30 || !flats[r.fi]) return;
    const k = keyOf(flats[r.fi]);
    longIn.set(k, (longIn.get(k) || 0) + n);
  });
  return [...acc.values()].map(a=>{
    const lng = longIn.get(a.k) || 0;
    return {...a, pct: a.total ? a.sold/a.total : 0, thin: a.units < 3,
            longNights: lng, longShare: a.sold ? lng/a.sold : 0,
            shortPct: a.total ? (a.sold - lng)/a.total : 0};
  }).sort((x,y)=> x.pct - y.pct);
}

/* CLAMPED TO THE HORIZON, like occupancyValue() beside it and unlike the
   version that shipped. The card is captioned "in the next nine weeks", so the
   nights it averages have to be nights in the next nine weeks — but it summed
   r.nights raw, which for a tenancy running past the book counts every night of
   it, including the ones before today. Measured on the real book: 27.0 nights
   average against a true 12.6, with eight rows over 63 nights doing all of it,
   four of those being import artefacts. Two cards at the same altitude then
   disagreed about the same 57 bookings, and the narration offered advice built
   on the wrong one. */
function stayMix(){
  const rs = inHorizon();
  const held = r => Math.min(r.end, DAYS) - Math.max(r.start, 0);
  const buckets = [{k:"1 night",lo:1,hi:1},{k:"2",lo:2,hi:2},{k:"3",lo:3,hi:3},
                   {k:"4–6",lo:4,hi:6},{k:"7+",lo:7,hi:999}];
  const out = buckets.map(b=>({...b, n: rs.filter(r=>{ const n = held(r); return n>=b.lo && n<=b.hi; }).length}));
  const alos = rs.length ? rs.reduce((s,r)=> s + held(r), 0) / rs.length : 0;
  const sorted = rs.map(held).sort((a,b)=> a - b);
  return {out, alos, total: rs.length,
          median: sorted.length ? sorted[Math.floor(sorted.length/2)] : 0,
          long: sorted.filter(n => n > 30).length};
}

function sourceMix(){
  const rs = inHorizon(), m = new Map();
  rs.forEach(r=> m.set(r.src, (m.get(r.src)||0) + 1));
  return {rows: [...m.entries()].map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n), total: rs.length};
}

/* Same-day changeovers per day — this is the cleaning crew's week, and almost
   nothing at this scale surfaces it. */
function turnLoad(n){
  const out = [];
  for(let d = 0; d < n; d++) out.push({d, n: dayOps(d).turnovers.length});
  return out;
}

/* How broken up the empty time is. Ten scattered single nights are far harder
   to sell than one ten-night hole, and the raw vacancy count hides that. */
/* GAPS BETWEEN BOOKINGS, WHICH IS NOT ALL THE EMPTY TIME. A run that reaches the
   end of the book is not a gap — nothing bounds it, and it may be filled by a
   booking that has not been taken yet — so it is skipped. That is right for the
   question, and it was silently wrong for the card: on the real book 8 runs of
   72 nights are counted and 42 runs of 2,148 nights are not, so the card was
   describing 3.2% of the empty time and calling it "how sellable your empty
   time really is". One flat's 34-night gap carried the average; without it the
   figure falls from 9.0 nights to 5.4.

   Both numbers are returned now, so the card can scope its own claim. */
function fragmentation(){
  let runs = 0, orphans = 0, nights = 0, openRuns = 0, openNights = 0;
  flats.forEach((f,fi)=>{
    let d = 0;
    while(d < DAYS){
      if(occ[fi][d]){ d++; continue; }
      let n = 0; while(d+n < DAYS && !occ[fi][d+n]) n++;
      if(d + n < DAYS){ runs++; nights += n; if(n === 1) orphans++; }
      else { openRuns++; openNights += n; }        // runs off the end of the book
      d += n;
    }
  });
  return {runs, orphans, nights, avg: runs ? nights/runs : 0,
          openRuns, openNights, allNights: nights + openNights};
}

/* ── the cheapest booking you will ever take ─────────────────────────────────
   A guest is already in the flat. The night after they leave is empty. Asking
   them to stay one more night costs nothing — no listing, no commission, no
   clean between. When that empty stretch is bounded by the next booking, the
   extension fills the gap exactly, and a one-night gap is the orphan nobody
   can sell. No small-operator tool surfaces this; they all wait for demand to
   arrive instead of looking at who is already standing in the room.        */
const OPP_HORIZON = 14;              // opportunities are only actionable near-term

function extensionOffers(){
  const out = [];
  bookings().forEach(r=>{
    const e = r.end;                                  // check-out morning = first free night
    // you can only realistically make this offer to a guest whose stay is imminent —
    // a checkout a fortnight away is not a conversation you can have today
    if(e < 0 || e > 7) return;
    if(occ[r.fi][e]) return;                          // someone else already has that night
    let n = 0; while(e+n < DAYS && !occ[r.fi][e+n]) n++;
    if(!n) return;
    const bounded = e + n < DAYS;                     // a later booking closes the gap
    const inHouse = r.start <= 0 && r.end > 0;        // they are in the flat right now
    out.push({
      r, fi:r.fi, from:e, nights:n, bounded, inHouse,
      orphan: bounded && n === 1,
      score: (inHouse ? 100 : 0)
           + (bounded && n === 1 ? 70 : bounded && n <= 3 ? 40 : 0)
           + Math.max(0, 30 - e),                     // sooner beats later
    });
  });
  return out.sort((a,b)=> b.score - a.score);
}

/* ── blocks that outlive their reason ────────────────────────────────────────
   The expensive failure is not taking a flat out of service — it is forgetting
   to put it back. A flat marked "AC repair" in March is still blocked in June
   because nobody revisited it, quietly out of inventory the whole time. So the
   app asks, around the date the flat was due back, whether it actually is. */
function blockNudges(){
  const out = [];
  resv.filter(isBlock).forEach(r=>{
    const due = r.end;                       // first night back on sale
    /* "Is it back in service?" is only a sensible question about work that has
       STARTED. A one-night outage booked for tomorrow lands inside the [-7,+2]
       window immediately, so the board asked whether a flat was back before it
       had gone out — and answering that question used to delete the record and
       the bill with it. A future outage is a plan; it belongs on the calendar,
       not on the list of things needing a decision today. */
    if(r.start > 0){ /* has not begun — nothing to decide yet */ }
    else if(due >= -7 && due <= 2){
      out.push({r, kind:"due", due,
        when: due < 0 ? `came back ${-due} day${-due>1?"s":""} ago`
            : due === 0 ? "comes back today"
            : due === 1 ? "comes back tomorrow"
            : `comes back in ${due} days`});
    } else if(due > 2 && r.nights >= 21){
      out.push({r, kind:"long", due,
        when: `out for ${r.nights} nights — ${Math.max(0, Math.min(due,DAYS))} still to come`});
    }
  });
  return out.sort((a,b)=> a.due - b.due);
}

/* Single empty nights wedged between two bookings, inside the fortnight. These
   are the nights nobody books at a normal rate, so they are the ones worth
   advertising cheap. */
function orphanNights(){
  const out = [];
  for(let d = 0; d < Math.min(OPP_HORIZON, DAYS); d++){
    flats.forEach((f,i)=>{
      if(occ[i][d]) return;
      const closedBefore = d === 0 || occ[i][d-1];
      const closedAfter  = d+1 < DAYS && occ[i][d+1];
      if(closedBefore && closedAfter) out.push({fi:i, d});
    });
  }
  return out.sort((a,b)=> a.d - b.d);
}

/* ── what actually belongs in a to-do list ───────────────────────────────────
   Only things that are true today or tomorrow, that stop being true if
   ignored, and that have one clear action. A standing condition — "16 orphan
   nights exist somewhere in the next fortnight" — is still 16 tomorrow, so it
   is analysis, not a task, and putting it here is what makes a list people
   stop reading. Everything longer-range lives in the sections below.        */
const NOW = 1;                       // today and tomorrow

/* Three different kinds of thing were being rendered as one flat list, which
   made a maintenance decision look identical to a discount idea and grew a row
   for every extra item. They are grouped by the response they need instead:

     DECIDE   — a question only you can answer, with its answer attached
     TO DO    — work that must happen, counted not enumerated
     PERISHING— inventory with a clock on it, shown as figures side by side

   Nothing here is more than two days out. */
/* Drag to say how much longer a flat stays out, capped at the nights actually
   available so a block can never be dragged over a guest. */
/* ── how much longer is it out ────────────────────────────────────────────────
   This was a drag slider with absolutely-positioned end labels, and those
   labels sat below the 34px track and collided with the line underneath — the
   overlap you could see. It was also the only slider left in an app that speaks
   steppers everywhere else, and it predates them.

   A stepper cannot overlap anything, needs no ticks, and reads its own value.
   The cap is the more useful half anyway: "back on Thursday" and, when a guest
   is holding the nights after, saying so instead of silently refusing to slide
   any further — which is why it sometimes stopped at two days with no
   explanation.                                                               */
/* Whoever holds the first night this block cannot have. It was being looked up
   as "the next guest to arrive", which quietly skips a guest who is already in
   the flat right now — a lapsed block would then name somebody a fortnight away
   as the reason it could not extend by a single day.                          */
function blockWall(block){
  const from = Math.max(block.end, 0);
  return resv.filter(r => r.fi === block.fi && !isBlock(r) && r.end > from)
             .sort((a,b)=> a.start - b.start)[0] || null;
}

/* The offer itself. Null when nobody can move — silence is the honest answer,
   and a card that says "no options" is a card the operator learns to skip. */
function wallOffer(block, wall, onDone){
  if(!wall) return null;
  const quiet = t =>{ const q = el("div","wallno"); q.innerHTML = t; return q; };
  const nights = wall.end - Math.max(wall.start, 0);

  // a guest who has already let themselves in is not being asked to pack
  if(wall.start < 0)
    return quiet(`<b>${esc(wall.guest)}</b> is already in there until `
      + `${esc(fmt(wall.end))} — nobody moves a guest mid-stay.`);

  const mv = moveFor(wall);
  if(!mv)
    return quiet(`Nowhere free to put <b>${esc(wall.guest)}</b> for all `
      + `${nights} of their nights, so this really is the wall.`);

  const gained = extendAfter(block, mv);
  const now = maxExtend(block);
  if(gained <= now)
    return quiet(`Even moving <b>${esc(wall.guest)}</b> buys nothing — `
      + `the nights behind them are taken too.`);

  const to = flats[mv.moves[0].to], n = mv.moves.length;
  const till = Math.min(Math.max(block.end, 0) + gained, DAYS - 1);

  const card = el("button","wallmove");
  const gain = el("span","wm-g", "+" + (gained - now) + (gained - now === 1 ? " day" : " days"));
  const head = el("div","wm-h");
  head.innerHTML = SVG_SWAP + `<b>${n === 1
      ? esc(wall.guest) + " could move to " + esc(to.id)
      : n + " guests could move out of the way"}</b>`;
  const sub = el("div","wm-s");
  sub.innerHTML = (n === 1
      ? (mv.sameBuilding && mv.sameType ? "Same building, same size" :
         mv.sameBuilding ? "Same building" : "A different building — worth a call")
      : `${mv.sameBuilding ? "All in the same building" : "Across buildings"}`)
    + ` · then ${esc(flats[block.fi].id)} can stay out to <b>${esc(fmtL(till))}</b>`;
  card.append(head, gain, sub);
  card.onclick = ev=>{
    ev.stopPropagation(); haptic(10);
    openMove(mv, Math.max(block.end, 0), ()=>{
      const bought = gained - now;
      extendBlock(block, extendAfter(block, mv));
      closeSheet(); haptic(18); refreshScreen();
      // the same number the card promised, not a different true one
      toast("", `<b>${esc(flats[block.fi].id)} stays out to `
        + `${esc(fmtL(Math.min(Math.max(block.end, 0), DAYS-1)))}.</b> `
        + `Moving ${esc(wall.guest)} bought ${bought} of those days.`, null);
      if(onDone) onDone();
    }, {title: `Keep ${flats[block.fi].id} out longer`,
        cta:   `Keep it out to ${fmtL(till)}`});
  };
  return card;
}

function attachDaysSlider(host, block, onCancel){
  const room = maxExtend(block);
  const box = el("div","exts");
  const backOut = ()=>{
    if(onCancel){ onCancel(); return; }
    box.remove();
  };
  if(room <= 0){
    const none = el("div","exts-when");
    none.style.marginTop = "8px";
    const nextUp = blockWall(block);
    none.innerHTML = nextUp
      ? `Cannot stay out any longer — <b>${esc(nextUp.guest)}</b> `
        + (nextUp.start < 0 ? `is in there until ${esc(fmt(nextUp.end))}.`
                            : `arrives ${esc(fmt(nextUp.start))}.`)
      : `Cannot stay out any longer — the nights after are taken.`;
    box.appendChild(none);
    const offer0 = wallOffer(block, nextUp);
    if(offer0) box.appendChild(offer0);
    const foot0 = el("div","exts-foot");
    const back0 = el("button","nudgeBtn","Back");
    back0.onclick = ev=>{ ev.stopPropagation(); backOut(); };
    foot0.append(back0);
    box.appendChild(foot0);
    host.appendChild(box);
    return;
  }
  let days = Math.min(3, room);

  const cap = el("div","bkcap");
  cap.append(el("span", null, "Keep it out for"));
  const row = el("div","step nightStep");
  const less = el("button", null, "−"), more = el("button", null, "+"), lab = el("b");
  less.setAttribute("aria-label","One day fewer"); more.setAttribute("aria-label","One day more");
  row.append(less, lab, more);

  const when = el("div","bkstate");
  const offerSlot = el("div");
  const go = el("button","nudgeBtn","Keep it out");
  const back = el("button","nudgeBtn","Cancel");
  back.onclick = ev=>{ ev.stopPropagation(); backOut(); };
  const foot = el("div","exts-foot");
  foot.append(back, go);

  const paint = ()=>{
    days = Math.max(1, Math.min(room, days));
    lab.textContent = days + (days === 1 ? " day" : " days");
    less.disabled = days <= 1; more.disabled = days >= room;
    const back = Math.min(Math.max(block.end, 0) + days, DAYS - 1);
    const capped = days >= room;
    const nextUp = capped ? blockWall(block) : null;
    when.innerHTML = `Back on sale <b>${esc(fmtL(back))}</b>`
      + (nextUp ? ` · that is as far as it goes, ${esc(nextUp.guest)} `
                  + (nextUp.start < 0
                      ? (nextUp.openEnd ? `is in · no end date recorded` : `is in until ${esc(fmt(nextUp.end))}`)
                      : `arrives ${esc(fmt(nextUp.start))}`)
                : capped ? ` · as far as the free nights allow` : "");
    go.textContent = `Keep it out ${days} more day${days>1?"s":""}`;
    // the way past the wall only appears once you have actually hit it
    offerSlot.textContent = "";
    const o = wallOffer(block, nextUp); if(o) offerSlot.appendChild(o);
  };
  less.onclick = ev=>{ ev.stopPropagation(); days--; haptic(5); paint(); };
  more.onclick = ev=>{ ev.stopPropagation(); days++; haptic(5); paint(); };
  go.onclick = ev=>{ ev.stopPropagation(); extendBlock(block, days); haptic(18); refreshScreen(); };

  box.append(cap, row, when, offerSlot, foot);
  host.appendChild(box);
  paint();
}

function todayBoard(){
  const norm = weekdayFreeNorm();

  const decide = blockNudges().filter(n=>n.due <= NOW + 1).map(n=>({
    block:n.r, fi:n.r.fi,
    title:`Is ${flats[n.r.fi].id} back in service?`,
    why:`${n.r.reason.toLowerCase()} · ${n.when}${n.r.note ? " · " + n.r.note : ""}`,
  }));

  const todo = [];
  for(let d=0; d<=NOW; d++){
    const turns = dayOps(d).turnovers.map(t=>({fi:t.fi, d,
      meta:`<b>${esc(t.out.guest)}</b> out, <b>${esc(t.in.guest)}</b> in<em>${fmtL(d)}</em>`, pill:"clean"}));
    if(turns.length) todo.push({
      label:`Clean ${turns.length} flat${turns.length>1?"s":""} ${d===0?"today":"tomorrow"}`,
      note:"check-out and check-in the same day",
      open:()=>openFlatList(`${turns.length} to clean`, `${fmtL(d)} · check-out and check-in the same day`, turns)});
  }

  /* Logged faults never reached this board, which made logging one feel like
     writing into a drawer. Only two kinds belong here, because this card is
     things that stop being true if ignored: anything marked urgent, and
     anything at all on a flat with a guest arriving in the next two days —
     after that it is somebody else's problem to walk into. */
  {
    const urgent = openIssues().filter(x => x.urgency === "urgent");
    const arrivingSoon = openIssues().filter(x => x.urgency !== "urgent"
      && bookings().some(r => r.fi === x.fi && r.start >= 0 && r.start <= NOW + 1));
    const pressing = urgent.concat(arrivingSoon);
    if(pressing.length){
      const rows = pressing.map(x=>({fi:x.fi, d:0,
        meta:`<b>${esc(x.fault || "Issue")}</b> · ${esc(flats[x.fi].id)}`
           + `<em>${esc(x.note || "no note")}`
           + (x.urgency === "urgent" ? " · marked urgent" : " · a guest arrives within two days") + `</em>`,
        pill: x.urgency === "urgent" ? "urgent" : "before they arrive"}));
      todo.push({
        label: urgent.length && arrivingSoon.length
          ? `Fix ${pressing.length}: ${urgent.length} urgent, ${arrivingSoon.length} before a guest arrives`
          : urgent.length ? `Fix ${urgent.length} urgent thing${urgent.length>1?"s":""}`
          : `Fix ${arrivingSoon.length} thing${arrivingSoon.length>1?"s":""} before a guest arrives`,
        note: "logged faults on flats that are still on sale",
        open: ()=> openFlatList(`${pressing.length} to fix`,
          "still on sale, and wanted before the next guest", rows)});
    }
  }

  /* Money the operator can only collect while the guest is standing there.
     Arrivals are derived from dates and so are always right — which is exactly
     why this belongs here instead of behind a check-in button somebody has to
     remember to press. Platform bookings are deliberately absent: the guest owes
     nothing, and putting them on a chase list is how the column loses its
     meaning. */
  for(let d=0; d<=NOW; d++){
    const owing = bookings().filter(r => r.start === d && dueFrom(r) > 0);
    if(!owing.length) continue;
    const total = owing.reduce((s,r)=> s + dueFrom(r), 0);
    todo.push({
      label:`Collect ${money(total)} from ${owing.length} arrival${owing.length>1?"s":""} ${d===0?"today":"tomorrow"}`,
      note:"balance still due when they arrive",
      open:()=>openFlatList(`${money(total)} to collect`, `${fmtL(d)} · arriving with a balance`,
        owing.map(r=>({fi:r.fi, d,
          meta:`<b>${esc(r.guest)}</b>${r.phone ? " · " + esc(r.phone) : ""}`
             + `<em>${money(dueFrom(r))} of ${money(r.amount)} · ${esc(r.src)}</em>`,
          pill: money(dueFrom(r))})))});
  }

  const days = [];
  for(let d=0; d<=NOW; d++){
    const free = flats.map((f,i)=>i).filter(i=>!occ[i][d]);
    if(!free.length) continue;
    /* A CHOSEN NUMBER MUST NOT SIT WHERE MEASURED ONES DO. These depths are
       constants the app was written with — nothing here reads a price, a
       conversion or an elasticity — but "−25%" in the pill slot, beside pills
       holding real money and real night counts, reads as a calculation. The
       app cannot compute the right discount; it can only suggest starting
       somewhere, so the pills say "try" and the lead says whose call it is. */
    const depth = d===0 ? 25 : 20;
    const rows = free.map(i=>({fi:i, d,
      meta:`<b>${esc(flats[i].type)}</b> · ${esc(flats[i].bshort)}<em>free from ${fmt(d)} ${freeWords(i,d)}</em>`,
      pill:`try −${depth}%`}));
    days.push({d, n:free.length, depth,
      soft: free.length - norm[dateAt(d).getDay()] >= 2,
      open:()=>openFlatList(`${free.length} unsold ${d===0?"tonight":fmt(d)}`,
        d===0 ? "gone at midnight" : "one day left to sell", rows,
        {depth, when: d===0 ? `tonight, ${fmtL(0)}` : fmtL(d),
         lead:"These nights stop existing the morning after. Anything you take for them beats nothing. "
            + "The percentage is a starting point, not a calculation — you know your market."})});
  }

  const orph = orphanNights().filter(o=>o.d <= NOW).map(o=>({fi:o.fi, d:o.d,
    meta:`<b>${esc(flats[o.fi].type)}</b> · ${esc(flats[o.fi].bshort)}<em>${fmtL(o.d)} · booked either side</em>`,
    pill:"try −25%"}));
  const ext = extensionOffers().filter(x=>x.from <= NOW + 1).map(x=>({fi:x.fi, d:x.from,
    meta:`Offer <b>${esc(x.r.guest)}</b> a discounted extra night<em>leaves ${fmt(x.from)} · `
      + (x.bounded
          ? `${x.nights} night${x.nights>1?"s":""} empty after`
          : `nothing booked after, as far as the book goes`) + `</em>`,
    pill: x.orphan ? "closes a gap" : x.bounded ? `+${x.nights}n` : "open after"}));

  const extras = [];
  if(orph.length) extras.push({
    label:`${orph.length} single spare night${orph.length>1?"s":""}`,
    note:"booked either side, so they will not sell at a normal rate", pill:"try −25%",
    open:()=>openFlatList(`${orph.length} single spare night${orph.length>1?"s":""}`,
      "booked either side · today and tomorrow", orph,
      {depth:25, when: orph.length===1 ? fmtL(orph[0].d) : "single nights, today and tomorrow",
       lead:"A single night between two bookings will not sell at a normal rate — most guests want two or more. "
          + "The alternative is leaving it empty. The percentage is a starting point, not a calculation."})});
  if(ext.length) extras.push({
    label:`Offer ${ext.length} guest${ext.length>1?"s":""} an extra night`,
    note:"checking out soon, with the flat empty behind them", pill:"try −20%",
    open:()=>openFlatList(`${ext.length} extension offer${ext.length>1?"s":""}`,
      "guests leaving today or tomorrow", ext,
      {lead:"A discounted extra night beats an empty one, and costs no commission and no clean in between. "
         + "Speak to each guest before they check out — and pick the discount yourself, the app has no way to know it."})});

  return {decide, todo, days, extras,
          count: decide.length + todo.length + days.length + extras.length};
}


/* A MEDIAN OF ONE IS NOT A MEDIAN. This reported "across 1 of your own bookings
   the typical one arrives 59 days before check-in" — one booking, described as
   typical, in the same footer that tells the operator what the app knows. Same
   shape as the Money card averaging a rate out of three long stays: the
   arithmetic was fine and the refusal was missing.

   Eight, because that is roughly where a median stops moving by half its own
   value when one more row lands. Below it the footer says there is not enough
   yet, which is true and is the thing worth saying. */
function leadTimes(){
  const rs = resv.filter(r => typeof r.bookedOn === "number" && r.start >= r.bookedOn);
  if(rs.length < 8) return null;
  const days = rs.map(r => r.start - r.bookedOn).sort((a,b)=>a-b);
  return {n: days.length, median: days[Math.floor(days.length/2)],
          avg: days.reduce((a,b)=>a+b,0)/days.length};
}

/* The same confound weekdayPattern carried, in the feed that decides which
   dates get called "emptier than a typical Tuesday": a raw per-weekday mean
   over the horizon is mostly a statement about how far ahead each weekday
   falls. Centred window here too, so "typical for that weekday" means typical
   against its own neighbourhood rather than against the booking curve. */
function weekdayFreeNorm(){
  const acc = Array.from({length:7}, ()=>({sum:0,n:0}));
  const R = 3;
  for(let d = R; d < DAYS - R; d++){
    let local = 0;
    for(let j = d - R; j <= d + R; j++) local += freeCount(j);
    local /= (R*2 + 1);
    if(local <= 0) continue;
    const w = dateAt(d).getDay();
    acc[w].sum += freeCount(d) / local; acc[w].n++;
  }
  /* back to a free-count so softDates can compare it with freeCount(d) */
  let all = 0; for(let d = 0; d < DAYS; d++) all += freeCount(d);
  const base = DAYS ? all/DAYS : 0;
  return acc.map(a => a.n ? a.sum/a.n * base : base);
}
function softDates(norm){
  const out = [];
  const margin = Math.max(3, NF*0.09);
  for(let d=0; d<Math.min(DAYS,25); d++){          // only what there is still time to act on
    const f = freeCount(d), m = norm[dateAt(d).getDay()];
    if(f - m >= margin) out.push({d, free:f, norm:m, over:f-m});
  }
  return out.sort((a,b)=> b.over - a.over);
}

/* WEEKDAY, NOT DISTANCE. Averaging each weekday's occupancy straight across the
   horizon measures the booking curve and calls it a weekday.

   Every weekday gets nine samples over nine weeks, but they sit at different
   average distances from today, and a forward book empties as it goes out.
   Measured on the real book, opening on a Sunday:

     occupancy   Sun 27.1  Mon 24.4  Tue 24.4  Wed 23.7  Thu 22.2  Fri 22.2  Sat 20.8
     mean offset     28        29        30        31        32        33        34

   Occupancy falls monotonically as the mean offset rises — correlation -0.96
   with distance, which is to say the chart WAS the booking curve. Sunday is not
   a good night; Sunday is the nearest weekday. And the card prescribed midweek
   pricing off it.

   Dividing by each week's own mean does not fix it, which is worth recording
   because it was tried: within any seven-day slice the later days are still the
   further ones, so the trend survives the ratio (measured: -0.965, no better).
   What cancels a local trend is a CENTRED window — each day against the mean of
   the seven days around it, three either side. The days before and after pull
   in opposite directions, so distance drops out and what is left is whether
   that day of the week sits above or below its own neighbourhood.

   The first and last three days have no centred window and are dropped; on a
   63-night horizon that leaves 57 days, about eight per weekday. */
function weekdayPattern(days){
  const dayOcc = d =>{
    let sold = 0, total = 0;
    for(let i=0;i<NF;i++){ if(blk[i][d]) continue; total++; if(occ[i][d]) sold++; }
    return total ? sold/total : null;
  };
  const acc = Array.from({length:7}, ()=>({sum:0,n:0}));
  const R = 3;
  for(let k = R; k < days.length - R; k++){
    const d = days[k], here = dayOcc(d);
    if(here === null) continue;
    let sum = 0, n = 0;
    for(let j = k - R; j <= k + R; j++){ const v = dayOcc(days[j]); if(v !== null){ sum += v; n++; } }
    const local = n ? sum/n : 0;
    if(local <= 0) continue;
    const w = dateAt(d).getDay();
    acc[w].sum += here/local; acc[w].n++;
  }
  /* Scaled back onto the horizon's own average so the bars still read as
     occupancy rather than as a ratio nobody asked for. */
  let sold = 0, total = 0;
  days.forEach(d=>{ for(let i=0;i<NF;i++){ if(blk[i][d]) continue; total++; if(occ[i][d]) sold++; } });
  const base = total ? sold/total : 0;
  return acc.map(a => a.n ? Math.max(0, Math.min(1, a.sum/a.n * base)) : null);
}
/* How many days actually carried a centred window, so a card naming a best and
   worst day can say what it read. */
function weekdaySamples(days){ return Math.max(0, days.length - 6); }

const buildingsOf = ()=>{
  const seen = new Map();
  flats.forEach(f=>{ if(!seen.has(f.code)) seen.set(f.code, {code:f.code, name:f.bname, short:f.bshort}); });
  return [...seen.values()];
};

/* ── bookings ────────────────────────────────────────────────────────────────
   `resv` is the single source of truth. occ[] and chg[] are derived from it, so
   adding or cancelling a booking is just a mutation plus recompute().          */
let resv = [];
let occ = [], chg = [], blk = [];

/* These four sit here, immediately under the state they read, because the
   demo seeders below run during boot and reach for them. A `const` declared
   further down the file is not merely later — it is in its temporal dead zone,
   and the seeder dies with "cannot access before initialization". That has
   happened four times in this file now; keeping the primitives above their
   first caller is the fix that stops it happening a fifth. */
function freeRange(fi,a,b){ for(let d=a;d<b;d++){ if(d<0||d>=DAYS||occ[fi][d]) return false; } return true; }
/* freeRange does not mean "free". It means "free AND entirely inside the book",
   because it returns false for any d >= DAYS. That is right for a question
   about nights, and wrong for every occupancy CHECK — a stay running past the
   horizon is not in conflict with anything, there is simply no room left in the
   array to record it. recompute() has always known this and clamps with
   Math.min(r.end, DAYS); the guards never did.

   Used as a conflict test it cost real bookings. Undo re-checked the nights it
   had just freed, the check failed on the horizon rather than on any conflict,
   and the operator got "Those nights are gone — TT-103 was taken while the
   cancellation was on screen" naming a guest who does not exist, for a flat I
   verified was completely empty. The row was already spliced out, so the stay,
   its phone number, its amount and its payment went with it. Seven such stays
   in the shipped book. The booking form refused the same stays up front for the
   same reason, and blamed the same imaginary guest.

   So: check the part of the span the book can actually hold. The caller still
   has to reject a start outside the horizon — that is a different question, and
   every caller here already asks it. */
const freeSpan = (fi,a,b) => a < DAYS && freeRange(fi, Math.max(a,0), Math.min(b, DAYS));
function runFrom(fi,d){ let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++; return n; }
/* HOW LONG IS IT FREE — answered with the date it stops being free, not with a
   count of nights.

   Three surfaces said this three ways — "38 nights free", "63+ nights",
   "free 38 nights from 29 Aug" — and the worst of them, `63+`, is not a fact
   about the room at all. 63 is DAYS, the length of the book. Two flats both
   badged "63+ nights" may be free for sixty-four nights and for three hundred,
   and the badge leaks an implementation number to an operator who has no reason
   to know the app holds nine weeks.

   The date is also the question actually being asked. A caller wants 4 nights
   from Tuesday; "until 6 Oct" answers that without the operator doing
   arithmetic against a number whose start date is implied. A room whose free
   run reaches the end of the book has nothing booked ahead of it, and that —
   not a horizon — is what to say.

   `until` is the check-out morning, which is the idiom the rest of the app
   already uses: free for nights [day, day+run), next guest arrives day+run, so
   a stay sold here can run right up to a check-out on that date. */
function freeWords(fi, day, short){
  const run = runFrom(fi, day);
  if(day + run >= DAYS) return short ? "Open" : "no bookings";
  return (short ? "Till " : "until ") + fmt(day + run);
}
/* Derived, not restated. UNIT_TYPES offers "4 BHK" and this table stopped at
   "3 BHK", so SIZE["4 BHK"] was undefined — and every `x < undefined` is
   false, which silently switched OFF the one hard rule in the mover: never
   move somebody to a smaller flat. A 4 BHK guest could be sent to a studio
   under a row reading "never smaller". Two lists that must agree should be
   one list. */
const SIZE = Object.fromEntries(UNIT_TYPES.map((t,i)=>[t,i]));
/* How many guests one booking may be worth disturbing. Eight was the app's
   guess and the operator's answer is three: past three rooms this stops being a
   shuffle and becomes a morning of phone calls, and nobody at Crescent Stays is
   going to make five guests repack to sell one flat. Set by the person who has
   to place those calls, not by the search.

   The number is still not kept quiet. Anything ruled out by this ceiling is
   counted and said out loud under the options, so "no options" never silently
   means "options you were not shown". */
const MOVE_CEILING = 3;
let movesBeyondCeiling = 0;

/* A block is an entry with kind:"block" — a flat out of service for maintenance,
   a deep clean or owner use. It occupies nights exactly like a booking so it can
   never be sold, but it is NOT a booking: it has no guest, it is excluded from
   arrivals, departures, turnarounds, stay length, source mix and extensions, and
   for occupancy it leaves the denominator rather than joining the numerator —
   otherwise blocking a flat would flatter your occupancy figure. */
const isBlock = r => r.kind === "block";
const bookings = () => resv.filter(r => !isBlock(r));

function recompute(){
  occ = flats.map(()=>new Uint8Array(DAYS));
  chg = flats.map(()=>new Uint8Array(DAYS));
  blk = flats.map(()=>new Uint8Array(DAYS));
  resv.forEach(r=>{
    for(let k=Math.max(r.start,0); k<Math.min(r.end,DAYS); k++){
      occ[r.fi][k]=1;
      if(isBlock(r)) blk[r.fi][k]=1;
    }
  });
  // a night that is booked AND is somebody's check-out morning is a same-day
  // turnaround — blocks never create one
  bookings().forEach(r=>{
    if(r.end>=0 && r.end<DAYS && occ[r.fi][r.end] && !blk[r.fi][r.end]) chg[r.fi][r.end]=1;
  });
}

/* ── the book ───────────────────────────────────────────────────────────────────
   Crescent Stays' own bookings, read out of the Availability tab of the
   operator's workbook. Nothing here is generated: every row is a stay somebody
   actually had, under the name the operator typed for them.

   The window is the 176 nights the book can hold — 95 back and 80 forward from
   the day it was exported. A tenancy that began earlier starts on its first
   night inside the window, which is what a rolling book shows anyway.

   [flat, first night (offset from today), nights, guest, source, ₹ total]

   The amount is 0 wherever the sheet did not record one, which is most of them.
   0 does NOT mean the stay was free and the app never fills the gap in: a made
   up figure in a money column is worse than a blank, because a blank asks the
   question and a number answers it wrongly.                                   */
/* THE DAY THE OFFSETS BELOW ARE MEASURED FROM.

   Every `start` in BOOK is a number of days from this date, not from whenever

   every day: a stay the sheet records on 29 August rendered as 30 August the
   next morning, 31 August the morning after, and the app quietly disagreed
   with the operator's own spreadsheet about every date it holds — including
   which rooms are free tonight. Caught the first time the clock rolled over
   with real data in the file.

/* The book, laid into the app's own shape. Runs once at boot when there is
   nothing saved; after that the operator's edits are the book and this is never
   consulted again. */
function seedRealBook(){
  resv = []; issues = [];
  /* Same arithmetic as load(): the book was written against BOOK_ON, so shift
     every offset by however many days have passed since. A book read on
     Saturday still says Saturday on Tuesday. */
  const on = new Date(BOOK_ON + "T00:00:00"); on.setHours(0,0,0,0);
  const drift = Math.round((on - today) / 86400000);
  BOOK.forEach(([id, start0, nights, guest, si, amount, cut])=>{
    let start = start0;
    const fi = flatIndex[id];
    if(fi === undefined) return;          // a flat that has since left the book
    const src = SRC[si] || SRC[0];
    start += drift;
    const row = {fi, start, end: start + nights, nights, guest, src,
                 amount: amount || undefined, pays: []};
    /* WHAT THE WINDOW CUT OFF. The book holds 176 nights; the operator's sheet
       runs to November 2027. A tenancy still going when the window closes has
       NO RECORDED CHECK-OUT, and `end` for it is an artefact of the import —
       176 is BACK + FWD + 1, not a fact about anybody's stay.

       This shipped, and it is the worst thing this file can do: the room sheet
       read "Long stay is in until 18 Nov" and the export wrote 18 Nov 2026 in
       a typed date cell, for four TreeTops tenancies the sheet runs to the end
       of 2027 without ever ending. A date nobody wrote down, set in the same
       type as one they did. openEnd is how every surface knows to say what is
       true instead. */
    if(cut & 1) row.openStart = true;
    if(cut & 2) row.openEnd = true;
    /* Who has already paid, and nobody else. A platform stay was settled by the
       guest before arrival and the money is sitting with the platform, so that
       payment is real. A direct guest who has already checked out has paid —
       nobody leaves a serviced apartment owing the whole stay. A direct guest
       still here, or still to come, is left unpaid: that is precisely the
       figure the operator must check against their own records, and an app
       that guesses it hides the only question worth asking. */
    if(amount){
      if(PLATFORMS.indexOf(src) >= 0)
        row.pays.push({id:"b" + resv.length, amount, method:"Platform", on: Math.max(start - 3, -95)});
      else if(row.end <= 0)

               reason: /pest/i.test(why) ? "Maintenance" : "Owner use",
               note: why, guest:"Out of service", src:"Block"});
  });

/* WHAT SURVIVES A RELOAD.
   One predicate, three call sites — load(), cacheLoad() and cloudPull() each
   had their own copy of this filter and they have to agree, because whichever
   one runs is the one that decides what the operator still owns.

   Blocks already had grace: a week past their end so the app can still ask
   whether the flat came back, and 120 days if a FAULT was recorded, because
   that row is the only evidence this is the third time the same AC has failed.

   BOOKINGS HAD NONE, and that erased money. A guest who checks out still owing
   is exactly what "Already left · has to be chased" on the Money tab is for —
   and the morning after they left, the storage layer deleted the row the chase
   list was pointing at. Measured on the shipped book: 455 rows to 439 in one
   rollover, and ₹79,700 of recorded debt gone, ₹39,900 of it on screen one tab
   away. It leaves exportRows() and guestByPhone() too, so the debt cannot be
   recovered from a spreadsheet and the guest is a stranger if they call back.

   A debt does not stop existing because the guest went home. It gets the same
   window a fault does: long enough to still be chased, bounded so the book does
   not grow forever.

   Written out rather than calling dueFrom(), which is declared ~450 lines below
   this and would be in its temporal dead zone at boot. */
const stillOwed = r => (r.amount || 0) -
  (r.pays || []).reduce((s,p)=> s + (p.amount || 0), 0);
const keepOnLoad = r =>
  r.start < DAYS && (
    r.kind === "block"
      ? (r.end >= -7 || (r.fault && r.end >= -REPEAT_WINDOW))
      : (r.end >= 0 || (stillOwed(r) > 0 && r.end >= -REPEAT_WINDOW))
  );

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.rows)) return false;
    customFaults = Array.isArray(d.customFaults)
      ? d.customFaults.filter(x => typeof x === "string" && x.trim()).slice(0, 40)
      : [];
    const savedOn = new Date(d.savedOn + "T00:00:00");
    savedOn.setHours(0,0,0,0);
    const shift = Math.round((savedOn - today) / 86400000);
    let dropped = 0;
    resv = collapseMerged(d.rows
      .map(r => ({...r, _wasId: r.id, id: liveFlatId(r.id)}))
      .filter(r => { const ok = flatIndex[r.id] !== undefined; if(!ok) dropped++; return ok; })
      .map(r => ({ _wasId: r._wasId, fi:flatIndex[r.id], start:r.start+shift, end:r.end+shift,
                   nights:r.end-r.start, guest:r.guest, src:r.src, manual:r.manual,
                   kind:r.kind, reason:r.reason, note:r.note,
                   fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                   phone:r.phone, pax:r.pax, amount:r.amount,
                   pays: (r.pays || []).map(p => ({...p, on: (p.on || 0) + shift})),
                   bookedOn: typeof r.bookedOn === "number" ? r.bookedOn + shift : undefined })))
      // Blocks linger a week past their end so the app can still ask whether the
      // flat came back into service — and a block that recorded a FAULT is kept
      // far longer, because it is the only evidence that this is the third time
      // the same AC has failed. Throwing it away after a week would delete the
      // feature that reads it.
      .filter(keepOnLoad);
    /* A row that still cannot be placed is a real loss and must not be silent.
       It is the only sign the operator would ever get that an update took
       something from them. */
    if(dropped) telError("bookings dropped on load: flat id not in inventory",
                         {stack: "dropped=" + dropped + " flats=" + NF});
  issues = (d.issues || []).filter(x => flatIndex[liveFlatId(x.id2)] !== undefined)
    .map(x => ({...x, fi: flatIndex[liveFlatId(x.id2)], on: (x.on || 0) + shift,
                fixed: x.fixed == null ? null : x.fixed + shift}));
    return true;
  }catch(e){ return false; }
}

   2. **Writes apply here first and travel afterwards.** Nobody holding a phone

   nothing to mark the moment it turned.

function logAct(kind, line, ref){

/* ── talking to it ─────────────────────────────────────────────────────────── */
async function api(path, opt){
  opt = opt || {};
  const h = {apikey: SUPA_KEY, "Content-Type":"application/json", ...(opt.headers || {})};
  if(opt.auth !== false && session && session.access_token)
    h.Authorization = "Bearer " + session.access_token;
  const res = await fetch(SUPA_URL + path, {
    method: opt.method || "GET", headers: h,
    body: opt.body === undefined ? undefined : JSON.stringify(opt.body)
  });
  const text = await res.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok){
    const e = new Error((data && (data.message || data.error_description || data.msg))
                        || ("HTTP " + res.status));
    e.status = res.status; e.code = data && data.code; e.body = data;
    throw e;
  }
  return data;
}
function keepSession(d){
  session = { access_token: d.access_token, refresh_token: d.refresh_token,
              expires_at: Date.now() + (d.expires_in || 3600) * 1000,
              email: (d.user && d.user.email) || (session && session.email) || "",
              uid:   (d.user && d.user.id)    || (session && session.uid)   || null };

/* Access tokens last an hour. Renew a minute early so a booking never fails for
   the sake of a clock. */
async function freshToken(){
  if(!session || !session.refresh_token){ const e = new Error("signed out"); e.status = 401; throw e; }
  if(session.expires_at && Date.now() < session.expires_at - 60000) return;
  try{

async function rest(method, path, body, headers){

/* ── TELEMETRY — how the app is behaving, on somebody else's phone ───────────
   The schema for this has existed since the first migration and nothing ever
   wrote to it. app_sessions, app_events and app_errors were designed, given RLS
   and three ops views, and left empty — so when the operator says "I moved a
   guest and the flat still shows open", there is no way to see what the app
   actually did. That is the whole reason this exists: a bug on a phone in
   another city is invisible unless the app says something.

   THREE RULES, and they are why this is safe to ship:

   1. NO GUEST DATA. The migration says it outright and this enforces it: props
      carry counts, ids and flags — never a name, a note, a phone or an amount.
      A crash report that leaks a guest's name is worse than no crash report.
   2. NEVER BLOCK AND NEVER THROW. Every call is fire-and-forget behind a catch.
      Telemetry that can break the app is a bug generator, not a bug detector.
   3. ONLY WHEN SIGNED IN. The insert policy requires an authenticated user and
      a host they belong to. In sample mode there is nobody to attribute it to
      and nothing worth knowing, so it stays off entirely.                    */
const APP_VERSION = "2026-08-30";           // bumped by hand with each deploy
/* TELEMETRY IS NOT THE SYNC LAYER, and tying the two together is what made the
   tables sit empty for a month. CLOUD_ENABLED gates the whole two-way sync —
   stays, payments, inventory — which is a large thing to switch on and carries
   real risk. Knowing that an app crashed is a small thing and carries almost
   none, so it gets its own switch. The app is local-only today; this is the
   only thing it says to a server, and it says it as `anon`. */
const TELEMETRY_ON = true;
const TEL_KEY = "vacancy.device.v1";
let telSession = null, telQueue = [], telTimer = null, telOff = false;

/* One id per INSTALL, kept locally forever, so a run of events can be attributed
   to "the same phone" without knowing whose. It is a random uuid and nothing
   else — not a fingerprint, not derived from the device, and useless anywhere
   but in these three tables. */
function telDevice(){
  let d = null;
  try{ d = localStorage.getItem(TEL_KEY); }catch(e){}
  if(!d){ d = uuid(); try{ localStorage.setItem(TEL_KEY, d); }catch(e){} }
  return d;
}
function telOn(){ return TELEMETRY_ON && !telOff; }

/* Signed in, this rides the operator's own token and lands against their host.
   Signed out — which is every install today — it goes as anon with host_id
   null, which is exactly what the insert policy allows. */
function telPost(path, body){
  const authed = !!(session && session.access_token);
  return api("/rest/v1" + path, {method:"POST", body, auth: authed,
                                 headers:{Prefer:"return=minimal"}});
}

/* One row per app launch, so a session can be followed through its own events. */
async function telStart(){
  if(!telOn()) return;
  try{
    telSession = uuid();
    await telPost("/app_sessions", {
      id: telSession, host_id: hostId || null,
      app_version: APP_VERSION,
      user_agent: String(navigator.userAgent || "").slice(0, 300),
    });
  }catch(e){ telSession = null; }
}

/* Batched, because a booking flow fires four events in a second and four
   round trips on a phone is a stutter the operator can feel. */
function track(name, props){
  if(!telOn()) return;
  telQueue.push({ session_id: telSession, host_id: hostId || null,
                  name: String(name).slice(0,60),
                  props: Object.assign({device: telDevice()}, props || {}),
                  app_version: APP_VERSION });
  if(telQueue.length >= 12) return telFlush();
  clearTimeout(telTimer);
  telTimer = setTimeout(telFlush, 4000);
}
async function telFlush(){
  clearTimeout(telTimer); telTimer = null;
  if(!telQueue.length || !telOn()) return;
  const batch = telQueue.splice(0, 40);
  try{ await telPost("/app_events", batch); }
  catch(e){
    /* Put them back ONCE, then give up. An event that cannot be posted must
       never grow into a queue that retries forever on a metered connection —
       and a telemetry backlog that outlives the bug it describes is landfill. */
    if(batch.length < 40 && telQueue.length < 60) telQueue = batch.concat(telQueue);
  }
}
/* The page going away is the only moment a partial batch is guaranteed to be
   lost, so it is also the only place a synchronous send is worth it. */
addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") telFlush(); });
addEventListener("pagehide", ()=> telFlush());

function telError(message, extra){
  if(!telOn()) return;
  const e = extra || {};
  /* Fire-and-forget and deliberately unbatched: the next thing that happens
     after an error may be the tab closing. */
  telPost("/app_errors", {
    session_id: telSession, host_id: hostId || null,
    message: String(message || "unknown").slice(0, 400),
    stack: e.stack ? String(e.stack).slice(0, 2000) : null,
    source: e.source ? String(e.source).slice(0, 200) : null,
    line: e.line != null ? (e.line | 0) : null,
    col: e.col != null ? (e.col | 0) : null,
    app_version: APP_VERSION,
    user_agent: String(navigator.userAgent || "").slice(0, 300),
  }).catch(()=>{});
}

/* EVERYTHING THE APP THROWS, not just what somebody remembered to wrap. An
   error that only appears in a console the operator will never open is an error
   nobody will ever hear about. */
addEventListener("error", ev=>{
  telError(ev.message || "error", {stack: ev.error && ev.error.stack,
    source: ev.filename, line: ev.lineno, col: ev.colno});
});
addEventListener("unhandledrejection", ev=>{
  const r = ev.reason;
  telError((r && (r.message || r)) || "unhandled rejection", {stack: r && r.stack});
});

/* ── signing in and out ────────────────────────────────────────────────────── */
/* ── THE FIRST SIGN-IN IS THE DANGEROUS ONE ──────────────────────────────────
   This used to be: authenticate, cloudPull(), jdel(STORE). cloudPull replaces
   flats and resv wholesale with whatever the server has, and jdel throws the
   local book away — which is correct when the server holds the operator's book
   and the local copy is the sample. It is catastrophic in the other direction.

   The app has been local-only since it shipped. The operator's real book — his
   bookings, his edits, months of them — exists in localStorage on his phone and
   NOWHERE ELSE. The server is empty. Signing in would have replaced 700+ real
   bookings with nothing and then deleted the only copy.

   So the first sign-in ADOPTS rather than replaces:

     the server has a book   ->  pull it, as before
     the server is empty     ->  push this device's book up, and keep it

   And the local copy is only discarded when it is still the untouched sample —
   `usingDemo` is exactly that flag. Anything the operator has touched stays on
   the phone as well as on the server, because a sync that can leave you with
   neither copy is worse than no sync. */
async function adoptLocalBook(){
  /* Buildings and flats first: a stay references a flat uuid, so the flats have
     to exist (or at least be queued ahead of it) before the stays go. */
  syncInventory([]);
  const mine = resv.filter(r => !r.sid);
  mine.forEach(r=>{
    r.sid = uuid();
    const f = flats[r.fi];
    if(!f) return;
    enqueue({k:"stay+", id:r.sid, body:{
      flat_id: f.uid, kind: isBlock(r) ? "block" : "stay",
      starts_on: dayISO(r.start), ends_on: dayISO(r.end),
      guest_name: isBlock(r) ? null : (r.guest || null),
      guest_phone: r.phone || null, source: r.src || null,
      pax: r.pax || null, amount: r.amount || null,
      reason: r.reason || null, note: r.note || null,
      fault: r.fault || null, fixer: r.fixer || null,
      fixer_phone: r.fixer_phone || null, cost: r.cost || null,
      booked_on: dayISO(typeof r.bookedOn === "number" ? r.bookedOn : 0),
      created_by: session && session.uid }});
    (r.pays || []).forEach(pay=>{
      enqueue({k:"pay+", id: pay.id || uuid(), body:{
        stay_id: r.sid, amount: pay.amount, method: pay.method,
        received_on: dayISO(pay.on || 0), note: pay.note || null,
        created_by: session && session.uid }});
    });
  });
  issues.filter(x => !x.sent).forEach(x=>{
    const f = flats[x.fi]; if(!f) return;
    x.sent = 1;
    enqueue({k:"iss+", id: x.id || uuid(), body:{
      flat_id: f.uid, fault: x.fault || null, note: x.note || null,
      urgency: x.urgency || null, reported_on: dayISO(x.on || 0) }});
  });
  logAct("sync", `Signed in — sent ${mine.length} booking${mine.length===1?"":"s"} `
    + `and ${flats.length} flats up to the shared book`);
  return mine.length;
}

async function signIn(email, password){
  keepSession(await api("/auth/v1/token?grant_type=password",
    {method:"POST", auth:false, body:{email: email.trim(), password}}));
  MODE = "live";
  jdel(BROWSE_KEY);
  await loadHost();

  /* Held BEFORE the pull can overwrite them. If the server turns out to be
     empty these are put straight back, so a failed or empty pull can never be
     the thing that loses the book. */
  const hadLocal = resv.slice(), hadFlats = flats.slice(),
        hadIssues = issues.slice(), wasDemo = usingDemo;

  await cloudPull();

  const serverHasNothing = !resv.length && !flats.length;
  if(serverHasNothing && hadLocal.length){
    resv = hadLocal; flats = hadFlats; issues = hadIssues;
    NF = flats.length;
    flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id, i]));
    recompute();
    await adoptLocalBook();
    /* The book is now queued for the server AND still on the phone. It stays on
       the phone until it has actually landed — see the queue, which persists
       and retries. */
  } else if(wasDemo){
    /* Only the untouched sample is safe to discard. Anything he has edited is
       kept as well as synced. */
    jdel(STORE);
  }
  cacheSave();
  paintAcct();
}
async function loadHost(){
  const rows = await rest("GET", "/memberships?select=host_id,role,hosts(name,slug)");
  if(!rows || !rows.length){
    const e = new Error("This login is not attached to a property yet.");
    e.status = 403; throw e;
  }
  hostId = rows[0].host_id;
  hostName = (rows[0].hosts && rows[0].hosts.name) || "";
}
function signOut(silent){
  const tok = session && session.access_token;
  session = null; hostId = null; hostName = ""; MODE = "sample";
  queue = []; jdel(QUEUE_KEY); jdel(SESSION_KEY); jdel(CLOUD_KEY);
  if(tok) fetch(SUPA_URL + "/auth/v1/logout", {method:"POST",
    headers:{apikey:SUPA_KEY, Authorization:"Bearer " + tok}}).catch(()=>{});
  if(!silent){
    flats = loadInventory() || defaultInventory();
    NF = flats.length;
    flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));
    usingDemo = !load();
    if(usingDemo){ seedRealBook(); }
    else issues = [];
    recompute(); paintAcct(); refreshScreen();
  }
}

/* ── reading the book ──────────────────────────────────────────────────────── */
async function cloudPull(){
  if(!hostId) await loadHost();
  const from = dayISO(-8), to = dayISO(DAYS);
  const [bs, fl, st, pm, iss] = await Promise.all([
    rest("GET", "/buildings?select=id,code,name,short_name,sort_order&order=sort_order.asc,code.asc"),
    rest("GET", "/flats?select=id,building_id,code,floor,unit_type,nightly_rate&active=is.true&order=code.asc"),
    rest("GET", "/stays?select=*&ends_on=gt." + from + "&starts_on=lt." + to),
    rest("GET", "/payments?select=id,stay_id,amount,method,received_on,note&order=received_on.asc"),
    rest("GET", "/issues?select=*&order=reported_on.asc"),
  ]);
  const paysBy = {};
  (pm || []).forEach(p => (paysBy[p.stay_id] = paysBy[p.stay_id] || []).push(
    {id:p.id, amount:Number(p.amount), method:p.method, on:dayOff(p.received_on), note:p.note}));
  const byB = Object.fromEntries((bs || []).map(b=>[b.id, b]));
  flats = (fl || []).map(f=>{
    const b = byB[f.building_id] || {code:"??", name:"Unfiled", short_name:"Unfiled", sort_order:999};
    return { uid:f.id, bid:f.building_id, id:f.code, code:b.code, bname:b.name,
             bshort: b.short_name || b.name, floor: f.floor, type: f.unit_type,
             rate: Number(f.nightly_rate) || 0, ord: b.sort_order | 0, pop: 0.6 };
  })
  // buildings in the order the operator thinks of them, not alphabetically —
  // the room grid is scanned by position, so this order is muscle memory
  .sort((a,b)=> a.ord - b.ord || a.id.localeCompare(b.id));
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id, i]));
  const byUid = Object.fromEntries(flats.map((f,i)=>[f.uid, i]));
  resv = (st || []).map(s=>{
    const fi = byUid[s.flat_id];
    if(fi === undefined) return null;              // a flat we cannot see or is retired
    const start = dayOff(s.starts_on), end = dayOff(s.ends_on);
    const block = s.kind === "block";
    return { sid:s.id, fi, start, end, nights: end - start, manual:true,
             guest: s.guest_name || (block ? (s.reason || "Out of service") : "Guest"),
             src: s.source || (block ? "Block" : "Direct"),
             kind: block ? "block" : undefined, reason: s.reason, note: s.note,
             fault: s.fault || undefined, fixer: s.fixer || undefined,
             fixer_phone: s.fixer_phone || undefined,
             cost: s.cost != null ? Number(s.cost) : undefined,
             phone: s.guest_phone || undefined, pax: s.pax || undefined,
             amount: s.amount != null ? Number(s.amount) : undefined,
             pays: paysBy[s.id] || [],
             bookedOn: s.booked_on ? dayOff(s.booked_on) : undefined };
  }).filter(Boolean)
    // same retention rule as the local store: a week for ordinary blocks, the
    // whole repeat window for anything that recorded a fault
    .filter(keepOnLoad);
  issues = (iss || []).map(x=>{
    const fi = byUid[x.flat_id];
    if(fi === undefined) return null;
    return {id:x.id, fi, fault:x.fault || undefined, note:x.note || "",
            urgency:x.urgency || "soon", on:dayOff(x.reported_on),
            fixed: x.fixed_on ? dayOff(x.fixed_on) : null,
            fixer:x.fixer || undefined, fixer_phone:x.fixer_phone || undefined,
            cost: x.cost != null ? Number(x.cost) : undefined};
  }).filter(Boolean);
  usingDemo = false;
  recompute(); cacheSave();
}

/* The cache exists for the lift with no signal. Same date-rebasing trick as the
   local store, so a book cached yesterday still reads correctly today. */
function cacheSave(){
  if(MODE !== "live") return;
  jset(CLOUD_KEY, { on: isoDay(today), host: hostId, hostName,
    flats: flats.map(f=>({uid:f.uid, bid:f.bid, id:f.id, code:f.code, bname:f.bname,
                          bshort:f.bshort, floor:f.floor, type:f.type, rate:f.rate, ord:f.ord})),
    issues: issues.map(x=>({...x, id2:flats[x.fi] && flats[x.fi].id})),
    rows: resv.map(r=>({ sid:r.sid, id: flats[r.fi] && flats[r.fi].id,
                         start:r.start, end:r.end, guest:r.guest, src:r.src,
                         kind:r.kind, reason:r.reason, note:r.note,
                         fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                         phone:r.phone, pax:r.pax, amount:r.amount, pays:r.pays,
                         bookedOn: typeof r.bookedOn === "number" ? r.bookedOn : undefined }))});
}
function cacheLoad(){
  const d = jget(CLOUD_KEY);
  if(!d || !Array.isArray(d.flats) || !d.flats.length) return false;
  const was = new Date(d.on + "T00:00:00"); was.setHours(0,0,0,0);
  const shift = Math.round((was - today) / 86400000);
  hostId = d.host || null; hostName = d.hostName || "";
  flats = d.flats.map(f=>({...f, pop:0.6}));
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id, i]));
  resv = (d.rows || [])
    /* the cloud cache is loaded by the same rule and loses rows the same way */
    .map(r => ({...r, _wasId: r.id, id: liveFlatId(r.id)}))
    .filter(r => flatIndex[r.id] !== undefined)
    .map(r => ({ _wasId:r._wasId, sid:r.sid, fi:flatIndex[r.id], start:r.start + shift, end:r.end + shift,
                 nights:r.end - r.start, guest:r.guest, src:r.src, manual:true,
                 kind:r.kind, reason:r.reason, note:r.note,
                 fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                 phone:r.phone, pax:r.pax, amount:r.amount,
                 pays: (r.pays || []).map(p => ({...p, on: (p.on || 0) + shift})),
                 bookedOn: typeof r.bookedOn === "number" ? r.bookedOn + shift : undefined }))
    .filter(keepOnLoad);
  resv = collapseMerged(resv);
  issues = (d.issues || []).filter(x => flatIndex[liveFlatId(x.id2)] !== undefined)
    .map(x => ({...x, fi: flatIndex[liveFlatId(x.id2)], on: (x.on || 0) + shift,
                fixed: x.fixed == null ? null : x.fixed + shift}));
  usingDemo = false;
  recompute();
  return true;
}

/* ── writing it back ───────────────────────────────────────────────────────────
   Every write carries a client-generated id, and for inserts that id *is* the
   row's primary key. So a retry after a flaky connection cannot create the
   booking twice: the second attempt collides with itself and is treated as the
   success it actually was.                                                    */
function enqueue(op){
  if(MODE !== "live") return;
  queue.push(op); jset(QUEUE_KEY, queue);
  paintAcct(); flush();
}
async function flush(){
  if(syncing || MODE !== "live" || !queue.length) return;
  syncing = true; paintAcct();
  try{
    if(!hostId) await loadHost();
    while(queue.length){
      const op = queue[0];
      let settled = true;
      inflight = op;
      try{ await runOp(op); }
      catch(e){
        if(e.status === undefined){ settled = false; }        // no network — keep it
        else await rejected(op, e);                           // the server said no
      }
      inflight = null;
      if(!settled) break;
      // remove by identity, not position: a cancel landing mid-flight may have
      // filtered the queue underneath us, and shift() would eat the wrong op
      const at = queue.indexOf(op);
      if(at >= 0) queue.splice(at, 1);
      jset(QUEUE_KEY, queue);
    }
  }catch(e){ /* could not even resolve the host — try again on the next event */ }
  syncing = false;
  if(needPull && !queue.length){
    needPull = false;
    try{ await cloudPull(); refreshScreen(); }catch(e){}
  }
  paintAcct();
}
const MIN = {Prefer:"return=minimal"};
function runOp(op){
  switch(op.k){
    case "stay+": return rest("POST",  "/stays", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "stay~": return rest("PATCH", "/stays?id=eq." + op.id, op.body, MIN);
    case "stay-": return rest("DELETE","/stays?id=eq." + op.id, undefined, MIN);
    case "iss+":  return rest("POST",  "/issues", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "iss~":  return rest("PATCH", "/issues?id=eq." + op.id, op.body, MIN);
    case "iss-":  return rest("DELETE","/issues?id=eq." + op.id, undefined, MIN);
    case "pay+":  return rest("POST",  "/payments", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "pay-":  return rest("DELETE","/payments?id=eq." + op.id, undefined, MIN);
    case "bld+":  return rest("POST",  "/buildings", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "flat+": return rest("POST",  "/flats", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "flat~": return rest("PATCH", "/flats?id=eq." + op.id, op.body, MIN);
    case "flat-": return rest("DELETE","/flats?id=eq." + op.id, undefined, MIN);
    case "wipe":  return rest("DELETE","/stays?host_id=eq." + hostId, undefined, MIN);
  }
  return Promise.resolve();
}
async function rejected(op, e){
  if(e.code === "23505") return;                    // a retry that had already landed
  if(e.code === "23P01"){ await lostTheRoom(op); return; }
  if(e.status === 401 || e.status === 403){
    toast("bad", "<b>Signed out.</b> Sign in again to save this.", null);
    signOut(true); paintAcct(); openGate(); return;
  }
  // Anything else is a bug rather than a race, and losing it silently would be
  // the one unforgivable outcome — so it is both reported and recorded.
  rollBack(op);
  toast("bad", "<b>Not saved.</b> " + esc(e.message) + " Nothing was changed on the server.", null);
}
function rollBack(op){
  if(op.k === "stay+"){
    const i = resv.findIndex(r => r.sid === op.id);
    if(i >= 0) resv.splice(i, 1);
  }
  needPull = true;
  recompute(); cacheSave();
}

/* ── the headline case: somebody else got there first ──────────────────────────
   The exclusion constraint (23P01) fired, which means these nights were taken
   between this phone accepting the entry and the write reaching the server.
   Say who took it. "Conflict" tells an operator nothing; a name and dates let
   them get back on the call and offer something else.                         */
async function lostTheRoom(op){
  const mine  = resv.find(r => r.sid === op.id);
  const block = op.body && op.body.kind === "block";
