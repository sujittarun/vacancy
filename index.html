     and 105% so the colour that comes through is the colour that is there. The
     sheet is still transparent — you can see the room move behind it — it just
     no longer repaints it in a different hue on the way. */
  --lg-sheet-tint:blur(12px) saturate(105%) brightness(1.06);
  /* Two depths, two strengths, and the difference is what each one sits ON.
     The sheet and the bars sit on RAW page — a near-black FREE tile one moment
     and white ground the next — so they carry the strong tint. Everything
     inside a sheet is already standing on a surface that normalised its
     backdrop, so a second full-strength tint there would be paying twice and
     would flatten what little is left showing. Cards get the light one. */
  /* ══ THE LADDER — one value per KIND ══════════════════════════════════════
     Measured before writing, because the drift was visible on screen and worth
     naming: the app had THREE fills doing the single job of "a raised pane"
     (.16 on the ops row, .14 on a card in a sheet, .10 on a route button),
     buttons split across two OPPOSITE materials — .roomRoutes raised in white,
     .copybtn and .rowx cut in with ink, for the same job — a calendar cell at
     .40 denser than the card containing it, ten distinct corner radii and seven
     border colours. None of that was decided. It arrived one edit at a time,
     and it is exactly what reads as different white densities on things that
     ought to match.

     Five surface steps, each meaning something you can say out loud:
       FLAT   content that sits ON the page, grouped by space and a hairline
              rather than by a box.
       RAISE  a pane laid on whatever is behind it — cards, the ops row, and
              the big tappable panels, which are panels before they are buttons.
       CELL   a tappable DATA cell. Denser than a pane because it has to read as
              a target at arm's length; no longer denser than its own container.
       FLOAT  something over everything — the sheet, both bars, a toast, the
              scrub callout.
       SUNK   anything cut INTO a surface — fields, troughs, chips, the small
              controls. Ink, never a paler white: white on white has nowhere to
              go, which is how a search field once vanished completely.

     The rule for which one a thing takes is its KIND, never its size or its
     screen. Change a step here and every instance of that kind moves together,
     which is the whole point. */
  --s-flat:transparent;
  --s-raise:rgba(255,255,255,.16);
  --s-cell:rgba(255,255,255,.30);
  --s-float:rgba(255,255,255,.54);
  --s-sunk:rgba(13,16,23,.05);
  /* PRESSED is a step too, not a one-off. Under a thumb the pane thins and lets
     more light through, which is what a real slab does when you push it against
     its ground — so press LIFTS a raised pane and DEEPENS a sunk one. */
  --s-raise-press:rgba(255,255,255,.20);
  --s-sunk-press:rgba(13,16,23,.09);
  /* INK is the sixth step and the only one that is not white or a tint of the
     page: the dark answers — "4 nights free", the yes button, the primary act.
     It is --free, the vacancy fill, at the material's thickness, so the answer
     is the same colour this app always uses for vacancy and the same substance
     as everything around it. Written as a mix rather than the literal
     rgba(28,35,49,.84) it used to be, because that literal WAS --free and
     nothing said so — which is how a second rule later in the file quietly
     repainted the pill opaque while the yes button beside it stayed glass. */
  --s-ink:color-mix(in srgb, var(--free) 84%, transparent);
  /* one rim per step, for the same reason */
  --rim-raise:rgba(255,255,255,.50);
  --rim-sunk:rgba(13,16,23,.10);
  --rim-hair:rgba(13,16,23,.06);
  /* The radii are NOT here. They are geometry, identical in both themes, and
     they are consumed by ~70 rules that carry no [data-theme] guard — so
     declaring them in this block made them undefined in dark, where
     `border-radius:var(--r-lg)` is invalid at computed-value time and falls all
     the way back to 0. Dark shipped with square corners on the sheet, both
     bars, every pill, chip, field and card. They live in `:root{}` with the
     other theme-invariant values; see the note there. */
  --lg-fill-2:var(--s-raise);   /* kept as an alias so no call site breaks */
  /* a trough is the same pane cut INTO the surface: the light comes from under
     the lip instead of over it, so the rim inverts */
  --lg-rim-sunk:
    inset 0 1.5px 3px rgba(13,16,23,.13),
    inset 0 -1.5px 0 rgba(255,255,255,.72),
    inset 0 0 0 1px rgba(13,16,23,.05);
  --lg-edge:var(--rim-raise);
  --lg-rim:
    inset 0 1.5px 0 rgba(255,255,255,.85),      /* the top lip, catching light */
    inset 0 -1.5px 0 rgba(255,255,255,.22),     /* the under-edge, bouncing it */
    inset 0 20px 26px -20px rgba(255,255,255,.60),
    inset 0 -22px 30px -22px rgba(255,255,255,.28),
    inset 0 0 0 1px rgba(255,255,255,.18),      /* the pane's own thickness    */
    0 12px 28px -12px rgba(13,16,23,.30),       /* what it casts on the page   */
    0 2px 5px rgba(13,16,23,.13);
  --lg-sheen:linear-gradient(133deg,
    rgba(255,255,255,.70) 0%, rgba(255,255,255,.12) 16%,
    rgba(255,255,255,0) 36%, rgba(255,255,255,0) 70%,
    rgba(255,255,255,.16) 94%, rgba(255,255,255,.40) 100%);
}

/* ── L0 · the environment ────────────────────────────────────────────────────
   Something has to be behind the glass or the blur returns the colour it
   started with. Deliberately near-neutral: the reference palettes reach for
   blue, violet and teal blooms, and this app bans blue on purpose — it is the
   default accent of every scheduling tool alive — while amber is the only
   colour allowed to mean anything. So the environment is light and shade, not
   hue: one soft source top-left, cool weight top-right, a low pool beneath. */
/* A blurred flat colour is the same flat colour in either theme, so dark gets a
   ground with structure as well — far quieter than light's, because a dark
   ground shows its seams much sooner. */
:root[data-theme="dark"] body{
  background:
    radial-gradient(900px 520px at 6% -12%,  rgba(58,68,92,.55),  rgba(58,68,92,0) 52%),
    radial-gradient(700px 420px at 104% 2%,  rgba(38,46,66,.58),  rgba(38,46,66,0) 50%),
    radial-gradient(760px 640px at 42% 112%, rgba(30,36,52,.68),  rgba(30,36,52,0) 55%),
    var(--bg);
  background-attachment:fixed;
}
:root[data-theme="light"] body{
  /* THE GROUND IS THE WHOLE PROBLEM, and it took three redesigns of the cards
     to see it. A pane can only show what changes underneath it. The old ground
     had four blooms of 760–1150px, which is two to three times the width of the
     screen — so inside one card's own 350px footprint the ground shifted by
     ELEVEN levels out of 255. Effectively a flat colour. Every "glass" card
     drawn on it sampled one tint and rendered as flat paint, which is why it
     could only ever look like a white card, a grey stain, or nothing at all.
     Measured on a 390x844 canvas, sampling the range inside a card-sized
     window: old ground 11, this one 53.

     So the blooms are smaller than a card rather than larger than the screen,
     and there are seven of them, alternating light and cool. That is the entire
     trick — structure at the scale of the thing that has to reveal it.
     Still no hue with a job: amber is the only colour in this app allowed to
     mean anything, and this is light and shade with a cool cast, not a
     palette. */
  /* The amplitude is the second half of the problem, and it is a different one
     from the frequency. The first pass swung between PURE WHITE and a cool
     tint, which gave the glass plenty to reveal but broke the screen into
     bright and cool patches — one material has to look like one material.
     So: same bloom size, same count, half the swing. Searched rather than
     eyeballed, over base tone and both amplitudes, keeping only grounds whose
     REGIONAL spread stays under 9 and whose darkest point stays above 150 so
     type survives on it. Of the 99 that qualified this leaves the most local
     variation:
        before   local 54, regional spread 16   — glassy but patchy
        now      local 30, regional spread  9   — still glassy, reads as one
     The darkest region also lifts 165 to 183, so every ink on it gains. */
  /* THIRD PASS, AND THE LEVER WAS SIZE, NOT ALPHA. The room grid moved down the
     page when it gained a filter row and per-building headings, and the same
     opaque tile then sat over a visibly different part of the ground depending
     which building it was under — so identical tiles read as different greys.
     That is REGIONAL spread, and it is a separate quantity from the LOCAL
     variation the glass needs: dimming the blooms lowers both together and
     walks straight back toward the flat-paint ground this replaced.

     Halving the bloom SIZE lowers only the regional term, because structure
     finer than a card averages out across the screen while still changing
     inside one card's own footprint. Searched over alpha and size, scoring the
     worst local window rather than the best so a card cannot land in a dead
     patch:
        before   local 27.6-36.0, regional 13.4, darkest 196
        now      local 21.6-31.5, regional  5.8, darkest 200
     Regional falls 57%, the glass keeps essentially all of what it reveals —
     still twice the 11 that rendered as flat paint — and every ink gains
     four levels. */
  background:
    radial-gradient(200px 200px at 14% 4%,   rgba(255,255,255,.34),  rgba(255,255,255,0) 70%),
    radial-gradient(190px 190px at 86% 12%,  rgba(158,175,210,.43),  rgba(158,175,210,0) 70%),
    radial-gradient(180px 180px at 60% 32%,  rgba(255,255,255,.29),  rgba(255,255,255,0) 70%),
    radial-gradient(185px 185px at 16% 48%,  rgba(150,168,204,.39),  rgba(150,168,204,0) 70%),
    radial-gradient(195px 195px at 90% 64%,  rgba(255,255,255,.27),  rgba(255,255,255,0) 70%),
    radial-gradient(200px 200px at 36% 80%,  rgba(148,166,202,.41),  rgba(148,166,202,0) 70%),
    radial-gradient(190px 190px at 82% 97%,  rgba(255,255,255,.26),  rgba(255,255,255,0) 70%),
    #D8DFEC;
  background-attachment:fixed;
}

/* ── L1 · content ────────────────────────────────────────────────────────────
   Readable first. Light translucency, gentle blur, the softer sweep.        */
/* .ops-row was the largest opaque thing left on the screen — a solid white
   panel carrying arriving / leaving / turnaround. It is a content surface like
   any card, so it takes the content material. */
.card,
.tcard,
.night,
.day,
.ops-row{
  background-color:var(--g1);
  background-image:var(--sheen-soft);
  -webkit-backdrop-filter:var(--tint-1); backdrop-filter:var(--tint-1);
  border-color:var(--g-edge);
  box-shadow:var(--lift), var(--g-inner);
}
:root[data-theme="light"] .card{border-radius:var(--r-lg)}
:root[data-theme="light"] .tcard{border-radius:var(--r-lg)}

/* ── L2 · chrome ─────────────────────────────────────────────────────────────
   The layer you reach for. Stronger blur, clearer edge, the full sweep.     */
/* .tabseg is deliberately NOT in this list. It has no background of its own and
   it lives INSIDE .topbar, which is already filtering — so its own filter
   re-blurred the bar's already-composited backdrop at 26px and painted a
   visibly different band across one tab of four, with a seam at the top and
   the bottom. A backdrop-filter on a transparent element nested inside another
   filtered element is always this: a second pass over a finished image. */
.topbar,
.tabbar{
  -webkit-backdrop-filter:var(--tint-2); backdrop-filter:var(--tint-2);
}
.tabbar{
  background-color:var(--g-tab);
  background-image:var(--sheen);
  border-color:var(--g-edge);
  border-radius:var(--r-xl);
  box-shadow:var(--lift-2), var(--g-inner);
}
/* the selected tab is a pane set INTO the bar, not a chip painted on it */
.tabbar button[aria-selected="true"]{
  background:var(--raise);
  box-shadow:inset 0 0 0 1px var(--g-edge-2), 0 2px 8px -3px rgba(13,16,23,.22);
}
.topbar{
  box-shadow:0 1px 0 rgba(13,16,23,.05), 0 10px 24px -16px rgba(13,16,23,.30);
}
/* the two strings that ride over whatever is scrolling underneath */
/* the two strings that ride over whatever is scrolling underneath — the ink is
   a token, so each theme brings its own and the rule is written once */
.topbar .sub,#scrSub{color:var(--on-glass)}
.tabbar button{color:var(--on-glass)}
.tabbar button[aria-selected="true"]{color:var(--txt)}

/* ── L3 · floating ───────────────────────────────────────────────────────────
   Nearest to the eye, so the most opaque and the most blurred — a sheet you
   cannot read through is not a failure of transparency, it is depth.        */
.sheet{
  background-color:var(--g3);
  background-image:var(--sheen);
  -webkit-backdrop-filter:var(--tint-2); backdrop-filter:var(--tint-2);
  border-top:1px solid var(--g-edge-2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
}
/* ══════════ LIQUID GLASS, light only — the whole screen ═══════════════════
   Everything below replaces the frosted recipe above for light. The frosted
   one is not a different taste, it is a different material: 18–34px of blur
   turns whatever is behind a pane into a featureless field, so the pane has
   nothing to be translucent against and reads as flat paint. Every rule here
   drops the blur to single digits and spends the difference on the RIM and on
   the adaptive tint that keeps the type alive. Dark keeps the frosted panes it
   already has and already measures clean. */

/* L3 · the sheet — sits on RAW page, so it carries the strong tint */
:root[data-theme="light"] .sheet{
  background-color:var(--lg-sheet-fill);
  -webkit-backdrop-filter:var(--lg-sheet-tint); backdrop-filter:var(--lg-sheet-tint);
}
/* ── L1 · content does not get a pane at all ─────────────────────────────────
   This is the part I kept getting wrong by trying to solve it with numbers.
   There is nothing behind a card on these screens except a smooth gradient,
   and a blurred smooth gradient is the same smooth gradient — so a "glass"
   card could only ever be near-white (which reads as a card), grey (which
   reads as a stain: that was the 217-against-229 bug), or absent. Absent is
   the honest one, and it is what the material actually asks for.

   Glass is for the things that FLOAT — the two bars, the sheet, a toast, a
   callout, a control under your thumb. Content sits ON the surface. A card
   stacked on a page that is itself a pane is the old card idiom wearing a
   glass costume, and it is why every screen still looked like cream boxes
   however clear I made them.

   What groups a list now is what should always have grouped it: a label above
   it, the space around it, and the hairline already drawn between its rows. */
/* The SAME clarity as the chips and the ask box, which is the one thing on
   these screens that already read as glass. Those sit at a 5% fill and 3px of
   blur; this was at 38% and 9px — seven times the fill and three times the
   blur, which is milk, not glass. It washed the ground out precisely where the
   ground had just been given something to say.
   White rather than the chips' ink, because a card carries a lot of small type
   and white lifts its floor while ink lowers it. 16% is where --txt-3 still
   clears over the ground's darkest region.
   The pane now varies 191→255 across its own width, against 199→247 before:
   MORE of the room shows through, not less, at a third of the blur. */
:root[data-theme="light"] .card,
:root[data-theme="light"] .tcard,
:root[data-theme="light"] .ops-row,
:root[data-theme="light"] .roomRoutes button{
  background-color:var(--s-raise);
  background-image:var(--lg-sheen);
  -webkit-backdrop-filter:var(--lg-tint); backdrop-filter:var(--lg-tint);
  border-color:var(--rim-raise);
  box-shadow:var(--lg-rim);
}
/* A card inside a sheet used to carry its own fill, on the argument that the
   sheet behind it is already lifted so the pane needs more of its own to
   separate. Measured, the separation it bought was 4 levels — invisible — and
   the cost was a third value in the RAISE step, which is what the eye actually
   caught: two cards, same job, different white. The step is one number now.
   If a card in a sheet ever needs to sit forward, it sits forward by its RIM,
   which is free and does not fork the ladder. */
/* ── the day cells are DATA, and data stays crisp ────────────────────────────
   .day and .night were in the list above and should never have been. A rim
   built for one large button becomes embossed plastic when it is repeated
   across thirty-five 40px cells — the month grid came out looking like a
   calculator keypad. DESIGN.md already exempts the 45 room tiles from the
   material for exactly this reason, and the same argument applies twice over
   here: thirty-five backdrop-filters is a frame-rate bill with nothing bought,
   and a counted number is the one thing on this screen that must stay sharp.
   So they get the fill and nothing else: no rim, no blur, no sheen.

   They are also the last white blocks on the page now that the cards have gone,
   so they come down to a whisper: enough lift to read as a tappable cell, not
   enough to be a row of tiles on a tray.

   .40 was also the single worst inversion in the file: a calendar cell was
   DENSER than the card containing it (.16), so the contents of a box out-weighed
   the box. CELL sits at .30 — still clearly a target, now clearly inside. */
:root[data-theme="light"] .night,
:root[data-theme="light"] .day{
  background-color:var(--s-cell);
  background-image:none;
  -webkit-backdrop-filter:none; backdrop-filter:none;
  border-color:var(--rim-hair);
  box-shadow:none;
}
/* ── the states the material rule was painting over ─────────────────────────
   Same defect three times, and it is the one this file keeps making: the light
   material rule above is (0,3,0), every selection rule it covers is (0,2,0),
   and specificity does not care that the state rule was written first and means
   more. `.day.rng` and `.day.pad` each got a light twin when they broke; the
   rest never did, so on a light phone:

   - the ENDS of a swept range (.rngA/.rngB) rendered identically to unselected
     days while the middle was filled, so a 21→24 Aug selection read as 22–23:
     off by one at each end of the dates being quoted to a caller. Their big
     free-room count kept its dark-fill ink and measured 1.12:1 — white on white.
   - the selected night in the Rooms strip had no marker at all, while TODAY
     kept an amber ring it hands over on selection — so the only ring on screen
     sat on the night that was NOT selected, while the 45 tiles below counted
     the one that was.
   - the selected day in the Month calendar had no ring either, so stepping to
     September filtered the room list to the 1st with nothing on the grid
     saying which date that was.

   Declared here rather than by guarding the material rule, because a guard
   would leave these cells with no fill at all and they would fall back to the
   opaque base .day/.night — a white block, which is the thing the ladder exists
   to prevent. */
:root[data-theme="light"] .day.rngA,
:root[data-theme="light"] .day.rngB{background:var(--free);border-color:transparent}
:root[data-theme="light"] .day.sel{
  border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink), var(--shadow-sm);
}
:root[data-theme="light"] .night.sel{
  border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);
}
/* A pad cell is not a day. It is the empty run before the first of the month
   and it should not be a pane at all — .day.pad has said background:transparent
   since it was written, and the rule above simply out-specified it. */
:root[data-theme="light"] .day.pad{
  background:none;border-color:transparent;box-shadow:none;
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
/* L2 · chrome — the two bars sit on the raw grid like the sheet does, so they
   take the sheet's tint, not the card's */
:root[data-theme="light"] .topbar,
:root[data-theme="light"] .tabbar{
  -webkit-backdrop-filter:var(--lg-sheet-tint); backdrop-filter:var(--lg-sheet-tint);
}
:root[data-theme="light"] .tabbar{
  background-color:var(--lg-sheet-fill);
  box-shadow:var(--lg-rim);
}
/* L3 · the things that float over everything.
   .invHead is here rather than with the panes because it is a STICKY header:
   the flats scroll under it, so it is over content the way a bar is, not laid
   on the sheet the way a card is. It was solid white, which is the one fill
   that cannot show anything passing beneath it. */
:root[data-theme="light"] .invHead,
:root[data-theme="light"] .toast,
:root[data-theme="light"] .peek,
:root[data-theme="light"] .strip-call{
  background-color:var(--lg-sheet-fill);
  background-image:var(--lg-sheen);
  -webkit-backdrop-filter:var(--lg-sheet-tint); backdrop-filter:var(--lg-sheet-tint);
  box-shadow:var(--lg-rim);
}
/* ── the dark answers join the material, in their own colour ─────────────────
   --free is the right COLOUR and stays: it is the vacancy fill, the same one
   the room tiles carry, so "4 nights free" wearing it is this app saying the
   thing it always says. What was wrong was the treatment. Thirty-two opaque
   near-black blocks down one list, on a ground where everything else now shows
   the room behind it, read as blobs rather than as answers — they were the
   only things on screen that were not a material.
   So they take the same 3px optics in a dark tint, with the rim lit from above
   the way a dark slab catches light. The colour is unchanged; only its
   thickness is.
   The 45 room TILES are deliberately not in this list. They are the data
   field, DESIGN.md keeps that solid and crisp, and 45 backdrop-filters is a
   frame-rate bill with nothing bought.

   A CHOSEN chip belongs here too, and that is the part that had drifted. The
   selected Business tab, the selected booking source, and the two primary
   booking buttons were all painting `var(--free)` flat — the same answer as the
   Yes button beside them, in a different material, because each was written
   before this block existed. State still beats material: at .84 ink over a
   .05 ink trough there is no question which chip is chosen. */
:root[data-theme="light"] .pill.good,
:root[data-theme="light"] .nudgeBtn.yes,
:root[data-theme="light"] .answer .y,
:root[data-theme="light"] .tabseg button[aria-selected="true"],
:root[data-theme="light"] .srcRow button[aria-pressed="true"],
:root[data-theme="light"] .bkgo,
:root[data-theme="light"] .bookbtn,
:root[data-theme="light"] .bigAct{
  background-color:var(--s-ink);
  -webkit-backdrop-filter:var(--tint-1); backdrop-filter:var(--tint-1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),
             inset 0 -1px 0 rgba(0,0,0,.34),
             0 3px 9px -3px rgba(13,16,23,.32);
}

/* ── a container that holds a GRID needs no pane ─────────────────────────────
   Everywhere else a card is filled edge to edge, so its pane reads as material.
   The month calendar is not: it has empty regions inside it by definition — the
   pad days before the 1st and the gap after the 31st — and a pane behind those
   is a lit rectangle with nothing in it. That is what reads as a tray.
   The cells ARE the content and they sit on the ground like every other row on
   these screens. Specificity beats the glass rule above deliberately, and the
   filter is turned off too, which an inline background never could. */
.card.bare,
:root[data-theme="light"] .card.bare{
  background:none;
  border:0;
  box-shadow:none;
  /* AND NO CORNERS, AND NO CLIP. .card carries border-radius:var(--r-lg) with
     overflow:hidden, which is right for a card you can see — the fill stops at
     the curve. A BARE card has no fill, no border and no shadow, so there is
     nothing for the curve to describe — but the clip survived, and an invisible
     box went on shaving its content to an 18px arc.

     Measured: CHECK-IN sits 1px in and 1px down from the card's top-left, where
     the corner has eaten 12.08px. Eleven pixels of the C, cut by a rounded
     corner nobody can see. A 1px inset was tried first and did nothing, which
     is what sent me looking for the real edge. */
  border-radius:0;
  overflow:visible;
  -webkit-backdrop-filter:none; backdrop-filter:none;
}

/* ── the top bar and the move stage, still on the old solid style ────────────
   The bar was painting --bar, which is a flat 52% white with no adaptive tint,
   so against the structured ground it read as a grey slab rather than glass.
   It gets the sheet's material: it sits on raw page like the sheet does.

   The move stage keeps its MEANING and takes the material, the same trade the
   dark answer chips made. The colours are not decoration here — the room being
   emptied goes from booked to LIT, which is this app's one rule, and a
   destination that takes a guest goes BOOKED. So the fills stay --held and
   --free and only their thickness changes. */
:root[data-theme="light"] .topbar{
  background:var(--lg-sheet-fill);
}
:root[data-theme="light"] .mroom{
  background:color-mix(in srgb, var(--held) 78%, transparent);
  -webkit-backdrop-filter:var(--lg-tint); backdrop-filter:var(--lg-tint);
  border-color:var(--rim-raise);
}
:root[data-theme="light"] .mroom.lit{
  background:color-mix(in srgb, var(--free) 86%, transparent);
  border-color:transparent;
}
:root[data-theme="light"] .mdest{
  background:var(--s-sunk);
  -webkit-backdrop-filter:var(--lg-tint); backdrop-filter:var(--lg-tint);
  border-color:var(--rim-sunk);
  box-shadow:var(--lg-rim-sunk);
}
:root[data-theme="light"] .mdest.filled{
  background:color-mix(in srgb, var(--held) 78%, transparent);
  border-color:var(--rim-raise);
  box-shadow:var(--lg-rim);
}
/* the guest's name tag — the one chip in the stage still painting --pane, a 94%
   white slab. It is the thing that travels, so it should read as a pane you
   could pick up, not a sticker. .berth stays excluded: an empty place kept for
   somebody has to stay EMPTY, which is a rule this file has broken once before.

   It takes FLOAT, not RAISE: it is the one thing on the stage that travels over
   the others, and the step it takes should say so. */
:root[data-theme="light"] .mguest:not(.berth)>.mguest-fx{
  background:var(--s-float);
  -webkit-backdrop-filter:var(--lg-tint); backdrop-filter:var(--lg-tint);
  border-color:var(--rim-raise);
  box-shadow:var(--lg-rim);
}

/* recessed — the same pane, cut in rather than laid on */
:root[data-theme="light"] .seg,
:root[data-theme="light"] .field,
:root[data-theme="light"] .ghost:not(.on),
:root[data-theme="light"] .chips button:not([aria-pressed="true"]),
:root[data-theme="light"] .tyRow button:not([aria-pressed="true"]),
:root[data-theme="light"] .step,
:root[data-theme="light"] .stepWide,
:root[data-theme="light"] .srcRow button:not([aria-pressed="true"]),
:root[data-theme="light"] .fixer:not(.on),
:root[data-theme="light"] .ffind,
:root[data-theme="light"] .ftile:not([aria-pressed="true"]),
:root[data-theme="light"] .mate:not([aria-pressed="true"]),
:root[data-theme="light"] .dcell:not(.urgent),
/* ARMED AND DONE ARE STATES, AND STATE BEATS MATERIAL — the rule this list's
   own comment states, which these two selectors were breaking. Unguarded at
   (0,3,0) they out-specified .rowx.arm and .copybtn.done at (0,2,0), so in
   light theme the --hot red never landed: measured, the armed "Cancel?" button
   kept the resting trough fill rgba(13,16,23,.05) and .rowx.arm{color:--ink-on}
   then painted its label near-white on it at 1.13:1. Tapping ✕ on a booking
   produced NO perceptible change at all, and the next tap cancelled the stay.
   Dark theme was correct throughout, which is why it survived four passes. */
:root[data-theme="light"] .rowx:not(.arm),
:root[data-theme="light"] .copybtn:not(.done),
:root[data-theme="light"] .actWhy,
:root[data-theme="light"] .line,
:root[data-theme="light"] .nudgeBtn:not(.yes),
:root[data-theme="light"] .pill:not(.good):not(.now):not(.warn):not(.live):not(.due),
:root[data-theme="light"] .field button.slot,
:root[data-theme="light"] .field:not(.hear) button.mic,
:root[data-theme="light"] .wallmove,
/* The last opaque neutrals on the light screens, found by sweeping for any fill
   at alpha 1 rather than by reading selectors — which is the only way they were
   ever going to turn up, because none of them shares a class with anything in
   the list above. The Business sub-tabs, the close button on every sheet, the
   two booking inputs and the inventory summary strip: kinds of control that are
   cut into a surface, painting flat
   --surface-2 on a screen where nothing else does. */
:root[data-theme="light"] .tabseg button:not([aria-selected="true"]),
:root[data-theme="light"] .sheet-h button,
:root[data-theme="light"] .bkform input,
:root[data-theme="light"] .bkform select,
:root[data-theme="light"] .daychips button:not([aria-pressed="true"]),
:root[data-theme="light"] .paid.plat,
:root[data-theme="light"] .blocked{
  background-color:var(--s-sunk);
  -webkit-backdrop-filter:var(--lg-tint); backdrop-filter:var(--lg-tint);
  border-color:var(--rim-sunk);
  box-shadow:var(--lg-rim-sunk);
}
.toast,
.peek{
  background-color:var(--g3);
  background-image:var(--sheen);
  -webkit-backdrop-filter:var(--tint-2); backdrop-filter:var(--tint-2);
  border-color:var(--g-edge);
  box-shadow:var(--lift-2), var(--g-inner);
}

/* ── recessed ────────────────────────────────────────────────────────────────
   A trough cannot be a paler white: white on white has nowhere to go. It is a
   translucent INK tint over the same pane, so it still reads as cut in.     */
/* Every selector here is guarded against its own selected state. Glass is the
   DEFAULT material; a chosen chip has a material of its own and must keep it.
   Without the guards these rules sit later in the sheet at equal specificity
   and win — which is how a selected chip ended up as near-white text on a
   near-white trough, i.e. invisible, and how the placeholder guests ended up
   looking like they had already moved. State beats material, always. */
.seg,
.field,
.ghost:not(.on),
.chips button:not([aria-pressed="true"]),
.tyRow button:not([aria-pressed="true"]),
.step,
.stepWide,
.srcRow button:not([aria-pressed="true"]),
.fixer:not(.on),
.ffind,
.ftile:not([aria-pressed="true"]),
.mate:not([aria-pressed="true"]),
.dcell:not(.urgent),
/* Everything else that was still a flat --surface-2 chip. These were the last
   opaque neutrals on screen: the small round buttons on a booking row, the
   copy button, the "still out" answer, the pills, the two accessories in the
   Ask field, and the explanation panel under a room's main action. They are
   the same kind of thing as the chips above them and there was no reason for
   them to be a different material — they were simply written before there was
   one. The guards keep every SELECTED and every SEMANTIC state out: a chosen
   chip, the dark primary answers, the amber and red washes all keep their own
   surface, because state and meaning both beat material. */
.rowx,
.copybtn,
.actWhy,
.line,
.nudgeBtn:not(.yes),
.pill:not(.good):not(.now):not(.warn):not(.live):not(.due),
/* The building filter is the same kind of thing as the stay dial above it —
   an unchosen option waiting to be picked — and it was written as a flat
   --surface-2 box because it was written after this list rather than into it.
   Guarded like every other entry: the chosen chip keeps its own fill, because
   state beats material. */
.roomfilt button:not([aria-selected="true"]),
.field button.slot,
.field:not(.hear) button.mic,
.wallmove{
  background-color:var(--g-sunk);
  -webkit-backdrop-filter:var(--tint-1); backdrop-filter:var(--tint-1);
  border-color:var(--sunk-edge);
  /* the cut edge: a shadow along the TOP inside, which is what tells the eye a
     thing is set into a surface rather than laid on it. Without it a trough is
     only a slightly darker rectangle, which at 6% is no rectangle at all. */
  box-shadow:var(--g-sunk-inner);
}
/* and the thing that lifts back OUT of a trough is the brightest pane there is
   — brightest RELATIVE to its theme, which in dark is a lighter dark. */
.seg-ind,
.mguest:not(.berth)>.mguest-fx{
  background:var(--pane);
  background-image:var(--sheen-soft);
  box-shadow:var(--lift), var(--pane-inner);
  border-color:var(--g-edge-2);
}
/* An empty place kept for someone is EMPTY. The first glass pass matched
   `.mguest-fx` at equal specificity and later in the sheet, repainting every
   placeholder as a solid chip — so the sheet showed all the guests already
   standing in their new rooms before anyone had agreed to move. A dashed 1px
   border is not a difference. An absent surface is. */
.mguest.berth>.mguest-fx{
  background:transparent;background-image:none;box-shadow:none;
  border-color:color-mix(in srgb, var(--txt-3) 55%, transparent);
}

/* ── a surface that means something keeps its meaning ────────────────────────
   These carry an alert or an accent wash. They take the glass BEHAVIOUR and
   keep their own colour, mixed into the pane rather than replaced by it —
   plain glass over `.decide` turned "needs a decision" into a card.
   The wash mixes into var(--g3), the floating pane of whichever theme is on,
   so the alert stays an alert on either ground.                            */
.decide{
  background-color:color-mix(in srgb, var(--hot) 13%, var(--g3));
  border-color:color-mix(in srgb, var(--hot) 55%, transparent);
}
.advert,
.dcell.urgent{
  background-color:color-mix(in srgb, var(--now) 17%, var(--g3));
  border-color:color-mix(in srgb, var(--now-ink) 45%, transparent);
}
.decide,
.advert,
.dcell.urgent{
  background-image:var(--sheen-soft);
  -webkit-backdrop-filter:var(--tint-1); backdrop-filter:var(--tint-1);
  box-shadow:var(--lift), var(--g-inner);
}

/* ── the material answers the thumb ──────────────────────────────────────────
   No hover on a phone. What a finger gets is the pane brightening under it —
   the press geometry is already the app's own 85ms-down, spring-back rule and
   is deliberately not touched here. */

.tcard:active,
.night:active,
.day:active,
.ghost:active,

/* ── the data field stays out of it ──────────────────────────────────────────
   45 tiles, scrolled with a thumb, read at arm's length. DESIGN.md keeps data
   crisp and chrome soft, and 45 backdrop-filters is a frame-rate bill with
   nothing bought. Free tiles keep their own light instead. */
:root[data-theme="light"] .tile.free{
  box-shadow:0 1px 2px rgba(13,16,23,.20), 0 4px 10px -4px rgba(13,16,23,.26),
             inset 0 1px 0 rgba(242,245,251,.10);

:root[data-theme="light"] .tile.turn::after{background:var(--held-ink)}
:root[data-theme="light"] .tile.turn s{color:var(--held-ink);opacity:1}

/* ── vacancy, stated in its own material ─────────────────────────────────────
   --free is a FILL in this system and never a text colour: it sits 1.2:1 from
   --txt, so `color:var(--free)` cannot read as emphasis. */
/* These set the COLOUR of a vacancy statement and nothing else. They used to
   set `background:var(--free)` outright, which is the same rule as the material
   block above at the same specificity but later in the file — so it won, and
   "4 nights free" shipped as an opaque slab while the Yes button one row down

:root[data-theme="light"] .pill.good{color:var(--free-ink);border-color:transparent}
:root[data-theme="light"] .allclear .tick{background:var(--s-ink);color:var(--free-ink)}

  border-color:color-mix(in srgb,var(--free) 60%,transparent)}

/* ── today ───────────────────────────────────────────────────────────────────
   A tint and an amber date. The ring belongs to selection alone, so the two
   can both be true without drawing two rings. */
:root[data-theme="light"] .night.today{background-color:color-mix(in srgb,var(--now) 16%,var(--surface))}
:root[data-theme="light"] .night.today:not(.sel){border-color:var(--now-ink)}

/* ── the accent, split by role ───────────────────────────────────────────────
   --now is the fill; --now-ink is every accented word, hairline and thin bar. */
:root[data-theme="light"] .pill.now,:root[data-theme="light"] .op.alert b,
:root[data-theme="light"] .op.alert s,:root[data-theme="light"] .mcap em,
:root[data-theme="light"] .tcard .said .hi,:root[data-theme="light"] .dcell .d,
:root[data-theme="light"] .dcell.urgent .n,:root[data-theme="light"] .advert-head,
:root[data-theme="light"] .exts-head u,:root[data-theme="light"] .vbar.acc .v,

:root[data-theme="light"] .book input:focus,:root[data-theme="light"] .invForm input:focus{
  border-color:var(--now-ink)}
:root[data-theme="light"] .pill.now,:root[data-theme="light"] .dcell .d,
:root[data-theme="light"] .vsay-go,:root[data-theme="light"] .paid.due,
:root[data-theme="light"] .invAdd,:root[data-theme="light"] .faultFlag.hot{
  background:color-mix(in srgb,var(--now) 16%,var(--surface))}
/* a thin bar must be dark to read as a quantity on a pale track; a LARGE fill
   must not, or the accent's text colour puts the brown back on screen */
:root[data-theme="light"] .mbar i.soon,:root[data-theme="light"] .day.soft:not(.none) .gg i,

/* ── alerts mix into the pane, never into transparent ────────────────────────*/
:root[data-theme="light"] .pill.warn{background:color-mix(in srgb,var(--hot) 12%,var(--surface))}
:root[data-theme="light"] .gate .err{background:color-mix(in srgb,var(--hot) 12%,var(--surface));
  border-color:var(--hot)}
:root[data-theme="light"] .toast.bad{border-color:var(--hot)}

/* ── the turnover seam ───────────────────────────────────────────────────────
   `var(--bg)` as a FOREGROUND only works while --bg is the darkest value in the
   system, which is true in dark and false here. */
:root[data-theme="light"] .strip i.edge{box-shadow:inset 1px 0 0 var(--txt-3)}
:root[data-theme="light"] .strip i.f.edge,:root[data-theme="light"] .strip i.b.edge{
  box-shadow:inset 1px 0 0 var(--surface)}

  box-shadow:inset 0 0 0 1px var(--now-ink), inset 0 -4px 0 var(--now)}

/* ── the last text pairs that needed a ground, not a colour ──────────────────*/
:root[data-theme="light"] .mroom>.mhead>s{color:var(--held-ink)}
:root[data-theme="light"] .faultFlag{background:var(--surface-2)}
:root[data-theme="light"] .roomRoutes button:active s{color:var(--txt-2)}
:root[data-theme="light"] .bkform input:focus::placeholder,
:root[data-theme="light"] .gate input:focus::placeholder{color:var(--txt-2)}
/* #fff on --hot measures 3.00:1 in DARK — a live AA failure in the theme that
   ships. --ink-on is correct in both. */
.rowx.arm,.invDel.arm{color:var(--ink-on)}

/* ── when the system says no to transparency, mean it ───────────────────────*/
/* !important, and not reluctantly. A media query contributes NO specificity, so
   this block's (0,1,0) and (0,2,0) selectors lost outright to the light theme's
   (0,3,0) material rules — and the whole block did nothing in light. Verified by
   appending its declarations, minus the condition, as the last stylesheet in the
   document: nothing changed, .tabbar stayed at 54% white with its blur intact.
   Dark honoured it only because dark's material rules happen to be (0,1,0) too.

   Someone who asks their OS to remove transparency is usually asking because
   translucent panes are what they cannot read. An accessibility opt-out is not
   one voice in the cascade to be outvoted by whatever gets written next — it
   has to win, including against rules added after it. That is what !important
   is for, and this is the case it was designed for. */
/* REDUCED TRANSPARENCY REMOVES TRANSLUCENCY, NOT MEANING.
   The !important that made this block actually apply also made it flatten
   every STATE fill underneath it, and states are opaque already — there is no
   transparency there to remove. Measured with the block forced on:
     .rowx.arm      --hot red → --surface-2, label --ink-on on top:  1.22:1 light
     .day.rngA/.rngB  --free → --surface, .fn still --free-ink:      1.09:1 light
   That is the armed "Cancel?" going invisible and the ends of a swept range
   rendering their free-room count on their own colour — the two bugs fixed
   earlier this session, recreated for the one user who explicitly asked the OS
   for a more legible screen.

   So the sweeping declarations are split. backdrop-filter and background-image
   are what transparency actually is, and they go off everywhere, unguarded.
   background-color and border-color are opinions about a surface, so they are
   applied only where no state is asserting one — the same :not() guards the
   light material list carries, for the same reason. State beats material, and
   an accessibility mode is still material. */
@media (prefers-reduced-transparency:reduce){
  /* what transparency IS — off everywhere, no exceptions */
  .card,.tcard,.night,.day,.toast,.peek,.sheet,.tabbar,.topbar,.strip-call,.ops-row,.hud.on,
  .seg,.field,.ghost,.chips button,.dcell,.copybtn,.rowx,.line,.step,.stepWide{
    background-image:none!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  /* opaque grounds — only where nothing is asserting a state */
  .card,.tcard,.toast,.peek,.sheet,.tabbar,.topbar,.strip-call,.ops-row,.hud.on,
  .night:not(.sel):not(.today),
  .day:not(.sel):not(.rng):not(.rngA):not(.rngB):not(.today):not(.pad){
    background-color:var(--surface)!important;border-color:var(--line)!important}
  .seg,.field,.ghost:not(.on),.chips button:not([aria-pressed="true"]),
  .dcell:not(.urgent),.copybtn:not(.done),.rowx:not(.arm),.line,.step,.stepWide{
    background-color:var(--surface-2)!important}
  body{background:var(--bg)!important}
}

<script>
"use strict";
/* ═══════════════ demonstration data — invented, not real ═══════════════ */
const DAYS = 63;
const DOW  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWF = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const today = new Date(); today.setHours(0,0,0,0);
const dateAt = i => { const d = new Date(today); d.setDate(d.getDate()+i); return d; };
const fmt  = i => { const d=dateAt(i); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtL = i => { const d=dateAt(i); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };

/* ══ CRESCENT STAYS — THE REAL BOOK ═════════════════════════════════════════
   Read out of the operator's own workbook rather than invented: the flat list
   is the header of the Availability tab, and the types come from "Copy of
   Availability", whose row 3 names them for Banjara Hills and Lotus Pond, plus
   the per-bucket rows in the monthly sheets (Jul26 A40:A50) for the rest.

   MOST of the rates are read, not chosen: each monthly bucket carries booked
   nights and a price total, and the quotient comes out at ₹3,000 / ₹3,200 /
   ₹4,000 / ₹5,000 / ₹5,200 / ₹6,000. Numbers that round like that are a rate
   card, not an artefact of arithmetic. Ttops 1bhk 174/58, Treetops 462.8/89,
   Mpur 1bhk 86.4/27, Madhapur 690/115, Tnagar Studio 82/41, Tnagar 3bhk
   130/26, Tnagar 2bhk 488/122, Bhills 3bhk 1038/173, Bhills 1bhk 81/27.

   TWO ARE NOT, and saying so is the point. The monthly sheets have no Lotus
   Pond bucket at all, so LP's ₹6,000 (3 BHK) and ₹2,500 (Studio) are the one
   pair of numbers here that nobody at Crescent Stays wrote down. They are
   inferred, and the inference is checkable: across the stays where the
   Availability tab does record an amount, LP 3 BHK runs at a median ₹5,355 over
   31 stays and LP Studio at ₹2,362 over 16 — realised prices, which sit below
   the card everywhere the card IS known (Tnagar Studio realises ₹1,500 against
   a ₹2,000 card), so a card a little above each median is the right shape. 4A
   is a penthouse with no bucket of its own and one recorded stay at ₹4,200; it
   carries the Tnagar 2 BHK card.

   The rate only pre-fills the total on the booking form, so a wrong one is
   corrected by the operator on first use rather than silently believed — but it
   is a guess and it is labelled as one, because the rest of this file refuses
   to invent money and this is the single place it comes close.

   WHAT IS IN. 38 flats over five buildings, every one of which has entries in
   the last sixty days of the Availability tab.

   WHAT IS OUT, deliberately. Vasavi (308, 408, 607) and Mumbai 2004 are still
   columns in the sheet but have no entry in the last sixty days and earned ₹0
   in Jul26. They are history, not inventory; adding a building back is two taps
   in the inventory editor if that is wrong.

   IDS. The operator says "MG", "M1", "TG1", "1A", "B401" and those are unique
   across the book, so they are the ids. Only the two numbered blocks collide —
   TreeTops and Lotus Pond both have a 101 — and those carry their building
   code. PRODUCT.md names reading the wrong row as THE failure mode here, so a
   number that means two different flats never appears on its own.           */
const BUILDINGS = [
  {code:"TT", name:"TreeTops",      short:"TreeTops"},
  {code:"MP", name:"Madhapur",      short:"Madhapur"},
  {code:"TN", name:"Telecom Nagar", short:"Telecom N"},
  {code:"BH", name:"Banjara Hills", short:"Banjara H"},
  {code:"LP", name:"Lotus Pond",    short:"Lotus Pond"},
];

/* [id, building code, floor, type, ₹/night]. Floor 0 is the ground floor. */
/* Ground floor is said, not numbered. The invented inventory started at 1 and
   never met a G01 or an MG; the real one has six ground-floor units. */
const floorName = f => f === 0 ? "ground floor" : `floor ${f}`;
const INVENTORY = [
  /* ── TreeTops ── the two ground-floor units are the "Ttops 1bhk" bucket:
     58 nights booked at 94% over July is two flats, and G01/G02 are the only
     two that are not numbered by floor. Everything above them is a 3 BHK. */
  ["G01",    "TT", 0, "1 BHK",     3000],
  ["G02",    "TT", 0, "1 BHK",     3000],
  ["TT-101", "TT", 1, "3 BHK",     5200],
  ["TT-102", "TT", 1, "3 BHK",     5200],
  ["TT-201", "TT", 2, "3 BHK",     5200],
  ["TT-202", "TT", 2, "3 BHK",     5200],
  ["TT-301", "TT", 3, "3 BHK",     5200],
  ["TT-302", "TT", 3, "3 BHK",     5200],
  ["TT-401", "TT", 4, "3 BHK",     5200],
