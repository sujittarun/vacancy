/* ── persistence ─────────────────────────────────────────────────────────────
   Stored against flat IDs, not array indexes, so the file can gain or lose flats
   without corrupting saved bookings. Dates are stored as offsets from the day
   they were saved and shifted on load, so "3 days out" stays 3 days out.       */
const STORE = "vacancy.bookings.v1";
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function save(){
  if(MODE === "live") return;        // signed in, cacheSave() holds the book instead
  try{
    localStorage.setItem(STORE, JSON.stringify({
      savedOn: isoDay(today),
      issues: issues.map(x=>({...x, id2:flats[x.fi] && flats[x.fi].id})),
      rows: resv.map(r=>({ id:flats[r.fi].id, start:r.start, end:r.end,
                           guest:r.guest, src:r.src, manual:!!r.manual,
                           kind:r.kind, reason:r.reason, note:r.note,
                           fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                           phone:r.phone, pax:r.pax, amount:r.amount, pays:r.pays,
                           bookedOn: typeof r.bookedOn === "number" ? r.bookedOn : undefined }))
    }));
  }catch(e){ /* private browsing or storage full — the session still works */ }
}

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.rows)) return false;
    const savedOn = new Date(d.savedOn + "T00:00:00");
    savedOn.setHours(0,0,0,0);
    const shift = Math.round((savedOn - today) / 86400000);
    resv = d.rows
      .filter(r => flatIndex[r.id] !== undefined)
      .map(r => ({ fi:flatIndex[r.id], start:r.start+shift, end:r.end+shift,
                   nights:r.end-r.start, guest:r.guest, src:r.src, manual:r.manual,
                   kind:r.kind, reason:r.reason, note:r.note,
                   fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                   phone:r.phone, pax:r.pax, amount:r.amount,
                   pays: (r.pays || []).map(p => ({...p, on: (p.on || 0) + shift})),
                   bookedOn: typeof r.bookedOn === "number" ? r.bookedOn + shift : undefined }))
      // Blocks linger a week past their end so the app can still ask whether the
      // flat came back into service — and a block that recorded a FAULT is kept
      // far longer, because it is the only evidence that this is the third time
      // the same AC has failed. Throwing it away after a week would delete the
      // feature that reads it.
      .filter(r => r.start < DAYS && (r.kind === "block"
        ? (r.end >= -7 || (r.fault && r.end >= -REPEAT_WINDOW)) : r.end >= 0));
  issues = (d.issues || []).filter(x => flatIndex[x.id2] !== undefined)
    .map(x => ({...x, fi: flatIndex[x.id2], on: (x.on || 0) + shift,
                fixed: x.fixed == null ? null : x.fixed + shift}));
    return true;
  }catch(e){ return false; }
}

/* ══════════════════ the cloud ═══════════════════════════════════════════════
   Two modes, and the pill in the top bar always says which one you are in.

   sample — no account. Invented bookings kept in this browser. This is what
            the public link opens, so it can be handed to anyone.
   live   — signed in. The database is the book: the same rooms on every phone,
            and Postgres, not this file, is what refuses a double booking.

   Three rules shape everything below.

   1. **Reads are cache-first.** This gets used mid-call in a lift with one bar
      of signal. Yesterday's book beats a spinner, and a spinner beats nothing.
   2. **Writes apply here first and travel afterwards.** Nobody holding a phone
      to their ear waits for a round trip.
   3. **Because of 2, the server can still say no** — another phone got there
      first. Then the local entry is rolled back and you are told who took the
      room, by name and dates. A write that quietly vanished would be far worse
      than one that never happened.                                            */
/* ══════════════════ the server is switched off ══════════════════════════════
   Set this to true to put the app back on Supabase: sign-in returns, the book
   is shared across phones, and it survives a lost device. Everything needed is
   still here and still wired — the schema, the sync queue, the conflict
   handling, the telemetry — it is only gated on this one line.

   It is FALSE while the app is being built, because there is no third option.
   The bookings would live on a server behind a public web address, and the only
   thing standing between a stranger with the link and a guest's name and phone
   number is the sign-in. Removing the sign-in and keeping the server would not
   mean "no login", it would mean "the data is public" — fine today, when every
   booking is invented, and a quiet leak the week real ones are typed in, with
   nothing to mark the moment it turned.

   So while this is false the book lives on the phone alone: no account, no
   server, nothing to expose. Sync is a switch to flip, not a rewrite.        */
const CLOUD_ENABLED = false;

const SUPA_URL = "https://hwbquljbvanlgggemchg.supabase.co";
/* Publishable by design, and safe in a file anyone can read: it grants nothing
   on its own. Every row is gated by row-level security, so an anonymous caller
   holding this key reads zero rows. */
const SUPA_KEY = "sb_publishable_i4ZgWEz4uvP4FF0Fk5joUQ_jIohbSs5";
const APP_VER  = "2026.08.10";

const SESSION_KEY = "vacancy.session.v1";
/* Set once someone has deliberately chosen to browse the invented book. Without
   it the app used to *start* in demo and leave signing in as something you had
   to notice — which meant an operator could work in fake data without ever
   realising there was a real one. Sign-in is the front door now; this is the
   record that you knowingly walked past it. */
const BROWSE_KEY  = "vacancy.browsing.v1";
const QUEUE_KEY   = "vacancy.queue.v1";
const CLOUD_KEY   = "vacancy.cloud.v1";

const jget = k => { try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } };
const jset = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const jdel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c=>{
      const r = Math.random()*16|0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));

let session  = jget(SESSION_KEY);      // {access_token, refresh_token, expires_at, email, uid}
let MODE     = (CLOUD_ENABLED && session && session.refresh_token) ? "live" : "sample";
let hostId   = null, hostName = "";
let queue    = jget(QUEUE_KEY) || [];  // writes that have not landed yet
let inflight = null;                   // the one op currently on the wire
let syncing  = false, needPull = false;
let online   = navigator.onLine !== false;

/* The local model counts days from today; the database stores real dates.
   These two lines are the whole of the translation. */
const dayISO = off => isoDay(dateAt(off));
const dayOff = iso => { const d = new Date(iso + "T00:00:00"); d.setHours(0,0,0,0);
                        return Math.round((d - today) / 86400000); };

/* ── talking to it ─────────────────────────────────────────────────────────── */
async function api(path, opt){
  opt = opt || {};
  const h = {apikey: SUPA_KEY, "Content-Type":"application/json", ...(opt.headers || {})};
  if(opt.auth !== false && session && session.access_token)
    h.Authorization = "Bearer " + session.access_token;
  const res = await fetch(SUPA_URL + path, {
    method: opt.method || "GET", headers: h,
    body: opt.body === undefined ? undefined : JSON.stringify(opt.body)
  });
  const text = await res.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok){
    const e = new Error((data && (data.message || data.error_description || data.msg))
                        || ("HTTP " + res.status));
    e.status = res.status; e.code = data && data.code; e.body = data;
    throw e;
  }
  return data;
}
function keepSession(d){
  session = { access_token: d.access_token, refresh_token: d.refresh_token,
              expires_at: Date.now() + (d.expires_in || 3600) * 1000,
              email: (d.user && d.user.email) || (session && session.email) || "",
              uid:   (d.user && d.user.id)    || (session && session.uid)   || null };
  jset(SESSION_KEY, session);
}
/* Access tokens last an hour. Renew a minute early so a booking never fails for
   the sake of a clock. */
async function freshToken(){
  if(!session || !session.refresh_token){ const e = new Error("signed out"); e.status = 401; throw e; }
  if(session.expires_at && Date.now() < session.expires_at - 60000) return;
  try{
    keepSession(await api("/auth/v1/token?grant_type=refresh_token",
      {method:"POST", auth:false, body:{refresh_token: session.refresh_token}}));
  }catch(e){
    if(e.status >= 400 && e.status < 500){ signOut(true); }   // the refresh token is dead
    throw e;
  }
}
async function rest(method, path, body, headers){
  await freshToken();
  return api("/rest/v1" + path, {method, body, headers});
}

/* ── signing in and out ────────────────────────────────────────────────────── */
async function signIn(email, password){
  keepSession(await api("/auth/v1/token?grant_type=password",
    {method:"POST", auth:false, body:{email: email.trim(), password}}));
  MODE = "live";
  jdel(BROWSE_KEY);
  await loadHost();
  await cloudPull();
  jdel(STORE);                       // the sample book is not this operator's book
  startTelemetry();
  paintAcct();
}
async function loadHost(){
  const rows = await rest("GET", "/memberships?select=host_id,role,hosts(name,slug)");
  if(!rows || !rows.length){
    const e = new Error("This login is not attached to a property yet.");
    e.status = 403; throw e;
  }
  hostId = rows[0].host_id;
  hostName = (rows[0].hosts && rows[0].hosts.name) || "";
}
function signOut(silent){
  const tok = session && session.access_token;
  session = null; hostId = null; hostName = ""; MODE = "sample";
  queue = []; jdel(QUEUE_KEY); jdel(SESSION_KEY); jdel(CLOUD_KEY);
  if(tok) fetch(SUPA_URL + "/auth/v1/logout", {method:"POST",
    headers:{apikey:SUPA_KEY, Authorization:"Bearer " + tok}}).catch(()=>{});
  if(!silent){
    flats = loadInventory() || defaultInventory();
    flats.forEach(f=>{ f.pop = f.pop ?? 0.6; });
    NF = flats.length;
    flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));
    usingDemo = !load();
    if(usingDemo){ generateDemo(); recompute(); seedDemoBlocks(); seedDemoIssues(); }
    else issues = [];
    recompute(); paintAcct(); refreshScreen();
  }
}

/* ── reading the book ──────────────────────────────────────────────────────── */
async function cloudPull(){
  if(!hostId) await loadHost();
  const from = dayISO(-8), to = dayISO(DAYS);
  const [bs, fl, st, pm, iss] = await Promise.all([
    rest("GET", "/buildings?select=id,code,name,short_name,sort_order&order=sort_order.asc,code.asc"),
    rest("GET", "/flats?select=id,building_id,code,floor,unit_type,nightly_rate&active=is.true&order=code.asc"),
    rest("GET", "/stays?select=*&ends_on=gt." + from + "&starts_on=lt." + to),
    rest("GET", "/payments?select=id,stay_id,amount,method,received_on,note&order=received_on.asc"),
    rest("GET", "/issues?select=*&order=reported_on.asc"),
  ]);
  const paysBy = {};
  (pm || []).forEach(p => (paysBy[p.stay_id] = paysBy[p.stay_id] || []).push(
    {id:p.id, amount:Number(p.amount), method:p.method, on:dayOff(p.received_on), note:p.note}));
  const byB = Object.fromEntries((bs || []).map(b=>[b.id, b]));
  flats = (fl || []).map(f=>{
    const b = byB[f.building_id] || {code:"??", name:"Unfiled", short_name:"Unfiled", sort_order:999};
    return { uid:f.id, bid:f.building_id, id:f.code, code:b.code, bname:b.name,
             bshort: b.short_name || b.name, floor: f.floor, type: f.unit_type,
             rate: Number(f.nightly_rate) || 0, ord: b.sort_order | 0, pop: 0.6 };
  })
  // buildings in the order the operator thinks of them, not alphabetically —
  // the room grid is scanned by position, so this order is muscle memory
  .sort((a,b)=> a.ord - b.ord || a.id.localeCompare(b.id));
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id, i]));
  const byUid = Object.fromEntries(flats.map((f,i)=>[f.uid, i]));
  resv = (st || []).map(s=>{
    const fi = byUid[s.flat_id];
    if(fi === undefined) return null;              // a flat we cannot see or is retired
    const start = dayOff(s.starts_on), end = dayOff(s.ends_on);
    const block = s.kind === "block";
    return { sid:s.id, fi, start, end, nights: end - start, manual:true,
             guest: s.guest_name || (block ? (s.reason || "Out of service") : "Guest"),
             src: s.source || (block ? "Block" : "Direct"),
             kind: block ? "block" : undefined, reason: s.reason, note: s.note,
             fault: s.fault || undefined, fixer: s.fixer || undefined,
             fixer_phone: s.fixer_phone || undefined,
             cost: s.cost != null ? Number(s.cost) : undefined,
             phone: s.guest_phone || undefined, pax: s.pax || undefined,
             amount: s.amount != null ? Number(s.amount) : undefined,
             pays: paysBy[s.id] || [],
             bookedOn: s.booked_on ? dayOff(s.booked_on) : undefined };
  }).filter(Boolean)
    // same retention rule as the local store: a week for ordinary blocks, the
    // whole repeat window for anything that recorded a fault
    .filter(r => r.start < DAYS && (r.kind === "block"
      ? (r.end >= -7 || (r.fault && r.end >= -REPEAT_WINDOW)) : r.end >= 0));
  issues = (iss || []).map(x=>{
    const fi = byUid[x.flat_id];
    if(fi === undefined) return null;
    return {id:x.id, fi, fault:x.fault || undefined, note:x.note || "",
            urgency:x.urgency || "soon", on:dayOff(x.reported_on),
            fixed: x.fixed_on ? dayOff(x.fixed_on) : null,
            fixer:x.fixer || undefined, fixer_phone:x.fixer_phone || undefined,
            cost: x.cost != null ? Number(x.cost) : undefined};
  }).filter(Boolean);
  usingDemo = false;
  recompute(); cacheSave();
}

/* The cache exists for the lift with no signal. Same date-rebasing trick as the
   local store, so a book cached yesterday still reads correctly today. */
function cacheSave(){
  if(MODE !== "live") return;
  jset(CLOUD_KEY, { on: isoDay(today), host: hostId, hostName,
    flats: flats.map(f=>({uid:f.uid, bid:f.bid, id:f.id, code:f.code, bname:f.bname,
                          bshort:f.bshort, floor:f.floor, type:f.type, rate:f.rate, ord:f.ord})),
    issues: issues.map(x=>({...x, id2:flats[x.fi] && flats[x.fi].id})),
    rows: resv.map(r=>({ sid:r.sid, id: flats[r.fi] && flats[r.fi].id,
                         start:r.start, end:r.end, guest:r.guest, src:r.src,
                         kind:r.kind, reason:r.reason, note:r.note,
                         fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                         phone:r.phone, pax:r.pax, amount:r.amount, pays:r.pays,
                         bookedOn: typeof r.bookedOn === "number" ? r.bookedOn : undefined }))});
}
function cacheLoad(){
  const d = jget(CLOUD_KEY);
  if(!d || !Array.isArray(d.flats) || !d.flats.length) return false;
  const was = new Date(d.on + "T00:00:00"); was.setHours(0,0,0,0);
  const shift = Math.round((was - today) / 86400000);
  hostId = d.host || null; hostName = d.hostName || "";
  flats = d.flats.map(f=>({...f, pop:0.6}));
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id, i]));
  resv = (d.rows || [])
    .filter(r => flatIndex[r.id] !== undefined)
    .map(r => ({ sid:r.sid, fi:flatIndex[r.id], start:r.start + shift, end:r.end + shift,
                 nights:r.end - r.start, guest:r.guest, src:r.src, manual:true,
                 kind:r.kind, reason:r.reason, note:r.note,
                 fault:r.fault, fixer:r.fixer, fixer_phone:r.fixer_phone, cost:r.cost,
                 phone:r.phone, pax:r.pax, amount:r.amount,
                 pays: (r.pays || []).map(p => ({...p, on: (p.on || 0) + shift})),
                 bookedOn: typeof r.bookedOn === "number" ? r.bookedOn + shift : undefined }))
    .filter(r => r.start < DAYS && (r.kind === "block"
      ? (r.end >= -7 || (r.fault && r.end >= -REPEAT_WINDOW)) : r.end >= 0));
  issues = (d.issues || []).filter(x => flatIndex[x.id2] !== undefined)
    .map(x => ({...x, fi: flatIndex[x.id2], on: (x.on || 0) + shift,
                fixed: x.fixed == null ? null : x.fixed + shift}));
  usingDemo = false;
  recompute();
  return true;
}

/* ── writing it back ───────────────────────────────────────────────────────────
   Every write carries a client-generated id, and for inserts that id *is* the
   row's primary key. So a retry after a flaky connection cannot create the
   booking twice: the second attempt collides with itself and is treated as the
   success it actually was.                                                    */
function enqueue(op){
  if(MODE !== "live") return;
  queue.push(op); jset(QUEUE_KEY, queue);
  paintAcct(); flush();
}
async function flush(){
  if(syncing || MODE !== "live" || !queue.length) return;
  syncing = true; paintAcct();
  try{
    if(!hostId) await loadHost();
    while(queue.length){
      const op = queue[0];
      let settled = true;
      inflight = op;
      try{ await runOp(op); }
      catch(e){
        if(e.status === undefined){ settled = false; }        // no network — keep it
        else await rejected(op, e);                           // the server said no
      }
      inflight = null;
      if(!settled) break;
      // remove by identity, not position: a cancel landing mid-flight may have
      // filtered the queue underneath us, and shift() would eat the wrong op
      const at = queue.indexOf(op);
      if(at >= 0) queue.splice(at, 1);
      jset(QUEUE_KEY, queue);
    }
  }catch(e){ /* could not even resolve the host — try again on the next event */ }
  syncing = false;
  if(needPull && !queue.length){
    needPull = false;
    try{ await cloudPull(); refreshScreen(); }catch(e){}
  }
  paintAcct();
}
const MIN = {Prefer:"return=minimal"};
function runOp(op){
  switch(op.k){
    case "stay+": return rest("POST",  "/stays", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "stay~": return rest("PATCH", "/stays?id=eq." + op.id, op.body, MIN);
    case "stay-": return rest("DELETE","/stays?id=eq." + op.id, undefined, MIN);
    case "iss+":  return rest("POST",  "/issues", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "iss~":  return rest("PATCH", "/issues?id=eq." + op.id, op.body, MIN);
    case "iss-":  return rest("DELETE","/issues?id=eq." + op.id, undefined, MIN);
    case "pay+":  return rest("POST",  "/payments", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "pay-":  return rest("DELETE","/payments?id=eq." + op.id, undefined, MIN);
    case "bld+":  return rest("POST",  "/buildings", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "flat+": return rest("POST",  "/flats", {...op.body, id:op.id, host_id:hostId}, MIN);
    case "flat~": return rest("PATCH", "/flats?id=eq." + op.id, op.body, MIN);
    case "flat-": return rest("DELETE","/flats?id=eq." + op.id, undefined, MIN);
    case "wipe":  return rest("DELETE","/stays?host_id=eq." + hostId, undefined, MIN);
  }
  return Promise.resolve();
}
async function rejected(op, e){
  if(e.code === "23505") return;                    // a retry that had already landed
  if(e.code === "23P01"){ await lostTheRoom(op); return; }
  if(e.status === 401 || e.status === 403){
    toast("bad", "<b>Signed out.</b> Sign in again to save this.", null);
    signOut(true); paintAcct(); openGate(); return;
  }
  // Anything else is a bug rather than a race, and losing it silently would be
  // the one unforgivable outcome — so it is both reported and recorded.
  rollBack(op);
  toast("bad", "<b>Not saved.</b> " + esc(e.message) + " Nothing was changed on the server.", null);
  trackError("write failed: " + op.k + " — " + e.message, "", "sync", 0, 0);
}
function rollBack(op){
  if(op.k === "stay+"){
    const i = resv.findIndex(r => r.sid === op.id);
    if(i >= 0) resv.splice(i, 1);
  }
  needPull = true;
  recompute(); cacheSave();
}

/* ── the headline case: somebody else got there first ──────────────────────────
   The exclusion constraint (23P01) fired, which means these nights were taken
   between this phone accepting the entry and the write reaching the server.
   Say who took it. "Conflict" tells an operator nothing; a name and dates let
   them get back on the call and offer something else.                         */
async function lostTheRoom(op){
  const mine  = resv.find(r => r.sid === op.id);
  const block = op.body && op.body.kind === "block";
  const flatUid = (op.body && op.body.flat_id) || (mine && flats[mine.fi] && flats[mine.fi].uid);
  const code = mine && flats[mine.fi] ? flats[mine.fi].id
             : (flats.find(f => f.uid === flatUid) || {}).id || "That room";
  const a = (op.body && op.body.starts_on) || (mine && dayISO(mine.start));
  const b = (op.body && op.body.ends_on)   || (mine && dayISO(mine.end));
  const label = mine ? (mine.guest || "").trim() : "";

  rollBack(op);

  let who = "";
  try{
    const rows = await rest("GET", "/stays?select=guest_name,kind,reason,starts_on,ends_on"
      + "&flat_id=eq." + flatUid + "&starts_on=lt." + b + "&ends_on=gt." + a);
    if(rows && rows.length){
      const w = rows[0];
      const name = w.kind === "block" ? (w.reason || "Out of service") : (w.guest_name || "A guest");
      who = esc(name) + " holds " + esc(spanWords(w.starts_on, w.ends_on));
    }
  }catch(err){ /* offline again — the headline still stands without the name */ }

  toast("warn",
    "<b>" + esc(code) + " was taken.</b> "
    + (who ? who + " — entered on another phone. " : "Those nights went while you were typing. ")
    + (block ? "The block was not saved." : "Your booking" + (label ? " for " + esc(label) : "") + " was not saved."),
    mine ? mine.fi : null);
  track("conflict_lost", {kind: block ? "block" : "booking"});
  haptic([12, 60, 12]);
}
/* "12–15 Aug", with the month said once, and the end date read as the morning
   they leave. A single night is just that night. */
function spanWords(a, b){
  const s = dayOff(a), e = dayOff(b);
  if(e - s === 1) return fmt(s);
  const ds = dateAt(s), de = dateAt(e);
  return ds.getMonth() === de.getMonth() ? ds.getDate() + "–" + fmt(e)   // 12–15 Aug
                                         : fmt(s) + "–" + fmt(e);       // 30 Aug–2 Sep
}

/* ── telemetry ────────────────────────────────────────────────────────────────
   Counts, names of screens, and nothing else. No guest names, no notes, no
   rates — the moment a crash report carries a guest's name, a support
   conversation becomes a data breach.                                         */
const sessionId = uuid();          // this run of the app, however it ends up signed in
let evq = [];
async function startTelemetry(){
  if(MODE !== "live" || !hostId || !session) return;
  try{
    await rest("POST", "/app_sessions", {id:sessionId, host_id:hostId, user_id:session.uid,
      app_version:APP_VER, user_agent:(navigator.userAgent || "").slice(0,300)}, MIN);
  }catch(e){}
  track("app_open", {flats: NF, bookings: bookings().length});
}
function track(name, props){
  if(MODE !== "live" || !hostId) return;
  evq.push({session_id:sessionId, host_id:hostId, user_id:session && session.uid,
            name, props: props || {}, app_version:APP_VER});
  if(evq.length >= 12) flushEvents();
}
function flushEvents(){
  if(!evq.length || MODE !== "live" || !hostId) return;
  const batch = evq; evq = [];
  rest("POST", "/app_events", batch, MIN).catch(()=>{ /* never costs the operator anything */ });
}
function trackError(msg, stack, src, line, col){
  if(MODE !== "live" || !hostId) return;
  rest("POST", "/app_errors", {session_id:sessionId, host_id:hostId,
    user_id: session && session.uid, message:String(msg).slice(0,500),
    stack:String(stack || "").slice(0,2000), source:String(src || "").slice(0,300),
    line:line|0, col:col|0, app_version:APP_VER,
    user_agent:(navigator.userAgent || "").slice(0,300)}, MIN).catch(()=>{});
}

/* ── boot ─────────────────────────────────────────────────────────────────────
   In live mode the cache paints first and the network corrects it, so the app
   is usable in the time it takes to unlock the phone.                         */
let usingDemo = false;
if(MODE === "live"){
  if(!cacheLoad()) recompute();
}else{
  usingDemo = !load();
  if(usingDemo) generateDemo();
  recompute();
  if(usingDemo){ seedDemoBlocks(); seedDemoIssues(); }
}

/* Refuses to double-book. The UI already hides the form on an unavailable flat,
   but a silent overlap is exactly the failure that loses a guest, so the data
   layer enforces it too rather than trusting the screen. */
/* ── money ────────────────────────────────────────────────────────────────────
   Three states, not two. Almost every booking tool stores "paid" and "unpaid",
   which marks a platform booking unpaid forever — the guest HAS paid, just not
   to the operator. Show a man a false "unpaid" twice and he stops reading the
   field. So a payment carries how it arrived, and 'Platform' means settled by
   the guest and owed to the operator by Airbnb or Booking.com.               */
/* Amounts arrive typed, pasted and dictated: "₹12,500", "12500 ", "1,200.50".
   Parsed defensively here rather than trusting each caller to have stripped it,
   because an amount silently dropped is money silently lost — and the failure
   is invisible until somebody reconciles a month and finds a hole. */
const toAmount = v => {
  if(typeof v === "number") return isFinite(v) ? Math.round(v) : 0;
  const n = parseFloat(String(v == null ? "" : v).replace(/,/g,"").replace(/[^\d.-]/g,""));
  return isFinite(n) ? Math.round(n) : 0;
};
const sum = (r, f) => (r.pays || []).reduce((s,p)=> f(p) ? s + p.amount : s, 0);
const paidOn     = r => sum(r, ()=>true);                       // settled by the guest
const inHand     = r => sum(r, p => p.method !== "Platform");    // actually received
const withPlatform = r => sum(r, p => p.method === "Platform");  // payout still to come
const dueFrom    = r => Math.max(0, (r.amount || 0) - paidOn(r));
const money = n => "₹" + Math.round(n).toLocaleString("en-IN");

function addPayment(r, amount, method, note){
  amount = toAmount(amount);
  if(!amount) return false;
  if(PAY_METHODS.indexOf(method) < 0) method = "Cash";
  const p = { id: uuid(), amount, method, on: 0, note: (note||"").trim() };
  (r.pays = r.pays || []).push(p);
  if(MODE === "live" && r.sid)
    enqueue({k:"pay+", id:p.id, body:{stay_id:r.sid, amount, method,
      received_on: dayISO(0), note: p.note || null, created_by: session && session.uid}});
  save(); cacheSave();
  track("payment_recorded", {method});
  return true;
}
function dropPayment(r, p){
  const i = (r.pays || []).indexOf(p);
  if(i < 0) return;
  r.pays.splice(i, 1);
  if(MODE === "live" && p.id){
    const flying = inflight && inflight.id === p.id;
    const queued = queue.some(op => op.id === p.id && op !== inflight);
    queue = queue.filter(op => op.id !== p.id || op === inflight);
    jset(QUEUE_KEY, queue);
    if(queued && !flying) paintAcct(); else enqueue({k:"pay-", id:p.id});
  }
  save(); cacheSave();
}

function addBooking(fi, start, nights, guest, src, extra){
  if(!(fi >= 0 && fi < NF)) return false;
  nights = Math.max(1, Math.min(nights|0, DAYS));
  if(start < 0 || start >= DAYS) return false;
  if(!freeRange(fi, start, start + nights)) return false;
  extra = extra || {};
  const amount = toAmount(extra.amount);
  const row = { fi, start, end:start+nights, nights, manual:true, bookedOn:0,
                guest: (guest || "").trim() || "Guest", src: src || "Direct",
                phone: (extra.phone || "").trim() || undefined,
                pax: extra.pax > 0 ? extra.pax|0 : undefined,
                amount: amount || undefined, pays: [] };
  if(MODE === "live"){
    row.sid = uuid();
    enqueue({k:"stay+", id:row.sid, body:{
      flat_id: flats[fi].uid, kind:"booking",
      starts_on: dayISO(start), ends_on: dayISO(start + nights),
      guest_name: row.guest, source: row.src, booked_on: dayISO(0),
      guest_phone: row.phone || null, pax: row.pax || null, amount: amount || null,
      rate: flats[fi].rate || null, created_by: session && session.uid }});
  }
  resv.push(row);
  // A platform booking is already settled by the guest. Recording that here is
  // not an assumption, it is what happened — and it is the difference between a
  // payment column the operator trusts and one he learns to ignore.
  if(amount && PLATFORMS.indexOf(row.src) >= 0) addPayment(row, amount, "Platform");
  usingDemo = false;
  recompute(); save(); cacheSave();
  track("booking_created", {nights, hasPhone: !!row.phone, hasAmount: !!amount});
  return true;
}
const BLOCK_REASONS = ["Maintenance","Deep clean","Owner use","Renovation","Not ready"];

/* ══════════════ what broke, and who fixed it ════════════════════════════════
   No new tab, no work-order register, no asset list to populate. A block
   already IS the work order — the flat is out, there is a reason, a note and a
   span of nights. It gains two taps: what broke, and who is fixing it.

   Everything the operator actually wants is then derived, not stored, and it
   surfaces at the moment the flat goes out again rather than in a dashboard
   nobody opens.                                                              */
/* People, remembered from use. Independent electricians and plumbers, not
   firms — so the only identity is a name and a number worth keeping, because
   the point of the number is to ring it. */
function fixers(){
  const seen = new Map();
  resv.filter(r => isBlock(r) && r.fixer).forEach(r=>{
    const k = r.fixer.trim().toLowerCase();
    const g = seen.get(k) || {name:r.fixer.trim(), phone:r.fixer_phone || "", jobs:0,
                              back:0, spend:0, lastAt:-9999};
    g.jobs++;
    g.spend += r.cost || 0;
    if(r.fixer_phone) g.phone = r.fixer_phone;
    if(r.start > g.lastAt){ g.lastAt = r.start; g.name = r.fixer.trim(); }
    seen.set(k, g);
  });
  // a job "came back" when the same flat had the same fault again soon after
  resv.filter(r => isBlock(r) && r.fault).forEach(r=>{
    const prev = priorFault(r.fi, r.fault, r.start);
    if(prev && prev.fixer && r.start - prev.end <= HELD_WINDOW){
      const g = seen.get(prev.fixer.trim().toLowerCase());
      if(g) g.back++;
    }
  });
  return [...seen.values()].sort((a,b)=> (b.back/b.jobs) - (a.back/a.jobs) || b.jobs - a.jobs);
}

/* ── things wrong with a flat that is still sellable ──────────────────────────
   Most maintenance never justifies losing a night. Keeping these separate from
   blocks is what stops the app from quietly teaching the operator to take a
   good flat off the market just to leave himself a note.                     */
/* `fixed` is a day offset, and today is 0 — which is falsy. Testing it with !x
   would leave anything fixed TODAY sitting on the open list, on the one day the
   operator is most likely to look at it. */
const openIssues = fi => issues.filter(x => x.fixed == null && (fi == null || x.fi === fi))
                               .sort((a,b)=> URGENCY.indexOf(b.urgency) - URGENCY.indexOf(a.urgency)
                                          || a.on - b.on);

function addIssue(fi, fault, note, urgency){
  if(!(fi >= 0 && fi < NF)) return false;
  const row = {id: uuid(), fi, fault: fault || undefined, note: (note||"").trim(),
               urgency: URGENCY.indexOf(urgency) >= 0 ? urgency : "soon", on: 0, fixed: null};
  issues.push(row);
  if(MODE === "live") enqueue({k:"iss+", id:row.id, body:{
    flat_id: flats[fi].uid, fault: row.fault || null, note: row.note || null,
    urgency: row.urgency, reported_on: dayISO(0), created_by: session && session.uid}});
  save(); cacheSave();
  track("issue_reported", {fault: row.fault || "none", urgency: row.urgency});
  return true;
}
function closeIssue(x, fixer, phone, cost){
  x.fixed = 0; x.fixer = (fixer||"").trim() || undefined;
  x.fixer_phone = (phone||"").trim() || undefined;
  x.cost = toAmount(cost) || undefined;
  if(MODE === "live") enqueue({k:"iss~", id:x.id, body:{
    fixed_on: dayISO(0), fixer: x.fixer || null,
    fixer_phone: x.fixer_phone || null, cost: x.cost || null}});
  save(); cacheSave();
  track("issue_closed", {fault: x.fault || "none"});
}
function dropIssue(x){
  const i = issues.indexOf(x);
  if(i >= 0) issues.splice(i, 1);
  if(MODE === "live") enqueue({k:"iss-", id:x.id});
  save(); cacheSave();
}

/* The reason this belongs in a booking app rather than a maintenance one: the
   flat's empty nights are already known, so several small jobs can be pointed
   at one visit in a gap the flat was going to sit idle through anyway. One trip
   for the electrician instead of three, and no night lost to any of them. */
function batchWindow(fi, minNights){
  const want = Math.max(1, minNights || 1);
  for(let d = 0; d < DAYS; d++){
    if(occ[fi][d]) continue;
    let n = 0; while(d + n < DAYS && !occ[fi][d + n]) n++;
    if(n >= want) return {from: d, nights: n};
    d += n;
  }
  return null;
}

/* The most recent earlier block on this flat for this same fault. */
function priorFault(fi, fault, before){
  if(!fault) return null;
  return resv.filter(r => isBlock(r) && r.fi === fi && r.fault === fault && r.start < before)
             .sort((a,b)=> b.start - a.start)[0] || null;
}

/* The line shown the instant a fault is chosen. This is the feature: not a
   report, a sentence at the moment the flat goes out of service again. */
function faultHistory(fi, fault, before){
  const past = resv.filter(r => isBlock(r) && r.fi === fi && r.fault === fault
                                && r.start < (before == null ? DAYS : before))
                   .sort((a,b)=> b.start - a.start);
  if(!past.length) return null;
  const last = past[0];
  const gap = Math.max(0, (before == null ? 0 : before) - last.end);
  return {times: past.length + 1, last, gap,
          insideHold: !!last.fixer && gap <= HELD_WINDOW,
          recent: past.filter(r => (before == null ? 0 : before) - r.end <= REPEAT_WINDOW).length + 1};
}

/* What a spell out of service really cost: the bill plus the nights it took
   off the market. Operators consistently see only the first half, and it is
   the half that is usually smaller. */
function outageCost(r){
  const nights = Math.max(0, Math.min(r.end, DAYS) - Math.max(r.start, 0));
  const lost = nights * ((flats[r.fi] && flats[r.fi].rate) || 0);
  return {nights, lost, bill: r.cost || 0, total: (r.cost || 0) + lost};
}

/* A block may overlap nothing else, same as a booking — you cannot take a flat
   out of service for nights a guest already holds. */
function addBlock(fi, start, nights, reason, note, extra){
  if(!(fi >= 0 && fi < NF)) return false;
  nights = Math.max(1, Math.min(nights|0, DAYS));
  if(start < 0 || start >= DAYS) return false;
  if(!freeRange(fi, start, start + nights)) return false;
  extra = extra || {};
  const row = { fi, start, end:start+nights, nights, kind:"block", manual:true,
                reason: reason || "Maintenance", note: (note||"").trim(),
                fault: extra.fault || undefined,
                fixer: (extra.fixer || "").trim() || undefined,
                fixer_phone: (extra.phone || "").trim() || undefined,
                cost: toAmount(extra.cost) || undefined,
                guest: reason || "Out of service", src:"Block", bookedOn:0 };
  if(MODE === "live"){
    row.sid = uuid();
    enqueue({k:"stay+", id:row.sid, body:{
      flat_id: flats[fi].uid, kind:"block",
      starts_on: dayISO(start), ends_on: dayISO(start + nights),
      reason: row.reason, note: row.note || null, source:"Block",
      fault: row.fault || null, fixer: row.fixer || null,
      fixer_phone: row.fixer_phone || null, cost: row.cost || null,
      booked_on: dayISO(0), created_by: session && session.uid }});
  }
  resv.push(row);
  usingDemo = false;
  recompute(); save(); cacheSave();
  track("block_created", {nights, reason: row.reason});
  return true;
}
/* Push an existing block further out — "the technician did not come". Extends
   as far as it can and reports how many nights it managed, because a guest may
   already hold some of them and silently doing nothing is the worst answer. */
function extendBlock(r, extraNights){
  if(!isBlock(r)) return 0;
  const from = Math.max(r.end, 0);          // a block that already lapsed resumes today
  let can = 0;
  while(can < Math.max(1, extraNights|0) && from + can < DAYS
        && !(occ[r.fi][from+can] && !blk[r.fi][from+can])) can++;
  if(!can) return 0;
  r.end = from + can;
  r.nights = r.end - r.start;
  if(MODE === "live" && r.sid)
    enqueue({k:"stay~", id:r.sid, body:{ends_on: dayISO(r.end)}});
  recompute(); save(); cacheSave();
  track("block_extended", {nights: can});
  return can;
}
/* How many more nights this block could take before it would run into a guest.
   The slider is capped at this, so you can never drag a block over a booking. */
function maxExtend(r){
  const from = Math.max(r.end, 0);
  let n = 0;
  while(n < 30 && from + n < DAYS && !(occ[r.fi][from+n] && !blk[r.fi][from+n])) n++;
  return n;
}

/* Bring a flat back into service now: end the block today. */
function releaseBlock(r){
  if(!isBlock(r)) return false;
  if(r.start >= 0){ cancelBooking(r); return true; }   // never started — just drop it
  r.end = 0; r.nights = r.end - r.start;
  if(MODE === "live" && r.sid)
    enqueue({k:"stay~", id:r.sid, body:{ends_on: dayISO(0)}});
  recompute(); save(); cacheSave();
  track("block_released", {});
  return true;
}

function cancelBooking(r){
  const i = resv.indexOf(r);
  if(i >= 0) resv.splice(i,1);
  if(MODE === "live" && r.sid){
    // An insert still waiting in the queue can be torn up along with its own
    // cancellation — neither ever needs to travel. One already in flight
    // cannot: it is going to land whatever we do here, so a delete has to
    // follow it. Getting this wrong strands a phantom booking on the server
    // that nothing on this phone remembers.
    const flying = inflight && inflight.id === r.sid;
    const queued = queue.some(op => op.id === r.sid && op !== inflight);
    queue = queue.filter(op => op.id !== r.sid || op === inflight);
    jset(QUEUE_KEY, queue);
    if(queued && !flying) paintAcct();
    else enqueue({k:"stay-", id:r.sid});
  }
  recompute(); save(); cacheSave();
  track(isBlock(r) ? "block_released" : "booking_cancelled", {nights: r.nights});
}
function clearAll(){
  resv = []; usingDemo = false;
  if(MODE === "live"){
    queue = queue.filter(op => op.k.indexOf("stay") !== 0);   // every stay op is moot now
    enqueue({k:"wipe"});
  }
  recompute(); save(); cacheSave();
}
function resetDemo(){ generateDemo(); usingDemo = true; recompute(); seedDemoBlocks(); seedDemoIssues(); save(); }

const freeRange = (fi,a,b)=>{ for(let d=a;d<b;d++){ if(d<0||d>=DAYS||occ[fi][d]) return false; } return true; };
const freeCount = d => { let n=0; for(let i=0;i<NF;i++) if(!occ[i][d]) n++; return n; };
const runFrom   = (fi,d)=>{ let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++; return n; };
const occPct    = fi => { let sold=0, avail=0;
  for(let d=0;d<DAYS;d++){ if(blk[fi][d]) continue; avail++; if(occ[fi][d]) sold++; }
  return avail ? Math.round(sold/avail*100) : 0; };
const blockedOn = d => { let n=0; for(let i=0;i<NF;i++) if(blk[i][d]) n++; return n; };

const haptic = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ordinalSuffix = n => (n % 100 >= 11 && n % 100 <= 13) ? "th"
  : ["th","st","nd","rd"][n % 10] || "th";
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ── saying where the data is, and when it has not landed ─────────────────────
   The pill is the only place the app makes a promise about durability, so it is
   never allowed to flatter. "Live" means the server has it. Anything else says
   so, with a count.                                                           */
function paintAcct(){
  const btn = document.getElementById("acctBtn"), txt = document.getElementById("acctTxt");
  if(!btn) return;
  btn.classList.remove("live","wait","off");
  if(!CLOUD_ENABLED){
    // no account, so nothing to say about one — this is the way to the data
    txt.textContent = "Data";
    btn.setAttribute("aria-label", "Your data — export it, or clear the test bookings");
  }else if(MODE !== "live"){
    txt.textContent = "Demo data";
    btn.setAttribute("aria-label", "These bookings are made up — tap to sign in and see your own");
  }else if(!online){
    btn.classList.add("off");
    txt.textContent = queue.length ? queue.length + " to send" : "Offline";
    btn.setAttribute("aria-label", queue.length
      ? queue.length + " changes waiting for a connection" : "Offline — showing the last book that reached this phone");
  }else if(queue.length){
    btn.classList.add("wait");
    txt.textContent = queue.length + " to send";
    btn.setAttribute("aria-label", queue.length + " changes still saving");
  }else{
    btn.classList.add("live");
    txt.textContent = "Live";
    btn.setAttribute("aria-label", "Signed in" + (hostName ? " to " + hostName : "") + " — everything saved");
  }
}

/* A conflict is news, not an error. Tapping it opens the room it is about, so
   the next thing you say on the call is one tap away. */
function toast(kind, html, fi, action){
  const host = document.getElementById("toasts");
  if(!host) return;
  const t = el("div", "toast" + (kind ? " " + kind : ""));
  t.innerHTML = html;
  if(action){
    const a = el("button", "tclose", action.label);
    a.onclick = ev=>{ ev.stopPropagation(); t.remove(); action.run(); };
    t.append(a);
  }else if(fi != null && flats[fi]){
    t.append(el("span", "tclose", "See " + flats[fi].id + " →"));
    t.onclick = ()=>{ t.remove(); openSheet(fi); };
  }else{
    t.onclick = ()=> t.remove();
  }
  host.append(t);
  // long enough to read a sentence and act on it; a conflict and an undo both
  // need longer, because both are decisions rather than notifications
  const life = kind === "warn" ? 11000 : action ? 9000 : 7000;
  setTimeout(()=>{ t.style.transition = "opacity .3s"; t.style.opacity = "0";
                   setTimeout(()=>t.remove(), 320); }, life);
  while(host.children.length > 3) host.firstChild.remove();
}

/* ── undo ─────────────────────────────────────────────────────────────────────
   Cancelling was two taps and final. Mid-call, on a phone, with the ✕ sitting a
   thumb's width from the money pill, that is a booking lost to a mis-tap and no
   way back — the guest's name, number and dates all gone. The row is put back
   exactly as it was, including its payments, and only the server id changes.  */
function cancelWithUndo(r, fi){
  const copy = {...r, pays:(r.pays || []).map(p=>({...p}))};
  const who = isBlock(r) ? (r.reason || "Out of service") : r.guest;
  cancelBooking(r);
  toast("", `<b>${esc(who)}</b> removed from ${esc(flats[fi].id)}, `
          + `${esc(spanWords(dayISO(Math.max(copy.start,0)), dayISO(copy.end)))}.`,
    null, {label:"Undo", run:()=>{
      // somebody else may have taken the nights in the seconds since
      if(!freeRange(copy.fi, Math.max(copy.start,0), copy.end)){
        toast("warn", `<b>Those nights are gone.</b> ${esc(flats[fi].id)} was taken while the `
                    + `cancellation was on screen, so ${esc(who)} could not be put back.`, fi);
        return;
      }
      const restored = isBlock(copy)
        ? addBlock(copy.fi, Math.max(copy.start,0), copy.end - Math.max(copy.start,0), copy.reason, copy.note)
        : addBooking(copy.fi, Math.max(copy.start,0), copy.end - Math.max(copy.start,0),
                     copy.guest, copy.src, {phone:copy.phone, pax:copy.pax, amount:copy.amount});
      if(!restored){ toast("bad", "<b>Could not put it back.</b> Nothing was changed.", fi); return; }
      const back = resv[resv.length - 1];
      // the platform auto-payment is re-created by addBooking; carry the rest
      const auto = PLATFORMS.indexOf(copy.src) >= 0;
      (copy.pays || []).forEach(p=>{ if(auto && p.method === "Platform") return;
                                     addPayment(back, p.amount, p.method, p.note); });
      haptic(14); refreshScreen();
      toast("", `<b>${esc(who)}</b> is back in ${esc(flats[fi].id)}.`, fi);
    }});
}

/* ══════════════ writing a real .xlsx, with no library ═══════════════════════
   A CSV would have been ten lines. It is not used because Excel reads a column
   of ten-digit phone numbers as scientific notation and writes 9.81235E+09 —
   silently destroying the single most valuable column in the export, which is
   the one the whole marketing list is keyed on.

   So: a genuine workbook, where numbers are numbers you can sum, dates are
   dates you can sort, and phone numbers are text that survives. An xlsx is a
   ZIP of XML, and a ZIP entry may be *stored* rather than deflated, so all this
   needs is a CRC32 and careful byte assembly — no dependency, nothing fetched,
   still one file that works offline.                                          */
const CRC_T = (()=>{ const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n] = c>>>0; }
  return t; })();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder(), parts = [], dir = [];
  let at = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(8, 0, true);                        // stored, not deflated
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2141, true);   // fixed timestamp
    lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2141, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, at, true);
    dir.push(new Uint8Array(ch.buffer), name);
    at += 30 + name.length + n;
  });
  const dirBytes = dir.reduce((s,b)=> s + b.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, dirBytes, true); eo.setUint32(16, at, true);
  const all = parts.concat(dir, [new Uint8Array(eo.buffer)]);
  const out = new Uint8Array(all.reduce((s,b)=> s + b.length, 0));
  let o = 0; all.forEach(b=>{ out.set(b, o); o += b.length; });
  return out;
}
const xmlEsc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
const colName = i => { let s = ""; i++; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - 1 - m) / 26; } return s; };
/* Excel counts days from 1899-12-30 */
const xlDate = d => Math.round((d - new Date(Date.UTC(1899,11,30))) / 86400000);

/* A cell is {v, t} where t is "s" text, "n" number, "d" date, "m" money.
   Styles: 0 plain, 1 header, 2 date, 3 money, 4 text-forced (phone numbers). */
function sheetXml(rows){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row, r)=>{
    x += '<row r="' + (r+1) + '">';
    row.forEach((c, i)=>{
      if(c == null || c.v === "" || c.v == null) return;
      const ref = colName(i) + (r+1);
      if(c.t === "n" || c.t === "m")
        x += '<c r="' + ref + '" s="' + (c.t === "m" ? 3 : 0) + '"><v>' + Number(c.v) + '</v></c>';
      else if(c.t === "d")
        x += '<c r="' + ref + '" s="2"><v>' + xlDate(c.v) + '</v></c>';
      else
        x += '<c r="' + ref + '" s="' + (c.t === "h" ? 1 : c.t === "p" ? 4 : 0)
           + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(c.v) + '</t></is></c>';
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function buildXlsx(sheets){                       // [{name, rows}]
  const enc = new TextEncoder(), B = s => enc.encode(s);
  const files = [
    {name:"[Content_Types].xml", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")
      + '</Types>')},
    {name:"_rels/.rels", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:"xl/workbook.xml", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + sheets.map((s,i)=>'<sheet name="'+xmlEsc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")
      + '</sheets></workbook>')},
    {name:"xl/_rels/workbook.xml.rels", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")
      + '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>')},
    {name:"xl/styles.xml", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<numFmts count="2"><numFmt numFmtId="180" formatCode="dd\\ mmm\\ yyyy"/>'
      + '<numFmt numFmtId="181" formatCode="#,##0"/></numFmts>'
      + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
      + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
      + '<fills count="2"><fill><patternFill patternType="none"/></fill>'
      + '<fill><patternFill patternType="gray125"/></fill></fills>'
      + '<borders count="1"><border/></borders>'
      + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
      + '<cellXfs count="5">'
      + '<xf xfId="0"/>'                                              // 0 plain
      + '<xf xfId="0" fontId="1" applyFont="1"/>'                     // 1 header
      + '<xf xfId="0" numFmtId="180" applyNumberFormat="1"/>'         // 2 date
      + '<xf xfId="0" numFmtId="181" applyNumberFormat="1"/>'         // 3 money
      + '<xf xfId="0" quotePrefix="1"/>'                              // 4 forced text
      + '</cellXfs>'
      // without a named default style some readers warn and substitute their own
      + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
      + '</styleSheet>')},
  ];
  sheets.forEach((s,i)=> files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:B(sheetXml(s.rows))}));
  return new Blob([zipStore(files)],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ── what actually goes in the book ──────────────────────────────────────────
   Four sheets, each answering a question somebody asks out loud. Nothing is
   invented: a booking with no amount exports a blank cell rather than a zero,
   because a zero would read as "free stay" and get summed. */
function exportRows(){
  const bk = bookings().slice().sort((a,b)=> a.start - b.start);
  const fmtDay = d => dateAt(d);
  const H = a => a.map(v => ({v, t:"h"}));

  const bookingRows = [H(["Flat","Building","Type","Guest","Phone","Source","Check in","Check out",
                          "Nights","Guests","Agreed","Received","With platform","Balance","Status"])];
  bk.forEach(r=>{
    const f = flats[r.fi], due = dueFrom(r), plat = withPlatform(r);
    bookingRows.push([
      {v:f.id}, {v:f.bname}, {v:f.type}, {v:r.guest}, {v:r.phone || "", t:"p"}, {v:r.src},
      {v:fmtDay(r.start), t:"d"}, {v:fmtDay(r.end), t:"d"},
      {v:r.nights, t:"n"}, r.pax ? {v:r.pax, t:"n"} : null,
      r.amount ? {v:r.amount, t:"m"} : null,
      inHand(r) ? {v:inHand(r), t:"m"} : null,
      plat ? {v:plat, t:"m"} : null,
      due ? {v:due, t:"m"} : null,
      {v: !r.amount ? "no amount recorded" : due > 0 ? "balance due" : plat > 0 ? "payout due" : "settled"},
    ]);
  });

  const payRows = [H(["Date","Amount","Method","Guest","Phone","Flat","Stay from","Stay to"])];
  bk.forEach(r=> (r.pays || []).forEach(p=> payRows.push([
    {v:fmtDay(p.on || 0), t:"d"}, {v:p.amount, t:"m"}, {v:p.method}, {v:r.guest},
    {v:r.phone || "", t:"p"}, {v:flats[r.fi].id},
    {v:fmtDay(r.start), t:"d"}, {v:fmtDay(r.end), t:"d"}])));

  /* One row per number, which is the marketing list. Sorted by how much they
     have been worth, because that is the order you would call them in. */
  const byPhone = {};
  bk.filter(r => r.phone).forEach(r=>{
    const k = digits10(r.phone);
    const g = byPhone[k] = byPhone[k] || {name:r.guest, phone:r.phone, stays:0, nights:0,
                                          billed:0, paid:0, first:r.start, last:r.start};
    g.stays++; g.nights += r.nights; g.billed += r.amount || 0; g.paid += paidOn(r);
    g.first = Math.min(g.first, r.start); g.last = Math.max(g.last, r.start);
    if(r.start >= g.last) g.name = r.guest;
  });
  const guestRows = [H(["Guest","Phone","Stays","Nights","Billed","Paid","First stay","Last stay"])];
  Object.values(byPhone).sort((a,b)=> b.billed - a.billed).forEach(g=> guestRows.push([
    {v:g.name}, {v:g.phone, t:"p"}, {v:g.stays, t:"n"}, {v:g.nights, t:"n"},
    g.billed ? {v:g.billed, t:"m"} : null, g.paid ? {v:g.paid, t:"m"} : null,
    {v:fmtDay(g.first), t:"d"}, {v:fmtDay(g.last), t:"d"}]));

  /* Month by month. Occupancy excludes blocked nights from the denominator,
     exactly as it does on screen — taking a flat out of service must never
     flatter the figure. */
  const months = {};
  for(let d = 0; d < DAYS; d++){
    const dt = dateAt(d), key = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0");
    const m = months[key] = months[key] || {key, label: MONF[dt.getMonth()] + " " + dt.getFullYear(),
                                             sold:0, sellable:0, billed:0, paid:0, arrivals:0};
    for(let i = 0; i < NF; i++){
      if(blk[i][d]) continue;
      m.sellable++; if(occ[i][d]) m.sold++;
    }
  }
  bk.forEach(r=>{
    const dt = dateAt(Math.max(r.start,0));
    const key = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0");
    if(!months[key]) return;
    months[key].arrivals++; months[key].billed += r.amount || 0;
    (r.pays || []).forEach(p=>{
      const pd = dateAt(p.on || 0);
      const pk = pd.getFullYear() + "-" + String(pd.getMonth()+1).padStart(2,"0");
      if(months[pk]) months[pk].paid += p.amount;
    });
  });
  const sumRows = [H(["Month","Arrivals","Nights sold","Sellable nights","Occupancy","Billed","Collected","Outstanding"])];
  Object.values(months).sort((a,b)=> a.key < b.key ? -1 : 1).forEach(m=> sumRows.push([
    {v:m.label}, {v:m.arrivals, t:"n"}, {v:m.sold, t:"n"}, {v:m.sellable, t:"n"},
    {v: m.sellable ? Math.round(m.sold / m.sellable * 100) + "%" : "—"},
    m.billed ? {v:m.billed, t:"m"} : null, m.paid ? {v:m.paid, t:"m"} : null,
    (m.billed - m.paid) > 0 ? {v:m.billed - m.paid, t:"m"} : null]));

  return [{name:"Summary", rows:sumRows}, {name:"Bookings", rows:bookingRows},
          {name:"Payments", rows:payRows}, {name:"Guests", rows:guestRows}];
}

/* On a phone the share sheet is the right destination — it puts the file
   straight into WhatsApp or mail, which is how it reaches the accountant.
   On a desktop it is an ordinary download. */
async function exportBook(btn){
  const sheets = exportRows();
  const blob = buildXlsx(sheets);
  const stamp = isoDay(today);
  const name = (hostName || "Vacancy").replace(/[^\w]+/g,"-").toLowerCase() + "-" + stamp + ".xlsx";
  const file = new File([blob], name, {type: blob.type});
  track("export", {sheets: sheets.length, rows: sheets.reduce((s,x)=> s + x.rows.length - 1, 0)});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Bookings"}); return "shared"; }
    catch(e){ if(e && e.name === "AbortError") return "cancelled"; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  return "downloaded";
}

function roomTile(fi, day, stay){
  const fl = flats[fi];
  const nights = stay || 1;
  const open = freeRange(fi, day, day + nights);
  const blocked = blk[fi][day];
  const turn = chg[fi][day] && !open;
  const run = open ? runFrom(fi, day) : 0;
  const b = el("button","tile" + (open ? " free" : blocked ? " oos" : (turn ? " turn" : "")));
  const note = open
    ? (run >= DAYS-day ? `Free ${run}+n` : `Free ${run}n`)
    : blocked ? (resv.find(r=>isBlock(r) && r.fi===fi && day>=r.start && day<r.end)?.reason || "Blocked")
    : (turn ? "Turnaround" : "Booked");
  b.append(el("b",null,fl.id), el("s",null,note));
  if(open && run === 1) b.appendChild(el("i","flag"));   // orphan night
  b.setAttribute("aria-label",
    `${fl.id}, ${fl.type}, ${open ? `free for ${run} night${run>1?"s":""} from`
      : blocked ? "out of service on" : "not available on"} ${fmtL(day)}`);
  b.onclick = ()=>{ if(b._peeked){ b._peeked = false; return; } haptic(9); openSheet(fi, day); };
  attachPeek(b, fi, day);
  return b;
}

/* ── hold a room to read it ───────────────────────────────────────────────────
   Mid-call the question is rarely "show me everything about 204" — it is "what
   about 204?", asked while the grid is still the thing you want to be looking
   at. Opening a sheet answers it and costs you your place; this answers it and
   gives the place back the moment the thumb lifts.

   Hold, read, release. Nothing to dismiss, nothing to navigate back from.    */
let peekEl = null;
function attachPeek(btn, fi, day){
  let timer = null, x0 = 0, y0 = 0, fired = false;
  const cancel = ()=>{ clearTimeout(timer); timer = null;
    if(fired){ hidePeek(); btn._peeked = true; fired = false; } };
  btn.addEventListener("pointerdown", e=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; fired = false;
    timer = setTimeout(()=>{ fired = true; haptic(11); showPeek(fi, day); }, 330);
  });
  btn.addEventListener("pointermove", e=>{
    // a scroll is not a hold; let go of the gesture rather than fighting it
    if(timer !== null && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => btn.addEventListener(ev, cancel));
}
function showPeek(fi, day){
  hidePeek();
  const fl = flats[fi];
  const p = el("div","peek");
  const h = el("div","peek-h");
  h.append(el("b", null, fl.id), el("s", null, `${fl.type} · ${fl.bshort} · floor ${fl.floor}`));
  const strip = el("div","strip");
  for(let d=0; d<DAYS; d++){
    const i = el("i");
    if(!occ[fi][d]) i.classList.add("f"); else if(blk[fi][d]) i.classList.add("b");
    if(d === day) i.classList.add("td");
    strip.appendChild(i);
  }
  const line = el("div","peek-l");
  line.textContent = nightStory(fi, day);
  const nxt = bookings().filter(r => r.fi === fi && r.start > day).sort((a,b)=> a.start - b.start)[0];
  const sub = el("div","peek-s");
  sub.textContent = nxt
    ? `Next in: ${nxt.guest}, ${fmt(nxt.start)}` + (occPct(fi) ? ` · ${occPct(fi)}% booked` : "")
    : `Nothing else booked in nine weeks · ${occPct(fi)}% booked`;
  p.append(h, strip, line, sub);
  document.body.appendChild(p);
  requestAnimationFrame(()=> p.classList.add("on"));
  peekEl = p;
}
function hidePeek(){
  if(!peekEl) return;
  const p = peekEl; peekEl = null;
  p.classList.remove("on");
  setTimeout(()=> p.remove(), 200);
}

/* ═══════════════ SCREEN 1 — ROOMS ═══════════════ */
const STRIP = 14;              // nights answerable without leaving this tab
const STAYS = [1,2,3,7];
let pickedNight = 0, stayNights = 1;
const countFreeFor = (d, n) => { let c=0; for(let i=0;i<NF;i++) if(freeRange(i,d,d+n)) c++; return c; };
const soonestFor = (n, from) => { for(let d=from; d<=DAYS-n; d++) if(countFreeFor(d,n)) return d; return -1; };

/* ── One move away ──────────────────────────────────────────────────────────
   When nothing is free for a stay, a hotel manager doesn't say no — they shuffle
   a room. This finds every stay you COULD take by relocating exactly one existing
   guest to a room that is free for their whole stay. Ranked so the move nobody
   notices (same building, same size) comes first.                              */
function roomMoves(a, b, pool){
  const out = [];
  pool.forEach(({f: fl, i: fi})=>{
    if(freeRange(fi, a, b)) return;                      // already free, no move needed
    const blockers = resv.filter(r => r.fi === fi && r.start < b && r.end > a);
    if(blockers.length !== 1) return;                    // two guests to move is not "one move"
    const B = blockers[0];
    if(B.start < 0) return;                              // already checked in — can't move them now
    let best = null;
    for(let j = 0; j < NF; j++){
      if(j === fi) continue;
      if(!freeRange(j, B.start, B.end)) continue;        // destination must take their whole stay
      const cand = {
        to: j,
        sameType: flats[j].type === fl.type,
        sameBuilding: flats[j].code === fl.code,
        biggerOrEqual: SIZE[flats[j].type] >= SIZE[fl.type],
      };
      cand.score = (cand.sameType ? 4 : 0) + (cand.sameBuilding ? 2 : 0) + (cand.biggerOrEqual ? 1 : 0);
      if(!best || cand.score > best.score) best = cand;
      if(cand.score === 7) break;
    }
    if(best) out.push({ frees: fi, booking: B, ...best });
  });
  return out.sort((x,y)=> y.score - x.score);
}
const SIZE = {"Studio":0, "1 BHK":1, "2 BHK":2, "3 BHK":3};

/* The operator's real morning question isn't "how many are free" — it's
   who is arriving, who is leaving, and which rooms have to be turned around
   between a checkout and a check-in on the same day. */
function dayOps(d){
  const arrivals = bookings().filter(r => r.start === d).sort((a,b)=> a.fi - b.fi);
  const departures = bookings().filter(r => r.end === d).sort((a,b)=> a.fi - b.fi);
  const arrivingIn = new Set(arrivals.map(r => r.fi));
  const turnovers = departures.filter(r => arrivingIn.has(r.fi))
    .map(r => ({ fi:r.fi, out:r, in:arrivals.find(a => a.fi === r.fi) }));
  return { arrivals, departures, turnovers };
}

  inv.onclick = ()=>{ haptic(10); openInventory(); };
  note.appendChild(inv);

  s.append(hero, stayWrap, nightsWrap, tilesWrap, note);

  function paint(){
    const d = Math.min(pickedNight, STRIP-1), n = stayNights;

    // dial
    const si = STAYS.indexOf(n);
    ind.style.width = `calc((100% - 6px)/${STAYS.length})`;
    ind.style.transform = `translateX(${si*100}%)`;
    [...seg.querySelectorAll("button")].forEach((b,i)=>b.setAttribute("aria-pressed", i===si));

    // every night re-counted for a stay of n nights
    nights.querySelectorAll(".night").forEach(c=>{
      const cd = +c.dataset.d, f = countFreeFor(cd, n);
      c.classList.toggle("sel", cd === d);
      c.classList.toggle("full", f === 0);
      c.querySelector(".n").textContent = f;
      c.querySelector(".t i").style.width = (f/NF*100).toFixed(0)+"%";
      c.setAttribute("aria-label",
        `Arrive ${fmtL(cd)}, ${f} of ${NF} rooms free for ${n} night${n>1?"s":""}`);
    });

    const f = countFreeFor(d, n);

    // the day's board follows the selection, like everything else on this screen
    const dt = dateAt(d), ops = dayOps(d);
    opsDateB.textContent = `${DOWF[dt.getDay()]} ${dt.getDate()} ${MONF[dt.getMonth()]}`;
    opsDateS.textContent = d===0 ? "today" : d===1 ? "tomorrow" : `in ${d} days`;
    opEls.forEach(o=>{
      const list = ops[o.key], c = list.length;
      o.nEl.textContent = c;
      o.b.classList.toggle("zero", c === 0);
      o.b.classList.toggle("alert", o.key === "turnovers" && c > 0);
      o.b.setAttribute("aria-label",
        `${c} ${o.key === "turnovers" ? "same-day turnarounds" : o.key} on ${fmtL(d)}`);
    });

    scrSub.textContent = n === 1
      ? `${f} of ${NF} free · ${d===0 ? "tonight" : fmtL(d)}`
      : `${f} of ${NF} free · ${fmt(d)} → ${fmt(d+n)}`;

    thLeft.textContent = "Every room";
    thRight.textContent = n === 1 ? fmtL(d) : `${fmt(d)} → ${fmt(d+n)}`;
    reset.style.display = d===0 ? "none" : "inline-flex";

    tiles.textContent = "";
    if(f === 0){
      // a dead end is still a question worth answering: when *is* this stay possible?
      tiles.style.display = "block";
      const box = el("div","card"); box.style.padding = "20px 18px";
      const soon = soonestFor(n, d+1);
      const head = el("p");
      head.style.cssText = "margin:0;font-size:15px;font-weight:600;letter-spacing:-.018em;line-height:1.4";
      head.textContent = `No room takes a ${n}-night stay arriving ${fmtL(d)}.`;
      box.appendChild(head);

      const moves = roomMoves(d, d+n, flats.map((f,i)=>({f,i})));
      if(moves.length){
        const mv = moves[0], from = flats[mv.frees], to = flats[mv.to], B = mv.booking;
        const p = el("p");
        p.style.cssText = "margin:10px 0 0;font-size:13px;color:var(--txt-2);line-height:1.55";
        p.innerHTML = `But you are <b style="color:var(--now)">one move away</b> — shift `
          + `<b style="color:var(--txt)">${B.guest}</b> from ${from.id} to ${to.id} `
          + `(${fmt(B.start)}–${fmt(B.end)}${mv.sameType ? ", same size" : ""}) and ${from.id} opens up.`;
        box.appendChild(p);
      }
      if(soon >= 0){
        const sc = countFreeFor(soon, n);
        const p = el("p");
        p.style.cssText = "margin:8px 0 14px;font-size:13px;color:var(--txt-2);line-height:1.5";
        p.innerHTML = `Soonest it works is <b style="color:var(--txt)">${fmtL(soon)}</b> — ${sc} room${sc>1?"s":""}.`;
        const jump = el("button","copybtn");
        jump.textContent = soon < STRIP ? `Jump to ${fmt(soon)}` : `Open ${fmt(soon)} in Month`;
        jump.onclick = ()=>{ haptic(10);
          if(soon < STRIP){ pickedNight = soon; paint(); } else goMonth(soon); };
        box.append(p, jump);
      } else {
        const p = el("p");
        p.style.cssText = "margin:8px 0 0;font-size:13px;color:var(--txt-2);line-height:1.5";
        p.textContent = `Nothing in the next nine weeks has ${n} consecutive nights open. Try a shorter stay.`;
        box.appendChild(p);
      }
      tiles.appendChild(box);
    } else {
      tiles.style.display = "";
      flats.forEach((fl,fi)=> tiles.appendChild(roomTile(fi, d, n)));
    }

    const sel = nights.querySelector(".night.sel");
    if(sel) sel.scrollIntoView({behavior: calm?"auto":"smooth", block:"nearest", inline:"nearest"});
  }
  paint();
}

/* ═══════════════ SCREEN 2 — MONTH ═══════════════ */
let monthOffset = 0, revealPanel = false;
/* One selection, always: `sel.a` is the arrival, `sel.n` the nights. A single
   night is just n = 1. `pendingStart` is set after the first of two taps. */
let sel = {a:0, n:1}, pendingStart = null;
let sweptJustNow = false, sweepLive = false;

/* Press-and-hold on a date, then drag: the calendar becomes a range picker and
   the readout above it counts rooms free for the WHOLE span as you move. This
   is the question a caller actually asks, answered by dragging a finger. */
function attachSweep(grid, hud){
  let hold = null, live = false, a = null, b = null;

  const cellAt = (x,y)=>{
    const e = document.elementFromPoint(x,y);
    return e && e.closest ? e.closest(".day[data-d]") : null;
  };
  const paint = ()=>{
    const lo = Math.min(a,b), hi = Math.max(a,b);
    grid.querySelectorAll(".day[data-d]").forEach(c=>{
      const d = +c.dataset.d;
      c.classList.toggle("rng", d > lo && d < hi);
      c.classList.toggle("rngA", d === lo);
      c.classList.toggle("rngB", d === hi && hi !== lo);
    });
    const nights = Math.max(1, hi - lo);
    const free = flats.filter((f,i)=>freeRange(i, lo, lo + nights)).length;
    hud.classList.add("on");
    const n = hud.querySelector(".n"), t = hud.querySelector(".t");
    n.textContent = free;
    n.classList.toggle("none", free === 0);
    t.innerHTML = `free for <b>all ${nights} night${nights>1?"s":""}</b><br>${fmt(lo)} → ${fmt(lo+nights)}`;
  };
  const clear = ()=>{
    grid.querySelectorAll(".rng,.rngA,.rngB").forEach(c=>c.classList.remove("rng","rngA","rngB"));
  };
  const begin = (cell)=>{
    live = true; sweepLive = true; a = b = +cell.dataset.d;
    grid.classList.add("sweeping");
    haptic(18); paint();
  };
  const move = (x,y)=>{
    if(!live) return;
    const cell = cellAt(x,y);
    if(cell){ const d = +cell.dataset.d; if(d !== b){ b = d; haptic(5); paint(); } }
  };
  /* Never leave the page in a half-swept state — a stuck `live` means every
     later touchmove calls preventDefault and the page stops scrolling. */
  const reset = ()=>{
    clearTimeout(hold);
    live = false; sweepLive = false;
    grid.classList.remove("sweeping");
  };
  const end = ()=>{
    const was = live, lo = Math.min(a,b), hi = Math.max(a,b);
    reset();
    if(!was) return;
    sel = {a: lo, n: Math.max(1, hi - lo)};
    pendingStart = null; sweptJustNow = true; revealPanel = true;
    haptic(16);
    setTimeout(()=>{ sweptJustNow = false; }, 350);
    renderMonth();
  };

  grid.addEventListener("touchstart", e=>{
    const cell = e.target.closest && e.target.closest(".day[data-d]");
    if(!cell) return;
    clearTimeout(hold);
    hold = setTimeout(()=>begin(cell), 260);
  }, {passive:true});
  grid.addEventListener("touchmove", e=>{
    if(!live){ clearTimeout(hold); return; }   // a real scroll — let it through
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  // bound on the window as well: a touch that ends off the grid must still clean up
  addEventListener("touchend", end, {passive:true});
  addEventListener("touchcancel", ()=>{ reset(); clear(); hud.classList.remove("on"); }, {passive:true});

  // desktop: hold the mouse down and drag
  grid.addEventListener("mousedown", e=>{
    const cell = e.target.closest && e.target.closest(".day[data-d]");
    if(!cell) return;
    clearTimeout(hold);
    hold = setTimeout(()=>begin(cell), 260);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = ()=>{ end(); removeEventListener("mousemove",mm); removeEventListener("mouseup",mu); };
    addEventListener("mousemove", mm); addEventListener("mouseup", mu);
  });
}
function monthList(){
  const out = [];
  for(let d=0; d<DAYS; d++){
    const dt = dateAt(d), k = dt.getFullYear()+"-"+dt.getMonth();
    if(!out.length || out[out.length-1].k!==k) out.push({k, y:dt.getFullYear(), m:dt.getMonth(), days:[]});
    out[out.length-1].days.push(d);
  }
  return out;
}
function goMonth(day){
  const ms = monthList();
  const dt = dateAt(day);
  const i = ms.findIndex(m=>m.y===dt.getFullYear() && m.m===dt.getMonth());
  if(i>=0) monthOffset = i;
  sel = {a:day, n:1}; pendingStart = null;
  switchTo(1);
}
function renderMonth(){
  const s = document.getElementById("scr-month");
  s.textContent = "";
  const ms = monthList();
  const mo = ms[Math.max(0,Math.min(ms.length-1,monthOffset))];

  const nav = el("div","mnav");
  const prev = el("button",null,"‹"), next = el("button",null,"›");
  prev.setAttribute("aria-label","Previous month"); next.setAttribute("aria-label","Next month");
  if(monthOffset<=0) prev.setAttribute("disabled","");
  if(monthOffset>=ms.length-1) next.setAttribute("disabled","");
  prev.onclick = ()=>{ monthOffset--; sel={a:ms[monthOffset].days[0],n:1}; pendingStart=null; haptic(8); renderMonth(); };
  next.onclick = ()=>{ monthOffset++; sel={a:ms[monthOffset].days[0],n:1}; pendingStart=null; haptic(8); renderMonth(); };
  nav.append(el("div","t", `${MONF[mo.m]} ${mo.y}`), prev, next);

  /* ── the shape of the month ───────────────────────────────────────────── */
  const st = monthStats(mo.days);
  const partial = mo.days[0] === 0 && dateAt(0).getDate() !== 1;
  const scope = partial ? `Rest of ${MONF[mo.m]}` : MONF[mo.m];

  /* The month's fullness rides in the title row rather than taking a section of
     its own. It was a progress bar plus a caption plus an explanatory paragraph
     — three blocks to say one number, on the tab whose entire job is the
     calendar underneath them. Pulse owns occupancy analysis now; this is a
     caption, not a chart. */
  nav.appendChild(el("div","msum",
    `${Math.round(st.pct*100)}% booked · ${st.open.toLocaleString("en-IN")} room-nights open`));

  /* live readout while sweeping a range across the calendar */
  const hud = el("div","hud");
  hud.append(el("div","n"), el("div","t"));

  const norm = weekdayFreeNorm();
  const soft = softDates(norm);
  const softSet = new Set(soft.map(x=>x.d));

  const cal = el("div","card");
  cal.style.cssText = "padding:14px;background:transparent;border:0;box-shadow:none";
  const dow = el("div","dow");
  ["M","T","W","T","F","S","S"].forEach(d=>dow.appendChild(el("span",null,d)));
  const grid = el("div","cal");
  const lead = (dateAt(mo.days[0]).getDay()+6)%7;
  for(let i=0;i<lead;i++) grid.appendChild(el("div","day pad"));
  mo.days.forEach(d=>{
    const dt = dateAt(d), f = freeCount(d);
    const c = el("button","day");
    if(d===0) c.classList.add("today");
    if(f===0) c.classList.add("none");
    const lo = sel.a, hi = sel.a + sel.n;
    if(pendingStart === d)      c.classList.add("rngA");     // first of two taps
    else if(sel.n > 1){
      if(d === lo)              c.classList.add("rngA");
      else if(d === hi)         c.classList.add("rngB");
      else if(d > lo && d < hi) c.classList.add("rng");
    }
    else if(d === lo)           c.classList.add("sel");
    if(softSet.has(d)) c.classList.add("soft");
    c.append(el("div","dd",String(dt.getDate())), el("div","fn",String(f)));
    const g = el("div","gg"); const i = el("i");
    i.style.width = (f/NF*100).toFixed(0)+"%";
    g.appendChild(i); c.appendChild(g);
    c.setAttribute("aria-label", `${fmtL(d)}, ${f} of ${NF} rooms free`
      + (softSet.has(d) ? `, emptier than a typical ${DOWF[dt.getDay()]}` : ""));
    c.dataset.d = d;
    /* Two taps make a range, the way every booking site works: first tap is the
       arrival and shows that night, second tap sets the departure. */
    c.onclick = ()=>{
      if(sweptJustNow) return;
      if(pendingStart !== null && d > pendingStart){
        sel = {a: pendingStart, n: d - pendingStart};
        pendingStart = null;
      } else {
        sel = {a: d, n: 1};
        pendingStart = d;
      }
      revealPanel = true; haptic(9); renderMonth();
    };
    grid.appendChild(c);
  });
  cal.style.padding = "0";
  cal.append(dow, grid);
  attachSweep(grid, hud);

  /* Two paragraphs used to sit under the calendar explaining what the numbers
     mean and how to drag. Both were teaching, and teaching that is read once
     costs a section forever. What survives is the one line that is NEWS — a
     date running emptier than its weekday usually does — and only while a
     selection is in progress, the line that says what the next tap does. */
  const worst = soft[0];
  const key = el("p","insight");
  key.style.padding = "0 2px";
  if(pendingStart !== null){
    key.innerHTML = `Arriving <b>${fmtL(pendingStart)}</b> — now tap the departure date.`;
  }else if(worst){
    key.innerHTML = `<span class="hi">${fmtL(worst.d)} is running empty for a ${DOWF[dateAt(worst.d).getDay()]}</span>`
      + ` — ${worst.free} free against about ${Math.round(worst.norm)} on a normal one. The amber dots mark the rest.`;
  }else{
    key.remove();
  }

  s.append(nav, hud, cal);
  if(key.parentNode !== null || key.innerHTML) s.append(key);

  /* one panel for whatever is selected — a single night is just n = 1 */
  {
    const {a, n} = sel;
    const free = flats.map((f,i)=>i).filter(i=>freeRange(i, a, a+n));
    const panel = el("div","stack gap-s");
    const h = el("div","sect");
    h.append(el("span","lbl", n === 1 ? fmtL(a) : `${fmt(a)} → ${fmt(a+n)}`),
             el("span","lbl", n === 1 ? `${free.length} of ${NF} free`
                                      : `${n} nights · ${free.length} free`));
    const list = el("div","card");
    if(!free.length){
      list.appendChild(el("div","empty", n === 1
        ? "Fully booked that night. Nothing left to sell."
        : `No flat is free for all ${n} nights. Ask can suggest moving one guest to open one up.`));
    }
    free.forEach(fi=> list.appendChild(roomRow(fi, a, null)));
    panel.append(h, list);
    s.appendChild(panel);
    if(revealPanel){
      revealPanel = false;
      requestAnimationFrame(()=> panel.scrollIntoView({behavior: calm?"auto":"smooth", block:"nearest"}));
    }
  }
}

/* ═══════════════ SCREEN 4 — TRENDS ═══════════════ */

/* ══════════════ what the money is doing ═════════════════════════════════════
   Occupancy alone hides the thing that pays: a full house at a poor rate and a
   half-empty one at a good rate look identical on an occupancy chart. RevPAR
   folds price and occupancy into one number and is what operators actually run
   on. Everything here is honest about coverage — a booking with no amount
   recorded is excluded and SAID to be excluded, rather than quietly dragging
   the average down.                                                          */
