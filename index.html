<!--
  DIRECTION CONTRACT — Vacancy

  THESIS: The vacant room is the lit one. Booked is recessed material sitting close to
  the ground; free is high-luminance and pops off it — he is hunting vacancy, so vacancy
  glows. Refuses the ledger world shipped previously (paper, ruling, stamps) and the
  category default of pastel booking pills on white.

  OWN-WORLD: Near-monochrome instrument. #08090C ground, layered charcoal surfaces,
  hairline structure, one amber accent (#FFA23A) reserved for now/live. Big tight-tracked
  tabular numerals. Radii step from 22px sheets down to 2px data cells. One spring curve.

  STORY: He glances and knows how full he is; a caller names dates and he answers in one
  sentence; he checks a month and sees which weekends are gone.

  FIRST VIEWPORT: Tonight — a 76px free-room count over an occupancy meter, the next
  seven nights as a scroll-snapped strip, then all forty rooms as a tile field.

  FORM: Three concepts the user selected (10 Glance, 6 Month, 9 Word) integrated as one
  app with a blurred bottom tab bar and a shared spring-up room sheet.
-->
<meta charset="utf-8">
<title>Vacancy — 45 apartments, four ways to read them</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#08090C">

<style>
/* ══════════════════════ tokens ══════════════════════ */
:root{
  --bg:#08090C; --surface:#101219; --surface-2:#181B24; --surface-3:#1F2330;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#FFFFFF; --txt-2:#98A1B5; --txt-3:#5C6579;
  --free:#EAEFF9; --free-ink:#0A0C11; --held:#1B1F2A; --held-ink:#69738A;
  --oos:#4E586E;
  --now:#FFA23A; --hot:#FF5F52;
  --bar:rgba(12,14,20,.72);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
  --spring:linear(0,.0088,.0352 2.2%,.1428 4.9%,.5106 12%,.6672,.7896,.8752,.9345 20.6%,.9707,.9955 26.2%,1.0122,1.0202 32.1%,1.0193 37.1%,1.0083 45.4%,1.0003 55.4%,.9986 71%,1);
  --out:cubic-bezier(.22,1,.36,1);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#ECEEF3; --surface-3:#E2E5ED;
    --line:rgba(9,11,16,.10); --line-2:rgba(9,11,16,.16);
    --txt:#0B0D13; --txt-2:#5A6377; --txt-3:#8A93A6;
    --free:#0B0D13; --free-ink:#FFFFFF; --held:#DDE1EA; --held-ink:#98A1B5;
    --oos:#9AA4B6;
    --now:#C96A00; --hot:#D93A2B;
    --bar:rgba(250,251,253,.78);
    --shadow:0 1px 2px rgba(9,11,16,.07), 0 12px 32px -12px rgba(9,11,16,.18);
    --shadow-sm:0 1px 2px rgba(9,11,16,.06), 0 4px 12px -4px rgba(9,11,16,.12);
  }
}
:root[data-theme="light"]{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#ECEEF3; --surface-3:#E2E5ED;
  --line:rgba(9,11,16,.10); --line-2:rgba(9,11,16,.16);
  --txt:#0B0D13; --txt-2:#5A6377; --txt-3:#8A93A6;
  --free:#0B0D13; --free-ink:#FFFFFF; --held:#DDE1EA; --held-ink:#98A1B5;
    --oos:#9AA4B6;
  --now:#C96A00; --hot:#D93A2B;
  --bar:rgba(250,251,253,.78);
  --shadow:0 1px 2px rgba(9,11,16,.07), 0 12px 32px -12px rgba(9,11,16,.18);
  --shadow-sm:0 1px 2px rgba(9,11,16,.06), 0 4px 12px -4px rgba(9,11,16,.12);
}
:root[data-theme="dark"]{
  --bg:#08090C; --surface:#101219; --surface-2:#181B24; --surface-3:#1F2330;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#FFFFFF; --txt-2:#98A1B5; --txt-3:#5C6579;
  --free:#EAEFF9; --free-ink:#0A0C11; --held:#1B1F2A; --held-ink:#69738A;
  --oos:#4E586E;
  --now:#FFA23A; --hot:#FF5F52;
  --bar:rgba(12,14,20,.72);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── press answers instantly; the spring is for the release ───────────────────
   Every control here springs on `transform`, and a spring is a ~380ms curve. Run
   it on the way *down* and the button appears to lag the thumb by a third of a
   second — the single largest reason an app that is fast still feels slow. The
   press is therefore a fast ease and only the release springs back. Same two
   rules, opposite directions, which is how a physical button behaves.        */
.ghost:active, .tabbar button:active, .tile:active, .night:active, .opp:active,
.dcell:active, .line:active, .nudgeBtn:active, .mnav button:active, .day:active,
.field button:active, .copybtn:active, .chips button:active, .step button:active,
.srcRow button:active, .bkgo:active, .paid.due:active, .bookbtn:active,
.blockbtn:active, .invAdd:active, .invSave:active, .pill:active, .gate .go:active,
.rowx:active, .toast:active{
  transition-duration:.085s; transition-timing-function:cubic-bezier(.3,0,.1,1);
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ui);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5; overscroll-behavior:none;
}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--now);outline-offset:2px;border-radius:4px}

/* ══════════════════════ shell ══════════════════════ */
.app{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{
  position:relative;z-index:30;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;
  background:var(--bar);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;gap:0;
}
.topbar-r{display:flex;align-items:center;gap:12px}
/* large title condenses on scroll — transform/opacity only, never layout */
.topbar h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.022em;flex:1;min-width:0;
  transform-origin:left center;transition:transform .2s var(--out);will-change:transform}
.topbar .sub{font-size:12px;color:var(--txt-3);font-weight:450;letter-spacing:0;display:block;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .16s var(--out)}
.topbar.tight h1{transform:scale(.84)}
.topbar.tight .sub{opacity:.5}
@media (prefers-reduced-motion:reduce){.topbar h1,.topbar .sub{transition:none}}
.ghost{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  background:var(--surface-2);font-size:12px;font-weight:550;color:var(--txt-2);
  border:1px solid var(--line);transition:transform .35s var(--spring), background .18s;
}
.ghost:active{transform:scale(.94);background:var(--surface-3)}

.screens{flex:1;min-height:0;position:relative}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:22px 20px calc(112px + var(--safe-b));
  display:flex;flex-direction:column;gap:30px;
  visibility:hidden;opacity:0;pointer-events:none;
}
.screen.on{visibility:visible;opacity:1;pointer-events:auto}
/* a scrolling flex column must not shrink its sections to fit — that clips
   any child with overflow:hidden (the calendar card) down to a sliver */
.screen > *{flex:0 0 auto}

/* ── entry, once ──────────────────────────────────────────────────────────────
   A staggered entrance is a first-impression device. On a tab this operator
   swipes to fifty times a day it stops being polish and becomes a wait: the
   last section used to settle two thirds of a second after the thumb landed.
   So it plays the first time a screen is opened and never again — the class
   below is added after that first paint. Delight belongs to moments, not to
   every arrival.                                                             */
.screen.on:not(.seen) > *{animation:rise .34s var(--out) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.screen.on > *:nth-child(2){animation-delay:.03s}
.screen.on > *:nth-child(3){animation-delay:.06s}
.screen.on > *:nth-child(4){animation-delay:.09s}
.screen.on > *:nth-child(5){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){
  .screen.on > *{animation:fade .2s backwards}
  @keyframes fade{from{opacity:0}}
}

.tabbar{
  position:absolute;left:14px;right:14px;bottom:calc(12px + var(--safe-b));z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;
  background:var(--bar);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--line-2);border-radius:17px;box-shadow:var(--shadow);
}
.tabbar button{
  padding:9px 4px 8px;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--txt-3);font-size:10.5px;font-weight:600;
  letter-spacing:.01em;transition:color .2s, background .3s var(--out);
}
.tabbar button .ic{width:19px;height:19px;display:block}
.tabbar button[aria-selected="true"]{color:var(--txt);background:var(--surface-2)}
.tabbar button:active{transform:scale(.95)}

/* ══════════════════════ primitives ══════════════════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm);overflow:hidden}
.lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 11px}
.sect .lbl:last-child, .sheet-s .lbl:last-child, .strip-k .lbl:not(:first-child){
  text-transform:none;letter-spacing:.005em;font-weight:500;font-size:11.5px}
.stack{display:flex;flex-direction:column}
.gap-l{gap:22px} .gap-m{gap:12px} .gap-s{gap:8px}

/* room tile — the atom of the whole app */
.tile{
  position:relative;border-radius:9px;padding:9px 8px 8px;text-align:left;
  background:var(--held);border:1px solid transparent;
  transition:transform .38s var(--spring), background .2s;
  min-height:56px;display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{transform:scale(.93)}
.tile b{display:block;font-size:13px;font-weight:620;letter-spacing:-.01em;color:var(--held-ink)}
.tile s{display:block;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--held-ink);opacity:.62;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.free{background:var(--free)}
.tile.free b{color:var(--free-ink)}
.tile.free s{color:var(--free-ink);opacity:.58}
/* a turnover room is let tonight — it just has to be cleaned first, so it reads
   as booked and carries a corner flag rather than a split fill that eats the text */
.tile.oos{background:repeating-linear-gradient(135deg,
  var(--held) 0 6px, color-mix(in srgb,var(--held) 55%, var(--bg)) 6px 12px)}
.tile.oos b, .tile.oos s{color:var(--held-ink)}
.tile.oos s{opacity:.9}
.tile.turn{background:var(--held)}
.tile.turn b{color:var(--held-ink)}
.tile.turn s{color:var(--now);opacity:1}
.tile.turn::after{content:"";position:absolute;top:0;right:0;width:17px;height:17px;
  background:var(--now);clip-path:polygon(100% 0,0 0,100% 100%);border-top-right-radius:9px}
/* an orphan night — free, but wedged between two bookings, so hard to sell */
.tile .flag{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;
  background:var(--now);box-shadow:0 0 0 2px var(--free)}

/* stay-length dial — reshapes the whole fortnight */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;background:var(--surface);
  border-radius:9px;box-shadow:var(--shadow-sm);transition:transform .44s var(--spring);
  pointer-events:none}
.seg button{position:relative;z-index:1;padding:9px 2px;font-size:12.5px;font-weight:600;
  letter-spacing:-.008em;color:var(--txt-3);transition:color .22s}
.seg button[aria-pressed="true"]{color:var(--txt)}
@media (prefers-reduced-motion:reduce){.seg-ind{transition:none}}

/* month key */
.key{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.keyitem{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-2);line-height:1.4}
.keychip{flex:0 0 auto;width:34px;height:38px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);position:relative;display:grid;place-items:center}
.keychip u{text-decoration:none;font-size:15px;font-weight:680;letter-spacing:-.03em}
.keychip i{position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:2px;background:var(--surface-3)}
.keychip i b{display:block;height:100%;width:58%;border-radius:2px;background:var(--free)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;
  font-size:11px;font-weight:600;letter-spacing:.01em;background:var(--surface-2);color:var(--txt-2);
  border:1px solid var(--line);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--free) 14%,transparent);color:var(--txt);border-color:var(--line-2)}
.pill.warn{background:color-mix(in srgb,var(--hot) 15%,transparent);color:var(--hot);border-color:transparent}
.pill.now{background:color-mix(in srgb,var(--now) 16%,transparent);color:var(--now);border-color:transparent}

/* room list row, shared by Month + Ask + sheet */
.row{display:grid;grid-template-columns:60px 1fr auto;gap:11px;align-items:center;
  padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;
  transition:background .16s}
.row:last-child{border-bottom:0}
/* A booking row carries money, which is wide, so it drops the separate date
   column — the dates are already spelled out on the second line, and the guest's
   name is what the eye is actually hunting for. */
.row.bk{grid-template-columns:1fr auto}
.row.bk .meta b{font-size:13.5px;font-weight:620;color:var(--txt);letter-spacing:-.015em}
.row:active{background:var(--surface-2)}
.row .id{font-size:13.5px;font-weight:640;letter-spacing:-.02em;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--txt-2);line-height:1.35;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.move .meta em{white-space:normal;line-height:1.4}
.row.move{align-items:flex-start}
.row.move .id, .row.move .pill{margin-top:2px}
.row .meta b{color:var(--txt);font-weight:560}
.row .meta em{font-style:normal;display:block;color:var(--txt-3);font-size:11.5px;margin-top:2px}

.empty{padding:30px 20px;text-align:center;color:var(--txt-3);font-size:13px;line-height:1.55}

/* ══════════════════════ TONIGHT ══════════════════════ */
/* the day's operations — what actually has to happen, not another copy of the free count */
.ops{padding:2px 2px 0}
.ops-date{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.ops-date b{font-size:23px;font-weight:680;letter-spacing:-.032em}
.ops-date s{text-decoration:none;font-size:12.5px;color:var(--txt-3);font-weight:500}
.ops-row{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.op{padding:14px 8px 13px;text-align:left;position:relative;border-right:1px solid var(--line);
  transition:background .16s}
.op:last-child{border-right:0}
.op:active{background:var(--surface-2)}
.op b{display:block;font-size:30px;font-weight:690;letter-spacing:-.04em;line-height:1}
.op s{display:block;text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.055em;
  text-transform:uppercase;color:var(--txt-3);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op.zero b{color:var(--txt-3)}
.op.alert b{color:var(--now)}
.op.alert s{color:var(--now)}
.op .dot{position:absolute;top:12px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--now)}

.nights{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 20px 2px 0;margin:0 -20px 0 0;scrollbar-width:none}
.nights::-webkit-scrollbar{display:none}
.night{flex:0 0 78px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:10px 10px 11px;display:flex;flex-direction:column;gap:9px;
  transition:transform .38s var(--spring)}
.night:active{transform:scale(.95)}
.night .d{display:flex;align-items:baseline;justify-content:space-between;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-3)}
.night .d em{font-style:normal;font-size:11.5px;font-weight:650;letter-spacing:-.01em;
  text-transform:none;color:var(--txt-2);flex:0 0 auto}
.night.today .d em{color:var(--now)}
.night .n{font-size:25px;font-weight:680;letter-spacing:-.035em;line-height:1}
.night .t{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.night .t i{display:block;height:100%;background:var(--free);border-radius:2px}
.night.today{border-color:color-mix(in srgb,var(--now) 55%,transparent);
  background:color-mix(in srgb,var(--now) 8%,var(--surface))}
.night.today .d{color:var(--now)}
.night.full .n{color:var(--hot)}
.night.full .t i{background:var(--hot)}
.night.sel{border-color:var(--free);box-shadow:0 0 0 1px var(--free)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}

/* ══════════════════════ MONTH — perspective panels ══════════════════════ */
.monthbar{margin:-4px 2px 14px}
.mbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar i.sold{background:var(--free)}
.mbar i.soon{background:var(--now)}
.mcap{margin-top:8px;font-size:12px;color:var(--txt-3);line-height:1.45}
.mcap b{color:var(--txt);font-weight:650}
.mcap em{font-style:normal;color:var(--now)}

/* a date running emptier than its own weekday usually does */
.day.soft .fn{color:var(--now)}
.day.soft .gg i{background:var(--now)}
.day.soft::after{content:"";position:absolute;top:6px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--now)}

/* ══════════════════════ TRENDS — swipeable card deck ══════════════════════ */
/* A vertical stack, not a carousel. Horizontal decks hide their contents behind
   a gesture with no preview — you cannot tell what is there or how much. On a
   phone, vertical scroll is the native, discoverable motion; nothing hides. */
.deck{display:flex;flex-direction:column;gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:15px 14px 14px;display:flex;flex-direction:column;
  transition:opacity .3s var(--out), transform .34s var(--out)}
.tcard.pending{opacity:0;transform:translateY(12px)}
@media (prefers-reduced-motion:reduce){
  .tcard.pending{opacity:1;transform:none}
  .tcard{transition:none}
}
.tcard h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.018em}
.tcard .cap{margin:3px 0 12px;font-size:11.5px;color:var(--txt-3);letter-spacing:.01em}
.tcard .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.tcard .body > .act:first-child{border-top:0}
.tcard .said{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--txt-2)}
.tcard .said b{color:var(--txt)}
.tcard .said .hi{color:var(--now);font-weight:600}
/* bars grow from nothing as their section arrives — transform only, no layout */
.vbar .col i, .patrow .t i{transition:transform .42s var(--out)}
.vbar .col i{width:100%;transform-origin:bottom;transform:scaleY(var(--v,1))}
.patrow .t i{width:100%;transform-origin:left center;transform:scaleX(var(--v,1))}
.tcard.pending .vbar .col i{transform:scaleY(0)}
.tcard.pending .patrow .t i{transform:scaleX(0)}
@media (prefers-reduced-motion:reduce){
  .tcard.pending .vbar .col i{transform:scaleY(var(--v,1))}
  .tcard.pending .patrow .t i{transform:scaleX(var(--v,1))}
  .vbar .col i, .patrow .t i{transition:none}
}

/* opportunity tiles — a number and a label; the detail lives one tap away */
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;
  box-shadow:var(--shadow-sm);transition:transform .38s var(--spring)}
.opp:active{transform:scale(.96)}
.opp b{font-size:27px;font-weight:700;letter-spacing:-.04em;line-height:1}
.opp s{text-decoration:none;font-size:11px;color:var(--txt-2);line-height:1.3}
.opp.hot b{color:var(--now)}
.opp.zero b{color:var(--txt-3)}
.opp.zero s{color:var(--txt-3)}

/* When there is genuinely nothing to act on, one quiet line beats an empty
   card. It still confirms the check happened — silence alone is ambiguous. */
.allclear{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm)}
.allclear .tick{flex:0 0 auto;width:18px;height:18px;border-radius:50%;
  background:color-mix(in srgb,var(--free) 18%,transparent);display:grid;place-items:center;
  color:var(--free);font-size:11px;font-weight:700;margin-top:1px}
.allclear div{font-size:12.5px;line-height:1.5;color:var(--txt-2)}
.allclear b{color:var(--txt);font-weight:600}

/* ── the board ───────────────────────────────────────────────────────────────
   Grouped by the response each thing needs, so a decision never looks like a
   discount idea, and extra items thicken a figure instead of adding a row. */
.board{display:flex;flex-direction:column;gap:13px}
.bsec{display:flex;flex-direction:column;gap:6px}
.bsec > .lbl{margin:0 2px}

/* DECIDE — a question with its answers attached */
.decide{padding:12px 13px;border-radius:13px;
  background:color-mix(in srgb,var(--hot) 7%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--hot) 26%,transparent)}
.decide > b{display:block;font-size:14px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.decide > s{display:block;text-decoration:none;font-size:11.5px;color:var(--txt-2);
  margin-top:3px;line-height:1.4}

/* PERISHING — figures side by side, not two list rows saying the same thing */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcell{padding:11px 11px 10px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;
  transition:transform .38s var(--spring)}
.dcell:active{transform:scale(.96)}
.dcell .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}
.dcell .n{font-size:26px;font-weight:700;letter-spacing:-.045em;line-height:1.05}
.dcell .s{font-size:11px;color:var(--txt-2);line-height:1.35}
.dcell .d{margin-top:6px;align-self:flex-start;font-size:11px;font-weight:650;color:var(--now);
  background:color-mix(in srgb,var(--now) 15%,transparent);padding:3px 8px;border-radius:7px}
.dcell.urgent{border-color:color-mix(in srgb,var(--now) 38%,transparent);
  background:color-mix(in srgb,var(--now) 7%,var(--surface-2))}
.dcell.urgent .n{color:var(--now)}

/* one-line rows for everything that is simply a count with a destination */
.line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);width:100%;text-align:left;
  transition:transform .38s var(--spring)}
.line:active{transform:scale(.98)}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:13px;font-weight:620;letter-spacing:-.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .t s{display:block;text-decoration:none;font-size:11px;color:var(--txt-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .chev{flex:0 0 auto;color:var(--txt-3);font-size:16px;line-height:1}

/* the advert summary — what you have to sell, in words a guest understands */
.advert{margin:16px 20px 0;padding:15px 16px 16px;border-radius:15px;
  background:color-mix(in srgb,var(--now) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--now) 28%,transparent)}
.advert-head{font-size:19px;font-weight:680;letter-spacing:-.025em;color:var(--now);margin:5px 0 12px}
.advert-list{display:flex;flex-direction:column;gap:8px}
.advert-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.advert-row b{font-size:14px;font-weight:620;letter-spacing:-.012em;white-space:nowrap;flex:0 0 auto}
.advert-row s{text-decoration:none;font-size:12.5px;color:var(--txt-2);text-align:right;min-width:0}

/* the action feed — what to do, above everything you have to interpret */
.act{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;
  border-bottom:1px solid var(--line);width:100%;text-align:left}
.act:last-child{border-bottom:0}
.act:active{background:var(--surface-2)}
.act .mark{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--txt-3);margin-top:5px}
.act.warn .mark{background:var(--hot)}
.act.good .mark{background:var(--now)}
.act .txt{flex:1;min-width:0}
.act > .pill{flex:0 0 auto;margin-top:2px}
.act .txt b{display:block;font-size:13.5px;font-weight:620;letter-spacing:-.012em;line-height:1.35;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .txt s{text-decoration:none;font-size:11.5px;color:var(--txt-3);
  line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.nudge{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}

/* days slider — drag to choose how much longer the flat stays out */
.exts{margin-top:10px;padding:10px 12px 9px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line)}
.exts-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.exts-head b{font-size:11.5px;font-weight:600;color:var(--txt-2);letter-spacing:.01em}
.exts-head u{text-decoration:none;font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--now)}
.slider{position:relative;height:34px;touch-action:none;-webkit-user-select:none;user-select:none}
.slider .track{position:absolute;left:13px;right:13px;top:50%;height:6px;margin-top:-3px;
  border-radius:3px;background:var(--surface-3);overflow:hidden}
.slider .track i{position:absolute;inset:0;border-radius:3px;transform-origin:left center;
  background:linear-gradient(90deg, color-mix(in srgb,var(--now) 45%,transparent), var(--now))}
.slider .thumb{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;
  border-radius:50%;background:var(--free);display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.18);
  transition:transform .2s var(--out)}
.slider .thumb::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--now)}
.slider.drag .thumb{transform:scale(1.18)}
.slider .ticks{position:absolute;left:13px;right:13px;top:50%;margin-top:9px;
  display:flex;justify-content:space-between;pointer-events:none}
.slider .ticks span{font-size:9.5px;color:var(--txt-3);font-weight:600}
.exts-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.exts-when{font-size:11.5px;color:var(--txt-3);line-height:1.3}
.exts-when b{color:var(--txt-2);font-weight:600}
@media (prefers-reduced-motion:reduce){.slider .thumb{transition:none}}
.nudgeBtn{padding:7px 11px;border-radius:9px;background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--txt-2);
  transition:transform .3s var(--out)}
.nudgeBtn:active{transform:scale(.95)}
.nudgeBtn.yes{background:var(--free);color:var(--free-ink);border-color:transparent}

.headline{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.headline b{font-size:clamp(30px,9.5vw,40px);font-weight:700;letter-spacing:-.04em;line-height:.9}
.headline s{text-decoration:none;font-size:12.5px;color:var(--txt-2);line-height:1.4}

/* vertical bar chart used by the booking curve and turnaround load */
.vbars{display:flex;gap:5px;align-items:flex-end;height:132px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;
  justify-content:flex-end}
.vbar .col{width:100%;background:var(--surface-2);border-radius:5px;display:flex;
  align-items:flex-end;overflow:hidden;flex:1}
.vbar .col i{display:block;width:100%;background:var(--free);border-radius:5px}
.vbar.acc .col i{background:var(--now)}
.vbar .v{font-size:10.5px;font-weight:650;color:var(--txt-2)}
.vbar .k{font-size:9.5px;font-weight:600;color:var(--txt-3);white-space:nowrap}
.vbar.acc .v,.vbar.acc .k{color:var(--now)}

/* pattern bars, shared by weekday and building */
.pat{display:flex;flex-direction:column;gap:9px;padding:14px 16px}
.patrow{display:grid;grid-template-columns:74px 1fr 38px;gap:10px;align-items:center}
.patrow .k{font-size:12px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patrow .t{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.patrow .t i{display:block;height:100%;background:var(--free);border-radius:5px}
.patrow .v{font-size:12px;font-weight:640;text-align:right;color:var(--txt-2)}
.patrow.low .t i{background:var(--now)}
.patrow.low .k, .patrow.low .v{color:var(--now)}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 16px 6px;align-items:end}
.wkcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.wkcol .bar{width:100%;height:56px;background:var(--surface-2);border-radius:5px;
  display:flex;align-items:flex-end;overflow:hidden}
.wkcol .bar i{display:block;width:100%;background:var(--free);border-radius:5px}
.wkcol.low .bar i{background:var(--now)}
.wkcol .d{font-size:10px;font-weight:600;color:var(--txt-3)}
.wkcol .p{font-size:10.5px;font-weight:650;color:var(--txt-2)}
.wkcol.low .p, .wkcol.low .d{color:var(--now)}
.insight{padding:0 16px 14px;font-size:12.5px;line-height:1.55;color:var(--txt-2);margin:0}
.insight b{color:var(--txt)}
.insight .hi{color:var(--now);font-weight:600}

/* ══════════════════════ MONTH ══════════════════════ */
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
/* the month's fullness, riding in the title row instead of owning a section */
.mnav .msum{flex:1 0 100%;order:3;font-size:12px;color:var(--txt-3);
  margin-top:-4px;letter-spacing:-.005em}
.mnav .t{flex:1;font-size:17px;font-weight:640;letter-spacing:-.02em}
.mnav button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;
  transition:transform .38s var(--spring)}
.mnav button:active{transform:scale(.9)}
.mnav button[disabled]{opacity:.32;pointer-events:none}

.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{text-align:center;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--txt-3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{
  aspect-ratio:1/1.14;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  padding:7px 6px 12px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
  transition:transform .38s var(--spring), border-color .2s;
}
.day:active{transform:scale(.92)}
.day.pad{background:transparent;border-color:transparent;pointer-events:none}
.day .dd{font-size:10px;font-weight:600;color:var(--txt-3);line-height:1}
.day .fn{font-size:clamp(16px,4.8vw,21px);font-weight:680;letter-spacing:-.035em;line-height:1}
.day .gg{position:absolute;left:6px;right:6px;bottom:6px;height:3px;border-radius:2px;
  background:var(--surface-3);overflow:hidden}
.day .gg i{display:block;height:100%;background:var(--free);border-radius:2px}
.day.today{border-color:color-mix(in srgb,var(--now) 60%,transparent)}
.day.today .dd{color:var(--now)}
.day.none .fn{color:var(--hot)}
.day.none .gg i{background:var(--hot)}
.day.sel{border-color:var(--free);box-shadow:0 0 0 1px var(--free), var(--shadow-sm)}

/* press-and-hold, then sweep across dates to pick a stay */
.cal{touch-action:pan-y}
.cal.sweeping{touch-action:none}
.day.rng{background:color-mix(in srgb,var(--free) 17%,var(--surface));
  border-color:color-mix(in srgb,var(--free) 42%,transparent)}
.day.rngA, .day.rngB{background:var(--free);border-color:transparent}
.day.rngA .dd, .day.rngB .dd{color:color-mix(in srgb,var(--free-ink) 62%,transparent)}
.day.rngA .fn, .day.rngB .fn{color:var(--free-ink)}
.day.rngA .gg, .day.rngB .gg{background:color-mix(in srgb,var(--free-ink) 18%,transparent)}
.day.rngA .gg i, .day.rngB .gg i{background:var(--free-ink)}
.day.rng .fn, .day.rngA .fn, .day.rngB .fn{transition:none}

/* takes no layout until a sweep starts, or it leaves a hole in the page */
.hud{display:none}
.hud.on{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;
  margin:0 2px 12px;padding:11px 14px;border-radius:13px;
  background:var(--bar);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line-2);box-shadow:var(--shadow);pointer-events:none;
  animation:hudIn .3s var(--out)}
@keyframes hudIn{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.hud.on{animation:none}}
.hud .n{font-size:24px;font-weight:690;letter-spacing:-.035em;line-height:1}
.hud .n.none{color:var(--hot)}
.hud .t{font-size:12px;color:var(--txt-2);line-height:1.4}
.hud .t b{color:var(--txt);font-weight:600}
.sweephint{font-size:11.5px;color:var(--txt-3);margin:8px 2px 0;line-height:1.5}
.sweephint b{color:var(--txt-2);font-weight:600}

/* ══════════════════════ ASK ══════════════════════ */
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:14px;padding:4px 4px 4px 15px;box-shadow:var(--shadow-sm);
  transition:border-color .2s}
.field:focus-within{border-color:color-mix(in srgb,var(--now) 65%,transparent)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;padding:13px 0;font-size:16px;
  font-weight:450;letter-spacing:-.011em}
.field input::placeholder{color:var(--txt-3)}
.field button:active{transform:scale(.93)}
/* one slot: paste into an empty box, clear a full one */
.field button.slot{width:38px;height:38px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--txt-2);flex:0 0 auto;
  transition:transform .38s var(--spring), background .2s, color .2s}
.field button.slot:active{transform:scale(.9);transition-duration:.085s;color:var(--txt)}
.field button.slot[hidden]{display:none}
.field button.mic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--txt-2);flex:0 0 auto;
  transition:transform .38s var(--spring), background .2s, color .2s}
.field.hear button.mic{background:var(--now);color:#12100c;border-color:transparent;
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 55%,transparent)}
  60%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.field.hear button.mic{animation:none}}

.copybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copybtn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;
  color:var(--txt-2);transition:transform .38s var(--spring), color .2s, background .2s}
.copybtn:active{transform:scale(.95)}
.copybtn.done{background:var(--free);color:var(--free-ink);border-color:transparent}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chips button{padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-size:12.5px;font-weight:500;color:var(--txt-2);transition:transform .38s var(--spring), color .18s}
.chips button:active{transform:scale(.94);color:var(--txt)}
/* what was asked here before — quieter than the standing suggestions */
.chips.recent{margin-top:9px;align-items:center}
.chips.recent .reclbl{font-size:10.5px;font-weight:600;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.08em;margin-right:1px}
.chips.recent button{background:none;border-color:var(--line);color:var(--txt-3);font-weight:520}

.answer{font-size:22px;font-weight:600;letter-spacing:-.028em;line-height:1.32;margin:0}
.answer b{font-weight:700}
.answer .y{color:var(--free)}
.answer .n{color:var(--hot)}
.heard{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}

/* ══════════════════════ room sheet ══════════════════════ */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .3s var(--out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:86%;
  background:var(--surface);border:1px solid var(--line-2);border-bottom:0;
  border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .42s var(--spring);
}
.sheet.on{transform:translateY(0)}
.grab{padding:9px 0 3px;display:grid;place-items:center;flex:0 0 auto;touch-action:none;cursor:grab}
.grab i{width:38px;height:4px;border-radius:2px;background:var(--line-2);display:block}
.sheet-h{padding:6px 20px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:flex-start;gap:12px}
.sheet-h .n{font-size:24px;font-weight:680;letter-spacing:-.03em;line-height:1.1}
.sheet-h .m{font-size:12.5px;color:var(--txt-2);margin-top:3px}
.sheet-h button{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--txt-2);flex:0 0 auto}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(20px + var(--safe-b))}
/* ── the nine-week strip ──────────────────────────────────────────────────────
   Nine weeks of one flat, one bar a night. Held back from being decoration by
   three things: blocked nights read differently from sold ones, months are
   grouped so the eye has a landmark, and you can put a finger on it and read
   any single night without the strip changing size or the sheet moving.     */
.stripwrap{position:relative;touch-action:pan-y}
/* height is the BORDER box here, so the 16px of padding was eating most of it —
   the bars have quietly been six pixels tall. Given that this is a thing you put
   a finger on and drag, they get room to be read. */
.strip{display:flex;gap:1px;height:46px;padding:14px 20px 0}
.strip i{flex:1;border-radius:1px;background:var(--held);transform-origin:bottom;
  transition:transform .2s var(--out)}
.strip i.f{background:var(--free)}
/* ── the third state ──────────────────────────────────────────────────────────
   Out of service was drawn in --surface-3, four points of luminance away from
   --held: at four pixels wide that is not a distinction, it is the same bar. It
   now takes a tone of its own AND half the height, anchored to the floor, so it
   reads as a notch in the run rather than a shade of it — because colour alone
   must never be the only thing carrying a state, and at this size it could not
   carry one anyway. */
.strip i.b{background:var(--oos);align-self:flex-end;height:52%}
.strip i.td{box-shadow:inset 0 0 0 1px var(--now)}
/* where one stay ends and the next begins — two back-to-back bookings used to
   draw as one unbroken run, hiding every turnover in the month */
.strip i.edge{box-shadow:inset 1px 0 0 var(--bg)}
.strip i.b.edge{box-shadow:inset 1px 0 0 var(--bg)}

/* the touched night lifts; the whole stay or gap it belongs to lifts with it,
   a little less, so you are shown the span and not the pixel */
.strip i.span{transform:scaleY(1.22)}
.strip i.on{transform:scaleY(1.38)}
.strip i.b.span{transform:scaleY(1.15)}
.strip i.b.on{transform:scaleY(1.35)}

/* the bars arrive from the floor, fast and once per opening */
@keyframes barRise{from{transform:scaleY(.08);opacity:.4}}
.stripwrap.fresh .strip i{animation:barRise .2s var(--out) backwards}
@media (prefers-reduced-motion:reduce){ .stripwrap.fresh .strip i{animation:none} }
@media (prefers-reduced-motion:reduce){ .strip i.on{transform:none} }

/* a playhead, not a highlight: recolouring a booked bar is forbidden here, and
   a cursor says "you are reading this night" without touching the data */
.playhead{position:absolute;top:10px;height:40px;width:1px;background:var(--now);
  opacity:0;transition:opacity .15s;pointer-events:none;left:0}
.stripwrap.reading .playhead{opacity:1}

/* the legend and the readout share one box, so reading a night moves nothing */
.strip-foot{position:relative;padding:7px 20px 16px;min-height:33px}
.strip-k{display:flex;justify-content:space-between;transition:opacity .16s}
.strip-read{position:absolute;left:20px;right:20px;top:7px;display:flex;gap:7px;
  align-items:baseline;opacity:0;pointer-events:none;transition:opacity .16s}
.strip-read b{font-size:12px;font-weight:660;color:var(--txt);white-space:nowrap}
.strip-read span{font-size:12px;color:var(--txt-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.strip-foot.reading .strip-k{opacity:0}
.strip-foot.reading .strip-read{opacity:1}
/* the booking this night belongs to, lit in the list below */
.card .row.lit{background:var(--surface-2)}
.sheet-s{padding:14px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* ── a chart that answers back ────────────────────────────────────────────────
   The readout lives in a slot that is already there, so touching a bar never
   pushes the cards below it down the page.                                    */
.vwrap{display:flex;flex-direction:column}
/* 0fr → 1fr rather than a height: the browser resolves it on the compositor,
   so the cards below never thrash while it opens */
.vsay{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .26s var(--out), opacity .2s var(--out)}
.vsay > .vsay-in{overflow:hidden;min-height:0}
.vwrap.telling .vsay{grid-template-rows:1fr;opacity:1}
.vwrap.telling .vsay > .vsay-in{padding-top:11px}
.vsay-l{font-size:12.5px;line-height:1.5;color:var(--txt-2)}
.vsay-l b{color:var(--txt);font-weight:640}
.vsay-go{
  margin-top:7px;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:640;
  color:var(--now);background:color-mix(in srgb,var(--now) 14%,transparent);
  transition:transform .3s var(--spring);
}
.vsay-go:active{transform:scale(.94);transition-duration:.085s}
/* the touched bar lifts out of the row rather than recolouring, because colour
   on a data cell already means something here */
.vbar{transition:transform .28s var(--spring), opacity .2s}
button.vbar{background:none;border:none;padding:0;font:inherit;color:inherit}
.vwrap.telling .vbar{opacity:.45}
.vbar.on{opacity:1;transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){ .vbar,.vsay{transition:none} }

/* ── the Pulse segment bar, which lives in the header ─────────────────────────
   It used to be a sticky element inside the scrolling area, and every version of
   that was wrong in the same way: a strip of page background parked under the
   title, reading as a black band with content sliding behind it. Sticky also
   resolves against the scroll container's PADDING box, so the screen's 22px was
   a floor no margin could cross.

   None of that is a styling problem. The bar is CHROME — it does not scroll, it
   is always true, and it belongs to the header. Put it there and the sticky
   maths, the gradient, the z-index and the band all stop existing. It inherits
   the header's own blurred material for free.                                 */
.tabseg{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:11px -20px 0;padding:0 20px 1px;
}
.tabseg[hidden]{display:none}
.tabseg::-webkit-scrollbar{display:none}
.tabseg button{
  position:relative;flex:0 0 auto;padding:8px 13px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--txt-3);white-space:nowrap;
  transition:transform .38s var(--spring), background .18s, color .18s;
}
.tabseg button:active{transform:scale(.95);transition-duration:.085s}
.tabseg button[aria-selected="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
/* something is waiting under Now — the only badge in the app, so it means it */
.tabseg button i.dot{
  position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;
  background:var(--now);
}
.tabseg button[aria-selected="true"] i.dot{background:var(--free-ink);opacity:.55}
/* the title row condenses on scroll; the chips ride with it rather than jumping */
.topbar.tight .tabseg{margin-top:8px}

@keyframes segIn{from{opacity:0;transform:translateX(var(--from,20px))}}
.deck.slide{animation:segIn .26s var(--out) both}
@media (prefers-reduced-motion:reduce){ .deck.slide{animation:none} }
.deck{will-change:transform}

/* ── the room card ────────────────────────────────────────────────────────────
   Opening a room reads. One primary action sized to say "this is what you came
   for", two small routes to the things that write, and then the lists. Every
   form that used to live here now has a screen of its own.                    */
.roomAct{padding:16px 20px 4px;display:flex;flex-direction:column;gap:9px}
.bigAct{
  width:100%;padding:15px 16px;border-radius:14px;border:none;
  background:var(--free);color:var(--free-ink);font-family:var(--ui);
  font-size:16px;font-weight:670;letter-spacing:-.02em;text-align:left;
  display:flex;flex-direction:column;gap:2px;
  transition:transform .38s var(--spring);
}
.bigAct:active{transform:scale(.985);transition-duration:.085s}
.bigAct s{text-decoration:none;font-size:12px;font-weight:520;opacity:.62}
.actWhy{
  padding:13px 15px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--txt-2);
}
.actWhy b{color:var(--txt);font-weight:640}
/* the two things that write, given equal and deliberately modest weight */
.roomRoutes{display:flex;gap:9px}
.roomRoutes button{
  flex:1;min-width:0;padding:11px 12px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--ui);font-size:13px;font-weight:600;color:var(--txt);
  display:flex;flex-direction:column;gap:1px;text-align:left;
  transition:transform .38s var(--spring), background .18s;
}
.roomRoutes button:active{transform:scale(.96);transition-duration:.085s;background:var(--surface-3)}
.roomRoutes button s{text-decoration:none;font-size:11px;font-weight:500;color:var(--txt-3)}
.rowMore{padding:11px 14px;font-size:12px;color:var(--txt-3);border-top:1px solid var(--line)}

/* a stepper that has to hold a date, so it gets the room a number does not need */
.stepWide{display:flex;align-items:center;gap:0;padding:0 4px;flex:1;min-width:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
.stepWide button{width:38px;height:44px;font-size:20px;font-weight:400;color:var(--txt-2);
  background:none;border:none;transition:transform .3s var(--spring)}
.stepWide button:active{transform:scale(.86);transition-duration:.085s}
.stepWide button[disabled]{opacity:.3}
.stepWide b{flex:1;text-align:center;font-size:14px;font-weight:620;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the running consequence of the two steppers above it */
.bkstate{font-size:12.5px;line-height:1.45;color:var(--txt-3);padding:0 2px;margin-top:-2px}
.bkstate.bad{color:var(--hot)}
.bkgo[disabled]{opacity:.45}

/* ── taking a booking ─────────────────────────────────────────────────────────
   Phone first, because it is identity: type it and a returning guest names
   himself. Everything below it arrives pre-filled, so the common booking is
   still two touches — the number, and Book.                                  */
.bkform{margin:14px 20px 0;display:flex;flex-direction:column;gap:8px}
.bkform input{width:100%;padding:12px 13px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--txt);font-family:var(--ui);
  font-size:16px;   /* 16px or iOS zooms the whole page on focus */
  transition:border-color .18s, background .18s}
.bkform input:focus{outline:none;border-color:var(--line-2);background:var(--surface-3)}
.bkform input::placeholder{color:var(--txt-3)}
/* captions sit above the pair and line up with them, so neither number has to
   be guessed at */
.bkcap{display:flex;gap:8px;margin:2px 0 -3px;font-size:10.5px;font-weight:640;
  color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em}
.bkcap span:first-child{flex:1;min-width:0}
.bkcap span:last-child{flex:0 0 120px;text-align:center}
.bkrow{display:flex;gap:8px}
.bkamt{position:relative;flex:1;min-width:0}
.bkamt s{position:absolute;left:13px;top:50%;transform:translateY(-50%);text-decoration:none;
  font-size:15px;color:var(--txt-3);pointer-events:none}
.bkamt input{padding-left:27px}
/* a stepper, because nobody should open a keyboard to say "two people" */
.step{display:flex;align-items:center;gap:0;padding:0 4px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:11px;flex:0 0 120px}
/* the same control, but it has a whole row to itself and a word in it */
.step.nightStep{flex:1 1 auto;width:100%}
.step.nightStep b{font-size:14px;letter-spacing:-.01em}
.step button{width:36px;height:44px;font-size:20px;font-weight:400;color:var(--txt-2);
  background:none;border:none;transition:transform .3s var(--spring)}
.step button:active{transform:scale(.86)}
.step button[disabled]{opacity:.3}
.step b{flex:1;text-align:center;font-size:15px;font-weight:620}
.srcRow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.srcRow::-webkit-scrollbar{display:none}
.srcRow button{flex:0 0 auto;padding:8px 12px;border-radius:9px;background:var(--surface-2);
  border:1px solid var(--line);font-size:12.5px;font-weight:560;color:var(--txt-2);
  white-space:nowrap;transition:transform .3s var(--spring), background .18s, color .18s}
.srcRow button:active{transform:scale(.95)}
.srcRow button[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.bkgo{width:100%;padding:14px;border-radius:11px;border:none;background:var(--free);
  color:var(--free-ink);font-family:var(--ui);font-size:15px;font-weight:650;
  transition:transform .35s var(--spring)}
.bkgo:active{transform:scale(.98)}
/* the payoff of storing the number: he names himself on the second visit */
.bkback{font-size:12px;font-weight:560;color:var(--now);padding:0 2px}

/* Money on a booking row — three states, never two. Only the one that needs a
   hand is loud; a settled booking should cost the eye nothing on the way past. */
.paid{font-size:11px;font-weight:620;padding:5px 9px;border-radius:8px;white-space:nowrap;
  border:1px solid transparent;transition:transform .3s var(--spring)}
.paid.due{background:color-mix(in srgb,var(--now) 16%,transparent);color:var(--now);
  border-color:color-mix(in srgb,var(--now) 34%,transparent)}
.paid.due:active{transform:scale(.94)}
.paid.plat{background:var(--surface-2);color:var(--txt-3);font-weight:560}
.paid.clear{background:transparent;color:var(--txt-3);font-weight:560}

/* booking entry */
.book{margin:16px 20px 0;display:flex;gap:8px;align-items:stretch}
.book input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;font-size:15px;outline:none;color:var(--txt);
  transition:border-color .2s}
.book input:focus{border-color:color-mix(in srgb,var(--now) 60%,transparent)}
.book input::placeholder{color:var(--txt-3)}
.bookbtn{background:var(--free);color:var(--free-ink);border-radius:11px;padding:12px 15px;
  font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;flex:0 0 auto;
  transition:transform .38s var(--spring)}
.bookbtn:active{transform:scale(.94)}
.blockbtn{margin:10px 20px 0;width:calc(100% - 40px);padding:11px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;
  color:var(--txt-2);transition:transform .38s var(--spring)}
.blockbtn:active{transform:scale(.97)}
.blocked{margin:16px 20px 0;padding:13px 15px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--txt-2)}
.blocked b{color:var(--txt)}

/* two-tap destructive confirm — no modal, no accidental deletes */
.rowx{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--txt-3);
  background:var(--surface-2);border:1px solid var(--line);flex:0 0 auto;font-size:15px;
  transition:background .2s, color .2s}
.rowx.arm{width:auto;padding:0 11px;background:var(--hot);color:#fff;border-color:transparent;
  font-size:12px;font-weight:650}
.rowend{display:flex;align-items:center;gap:8px}

.dataTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* inventory editor */
.invHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:16px 20px 8px;position:sticky;top:0;background:var(--surface);z-index:2}
.invHead b{font-size:14px;font-weight:650;letter-spacing:-.015em}
.invAdd{font-size:12px;font-weight:600;color:var(--now);padding:5px 9px;border-radius:8px;
  background:color-mix(in srgb,var(--now) 14%,transparent);white-space:nowrap}
.invAdd:active{transform:scale(.94)}
.invRow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.invRow:last-child{border-bottom:0}
.invRow:active{background:var(--surface-2)}
.invRow .fid{font-size:14px;font-weight:640;letter-spacing:-.02em}
.invRow .fty{font-size:12px;color:var(--txt-2)}
.invRow .fbk{font-size:11px;color:var(--txt-3)}
.invForm{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  background:var(--surface-2)}
.invForm .r{display:flex;gap:8px}
.invForm input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line-2);
  border-radius:10px;padding:11px 12px;font-size:15px;color:var(--txt);outline:none}
.invForm input:focus{border-color:color-mix(in srgb,var(--now) 60%,transparent)}
.invForm input::placeholder{color:var(--txt-3)}
.tyRow{display:flex;gap:6px;flex-wrap:wrap}
.tyRow button{padding:8px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--txt-2)}
.tyRow button[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.invActs{display:flex;gap:8px;align-items:center}
.invSave{flex:1;background:var(--free);color:var(--free-ink);border-radius:10px;padding:11px;
  font-size:13px;font-weight:650}
.invSave:active{transform:scale(.97)}
.invDel{padding:11px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--txt-2)}
.invDel.arm{background:var(--hot);color:#fff;border-color:transparent}
.invWarn{font-size:12px;color:var(--hot);line-height:1.45}

@media (prefers-reduced-motion:reduce){
  .sheet{transition:transform .01s}
  *{scroll-behavior:auto!important}
}
/* ── account, sync state and conflicts ───────────────────────────────────────
   The pill in the top bar is never allowed to flatter the truth: it says
   whether this is the sample book or the real one, and whether what you just
   typed has actually reached the server. An operator who thinks a booking
   saved when it did not will sell the room twice.                            */
.pill{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--txt-2);letter-spacing:.01em;
  transition:transform .35s var(--spring), background .18s;white-space:nowrap;
}
.pill:active{transform:scale(.94)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--txt-3);flex:0 0 auto}
.pill.live i{background:#3FBF6A}
.pill.wait i{background:var(--now)}
.pill.off  i{background:var(--hot)}
/* the queue depth is the honest bit — it counts what has not landed yet */
.pill.wait, .pill.off{color:var(--txt)}

/* toast — a conflict is news, not an error, so it reads as a sentence */
.toasts{
  position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 16px;pointer-events:none;
}
.toast{
  width:100%;max-width:460px;pointer-events:auto;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 14px;
  font-size:13px;line-height:1.45;color:var(--txt-2);
  animation:toastIn .42s var(--out) both;
}
.toast b{color:var(--txt);font-weight:650}
.toast.warn{border-color:color-mix(in srgb, var(--now) 55%, transparent)}
.toast.bad{border-color:color-mix(in srgb, var(--hot) 55%, transparent)}
.toast .tclose{
  display:block;margin-top:9px;padding:0;background:none;border:none;
  font-family:var(--ui);font-size:12.5px;font-weight:650;color:var(--now);
  text-align:left;transition:transform .3s var(--spring);
}
button.tclose:active{transform:scale(.94);transition-duration:.085s}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} }

/* ── the preview strip inside a form ──────────────────────────────────────────
   The same nine weeks, with the pending change painted on. "4 nights from
   16 Aug" is a sentence; this is the picture, and it moves as the steppers do,
   so the consequence is seen before it is agreed to.                         */
.prevwrap{margin:0 0 2px}
.strip.prev{height:34px;padding:0;gap:1px}
.strip.prev i{transition:background .18s var(--out), transform .22s var(--spring)}
.strip.prev i.pending{background:var(--now);transform:scaleY(1.14)}
.strip.prev i.b.pending{height:100%;align-self:stretch}
.prevk{display:flex;justify-content:space-between;padding:6px 2px 0}

/* ── what broke, and who fixed it ─────────────────────────────────────────────
   The flag appears the moment a fault is chosen, inside the block form, so the
   history arrives while the decision is being made rather than in a report. */
.faultRow{margin-top:2px}
.tyRow.soft button{background:none;border-color:var(--line);color:var(--txt-3);font-weight:520}
.faultFlag{
  border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.5;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--txt-2);
  animation:flagIn .3s var(--out) both;
}
.faultFlag.hot{background:color-mix(in srgb,var(--now) 13%,transparent);
  border-color:color-mix(in srgb,var(--now) 40%,transparent)}
.faultFlag b{color:var(--txt);font-weight:650}
.faultFlag em{font-style:normal;color:var(--now);font-weight:600}
.faultFlag .ff-a{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.faultFlag .ff-call, .faultFlag .ff-same{
  padding:7px 11px;border-radius:9px;font-size:12px;font-weight:620;
  text-decoration:none;white-space:nowrap;transition:transform .3s var(--spring);
}
.faultFlag .ff-call{background:var(--now);color:#12100c}
.faultFlag .ff-same{background:var(--surface);border:1px solid var(--line-2);color:var(--txt-2)}
.faultFlag .ff-call:active, .faultFlag .ff-same:active{transform:scale(.95);transition-duration:.085s}
@keyframes flagIn{from{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.faultFlag{animation:none}}

/* ── the peek ─────────────────────────────────────────────────────────────────
   Sits above everything, takes no pointer events, and never moves the grid
   underneath it — the whole value is that your place is exactly where you left
   it when the thumb lifts.                                                    */
.peek{
  position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 74px);
  z-index:90;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;
  box-shadow:var(--shadow);padding:14px 15px 13px;
  max-width:460px;margin:0 auto;
  opacity:0;transform:translateY(-8px) scale(.97);
  transition:opacity .16s var(--out), transform .28s var(--spring);
}
.peek.on{opacity:1;transform:none}
.peek-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.peek-h b{font-size:19px;font-weight:680;letter-spacing:-.028em}
.peek-h s{text-decoration:none;font-size:12px;color:var(--txt-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .strip{padding:0;height:26px}
.peek-l{margin-top:11px;font-size:13.5px;font-weight:600;color:var(--txt)}
.peek-s{margin-top:3px;font-size:12px;color:var(--txt-3)}
@media (prefers-reduced-motion:reduce){ .peek{transition:opacity .12s} }

/* ── sign in ─────────────────────────────────────────────────────────────────
   One screen, done once on this phone. The session is remembered, so this is
   not a thing the operator meets every morning.                              */
.gate{
  position:fixed;inset:0;z-index:120;background:var(--bg);
  display:none;flex-direction:column;justify-content:center;
  padding:32px max(24px,calc((100% - 420px)/2));
  opacity:0;transition:opacity .3s var(--out);
}
.gate.on{display:flex;opacity:1}
.gate h2{margin:0 0 6px;font-size:27px;font-weight:680;letter-spacing:-.028em}
.gate p.lede{margin:0 0 26px;font-size:14px;line-height:1.5;color:var(--txt-2)}
.gate p.lede b{color:var(--txt);font-weight:640}
.gate label{display:block;font-size:11px;font-weight:650;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.gate input{
  width:100%;padding:13px 14px;margin:0 0 16px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
  font-family:var(--ui);font-size:16px;   /* 16px or iOS zooms the page on focus */
}
.gate input:focus{outline:none;border-color:var(--line-2);background:var(--surface-3)}
.gate .go{
  width:100%;padding:14px;border-radius:11px;border:none;
  background:var(--free);color:var(--free-ink);
  font-family:var(--ui);font-size:15px;font-weight:650;
  transition:transform .35s var(--spring), opacity .2s;
}
.gate .go:active{transform:scale(.98)}
.gate .go[disabled]{opacity:.5}
.gate .err{
  margin:0 0 16px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.45;
  background:color-mix(in srgb, var(--hot) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--hot) 40%, transparent);color:var(--txt);
}
.gate .alt{
  display:block;width:100%;margin-top:22px;padding:12px;text-align:center;
  background:none;border:none;font-family:var(--ui);
  font-size:13px;font-weight:560;color:var(--txt-3);
}
