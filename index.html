.chips.recent .reclbl{font-size:10.5px;font-weight:600;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.08em;margin-right:1px}
.chips.recent button{background:none;border-color:var(--line);color:var(--txt-3);font-weight:520}

.answer{font-size:22px;font-weight:600;letter-spacing:-.028em;line-height:1.32;margin:0}
.answer b{font-weight:700}
.answer .y{color:var(--free)}
.answer .n{color:var(--hot)}
.heard{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}

/* ══════════════════════ room sheet ══════════════════════ */
.scrim{position:absolute;inset:0;z-index:50;background:var(--scrim);
  opacity:0;pointer-events:none;transition:opacity .3s var(--out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:86%;
  background:var(--surface);border:1px solid var(--line-2);border-bottom:0;
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .42s var(--spring);
}
.sheet.on{transform:translateY(0)}
.grab{padding:9px 0 3px;display:grid;place-items:center;flex:0 0 auto;touch-action:none;cursor:grab}
.grab i{width:38px;height:4px;border-radius:2px;background:var(--line-2);display:block}
.sheet-h{padding:6px 20px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:flex-start;gap:12px}
.sheet-h .n{font-size:24px;font-weight:680;letter-spacing:-.03em;line-height:1.1}
.sheet-h .m{font-size:12.5px;color:var(--txt-2);margin-top:3px}
/* --txt-2 on --surface-2 is 4.33:1 in dark, just under the floor — and this is
   the control that closes the sheet, so it is not a place to be marginal. */
.sheet-h button{margin-left:auto;width:30px;height:30px;border-radius:var(--r-xs);background:var(--surface-2);
  display:grid;place-items:center;color:var(--txt);flex:0 0 auto}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(20px + var(--safe-b))}
/* ── the nine-week strip ──────────────────────────────────────────────────────
   Nine weeks of one flat, one bar a night. Held back from being decoration by
   three things: blocked nights read differently from sold ones, months are
   grouped so the eye has a landmark, and you can put a finger on it and read
   any single night without the strip changing size or the sheet moving.     */
/* touch-action:none, not pan-y. With pan-y the BROWSER arbitrates: a drag it
   judges vertical enough becomes a page scroll and the scrub is killed with a
   pointercancel, from outside our code, where no amount of direction logic can
   reach it. A one-handed thumb sweep is an arc, so it drifts vertically by
   definition — which is how "I cannot swipe the timeline" happened on a real
   phone while every synthetic test passed. Dispatched PointerEvents never
   exercise this arbitration at all, so the bug was invisible to the way this
   was checked.
   The cost is honest and small: a drag that starts on the 46px band no longer
   scrolls the sheet. The rest of a long sheet still does. Losing the scrub
   halfway through reading a date to somebody on the phone is the worse of the
   two, and it is the one that was actually happening. */
.stripwrap{position:relative;touch-action:none}
/* height is the BORDER box here, so the 16px of padding was eating most of it —
   the bars have quietly been six pixels tall. Given that this is a thing you put
   a finger on and drag, they get room to be read. */
.strip{display:flex;gap:1px;height:46px;padding:14px 20px 0}
.strip i{flex:1;border-radius:1px;background:var(--held);transform-origin:bottom;
  transition:transform .2s var(--out)}
.strip i.f{background:var(--free)}
/* ── the third state ──────────────────────────────────────────────────────────
   Out of service was drawn in --surface-3, four points of luminance away from
   --held: at four pixels wide that is not a distinction, it is the same bar. It
   now takes a tone of its own AND half the height, anchored to the floor, so it
   reads as a notch in the run rather than a shade of it — because colour alone
   must never be the only thing carrying a state, and at this size it could not
   carry one anyway. */
.strip i.b{background:var(--oos);align-self:flex-end;height:52%}
.strip i.td{box-shadow:inset 0 0 0 1px var(--now)}
/* where one stay ends and the next begins — two back-to-back bookings used to
   draw as one unbroken run, hiding every turnover in the month */
.strip i.edge{box-shadow:inset 1px 0 0 var(--bg)}
.strip i.b.edge{box-shadow:inset 1px 0 0 var(--bg)}

/* the touched night lifts; the whole stay or gap it belongs to lifts with it,
   a little less, so you are shown the span and not the pixel */
.strip i.span{transform:scaleY(1.22)}
.strip i.on{transform:scaleY(1.38)}
.strip i.b.span{transform:scaleY(1.15)}
.strip i.b.on{transform:scaleY(1.35)}

/* the bars arrive from the floor, fast and once per opening */
@keyframes barRise{from{transform:scaleY(.08);opacity:.4}}
.stripwrap.fresh .strip i{animation:barRise .2s var(--out) backwards}
@media (prefers-reduced-motion:reduce){ .stripwrap.fresh .strip i{animation:none} }
@media (prefers-reduced-motion:reduce){ .strip i.on{transform:none} }

/* a playhead, not a highlight: recolouring a booked bar is forbidden here, and
   a cursor says "you are reading this night" without touching the data */
/* It starts 14px ABOVE the bars, in the gap under the readout, so that the top
   of it is outside the disc a fingertip covers. A marker whose whole length is
   under the thumb tells you nothing about where you are; this way the column
   you are reading stays locatable while you are reading it. */
.playhead{position:absolute;top:-14px;height:54px;width:1px;background:var(--now);
  opacity:0;transition:opacity .15s;pointer-events:none;left:0}
.stripwrap.reading .playhead{opacity:1}

/* ── the readout, above the bar ───────────────────────────────────────────────
   A hand on a phone comes from below, so everything under the contact point is
   behind it — which is where this used to be. The slot holds its height empty
   so that reading a night never moves the sheet, and sits far enough above the
   bars to clear a fingertip: the bar box is 46px, a fingertip covers about 42,
   and the readout's baseline clears the top of the bars by more than half of
   that. Fixed position, not a callout chasing the finger, so there is nothing
   to flip or clamp at either end of the strip. */
/* 14px of air below the slot, on top of the strip's own 14px of head-room, so
   the readout's last pixel clears the first bar by ~25px — comfortably past
   the 21px half-width of a fingertip, even for a thumb that lands high on the
   bar rather than in the middle of it. */
/* The slot holds the card's full height, because .sheet-b scrolls and would
   otherwise clip whatever grew above it — the date line was being sliced off
   the top. Height is reserved whether or not the card is showing, so reading a
   night still moves nothing on the screen. */
.strip-say{position:relative;margin:0 20px 14px;height:62px}
/* A floating pane, so it takes the floating material: the most opaque and the
   most blurred of the three, because it has arbitrary content behind it and
   carries 12px type. */
/* Narrow on purpose. On one line the run text made the card almost as wide as
   the sheet, which is a banner, not a callout — it was clamped at both ends
   for most of the strip and so never actually tracked anything. Stacked and
   capped, it is small enough to sit over the night you are on. */
.strip-call{position:absolute;left:0;bottom:0;box-sizing:border-box;
  display:flex;flex-direction:column;padding:9px 11px;
  border-radius:var(--r-sm);width:max-content;max-width:min(268px,100%);
  background-color:var(--g3);background-image:var(--sheen);
  -webkit-backdrop-filter:var(--tint-2); backdrop-filter:var(--tint-2);
  border:1px solid var(--g-edge-2);
  box-shadow:var(--lift-2), var(--g-inner);
  opacity:0;pointer-events:none;
  /* the fade is animated; the sideways tracking is NOT — a value indicator that
     eases toward the finger is a value indicator that lies about where it is */
  transition:opacity .14s var(--out)}
.strip-say.reading .strip-call{opacity:1}
.strip-read{display:flex;flex-direction:column;gap:5px;min-width:0}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.strip-read b{font-size:12.5px;font-weight:680;color:var(--txt);white-space:nowrap;
  letter-spacing:-.01em}
.strip-read span{font-size:11.5px;color:var(--txt-2);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the seven nights around the one under the finger, at a pitch you can
   actually read — 16px, against the 5.7px the real strip runs at */
.strip-mini{display:flex;gap:2px;height:16px}
.strip-mini i{width:14px;border-radius:1.5px;background:var(--held)}
.strip-mini i.f{background:var(--free)}
.strip-mini i.b{background:var(--oos);align-self:flex-end;height:52%}
.strip-mini i.td{box-shadow:inset 0 0 0 1px var(--now)}
/* the one you are on: taller than its neighbours and ringed, so it reads
   without colour doing the work */
.strip-mini i.sel{box-shadow:0 0 0 1.5px var(--now);border-radius:2px}
.strip-mini i.b.sel{align-self:stretch;height:auto}
@media (prefers-reduced-motion:reduce){ .strip-call{transition:none} }

/* the legend below is context and stays put — it no longer blinks out of the
   way, because it is no longer sharing a box with the readout */
.strip-foot{position:relative;padding:7px 20px 16px}
.strip-k{display:flex;justify-content:space-between}
/* the booking this night belongs to, lit in the list below */
.card .row.lit{background:var(--surface-2)}
.sheet-s{padding:14px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* ── a chart that answers back ────────────────────────────────────────────────
   The readout lives in a slot that is already there, so touching a bar never
   pushes the cards below it down the page.                                    */
.vwrap{display:flex;flex-direction:column}
/* 0fr → 1fr rather than a height: the browser resolves it on the compositor,
   so the cards below never thrash while it opens */
.vsay{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .26s var(--out), opacity .2s var(--out)}
.vsay > .vsay-in{overflow:hidden;min-height:0}
.vwrap.telling .vsay{grid-template-rows:1fr;opacity:1}
.vwrap.telling .vsay > .vsay-in{padding-top:11px}
.vsay-l{font-size:12.5px;line-height:1.5;color:var(--txt-2)}
.vsay-l b{color:var(--txt);font-weight:640}

/* ══ PROFIT — expenses drawn in the currency of occupancy ═══════════════════
   A building's monthly cost divided by its own room rate is the number of
   nights it must sell before it has paid for itself. Over its capacity that is
   a break-even OCCUPANCY, which lands on the very axis the occupancy bar
   already uses. So rent stops being a number beside a number and becomes a MARK
   ON THE BAR, and profit stops being a third number and becomes the distance
   past that mark. `.hr` is the only element in this app whose length is profit.

   The threshold is never drawn across the bar. A mark sitting on the fill where
   the bar clears it and on the trough where it does not has two grounds to
   contrast against and loses in one theme or the other, every time. It also
   isn't the same KIND of quantity as the measurement, so it gets its own rail
   underneath, on the card surface, where it has one ground. */
.finmo{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:2px}
.finmo button{width:32px;height:32px;border-radius:var(--r-xs);color:var(--txt-3);
  display:grid;place-items:center;font-size:17px;line-height:1}
.finmo button[disabled]{opacity:.3}
.finmo .lab{text-align:center;line-height:1.25}
.finmo .lab b{display:block;font-size:13px;font-weight:650;letter-spacing:-.02em;color:var(--txt)}
.finmo .lab s{display:block;font-size:10px;color:var(--txt-3);text-decoration:none}

/* Ruled in FLATS, never in rupees — it is the legend for every bar below it. */
.covstrip{display:flex;height:6px;border-radius:2px;overflow:hidden;margin:2px 0 7px}
.covstrip span{display:block;height:100%}
.covstrip .c-complete{background:var(--free)}
.covstrip .c-absent{box-shadow:inset 0 0 0 1px var(--oos);border-radius:2px}
.covnote{display:block;width:100%;text-align:left;font-size:11px;color:var(--txt-3);
  padding:0 0 10px;line-height:1.4}

.wrow{display:block;width:100%;text-align:left;padding:6px 0;
  transition:transform .16s var(--out), opacity .16s var(--out)}
.wrow + .wrow{margin-top:4px}
.wrow .n{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
.wrow .n b{font-size:13px;font-weight:620;letter-spacing:-.012em;color:var(--txt)}
.wrow .n em{font-style:normal;font-size:13px;font-weight:650;color:var(--txt);white-space:nowrap}
.wrow.short .n em{color:var(--hot)}
/* THE BAR'S FULL LENGTH IS THE CAPACITY, and the trough is what draws it. On
   the card surface --surface-2 measures 1.01:1 in dark and 1.33:1 in light, so
   past the end of the fill the bar simply stopped — the reader could see how
   much was sold but not what it was sold out of, which is half the comparison.
   A hairline in a translucent token, so one declaration darkens on light and
   lightens on dark. The fill is untouched. */
.wrow .t{position:relative;height:13px;border-radius:6px;background:var(--surface-2);overflow:hidden;
  box-shadow:0 0 0 1px var(--line-2)}
/* THE FILL IS SPLIT AT BREAK-EVEN, and that split is the whole panel.
   Left of it are the nights that go on paying the rent; right of it are the
   nights the operator keeps. Both segments sit on the same trough, so neither
   has the two-grounds problem a mark drawn ACROSS the bar would have, and the
   quantity that matters is 13px tall instead of 3px. Profit stops being a
   figure beside a bar and becomes a length in the bar. */
.wrow .t i{position:absolute;top:0;height:100%;display:block;
  transform-origin:left center;transform:scaleX(var(--v,1))}
/* NOT --held. That token is built to read as a booked tile on the PAGE ground;
   inside a --surface-2 trough it measures 1.05:1 against it (#1B1F2A on
   #181B24) and the segment that carries the rent simply is not there. Mixed
   from the two tokens that actually bound this element instead, so it is a
   muted version of the fill beside it in either theme rather than a third
   colour that happens to work in one. */
.wrow .t i.cover{left:0;border-radius:6px 0 0 6px;
  background:color-mix(in srgb, var(--free) 52%, var(--surface-2))}
.wrow .t i.kept{background:var(--free);border-radius:0 6px 6px 0}
.wrow .t i.only{left:0;background:var(--free);border-radius:6px}
.wrow.short .t i.cover{background:var(--hot);opacity:.55}
/* ONE RULE GOVERNS EVERY TRACK: solid is nights the sheet bills, hatch is
   nights the book counted that the sheet does not. That single sentence draws
   all five rows without naming one of them. The hatch is made OF the sold
   colour, at 135° like .tile.oos, so it can never read as vacancy. */
.wrow .t u{position:absolute;top:0;height:100%;
  background:repeating-linear-gradient(135deg,
    color-mix(in srgb,var(--free) 62%,transparent) 0 5px, transparent 5px 10px)}
.wrow .rail{position:relative;height:6px;margin-top:3px}
.wrow .rail.nocost{border-top:1px dashed var(--line-2)}
.wrow .tick{position:absolute;top:0;width:2px;height:6px;background:var(--txt-2);
  border-radius:1px;transform:translateX(-1px)}
.wrow .tick.over{width:auto;height:auto;background:none;color:var(--hot);
  font-size:11px;line-height:6px;transform:translateX(-6px)}
.wrow .hr{position:absolute;top:1.5px;height:3px;border-radius:2px;background:var(--free);
  transform-origin:left;transform:scaleX(var(--v,1))}
.wrow.short .hr{background:var(--hot)}
.wrow .cap2{font-size:10.5px;color:var(--txt-3);margin-top:5px;line-height:1.35}
/* THE NUMBERS SIT AT THE POINTS THEY NAME. A justified row underneath put
   "44%" at the far left and "76%" at the far right while the things they
   describe sat at 44% and 76% ALONG the bar — so the reader still had to map a
   caption onto a picture, which is the work the picture was supposed to do.
   Each label is now positioned at its own mark: the break-even figure under the
   tick, the sold figure under the end of the fill.

   Clamped at both ends, because a label centred on 4% or 97% hangs off the card
   and a number you cannot read is worse than one you have to hunt for. */
.wrow .pcts{position:relative;height:13px;margin-top:5px;font-size:10px;line-height:13px;
  color:var(--txt-3);white-space:nowrap}
.wrow .pcts span{position:absolute;top:0}
.wrow .pcts .p-sold{color:var(--txt);font-weight:640;font-size:11px}
/* the tick's own label carries a hairline up to the tick so the pairing is not
   left to proximity alone */
.wrow .pcts .p-be::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;
  background:var(--line-2)}
.wrow .pcts .p-be.edgeL::before{left:6px}
/* the key for the bar, said once at the top of the card */
.wkey{display:flex;gap:14px;align-items:center;margin:0 0 10px;font-size:10.5px;color:var(--txt-3)}
.wkey span{display:inline-flex;align-items:center;gap:5px}
.wkey i{display:block;width:11px;height:7px;border-radius:2px}
.wkey .k-cover{background:color-mix(in srgb, var(--free) 52%, var(--surface-2))}
.wkey .k-kept{background:var(--free)}
.wkey .k-tick{width:2px;height:9px;border-radius:1px;background:var(--txt-2)}

/* where the month's cost actually goes — eleven lines, biggest first */
.costsplit{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.cs-h{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--txt-3);margin-bottom:8px}
.cs-r{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  padding:3px 0;font-size:11.5px}
.cs-r b{font-weight:500;color:var(--txt-2);white-space:nowrap}
.cs-r i{display:block;height:5px;border-radius:3px;justify-self:start;
  background:color-mix(in srgb, var(--free) 52%, var(--surface-2))}
.cs-r s{text-decoration:none;color:var(--txt);font-weight:600;white-space:nowrap}

/* ── the activity timeline ───────────────────────────────────────────────────
   A log is scanned, not read, so the kind is a glyph in a fixed column the eye
   can run down, and the time sits where a time belongs — right, quiet, and in
   tabular figures so the column is straight. */
/* THREE COLUMNS: the kind, the sentence, the time. `.row.bk` is two columns and
   `.row .meta` ellipsises to one line — right for a booking row, wrong for a
   log, where the end of the sentence is the answer: "Could not move Log Probe
   to 1A — it is not f…" is not a log entry, it is a tease. */
/* .row.bk sets two columns at (0,2,0); this needs to beat it, not tie with it —
   at one class the third child wrapped onto its own line and the time ended up
   under the sentence instead of beside it. */
.row.bk.actrow{grid-template-columns:auto 1fr auto;align-items:start;gap:9px}
.actrow .meta{white-space:normal;overflow:visible;text-overflow:clip}
/* A guest name is arbitrary text and can be one unbroken 60-character run —
   a pasted address, or the XSS probe the suite books under. Without this it
   ran straight out of its column and under the time. */
.actrow .meta b{display:block;white-space:normal;overflow-wrap:anywhere}
.actrow .meta em{overflow-wrap:anywhere}
.actrow .meta em{white-space:normal;overflow:visible;text-overflow:clip}
.actrow .rowend{align-self:start;padding-top:3px}
/* WIDTH, not flex-basis. .actrow is a GRID, where `flex:0 0 22px` does nothing
   at all — so the badge took its width from its glyph and every one of them
   rendered about 10px wide and 22px tall: a column of narrow vertical slots
   down the left of the sheet instead of a column of square badges. */
.actk{width:22px;height:22px;display:grid;place-items:center;
  border-radius:6px;background:var(--surface-2);color:var(--txt-2);
  font-size:11px;font-weight:700;line-height:1}
/* --now-ink, not --now. In light the accent is #F59300 and the wash under it is
   made of the same colour, so the glyph measured 1.81:1 against its own
   background — the app already keeps a darker ink for amber on amber and this
   is exactly what it is for. Identical in dark, where the two are one value. */
.actk.warn{background:color-mix(in srgb,var(--now) 18%,transparent);color:var(--now-ink)}
.acttime{font-size:11px;color:var(--txt-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.actrow .meta b{font-weight:560;line-height:1.35}
/* SOLID IS WHAT YOU KNOW, HATCH IS WHAT IS ESTIMATED — the same sentence every
   other track on this tab is drawn with, now that a line declares what kind of
   cost it is. Rent is solid because rent is contracted and known on the 1st;
   electricity is hatched until its bill is logged, because until then the
   figure is an average of other months. Same tone for both: they are charged
   identically, and only their standing differs.

   An earlier pass hatched EVERY unlogged line, which put rent — the one number
   in the model nobody is guessing at — in the same pattern as a maintenance
   average. And the pass before that painted logged lines solid --free, which in
   light is near-black: a dark slab reading as an alert. Tone was the wrong
   channel; it says "more" where the thing being said is "different in kind". */
.cs-r.act b{color:var(--txt);font-weight:600}
.cs-r.est i{
  background:repeating-linear-gradient(135deg,
    color-mix(in srgb,var(--free) 52%,var(--surface-2)) 0 4px, transparent 4px 8px)}
/* one rate, fifteen months, in its own sheet */
.raterail{display:flex;align-items:flex-end;gap:4px;height:140px;margin:14px 0 0}
.rcol{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;gap:5px;opacity:.5;
  transition:opacity .2s var(--out), transform .2s var(--out)}
.rcol.on{opacity:1;transform:translateY(-2px)}
.rcol i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--free)}
.rcol.on i{background:var(--free)}
.rcol s{text-decoration:none;font-size:9.5px;color:var(--txt-3)}
.ratesay{margin-top:12px;font-size:12px;line-height:1.5;color:var(--txt-2)}
.ratesay b{color:var(--txt);font-weight:640}
/* card 2's key, in place of the paragraph that used to explain its own picture */
.railkey{display:flex;gap:14px;align-items:center;margin:9px 0 0;font-size:10.5px;color:var(--txt-3)}
.railkey span{display:inline-flex;align-items:center;gap:5px}
.railkey i{display:block;width:11px;height:7px;border-radius:2px}
.railkey .k-cost{background:var(--held)}
.railkey .k-kept{background:var(--free)}
/* the way in to the cost model, on the card the model drives */
.costsbtn{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;
  margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);text-align:left;transition:transform .38s var(--spring)}
.costsbtn:active{transform:scale(.97)}
.costsbtn span{font-size:12.5px;font-weight:600;color:var(--txt)}
.costsbtn em{font-style:normal;font-size:10.5px;color:var(--txt-3);white-space:nowrap}
.wgroup{border-top:1px solid var(--line);margin:12px 0 0;padding-top:10px}
.wrows.picked .wrow{opacity:.45}
.wrows.picked .wrow.on{opacity:1;transform:translateY(-2px)}

/* card 2 — sixteen slots at a fixed monthly pitch. The dark base is the cost
   model and is the SAME HEIGHT in every column, because FIN_COST does not move
   with the month. Once you have seen that, you cannot mistake a margin swing
   for a cost change, and no disclaimer under the picture is needed. */
.finrail{display:flex;align-items:flex-end;gap:5px;height:120px}
.finrail .s{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;opacity:.45;transition:opacity .2s var(--out), transform .2s var(--out)}
.finrail .s.on{opacity:1;transform:translateY(-3px)}
.finrail .s .col{position:relative;width:100%;border-radius:3px 3px 0 0;
  background:var(--surface-2);overflow:hidden}
.finrail .s .col em{position:absolute;left:0;right:0;bottom:0;display:block;background:var(--held);
  border-top:1px solid var(--rim-hair)}
.finrail .s .col i{position:absolute;left:0;right:0;top:0;display:block;background:var(--free)}
.finrail .s.gap{align-self:stretch;border-left:1px dashed var(--line-2);opacity:.5}
.finmon{display:flex;gap:5px;margin-top:6px}
.finmon span{flex:1 1 0;min-width:0;text-align:center;font-size:9.5px;color:var(--txt-3)}
.finmon span.yr{border-left:1px solid var(--line)}

.vsay-go{
  margin-top:7px;padding:6px 10px;border-radius:var(--r-xs);font-size:12px;font-weight:640;
  color:var(--now);background:color-mix(in srgb,var(--now) 14%,transparent);
  transition:transform .3s var(--spring);
}
.vsay-go:active{transform:scale(.94);transition-duration:.085s}
/* the touched bar lifts out of the row rather than recolouring, because colour
   on a data cell already means something here */
.vbar{transition:transform .28s var(--spring), opacity .2s}
button.vbar{background:none;border:none;padding:0;font:inherit;color:inherit}
/* :not(.on), because without it this rule (0,3,0) out-specifies .vbar.on (0,2,0)
   and touching a chart dimmed THE BAR YOU TOUCHED — only the 3px lift survived.
   The gesture said "tell me about this one" and the app faded it. Six charts. */
.vwrap.telling .vbar:not(.on){opacity:.45}
.vbar.on{opacity:1;transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){ .vbar,.vsay{transition:none} }

/* ── the Pulse segment bar, which lives in the header ─────────────────────────
   It used to be a sticky element inside the scrolling area, and every version of
   that was wrong in the same way: a strip of page background parked under the
   title, reading as a black band with content sliding behind it. Sticky also
   resolves against the scroll container's PADDING box, so the screen's 22px was
   a floor no margin could cross.

   None of that is a styling problem. The bar is CHROME — it does not scroll, it
   is always true, and it belongs to the header. Put it there and the sticky
   maths, the gradient, the z-index and the band all stop existing. It inherits
   the header's own blurred material for free.                                 */
.tabseg{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:11px -20px 0;padding:0 20px 1px;
}
.tabseg[hidden]{display:none}
.tabseg::-webkit-scrollbar{display:none}
.tabseg button{
  position:relative;flex:0 0 auto;padding:8px 13px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--txt-3);white-space:nowrap;
  transition:transform .38s var(--spring), background .18s, color .18s;
}
.tabseg button:active{transform:scale(.95);transition-duration:.085s}
.tabseg button[aria-selected="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
/* something is waiting under Now — the only badge in the app, so it means it */
.tabseg button i.dot{
  position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;
  background:var(--now);
}
.tabseg button[aria-selected="true"] i.dot{background:var(--free-ink);opacity:.55}
/* the title row condenses on scroll; the chips ride with it rather than jumping */
.topbar.tight .tabseg{margin-top:8px}

@keyframes segIn{from{opacity:0;transform:translateX(var(--from,20px))}}
.deck.slide{animation:segIn .26s var(--out) both}
@media (prefers-reduced-motion:reduce){ .deck.slide{animation:none} }
.deck{will-change:transform}

/* ── moving a guest between two rooms ─────────────────────────────────────────
   Two rooms and a gap, with the guest standing in the left one. On confirm they
   lift, cross, and settle — an arc rather than a slide, because a straight line
   between two points reads as a value being assigned and a lift reads as
   somebody carrying something. The room they leave goes light the moment they
   step out of it, not when they arrive, which is the half-second that makes the
   whole thing legible.                                                        */
/* ── the move: across, not down ───────────────────────────────────────────────
   The room being emptied on the left, where everyone goes on the right, and the
   guests walk across the gap. Across is the right reading — it is a picture of a
   journey, and a vertical stack is a picture of a list.

   The destination starts EMPTY. Showing a dashed outline of the guest before
   anyone agrees to anything is the app answering a question it has not been
   asked, and it read as "already moved". So the room opens to make space and
   then the guest walks in, which is also the order those two things happen in
   real life.

   Three rules keep the edges honest through all of it:
     · the thing that travels is a CLONE in a flight layer above everything, so
       nothing is ever clipped by the box it is growing out of;
     · the real chip is already in its destination, hidden — so the space is
       exactly right and the landing is a reveal, not a re-layout;
     · the shell translates, an inner box takes the arc, a third holds the text.
       One transform each. Collapse them and the content leans out past its own
       chip edge at the apex, which is what the first version did.               */
.movestage{
  position:relative;isolation:isolate;
  margin:18px 20px 0;display:flex;align-items:flex-start;gap:0;
}
.mroom,.mdest{
  border-radius:var(--r-md);padding:9px 10px;
  display:flex;flex-direction:column;border:1px solid var(--line);
}
.mroom{flex:1;min-width:0;background:var(--held);
  transition:background .42s var(--out), border-color .42s var(--out)}
.mroom.lit{background:var(--free);border-color:transparent}
.mdests{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
/* Both cards change state, so both should speak the same language. The room
   being emptied goes from booked to LIT, which is this app's one rule — a
   vacant room is the lit one. The destinations were doing something else
   entirely: they started as a neutral card and only gained a border, so the
   left card made a dramatic colour move and the right ones made almost none,
   which is why it read as arbitrary. A destination that takes a guest is now
   BOOKED, and takes the booked material. One room lights up, the others go
   dark, and the picture states what actually happened. */
.mdest{background:var(--surface-2);
  transition:background .34s var(--out), border-color .34s var(--out), box-shadow .34s var(--out)}
.mdest.filled{background:var(--held);border-color:transparent;box-shadow:var(--shadow-sm)}
.mdest.filled>.mhead>b{color:var(--held-ink)}
.mdest.filled>.mhead>s{color:var(--held-ink);opacity:.8}
.mdest>.mhead>b,.mdest>.mhead>s{transition:color .34s var(--out)}

.mhead{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;
  align-items:baseline;gap:0 6px;min-width:0}
.mhead>b{grid-area:1/1;font-size:14px;font-weight:670;letter-spacing:-.02em;
  color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead>.mtag{grid-area:1/2;font-size:9.5px;font-weight:650;letter-spacing:.07em;
  text-transform:uppercase;color:var(--txt-2);white-space:nowrap;
  transition:color .42s var(--out)}
.mhead>s{grid-area:2/1/auto/-1;text-decoration:none;font-size:10.5px;color:var(--txt-2);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* scoped to a DIRECT child of the head. The old block styled `.mroom b`, which
   reached into the guest chips and repainted their names the moment the room lit. */
.mroom.lit>.mhead>b{color:var(--free-ink)}
.mroom.lit>.mhead>s,.mroom.lit>.mhead>.mtag{color:color-mix(in srgb,var(--free-ink) 72%,transparent)}
.mroom>.mhead>b,.mroom>.mhead>s{transition:color .42s var(--out)}

/* The room opens and closes on grid-template-rows rather than height: the row
   is the only thing that resizes, the compositor keeps the chips crisp through
   it, and there is no half-pixel text reflow on the way. */
.mparty{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--out)}
.mparty.open{grid-template-rows:1fr}
.mpin{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:6px}
.mparty.open>.mpin{padding-top:7px}

/* the guest is three boxes, one job each */
.mguest{position:relative;z-index:1;display:block;min-width:0;pointer-events:none}
.mguest.away{visibility:hidden}
.mguest-fx{
  display:block;padding:6px 8px 6px 7px;border-radius:var(--r-xs);
  background:var(--raise);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);
}
.mguest-in{display:flex;align-items:center;gap:6px;min-width:0}
.mguest .bag{flex:0 0 auto;width:14px;height:14px;color:var(--txt-2)}
.mguest .bag svg{width:14px;height:14px;display:block}
.mguest .who{display:flex;flex-direction:column;min-width:0;line-height:1.22}
/* Two narrow columns cannot hold every name on one line, and an unbreakable one
   would stack four deep and make its chip twice the height of the chip beside
   it. Two lines then an ellipsis: the chips stay a set. */
.mguest b{font-size:12px;font-weight:620;letter-spacing:-.01em;color:var(--txt);
  overflow-wrap:anywhere;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.mguest s{text-decoration:none;font-size:10px;font-weight:520;color:var(--txt-2);
  white-space:nowrap;font-variant-numeric:tabular-nums}

.mgap{flex:0 0 30px;align-self:stretch;display:grid;place-items:center;color:var(--txt-3)}
.mgap i{display:block;width:8px;height:8px;
  border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;
  border-radius:0 2px 0 0;transform:translateX(-1px) rotate(45deg);
  transition:transform .34s var(--spring)}
.movestage.carrying .mgap i{transform:translateX(3px) rotate(45deg)}

/* ── the flight layer ────────────────────────────────────────────────────────
   Above every card, clipped by nothing. What flies is a clone; the real chip is
   already sitting in its destination with visibility:hidden, holding exactly
   the right space open. So the landing is a reveal rather than a re-layout, and
   no edge is ever caught mid-reflow. */
.mfly{position:absolute;inset:0;z-index:9;pointer-events:none}
/* The flier keeps its own .mguest class now (see carry()), so these have to win
   against it rather than replace it — same specificity, declared later. */
.mflier{position:absolute;top:0;left:0;will-change:transform;z-index:2}
@keyframes carryX{ from{transform:translate3d(var(--x0),var(--y0),0)}
                     to{transform:translate3d(var(--x1),var(--y1),0)} }
@keyframes carryY{
  0%  {transform:translateY(0) scale(1) rotate(0deg)}
  50% {transform:translateY(calc(var(--bow,12px) * -1)) scale(1.06) rotate(-1.6deg)}
  100%{transform:translateY(0) scale(1) rotate(0deg)}
}
@keyframes carryLift{0%,100%{box-shadow:var(--shadow-sm)}50%{box-shadow:var(--shadow)}}
/* An arc is two motions with two curves. One multi-stop keyframe eases between
   EVERY pair of stops, which is why the first version stuttered. */
.mflier{animation:carryX var(--fly,280ms) cubic-bezier(.4,0,.15,1) var(--delay,0ms) both}
.mflier>.mguest-fx{
  animation:carryY var(--fly,460ms) cubic-bezier(.37,0,.63,1) var(--delay,0ms) both,
            carryLift var(--fly,460ms) linear var(--delay,0ms) both}

.moveundo{
  display:inline-flex;align-items:center;gap:6px;margin:10px 20px 0;
  padding:8px 12px;border-radius:var(--r-xs);background:none;border:1px solid var(--line);
  font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--txt-3);
  transition:transform .3s var(--spring), color .18s;
}
.moveundo:active{transform:scale(.95);transition-duration:.085s;color:var(--txt-2)}
.moveundo.away{visibility:hidden}
.movewhy{margin:16px 20px 0;font-size:13px;line-height:1.55;color:var(--txt-2)}
.movewhy b{color:var(--txt);font-weight:640}
.movewhy b.ok{color:var(--now)}
.movenote{margin:10px 20px 0;font-size:12px;line-height:1.55;color:var(--txt-3)}
.bkgo.movego{margin:16px 20px 0;width:calc(100% - 40px)}

@media (prefers-reduced-motion:reduce){
  .mparty,.mroom,.mdest,.mgap i,.mroom>.mhead>b,.mroom>.mhead>s,.mhead>.mtag{transition:none}
  .mflier,.mflier>.mguest-fx{animation:none}
}

/* ── the room card ────────────────────────────────────────────────────────────
   Opening a room reads. One primary action sized to say "this is what you came
   for", two small routes to the things that write, and then the lists. Every
   form that used to live here now has a screen of its own.                    */
.roomAct{padding:16px 20px 4px;display:flex;flex-direction:column;gap:9px}
.bigAct{
  width:100%;padding:15px 16px;border-radius:var(--r-md);border:none;
  background:var(--free);color:var(--free-ink);font-family:var(--ui);
  font-size:16px;font-weight:670;letter-spacing:-.02em;text-align:left;
  display:flex;flex-direction:column;gap:2px;
  transition:transform .38s var(--spring);
}
.bigAct:active{transform:scale(.985);transition-duration:.085s}
.bigAct s{text-decoration:none;font-size:12px;font-weight:520;opacity:.62}
.actWhy{
  padding:13px 15px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--txt-2);
}
.actWhy b{color:var(--txt);font-weight:640}
/* the two things that write, given equal and deliberately modest weight */
.roomRoutes{display:flex;gap:9px}
.roomRoutes button{
  flex:1;min-width:0;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--ui);font-size:13px;font-weight:600;color:var(--txt);
  display:flex;flex-direction:column;gap:1px;text-align:left;
  transition:transform .38s var(--spring), background .18s;
}
/* The material for this pair is not here. It was, once — this was the first
   button put on liquid glass so it could be judged in place, and it kept its own
   private copy of the recipe at a fill nobody else used. It is a RAISE pane like
   every other panel, so it is declared with them in the material section and
   this rule is gone. A component file says what a thing IS; the material
   section says what it is MADE OF. Mixing the two is how one button ends up
   three percent lighter than the card beside it. */
/* pressed, the pane thins and the rim tightens — light passing through more of
   it, which is what a real slab does when you push it against its ground */
:root[data-theme="light"] .roomRoutes button:active{
  background-color:var(--s-raise-press);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),
             inset 0 0 0 1px rgba(255,255,255,.28),
             inset 0 0 22px rgba(255,255,255,.34),
             0 3px 10px -4px rgba(13,16,23,.28);
}
.roomRoutes button:active{transform:scale(.96);transition-duration:.085s;background:var(--surface-3)}
.roomRoutes button s{text-decoration:none;font-size:11px;font-weight:500;color:var(--txt-3)}
.rowMore{padding:11px 14px;font-size:12px;color:var(--txt-3);border-top:1px solid var(--line)}

/* a stepper that has to hold a date, so it gets the room a number does not need */
.stepWide{display:flex;align-items:center;gap:0;padding:0 4px;flex:1;min-width:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.stepWide button{width:38px;height:44px;font-size:20px;font-weight:400;color:var(--txt-2);
  background:none;border:none;transition:transform .3s var(--spring)}
.stepWide button:active{transform:scale(.86);transition-duration:.085s}
.stepWide button[disabled]{opacity:.3}
.stepWide b{flex:1;text-align:center;font-size:14px;font-weight:620;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the running consequence of the two steppers above it */
.bkstate{font-size:12.5px;line-height:1.45;color:var(--txt-3);padding:0 2px;margin-top:-2px}
.bkstate.bad{color:var(--hot)}
.bkgo[disabled]{opacity:.45}

/* ── taking a booking ─────────────────────────────────────────────────────────
   Phone first, because it is identity: type it and a returning guest names
   himself. Everything below it arrives pre-filled, so the common booking is
   still two touches — the number, and Book.                                  */
.bkform{margin:14px 20px 0;display:flex;flex-direction:column;gap:8px}
.bkform input{width:100%;padding:12px 13px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);color:var(--txt);font-family:var(--ui);
  font-size:16px;   /* 16px or iOS zooms the whole page on focus */
  transition:border-color .18s, background .18s}
.bkform input:focus{outline:none;border-color:var(--line-2);background:var(--surface-3)}
.bkform input::placeholder{color:var(--txt-3)}
/* A NATIVE SELECT IS NOT A THEME. Dropped into the expense sheet these rendered
   as the browser's own white boxes with a system chevron — the only two
   controls in the app not made of its own materials, on the newest screen in
   it. Same box as the inputs beside them, appearance stripped, and the chevron
   drawn here so it takes the app's ink in both themes. */
.bkform select{width:100%;padding:12px 34px 12px 13px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
  font-family:var(--ui);font-size:16px;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),
                   linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% + 1px), calc(100% - 12px) calc(50% + 1px);
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
  transition:border-color .18s, background-color .18s}
.bkform select:focus{outline:none;border-color:var(--line-2)}
/* The date field keeps the OS picker — on a phone that is the best control
   there is — but its indicator is a system glyph in a system colour, so it is
   dimmed to the app's own weight rather than left shouting in blue. */
.bkform input[type="date"]{padding-right:11px}
.bkform input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:.5;cursor:pointer;filter:var(--cal-ico)}
.bkform input[type="date"]::-webkit-date-and-time-value{text-align:left}
/* WHEN, IN ONE TAP. Almost every expense is logged the day it happened or the
   day after, so the two common answers are buttons and the picker is the
   fallback rather than the first move. */
.daychips{display:flex;gap:6px;margin:-2px 0 2px}
.daychips button{flex:0 0 auto;padding:6px 11px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--txt-2);white-space:nowrap;
  transition:transform .38s var(--spring),background .18s,color .18s}
.daychips button:active{transform:scale(.95);transition-duration:.085s}
.daychips button[aria-pressed="true"]{background:var(--free);color:var(--free-ink);
  border-color:transparent}
/* captions sit above the pair and line up with them, so neither number has to
   be guessed at */
.bkcap{display:flex;gap:8px;margin:2px 0 -3px;font-size:10.5px;font-weight:640;
  color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em}
.bkcap span:first-child{flex:1;min-width:0}
/* the narrow right-hand column belongs to a two-part caption over a
   [wide][narrow] control pair. A lone caption matches :last-child too, and was
   being squeezed into 120 centred pixels and wrapped mid-phrase — ":not(
   :first-child)" is the whole fix and it applies everywhere at once. */
.bkcap span:last-child:not(:first-child){flex:0 0 120px;text-align:center}
.bkrow{display:flex;gap:8px}
.bkamt{position:relative;flex:1;min-width:0}
.bkamt s{position:absolute;left:13px;top:50%;transform:translateY(-50%);text-decoration:none;
  font-size:15px;color:var(--txt-3);pointer-events:none}
.bkamt input{padding-left:27px}
/* a stepper, because nobody should open a keyboard to say "two people" */
.step{display:flex;align-items:center;gap:0;padding:0 4px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);flex:0 0 120px}
/* the same control, but it has a whole row to itself and a word in it */
.step.nightStep{flex:1 1 auto;width:100%}
.step.nightStep b{font-size:14px;letter-spacing:-.01em}
.step button{width:36px;height:44px;font-size:20px;font-weight:400;color:var(--txt-2);
  background:none;border:none;transition:transform .3s var(--spring)}
.step button:active{transform:scale(.86)}
.step button[disabled]{opacity:.3}
.step b{flex:1;text-align:center;font-size:15px;font-weight:620}
.srcRow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.srcRow::-webkit-scrollbar{display:none}
.srcRow button{flex:0 0 auto;padding:8px 12px;border-radius:var(--r-xs);background:var(--surface-2);
  border:1px solid var(--line);font-size:12.5px;font-weight:560;color:var(--txt-2);
  white-space:nowrap;transition:transform .3s var(--spring), background .18s, color .18s}
.srcRow button:active{transform:scale(.95)}
.srcRow button[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.bkgo{width:100%;padding:14px;border-radius:var(--r-sm);border:none;background:var(--free);
  color:var(--free-ink);font-family:var(--ui);font-size:15px;font-weight:650;
  transition:transform .35s var(--spring)}
.bkgo:active{transform:scale(.98)}
/* the payoff of storing the number: he names himself on the second visit */
.bkback{font-size:12px;font-weight:560;color:var(--now);padding:0 2px}

/* Money on a booking row — three states, never two. Only the one that needs a
   hand is loud; a settled booking should cost the eye nothing on the way past. */
.paid{font-size:11px;font-weight:620;padding:5px 9px;border-radius:var(--r-xs);white-space:nowrap;
  border:1px solid transparent;transition:transform .3s var(--spring)}
.paid.due{background:color-mix(in srgb,var(--now) 16%,transparent);color:var(--now);
  border-color:color-mix(in srgb,var(--now) 34%,transparent)}
.paid.due:active{transform:scale(.94)}
.paid.plat{background:var(--surface-2);color:var(--txt-3);font-weight:560}
.paid.clear{background:transparent;color:var(--txt-3);font-weight:560}
/* An absence, set apart from a figure: no weight, no box, and italic, so it
   never reads as a number that happens to be small. The separation is carried
   by the slant, NOT by opacity — --txt-3 is already the quietest ink that
   clears AA, and knocking it back to .72 dropped this to 3.37:1 in dark. A
   caveat nobody can read is worse than the zero it replaced. */
.paid.none{background:transparent;color:var(--txt-3);font-weight:500;font-style:italic}

/* booking entry */
.book{margin:16px 20px 0;display:flex;gap:8px;align-items:stretch}
.book input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 13px;font-size:15px;outline:none;color:var(--txt);
  transition:border-color .2s}
.book input:focus{border-color:color-mix(in srgb,var(--now) 60%,transparent)}
.book input::placeholder{color:var(--txt-3)}
.bookbtn{background:var(--free);color:var(--free-ink);border-radius:var(--r-sm);padding:12px 15px;
  font-size:13px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;flex:0 0 auto;
  transition:transform .38s var(--spring)}
.bookbtn:active{transform:scale(.94)}
.blockbtn{margin:10px 20px 0;width:calc(100% - 40px);padding:11px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;
  color:var(--txt-2);transition:transform .38s var(--spring)}
.blockbtn:active{transform:scale(.97)}
.blocked{margin:16px 20px 0;padding:13px 15px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--txt-2)}
.blocked b{color:var(--txt)}

/* two-tap destructive confirm — no modal, no accidental deletes */
.rowx{width:32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--txt-3);
  background:var(--surface-2);border:1px solid var(--line);flex:0 0 auto;font-size:15px;
  transition:background .2s, color .2s}
.rowx.arm{width:auto;padding:0 11px;background:var(--hot);color:#fff;border-color:transparent;
  font-size:12px;font-weight:650}
.rowend{display:flex;align-items:center;gap:8px}
/* the move glyph: same footprint as the cancel, quieter than it */
.rowmv svg{width:15px;height:15px;display:block}
.rowmv{color:var(--txt-3)}
.rowmv:active{color:var(--txt-2)}
.row.move.warn .pill{background:color-mix(in srgb,var(--hot) 14%,var(--surface));color:var(--hot)}

.dataTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* inventory editor */
.invHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:16px 20px 8px;position:sticky;top:0;background:var(--surface);z-index:2}
.invHead b{font-size:14px;font-weight:650;letter-spacing:-.015em}
.invAdd{font-size:12px;font-weight:600;color:var(--now);padding:5px 9px;border-radius:var(--r-xs);
  background:color-mix(in srgb,var(--now) 14%,transparent);white-space:nowrap}
.invAdd:active{transform:scale(.94)}
.invRow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.invRow:last-child{border-bottom:0}
.invRow:active{background:var(--surface-2)}
.invRow .fid{font-size:14px;font-weight:640;letter-spacing:-.02em}
.invRow .fty{font-size:12px;color:var(--txt-2)}
.invRow .fbk{font-size:11px;color:var(--txt-3)}
.invForm{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;
  background:var(--surface-2)}
.invForm .r{display:flex;gap:8px}
.invForm input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-xs);padding:11px 12px;font-size:15px;color:var(--txt);outline:none}
.invForm input:focus{border-color:color-mix(in srgb,var(--now) 60%,transparent)}
.invForm input::placeholder{color:var(--txt-3)}
.tyRow{display:flex;gap:6px;flex-wrap:wrap}
.tyRow button{padding:8px 11px;border-radius:var(--r-xs);background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--txt-2)}
.tyRow button[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.invActs{display:flex;gap:8px;align-items:center}
.invSave{flex:1;background:var(--free);color:var(--free-ink);border-radius:var(--r-xs);padding:11px;
  font-size:13px;font-weight:650}
.invSave:active{transform:scale(.97)}
.invDel{padding:11px 13px;border-radius:var(--r-xs);background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--txt-2)}
.invDel.arm{background:var(--hot);color:#fff;border-color:transparent}
.invWarn{font-size:12px;color:var(--hot);line-height:1.45}

@media (prefers-reduced-motion:reduce){
  .sheet{transition:transform .01s}
  *{scroll-behavior:auto!important}
}
/* ── account, sync state and conflicts ───────────────────────────────────────
   The pill in the top bar is never allowed to flatter the truth: it says
   whether this is the sample book or the real one, and whether what you just
   typed has actually reached the server. An operator who thinks a booking
   saved when it did not will sell the room twice.                            */
.pill{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--txt-2);letter-spacing:.01em;
  transition:transform .35s var(--spring), background .18s;white-space:nowrap;
}
.pill:active{transform:scale(.94)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--txt-3);flex:0 0 auto}
.pill.live i{background:#3FBF6A}
.pill.wait i{background:var(--now)}
.pill.off  i{background:var(--hot)}
/* the queue depth is the honest bit — it counts what has not landed yet */
.pill.wait, .pill.off{color:var(--txt)}

/* toast — a conflict is news, not an error, so it reads as a sentence */
.toasts{
  position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:0 16px;pointer-events:none;
}
.toast{
  width:100%;max-width:460px;pointer-events:auto;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-md);
  box-shadow:var(--shadow);padding:12px 14px;
  font-size:13px;line-height:1.45;color:var(--txt-2);
  animation:toastIn .42s var(--out) both;
}
.toast b{color:var(--txt);font-weight:650}
.toast.warn{border-color:color-mix(in srgb, var(--now) 55%, transparent)}
.toast.bad{border-color:color-mix(in srgb, var(--hot) 55%, transparent)}
.toast .tclose{
  display:block;margin-top:9px;padding:0;background:none;border:none;
  font-family:var(--ui);font-size:12.5px;font-weight:650;color:var(--now);
  text-align:left;transition:transform .3s var(--spring);
}
button.tclose:active{transform:scale(.94);transition-duration:.085s}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} }

/* ── the preview strip inside a form ──────────────────────────────────────────
   The same nine weeks, with the pending change painted on. "4 nights from
   16 Aug" is a sentence; this is the picture, and it moves as the steppers do,
   so the consequence is seen before it is agreed to.                         */
.prevwrap{margin:0 0 2px}
.strip.prev{height:34px;padding:0;gap:1px}
.strip.prev i{transition:background .18s var(--out), transform .22s var(--spring)}
.strip.prev i.pending{background:var(--now);transform:scaleY(1.14)}
.strip.prev i.b.pending{height:100%;align-self:stretch}
.prevk{display:flex;justify-content:space-between;padding:6px 2px 0}

/* ── what broke, and who fixed it ─────────────────────────────────────────────
   The flag appears the moment a fault is chosen, inside the block form, so the
   history arrives while the decision is being made rather than in a report. */
.faultRow{margin-top:2px}
.tyRow.soft button{background:none;border-color:var(--line);color:var(--txt-3);font-weight:520}
.faultFlag{
  border-radius:var(--r-sm);padding:11px 13px;font-size:12.5px;line-height:1.5;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--txt-2);
  animation:flagIn .3s var(--out) both;
}
.faultFlag.hot{background:color-mix(in srgb,var(--now) 13%,transparent);
  border-color:color-mix(in srgb,var(--now) 40%,transparent)}
.faultFlag b{color:var(--txt);font-weight:650}
.faultFlag em{font-style:normal;color:var(--now);font-weight:600}
.faultFlag .ff-a{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.faultFlag .ff-call, .faultFlag .ff-same{
  padding:7px 11px;border-radius:var(--r-xs);font-size:12px;font-weight:620;
  text-decoration:none;white-space:nowrap;transition:transform .3s var(--spring);
}
.faultFlag .ff-call{background:var(--now);color:#12100c}
.faultFlag .ff-same{background:var(--surface);border:1px solid var(--line-2);color:var(--txt-2)}
.faultFlag .ff-call:active, .faultFlag .ff-same:active{transform:scale(.95);transition-duration:.085s}
@keyframes flagIn{from{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.faultFlag{animation:none}}

/* what the ceiling hid, said plainly rather than left as silence */
.movecap{margin:9px 4px 0;font-size:11.5px;line-height:1.45;color:var(--txt-3)}

/* ── the way past the wall ────────────────────────────────────────────────────
   Sits under the stepper only once the stepper has run out of room, so it reads
   as the answer to the sentence above it rather than as a permanent option. */
.wallmove{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:2px 10px;width:100%;text-align:left;margin-top:9px;
  padding:10px 11px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
  transition:transform .3s var(--spring), background .18s;
  animation:wallIn .3s var(--out) both;
}
.wallmove:active{transform:scale(.975);transition-duration:.085s}
/* headline and prize share the top row; the reasoning runs the full width
   underneath, so a two-line name never has to squeeze past the pill */
.wm-h{grid-area:1/1;display:flex;align-items:center;gap:7px;min-width:0}
.wm-h svg{width:15px;height:15px;flex:0 0 15px;color:var(--now)}
.wm-h b{font-size:13px;font-weight:640;color:var(--txt);line-height:1.3}
.wm-g{
  grid-area:1/2;align-self:start;
  font-size:12px;font-weight:700;color:var(--free-ink);
  background:var(--free);border-radius:var(--r-xs);padding:5px 8px;white-space:nowrap;
}
.wm-s{grid-area:2/1/auto/-1;font-size:11.5px;color:var(--txt-2);line-height:1.45}
.wm-s b{color:var(--txt);font-weight:640}
@keyframes wallIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
/* the same slot when the answer is no — deliberately not a card, so a dead end
   never looks like something to tap */
.wallno{
  margin-top:8px;font-size:11.5px;line-height:1.45;color:var(--txt-3);
  animation:wallIn .3s var(--out) both;
}
.wallno b{color:var(--txt-2);font-weight:640}
@media (prefers-reduced-motion:reduce){
  .wallmove,.wallno{animation:none}
}

/* ── the people who fix things ────────────────────────────────────────────────
   Not names to pick from — people with a record. Whoever touched this exact
   fault in this exact flat comes first, because they hold the warranty, and the
   number under each is the one that decides who to ring next.                */
.fixers{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:-2px}
.fixers::-webkit-scrollbar{display:none}
.fixers[hidden]{display:none}
.fixer{
  flex:0 0 auto;min-width:126px;text-align:left;
  padding:9px 11px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;
  transition:transform .3s var(--spring), border-color .18s, background .18s;
}
.fixer:active{transform:scale(.96);transition-duration:.085s}
.fixer.on{background:var(--free);border-color:transparent}
.fixer.on .fx-n b{color:var(--free-ink)}
.fixer.on .fx-r{color:color-mix(in srgb, var(--free-ink) 60%, transparent)}
.fx-n{display:flex;align-items:baseline;gap:6px;min-width:0}
.fx-n b{font-size:13px;font-weight:650;color:var(--txt);white-space:nowrap}
.fx-n em{font-style:normal;font-size:10px;font-weight:650;color:var(--now);white-space:nowrap}
.fixer.on .fx-n em{color:var(--free-ink);opacity:.7}
.fx-r{font-size:10.5px;color:var(--txt-3);white-space:nowrap}
.fx-r.bad{color:var(--now)}


/* ── what broke: a grid, not a wall of pills ──────────────────────────────────
   Ten appliances as ten text pills wrapped into three ragged rows and read as a
   wall. This is the Rooms tab's own tile geometry, reused: even cells, a glyph
   that carries at a glance, the label under it so nothing is a guessing game,
   and a badge saying how many times THIS flat has broken THIS thing. Typing
   filters it, so the long tail never needs a second screen.                   */
.ffind{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--r-xs);
  background:var(--surface-2);border:1px solid var(--line)}
.ffind:focus-within{border-color:var(--now-ink)}
.ffind svg{width:15px;height:15px;flex:0 0 15px;stroke:var(--txt-3);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.ffind input{flex:1;min-width:0;border:0;background:none;font-size:12.5px;outline:none;color:var(--txt)}
.ffind input::placeholder{color:var(--txt-3)}
/* --txt-2 on a --line-2 disc measures 4.09:1 in light and 4.33 in dark — under
   the floor on a 10px glyph, which is the worst place to be marginal. */
.ffind button{flex:0 0 auto;width:17px;height:17px;border-radius:50%;background:var(--line-2);
  color:var(--txt);font-size:10px;line-height:1;display:grid;place-items:center}
/* an author display: wins over the UA rule the hidden attribute relies on, so
   the clear button has to opt out explicitly or it is always on screen */
.ffind button[hidden]{display:none}

.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ftile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:62px;border-radius:var(--r-xs);position:relative;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  transition:transform .3s var(--spring),background .18s,color .18s;
}
.ftile:active{transform:scale(.94);transition-duration:.085s}
.ftile[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.ftile svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ftile span{font-size:9px;font-weight:620;letter-spacing:-.01em;text-align:center;
  line-height:1.12;padding:0 3px;overflow:hidden;display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2}
.ftile i{position:absolute;top:4px;right:5px;font-style:normal;font-size:8px;font-weight:700;
  color:var(--now-ink);letter-spacing:.02em}
.ftile[aria-pressed="true"] i{color:var(--free-ink);opacity:.75}
.fnone{font-size:12px;color:var(--txt-3);padding:4px 2px}

/* ── who is fixing it, chosen by what broke ───────────────────────────────────
   Not a directory. The people who have actually done THIS thing, in the order
   the evidence puts them — this flat first, then the other forty-four — with
   the reason they are on the list, because a name on its own is trivia.
   Nobody is pre-selected: the app is offering, not deciding.                  */
.crew{display:flex;flex-direction:column;gap:6px}
.mate{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:10px 12px;border-radius:var(--r-sm);text-align:left;
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);
  transition:transform .3s var(--spring),background .18s,color .18s;
}
.mate:active{transform:scale(.98);transition-duration:.085s}
.mate[aria-pressed="true"]{background:var(--free);color:var(--free-ink);border-color:transparent}
.mate .mt{display:flex;flex-direction:column;gap:1px;min-width:0}
.mate .mt b{font-size:13.5px;font-weight:650;color:var(--txt)}
.mate[aria-pressed="true"] .mt b{color:var(--free-ink)}
.mate .mt em{font-style:normal;font-size:11px;color:var(--txt-3)}
.mate[aria-pressed="true"] .mt em{color:color-mix(in srgb,var(--free-ink) 62%,transparent)}
.mate .mr{flex:0 0 auto;font-size:10.5px;color:var(--txt-3);text-align:right;white-space:nowrap}
.mate .mr.bad{color:var(--now-ink)}
.mate[aria-pressed="true"] .mr{color:color-mix(in srgb,var(--free-ink) 62%,transparent)}
/* Scoped to the UNSELECTED state, for the third time in this file. A modifier
   written after a state rule at equal specificity wins, and "background:none"
   over a state that had just set a dark fill left white knockout text on a
   transparent card — invisible. A modifier describes the RESTING look; the
   state owns what happens when it is chosen. */
.mate.new:not([aria-pressed="true"]){border-style:dashed;background:none}
.crewidle{font-size:12px;color:var(--txt-3);line-height:1.5}

/* ── offers, not restatements ────────────────────────────────────────────────
   A renovation must not cost six presses on "+" while a phone is at an ear.
   These are one-tap jumps to the two numbers that are actually likely: every
   free night there is, and the length the last one of these took here. Offered,
   never pre-filled — nights loaded behind a tap you did not mean is money spent
   unread. */
.bkjump{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.bkjump button{
  padding:7px 11px;border-radius:var(--r-xs);font-size:12px;font-weight:600;
  color:var(--txt-2);background:var(--surface-2);border:1px dashed var(--line-2);
  transition:transform .3s var(--spring),background .18s,color .18s;
}
.bkjump button:active{transform:scale(.95);transition-duration:.085s}
.bkjump button b{color:var(--txt);font-weight:660}
/* the note and the bill share a line: the bill is short and always optional */
.bkpair{display:flex;gap:8px}
.bkpair input:first-child{flex:1;min-width:0}
/* 96px, not 112: the note is the field with something to say, and at 112 its
   own example rendered as "Note — e.g. compressor r". */
.bkpair input.money{flex:0 0 96px;text-align:right;font-variant-numeric:tabular-nums}

/* the running total, stated once at the top rather than boxed in the middle */
.bkline{margin:0;font-size:12px;line-height:1.5;color:var(--txt-2)}
.bkline b{color:var(--txt);font-weight:640}
.bkline .acc{color:var(--now-ink);font-weight:640}
.bkline.bad b{color:var(--hot)}

/* ── the peek ─────────────────────────────────────────────────────────────────
   Sits above everything, takes no pointer events, and never moves the grid
   underneath it — the whole value is that your place is exactly where you left
   it when the thumb lifts.                                                    */
.peek{
  position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 74px);
  z-index:90;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:14px 15px 13px;
  max-width:460px;margin:0 auto;
  opacity:0;transform:translateY(-8px) scale(.97);
  transition:opacity .16s var(--out), transform .28s var(--spring);
}
.peek.on{opacity:1;transform:none}
.peek-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.peek-h b{font-size:19px;font-weight:680;letter-spacing:-.028em}
.peek-h s{text-decoration:none;font-size:12px;color:var(--txt-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .strip{padding:0;height:26px}
.peek-l{margin-top:11px;font-size:13.5px;font-weight:600;color:var(--txt)}
.peek-s{margin-top:3px;font-size:12px;color:var(--txt-3)}
@media (prefers-reduced-motion:reduce){ .peek{transition:opacity .12s} }

/* ── sign in ─────────────────────────────────────────────────────────────────
   One screen, done once on this phone. The session is remembered, so this is
   not a thing the operator meets every morning.                              */
.gate{
  position:fixed;inset:0;z-index:120;background:var(--bg);
  display:none;flex-direction:column;justify-content:center;
  padding:32px max(24px,calc((100% - 420px)/2));
  opacity:0;transition:opacity .3s var(--out);
}
.gate.on{display:flex;opacity:1}
.gate h2{margin:0 0 6px;font-size:27px;font-weight:680;letter-spacing:-.028em}
.gate p.lede{margin:0 0 26px;font-size:14px;line-height:1.5;color:var(--txt-2)}
.gate p.lede b{color:var(--txt);font-weight:640}
.gate label{display:block;font-size:11px;font-weight:650;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.gate input{
  width:100%;padding:13px 14px;margin:0 0 16px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
  font-family:var(--ui);font-size:16px;   /* 16px or iOS zooms the page on focus */
}
.gate input:focus{outline:none;border-color:var(--line-2);background:var(--surface-3)}
.gate .go{
  width:100%;padding:14px;border-radius:var(--r-sm);border:none;
  background:var(--free);color:var(--free-ink);
  font-family:var(--ui);font-size:15px;font-weight:650;
  transition:transform .35s var(--spring), opacity .2s;
}
.gate .go:active{transform:scale(.98)}
.gate .go[disabled]{opacity:.5}
.gate .err{
  margin:0 0 16px;padding:11px 13px;border-radius:var(--r-xs);font-size:13px;line-height:1.45;
  background:color-mix(in srgb, var(--hot) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--hot) 40%, transparent);color:var(--txt);
}
.gate .alt{
  display:block;width:100%;margin-top:22px;padding:12px;text-align:center;
  background:none;border:none;font-family:var(--ui);
  font-size:13px;font-weight:560;color:var(--txt-3);
}
.gate .alt b{color:var(--txt-2)}

@media (min-width:720px){
  .screen{padding:26px max(20px,calc((100% - 640px)/2)) calc(110px + var(--safe-b))}
  .topbar{padding-left:max(20px,calc((100% - 640px)/2));padding-right:max(20px,calc((100% - 640px)/2))}
  .tabbar{left:50%;right:auto;transform:translateX(-50%);width:360px}
  .sheet{left:50%;transform:translate(-50%,101%);width:min(560px,100%);border-radius:var(--r-xl) var(--r-xl) 0 0}
  .sheet.on{transform:translate(-50%,0)}
}
/* ══════════════════ light: a material, not a coat of paint ══════════════════
   Apple's own guidance is the part most "liquid glass" work skips: the material
   belongs to the layer you REACH FOR — navigation, controls, things that float
   over content — while content itself stays a calm, readable surface. Glassing
   every card is how a phone app turns into a fog bank, and this one's whole job
   is reading a number correctly at arm's length while somebody waits on the
   phone. So the ladder below gets *more* opaque and *more* blurred the closer a
   surface is to you, exactly like real frosted panes stacked in depth, and the
   45-tile data field stays solid glass-free.

   Four levels, one token set, no per-component CSS.                          */
:root[data-theme="light"]{
  /* CRYSTAL — thin, hard glass rather than a frosting.
     What makes it read as glass is the optics, not the blur: a bright specular
     streak across one shoulder, a near-white rim, and a dark hairline under the
     bottom edge that the eye takes for the thickness of the pane. The blur is
     deliberately tiny — 6px, where the usual reach is 20–30 — which is also why
     it is the cheapest translucent material of the ten to render.

     One deviation from the sample, stated rather than smuggled: the sample sat
     at 32% and measured 1.5:1 for body text over a black room tile. These are
     at 62/72/86%, which keeps every pane comfortably legible and loses none of
     the character, because the character was never the transparency. */
  /* Transparency goes where something is actually behind it, and where the type
     can afford it. The top bar has the whole screen scrolling under it and
     carries one 20px/690 title, so it can be halfway to clear. The sheet has
     arbitrary content behind it and carries 12–13px body, so it cannot: a pane
     you cannot read is not a material, it is a mistake. */
  /* Chrome carries its own secondary ink, and it is nearly as dark as the
     primary. That is arithmetic, not taste: at 52% over a free room tile the
     composite lands near #929292, where --txt-2 measures 2.83:1 and anything
     legible has to be close to black. So the top bar's subtitle and the tab
     labels stop leaning on colour for hierarchy and lean on size and weight
     instead — 20px/690 against 11.5px/400 — which is what this design system
     says type should be doing anyway. */
  --on-glass:#262A33;
  /* HEAVY blur, not the thin hard pane this started as. The first pass ran at
     6/9/12px on the argument that the optics do the work and the blur is only
     cost — true of a thin crystal edge, wrong for the material actually being
     asked for. What makes Apple's glass read as glass at a glance is the
     backdrop going soft and saturated behind it, and that also BUYS the
     transparency: a pane over mush stays legible at an opacity that would be
     unreadable over a sharp grid. So the blur goes up and the fill comes down
     together — they are one decision, not two. Saturation is what stops a
     heavy blur turning everything grey. */
  /* Three surfaces, three answers, because they do not sit over the same thing
     and do not carry the same type. Measured, not chosen:
       cards   float over the page ground, which is light, and still clear AA
               at .32 — so they can be as thin as they like. .40.
       bars    scroll over the room grid, where a FREE tile is near-black in
               this theme. .52 is where the subtitle lands at 4.79 and the next
               step down fails. It stays.
       tab bar also floats over that grid, but carries nothing except --on-glass
               and --txt, which clear at .56. So it gets to be the glassiest
               thing on screen, and it is the one you watch the rooms move
               under. .58.
       sheet   carries 11px --txt-3 over a scrimmed page. It could not move
               while the greys were where they were — it measured 4.10 even at
               .80. The greys came down to meet it, so now it can: .62, where
               the same worst case measures above its floor again. This is the
               surface everything else sits ON, so nothing inside the sheet
               could look like glass until this one did. */
  --g1:rgba(255,255,255,.40);   /* L1 content — cards, day cells            */
  --g2:rgba(255,255,255,.52);   /* L2 chrome  — bars: big type, real backdrop */
  --g3:rgba(255,255,255,.62);   /* L3 floating— sheet, toasts: small type   */
  --g-tab:rgba(255,255,255,.58);/* the tab bar alone: only strong ink on it  */
  --g-sunk:rgba(13,16,23,.06);  /* recessed: an ink tint, never a paler white */
  --g-edge:rgba(255,255,255,.95);
  --g-edge-2:rgba(255,255,255,1);
  /* the cross-section: light along the top inside edge, shadow along the bottom */
  --g-inner:inset 0 1px 0 rgba(255,255,255,1), inset 0 -1px 0 rgba(13,16,23,.10);
  --blur-1:blur(18px) saturate(180%);
  --blur-2:blur(26px) saturate(180%);
  --blur-3:blur(34px) saturate(180%);
  /* The specular sweep. A real pane catches the light across one shoulder, and
     this is the single strongest tell that a surface is glass rather than a
     translucent rectangle. It rides in background-image, not a ::before, so it
     can never land on top of the content it belongs behind. */
  /* narrow and bright, the way light catches an edge — not a soft wash */
  --sheen:linear-gradient(128deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.06) 17%,
                          rgba(255,255,255,0) 34%);
  --sheen-soft:linear-gradient(128deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.04) 15%,
                          rgba(255,255,255,0) 32%);
  /* tight shadows: a thin pane sits close to what it is on */
  --lift:0 1px 1px rgba(13,16,23,.14), 0 3px 7px -3px rgba(13,16,23,.20);
  --lift-2:0 1px 2px rgba(13,16,23,.16), 0 9px 20px -10px rgba(13,16,23,.30);
  /* state, not depth — see the dark block for why these are tokens */
  /* An INK hairline, not a white one. A trough on a light pane used to be
     ringed in 50% white, which on an 80%-white sheet was a white line on a
     white surface — the search field on the fault form had a 6% fill and an
     invisible border, so there was no box on screen at all, only a placeholder
     floating in space. A recess has to be drawn by something darker than what
     it is cut into. */
  --sunk-edge:rgba(13,16,23,.14);
  --g-sunk-inner:inset 0 1px 2px rgba(13,16,23,.10), inset 0 -1px 0 rgba(255,255,255,.65);
  --pane:rgba(255,255,255,.94);
  --pane-inner:inset 0 1px 0 #fff;
  --press:rgba(255,255,255,.86);

  /* ── LIQUID GLASS ─────────────────────────────────────────────────────────
     Not the same material as the frosted panes above, and the difference is
     the blur: 3px, not 26. Liquid glass is CLEAR in the middle and busy at the
     EDGE. Everything that makes it read as glass lives in the rim — a bright
     top lip, a dark under-edge, an inner glow that falls off fast, and one
     specular streak across a shoulder. Blurring the middle is frosted bathroom
     glass, which is the mistake the rest of this file is currently making.

     ADAPTIVE TINT is the other half, and it is what makes a clear pane usable
     at all. At 3px the backdrop stays legible, which means it competes with
     the label sitting on it — a near-black room tile under a dark word. So the
     filter compresses whatever is behind into a narrow band before it reaches
     the eye: brightness lifts it, contrast(<1) squeezes it toward the middle.
     Measured through the sheet, a backdrop ranging 150→209 comes out 169→217.
     The SHAPE of what is behind still shows — that is the glass — but the
     range it can occupy no longer includes anything the ink cannot beat.

     Light only, deliberately. The same trick inverted for dark needs
     brightness ~0.25 to keep white type off a near-white tile, and that is
     dark enough to stop being glass at all. Dark keeps the frosted pane it
     already has and already measures clean. */
  --lg-fill:var(--s-raise);
  /* LIFT ONLY. This carried contrast(.7) and it made every card paint DARKER
     than the page it sat on — grey blocks behind the calendar, the to-do list,
     the room lists, the money cards. The mechanism is the clamp: brightness
     pushes a bright backdrop past 255, it pins at white, and then contrast(<1)
     drags that white back DOWN toward mid-grey. 229 went in, 217 came out.
     A tint on a light theme must never darken. Everything on this tint sits
     either over the page, which is bright, or over the sheet, which has
     already lifted its own backdrop — neither can present the near-black
     tile that contrast() was there to rescue. So it goes, and brightness
     alone does the lifting: it cannot darken, because it cannot go below 1. */
  --lg-tint:blur(3px) saturate(170%) brightness(1.08);
  /* Light's half of the optics switch. Same three depths as :root; light is the
     theme that is actually made of glass, so tint-1 and tint-2 carry the liquid
     recipes rather than none. */
  --tint-1:var(--lg-tint);
  --tint-2:var(--lg-sheet-tint);
  /* The SHEET's own version. It needs a stronger tint and a heavier fill than a
     button does, because a button sits on the already-normalised sheet while
     the sheet sits on raw page — a near-black FREE tile one moment and white
     ground the next. Searched rather than picked: of every brightness /
     contrast / fill combination that keeps 11px --txt-3 at or above 4.5, this
     is the one that leaves the MOST of the room showing through. 73 levels of
     variation survive, against 50 for the values I would have chosen by eye.
     6px of blur, not 34. That is the whole reason the sheet read as a flat
     cream field: at 34px an 85px room tile is featureless mush, so there was
     nothing behind the glass buttons to be glass over. At 6px the tiles keep
     their shape and the sheet finally has a room behind it. */
  --lg-sheet-fill:var(--s-float);
  /* brightness(1.5) contrast(.75) was sized for a ground whose darkest point
     was 165. The ground is 183 now, so that much lift only clamps to white and
     then contrast drags it back — the sheet came out at 221–240, which is why
     it read as cream while everything around it had a blue cast. A gentle lift
     with no contrast term leaves it at 202–222: deeper, the ground's colour
     still in it, and --txt-3 still at 6.87 over the worst spot. Same lesson as
     the cards two commits ago — on a light theme the tint must only lift. */
  /* saturate() was 180% and it is what made the drawer read as a DIFFERENT
     COLOUR from the page it opens over. The room grid behind it is near-black
     tiles and amber dots on a cool ground; at 6px of blur those are still
     distinct shapes, and boosting their saturation by 80% pulled their warmth
     straight through — so the sheet came out a muddy warm grey while the page
     stayed cool blue. The page's own material does not amplify anything, and a
     drawer that opens over a surface should belong to it.
     12px so the tiles read as a soft field rather than as blotches with edges,
