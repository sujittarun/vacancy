const faultSvg = k => '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + (FAULT_ICON[k] || FAULT_ICON["*"]) + '</svg>';

/* Everything that can take a flat out of service, in one list. "Maintenance"
   plus "AC" was always one fact asked twice — a broken thing IS the reason — so
   the faults carry reason "Maintenance" and only the four that are not a
   breakage stay as reasons of their own. The stored shape does not change. */
/* The words an operator would actually type. "Plumbing" is the category; "tap"
   is what is dripping — and a search box that promises "tap, socket" and then
   finds nothing is worse than no search box. */
const FAULT_ALIAS = {
  "AC":"aircon air cooling cool ac",
  "Geyser":"water heater hot shower boiler",
  "Plumbing":"tap sink drain leak water toilet flush pipe basin",
  "Electrical":"socket plug switch light power mcb wiring fuse board",
  "Wi-Fi":"internet router net broadband signal wifi",
  "Fridge":"refrigerator freezer cooling",
  "Washing machine":"washer laundry washing drum",
  "Furniture":"sofa bed wardrobe chair table cupboard door drawer",
  "Chimney":"chimney hood extractor exhaust kitchen smoke filter suction",
  "Microwave":"microwave oven kitchen heating turntable",
  "Gas stove":"gas stove hob burner cooktop kitchen flame regulator cylinder",
  "Pest control":"cockroach roach ants rats rodents mosquito bugs pest",
  "Other":"something else anything",
  "Deep clean":"clean cleaning deep",
  "Owner use":"owner personal family",
  "Renovation":"paint painting renovate remodel tiles work",
  "Not ready":"ready setup furnishing new"
};
/* every word has to land somewhere, so "hot water" finds the geyser even though
   the alias says "water heater hot" — a phrase match would miss it */
const faultHit = (k, needle)=>{
  const hay = (k + " " + (FAULT_ALIAS[k] || "")).toLowerCase();
  // short words are "no", "is", "the" — requiring them finds nothing for
  // "no power", which is exactly how somebody types it
  const words = needle.split(/\s+/).filter(w => w.length > 2);
  return words.length ? words.every(w => hay.includes(w)) : hay.includes(needle);
};

const OUT_REASONS = ["Deep clean","Owner use","Renovation","Not ready"];
function outOptions(fi){
  return faultsFor(fi).map(f => ({key:f, fault:f, reason:"Maintenance"}))
    .concat(OUT_REASONS.map(r => ({key:r, fault:"", reason:r})));
}
/* How many times THIS flat has had THIS thing — the badge on the tile. */
function faultTimesHere(fi, fault){
  if(!fault) return 0;
  return resv.filter(r => isBlock(r) && r.fi === fi && r.fault === fault).length;
}

/* ── who has actually done this ───────────────────────────────────────────────
   Ranked the way the app ranks everything else: this flat first, then the other
   forty-four, then whoever is simply used most. The "why" line is the point —
   a name on its own is trivia, and the record beside it is what decides whether
   you ring this one or the next one. Nobody is pre-selected. */
function crewFor(fi, fault){
  const all = fixers();
  if(!all.length) return [];
  const here = {}, away = {};
  if(fault) resv.filter(r => isBlock(r) && r.fault === fault && r.fixer).forEach(r=>{
    const k = r.fixer.trim().toLowerCase();
    if(r.fi === fi) here[k] = (here[k] || 0) + 1; else away[k] = (away[k] || 0) + 1;
  });
  const said = g=>{
    const k = g.name.trim().toLowerCase(), n = here[k] || 0, m = away[k] || 0;
    if(n) return n === 1 ? `did the ${fault} here`
                         : `did the ${fault} here ${n === 2 ? "twice" : n + " times"}`;
    if(m) return `${fault} in ${m} other flat${m>1?"s":""}`;
    return "most used overall";
  };
  const rank = g=>{
    const k = g.name.trim().toLowerCase();
    return (here[k] ? 200 + here[k] : 0) + (away[k] ? 100 + away[k] : 0) + g.jobs;
  };
  return all.slice().sort((a,b)=> rank(b) - rank(a)).slice(0,3)
    .map(g=>({name:g.name, phone:g.phone, why:said(g),
              rec:`${g.jobs} job${g.jobs>1?"s":""} · ${g.back ? g.back + " came back" : "none came back"}`,
              bad:!!g.back}));
}

function openBlockForm(fi, day){
  const fl = flats[fi];
  roomHead(fi, ()=> openSheet(fi, day));

  let from = Math.max(0, Math.min(day == null ? pickedNight : day, DAYS-1));
  while(from < DAYS && occ[fi][from]) from++;                 // start where it can actually go out
  if(from >= DAYS) from = pickedNight;
  let outN = 1, reason = "Maintenance", fault = "", chosen = "";
  let who = "", phone = "", newHand = false, q = "", showAll = false;
  /* No 60-night ceiling here. That number is openBooking's, where it is a
     sensible maximum guest stay; copied onto a repair it made "take all 60"
     appear on a flat with 63 free nights, left the last three untakeable by any
     control on the screen, and then told you a guest held a night nobody held.
     A flat added before it goes on sale is exactly the long-void case this is
     for. */
  const capFrom = d => { let k = 0; while(d + k < DAYS && !occ[fi][d + k]) k++; return Math.max(1, k); };

  const form = el("div","bkform");
  const prev = previewStrip(fi);

  /* The running total, said once at the top. It is context, not a field: dates
     and money boxed in the middle of a form read as something to fill in. */
  const line = el("p","bkline");

  /* ── what broke ─────────────────────────────────────────────────────────── */
  const fCap = el("div","bkcap");
  fCap.append(el("span",null,"What is happening"), el("span",null,"tap one"));
  const find = el("div","ffind");
  find.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'
    + '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
  const qi = el("input");
  qi.type = "text"; qi.placeholder = "or type it — geyser, tap, socket…";
  qi.setAttribute("aria-label","Find what broke");
  const qx = el("button", null, "✕"); qx.setAttribute("aria-label","Clear"); qx.hidden = true;
  find.append(qi, qx);
  const grid = el("div","fgrid");
  const flag = el("div","faultFlag"); flag.hidden = true;
  /* "Other" means the list did not have it, so the only useful next thing is a
     box to say what it actually is. */
  const otherRow = el("div","r"); otherRow.hidden = true;
  const otherIn = el("input");
  otherIn.type = "text"; otherIn.placeholder = "What is it? — this goes in the note";
  otherRow.appendChild(otherIn);

  /* ── how long ───────────────────────────────────────────────────────────── */
  const whenCap = el("div","bkcap");
  whenCap.append(el("span",null,"Out from"), el("span",null,"Nights"));
  const whenRow = el("div","bkrow");
  const dayBox = el("div","stepWide");
  const dLess = el("button",null,"−"), dMore = el("button",null,"+"), dLab = el("b");
  dLess.setAttribute("aria-label","A day earlier"); dMore.setAttribute("aria-label","A day later");
  dayBox.append(dLess, dLab, dMore);
  const nBox = el("div","step");
  const nLess = el("button",null,"−"), nMore = el("button",null,"+"), nLab = el("b");
  nLess.setAttribute("aria-label","Fewer nights out"); nMore.setAttribute("aria-label","More nights out");
  nBox.append(nLess, nLab, nMore);
  whenRow.append(dayBox, nBox);
  const jump = el("div","bkjump");

  /* ── who is fixing it ───────────────────────────────────────────────────── */
  const whoCap = el("div","bkcap");
  const whoCapR = el("span");
  whoCap.append(el("span",null,"Who is fixing it"), whoCapR);
  const crew = el("div","crew");
  const handRow = el("div","r"); handRow.hidden = true;
  const handName = el("input"); handName.type = "text"; handName.placeholder = "Name";
  handName.setAttribute("aria-label","Name of the person fixing it");
  const handPh = el("input"); handPh.type = "tel"; handPh.inputMode = "numeric";
  handPh.placeholder = "Their number"; handPh.setAttribute("aria-label","Their phone number");
  phoneField(handPh);
  handRow.append(handName, handPh);

  /* No bill here. Nobody knows what a repair cost before it has been done, so a
     money box on this form could only ever collect a guess — and a guess is
     exactly what "what upkeep costs" must not be counting. The bill is asked
     once, at the end, by openFixedForm. */
  const noteRow = el("div","r");
  const note = el("input");
  note.type = "text"; note.placeholder = "Note — e.g. compressor";
  note.setAttribute("aria-label","A note about the work");
  noteRow.append(note);
  const go = el("button","bkgo","");

  function paintGrid(){
    grid.textContent = "";
    const all = outOptions(fi);
    const needle = q.trim().toLowerCase();
    let list = needle ? all.filter(o => faultHit(o.key, needle)) : all;
    // eight cells is two clean rows; the rest are a tap or three letters away
    const capped = !needle && !showAll && list.length > 8;
    if(capped) list = list.slice(0, 7);
    if(!list.length){
      const none = el("div","fnone", `Nothing matches “${q.trim()}”. Try fewer letters, or pick Other.`);
      grid.appendChild(none); return;
    }
    list.forEach(o=>{
      const t = el("button","ftile");
      const on = chosen === o.key;
      t.setAttribute("aria-pressed", on);
      const times = faultTimesHere(fi, o.fault);
      t.setAttribute("aria-label", o.key + (times ? `, ${times} here before` : ""));
      t.innerHTML = faultSvg(o.key);
      t.append(el("span", null, o.key));
      if(times) t.append(el("i", null, times + "×"));
      t.onclick = ()=>{
        if(on){ chosen = ""; fault = ""; reason = "Maintenance"; }
        else { chosen = o.key; fault = o.fault; reason = o.reason; }
        haptic(8); paint();
      };
      grid.appendChild(t);
    });
    if(capped){
      const m = el("button","ftile");
      m.innerHTML = faultSvg("Other");
      m.append(el("span", null, "+" + (all.length - 7) + " more"));
      m.setAttribute("aria-label", "Show the other " + (all.length - 7));
      m.onclick = ()=>{ showAll = true; haptic(8); paintGrid(); };
      grid.appendChild(m);
    }
  }

  function paintCrew(){
    crew.textContent = "";
    whoCapR.textContent = chosen ? "who does " + chosen : "";
    if(!chosen){
      crew.append(el("p","crewidle","The right people appear once you say what is happening."));
      handRow.hidden = true;
      return;
    }
    const list = crewFor(fi, fault);
    list.forEach(c=>{
      const b = el("button","mate");
      b.setAttribute("aria-pressed", who === c.name);
      const t = el("div","mt");
      t.append(el("b", null, c.name), el("em", null, c.why));
      b.append(t, el("div","mr" + (c.bad ? " bad" : ""), c.rec));
      b.onclick = ()=>{
        if(who === c.name){ who = ""; phone = ""; }
        else { who = c.name; phone = c.phone || ""; newHand = false; }
        haptic(8); paint();
      };
      crew.appendChild(b);
    });
    const nu = el("button","mate new");
    nu.setAttribute("aria-pressed", newHand);
    const nt = el("div","mt");
    nt.append(el("b", null, list.length ? "Someone else" : "Who is fixing it"),
              el("em", null, "name and number"));
    nu.append(nt);
    nu.onclick = ()=>{ newHand = !newHand; if(newHand){ who = ""; phone = ""; }
      haptic(8); paint(); if(newHand) handName.focus(); };
    crew.appendChild(nu);
    handRow.hidden = !newHand;
  }

  function paintFlag(){
    const hist = fault ? faultHistory(fi, fault, from) : null;
    flag.textContent = "";
    if(!hist){ flag.hidden = true; return; }
    flag.hidden = false;
    flag.classList.toggle("hot", hist.insideHold);
    const l = el("div","ff-l");
    l.innerHTML = `<b>${hist.recent > 2 ? hist.recent + ordinalSuffix(hist.recent)
                        : hist.times === 2 ? "Second" : hist.times + ordinalSuffix(hist.times)}`
      + ` ${esc(fault)} fault in ${esc(fl.id)}.</b> `
      + (hist.last.fixer
          ? `${esc(hist.last.fixer)} fixed it ${hist.gap === 0 ? "and it is still out"
              : hist.gap + " day" + (hist.gap>1?"s":"") + " ago"}.`
          : `Last one ended ${hist.gap} day${hist.gap===1?"":"s"} ago, nobody recorded.`)
      + (hist.insideHold ? " <em>Inside the month — worth asking for a free look.</em>" : "");
    flag.append(l);
    if(hist.last.fixer && hist.last.fixer_phone){
      const a = el("div","ff-a");
      const call = el("a","ff-call", "Call " + hist.last.fixer);
      call.href = "tel:" + hist.last.fixer_phone.replace(/[^\d+]/g,"");
      a.append(call);
      flag.append(a);
    }
  }

  /* Two jumps worth offering, and only when they are not what is already set. */
  function paintJumps(cap){
    jump.textContent = "";
    if(cap > outN){
      const b = el("button");
      b.innerHTML = `take all <b>${cap}</b> free night${cap>1?"s":""}`;
      b.setAttribute("aria-label", `Take all ${cap} free nights, back on sale ${fmtL(from + cap)}`);
      b.onclick = ()=>{ outN = cap; haptic(8); paint(); };
      jump.appendChild(b);
    }
    const hist = fault ? faultHistory(fi, fault, from) : null;
    const k = hist && hist.last && hist.last.nights;
    if(k && k !== outN && k <= cap){
      const b = el("button");
      b.innerHTML = `take <b>${k}</b> — same as the last ${esc(fault)} here`;
      b.setAttribute("aria-label", `Take ${k} nights, the same as the last ${fault} in ${fl.id}`);
      b.onclick = ()=>{ outN = k; haptic(8); paint(); };
      jump.appendChild(b);
    }
    /* And the window where the work costs nothing sold.
       This asked batchWindow for `outN` nights, and outN is 1 when the form
       opens — so it returned the FIRST free night on the calendar however short,
       and compared it to `from` rather than to the run `from` sits inside.
       Measured across the demo: of 263 offers, 102 restated the very gap the
       operator was standing in and 57 pointed at a SHORTER one. Tapping it threw
       away a nine-night window for a two-night one, and the chip then vanished,
       so there was no way back.
       It now asks for a window strictly longer than the run in hand, and
       excludes that run by its start rather than by the cursor. */
    let runFrom = from;
    while(runFrom > 0 && !occ[fi][runFrom - 1]) runFrom--;
    const win = batchWindow(fi, Math.max(outN, capFrom(runFrom) + 1));
    if(win && win.from !== runFrom && win.nights > capFrom(runFrom)){
      const b = el("button");
      // the same word the line above uses, or the chip and the sentence disagree
      b.innerHTML = `do it <b>${win.from === 0 ? "today" : esc(fmt(win.from))}</b> instead`
        + ` — ${win.nights} free night${win.nights>1?"s":""} there`;
      b.setAttribute("aria-label",
        `Start ${fmtL(win.from)} instead, where ${fl.id} has ${win.nights} free nights`);
      b.onclick = ()=>{ from = win.from; haptic(8); paint(); };
      jump.appendChild(b);
    }
  }

  function paint(){
    const cap = capFrom(from);
    outN = Math.max(1, Math.min(outN, cap));
    dLab.textContent = from === 0 ? "Today" : fmtL(from);
    nLab.textContent = outN;
    dLess.disabled = from <= 0; dMore.disabled = from >= DAYS-1;
    nLess.disabled = outN <= 1; nMore.disabled = outN >= cap;
    const ok = freeRange(fi, from, from + outN);
    line.classList.toggle("bad", !ok);
    /* No money in this line. The nightly rate times the nights is a number the
       app can always compute and almost never means anything: these nights were
       not sold, so nothing is being lost — quoting a figure makes an ordinary
       repair look like a bill. What the operator needs here is the two dates
       and the wall. The real cost lives in Upkeep, where the invoice sits
       beside it and the sum is true. */
    line.innerHTML = ok
      ? `Out <b>${esc(from === 0 ? "today" : fmt(from))}</b> for <b>${outN} night${outN>1?"s":""}</b>`
        + ` · back on sale <b>${esc(fmt(from + outN))}</b>`
        + (()=>{
            /* "a guest holds the night after" fired whenever the run ended —
               including at the end of the nine-week calendar, which is 28 of the
               45 flats. Say it only when somebody is actually there, and say the
               right thing when what is there is another outage. */
            const after = from + outN;
            if(after >= DAYS || !occ[fi][after]) return "";
            const who2 = resv.find(r => r.fi === fi && r.start <= after && r.end > after);
            if(!who2) return "";
            return isBlock(who2)
              ? ` · <span class="acc">it is already out of service the night after</span>`
              : ` · <span class="acc">${esc(who2.guest)} holds the night after</span>`;
          })()
      : `<b>${esc(fl.id)} is already taken on ${esc(fmtL(from))}</b>`;
    otherRow.hidden = chosen !== "Other";
    paintGrid(); paintCrew(); paintFlag(); paintJumps(cap);
    go.textContent = !chosen ? "Say what is happening first"
      : ok ? `Take ${fl.id} out for ${outN} night${outN>1?"s":""}` : "Not available";
    go.disabled = !ok || !chosen;
    prev.paint(from, ok ? outN : 0);
  }

  qi.oninput = ()=>{ q = qi.value; qx.hidden = !q; paintGrid(); };
  qx.onclick = ()=>{ q = ""; qi.value = ""; qx.hidden = true; qi.focus(); paintGrid(); };
  dLess.onclick = ()=>{ from = Math.max(0, from-1); haptic(5); paint(); };
  dMore.onclick = ()=>{ from = Math.min(DAYS-1, from+1); haptic(5); paint(); };
  nLess.onclick = ()=>{ outN = Math.max(1, outN-1); haptic(5); paint(); };
  nMore.onclick = ()=>{ outN = outN+1; haptic(5); paint(); };

  go.onclick = ()=>{
    if(go.disabled) return;
    /* "Other" plus a name is a new kind of thing that breaks. Remember it, so
       next time it is a tile and a search word rather than a sentence — and so
       it accrues its own history, its own repeat warning and its own people. */
    let saveFault = fault;
    if(chosen === "Other" && otherIn.value.trim()) saveFault = learnFault(otherIn.value) || fault;
    /* If the typed name did NOT become a kind, the words still have to land
       somewhere — the field says "this goes in the note". The old guard asked
       `!saveFault`, but the Other tile is {key:"Other", fault:"Other"}, so
       saveFault is the truthy string "Other" whatever happens and the branch
       never ran. learnFault refuses a single character, so a one-letter answer
       was learned nowhere and noted nowhere: it just vanished on save. The
       honest test is whether it is still sitting on the fallback. */
    const extra = [note.value, (chosen === "Other" && saveFault === "Other") ? otherIn.value : ""]
      .filter(x=>x && x.trim()).join(" · ");
    const person = newHand ? handName.value : who;
    const num = newHand ? handPh.value : phone;
    if(addBlock(fi, from, outN, reason, extra, {fault:saveFault, fixer:person, phone:num})){
      haptic(18); closeSheet(); refreshScreen();
    }
  };

  form.append(prev, line, fCap, find, grid, otherRow, flag,
              whenCap, whenRow, jump, whoCap, crew, handRow, noteRow, go);
  sheetB.append(form);
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}
/* ══════════════ closing a repair: who fixed it, and what it cost ════════════
   Both questions are asked HERE and nowhere else, because this is the only
   moment either answer exists. The out-of-service form asks who is *going* to
   fix it — useful for the phone call, but a name on a plan is not a record of
   work done, and a bill quoted before the work is a guess. "What upkeep costs"
   was counting lost nights and nothing else; now it counts the invoice too, and
   "whose work sticks" finally sees the person who actually turned up.

   One form serves both kinds of work item — a logged fault that stayed on sale,
   and a flat that was taken out of service — because from here they are the
   same event: somebody came, it is done, this is the bill.                   */
function openFixedForm(o){
  const fi = o.fi, fault = o.fault || "";
  roomHead(fi, o.back);
  /* Pre-filled with whoever was lined up, because usually they are the one who
     came — but it is a normal selected chip, so one tap says otherwise. */
  let who = (o.assigned || "").trim(), phone = (o.assignedPhone || "").trim();
  let newHand = false;

  const form = el("div","bkform");
  const line = el("p","bkline");
  line.innerHTML = o.line;

  const whoCap = el("div","bkcap");
  whoCap.append(el("span",null,"Who fixed it"), el("span",null,"tap one"));
  const crew = el("div","crew");
  const handRow = el("div","r"); handRow.hidden = true;
  const handName = el("input"); handName.type = "text"; handName.placeholder = "Name";
  handName.setAttribute("aria-label","Name of the person who fixed it");
  const handPh = el("input"); handPh.type = "tel"; handPh.inputMode = "numeric";
  handPh.placeholder = "Their number"; handPh.setAttribute("aria-label","Their phone number");
  phoneField(handPh);
  handRow.append(handName, handPh);

  const costCap = el("div","bkcap");
  /* "if any", not "leave blank if nothing": the right-hand caption slot is
     120px and the longer sentence wrapped to two lines. */
  costCap.append(el("span",null,"What it cost"), el("span",null,"if any"));
  const costRow = el("div","r");
  const bill = el("input","money");
  bill.type = "text"; bill.inputMode = "numeric"; bill.placeholder = "₹ bill";
  bill.setAttribute("aria-label","What the work cost");
  costRow.appendChild(bill);

  const go = el("button","bkgo", o.cta);

  function paintCrew(){
    crew.textContent = "";
    const list = crewFor(fi, fault);
    list.forEach(c=>{
      const b = el("button","mate");
      b.setAttribute("aria-pressed", !newHand && who === c.name);
      const t = el("div","mt");
      t.append(el("b", null, c.name), el("em", null, c.why));
      b.append(t, el("div","mr" + (c.bad ? " bad" : ""), c.rec));
      b.onclick = ()=>{
        if(!newHand && who === c.name){ who = ""; phone = ""; }
        else { who = c.name; phone = c.phone || ""; newHand = false; }
        haptic(8); paint();
      };
      crew.appendChild(b);
    });
    /* The assigned person may not be in the top three this list shows, and
       dropping them would silently rewrite who did the work. */
    if(who && !newHand && !list.some(c => c.name === who)){
      const b = el("button","mate");
      b.setAttribute("aria-pressed", true);
      const t = el("div","mt");
      t.append(el("b", null, who), el("em", null, "who was lined up"));
      b.append(t);
      b.onclick = ()=>{ who = ""; phone = ""; haptic(8); paint(); };
      crew.appendChild(b);
    }
    const nu = el("button","mate new");
    nu.setAttribute("aria-pressed", newHand);
    const nt = el("div","mt");
    nt.append(el("b", null, list.length || who ? "Someone else" : "Who fixed it"),
              el("em", null, "name and number"));
    nu.append(nt);
    nu.onclick = ()=>{
      newHand = !newHand;
      if(newHand){ who = ""; phone = ""; }
      haptic(8); paint();
      if(newHand) handName.focus();
    };
    crew.appendChild(nu);
  }

  function paint(){
    paintCrew();
    handRow.hidden = !newHand;
    const person = (newHand ? handName.value : who).trim();
    /* Naming somebody is what makes the record worth keeping, so the button
       says which half is still missing rather than sitting there disabled. */
    go.textContent = person ? o.cta : "Say who fixed it first";
    go.disabled = !person;
  }

  handName.oninput = paint;
  go.onclick = ()=>{
    if(go.disabled) return;
    const person = (newHand ? handName.value : who).trim();
    const num = (newHand ? handPh.value : phone).trim();
    /* toAmount keeps a minus sign, and a negative bill quietly SUBTRACTS from
       the upkeep total this field exists to make honest. Payments allow
       negatives on purpose — that is a refund. Nothing makes a negative repair. */
    const paid = (bill.value || "").replace(/[^\d.]/g, "");
    haptic(18);
    o.onDone({fixer:person, phone:num, cost:paid});
  };

  form.append(line, whoCap, crew, handRow, costCap, costRow, go);
  sheetB.append(form);
  paint();
  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0;
}

/* arrivals / departures / turnarounds for one day */
function openOps(kind, d){
  const ops = dayOps(d);
  const list = ops[kind];
  const TITLE = {arrivals:"Arriving", departures:"Leaving", turnovers:"Same-day turnaround"};
  const BLANK = {
    arrivals:"Nobody is checking in.",
    departures:"Nobody is checking out.",
    turnovers:"No room has a check-out and a check-in on the same day — no rush cleans."
  };
  sheetWipe();

  const t = el("div");
  t.innerHTML = `<div class="n">${TITLE[kind]}</div><div class="m">${fmtL(d)}${d===0?" · today":""}</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close"); x.onclick = closeSheet;
  sheetH.append(t, x);

  if(kind === "turnovers" && list.length){
    const warn = el("p");
    warn.style.cssText = "margin:16px 20px 0;font-size:13px;line-height:1.55;color:var(--txt-2)";
    warn.innerHTML = `<b class="hi-now">${list.length} room${list.length>1?"s":""} must be cleaned between a check-out and a check-in on the same day.</b> These are the ones that go wrong.`;
    sheetB.appendChild(warn);
  }

  const card = el("div","card");
  card.style.margin = "16px 20px 0";
  if(!list.length) card.appendChild(el("div","empty", BLANK[kind]));

  list.forEach(item=>{
    const fi = kind === "turnovers" ? item.fi : item.fi;
    const fl = flats[fi];
    const row = el("button","row");
    row.append(el("div","id", fl.id));
    const m = el("div","meta");
    if(kind === "arrivals"){
      m.innerHTML = `<b>${esc(item.guest)}</b> · ${item.nights} night${item.nights>1?"s":""}<em>${esc(fl.type)} · ${esc(fl.bshort)} · out ${fmt(item.end)}</em>`;
      row.append(m, el("span","pill", item.src));
    } else if(kind === "departures"){
      m.innerHTML = `<b>${esc(item.guest)}</b> · stayed ${item.nights} night${item.nights>1?"s":""}<em>${esc(fl.type)} · ${esc(fl.bshort)}</em>`;
      const next = runFrom(fi, d);
      row.append(m, el("span", next ? "pill good" : "pill", next ? `${next} nt open` : "re-let same day"));
    } else {
      m.innerHTML = `<b>${esc(item.out.guest)}</b> out → <b>${esc(item.in.guest)}</b> in<em>${esc(fl.type)} · ${esc(fl.bshort)} · ${item.in.nights} night${item.in.nights>1?"s":""}</em>`;
      row.append(m, el("span","pill warn","clean today"));
    }
    row.onclick = ()=>{ haptic(9); openSheet(fi, d); };
    card.appendChild(row);
  });
  sheetB.appendChild(card);

  sheet.classList.add("on"); scrim.classList.add("on");
  sheetB.scrollTop = 0; x.focus();
}

/* ── inventory editor ─────────────────────────────────────────────────────── */
function openInventory(editing){
  sheetWipe();

  const t = el("div");
  t.innerHTML = `<div class="n">Inventory</div><div class="m">${NF} flats · ${buildingsOf().length} buildings</div>`;
  const x = el("button",null,"✕"); x.setAttribute("aria-label","Close");
  x.onclick = ()=>{ closeSheet(); refreshScreen(); };
  sheetH.append(t, x);

  buildingsOf().forEach(b=>{
    const mine = flats.map((f,i)=>({f,i})).filter(o=>o.f.code===b.code);
    const head = el("div","invHead");
    head.append(el("b",null,b.name));
    const add = el("button","invAdd","+ Add flat");
    add.onclick = ()=>{ haptic(9); openInventory({mode:"new", code:b.code}); };
    head.appendChild(add);
    sheetB.appendChild(head);

    const card = el("div","card"); card.style.margin = "0 20px";
    if(editing && editing.mode==="new" && editing.code===b.code) card.appendChild(invForm(null, b));
    mine.forEach(o=>{
      if(editing && editing.mode==="edit" && editing.id===o.f.id){
        card.appendChild(invForm(o.f, b));
        return;
      }
      const bookings = resv.filter(r=>r.fi===o.i).length;
      const row = el("button","invRow");
      row.append(el("div","fid",o.f.id));
      row.append(el("div","fty",o.f.type));
      row.append(el("div","fbk", bookings ? `${bookings} bkg` : "—"));
      row.onclick = ()=>{ haptic(9); openInventory({mode:"edit", id:o.f.id}); };
      card.appendChild(row);
    });
    sheetB.appendChild(card);
  });

  const bh = el("div","invHead");
  bh.append(el("b",null,"Add a building"));
  const bAdd = el("button","invAdd","+ New");
  bAdd.onclick = ()=>{ haptic(9); openInventory({mode:"building"}); };
  bh.appendChild(bAdd);
  sheetB.appendChild(bh);
  if(editing && editing.mode==="building"){
    const card = el("div","card"); card.style.margin="0 20px";
    card.appendChild(buildingForm());
    sheetB.appendChild(card);
  }

  const foot = el("p");
  foot.style.cssText = "margin:18px 20px 10px;font-size:12px;line-height:1.55;color:var(--txt-3)";
  foot.textContent = "Removing a flat also removes its bookings, its payments and anything logged against it.";
  sheetB.appendChild(foot);

  /* ── handing the app over ───────────────────────────────────────────────────
     The flats are real; the bookings, guests, money and faults shipped with the
     app are invented so it has something to show. This is the one button that
     separates the two — it empties everything that was made up and leaves the
     inventory standing, which is exactly the state you want before giving the
     app to whoever is going to run it. */
  const counts = {b: bookings().length, k: resv.filter(isBlock).length,
                  p: resv.reduce((s,r)=> s + (r.pays ? r.pays.length : 0), 0),
                  i: issues.length};
  const wipe = el("div","dataTools");
  wipe.style.cssText = "padding:0 20px";
  const label = `Delete all ${counts.b} test bookings`;
  const bClear = el("button","copybtn", label);
  armConfirm(bClear, {rest:label, cls:"done", hold:3500,
    armed:"Erase everything except the flats?",
    run:()=>{
      clearAll();
      issues.slice().forEach(dropIssue);
      save(); cacheSave();
      openInventory();
      toast("", `<b>Cleared.</b> ${NF} flats kept · ${counts.b} bookings, ${counts.k} blocks, `
              + `${counts.p} payments and ${counts.i} logged faults removed. `
              + `The book is empty and ready for real ones.`, null);
    }});
  wipe.appendChild(bClear);
  sheetB.appendChild(wipe);
  const wipeNote = el("p");
  wipeNote.style.cssText = "margin:9px 20px 0;font-size:12px;line-height:1.55;color:var(--txt-3)";
  wipeNote.textContent = "Keeps every flat and building. Removes the invented bookings, guests, "
    + "money and faults — do this once, before handing the app over.";
  sheetB.appendChild(wipeNote);

  sheet.classList.add("on"); scrim.classList.add("on");
  if(!editing) sheetB.scrollTop = 0;
}

function invForm(flat, b){
  const wrap = el("div","invForm");
  const isNew = !flat;
  let type = flat ? flat.type : "2 BHK";

  const r1 = el("div","r");
  const num = el("input");
  num.type = "text"; num.placeholder = `Flat number, e.g. ${b.code}-101`;
  num.value = flat ? flat.id : `${b.code}-`;
  num.setAttribute("aria-label","Flat number");
  const rate = el("input");
  rate.type = "number"; rate.inputMode = "numeric"; rate.placeholder = "Rate";
  rate.value = flat ? flat.rate : 3000;
  rate.style.maxWidth = "104px";
  rate.setAttribute("aria-label","Nightly rate");
  r1.append(num, rate);

  const tys = el("div","tyRow");
  UNIT_TYPES.forEach(tv=>{
    const b2 = el("button",null,tv);
    b2.setAttribute("aria-pressed", tv===type);
    b2.onclick = ()=>{ type = tv; haptic(8);
      [...tys.children].forEach(c=>c.setAttribute("aria-pressed", c.textContent===type)); };
    tys.appendChild(b2);
  });

  const acts = el("div","invActs");
  const saveBtn = el("button","invSave", isNew ? "Add flat" : "Save");
  const warn = el("div","invWarn");
  saveBtn.onclick = ()=>{
    const id = num.value.trim().toUpperCase().replace(/\s+/g,"");
    if(!id || id === `${b.code}-`){ warn.textContent = "Give the flat a number."; return; }
    if(id !== (flat && flat.id) && flatIndex[id] !== undefined){
      warn.textContent = `${id} already exists.`; return;
    }
    const digits = id.replace(/\D/g,"");
    const floor = digits.length >= 2 ? Math.max(1, +digits[0]) : 1;
    const next = flats.map(f=>({...f}));
    if(isNew){
      next.push({ id, code:b.code, bname:b.name, bshort:b.short, floor,
                  type, rate:+rate.value || 3000, pop:0.6 });
      applyInventory(next);
    } else {
      const k = next.findIndex(f=>f.id === flat.id);
      next[k] = {...next[k], id, floor, type, rate:+rate.value || next[k].rate};
      applyInventory(next, id !== flat.id ? {[flat.id]: id} : null);
    }
    haptic(16); openInventory();
  };

  const del = el("button","invDel","Remove");
  if(!isNew){
    const count = resv.filter(r=>flats[r.fi] && flats[r.fi].id===flat.id).length;
    armConfirm(del, {rest:"Remove",
      armed: count ? `Remove + ${count} bkg?` : "Remove?",
      run:()=>{
        applyInventory(flats.filter(f=>f.id!==flat.id).map(f=>({...f})));
        openInventory();
      }});
    acts.append(saveBtn, del);
  } else {
    const cancel = el("button","invDel","Cancel");
    cancel.onclick = ()=>{ haptic(8); openInventory(); };
    acts.append(saveBtn, cancel);
  }

  wrap.append(r1, tys, acts, warn);
  setTimeout(()=>num.focus(), 60);
  return wrap;
}

function buildingForm(){
  const wrap = el("div","invForm");

  const name = el("input"); name.type="text"; name.placeholder="Building name";
  name.setAttribute("aria-label","Building name");

  code.setAttribute("aria-label","Building code");

  const warn = el("div","invWarn");
  const acts = el("div","invActs");

  saveBtn.onclick = ()=>{
    const n = name.value.trim();
    const c = code.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!n || !c){ warn.textContent = "Name and a short code are both needed."; return; }

    const next = flats.map(f=>({...f}));

  setTimeout(()=>name.focus(), 60);
  return wrap;
}

/* What goes on an advert is not a list of flat numbers — nobody outside your
   office knows what TT-102 means. It is what you have to sell: how many of
   which size, in which building. */
function advertBlock(rows, depth, when){
  /* Group by size, and name the localities under it. An advert says "3 BHK in
     Banjara Hills" — it never says TT-102, and it does not want eight lines. */
  const groups = new Map();
  rows.forEach(r=>{
    const f = flats[r.fi];
    if(!groups.has(f.type)) groups.set(f.type, {n:0, where:new Set()});
    const g = groups.get(f.type);
    g.n++; g.where.add(f.bname);
  });
  const lines = [...groups.entries()]
    .map(([type,g])=>({type, n:g.n, bldg:[...g.where].join(", ")}))
    .sort((a,b)=> b.n - a.n);

  const wrap = el("div","advert");
  wrap.append(el("div","lbl","For your advert"),
              el("div","advert-head", `${depth}% off · ${when}`));
  const list = el("div","advert-list");
  lines.forEach(l=>{
    const r = el("div","advert-row");
    r.append(el("b",null, `${l.n} × ${l.type}`), el("s",null, l.bldg));
    list.appendChild(r);
  });
  wrap.appendChild(list);

  const text = `${depth}% off — ${when}\n\n`
    + lines.map(l=>`${l.n} × ${l.type} — ${l.bldg}`).join("\n");
  const cp = el("button","copybtn");
  cp.style.marginTop = "13px";
  cp.innerHTML = "<span>Copy these words</span>";
  cp.onclick = async ()=>{
    const ok = await copyText(text);
    haptic(12);
    cp.querySelector("span").textContent = ok ? "Copied" : "Press and hold to copy";
    cp.classList.toggle("done", ok);
    setTimeout(()=>{ cp.querySelector("span").textContent = "Copy these words";
                     cp.classList.remove("done"); }, 1800);
  };
  wrap.appendChild(cp);
  return wrap;
}

/* ── who owns the sheet ───────────────────────────────────────────────────────
   One sheet, nine screens that fill it, and one of them — the move — arms
   timers and owes the operator a warning if it goes away with guests shuffled
   for a booking that never happened. Leaving that to a convention ("remember to
   clean up") is how it gets lost: a toast sits at z-index 80 with
   pointer-events above the sheet's 51, so tapping one during a flight opens a
   room and quietly replaces the body underneath. Every screen therefore claims
   the sheet through sheetWipe(), and whoever needs cleaning up registers it. */
let sheetTeardown = null;
function sheetWipe(){
  const t = sheetTeardown; sheetTeardown = null;
  if(t) t();
  sheetH.textContent = ""; sheetB.textContent = "";
}
function sheetOwn(teardown){ sheetTeardown = teardown || null; }
function closeSheet(){
  /* Belt and braces against the drag above: an inline transform beats the class
     that hides the sheet, so closing has to clear it or the sheet stays on
     screen with .on removed — visible, on top, and eating the tab bar's taps. */
  sheet.style.transition = ""; sheet.style.transform = "";
  sheet.classList.remove("on"); scrim.classList.remove("on");
  const t = sheetTeardown; sheetTeardown = null; if(t) t();
}
scrim.onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

/* drag the sheet down to dismiss */
(function(){
  const grab = document.getElementById("grab");
  let y0=null, dy=0;
  const start = e=>{ y0=(e.touches?e.touches[0]:e).clientY; dy=0; sheet.style.transition="none"; };
  const move  = e=>{ if(y0===null) return;
    dy = Math.max(0,(e.touches?e.touches[0]:e).clientY - y0);
    sheet.style.transform = `translateY(${dy}px)`;
    if(window.innerWidth>=720) sheet.style.transform = `translate(-50%,${dy}px)`; };
  /* Clear the inline styles BEFORE the y0 guard, not after it. This drag is the
     only gesture in the file with no cancel path — attachStripScrub,
     pull-to-refresh and the Business deck swipe all bind touchcancel and clear
     their transforms there. An interrupted drag (incoming call, notification
     shade, app switch, a second finger) left translateY(70px) and
     transition:none written onto the sheet, and those inline styles override
     the class that shows and hides it. Measured at 375×812: after closeSheet()
     the sheet had lost its .on class but still sat at y=248 with z-index 51,
     and hit-testing the centre of a tab bar button returned sheet content. The
     tab bar was unreachable, and the sheet's own ✕ was a no-op because
     closeSheet had already run.
     Clearing unconditionally means even a stray cancel with no drag in progress
     leaves the sheet in a known state. */
  const end   = ()=>{
    sheet.style.transition=""; sheet.style.transform="";
    if(y0===null) return;
    if(dy>90){ haptic(9); closeSheet(); }
    y0=null; dy=0; };
  grab.addEventListener("touchstart",start,{passive:true});
  grab.addEventListener("touchmove",move,{passive:true});
  grab.addEventListener("touchend",end,{passive:true});
  grab.addEventListener("touchcancel",end,{passive:true});
  grab.addEventListener("mousedown",e=>{ start(e);
    const mm=ev=>move(ev), mu=()=>{ end(); removeEventListener("mousemove",mm); removeEventListener("mouseup",mu); };
    addEventListener("mousemove",mm); addEventListener("mouseup",mu); });
})();

/* ═══════════════ tabs ═══════════════ */
const ICON = {
  rooms:'<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="3.4" width="6" height="6" rx="1.4"/><rect x="11.4" y="3.4" width="6" height="6" rx="1.4" fill="currentColor" stroke="none"/><rect x="2.6" y="11.4" width="6" height="6" rx="1.4" fill="currentColor" stroke="none"/><rect x="11.4" y="11.4" width="6" height="6" rx="1.4"/></svg>',
  month:'<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.6" y="3.8" width="14.8" height="13.4" rx="2.6"/><path d="M2.6 8.2h14.8M6.6 2.4v2.8M13.4 2.4v2.8"/><circle cx="10" cy="12.6" r="1.5" fill="currentColor" stroke="none"/></svg>',
  ask:'<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9.6c0 3.4-3.1 6.2-7 6.2a8 8 0 0 1-2.2-.3L3.4 17l1-3.1A5.9 5.9 0 0 1 3 9.6C3 6.2 6.1 3.4 10 3.4s7 2.8 7 6.2Z"/><path d="M8.2 8.1a1.9 1.9 0 0 1 3.7.6c0 1.3-1.9 1.6-1.9 2.7"/><circle cx="10" cy="13.4" r=".85" fill="currentColor" stroke="none"/></svg>',
  trends:'<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.4V9.2M7.6 16.4V4.6M12.4 16.4v-8.4M17 16.4v-5"/></svg>',
};
const SCREENS = [
  {id:"rooms",  label:"Rooms",  title:"Rooms",  render:renderRooms},
  {id:"month",  label:"Month",  title:"Month",  render:renderMonth},
  {id:"ask",    label:"Ask",    title:"Ask",    render:renderAsk},
  /* Not "Pulse". A pulse is a reading taken at this instant, and this screen is
     mostly a nine-week projection and a history — it also has buttons that
     change the book, which is not what monitoring means. The deciding test was
     what is on screen when you land: two "Is BH-101 back in service?" cards
     with buttons, "Clean 2 flats today", "Collect ₹11,700". That is not a
     number, so "Numbers" would mislabel it too. Every card here is a question
     the operator would ask about their own business — what a night is worth,
     what you are owed, which nights sell, whose work sticks, what is worth
     doing now — and the subtitle already said so before the tab did.        */
  {id:"trends", label:"Business", title:"Business", render:renderTrends},
];
const tabbar = document.getElementById("tabbar");
const scrTitle = document.getElementById("scrTitle");
const scrSub = document.getElementById("scrSub");
let curScreen = 0;

SCREENS.forEach((sc,i)=>{
  const b = el("button");
  b.setAttribute("role","tab");
  b.innerHTML = ICON[sc.id];
  b.appendChild(el("span",null,sc.label));
  // Ask no longer grabs focus: the tab opens with tonight's answer already on
  // screen, and the keyboard arrives only when someone means to type
  b.onclick = ()=>{ haptic(10); switchTo(i); };
  tabbar.appendChild(b);
});

const SUBS = [
  ()=> "",                       // Rooms writes its own live subtitle in paint()
  ()=> "Nine weeks ahead · tap a date",
  ()=> "Ask in plain words",
  ()=> "What to act on, and how the book looks",
];
/* re-render the current screen in place after the data changes, keeping your place */
function refreshScreen(){
  const s = document.getElementById("scr-" + SCREENS[curScreen].id);
  const top = s.scrollTop;
  SCREENS[curScreen].render();
  s.scrollTop = top;
}

function switchTo(i, focusInput){
  // a tab you are ARRIVING at starts clean; a refresh of the one you are on
  // does not (see askText)
  if(i !== curScreen && SCREENS[i].id === "ask") askText = "";
  curScreen = i;
  SCREENS.forEach((sc,j)=>{
    document.getElementById("scr-"+sc.id).classList.toggle("on", j===i);
    tabbar.children[j].setAttribute("aria-selected", j===i);
  });
  // the entrance is a first impression, not a toll paid on every swipe back
  // the segment chips belong to Pulse alone
  const tabseg = document.getElementById("tabseg");
  if(tabseg && SCREENS[i].id !== "trends"){ tabseg.hidden = true; tabseg.textContent = ""; }
  const cur = document.getElementById("scr-"+SCREENS[i].id);
  if(!cur.classList.contains("seen"))
    setTimeout(()=> cur.classList.add("seen"), calm ? 0 : 480);
  scrTitle.firstChild.nodeValue = SCREENS[i].title;
  scrSub.textContent = SUBS[i]();
  SCREENS[i].render(focusInput);
  const s = document.getElementById("scr-"+SCREENS[i].id);
  s.scrollTop = 0;
  /* The only writer of `tight` is a scroll listener, so switching from a
     scrolled screen to one already at the top fired no scroll and left the
     title condensed on a screen sitting at its own top — which also shifts
     Business's segment strip. Recompute it from the screen arriving. */
  document.querySelector(".topbar").classList.toggle("tight", s.scrollTop > 56);
  closeSheet();
  history.replaceState(null, "", "#" + SCREENS[i].id);
}

/* the large title condenses as you scroll away from it */
(function(){
  const bar = document.querySelector(".topbar");
  SCREENS.forEach(sc=>{
    const s = document.getElementById("scr-"+sc.id);
    s.addEventListener("scroll", ()=>{
      if(!s.classList.contains("on")) return;
      bar.classList.toggle("tight", s.scrollTop > 56);
    }, {passive:true});
  });
})();

/* ── pull down to reload ──────────────────────────────────────────────────────
   Standalone from the home screen there is no address bar and no reload button,
   so this is the only way back to a fresh start — and the tab has to survive it,
   because being dumped on Rooms every time is worse than not reloading at all.
   switchTo already writes the tab into the hash and boot reads it back; Pulse's
   segment is the one thing the hash does not carry, so it rides in
   sessionStorage. A reload is genuinely a reload: same tab, same segment, book
   re-read from storage.                                                       */
let pulling = false;
(function(){
  const host = document.querySelector(".screens"), ptr = document.getElementById("ptr");
  const REACH = 96, TRIP = 68;                 // travel, and where it commits
  let y0 = null, x0 = null, scr = null, pullFrom = null, pull = 0, armed = false, live = false;

  const paint = (d)=>{
    pull = d;
    const p = Math.min(1, d / TRIP);
    scr.style.transform = d ? `translate3d(0,${d.toFixed(1)}px,0)` : "";
    ptr.style.setProperty("--ptr-p", p.toFixed(3));
    ptr.style.setProperty("--ptr-o", Math.min(1, d / 26).toFixed(3));
  };
  const release = ()=>{
    if(!live) return;
    live = false; pulling = false;
    host.classList.remove("held");
    scr.classList.remove("pulling"); scr.classList.add("letgo");
    if(armed){
      // hold it at the indicator so the spin is visible for a beat, then go
      scr.style.transform = `translate3d(0,${TRIP}px,0)`;
      haptic(16);
      setTimeout(()=> location.reload(), calm ? 60 : 260);
      return;
    }
    scr.style.transform = "";
    ptr.style.setProperty("--ptr-o", "0");
    const s = scr;
    setTimeout(()=>{ s.classList.remove("letgo"); }, 460);
    y0 = null; scr = null; pullFrom = null;
  };

  host.addEventListener("touchstart", e=>{
    /* Clearing on the way out matters: a bare `return` left y0 and scr from
       whatever touched last, so the first drag INSIDE an open sheet was
       measured from the tap that opened it, armed the pull, ate the scroll
       and reloaded the app — taking anything typed into the form with it. */
    if(sheet.classList.contains("on") || e.touches.length > 1){ y0 = null; scr = null; return; }
    scr = document.getElementById("scr-" + SCREENS[curScreen].id);
    /* AT THE TOP OF WHAT, exactly. This asked the SCREEN, which was right while
       every screen was itself the scroller. The Month tab is a fixed frame now
       whose scrolling happens in two troughs inside it, so its own scrollTop is
       0 forever and this gate could never decline: a downward drag inside a
       trough already scrolled 200px armed the pull, took the screen 32.7px down
       and reloaded the app mid-call, with the trough unable to scroll back.
       Measured on the live prototype before it shipped.
       So ask whatever is actually scrolling under this finger. `top` is the
       trough when there is one, the screen when there is not. */
    const top = (e.target.closest && e.target.closest(".calscroll,.listtrough")) || scr;
    if(!scr || !top || top.scrollTop > 0){ scr = null; return; }
    pullFrom = top;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX;
    armed = false; live = false; pull = 0;
  }, {passive:true});

  host.addEventListener("touchmove", e=>{
    if(y0 === null || !scr) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if(!live){
      // it only becomes a pull once it is clearly vertical and clearly downward,
      // so the tab swipe and ordinary scrolling both keep working
      if(dy < 12 || Math.abs(dx) > Math.abs(dy) * .8) { if(Math.abs(dx) > 10) y0 = null; return; }
      live = true; pulling = true;
      scr.classList.add("pulling"); scr.classList.remove("letgo");
    }
    if((pullFrom || scr).scrollTop > 0){ release(); return; }
    e.preventDefault();
    // resistance: the first pixels are free, the last ones are not
    const d = REACH * (1 - Math.exp(-Math.max(0, dy) / REACH));
    const was = armed;
    armed = d >= TRIP - 2;
    if(armed !== was){ ptr.classList.toggle("armed", armed); if(armed) haptic(10); }
    paint(d);
  }, {passive:false});

  host.addEventListener("touchend", release, {passive:true});
  host.addEventListener("touchcancel", release, {passive:true});
})();

/* horizontal swipe between screens */
(function(){
  let x0=null,y0=null;
  document.querySelector(".screens").addEventListener("touchstart",e=>{
    if(sheet.classList.contains("on")) return;
    // elements that own their own horizontal gesture keep it — the calendar's
    // press-and-sweep and the fortnight strip must not flip the tab
    /* Anything that scrolls sideways owns its own horizontal gesture. The
       building filter was added without being listed here, so dragging it
       along flipped to Month — the row moved AND the tab changed, which reads
       as the app losing the gesture rather than sharing it. */
    if(e.target.closest && e.target.closest(".cal, .nights, .deck, .roomfilt")){ x0=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.querySelector(".screens").addEventListener("touchend",e=>{
    if(x0===null || sweepLive || pulling) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6){
      const nx = Math.max(0, Math.min(SCREENS.length-1, curScreen + (dx<0?1:-1)));
      if(nx!==curScreen){ haptic(9); switchTo(nx); }
    }
    x0=null;
  },{passive:true});
})();

/* ── paging Pulse with a thumb ────────────────────────────────────────────────
   The deck was already excluded from the tab swipe, so a horizontal drag on
   these cards did nothing at all — dead gesture territory, claimed here with
   no conflict to resolve.

   It tracks the finger rather than waiting for the release, because a swipe
   that only reveals its answer afterwards is a guess. The deck follows at a
   third of the distance — enough to say "this moves" without pretending the
   next segment is already rendered — and refuses at the ends with a much
   shorter throw, which is how a phone says "nothing that way" without words. */
(function(){
  const deckIn = () => document.querySelector("#scr-trends .deck");
  let x0 = null, y0 = null, live = false, deck = null;
  const scr = document.getElementById("scr-trends");

  scr.addEventListener("touchstart", e=>{
    if(sheet.classList.contains("on")) return;
    if(!e.target.closest || !e.target.closest(".deck")) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    live = false; deck = deckIn();
  }, {passive:true});

  scr.addEventListener("touchmove", e=>{
    if(x0 === null || !deck) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!live){
      if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ x0 = null; return; }  // scrolling
      if(Math.abs(dx) < 12) return;
      live = true; deck.style.transition = "none";
    }
    const at = PULSE_SEGS.indexOf(pulseSeg);
    const wall = (dx > 0 && at === 0) || (dx < 0 && at === PULSE_SEGS.length - 1);
    deck.style.transform = "translateX(" + (dx / (wall ? 9 : 3)).toFixed(1) + "px)";
    if(e.cancelable) e.preventDefault();
  }, {passive:false});

  const release = e=>{
    if(x0 === null){ return; }
    const dx = (e.changedTouches ? e.changedTouches[0].clientX : x0) - x0;
    const d = deck;
    x0 = null;
    if(!live || !d) return;
    live = false;
    d.style.transition = "transform .3s var(--out)";
    d.style.transform = "";
    if(Math.abs(dx) > 56) pulseGo(dx < 0 ? 1 : -1);
  };
  scr.addEventListener("touchend", release);
  scr.addEventListener("touchcancel", release);
})();

/* Theme toggle. The head script owns the decision and the persistence; this is
   only the button, so the two can never disagree about what "current" means. */
const themeBtn = document.getElementById("themeBtn");
themeBtn.onclick = ()=>{
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  haptic(8);
};

/* Where you were. The hash carries the tab — switchTo writes it on every
   change — and sessionStorage carries the one thing the hash does not, which is
   which of Pulse's five segments you were reading. Set before the first render,
   so a reload repaints the place you were rather than flashing through Now. */
try{
  const seg = sessionStorage.getItem("vacancy.seg");
  if(seg && PULSE_SEGS.indexOf(seg) >= 0) pulseSeg = seg;
}catch(e){}
const deep = SCREENS.findIndex(s=>s.id === location.hash.replace("#",""));
switchTo(deep >= 0 ? deep : 0);

/* ══════════════════ wiring the cloud to the screen ════════════════════════ */
document.getElementById("acctBtn").onclick = ()=>{ haptic(9); openAccount(); };

/* ── prefilled sign-in, and why the password is not in this file ──────────────
   index.html is served from a public URL, so a password written here would be
   readable by anyone using view-source — it would hand the real book to the
   internet, permanently, since git history keeps it even after a delete. The
   details live in dev-login.js instead: gitignored, never deployed, and only
   fetched when the app is running locally.

   On a phone none of this is needed. Signing in once is remembered, and the
   inputs carry autocomplete="username" / "current-password" so the phone's own
   password manager fills them — which is the only place a password belongs. */
if(location.hostname === "localhost" || location.hostname === "127.0.0.1"){
  const s = document.createElement("script");
  s.src = "dev-login.js";
  s.onerror = ()=>{};                    // absent is the ordinary case
  document.head.appendChild(s);
}

(function(){
  const form = document.getElementById("gateForm");
  const go   = document.getElementById("gateGo");
  const errB = document.getElementById("gateErr");
  const fail = m => { errB.innerHTML = '<p class="err">' + esc(m) + '</p>'; };

  form.onsubmit = async ev=>{
    ev.preventDefault();
    const email = document.getElementById("gateEmail").value;
    const pass  = document.getElementById("gatePass").value;
    if(!email.trim() || !pass){ fail("Email and password, please."); return; }
    errB.textContent = ""; go.disabled = true; go.textContent = "Signing in…";
    try{
      await signIn(email, pass);
      document.getElementById("gatePass").value = "";
      closeGate(); refreshScreen(); haptic(14);
      toast("", "<b>Signed in.</b> " + NF + " flats, " + bookings().length
               + " bookings — the same book on every phone.", null);
    }catch(e){
      // the two failures worth telling apart: wrong details, and no signal
      fail(e.status === undefined
        ? "No connection. Check your signal and try again."
        : e.status === 400 || e.status === 401
          ? "That email and password did not match."
          : e.message);
      haptic([10,50,10]);
    }
    go.disabled = false; go.textContent = "Sign in";
  };
  document.getElementById("gateSkip").onclick = ()=>{
    haptic(9); jset(BROWSE_KEY, 1); closeGate();
    toast("", "<b>These bookings are invented.</b> Nothing here is Crescent Stays' real book — "
            + "tap <b>Demo data</b> at the top to sign in to that.", null);
  };
})();

/* Connectivity. navigator.onLine lies often enough that the queue is the real
   test — but it is a free hint that it is worth trying again now. */
addEventListener("online",  ()=>{ online = true;  paintAcct(); flush(); });
addEventListener("offline", ()=>{ online = false; paintAcct(); });

/* Coming back to the app is the moment the book is most likely to be stale —
   somebody else may have taken a room while the phone was in a pocket. */
/* ── MIDNIGHT ────────────────────────────────────────────────────────────────
   `today` is captured once, at load, and every date in the app is an integer
   offset from it. Added to the home screen this thing runs standalone: no
   address bar, no reload button, and no reason for the operator ever to close
   it. Left open across midnight, every date on screen is a day stale — and it
   gets worse than cosmetic, because save() stamps the stale day too. A booking
   taken at 00:30 for "tonight" is written against yesterday; the next real load
   shifts it by −1, and the row ends up holding no night at all. Verified:
   {start:-1, end:0} gives occ[fi][0] === 0 and freeRange(fi,0,1) === true. The
   booking is lost AND the flat reads free tonight, so it can be sold twice.

   There is no incremental fix — `today` is a const that hundreds of offsets
   hang off, and re-deriving them live is the whole of load(). So the app
   reloads itself, which is exactly what it would do if the operator had pulled
   to refresh, and the reload re-reads the clock from scratch.

   Two triggers, because neither alone is enough: a timer for the app sitting
   open and visible at midnight, and the visibility check for the far more
   common case of a phone that was asleep at midnight and is woken at 7am — a
   background tab's timers are throttled or suspended and cannot be relied on.

   flush() first where it applies: a reload with unsaved live edits pending
   would lose them, which is the failure this is meant to prevent. */
const dayStamp = () => { const d = new Date(); d.setHours(0,0,0,0); return +d; };
const bootDay = dayStamp();
let rolling = false;
function rolloverCheck(){
  if(rolling || dayStamp() === bootDay) return;
  rolling = true;
  try{ if(MODE === "live") flush(); save(); }catch(e){}
  location.reload();
}
function armMidnight(){
  const next = new Date(); next.setHours(24,0,0,0);
  /* +2s of slack: a timer that fires a hair early sees the old day, does
     nothing, and would not re-arm until the following midnight. */
  setTimeout(()=>{ rolloverCheck(); armMidnight(); },
             Math.max(1000, next - Date.now() + 2000));
}
armMidnight();

addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    rolloverCheck();
    if(MODE === "live"){ flush(); cloudPull().then(refreshScreen).catch(()=>{}); }
  }
});

paintAcct();
/* Sign-in is the front door. A phone that has never signed in, and whose owner
   has never said "just looking", meets it first — so nobody works a whole
   afternoon in invented bookings without knowing there is a real book. */
if(CLOUD_ENABLED && MODE !== "live" && !jget(BROWSE_KEY)) openGate();
if(MODE === "live"){
  // the cache already painted; correct it from the server, and if the session
  // has expired for good, fall back to the sample book rather than a dead app
  (async ()=>{
    try{
      await loadHost(); await cloudPull(); refreshScreen();
    }catch(e){
      if(e.status === 401 || e.status === 403){ signOut(false); openGate(); }
    }
    paintAcct();
  })();
}
</script>
