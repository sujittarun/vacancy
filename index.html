<!--
  DIRECTION CONTRACT — Vacancy

  THESIS: The vacant room is the lit one. Booked is recessed material sitting close to
  the ground; free is high-luminance and pops off it — he is hunting vacancy, so vacancy
  glows. Refuses the ledger world shipped previously (paper, ruling, stamps) and the
  category default of pastel booking pills on white.

  OWN-WORLD: Near-monochrome instrument. #08090C ground, layered charcoal surfaces,
  hairline structure, one amber accent (#FFA23A) reserved for now/live. Big tight-tracked
  tabular numerals. Radii step from 22px sheets down to 2px data cells. One spring curve.

  STORY: He glances and knows how full he is; a caller names dates and he answers in one
  sentence; he checks a month and sees which weekends are gone.

  FIRST VIEWPORT: Tonight — a 76px free-room count over an occupancy meter, the next
  seven nights as a scroll-snapped strip, then all forty rooms as a tile field.

  FORM: Three concepts the user selected (10 Glance, 6 Month, 9 Word) integrated as one
  app with a blurred bottom tab bar and a shared spring-up room sheet.
-->
<meta charset="utf-8">
<title>Vacancy — 45 apartments, four ways to read them</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#08090C">

<style>
/* ══════════════════════ tokens ══════════════════════ */
:root{
  --bg:#08090C; --surface:#101219; --surface-2:#181B24; --surface-3:#1F2330;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#FFFFFF; --txt-2:#98A1B5; --txt-3:#5C6579;
  --free:#EAEFF9; --free-ink:#0A0C11; --held:#1B1F2A; --held-ink:#69738A;
  --now:#FFA23A; --hot:#FF5F52;
  --bar:rgba(12,14,20,.72);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
  --spring:linear(0,.0088,.0352 2.2%,.1428 4.9%,.5106 12%,.6672,.7896,.8752,.9345 20.6%,.9707,.9955 26.2%,1.0122,1.0202 32.1%,1.0193 37.1%,1.0083 45.4%,1.0003 55.4%,.9986 71%,1);
  --out:cubic-bezier(.22,1,.36,1);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#ECEEF3; --surface-3:#E2E5ED;
    --line:rgba(9,11,16,.10); --line-2:rgba(9,11,16,.16);
    --txt:#0B0D13; --txt-2:#5A6377; --txt-3:#8A93A6;
    --free:#0B0D13; --free-ink:#FFFFFF; --held:#DDE1EA; --held-ink:#98A1B5;
    --now:#C96A00; --hot:#D93A2B;
    --bar:rgba(250,251,253,.78);
    --shadow:0 1px 2px rgba(9,11,16,.07), 0 12px 32px -12px rgba(9,11,16,.18);
    --shadow-sm:0 1px 2px rgba(9,11,16,.06), 0 4px 12px -4px rgba(9,11,16,.12);
  }
}
:root[data-theme="light"]{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#ECEEF3; --surface-3:#E2E5ED;
  --line:rgba(9,11,16,.10); --line-2:rgba(9,11,16,.16);
  --txt:#0B0D13; --txt-2:#5A6377; --txt-3:#8A93A6;
  --free:#0B0D13; --free-ink:#FFFFFF; --held:#DDE1EA; --held-ink:#98A1B5;
  --now:#C96A00; --hot:#D93A2B;
  --bar:rgba(250,251,253,.78);
  --shadow:0 1px 2px rgba(9,11,16,.07), 0 12px 32px -12px rgba(9,11,16,.18);
  --shadow-sm:0 1px 2px rgba(9,11,16,.06), 0 4px 12px -4px rgba(9,11,16,.12);
}
:root[data-theme="dark"]{
  --bg:#08090C; --surface:#101219; --surface-2:#181B24; --surface-3:#1F2330;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#FFFFFF; --txt-2:#98A1B5; --txt-3:#5C6579;
  --free:#EAEFF9; --free-ink:#0A0C11; --held:#1B1F2A; --held-ink:#69738A;
  --now:#FFA23A; --hot:#FF5F52;
  --bar:rgba(12,14,20,.72);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ui);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.5; overscroll-behavior:none;
}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--now);outline-offset:2px;border-radius:4px}

/* ══════════════════════ shell ══════════════════════ */
.app{position:fixed;inset:0;display:flex;flex-direction:column}

.topbar{
  position:relative;z-index:30;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;
  background:var(--bar);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
/* large title condenses on scroll — transform/opacity only, never layout */
.topbar h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.022em;flex:1;min-width:0;
  transform-origin:left center;transition:transform .34s var(--out);will-change:transform}
.topbar .sub{font-size:12px;color:var(--txt-3);font-weight:450;letter-spacing:0;display:block;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .26s var(--out)}
.topbar.tight h1{transform:scale(.84)}
.topbar.tight .sub{opacity:.5}
@media (prefers-reduced-motion:reduce){.topbar h1,.topbar .sub{transition:none}}
.ghost{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  background:var(--surface-2);font-size:12px;font-weight:550;color:var(--txt-2);
  border:1px solid var(--line);transition:transform .35s var(--spring), background .18s;
}
.ghost:active{transform:scale(.94);background:var(--surface-3)}

.screens{flex:1;min-height:0;position:relative}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:22px 20px calc(112px + var(--safe-b));
  display:flex;flex-direction:column;gap:30px;
  visibility:hidden;opacity:0;pointer-events:none;
}
.screen.on{visibility:visible;opacity:1;pointer-events:auto}
/* a scrolling flex column must not shrink its sections to fit — that clips
   any child with overflow:hidden (the calendar card) down to a sliver */
.screen > *{flex:0 0 auto}

/* staggered entry */
.screen.on > *{animation:rise .55s var(--out) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.screen.on > *:nth-child(1){animation-delay:.01s}
.screen.on > *:nth-child(2){animation-delay:.05s}
.screen.on > *:nth-child(3){animation-delay:.09s}
.screen.on > *:nth-child(4){animation-delay:.13s}
.screen.on > *:nth-child(5){animation-delay:.17s}
@media (prefers-reduced-motion:reduce){
  .screen.on > *{animation:fade .2s backwards}
  @keyframes fade{from{opacity:0}}
}

.tabbar{
  position:absolute;left:14px;right:14px;bottom:calc(12px + var(--safe-b));z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px;
  background:var(--bar);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--line-2);border-radius:17px;box-shadow:var(--shadow);
}
.tabbar button{
  padding:9px 4px 8px;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--txt-3);font-size:10.5px;font-weight:600;
  letter-spacing:.01em;transition:color .2s, background .3s var(--out);
}
.tabbar button .ic{width:19px;height:19px;display:block}
.tabbar button[aria-selected="true"]{color:var(--txt);background:var(--surface-2)}
.tabbar button:active{transform:scale(.95)}

/* ══════════════════════ primitives ══════════════════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm);overflow:hidden}
.lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 11px}
.sect .lbl:last-child, .sheet-s .lbl:last-child, .strip-k .lbl:not(:first-child){
  text-transform:none;letter-spacing:.005em;font-weight:500;font-size:11.5px}
.stack{display:flex;flex-direction:column}
.gap-l{gap:22px} .gap-m{gap:12px} .gap-s{gap:8px}

/* room tile — the atom of the whole app */
.tile{
  position:relative;border-radius:9px;padding:9px 8px 8px;text-align:left;
  background:var(--held);border:1px solid transparent;
  transition:transform .38s var(--spring), background .2s;
  min-height:56px;display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{transform:scale(.93)}
.tile b{display:block;font-size:13px;font-weight:620;letter-spacing:-.01em;color:var(--held-ink)}
.tile s{display:block;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--held-ink);opacity:.62;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.free{background:var(--free)}
.tile.free b{color:var(--free-ink)}
.tile.free s{color:var(--free-ink);opacity:.58}
/* a turnover room is let tonight — it just has to be cleaned first, so it reads
   as booked and carries a corner flag rather than a split fill that eats the text */
.tile.oos{background:repeating-linear-gradient(135deg,
  var(--held) 0 6px, color-mix(in srgb,var(--held) 55%, var(--bg)) 6px 12px)}
.tile.oos b, .tile.oos s{color:var(--held-ink)}
.tile.oos s{opacity:.9}
.tile.turn{background:var(--held)}
.tile.turn b{color:var(--held-ink)}
.tile.turn s{color:var(--now);opacity:1}
.tile.turn::after{content:"";position:absolute;top:0;right:0;width:17px;height:17px;
  background:var(--now);clip-path:polygon(100% 0,0 0,100% 100%);border-top-right-radius:9px}
/* an orphan night — free, but wedged between two bookings, so hard to sell */
.tile .flag{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;
  background:var(--now);box-shadow:0 0 0 2px var(--free)}

/* stay-length dial — reshapes the whole fortnight */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;background:var(--surface);
  border-radius:9px;box-shadow:var(--shadow-sm);transition:transform .44s var(--spring);
  pointer-events:none}
.seg button{position:relative;z-index:1;padding:9px 2px;font-size:12.5px;font-weight:600;
  letter-spacing:-.008em;color:var(--txt-3);transition:color .22s}
.seg button[aria-pressed="true"]{color:var(--txt)}
@media (prefers-reduced-motion:reduce){.seg-ind{transition:none}}

/* month key */
.key{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.keyitem{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt-2);line-height:1.4}
.keychip{flex:0 0 auto;width:34px;height:38px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);position:relative;display:grid;place-items:center}
.keychip u{text-decoration:none;font-size:15px;font-weight:680;letter-spacing:-.03em}
.keychip i{position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:2px;background:var(--surface-3)}
.keychip i b{display:block;height:100%;width:58%;border-radius:2px;background:var(--free)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;
  font-size:11px;font-weight:600;letter-spacing:.01em;background:var(--surface-2);color:var(--txt-2);
  border:1px solid var(--line);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--free) 14%,transparent);color:var(--txt);border-color:var(--line-2)}
.pill.warn{background:color-mix(in srgb,var(--hot) 15%,transparent);color:var(--hot);border-color:transparent}
.pill.now{background:color-mix(in srgb,var(--now) 16%,transparent);color:var(--now);border-color:transparent}

/* room list row, shared by Month + Ask + sheet */
.row{display:grid;grid-template-columns:60px 1fr auto;gap:11px;align-items:center;
  padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;
  transition:background .16s}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row .id{font-size:13.5px;font-weight:640;letter-spacing:-.02em;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--txt-2);line-height:1.35;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.move .meta em{white-space:normal;line-height:1.4}
.row.move{align-items:flex-start}
.row.move .id, .row.move .pill{margin-top:2px}
.row .meta b{color:var(--txt);font-weight:560}
.row .meta em{font-style:normal;display:block;color:var(--txt-3);font-size:11.5px;margin-top:2px}

.empty{padding:30px 20px;text-align:center;color:var(--txt-3);font-size:13px;line-height:1.55}

/* ══════════════════════ TONIGHT ══════════════════════ */
/* the day's operations — what actually has to happen, not another copy of the free count */
.ops{padding:2px 2px 0}
.ops-date{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.ops-date b{font-size:23px;font-weight:680;letter-spacing:-.032em}
.ops-date s{text-decoration:none;font-size:12.5px;color:var(--txt-3);font-weight:500}
.ops-row{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.op{padding:14px 8px 13px;text-align:left;position:relative;border-right:1px solid var(--line);
  transition:background .16s}
.op:last-child{border-right:0}
.op:active{background:var(--surface-2)}
.op b{display:block;font-size:30px;font-weight:690;letter-spacing:-.04em;line-height:1}
.op s{display:block;text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.055em;
  text-transform:uppercase;color:var(--txt-3);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op.zero b{color:var(--txt-3)}
.op.alert b{color:var(--now)}
.op.alert s{color:var(--now)}
.op .dot{position:absolute;top:12px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--now)}

.nights{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 20px 2px 0;margin:0 -20px 0 0;scrollbar-width:none}
.nights::-webkit-scrollbar{display:none}
.night{flex:0 0 78px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:10px 10px 11px;display:flex;flex-direction:column;gap:9px;
  transition:transform .38s var(--spring)}
.night:active{transform:scale(.95)}
.night .d{display:flex;align-items:baseline;justify-content:space-between;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-3)}
.night .d em{font-style:normal;font-size:11.5px;font-weight:650;letter-spacing:-.01em;
  text-transform:none;color:var(--txt-2);flex:0 0 auto}
.night.today .d em{color:var(--now)}
.night .n{font-size:25px;font-weight:680;letter-spacing:-.035em;line-height:1}
.night .t{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.night .t i{display:block;height:100%;background:var(--free);border-radius:2px}
.night.today{border-color:color-mix(in srgb,var(--now) 55%,transparent);
  background:color-mix(in srgb,var(--now) 8%,var(--surface))}
.night.today .d{color:var(--now)}
.night.full .n{color:var(--hot)}
.night.full .t i{background:var(--hot)}
.night.sel{border-color:var(--free);box-shadow:0 0 0 1px var(--free)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}

/* ══════════════════════ MONTH — perspective panels ══════════════════════ */
.monthbar{margin:-4px 2px 14px}
.mbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar i.sold{background:var(--free)}
.mbar i.soon{background:var(--now)}
.mcap{margin-top:8px;font-size:12px;color:var(--txt-3);line-height:1.45}
.mcap b{color:var(--txt);font-weight:650}
.mcap em{font-style:normal;color:var(--now)}

/* a date running emptier than its own weekday usually does */
.day.soft .fn{color:var(--now)}
.day.soft .gg i{background:var(--now)}
.day.soft::after{content:"";position:absolute;top:6px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--now)}

/* ══════════════════════ TRENDS — swipeable card deck ══════════════════════ */
/* A vertical stack, not a carousel. Horizontal decks hide their contents behind
   a gesture with no preview — you cannot tell what is there or how much. On a
   phone, vertical scroll is the native, discoverable motion; nothing hides. */
.deck{display:flex;flex-direction:column;gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:17px 16px 15px;display:flex;flex-direction:column;
  transition:opacity .5s var(--out), transform .55s var(--out)}
.tcard.pending{opacity:0;transform:translateY(12px)}
@media (prefers-reduced-motion:reduce){
  .tcard.pending{opacity:1;transform:none}
  .tcard{transition:none}
}
.tcard h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.018em}
.tcard .cap{margin:3px 0 15px;font-size:11.5px;color:var(--txt-3);letter-spacing:.01em}
.tcard .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.tcard .body > .act:first-child{border-top:0}
.tcard .said{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--txt-2)}
.tcard .said b{color:var(--txt)}
.tcard .said .hi{color:var(--now);font-weight:600}
/* bars grow from nothing as their section arrives — transform only, no layout */
.vbar .col i, .patrow .t i{transition:transform .75s var(--out)}
.vbar .col i{width:100%;transform-origin:bottom;transform:scaleY(var(--v,1))}
.patrow .t i{width:100%;transform-origin:left center;transform:scaleX(var(--v,1))}
.tcard.pending .vbar .col i{transform:scaleY(0)}
.tcard.pending .patrow .t i{transform:scaleX(0)}
@media (prefers-reduced-motion:reduce){
  .tcard.pending .vbar .col i{transform:scaleY(var(--v,1))}
  .tcard.pending .patrow .t i{transform:scaleX(var(--v,1))}
  .vbar .col i, .patrow .t i{transition:none}
}

/* opportunity tiles — a number and a label; the detail lives one tap away */
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;
  box-shadow:var(--shadow-sm);transition:transform .38s var(--spring)}
.opp:active{transform:scale(.96)}
.opp b{font-size:27px;font-weight:700;letter-spacing:-.04em;line-height:1}
.opp s{text-decoration:none;font-size:11px;color:var(--txt-2);line-height:1.3}
.opp.hot b{color:var(--now)}
.opp.zero b{color:var(--txt-3)}
.opp.zero s{color:var(--txt-3)}

/* When there is genuinely nothing to act on, one quiet line beats an empty
   card. It still confirms the check happened — silence alone is ambiguous. */
.allclear{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm)}
.allclear .tick{flex:0 0 auto;width:18px;height:18px;border-radius:50%;
  background:color-mix(in srgb,var(--free) 18%,transparent);display:grid;place-items:center;
  color:var(--free);font-size:11px;font-weight:700;margin-top:1px}
.allclear div{font-size:12.5px;line-height:1.5;color:var(--txt-2)}
.allclear b{color:var(--txt);font-weight:600}

/* the action feed — what to do, above everything you have to interpret */
.act{display:flex;gap:10px;align-items:center;padding:11px 14px;
  border-bottom:1px solid var(--line);width:100%;text-align:left}
.act:last-child{border-bottom:0}
.act:active{background:var(--surface-2)}
.act .mark{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--txt-3)}
.act.warn .mark{background:var(--hot)}
.act.good .mark{background:var(--now)}
.act .txt{flex:1;min-width:0}
.act > .pill{flex:0 0 auto;margin-top:1px}
.act .txt b{display:block;font-size:13.5px;font-weight:620;letter-spacing:-.012em;line-height:1.35;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);

const rng = mulberry32(20260806);

/* The real portfolio. `plan` lists unit types smallest-first so studios and smaller
   flats sit on the lower floors; `per` is units per floor. Flat numbers follow
   <floor><unit>, e.g. TT-101, LP-403. */
const BUILDINGS = [
  {code:"TT", name:"TreeTops",      short:"TreeTops",   per:4, plan:[["Studio",1],["2 BHK",1],["3 BHK",12]]},

  {code:"MP", name:"Madhapur",      short:"Madhapur",   per:2, plan:[["Studio",1],["3 BHK",3]]},
  {code:"BH", name:"Banjara Hills", short:"Banjara H",  per:3, plan:[["Studio",2],["2 BHK",10]]},
  {code:"LP", name:"Lotus Pond",    short:"Lotus Pond", per:3, plan:[["2 BHK",2],["3 BHK",10]]},
];
const RATE = {"Studio":[1600,2600], "2 BHK":[3000,4400], "3 BHK":[4200,6200]};
const NAMES = ["R. Menon","S. Kulkarni","A. Fernandes","D. Iyer","K. Bhatt","M. Sequeira","P. Rao",
  "T. Nayar","J. Dcosta","V. Shetty","N. Pillai","H. Chandra","L. Mathew","G. Saldanha","B. Kaur",
  "F. Noronha","Y. Deshpande","C. Varghese","E. Pinto","U. Reddy"];
const SRC = ["Airbnb","Direct call","Walk-in","Booking.com","Repeat guest"];

/* ── inventory ───────────────────────────────────────────────────────────────
   The flats are editable and persist on the device. Bookings are held against
   flat IDs, so renaming or removing a flat remaps them rather than corrupting
   them.                                                                        */
const INV_STORE = "vacancy.inventory.v1";
const UNIT_TYPES = ["Studio","1 BHK","2 BHK","3 BHK","4 BHK"];

function defaultInventory(){
  const out = [];
  BUILDINGS.forEach(b=>{
    const types = [];
    b.plan.forEach(([t,count])=>{ for(let k=0;k<count;k++) types.push(t); });
    types.forEach((type,idx)=>{
      const floor = Math.floor(idx / b.per) + 1;
      const unit  = (idx % b.per) + 1;
      const [lo,hi] = RATE[type];
      out.push({ id:`${b.code}-${floor}0${unit}`, code:b.code, bname:b.name, bshort:b.short,
                 floor, type, rate: lo + Math.round(rng()*(hi-lo)/100)*100 });
    });
  });
  return out;
}
function loadInventory(){
  try{
    const raw = localStorage.getItem(INV_STORE);
    if(!raw) return null;
    const rows = JSON.parse(raw);
    if(!Array.isArray(rows) || !rows.length) return null;
    return rows.filter(r => r && r.id && r.type);
  }catch(e){ return null; }
}
function saveInventory(){
  try{ localStorage.setItem(INV_STORE, JSON.stringify(
    flats.map(f=>({id:f.id, code:f.code, bname:f.bname, bshort:f.bshort,
                   floor:f.floor, type:f.type, rate:f.rate}))
  )); }catch(e){}
}

let flats = loadInventory() || defaultInventory();
flats.forEach(f=>{ f.pop = f.pop ?? (0.55 + rng()*0.45); });
let NF = flats.length;
let flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));

/* Swap the inventory and carry the bookings across by ID.
   `renames` maps old id -> new id so a renumbered flat keeps its bookings. */
function applyInventory(next, renames){
  renames = renames || {};
  const held = resv.map(r => {
    const was = flats[r.fi] && flats[r.fi].id;
    return {...r, _id: renames[was] || was};
  });
  flats = next;
  flats.forEach(f=>{ f.pop = f.pop ?? 0.6; });
  NF = flats.length;
  flatIndex = Object.fromEntries(flats.map((f,i)=>[f.id,i]));
  resv = held.filter(r => flatIndex[r._id] !== undefined)
             .map(r => { const {_id, ...rest} = r; return {...rest, fi:flatIndex[_id]}; });
  recompute(); saveInventory(); save();
}
/* ── perspective ─────────────────────────────────────────────────────────────
   An unsold night is perishable stock: once the date passes it can never be
   sold again. These turn the calendar from "what is" into "what is about to be
   lost", which is the thing an operator can still act on.                     */
function monthStats(days){
  let sold = 0, open = 0, openValue = 0, soon = 0, soonValue = 0, total = 0, blocked = 0;
  days.forEach(d=>{
    flats.forEach((f,i)=>{
      if(blk[i][d]){ blocked++; return; }        // out of service — not sellable, not sold
      total++;
      if(occ[i][d]) sold++;
      else { open++; openValue += f.rate; if(d < 7){ soon++; soonValue += f.rate; } }
    });
  });
  return {total, sold, open, openValue, soon, soonValue, blocked,
          pct: total ? sold/total : 0};
}

/* "22 free" tells you nothing on its own — is that a bad Saturday or a normal
   Tuesday? This compares each date against how that weekday usually runs, which
   is the one thing you cannot read off the raw count. */
/* ── trends ──────────────────────────────────────────────────────────────────
   All of this reads the forward book — the app has no past yet. Manual bookings
   now record the day they were taken (`bookedOn`), so genuine lead-time history
   accumulates from first use rather than being invented. */
const inHorizon = () => bookings().filter(r => r.end > 0 && r.start < DAYS);

/* How the book thins as you look further out. This is the honest version of
   "pace": it shows the booking window, so 30% five weeks out reads as normal
   rather than alarming. */
function bookingCurve(){
  const weeks = [];
  for(let w = 0; w*7 < DAYS; w++){
    let sold = 0, total = 0;
    for(let d = w*7; d < Math.min((w+1)*7, DAYS); d++)
      for(let i = 0; i < NF; i++){ if(blk[i][d]) continue; total++; if(occ[i][d]) sold++; }
    if(total) weeks.push({w, pct: sold/total});
  }
  return weeks;
}

function groupOcc(days, keyOf){
  const acc = new Map();
  flats.forEach((f,i)=>{
    const k = keyOf(f);
    if(!acc.has(k)) acc.set(k, {k, sold:0, total:0, units:0});
    acc.get(k).units++;
  });
  days.forEach(d=> flats.forEach((f,i)=>{
    if(blk[i][d]) return;                        // out of service leaves the denominator
    const a = acc.get(keyOf(f)); a.total++; if(occ[i][d]) a.sold++;
  }));
  return [...acc.values()].map(a=>({...a, pct: a.total ? a.sold/a.total : 0}))
                          .sort((x,y)=> x.pct - y.pct);
}

function stayMix(){
  const rs = inHorizon();
  const buckets = [{k:"1 night",lo:1,hi:1},{k:"2",lo:2,hi:2},{k:"3",lo:3,hi:3},
                   {k:"4–6",lo:4,hi:6},{k:"7+",lo:7,hi:999}];
  const out = buckets.map(b=>({...b, n: rs.filter(r=> r.nights>=b.lo && r.nights<=b.hi).length}));
  const alos = rs.length ? rs.reduce((s,r)=>s+r.nights,0) / rs.length : 0;
  return {out, alos, total: rs.length};
}

function sourceMix(){
  const rs = inHorizon(), m = new Map();
  rs.forEach(r=> m.set(r.src, (m.get(r.src)||0) + 1));
  return {rows: [...m.entries()].map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n), total: rs.length};
}

/* Same-day changeovers per day — this is the cleaning crew's week, and almost
   nothing at this scale surfaces it. */
function turnLoad(n){
  const out = [];
  for(let d = 0; d < n; d++) out.push({d, n: dayOps(d).turnovers.length});
  return out;
}

/* How broken up the empty time is. Ten scattered single nights are far harder
   to sell than one ten-night hole, and the raw vacancy count hides that. */
function fragmentation(){
  let runs = 0, orphans = 0, nights = 0;
  flats.forEach((f,fi)=>{
    let d = 0;
    while(d < DAYS){
      if(occ[fi][d]){ d++; continue; }
      let n = 0; while(d+n < DAYS && !occ[fi][d+n]) n++;
      if(d + n < DAYS){ runs++; nights += n; if(n === 1) orphans++; }
      d += n;
    }
  });
  return {runs, orphans, nights, avg: runs ? nights/runs : 0};
}

/* ── the cheapest booking you will ever take ─────────────────────────────────
   A guest is already in the flat. The night after they leave is empty. Asking
   them to stay one more night costs nothing — no listing, no commission, no
   clean between. When that empty stretch is bounded by the next booking, the
   extension fills the gap exactly, and a one-night gap is the orphan nobody
   can sell. No small-operator tool surfaces this; they all wait for demand to
   arrive instead of looking at who is already standing in the room.        */
const OPP_HORIZON = 14;              // opportunities are only actionable near-term

function extensionOffers(){
  const out = [];
  bookings().forEach(r=>{
    const e = r.end;                                  // check-out morning = first free night
    // you can only realistically make this offer to a guest whose stay is imminent —
    // a checkout a fortnight away is not a conversation you can have today
    if(e < 0 || e > 7) return;
    if(occ[r.fi][e]) return;                          // someone else already has that night
    let n = 0; while(e+n < DAYS && !occ[r.fi][e+n]) n++;
    if(!n) return;
    const bounded = e + n < DAYS;                     // a later booking closes the gap
    const inHouse = r.start <= 0 && r.end > 0;        // they are in the flat right now
    out.push({
      r, fi:r.fi, from:e, nights:n, bounded, inHouse,
      orphan: bounded && n === 1,
      score: (inHouse ? 100 : 0)
           + (bounded && n === 1 ? 70 : bounded && n <= 3 ? 40 : 0)
           + Math.max(0, 30 - e),                     // sooner beats later
    });
  });
  return out.sort((a,b)=> b.score - a.score);
}

/* ── blocks that outlive their reason ────────────────────────────────────────
   The expensive failure is not taking a flat out of service — it is forgetting
   to put it back. A flat marked "AC repair" in March is still blocked in June
   because nobody revisited it, quietly out of inventory the whole time. So the
   app asks, around the date the flat was due back, whether it actually is. */
function blockNudges(){
  const out = [];
  resv.filter(isBlock).forEach(r=>{
    const due = r.end;                       // first night back on sale
    if(due >= -7 && due <= 2){
      out.push({r, kind:"due", due,
        when: due < 0 ? `came back ${-due} day${-due>1?"s":""} ago`
            : due === 0 ? "comes back today"
            : due === 1 ? "comes back tomorrow"
            : `comes back in ${due} days`});
    } else if(due > 2 && r.nights >= 21){
      out.push({r, kind:"long", due,
        when: `out for ${r.nights} nights — ${Math.max(0, Math.min(due,DAYS))} still to come`});
    }
  });
  return out.sort((a,b)=> a.due - b.due);
}

/* Single empty nights wedged between two bookings, inside the fortnight. These
   are the nights nobody books at a normal rate, so they are the ones worth
   advertising cheap. */
function orphanNights(){
  const out = [];
  for(let d = 0; d < Math.min(OPP_HORIZON, DAYS); d++){
    flats.forEach((f,i)=>{
      if(occ[i][d]) return;
      const closedBefore = d === 0 || occ[i][d-1];
      const closedAfter  = d+1 < DAYS && occ[i][d+1];
      if(closedBefore && closedAfter) out.push({fi:i, d});
    });
  }
  return out.sort((a,b)=> a.d - b.d);
}

/* ── what actually belongs in a to-do list ───────────────────────────────────
   Only things that are true today or tomorrow, that stop being true if
   ignored, and that have one clear action. A standing condition — "16 orphan
   nights exist somewhere in the next fortnight" — is still 16 tomorrow, so it
   is analysis, not a task, and putting it here is what makes a list people
   stop reading. Everything longer-range lives in the sections below.        */
const NOW = 1;                       // today and tomorrow

function todayActions(){
  const acts = [];
  const norm = weekdayFreeNorm();
  const ids = rows => rows.slice(0,3).map(r=>flats[r.fi].id).join(", ")
              + (rows.length > 3 ? ` +${rows.length-3}` : "");

  // Maintenance stays one row per flat: each is a separate decision with its
  // own two answers, so grouping them would hide the thing you must act on.
  blockNudges().filter(n=>n.due <= NOW + 1).forEach(n=>{
    acts.push({rank:0, fi:n.r.fi, block:n.r, tone:"warn",
      title:`${flats[n.r.fi].id} · ${n.r.reason}`,
      body:`${n.when}${n.r.note ? " · " + n.r.note : ""}`, tag:"confirm"});
  });

  /* Everything else groups. One row per kind, with the flats a tap away —
     five near-identical rows saying "one night only" is a scroll, not a list. */
  for(let d=0; d<=NOW; d++){
    const turns = dayOps(d).turnovers.map(t=>({fi:t.fi, d,
      meta:`<b>${t.out.guest}</b> out, <b>${t.in.guest}</b> in<em>${fmtL(d)} · needs a clean between</em>`,
      pill:"clean"}));
    if(!turns.length) continue;
    acts.push({rank:1, tone:"warn", day:d,
      title: turns.length === 1 ? `${flats[turns[0].fi].id} · turnaround`
                                : `${turns.length} turnarounds ${d===0?"today":"tomorrow"}`,
      body: turns.length === 1 ? `${dayOps(d).turnovers[0].out.guest} out, ${dayOps(d).turnovers[0].in.guest} in`
                               : ids(turns),
      tag: d===0 ? "today" : "tomorrow",
      open: ()=> openFlatList(`${turns.length} turnaround${turns.length>1?"s":""}`,
              `${fmtL(d)} · check-out and check-in the same day`, turns)});
  }

  for(let d=0; d<=NOW; d++){
    const free = flats.map((f,i)=>i).filter(i=>!occ[i][d]);
    if(!free.length) continue;
    const soft = free.length - norm[dateAt(d).getDay()];
    const depth = d===0 ? 25 : 20;
    const rows = free.map(i=>({fi:i, d,
      meta:`<b>${flats[i].type}</b> · ${flats[i].bshort}<em>free ${runFrom(i,d)} night${runFrom(i,d)>1?"s":""} from ${fmt(d)}</em>`,
      pill:`−${depth}%`}));
    acts.push({rank: d===0 ? 2 : 4, day:d, tone: d===0 ? "good" : "",
      title:`${free.length} unsold ${d===0?"tonight":"tomorrow"}`,
      body: soft >= 2 ? `about ${Math.round(norm[dateAt(d).getDay()])} is normal for a ${DOWF[dateAt(d).getDay()]}`
                      : (d===0 ? "gone at midnight" : "one day left to sell"),
      tag:`−${depth}%`,
      open: ()=> openFlatList(`${free.length} unsold ${d===0?"tonight":fmt(d)}`,
              d===0 ? "gone at midnight" : "one day left to sell", rows,
              {head:`Rooms free ${fmtL(d)} — ${depth}% off`,
               lead:"These nights stop existing the morning after. Anything you take for them beats nothing."})});
  }

  const orph = orphanNights().filter(o=>o.d <= NOW).map(o=>({fi:o.fi, d:o.d,
    meta:`<b>${flats[o.fi].type}</b> · ${flats[o.fi].bshort}<em>${fmtL(o.d)} · booked either side</em>`,
    pill:"−25%"}));
  if(orph.length){
    acts.push({rank:3, tone:"good", day:orph[0].d,
      title: orph.length === 1 ? `${flats[orph[0].fi].id} · one night only`
                               : `${orph.length} one-night gaps`,
      body: orph.length === 1 ? `${fmtL(orph[0].d)} · booked either side` : ids(orph),
      tag:"−25%",
      open: ()=> openFlatList(`${orph.length} one-night gap${orph.length>1?"s":""}`,
              "booked either side · today and tomorrow", orph,
              {head:"One-night stays going cheap:",
               lead:"A single night between two bookings will not sell at a normal rate — most guests want two or more. The alternative is leaving it empty."})});
  }

  const ext = extensionOffers().filter(x=>x.from <= NOW + 1).map(x=>({fi:x.fi, d:x.from,
    meta:`Offer <b>${x.r.guest}</b> a discounted extra night<em>leaves ${fmt(x.from)} · ${x.nights} night${x.nights>1?"s":""} empty after</em>`,
    pill: x.orphan ? "closes a gap" : `+${x.nights}n`}));
  if(ext.length){
    acts.push({rank:5, day:ext[0].d,
      title: ext.length === 1 ? `${flats[ext[0].fi].id} · ${extensionOffers()[0].r.guest}`
                              : `${ext.length} guests leaving soon`,
      body: ext.length === 1 ? "empty night behind them — offer a discounted extension"
                             : ids(ext),
      tag:"extend",
      open: ()=> openFlatList(`${ext.length} extension offer${ext.length>1?"s":""}`,
              "guests leaving today or tomorrow", ext,
              {head:"Extend your stay at a reduced rate:",
               lead:"A discounted extra night beats an empty one, and costs no commission and no clean in between."})});
  }

  return acts.sort((a,b)=> a.rank - b.rank || (a.day||0) - (b.day||0));
}

/* One ranked list of things worth doing, newest problem first. The app should
   say what to do, not hand over charts to interpret. */
function actionFeed(){
  const acts = [];

  blockNudges().forEach(n=>{
    const fl = flats[n.r.fi];
    acts.push({kind:"block", urgency: n.kind==="due" ? 4 : 1, fi:n.r.fi, block:n.r,
      title:`${fl.id} · ${n.r.reason}`,
      body:`${n.when}${n.r.note ? " · " + n.r.note : ""}. Is it ready to sell again?`,
      tag: n.kind==="due" ? "confirm" : "long block",
      tone: n.kind==="due" ? "warn" : "", day: Math.max(0, n.due)});
  });

  dayOps(0).turnovers.forEach(t=>{
    acts.push({kind:"turn", urgency:3, fi:t.fi,
      title:`${flats[t.fi].id} · turnaround`,
      body:`${t.out.guest} out, ${t.in.guest} in — same day. Needs a clean between.`,
      tag:"today", tone:"warn", day:0});
  });

  return acts.sort((a,b)=> b.urgency - a.urgency || a.day - b.day);
}

function leadTimes(){
  const rs = resv.filter(r => typeof r.bookedOn === "number" && r.start >= r.bookedOn);
  if(!rs.length) return null;
  const days = rs.map(r => r.start - r.bookedOn).sort((a,b)=>a-b);
  return {n: days.length, median: days[Math.floor(days.length/2)],
          avg: days.reduce((a,b)=>a+b,0)/days.length};
}

function weekdayFreeNorm(){
  const acc = Array.from({length:7}, ()=>({sum:0,n:0}));
  for(let d=0; d<DAYS; d++){ const w = dateAt(d).getDay(); acc[w].sum += freeCount(d); acc[w].n++; }
  return acc.map(a => a.n ? a.sum/a.n : 0);
}
function softDates(norm){
  const out = [];
  const margin = Math.max(3, NF*0.09);
  for(let d=0; d<Math.min(DAYS,25); d++){          // only what there is still time to act on
    const f = freeCount(d), m = norm[dateAt(d).getDay()];
    if(f - m >= margin) out.push({d, free:f, norm:m, over:f-m});
  }
  return out.sort((a,b)=> b.over - a.over);
}

function weekdayPattern(days){
  const acc = Array.from({length:7}, ()=>({sold:0,total:0}));
  days.forEach(d=>{
    const w = dateAt(d).getDay();
    for(let i=0;i<NF;i++){ if(blk[i][d]) continue; acc[w].total++; if(occ[i][d]) acc[w].sold++; }
  });
  return acc.map(a => a.total ? a.sold/a.total : null);
}

function buildingSplit(days){
  return buildingsOf().map(b=>{
    const idx = flats.map((f,i)=>({f,i})).filter(o=>o.f.code===b.code).map(o=>o.i);
    let sold = 0, total = 0;
    days.forEach(d=> idx.forEach(i=>{ total++; if(occ[i][d]) sold++; }));
    return {...b, units:idx.length, pct: total ? sold/total : 0};
  }).sort((a,b)=> a.pct - b.pct);
}

const buildingsOf = ()=>{
  const seen = new Map();
  flats.forEach(f=>{ if(!seen.has(f.code)) seen.set(f.code, {code:f.code, name:f.bname, short:f.bshort}); });
  return [...seen.values()];
};

/* ── bookings ────────────────────────────────────────────────────────────────
   `resv` is the single source of truth. occ[] and chg[] are derived from it, so
   adding or cancelling a booking is just a mutation plus recompute().          */
let resv = [];
let occ = [], chg = [], blk = [];

/* A block is an entry with kind:"block" — a flat out of service for maintenance,
   a deep clean or owner use. It occupies nights exactly like a booking so it can
   never be sold, but it is NOT a booking: it has no guest, it is excluded from
   arrivals, departures, turnarounds, stay length, source mix and extensions, and
   for occupancy it leaves the denominator rather than joining the numerator —
   otherwise blocking a flat would flatter your occupancy figure. */
const isBlock = r => r.kind === "block";
const bookings = () => resv.filter(r => !isBlock(r));

function recompute(){
  occ = flats.map(()=>new Uint8Array(DAYS));
  chg = flats.map(()=>new Uint8Array(DAYS));
  blk = flats.map(()=>new Uint8Array(DAYS));
  resv.forEach(r=>{
    for(let k=Math.max(r.start,0); k<Math.min(r.end,DAYS); k++){
      occ[r.fi][k]=1;
      if(isBlock(r)) blk[r.fi][k]=1;
    }
  });
  // a night that is booked AND is somebody's check-out morning is a same-day
  // turnaround — blocks never create one
  bookings().forEach(r=>{
    if(r.end>=0 && r.end<DAYS && occ[r.fi][r.end] && !blk[r.fi][r.end]) chg[r.fi][r.end]=1;
  });
}

/* Demand is not flat, and a demo with no pattern in it makes the Month panels
   look like they have nothing to say. Weekends carry the week and locations
   differ — which is what the weekday and building views exist to surface. */
const DOW_DEMAND = [0.86, 0.58, 0.55, 0.60, 0.80, 1.25, 1.20];   // Sun … Sat
const BLD_DEMAND = {TT:1.05, TN:0.72, MP:1.35, BH:0.66, LP:1.10};

function generateDemo(){
  resv = [];
  flats.forEach((fl,fi)=>{
    const bF = BLD_DEMAND[fl.code] ?? 1;
    let d = -2 - Math.floor(rng()*8);        // stays already in progress, some checking out today
    while(d < DAYS){
      const dt = dateAt(Math.max(d,0));
      const dw = dt.getDay();
      // guests book close to the date, so the far weeks are genuinely thinner
      const lead = 0.34 + 0.66 * Math.exp(-Math.max(0,d)/26);
      if(rng() > fl.pop * bF * DOW_DEMAND[dw] * lead){ d += 1; continue; }
      let n;
      if(dw === 5)      n = 2 + (rng() < .35 ? 1 : 0);   // Friday arrivals cover the weekend
      else if(dw === 6) n = 1 + (rng() < .5  ? 1 : 0);
      else              n = 1 + Math.floor(rng()*3);
      if(rng() < .12)   n += 3 + Math.floor(rng()*5);    // the occasional long stay
      const start=d, end=d+n;
      // end >= 0 keeps stays that check out this morning — they are today's departures
      if(end>=0 && start<DAYS) resv.push({fi, start, end, nights:n,
        guest:NAMES[Math.floor(rng()*NAMES.length)], src:SRC[Math.floor(rng()*SRC.length)]});
      // a well-run short-let re-lets back-to-back roughly a third of the time,
      // which is exactly what creates a same-day turnaround
      d = end + (rng() < .3 ? 0 : 1 + Math.floor(rng()*4));
    }
  });
}

/* ── persistence ─────────────────────────────────────────────────────────────
   Stored against flat IDs, not array indexes, so the file can gain or lose flats
   without corrupting saved bookings. Dates are stored as offsets from the day
   they were saved and shifted on load, so "3 days out" stays 3 days out.       */
const STORE = "vacancy.bookings.v1";
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function save(){
  try{
    localStorage.setItem(STORE, JSON.stringify({
      savedOn: isoDay(today),
      rows: resv.map(r=>({ id:flats[r.fi].id, start:r.start, end:r.end,
                           guest:r.guest, src:r.src, manual:!!r.manual,
                           kind:r.kind, reason:r.reason, note:r.note,
                           bookedOn: typeof r.bookedOn === "number" ? r.bookedOn : undefined }))
    }));
  }catch(e){ /* private browsing or storage full — the session still works */ }
}

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.rows)) return false;
    const savedOn = new Date(d.savedOn + "T00:00:00");
    savedOn.setHours(0,0,0,0);
    const shift = Math.round((savedOn - today) / 86400000);
    resv = d.rows
      .filter(r => flatIndex[r.id] !== undefined)
      .map(r => ({ fi:flatIndex[r.id], start:r.start+shift, end:r.end+shift,
                   nights:r.end-r.start, guest:r.guest, src:r.src, manual:r.manual,
                   kind:r.kind, reason:r.reason, note:r.note,
                   bookedOn: typeof r.bookedOn === "number" ? r.bookedOn + shift : undefined }))
      // blocks are kept a little past their end date so the app can still ask
      // whether the flat actually came back into service
      .filter(r => r.start < DAYS && (r.kind === "block" ? r.end >= -7 : r.end >= 0));
    return true;
  }catch(e){ return false; }
}

let usingDemo = !load();
if(usingDemo) generateDemo();
recompute();

/* Refuses to double-book. The UI already hides the form on an unavailable flat,
   but a silent overlap is exactly the failure that loses a guest, so the data
   layer enforces it too rather than trusting the screen. */
function addBooking(fi, start, nights, guest, src){
  if(!(fi >= 0 && fi < NF)) return false;
  nights = Math.max(1, Math.min(nights|0, DAYS));
  if(start < 0 || start >= DAYS) return false;
  if(!freeRange(fi, start, start + nights)) return false;
  resv.push({ fi, start, end:start+nights, nights, manual:true, bookedOn:0,
              guest: (guest || "").trim() || "Guest", src: src || "Direct" });
  usingDemo = false;
  recompute(); save();
  return true;
}
const BLOCK_REASONS = ["Maintenance","Deep clean","Owner use","Renovation","Not ready"];

/* A block may overlap nothing else, same as a booking — you cannot take a flat
   out of service for nights a guest already holds. */
function addBlock(fi, start, nights, reason, note){
  if(!(fi >= 0 && fi < NF)) return false;
  nights = Math.max(1, Math.min(nights|0, DAYS));
  if(start < 0 || start >= DAYS) return false;
  if(!freeRange(fi, start, start + nights)) return false;
  resv.push({ fi, start, end:start+nights, nights, kind:"block", manual:true,
              reason: reason || "Maintenance", note: (note||"").trim(),
              guest: reason || "Out of service", src:"Block", bookedOn:0 });
  usingDemo = false;
  recompute(); save();
  return true;
}
/* Push an existing block further out — "the technician did not come". Extends
   as far as it can and reports how many nights it managed, because a guest may
   already hold some of them and silently doing nothing is the worst answer. */
function extendBlock(r, extraNights){
  if(!isBlock(r)) return 0;
  const from = Math.max(r.end, 0);          // a block that already lapsed resumes today
  let can = 0;
  while(can < Math.max(1, extraNights|0) && from + can < DAYS
        && !(occ[r.fi][from+can] && !blk[r.fi][from+can])) can++;
  if(!can) return 0;
  r.end = from + can;
  r.nights = r.end - r.start;
  recompute(); save();
  return can;
}
/* Bring a flat back into service now: end the block today. */
function releaseBlock(r){
  if(!isBlock(r)) return false;
  if(r.start >= 0){ cancelBooking(r); return true; }   // never started — just drop it
  r.end = 0; r.nights = r.end - r.start;
  recompute(); save();
  return true;
}

function cancelBooking(r){
  const i = resv.indexOf(r);
  if(i >= 0) resv.splice(i,1);
  recompute(); save();
}
function clearAll(){ resv = []; usingDemo = false; recompute(); save(); }
function resetDemo(){ generateDemo(); usingDemo = true; recompute(); save(); }

const freeRange = (fi,a,b)=>{ for(let d=a;d<b;d++){ if(d<0||d>=DAYS||occ[fi][d]) return false; } return true; };
const freeCount = d => { let n=0; for(let i=0;i<NF;i++) if(!occ[i][d]) n++; return n; };
const runFrom   = (fi,d)=>{ let n=0; while(d+n<DAYS && !occ[fi][d+n]) n++; return n; };
const occPct    = fi => { let sold=0, avail=0;
  for(let d=0;d<DAYS;d++){ if(blk[fi][d]) continue; avail++; if(occ[fi][d]) sold++; }
  return avail ? Math.round(sold/avail*100) : 0; };
const blockedOn = d => { let n=0; for(let i=0;i<NF;i++) if(blk[i][d]) n++; return n; };

const haptic = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}

/* ═══════════════ shared: room tile + list row ═══════════════ */
function roomTile(fi, day, stay){
  const fl = flats[fi];
  const nights = stay || 1;
  const open = freeRange(fi, day, day + nights);
  const blocked = blk[fi][day];
  const turn = chg[fi][day] && !open;
  const run = open ? runFrom(fi, day) : 0;
  const b = el("button","tile" + (open ? " free" : blocked ? " oos" : (turn ? " turn" : "")));
  const note = open
    ? (run >= DAYS-day ? `Free ${run}+n` : `Free ${run}n`)
    : blocked ? (resv.find(r=>isBlock(r) && r.fi===fi && day>=r.start && day<r.end)?.reason || "Blocked")
    : (turn ? "Turnaround" : "Booked");
  b.append(el("b",null,fl.id), el("s",null,note));
  if(open && run === 1) b.appendChild(el("i","flag"));   // orphan night
  b.setAttribute("aria-label",
    `${fl.id}, ${fl.type}, ${open ? `free for ${run} night${run>1?"s":""} from`
      : blocked ? "out of service on" : "not available on"} ${fmtL(day)}`);
  b.onclick = ()=>{ haptic(9); openSheet(fi, day); };
  return b;
}
function roomRow(fi, day, tail){
  const fl = flats[fi];
  const r = el("button","row");
  r.append(el("div","id",fl.id));
  const m = el("div","meta");
  m.innerHTML = `<b>${fl.type}</b> · ${fl.bshort}<em>Floor ${fl.floor}${tail ? " · " + tail : ""}</em>`;
  r.appendChild(m);
  const run = runFrom(fi, day);
  r.appendChild(el("span","pill good", run>=DAYS-day ? `${run}+ nights` : `${run} night${run>1?"s":""} free`));
  r.onclick = ()=>{ haptic(9); openSheet(fi, day); };
  return r;
}

/* ═══════════════ SCREEN 1 — ROOMS ═══════════════ */
const STRIP = 14;              // nights answerable without leaving this tab
const STAYS = [1,2,3,7];
let pickedNight = 0, stayNights = 1;
const countFreeFor = (d, n) => { let c=0; for(let i=0;i<NF;i++) if(freeRange(i,d,d+n)) c++; return c; };
const soonestFor = (n, from) => { for(let d=from; d<=DAYS-n; d++) if(countFreeFor(d,n)) return d; return -1; };

/* ── One move away ──────────────────────────────────────────────────────────
   When nothing is free for a stay, a hotel manager doesn't say no — they shuffle
   a room. This finds every stay you COULD take by relocating exactly one existing
   guest to a room that is free for their whole stay. Ranked so the move nobody
   notices (same building, same size) comes first.                              */
function roomMoves(a, b, pool){
  const out = [];
  pool.forEach(({f: fl, i: fi})=>{
    if(freeRange(fi, a, b)) return;                      // already free, no move needed
    const blockers = resv.filter(r => r.fi === fi && r.start < b && r.end > a);
    if(blockers.length !== 1) return;                    // two guests to move is not "one move"
    const B = blockers[0];
    if(B.start < 0) return;                              // already checked in — can't move them now
    let best = null;
    for(let j = 0; j < NF; j++){
      if(j === fi) continue;
      if(!freeRange(j, B.start, B.end)) continue;        // destination must take their whole stay
      const cand = {
        to: j,
        sameType: flats[j].type === fl.type,
        sameBuilding: flats[j].code === fl.code,
        biggerOrEqual: SIZE[flats[j].type] >= SIZE[fl.type],
      };
      cand.score = (cand.sameType ? 4 : 0) + (cand.sameBuilding ? 2 : 0) + (cand.biggerOrEqual ? 1 : 0);
      if(!best || cand.score > best.score) best = cand;
      if(cand.score === 7) break;
    }
    if(best) out.push({ frees: fi, booking: B, ...best });
  });
  return out.sort((x,y)=> y.score - x.score);
}
const SIZE = {"Studio":0, "1 BHK":1, "2 BHK":2, "3 BHK":3};

/* The operator's real morning question isn't "how many are free" — it's
   who is arriving, who is leaving, and which rooms have to be turned around
   between a checkout and a check-in on the same day. */
function dayOps(d){
  const arrivals = bookings().filter(r => r.start === d).sort((a,b)=> a.fi - b.fi);
  const departures = bookings().filter(r => r.end === d).sort((a,b)=> a.fi - b.fi);
  const arrivingIn = new Set(arrivals.map(r => r.fi));
  const turnovers = departures.filter(r => arrivingIn.has(r.fi))
    .map(r => ({ fi:r.fi, out:r, in:arrivals.find(a => a.fi === r.fi) }));
  return { arrivals, departures, turnovers };
}

/* ═══════════════ SCREEN 2 — MONTH ═══════════════ */
let monthOffset = 0, revealPanel = false;
/* One selection, always: `sel.a` is the arrival, `sel.n` the nights. A single
   night is just n = 1. `pendingStart` is set after the first of two taps. */
let sel = {a:0, n:1}, pendingStart = null;
let sweptJustNow = false, sweepLive = false;

/* Press-and-hold on a date, then drag: the calendar becomes a range picker and
   the readout above it counts rooms free for the WHOLE span as you move. This
   is the question a caller actually asks, answered by dragging a finger. */
function attachSweep(grid, hud){
  let hold = null, live = false, a = null, b = null;

  const cellAt = (x,y)=>{
    const e = document.elementFromPoint(x,y);
    return e && e.closest ? e.closest(".day[data-d]") : null;
  };
  const paint = ()=>{
    const lo = Math.min(a,b), hi = Math.max(a,b);
    grid.querySelectorAll(".day[data-d]").forEach(c=>{
      const d = +c.dataset.d;
      c.classList.toggle("rng", d > lo && d < hi);
      c.classList.toggle("rngA", d === lo);
      c.classList.toggle("rngB", d === hi && hi !== lo);
    });
    const nights = Math.max(1, hi - lo);
    const free = flats.filter((f,i)=>freeRange(i, lo, lo + nights)).length;
    hud.classList.add("on");
    const n = hud.querySelector(".n"), t = hud.querySelector(".t");
    n.textContent = free;
    n.classList.toggle("none", free === 0);
    t.innerHTML = `free for <b>all ${nights} night${nights>1?"s":""}</b><br>${fmt(lo)} → ${fmt(lo+nights)}`;
  };
  const clear = ()=>{
    grid.querySelectorAll(".rng,.rngA,.rngB").forEach(c=>c.classList.remove("rng","rngA","rngB"));
  };
  const begin = (cell)=>{
    live = true; sweepLive = true; a = b = +cell.dataset.d;
    grid.classList.add("sweeping");
    haptic(18); paint();
  };
  const move = (x,y)=>{
    if(!live) return;
    const cell = cellAt(x,y);
    if(cell){ const d = +cell.dataset.d; if(d !== b){ b = d; haptic(5); paint(); } }
  };
  /* Never leave the page in a half-swept state — a stuck `live` means every
     later touchmove calls preventDefault and the page stops scrolling. */
  const reset = ()=>{
    clearTimeout(hold);
    live = false; sweepLive = false;
    grid.classList.remove("sweeping");
  };
  const end = ()=>{
    const was = live, lo = Math.min(a,b), hi = Math.max(a,b);
    reset();
    if(!was) return;
    sel = {a: lo, n: Math.max(1, hi - lo)};
    pendingStart = null; sweptJustNow = true; revealPanel = true;
    haptic(16);
    setTimeout(()=>{ sweptJustNow = false; }, 350);
    renderMonth();
  };

  grid.addEventListener("touchstart", e=>{
    const cell = e.target.closest && e.target.closest(".day[data-d]");
    if(!cell) return;
    clearTimeout(hold);
    hold = setTimeout(()=>begin(cell), 260);
  }, {passive:true});
  grid.addEventListener("touchmove", e=>{
    if(!live){ clearTimeout(hold); return; }   // a real scroll — let it through
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  // bound on the window as well: a touch that ends off the grid must still clean up
  addEventListener("touchend", end, {passive:true});
  addEventListener("touchcancel", ()=>{ reset(); clear(); hud.classList.remove("on"); }, {passive:true});

  // desktop: hold the mouse down and drag
  grid.addEventListener("mousedown", e=>{
    const cell = e.target.closest && e.target.closest(".day[data-d]");
    if(!cell) return;
    clearTimeout(hold);
    hold = setTimeout(()=>begin(cell), 260);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = ()=>{ end(); removeEventListener("mousemove",mm); removeEventListener("mouseup",mu); };
    addEventListener("mousemove", mm); addEventListener("mouseup", mu);
  });
}
function monthList(){
  const out = [];
  for(let d=0; d<DAYS; d++){
    const dt = dateAt(d), k = dt.getFullYear()+"-"+dt.getMonth();
    if(!out.length || out[out.length-1].k!==k) out.push({k, y:dt.getFullYear(), m:dt.getMonth(), days:[]});
    out[out.length-1].days.push(d);
  }
  return out;
}
function goMonth(day){
  const ms = monthList();
  const dt = dateAt(day);
  const i = ms.findIndex(m=>m.y===dt.getFullYear() && m.m===dt.getMonth());
  if(i>=0) monthOffset = i;
  sel = {a:day, n:1}; pendingStart = null;
  switchTo(1);
}
function renderMonth(){
  const s = document.getElementById("scr-month");
  s.textContent = "";
  const ms = monthList();
  const mo = ms[Math.max(0,Math.min(ms.length-1,monthOffset))];

  const nav = el("div","mnav");
  const prev = el("button",null,"‹"), next = el("button",null,"›");
  prev.setAttribute("aria-label","Previous month"); next.setAttribute("aria-label","Next month");
  if(monthOffset<=0) prev.setAttribute("disabled","");
  if(monthOffset>=ms.length-1) next.setAttribute("disabled","");
  prev.onclick = ()=>{ monthOffset--; sel={a:ms[monthOffset].days[0],n:1}; pendingStart=null; haptic(8); renderMonth(); };
  next.onclick = ()=>{ monthOffset++; sel={a:ms[monthOffset].days[0],n:1}; pendingStart=null; haptic(8); renderMonth(); };
  nav.append(el("div","t", `${MONF[mo.m]} ${mo.y}`), prev, next);

  /* ── the shape of the month ───────────────────────────────────────────── */
  const st = monthStats(mo.days);
  const partial = mo.days[0] === 0 && dateAt(0).getDate() !== 1;
  const scope = partial ? `Rest of ${MONF[mo.m]}` : MONF[mo.m];

  /* One thin bar under the month title carries the whole month's fullness.
     Counted in room-nights, never money — the rates are not fixed. */
  const shape = el("div","monthbar");
  const bar = el("div","mbar");
  const iSold = el("i","sold"); iSold.style.width = (st.pct*100).toFixed(1)+"%";
  const iSoon = el("i","soon"); iSoon.style.width = (st.soon/st.total*100).toFixed(1)+"%";
  bar.append(iSold, iSoon);
  const cap = el("div","mcap");
  cap.innerHTML = `<b>${Math.round(st.pct*100)}%</b> occupied · ${st.open.toLocaleString("en-IN")} room-nights still open`
    + (st.soon ? `, <em>${st.soon} of them inside a week</em>` : "");
  shape.append(bar, cap);

  /* live readout while sweeping a range across the calendar */
  const hud = el("div","hud");
  hud.append(el("div","n"), el("div","t"));

  const norm = weekdayFreeNorm();
  const soft = softDates(norm);
  const softSet = new Set(soft.map(x=>x.d));

  const cal = el("div","card");
  cal.style.cssText = "padding:14px;background:transparent;border:0;box-shadow:none";
  const dow = el("div","dow");
  ["M","T","W","T","F","S","S"].forEach(d=>dow.appendChild(el("span",null,d)));
  const grid = el("div","cal");
  const lead = (dateAt(mo.days[0]).getDay()+6)%7;
  for(let i=0;i<lead;i++) grid.appendChild(el("div","day pad"));
  mo.days.forEach(d=>{
    const dt = dateAt(d), f = freeCount(d);
    const c = el("button","day");
    if(d===0) c.classList.add("today");
    if(f===0) c.classList.add("none");
    const lo = sel.a, hi = sel.a + sel.n;
    if(pendingStart === d)      c.classList.add("rngA");     // first of two taps
    else if(sel.n > 1){
      if(d === lo)              c.classList.add("rngA");
      else if(d === hi)         c.classList.add("rngB");
      else if(d > lo && d < hi) c.classList.add("rng");
    }
    else if(d === lo)           c.classList.add("sel");
    if(softSet.has(d)) c.classList.add("soft");
    c.append(el("div","dd",String(dt.getDate())), el("div","fn",String(f)));
    const g = el("div","gg"); const i = el("i");
    i.style.width = (f/NF*100).toFixed(0)+"%";
    g.appendChild(i); c.appendChild(g);
    c.setAttribute("aria-label", `${fmtL(d)}, ${f} of ${NF} rooms free`
      + (softSet.has(d) ? `, emptier than a typical ${DOWF[dt.getDay()]}` : ""));
    c.dataset.d = d;
    /* Two taps make a range, the way every booking site works: first tap is the
       arrival and shows that night, second tap sets the departure. */
    c.onclick = ()=>{
      if(sweptJustNow) return;
      if(pendingStart !== null && d > pendingStart){
        sel = {a: pendingStart, n: d - pendingStart};
        pendingStart = null;
      } else {
        sel = {a: d, n: 1};
        pendingStart = d;
      }
      revealPanel = true; haptic(9); renderMonth();
    };
    grid.appendChild(c);
  });
  cal.style.padding = "0";
  cal.append(dow, grid);
  attachSweep(grid, hud);

  const key = el("p","insight");
  key.style.padding = "0 2px";
  const worst = soft[0];
  key.innerHTML = `The figure is rooms <b>still free</b> that night — not rooms booked.`
    + (worst
       ? ` <span class="hi">An amber dot marks a date running emptier than that weekday normally does</span> — ${fmtL(worst.d)} has ${worst.free} free against about ${Math.round(worst.norm)} on a typical ${DOWF[dateAt(worst.d).getDay()]}. That is the part a count alone cannot tell you: a low number can still be a bad night, and a high one can be perfectly ordinary.`
       : ` Nothing in the next few weeks is running unusually empty for its weekday.`);

  const hint = el("p","sweephint");
  hint.innerHTML = pendingStart !== null
    ? `Arriving <b>${fmtL(pendingStart)}</b> — now tap the departure date. Tap an earlier one to start again.`
    : "<b>Tap arrival, then tap departure</b> to check a whole stay. One tap shows that night alone. You can also press and hold, then drag.";

  s.append(nav, shape, hud, cal, key, hint);

  /* one panel for whatever is selected — a single night is just n = 1 */
  {
    const {a, n} = sel;
    const free = flats.map((f,i)=>i).filter(i=>freeRange(i, a, a+n));
    const panel = el("div","stack gap-s");
    const h = el("div","sect");
    h.append(el("span","lbl", n === 1 ? fmtL(a) : `${fmt(a)} → ${fmt(a+n)}`),
             el("span","lbl", n === 1 ? `${free.length} of ${NF} free`
                                      : `${n} nights · ${free.length} free`));
    const list = el("div","card");
    if(!free.length){
      list.appendChild(el("div","empty", n === 1
        ? "Fully booked that night. Nothing left to sell."
        : `No flat is free for all ${n} nights. Ask can suggest moving one guest to open one up.`));
    }
    free.forEach(fi=> list.appendChild(roomRow(fi, a, null)));
    panel.append(h, list);
    s.appendChild(panel);
    if(revealPanel){
      revealPanel = false;
      requestAnimationFrame(()=> panel.scrollIntoView({behavior: calm?"auto":"smooth", block:"nearest"}));
    }
  }
}

/* ═══════════════ SCREEN 4 — TRENDS ═══════════════ */
function renderTrends(){
  const s = document.getElementById("scr-trends");
  s.textContent = "";
  const all = []; for(let d=0; d<DAYS; d++) all.push(d);

  const deck = el("div","deck");
  const card = (title, cap)=>{
    const c = el("div","tcard");
    c.append(el("h3",null,title), el("div","cap",cap));
    const b = el("div","body"); c.appendChild(b);

  const said = (c, html)=>{ const p = el("p","said"); p.innerHTML = html; c.appendChild(p); };

      t.appendChild(i);
      row.append(t, el("div","v", r.right));
      w.appendChild(row);
    });
    return w;
  };

  /* 0 — one card, today and tomorrow only. Maintenance and the flats worth
         discounting live together here; there is no second card. */
  const acts = todayActions();
  if(acts.length){
    const {c,b} = card("Worth doing now", `${acts.length} ${acts.length===1?"thing":"things"} · today and tomorrow`);
    b.style.justifyContent = "flex-start";
    acts.slice(0,6).forEach(a=>{

      row.appendChild(el("div","mark"));
      const t = el("div","txt");
      t.append(el("b",null,a.title), el("s",null,a.body));
      row.appendChild(t);
      row.appendChild(el("span","pill" + (a.tone==="warn"?" warn":a.tone==="good"?" now":""), a.tag));
      if(a.block){
        const ans = el("div","nudge");

        yes.onclick = ev=>{ ev.stopPropagation(); haptic(18); releaseBlock(a.block); refreshScreen(); };
        const no = el("button","nudgeBtn","Still out · +7 days");
        no.onclick = ev=>{
          ev.stopPropagation();
          const got = extendBlock(a.block, 7);
          haptic(got ? 14 : 30);
          if(got === 7){ refreshScreen(); return; }
          no.textContent = got ? `Held ${got} night${got>1?"s":""} — a guest has the rest`
                               : "A guest already has those nights";
          setTimeout(()=>refreshScreen(), 1800);
        };
        ans.append(yes, no);
        t.appendChild(ans);
      }
      row.onclick = ()=>{ haptic(10);
        if(a.open) a.open();
        else if(a.fi !== undefined) openSheet(a.fi, a.day || 0); };
      b.appendChild(row);
    });
    said(c, (acts.length > 6 ? `<b>${acts.length - 6} more below the first six.</b> ` : "")
      + `Only what is true today or tomorrow and stops being true if you ignore it. Anything longer-range is analysis, and sits further down.`);
  } else {

    line.appendChild(t);
    deck.appendChild(line);

  /* 1 — the booking curve */
  {
    const curve = bookingCurve();
    const {c,b} = card("How your book fills", "occupancy by week ahead");
    const near = curve[0], far = curve[curve.length-1];
    const head = el("div","headline");
    head.append(el("b",null, Math.round(near.pct*100)+"%"));
    head.append(el("s",null, `this week, falling to ${Math.round(far.pct*100)}% by week ${curve.length}`));
    b.appendChild(head);
    b.appendChild(vbars(curve.map((x,i)=>({v:x.pct, label:Math.round(x.pct*100)+"", k:"W"+(i+1)})), 0));
    const halfway = curve.findIndex(x=> x.pct < near.pct/2);
    const drop = near.pct - far.pct;
    said(c, `Bookings arrive close to the date, so the far weeks <b>should</b> look thin — that is the shape of a healthy book, not a problem. `
      + (halfway > 0
          ? `Yours halves by <span class="hi">week ${halfway+1}</span>, which is where your booking window really ends.`
          : drop > .12
            ? `Yours falls <span class="hi">${Math.round(drop*100)} points</span> across the nine weeks without halving — a longer window than most short-lets run.`
            : `Yours is <span class="hi">unusually flat</span> — the far weeks are filling about as well as the near ones, which usually means long stays rather than strong demand.`)
      + ` What matters is watching this curve week to week: a week that stops filling as it approaches is the one to act on.`);
  }

  /* 2 — which nights sell */
  {
    const wk = weekdayPattern(all);
    const {c,b} = card("Which nights sell", "occupancy by day of week");
    const order = [1,2,3,4,5,6,0];
    const worst = order.reduce((a,d)=> wk[d] < wk[a] ? d : a, order[0]);
    const best  = order.reduce((a,d)=> wk[d] > wk[a] ? d : a, order[0]);
    b.appendChild(vbars(order.map(d=>({v:wk[d], label:Math.round(wk[d]*100)+"", k:DOW[d][0]})),

  }

  /* 3 — by building */
  {
    const rows = groupOcc(all, f=>f.bname);
    const {c,b} = card("How each building is doing", "occupancy across the nine weeks");
    b.appendChild(hbars(rows.slice().reverse().map(r=>({k:r.k, pct:r.pct, right:Math.round(r.pct*100)+"%"})),
                        rows[0].k));
    const gap = Math.round((rows[rows.length-1].pct - rows[0].pct)*100);
    said(c, gap > 8
      ? `<b>${rows[0].k}</b> is <span class="hi">${gap} points behind</span> ${rows[rows.length-1].k}. Same city, same weeks — a gap that size is pricing, photos or listing reach, not demand.`
      : `All ${rows.length} buildings sit within ${gap} points of each other. Nothing here needs attention.`);
  }

  /* 4 — by unit type */
  {
    const rows = groupOcc(all, f=>f.type);
    const {c,b} = card("Which sizes sell", "occupancy by unit type");
    b.appendChild(hbars(rows.slice().reverse().map(r=>({k:`${r.k} · ${r.units} flat${r.units>1?"s":""}`,
      pct:r.pct, right:Math.round(r.pct*100)+"%"})), null));
    const lo = rows[0], hi = rows[rows.length-1];
    said(c, `Your <b>${hi.k}</b> stock runs at ${Math.round(hi.pct*100)}% while <b>${lo.k}</b> sits at <span class="hi">${Math.round(lo.pct*100)}%</span>. If the weak size is also the one you hold most of, that is where the portfolio is losing nights.`);
  }

  /* 5 — length of stay */
  {
    const m = stayMix();
    const {c,b} = card("How long people stay", `${m.total} bookings in the next nine weeks`);
    const head = el("div","headline");
    head.append(el("b",null, m.alos.toFixed(1)));

    const short = m.out[0].n / Math.max(1,m.total);
    said(c, `<span class="hi">${Math.round(short*100)}%</span> of your bookings are single nights. Every one is a full changeover — a clean, a key handover and a gap either side — for one night's income. Nudging the average from ${m.alos.toFixed(1)} to ${(m.alos+0.5).toFixed(1)} nights is usually worth more than filling extra dates.`);
  }

  /* 6 — where bookings come from */
  {
    const m = sourceMix();
    const {c,b} = card("Where bookings come from", `${m.total} bookings in the next nine weeks`);
    b.appendChild(hbars(m.rows.map(r=>({k:r.k, pct:r.n/Math.max(1,m.total),
      right:Math.round(r.n/Math.max(1,m.total)*100)+"%"})), null));
    const direct = m.rows.filter(r=>/direct|walk|repeat/i.test(r.k)).reduce((a,r)=>a+r.n,0);
    said(c, `<b>${Math.round(direct/Math.max(1,m.total)*100)}%</b> come to you directly — by phone, walk-in or a returning guest — and carry no platform commission. That share is the single number most worth growing, and it is the one the listing sites never show you.`);
  }

  /* 7 — turnaround load */
  {
    const load = turnLoad(14);
    const {c,b} = card("The cleaning week", "same-day turnarounds, next fortnight");
    const peak = load.reduce((a,x)=> x.n > a.n ? x : a, load[0]);

    b.appendChild(vbars(load.map(x=>({v:x.n, label:String(x.n),
      k: x.d===0 ? "T" : DOW[dateAt(x.d).getDay()][0]})), load.indexOf(peak)));
    said(c, peak.n > 0
      ? `<span class="hi">${fmtL(peak.d)}</span> is the heaviest, with ${peak.n} room${peak.n>1?"s":""} to turn between a check-out and a check-in. That is the day to have extra help booked, and almost nothing at this scale tells you it is coming.`
