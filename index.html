  const flatUid = (op.body && op.body.flat_id) || (mine && flats[mine.fi] && flats[mine.fi].uid);
  const code = mine && flats[mine.fi] ? flats[mine.fi].id
             : (flats.find(f => f.uid === flatUid) || {}).id || "That room";
  const a = (op.body && op.body.starts_on) || (mine && dayISO(mine.start));
  const b = (op.body && op.body.ends_on)   || (mine && dayISO(mine.end));
  const label = mine ? (mine.guest || "").trim() : "";

  rollBack(op);

  let who = "";
  try{
    const rows = await rest("GET", "/stays?select=guest_name,kind,reason,starts_on,ends_on"
      + "&flat_id=eq." + flatUid + "&starts_on=lt." + b + "&ends_on=gt." + a);
    if(rows && rows.length){
      const w = rows[0];
      const name = w.kind === "block" ? (w.reason || "Out of service") : (w.guest_name || "A guest");
      who = esc(name) + " holds " + esc(spanWords(w.starts_on, w.ends_on));
    }
  }catch(err){ /* offline again — the headline still stands without the name */ }

  toast("warn",
    "<b>" + esc(code) + " was taken.</b> "
    + (who ? who + " — entered on another phone. " : "Those nights went while you were typing. ")
    + (block ? "The block was not saved." : "Your booking" + (label ? " for " + esc(label) : "") + " was not saved."),
    mine ? mine.fi : null);
  haptic([12, 60, 12]);
}
/* "12–15 Aug", with the month said once, and the end date read as the morning
   they leave. A single night is just that night. */
function spanWords(a, b){
  const s = dayOff(a), e = dayOff(b);
  if(e - s === 1) return fmt(s);
  const ds = dateAt(s), de = dateAt(e);
  return ds.getMonth() === de.getMonth() ? ds.getDate() + "–" + fmt(e)   // 12–15 Aug
                                         : fmt(s) + "–" + fmt(e);       // 30 Aug–2 Sep
}

/* ── boot ─────────────────────────────────────────────────────────────────────
   In live mode the cache paints first and the network corrects it, so the app
   is usable in the time it takes to unlock the phone.                         */
let usingDemo = false;
if(MODE === "live"){
  if(!cacheLoad()) recompute();
}else{
  usingDemo = !load();
  if(usingDemo) seedRealBook();
  recompute();
}
/* THE SHAPE OF THE INVENTORY, ONCE PER LAUNCH. A stored inventory overrides the
   shipped one for the life of an install, so two people on the same build can be
   looking at different portfolios — which is precisely the confusion behind "I
   moved a guest to LP-3" when LP-3 exists in one of them and not the other. One
   row, no guest data, and the question is answerable without asking anybody to
   read a console. */
(async ()=>{
  try{
    await telStart();
    track("app_open", {
      flats: NF,
      /* the seed the build ships with, against what this device actually has */
      seedFlats: (typeof INVENTORY !== "undefined" ? INVENTORY.length : null),
      storedInventory: !!loadInventory(),
      demo: usingDemo, live: MODE === "live",
      bookings: resv.length,
      /* named because they are the flats the merge created; their presence or
         absence dates an install more precisely than any version string */
      hasMergedLotus: !!flats.find(f=> f.id === "LP-3"),
      hasOldLotus:    !!flats.find(f=> f.id === "LP-301"),
      theme: document.documentElement.getAttribute("data-theme") || "system",
    });
  }catch(e){}
})();

/* Refuses to double-book. The UI already hides the form on an unavailable flat,
   but a silent overlap is exactly the failure that loses a guest, so the data
   layer enforces it too rather than trusting the screen. */
/* ── money ────────────────────────────────────────────────────────────────────
   Three states, not two. Almost every booking tool stores "paid" and "unpaid",
   which marks a platform booking unpaid forever — the guest HAS paid, just not
   to the operator. Show a man a false "unpaid" twice and he stops reading the
   field. So a payment carries how it arrived, and 'Platform' means settled by
   the guest and owed to the operator by Airbnb or Booking.com.               */
/* Amounts arrive typed, pasted and dictated: "₹12,500", "12500 ", "1,200.50".
   Parsed defensively here rather than trusting each caller to have stripped it,
   because an amount silently dropped is money silently lost — and the failure
   is invisible until somebody reconciles a month and finds a hole. */
const toAmount = v => {
  if(typeof v === "number") return isFinite(v) ? Math.round(v) : 0;
  const n = parseFloat(String(v == null ? "" : v).replace(/,/g,"").replace(/[^\d.-]/g,""));
  return isFinite(n) ? Math.round(n) : 0;
};
const sum = (r, f) => (r.pays || []).reduce((s,p)=> f(p) ? s + p.amount : s, 0);
const paidOn     = r => sum(r, ()=>true);                       // settled by the guest
const inHand     = r => sum(r, p => p.method !== "Platform");    // actually received
const withPlatform = r => sum(r, p => p.method === "Platform");  // payout still to come
const dueFrom    = r => Math.max(0, (r.amount || 0) - paidOn(r));
const money = n => "₹" + Math.round(n).toLocaleString("en-IN");

function addPayment(r, amount, method, note){
  amount = toAmount(amount);
  if(!amount) return false;
  if(PAY_METHODS.indexOf(method) < 0) method = "Cash";
  const p = { id: uuid(), amount, method, on: 0, note: (note||"").trim() };
  (r.pays = r.pays || []).push(p);
  if(MODE === "live" && r.sid)
    enqueue({k:"pay+", id:p.id, body:{stay_id:r.sid, amount, method,
      received_on: dayISO(0), note: p.note || null, created_by: session && session.uid}});
  save(); cacheSave();
  logAct("paid", `Took ${money(amount)} from ${r.guest || "a guest"} · ${method} · ${flatLabel(r.fi)}`,
    {flat: flatLabel(r.fi), guest: r.guest});
  return true;
}
function dropPayment(r, p){
  const i = (r.pays || []).indexOf(p);
  if(i < 0) return;
  r.pays.splice(i, 1);
  if(MODE === "live" && p.id){
    const flying = inflight && inflight.id === p.id;
    const queued = queue.some(op => op.id === p.id && op !== inflight);
    queue = queue.filter(op => op.id !== p.id || op === inflight);
    jset(QUEUE_KEY, queue);
    if(queued && !flying) paintAcct(); else enqueue({k:"pay-", id:p.id});
  }
  save(); cacheSave();
  logAct("unpaid", `Removed ${money(p.amount)} from ${r.guest || "a guest"} · ${p.method}`
    + ` · ${flatLabel(r.fi)}`, {flat: flatLabel(r.fi), guest: r.guest});
}

function addBooking(fi, start, nights, guest, src, extra){
  if(!(fi >= 0 && fi < NF)) return false;
  nights = Math.max(1, Math.min(nights|0, DAYS));
  if(start < 0 || start >= DAYS) return false;
  if(!freeSpan(fi, start, start + nights)) return false;
  extra = extra || {};
  const amount = toAmount(extra.amount);
  const row = { fi, start, end:start+nights, nights, manual:true, bookedOn:0,
                guest: (guest || "").trim() || "Guest", src: src || "Direct",
                phone: (extra.phone || "").trim() || undefined,
                pax: extra.pax > 0 ? extra.pax|0 : undefined,
                amount: amount || undefined, pays: [] };
  if(MODE === "live"){
    row.sid = uuid();
    enqueue({k:"stay+", id:row.sid, body:{
      flat_id: flats[fi].uid, kind:"booking",
      starts_on: dayISO(start), ends_on: dayISO(start + nights),
      guest_name: row.guest, source: row.src, booked_on: dayISO(0),
      guest_phone: row.phone || null, pax: row.pax || null, amount: amount || null,
      rate: flats[fi].rate || null, created_by: session && session.uid }});
  }
  resv.push(row);
  // A platform booking is already settled by the guest. Recording that here is
  // not an assumption, it is what happened — and it is the difference between a
  // payment column the operator trusts and one he learns to ignore.
  if(amount && PLATFORMS.indexOf(row.src) >= 0) addPayment(row, amount, "Platform");
  usingDemo = false;
  recompute(); save(); cacheSave();
  track("booking_added", {nights, priced: !!amount, src: row.src || null,
                          ahead: start > 0, live: MODE === "live"});
  logAct("book", `Booked ${guest} into ${flatLabel(fi)} · ${fmt(start)}–${fmt(start+nights)}`
    + ` · ${nights} night${nights>1?"s":""}` + (amount ? ` · ${money(amount)}` : " · no amount"),
    {flat: flatLabel(fi), guest});
  return true;
}

/* ══════════════ what broke, and who fixed it ════════════════════════════════
   No new tab, no work-order register, no asset list to populate. A block
   already IS the work order — the flat is out, there is a reason, a note and a
   span of nights. It gains two taps: what broke, and who is fixing it.

   Everything the operator actually wants is then derived, not stored, and it
   surfaces at the moment the flat goes out again rather than in a dashboard
   nobody opens.                                                              */
/* People, remembered from use. Independent electricians and plumbers, not
   firms — so the only identity is a name and a number worth keeping, because
   the point of the number is to ring it. */
function fixers(){
  const seen = new Map();
  const credit = (name, phone, cost, at)=>{
    if(!name || !name.trim()) return;
    const k = name.trim().toLowerCase();
    const g = seen.get(k) || {name:name.trim(), phone:phone || "", jobs:0,
                              back:0, spend:0, lastAt:-9999};
    g.jobs++;
    g.spend += cost || 0;
    if(phone) g.phone = phone;
    if(at > g.lastAt){ g.lastAt = at; g.name = name.trim(); }
    seen.set(k, g);
  };
  resv.filter(r => isBlock(r) && r.fixer)
      .forEach(r=> credit(r.fixer, r.fixer_phone, r.cost, r.start));
  /* Work done while the flat stayed on sale counts too. Without this, whoever
     only ever fixes things in the gaps — the person costing you nothing —
     had no record at all, and the crew list could never suggest them. */
  issues.filter(x => x.fixed != null && x.fixer)
        .forEach(x=> credit(x.fixer, x.fixer_phone, x.cost, x.fixed));
  // a job "came back" when the same flat had the same fault again soon after
  resv.filter(r => isBlock(r) && r.fault).forEach(r=>{
    const prev = priorFault(r.fi, r.fault, r.start);
    if(prev && prev.fixer && r.start - prev.end <= HELD_WINDOW){
      const g = seen.get(prev.fixer.trim().toLowerCase());
      if(g) g.back++;
    }
  });
  return [...seen.values()].sort((a,b)=> (b.back/b.jobs) - (a.back/a.jobs) || b.jobs - a.jobs);
}

/* ── things wrong with a flat that is still sellable ──────────────────────────
   Most maintenance never justifies losing a night. Keeping these separate from
   blocks is what stops the app from quietly teaching the operator to take a
   good flat off the market just to leave himself a note.                     */
/* `fixed` is a day offset, and today is 0 — which is falsy. Testing it with !x
   would leave anything fixed TODAY sitting on the open list, on the one day the
   operator is most likely to look at it. */
const openIssues = fi => issues.filter(x => x.fixed == null && (fi == null || x.fi === fi))
                               .sort((a,b)=> URGENCY.indexOf(b.urgency) - URGENCY.indexOf(a.urgency)
                                          || a.on - b.on);

function addIssue(fi, fault, note, urgency){
  logAct("fault", `Logged ${fault || "a fault"} in ${flatLabel(fi)}`
    + (urgency === "urgent" ? " · urgent" : ""), {flat: flatLabel(fi)});
  if(!(fi >= 0 && fi < NF)) return false;
  const row = {id: uuid(), fi, fault: fault || undefined, note: (note||"").trim(),
               urgency: URGENCY.indexOf(urgency) >= 0 ? urgency : "soon", on: 0, fixed: null};
  issues.push(row);
  if(MODE === "live") enqueue({k:"iss+", id:row.id, body:{
    flat_id: flats[fi].uid, fault: row.fault || null, note: row.note || null,
    urgency: row.urgency, reported_on: dayISO(0), created_by: session && session.uid}});
  save(); cacheSave();
  return true;
}
function closeIssue(x, fixer, phone, cost){
  x.fixed = 0; x.fixer = (fixer||"").trim() || undefined;
  x.fixer_phone = (phone||"").trim() || undefined;
  x.cost = toAmount(cost) || undefined;
  track("issue_closed", {fault: x.fault || null, billed: !!x.cost, fi: x.fi});
  logAct("fixed", `Closed ${x.fault || "a fault"} in ${flatLabel(x.fi)}`
    + (x.fixer ? ` · ${x.fixer}` : "") + (x.cost ? ` · ${money(x.cost)}` : " · no bill"),
    {flat: flatLabel(x.fi)});
  if(MODE === "live") enqueue({k:"iss~", id:x.id, body:{
    fixed_on: dayISO(0), fixer: x.fixer || null,
    fixer_phone: x.fixer_phone || null, cost: x.cost || null}});
  save(); cacheSave();
}
function dropIssue(x){
  logAct("fault", `Dropped ${x.fault || "a fault"} in ${flatLabel(x.fi)} without a repair`,
    {flat: flatLabel(x.fi)});
  const i = issues.indexOf(x);
  if(i >= 0) issues.splice(i, 1);
  if(MODE === "live") enqueue({k:"iss-", id:x.id});
  save(); cacheSave();
}

/* The reason this belongs in a booking app rather than a maintenance one: the
   flat's empty nights are already known, so several small jobs can be pointed
   at one visit in a gap the flat was going to sit idle through anyway. One trip
   for the electrician instead of three, and no night lost to any of them. */
function batchWindow(fi, minNights){
  const want = Math.max(1, minNights || 1);
  for(let d = 0; d < DAYS; d++){
    if(occ[fi][d]) continue;
    let n = 0; while(d + n < DAYS && !occ[fi][d + n]) n++;
    if(n >= want) return {from: d, nights: n};
    d += n;
  }
  return null;
}

/* The most recent earlier block on this flat for this same fault. */
function priorFault(fi, fault, before){
  if(!fault) return null;
  return resv.filter(r => isBlock(r) && r.fi === fi && r.fault === fault && r.start < before)
             .sort((a,b)=> b.start - a.start)[0] || null;
}

/* The line shown the instant a fault is chosen. This is the feature: not a
   report, a sentence at the moment the flat goes out of service again. */
function faultHistory(fi, fault, before){
  const past = resv.filter(r => isBlock(r) && r.fi === fi && r.fault === fault
                                && r.start < (before == null ? DAYS : before))
                   .sort((a,b)=> b.start - a.start);
  if(!past.length) return null;
  const last = past[0];
  const gap = Math.max(0, (before == null ? 0 : before) - last.end);
  return {times: past.length + 1, last, gap,
          insideHold: !!last.fixer && gap <= HELD_WINDOW,
          recent: past.filter(r => (before == null ? 0 : before) - r.end <= REPEAT_WINDOW).length + 1};
}

/* What a spell out of service really cost: the bill plus the nights it took
   off the market. Operators consistently see only the first half, and it is
   the half that is usually smaller. */
function outageCost(r){
  /* The whole spell, not just the part still ahead. bill was summed over every
     retained block while nights were clamped to today forward, so one figure
     mixed full-history invoices with horizon-only nights — a finished outage
     reported 0 nights lost while its invoice still counted, and the total
     shrank a little every day for facts that had not changed. */
  const nights = Math.max(0, r.end - r.start);
  const lost = nights * ((flats[r.fi] && flats[r.fi].rate) || 0);
  return {nights, lost, bill: r.cost || 0, total: (r.cost || 0) + lost};
}

/* A block may overlap nothing else, same as a booking — you cannot take a flat
   out of service for nights a guest already holds. */
function addBlock(fi, start, nights, reason, note, extra){
  if(!(fi >= 0 && fi < NF)) return false;
  nights = Math.max(1, Math.min(nights|0, DAYS));
  if(start < 0 || start >= DAYS) return false;
  if(!freeSpan(fi, start, start + nights)) return false;
  extra = extra || {};
  const row = { fi, start, end:start+nights, nights, kind:"block", manual:true,
                reason: reason || "Maintenance", note: (note||"").trim(),
                fault: extra.fault || undefined,
                fixer: (extra.fixer || "").trim() || undefined,
                fixer_phone: (extra.phone || "").trim() || undefined,
                cost: toAmount(extra.cost) || undefined,
                guest: reason || "Out of service", src:"Block", bookedOn:0 };
  if(MODE === "live"){
    row.sid = uuid();
    enqueue({k:"stay+", id:row.sid, body:{
      flat_id: flats[fi].uid, kind:"block",
      starts_on: dayISO(start), ends_on: dayISO(start + nights),
      reason: row.reason, note: row.note || null, source:"Block",
      fault: row.fault || null, fixer: row.fixer || null,
      fixer_phone: row.fixer_phone || null, cost: row.cost || null,
      booked_on: dayISO(0), created_by: session && session.uid }});
  }
  resv.push(row);
  usingDemo = false;
  recompute(); save(); cacheSave();
  logAct("block", `${flatLabel(fi)} out of service · ${row.reason}`
    + ` · ${fmt(start)}–${fmt(start+nights)}`
    + (row.fault ? ` · ${row.fault}` : "") + (row.cost ? ` · ${money(row.cost)}` : ""),
    {flat: flatLabel(fi)});
  return true;
}
/* Push an existing block further out — "the technician did not come". Extends
   as far as it can and reports how many nights it managed, because a guest may
   already hold some of them and silently doing nothing is the worst answer. */
function extendBlock(r, extraNights){
  if(!isBlock(r)) return 0;
  const from = Math.max(r.end, 0);          // a block that already lapsed resumes today
  let can = 0;
  while(can < Math.max(1, extraNights|0) && from + can < DAYS
        && !occ[r.fi][from+can]) can++;
  if(!can) return 0;
  r.end = from + can;
  r.nights = r.end - r.start;
  if(MODE === "live" && r.sid)
    enqueue({k:"stay~", id:r.sid, body:{ends_on: dayISO(r.end)}});
  recompute(); save(); cacheSave();
  return can;
}
/* How many more nights this block could take before it would run into a guest.
   The slider is capped at this, so you can never drag a block over a booking. */
function maxExtend(r){
  const from = Math.max(r.end, 0);
  let n = 0;
  /* !occ, not !(occ && !blk). The old test read "free, OR held by a block" —
     and since `from` starts past this block's own end, the only block it can
     ever wave through is a DIFFERENT one. So "keep it out longer" would run
     straight over a second spell, leave two blocks holding the same nights,
     count those nights twice in Upkeep and hide the second one on the
     calendar. freeRange has always used the plain test; match it. */
  while(n < 30 && from + n < DAYS && !occ[r.fi][from+n]) n++;
  return n;
}

/* Bring a flat back into service now: end the block today. */
function releaseBlock(r, done){
  if(!isBlock(r)) return false;
  /* Who actually turned up and what they charged. The creation form records who
     was LINED UP; this overwrites it only when a name was given, so backing out
     of the question cannot erase what was already known.
     This runs FIRST now. It used to sit below the drop-it branch, so releasing a
     block that starts TODAY deleted the row before ever reading the name and the
     bill the operator had just typed into the close form — the work, the person
     and the invoice all vanished, and in live mode a `stay-` went with them. */
  if(done){
    if((done.fixer || "").trim())  r.fixer = done.fixer.trim();
    if((done.phone || "").trim())  r.fixer_phone = done.phone.trim();
    const paid = toAmount(done.cost);
    if(paid) r.cost = paid;
  }
  /* > 0, not >= 0: a block that starts TODAY has started. Only one that has not
     begun yet is a plan to drop; one that began this morning is work that
     happened and has a bill attached.

     But "has not begun" is not the same as "never happened", and the drop was
     still destroying evidence. A block starting TOMORROW appears on the decide
     board the moment it is created — blockNudges admits anything due within
     [-7,+2] regardless of whether the work has started — so the operator is
     asked "Is TT-102 back in service?" about an outage that has not begun,
     answers it, types ₹4,500 into "What it cost", and the row is deleted with
     the invoice, the fault and the fixer's job on it. Measured: Ramesh went
     from 4 jobs to 3, and nothing on screen said a record had been destroyed.

     So the drop is now only for a plan with nothing recorded against it. The
     moment the close form supplies a fixer or a cost, the operator is telling
     us the work is real, and a real job is closed out rather than deleted —
     zero nights long, so it blocks nothing, but present where Upkeep, fixers()
     and the repeat-fault history can still read it.

     The board itself is fixed separately: it should not be asking about an
     outage that has not started. This is the second line of defence, because
     the first one only has to be wrong once for the bill to be gone. */
  const recorded = !!(r.fixer || r.cost || r.fault);
  if(r.start > 0 && !recorded){ cancelBooking(r); return true; }
  if(r.start > 0){
    r.end = r.start; r.nights = 0;
    /* and tell the server, which the branch above (cancelBooking → stay-) and
       the fall-through (stay~) both do. Inserted as an early return between two
       enqueueing paths, this one reproduced the local half and not the remote
       half — so the flat would come back on this phone and stay out of service
       on every other one, with the fixer and the bill lost. Latent while
       CLOUD_ENABLED is false; it ships the moment that flag flips. */
    if(MODE === "live" && r.sid)
      enqueue({k:"stay~", id:r.sid, body:{ends_on: dayISO(r.start),
        fixer: r.fixer || null, fixer_phone: r.fixer_phone || null, cost: r.cost || null}});
    recompute(); save(); cacheSave(); return true;
  }
  /* Math.min, because releasing must never push the end FORWARD. blockNudges
     offers anything ending within [-7,+2], so a block that came back three days
     ago is on the list — and a flat `r.end = 0` there re-marked the flat out of
     service for those three nights, up to and including tonight. On a flat a
     guest had since checked into, that produced a block overlapping a real
     booking, which is a state nothing else in this app can create. */
  r.end = Math.min(r.end, 0); r.nights = r.end - r.start;
  if(MODE === "live" && r.sid)
    enqueue({k:"stay~", id:r.sid, body:{ends_on: dayISO(0),
      fixer: r.fixer || null, fixer_phone: r.fixer_phone || null, cost: r.cost || null}});
  recompute(); save(); cacheSave();
  return true;
}

/* Move a guest to another flat, same nights. The one operation in the app that
   changes something a guest has already been told — which is why it is the only
   one that asks first, and why the screen shows them travelling rather than a
   record quietly updating. */
function moveBooking(r, toFi){
  if(isBlock(r) || !(toFi >= 0 && toFi < NF) || toFi === r.fi) return false;
  const from = Math.max(r.start, 0);
  /* THE REFUSAL IS THE INTERESTING HALF. "I moved a guest and the flat still
     shows open" is either a move that never happened or one that did not stick,
     and only the first leaves a trace unless the refusal says so out loud. */
  if(!freeRange(toFi, from, r.end)){
    track("move_refused", {from: r.fi, to: toFi, start: r.start, end: r.end,
                           openEnd: !!r.openEnd, span: r.end - from, nf: NF});
    logAct("refused", `Could not move ${r.guest || "a booking"} to ${flatLabel(toFi)}`
      + ` — it is not free for ${fmt(from)}–${fmt(r.end)}`, {flat: flatLabel(toFi), guest: r.guest});
    return false;                                      // somebody took it meanwhile
  }
  const wasFi = r.fi;
  r.fi = toFi;
  if(MODE === "live" && r.sid)
    enqueue({k:"stay~", id:r.sid, body:{flat_id: flats[toFi].uid}});
  recompute(); save(); cacheSave();
  /* Ids as well as indexes: an index is meaningless in a log once the inventory
     changes shape underneath it, which is exactly the failure being hunted. */
  logAct("move", `Moved ${r.guest || "a booking"} from ${flatLabel(wasFi)} to ${flatLabel(toFi)}`
    + ` · ${fmt(Math.max(r.start,0))}–${fmt(r.end)}`, {flat: flatLabel(toFi), guest: r.guest});
  track("move_done", {from: wasFi, to: toFi,
                      fromId: (flats[wasFi]||{}).id, toId: (flats[toFi]||{}).id,
                      live: MODE === "live", hadSid: !!r.sid, nf: NF,
                      /* did it actually take, measured after the fact */
                      stuck: occ[toFi] ? !!occ[toFi][Math.max(r.start,0)] : null});
  return {from: wasFi, to: toFi};
}

function cancelBooking(r){
  const i = resv.indexOf(r);
  if(i >= 0) resv.splice(i,1);
  if(MODE === "live" && r.sid){
    // An insert still waiting in the queue can be torn up along with its own
    // cancellation — neither ever needs to travel. One already in flight
    // cannot: it is going to land whatever we do here, so a delete has to
    // follow it. Getting this wrong strands a phantom booking on the server
    // that nothing on this phone remembers.
    const flying = inflight && inflight.id === r.sid;
    const queued = queue.some(op => op.id === r.sid && op !== inflight);
    /* Also drop ops that merely REFERENCE this stay. A payment op carries its
       own uuid as id and names the stay in body.stay_id, so pruning by id alone
       left a pay+ pointing at a stay+ that had just been torn up — it would post
       against a stay that will never exist. Latent while CLOUD_ENABLED is false;
       it ships the moment that flag flips. */
    queue = queue.filter(op => (op.id !== r.sid && !(op.body && op.body.stay_id === r.sid))
                               || op === inflight);
    jset(QUEUE_KEY, queue);
    if(queued && !flying) paintAcct();
    else enqueue({k:"stay-", id:r.sid});
  }
  recompute(); save(); cacheSave();
  track("booking_cancelled", {nights: r.nights, priced: !!r.amount, past: r.end <= 0});
  logAct("cancel", `${isBlock(r) ? "Removed the block on" : "Cancelled " + (r.guest||"a booking") + " in"} `
    + `${flatLabel(r.fi)} · ${fmt(Math.max(r.start,0))}–${fmt(r.end)}`
    + (r.amount ? ` · ${money(r.amount)}` : ""), {flat: flatLabel(r.fi), guest: r.guest});
}
function clearAll(){
  resv = []; usingDemo = false;
  if(MODE === "live"){
    // every stay op is moot now, and so is every payment that hangs off one
    queue = queue.filter(op => op.k.indexOf("stay") !== 0 && op.k.indexOf("pay") !== 0);
    enqueue({k:"wipe"});
  }
  recompute(); save(); cacheSave();
}

const freeCount = d => { let n=0; for(let i=0;i<NF;i++) if(!occ[i][d]) n++; return n; };
const occPct    = fi => { let sold=0, avail=0;
  for(let d=0;d<DAYS;d++){ if(blk[fi][d]) continue; avail++; if(occ[fi][d]) sold++; }
  return avail ? Math.round(sold/avail*100) : 0; };
const blockedOn = d => { let n=0; for(let i=0;i<NF;i++) if(blk[i][d]) n++; return n; };

const haptic = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* ── TWO-TAP DESTRUCTIVE CONFIRM ─────────────────────────────────────────────
   Four of these were written by hand — cancel a booking, remove a payment,
   delete a flat with its bookings, wipe the whole book — and all four had the
   same hole: the first tap armed, and the very next click event ran the
   destructive branch with no time check at all. Measured, two synthetic clicks
   120ms apart dropped a ₹5,300 payment (balance moved ₹12,300 due → ₹17,600
   due) and deleted a flat from the saved inventory.

   A two-tap confirm defends against an accidental SINGLE tap. It does nothing
   against an accidental REPEAT, which is the characteristic error of a thumb on
   a phone — a bounced tap, a double-tap reflex, a jolt on a bus. The guard that
   was missing is dwell: a minimum time the armed state must be visible before
   it will accept the second tap, long enough for the eye to register that the
   button changed and the hand to be able to stop.

   350ms is deliberate. Below ~250ms a repeat is still plausibly one intent;
   much above 400ms and a deliberate confirm starts to feel broken. A tap inside
   the window is not queued or swallowed silently — it re-arms the timer, so the
   window the operator sees is always the full one.

   One place, so a fifth destructive control cannot be written without it. */
const DWELL = 350;
function armConfirm(btn, opts){
  const {rest, armed: armedLabel, run, hold = 3000, cls = "arm"} = opts;
  let armedAt = 0, tm = null;
  /* The caller's accessible name, captured once. Disarming used to write `rest`
     into aria-label, which is the VISIBLE label — a bare "✕" — permanently
     replacing "Cancel T. Nayar's booking in TT-102" and "Remove this ₹3,300
     payment" after a single lapsed arm. The four hand-written confirms this
     helper replaced only ever touched textContent, so this was lost in the
     consolidation: a screen-reader user was left with an unlabelled button that
     cancels a stay. Announce the description when resting, the destructive
     wording when armed. */
  const restAria = btn.getAttribute("aria-label") || rest;
  const disarm = ()=>{
    clearTimeout(tm); armedAt = 0;
    btn.classList.remove(cls); btn.textContent = rest;
    btn.setAttribute("aria-label", restAria);
  };
  btn.onclick = ()=>{
    if(!armedAt){
      armedAt = performance.now();
      btn.classList.add(cls); btn.textContent = armedLabel;
      /* the label changes, so the accessible name has to change with it —
         otherwise a screen reader announces the resting action while the
         button is armed to do the destructive one */
      btn.setAttribute("aria-label", armedLabel);
      haptic(10);
      tm = setTimeout(disarm, hold);
      return;
    }
    if(performance.now() - armedAt < DWELL){
      // too fast to be a decision — treat it as the bounce it probably is and
      // give the operator the full window again
      clearTimeout(tm); armedAt = performance.now(); tm = setTimeout(disarm, hold);
      return;
    }
    clearTimeout(tm);
    haptic(24);
    run();
  };
  return disarm;
}
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ordinalSuffix = n => (n % 100 >= 11 && n % 100 <= 13) ? "th"
  : ["th","st","nd","rd"][n % 10] || "th";
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ── saying where the data is, and when it has not landed ─────────────────────
   The pill is the only place the app makes a promise about durability, so it is
   never allowed to flatter. "Live" means the server has it. Anything else says
   so, with a count.                                                           */
function paintAcct(){
  const btn = document.getElementById("acctBtn"), txt = document.getElementById("acctTxt");
  if(!btn) return;
  btn.classList.remove("live","wait","off");
  if(!CLOUD_ENABLED){
    // no account, so nothing to say about one — this is the way to the data
    txt.textContent = "Data";
    btn.setAttribute("aria-label", "Your data — export it, or clear the test bookings");
  }else if(MODE !== "live"){
    txt.textContent = "Demo data";
    btn.setAttribute("aria-label", "These bookings are made up — tap to sign in and see your own");
  }else if(!online){
    btn.classList.add("off");
    txt.textContent = queue.length ? queue.length + " to send" : "Offline";
    btn.setAttribute("aria-label", queue.length
      ? queue.length + " changes waiting for a connection" : "Offline — showing the last book that reached this phone");
  }else if(queue.length){
    btn.classList.add("wait");
    txt.textContent = queue.length + " to send";
    btn.setAttribute("aria-label", queue.length + " changes still saving");
  }else{
    btn.classList.add("live");
    txt.textContent = "Live";
    btn.setAttribute("aria-label", "Signed in" + (hostName ? " to " + hostName : "") + " — everything saved");
  }
}

/* A conflict is news, not an error. Tapping it opens the room it is about, so
   the next thing you say on the call is one tap away. */
function toast(kind, html, fi, action){
  const host = document.getElementById("toasts");
  if(!host) return;
  const t = el("div", "toast" + (kind ? " " + kind : ""));
  t.innerHTML = html;
  if(action){
    const a = el("button", "tclose", action.label);
    a.onclick = ev=>{ ev.stopPropagation(); t.remove(); action.run(); };
    t.append(a);
  }else if(fi != null && flats[fi]){
    t.append(el("span", "tclose", "See " + flats[fi].id + " →"));
    t.onclick = ()=>{ t.remove(); openSheet(fi); };
  }else{
    t.onclick = ()=> t.remove();
  }
  host.append(t);
  // long enough to read a sentence and act on it; a conflict and an undo both
  // need longer, because both are decisions rather than notifications
  const life = kind === "warn" ? 11000 : action ? 9000 : 7000;
  setTimeout(()=>{ t.style.transition = "opacity .3s"; t.style.opacity = "0";
                   setTimeout(()=>t.remove(), 320); }, life);
  while(host.children.length > 3) host.firstChild.remove();
}

/* ── undo ─────────────────────────────────────────────────────────────────────
   Cancelling was two taps and final. Mid-call, on a phone, with the ✕ sitting a
   thumb's width from the money pill, that is a booking lost to a mis-tap and no
   way back — the guest's name, number and dates all gone. The row is put back
   exactly as it was, including its payments, and only the server id changes.  */
function cancelWithUndo(r, fi){
  const copy = {...r, pays:(r.pays || []).map(p=>({...p}))};
  const who = isBlock(r) ? (r.reason || "Out of service") : r.guest;
  cancelBooking(r);
  /* copy.start, not Math.max(copy.start,0) — the toast has to name the stay the
     operator is being offered back. A guest who arrived before today was being
     announced as "17–20 Aug" for a 14→20 Aug stay, so the sentence under the
     Undo button described a shorter booking than the one it would restore. */
  toast("", `<b>${esc(who)}</b> removed from ${esc(flats[fi].id)}, `
          + `${esc(spanWords(dayISO(copy.start), dayISO(copy.end)))}.`,
    null, {label:"Undo", run:()=>{
      // somebody else may have taken the nights in the seconds since
      if(!freeSpan(copy.fi, copy.start, copy.end)){
        toast("warn", `<b>Those nights are gone.</b> ${esc(flats[fi].id)} was taken while the `
                    + `cancellation was on screen, so ${esc(who)} could not be put back.`, fi);
        return;
      }
      /* The block branch used to call addBlock with five arguments and stop —
         no `extra` — so undoing a cancelled out-of-service spell brought it
         back with its fault, its fixer, that person's number and the bill all
         undefined. The work still showed on the calendar; who did it and what
         it cost were gone, along with the repeat-fault history that decides
         whether the next one gets a warning. The comment above this promises
         the row goes back exactly as it was, so put the rest back too. */
      const restored = isBlock(copy)
        ? addBlock(copy.fi, Math.max(copy.start,0), copy.end - Math.max(copy.start,0),
                   copy.reason, copy.note,
                   {fault:copy.fault, fixer:copy.fixer, phone:copy.fixer_phone, cost:copy.cost})
        : addBooking(copy.fi, Math.max(copy.start,0), copy.end - Math.max(copy.start,0),
                     copy.guest, copy.src, {phone:copy.phone, pax:copy.pax, amount:copy.amount});
      if(!restored){ toast("bad", "<b>Could not put it back.</b> Nothing was changed.", fi); return; }
      const back = resv[resv.length - 1];
      /* And the true dates. Math.max(start,0) is right for the OVERLAP check —
         you cannot re-take nights already behind you — but writing it into the
         row shortens a spell that began before today and moves its first night
         forward, which is a different outage from the one that was cancelled. */
      /* The END was not restored, and addBooking clamps nights to the length of
         the book. A tenancy running past the horizon therefore came back cut
         off at it: measured on a 176-night let in TT-101, undo returned it 158
         nights long and silently ended it 18 nights early. Nothing on screen
         says so — the calendar only draws as far as the book goes — so the
         truncation is invisible in exactly the place it does damage. Both
         clamps are right for a booking somebody is typing now and wrong for a
         restore, whose only job is to return the row that was cancelled. */
      if(copy.start !== back.start || copy.end !== back.end){
        back.start = copy.start; back.end = copy.end;
        back.nights = back.end - back.start; recompute();
        /* and PERSIST it. This branch corrected the row in memory and stopped.
           addBooking had already written the clamped start to storage, and the
           only later write is addPayment's save(), which a row with nothing but
           Platform payments never reaches. So the screen showed the stay
           restored correctly and the next pull-to-refresh brought it back three
           nights short with its arrival moved forward — the export's "Check in"
           and "Nights" columns wrong with it. Measured on a 14→20 Aug stay:
           memory {start:-3, end:3}, storage {start:0, end:3}. */
        save(); cacheSave();
        /* and the write already on its way to the server. addBooking queued the
           clamped span before this correction existed, so the row was right on
           the phone and short in the cloud until the next full pull overwrote
           the phone with it. flush() yields before its first request, so the
           op is still here to correct. */
        if(MODE === "live" && back.sid){
          const q = queue.find(o => o.k === "stay+" && o.id === back.sid);
          if(q){ q.body.starts_on = dayISO(back.start); q.body.ends_on = dayISO(back.end);
                 jset(QUEUE_KEY, queue); }
        }
      }
      /* PAYMENTS ARE RESTORED, NOT RE-DERIVED.
         This used to skip every Platform payment in the copy, on the assumption
         that addBooking's auto-payment already matched it. It does not: the
         auto-payment is always for the FULL amount, while the copy might hold
         nothing (the payout had not landed) or a partial. Both directions were
         wrong and both are reachable — openPayment offers Platform as a chip
         with a free-text amount. Measured: a ₹2,200 Airbnb stay with no
         payments came back with a ₹2,200 Platform payment invented, the pill
         flipped from "₹2,200 due" to "payout due", and owedStats().total fell
         by exactly that. 20 bookings in the shipped book are in that state.
         The comment above promises the row goes back exactly as it was, so
         throw away whatever addBooking guessed and replay what was saved. */
      /* dropPayment, not `back.pays = []`. Clearing the array in memory left
         addBooking's auto-payment sitting in localStorage, and nothing wrote
         afterwards: the only later save() is inside addPayment, which never
         runs when copy.pays is empty — which is exactly the case this fix was
         written for. So the screen was right and the next pull-to-refresh
         brought the invented payment back. Measured on TT-102's T. Nayar: 0
         payments in memory, 1 in storage, and after load() the ₹8,200 due
         became ₹0 and owedStats fell by exactly that. The bug was deferred by
         one reload, not fixed. The sibling branch three lines up documents this
         same trap and guards it with save(); cacheSave();.
         dropPayment also retracts the queued `pay+` op in live mode, which a
         bare array assignment would have let reach the server with no `pay-`
         to cancel it. */
      (back.pays || []).slice().forEach(p=> dropPayment(back, p));
      (copy.pays || []).forEach(p=> addPayment(back, p.amount, p.method, p.note));
      save(); cacheSave();
      haptic(14); refreshScreen();
      toast("", `<b>${esc(who)}</b> is back in ${esc(flats[fi].id)}.`, fi);
    }});
}

/* ══════════════ writing a real .xlsx, with no library ═══════════════════════
   A CSV would have been ten lines. It is not used because Excel reads a column
   of ten-digit phone numbers as scientific notation and writes 9.81235E+09 —
   silently destroying the single most valuable column in the export, which is
   the one the whole marketing list is keyed on.

   So: a genuine workbook, where numbers are numbers you can sum, dates are
   dates you can sort, and phone numbers are text that survives. An xlsx is a
   ZIP of XML, and a ZIP entry may be *stored* rather than deflated, so all this
   needs is a CRC32 and careful byte assembly — no dependency, nothing fetched,
   still one file that works offline.                                          */
const CRC_T = (()=>{ const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n] = c>>>0; }
  return t; })();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder(), parts = [], dir = [];
  let at = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(8, 0, true);                        // stored, not deflated
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x2141, true);   // fixed timestamp
    lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x2141, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, at, true);
    dir.push(new Uint8Array(ch.buffer), name);
    at += 30 + name.length + n;
  });
  const dirBytes = dir.reduce((s,b)=> s + b.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, dirBytes, true); eo.setUint32(16, at, true);
  const all = parts.concat(dir, [new Uint8Array(eo.buffer)]);
  const out = new Uint8Array(all.reduce((s,b)=> s + b.length, 0));
  let o = 0; all.forEach(b=>{ out.set(b, o); o += b.length; });
  return out;
}
const xmlEsc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
const colName = i => { let s = ""; i++; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - 1 - m) / 26; } return s; };
/* Excel counts days from 1899-12-30 */
const xlDate = d => Math.round((d - new Date(Date.UTC(1899,11,30))) / 86400000);

/* A cell is {v, t} where t is "s" text, "n" number, "d" date, "m" money.
   Styles: 0 plain, 1 header, 2 date, 3 money, 4 text-forced (phone numbers). */
function sheetXml(rows){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row, r)=>{
    x += '<row r="' + (r+1) + '">';
    row.forEach((c, i)=>{
      if(c == null || c.v === "" || c.v == null) return;
      const ref = colName(i) + (r+1);
      if(c.t === "n" || c.t === "m")
        x += '<c r="' + ref + '" s="' + (c.t === "m" ? 3 : 0) + '"><v>' + Number(c.v) + '</v></c>';
      else if(c.t === "d")
        x += '<c r="' + ref + '" s="2"><v>' + xlDate(c.v) + '</v></c>';
      else
        x += '<c r="' + ref + '" s="' + (c.t === "h" ? 1 : c.t === "p" ? 4 : 0)
           + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(c.v) + '</t></is></c>';
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function buildXlsx(sheets){                       // [{name, rows}]
  const enc = new TextEncoder(), B = s => enc.encode(s);
  const files = [
    {name:"[Content_Types].xml", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")
      + '</Types>')},
    {name:"_rels/.rels", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:"xl/workbook.xml", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + sheets.map((s,i)=>'<sheet name="'+xmlEsc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")
      + '</sheets></workbook>')},
    {name:"xl/_rels/workbook.xml.rels", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")
      + '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>')},
    {name:"xl/styles.xml", data:B('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<numFmts count="2"><numFmt numFmtId="180" formatCode="dd\\ mmm\\ yyyy"/>'
      + '<numFmt numFmtId="181" formatCode="#,##0"/></numFmts>'
      + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
      + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
      + '<fills count="2"><fill><patternFill patternType="none"/></fill>'
      + '<fill><patternFill patternType="gray125"/></fill></fills>'
      + '<borders count="1"><border/></borders>'
      + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
      + '<cellXfs count="5">'
      + '<xf xfId="0"/>'                                              // 0 plain
      + '<xf xfId="0" fontId="1" applyFont="1"/>'                     // 1 header
      + '<xf xfId="0" numFmtId="180" applyNumberFormat="1"/>'         // 2 date
      + '<xf xfId="0" numFmtId="181" applyNumberFormat="1"/>'         // 3 money
      + '<xf xfId="0" quotePrefix="1"/>'                              // 4 forced text
      + '</cellXfs>'
      // without a named default style some readers warn and substitute their own
      + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
      + '</styleSheet>')},
  ];
  sheets.forEach((s,i)=> files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:B(sheetXml(s.rows))}));
  return new Blob([zipStore(files)],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ── what actually goes in the book ──────────────────────────────────────────
   Four sheets, each answering a question somebody asks out loud. Nothing is
   invented: a booking with no amount exports a blank cell rather than a zero,
   because a zero would read as "free stay" and get summed. */
function exportRows(){
  track("export_built", {flats: NF, bookings: bookings().length});
  logAct("export", `Exported the book · ${NF} flats · ${bookings().length} bookings`);
  const bk = bookings().slice().sort((a,b)=> a.start - b.start);
  const fmtDay = d => dateAt(d);
  const H = a => a.map(v => ({v, t:"h"}));

  const bookingRows = [H(["Flat","Building","Type","Guest","Phone","Source","Check in","Check out",
                          "Nights","Guests","Agreed","Received","With platform","Balance","Status"])];
  bk.forEach(r=>{
    const f = flats[r.fi], due = dueFrom(r), plat = withPlatform(r);
    bookingRows.push([
      {v:f.id}, {v:f.bname}, {v:f.type}, {v:r.guest}, {v:r.phone || "", t:"p"}, {v:r.src},
      {v:fmtDay(r.start), t:"d"},
      /* A tenancy still running when the import window closed has no recorded
         check-out, and a typed date cell is the most believable place in the
         app to put one that does not exist — it lands in the accountant's
         spreadsheet as a date, sorts as a date, and is 18 Nov 2026 purely
         because that is where the window stopped. Text, and it says so. */
      r.openEnd ? {v:"no end recorded"} : {v:fmtDay(r.end), t:"d"},
      r.openEnd ? {v:"open"} : {v:r.nights, t:"n"}, r.pax ? {v:r.pax, t:"n"} : null,
      r.amount ? {v:r.amount, t:"m"} : null,
      inHand(r) ? {v:inHand(r), t:"m"} : null,
      plat ? {v:plat, t:"m"} : null,
      due ? {v:due, t:"m"} : null,
      {v: !r.amount ? "no amount recorded" : due > 0 ? "balance due" : plat > 0 ? "payout due" : "settled"},
    ]);
  });

  const payRows = [H(["Date","Amount","Method","Guest","Phone","Flat","Stay from","Stay to"])];
  bk.forEach(r=> (r.pays || []).forEach(p=> payRows.push([
    {v:fmtDay(p.on || 0), t:"d"}, {v:p.amount, t:"m"}, {v:p.method}, {v:r.guest},
    {v:r.phone || "", t:"p"}, {v:flats[r.fi].id},
    {v:fmtDay(r.start), t:"d"}, {v:fmtDay(r.end), t:"d"}])));

  /* One row per number, which is the marketing list. Sorted by how much they
     have been worth, because that is the order you would call them in. */
  const byPhone = {};
  bk.filter(r => r.phone).forEach(r=>{
    const k = digits10(r.phone);
    const g = byPhone[k] = byPhone[k] || {name:r.guest, phone:r.phone, stays:0, nights:0,
                                          billed:0, paid:0, first:r.start, last:r.start};
    g.stays++; g.nights += r.nights; g.billed += r.amount || 0; g.paid += paidOn(r);
    g.first = Math.min(g.first, r.start); g.last = Math.max(g.last, r.start);
    if(r.start >= g.last) g.name = r.guest;
  });
  const guestRows = [H(["Guest","Phone","Stays","Nights","Billed","Paid","First stay","Last stay"])];
  Object.values(byPhone).sort((a,b)=> b.billed - a.billed).forEach(g=> guestRows.push([
    {v:g.name}, {v:g.phone, t:"p"}, {v:g.stays, t:"n"}, {v:g.nights, t:"n"},
    g.billed ? {v:g.billed, t:"m"} : null, g.paid ? {v:g.paid, t:"m"} : null,
    {v:fmtDay(g.first), t:"d"}, {v:fmtDay(g.last), t:"d"}]));

  /* Month by month. Occupancy excludes blocked nights from the denominator,
     exactly as it does on screen — taking a flat out of service must never
     flatter the figure. */
  const months = {};
  /* Seed a bucket for every month the BOOK touches, not just the forward
     horizon. A stay that began last month and is still running is kept by
     load(), so it belongs in an earlier month that `d = 0 … DAYS` never
     creates. Without it there was nowhere for a past arrival to land. */
  const firstStart = bk.reduce((m,r)=> Math.min(m, r.start), 0);
  for(let d = Math.min(firstStart, 0); d < DAYS; d++){
    const dt = dateAt(d), key = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0");
    const m = months[key] = months[key] || {key, label: MONF[dt.getMonth()] + " " + dt.getFullYear(),
                                             sold:0, sellable:0, billed:0, paid:0, arrivals:0, priced:0,
                                             days:0, cal: new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate()};
    /* SEED THE BUCKET, DO NOT COUNT THE NIGHTS. Two different jobs sharing one
       loop, and running the second one over past days corrupted every occupancy
       figure in the export. occ[] and blk[] are DAYS long and start at today,
       so for d < 0 blk[i][d] is undefined (never skipped) and occ[i][d] is
       undefined (never sold) — every past night counted as sellable and empty.
       Measured on the shipped book: August printed 936 sellable and 34%, where
       the nights the book actually holds are 666 and 47%. 270 fabricated empty
       nights, a 13-point error, on the sheet that goes to the accountant.

       It compounds with the booking-retention grace added in the same commit:
       an unpaid departure is now kept up to 120 days back, which drags
       firstStart with it, and one such row invented four 0%-occupancy months
       for months the operator actually traded and halved August again.

       The month still gets its row — arrivals, billed and collected are
       accumulated below from r.start and are correct for a past month — and
       Occupancy prints "—" there via the existing `m.sellable ? … : "—"`
       branch, which is honest: the app has no occupancy data before today. */
    if(d < 0) continue;
    m.days++;
    for(let i = 0; i < NF; i++){
      if(blk[i][d]) continue;
      m.sellable++; if(occ[i][d]) m.sold++;
    }
  }
  bk.forEach(r=>{
    /* r.start raw, NOT Math.max(r.start,0). dateAt() handles a negative offset
       perfectly well — the Bookings sheet in the same workbook already uses it
       raw — and the clamp turned "arrived before today" into "arrived today".
       Measured on a 30-night stay that checked in 25 Jul: the Bookings sheet
       said 25 Jul and the Summary had no July row at all, folding the arrival
       and the whole ₹90,000 into August. Two sheets in one workbook giving the
       accountant different arrival months for the same stay, with last month's
       revenue reported as this month's. */
    const dt = dateAt(r.start);
    const key = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0");
    if(!months[key]) return;
    months[key].arrivals++; months[key].billed += r.amount || 0;
    if(r.amount) months[key].priced++;
    /* ONE basis for the whole row: the month the stay ARRIVES.
       Billed was always counted that way, and collected was counted by the date
       the money came in, so any advance paid in a different month from the
       arrival made both rows wrong at once — the arrival month showed the stay
       fully outstanding while the payment month showed cash against a stay it
       had no billing for. Subtracting one basis from the other is what made
       "Outstanding" meaningless rather than merely mis-keyed; the earlier fix
       stopped the silent discard but left the mixture.
       So this row now answers one question and answers it exactly: of the stays
       arriving in this month, how much was agreed and how much has come in.
       Cash BY DATE has its own sheet — every payment is on Payments with the
       day it was taken, which is the right place for that question. */
    (r.pays || []).forEach(p=> months[key].paid += p.amount);
  });
  /* THE MONEY COLUMNS NEED THEIR DENOMINATOR ON THE SAME ROW. Billed is the
     sum over the arrivals that carry an amount, and on the operator's own book
     most do not — the sheet showed a month's Billed beside its full arrival
     count, which reads as the month's revenue rather than as the part of it
     that has a figure. Occupancy already names the days it covers; this names
     the bookings it covers, in the column beside the money. */
  const sumRows = [H(["Arrival month","Arrivals","Nights sold","Sellable nights","Occupancy",
                      "Billed","Arrivals with an amount","Collected on those","Still owed on those"])];
  /* A month with nothing in it is not a fact, it is a gap in the seeding loop.
     Buckets are created for every month between the earliest arrival and the
     horizon, so one stay retained from four months ago produced three entirely
     blank rows — 0 arrivals, 0 billed, 0 sellable — on the sheet that goes to
     the accountant. Keep a month only if something actually happened in it. */
  Object.values(months)
    .filter(m => m.arrivals || m.sellable || m.billed || m.paid)
    .sort((a,b)=> a.key < b.key ? -1 : 1).forEach(m=> sumRows.push([
    {v:m.label}, {v:m.arrivals, t:"n"}, {v:m.sold, t:"n"}, {v:m.sellable, t:"n"},
    /* PART MONTHS SAY SO. occ[] starts today, so the month the export is taken
       in is counted over the days from today to its end while Arrivals, Billed
       and Collected on the same row cover the whole month. August printed 138
       sellable nights — three days by 46 flats — beside a 260-arrival count for
       the month, and called the quotient the month's occupancy. Two different
       periods in one row, on the sheet that goes to the accountant. The row
       still carries the figure, because it is true of the days it covers, and
       now it names them. */
    {v: !m.sellable ? "—"
      : Math.round(m.sold / m.sellable * 100) + "%"
        + (m.days < m.cal ? ` (${m.days} of ${m.cal} days)` : "")},
    m.billed ? {v:m.billed, t:"m"} : null,
    {v: m.arrivals ? `${m.priced} of ${m.arrivals}` : "—"},
    m.paid ? {v:m.paid, t:"m"} : null,
    (m.billed - m.paid) > 0 ? {v:m.billed - m.paid, t:"m"} : null]));

  return [{name:"Summary", rows:sumRows}, {name:"Bookings", rows:bookingRows},
          {name:"Payments", rows:payRows}, {name:"Guests", rows:guestRows}];
}

/* On a phone the share sheet is the right destination — it puts the file
   straight into WhatsApp or mail, which is how it reaches the accountant.
   On a desktop it is an ordinary download. */
async function exportBook(btn){
  const sheets = exportRows();
  const blob = buildXlsx(sheets);
  const stamp = isoDay(today);
  const name = (hostName || "Vacancy").replace(/[^\w]+/g,"-").toLowerCase() + "-" + stamp + ".xlsx";
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Bookings"}); return "shared"; }
    catch(e){ if(e && e.name === "AbortError") return "cancelled"; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  return "downloaded";
}

/* With the server off there is no account to manage, so this is simply where the
   data is: what is in the book, how to get it out, and the plain fact that it
   lives on this phone and nowhere else. */
/* ── THE TIMELINE ────────────────────────────────────────────────────────────
   Newest first, grouped by the day it happened, because "what did I do this
   morning" and "when did that booking go" are both questions about a day. One
   line each: the time, the sentence, and the flat it touched. No filters, no
   search, no pagination — three hundred entries is a fortnight of ordinary use
   and the answer is nearly always in the first ten.                          */
/* One glyph per kind, and every kind has one — a "·" fallback in a log is the
   app admitting it does not know what it just recorded. Money is ₹ wherever
   money moved, in or out, because the sentence beside it says which. */
const ACT_ICON = {
  book:"+",      restore:"↩",   cancel:"✕",   move:"⇄",     refused:"⊘",
  paid:"₹",      unpaid:"−",    fault:"!",    fixed:"✓",    block:"⌂",
  expense:"₹",   costs:"₹",     revenue:"₹",  flats:"⌗",    export:"↓",
};
/* Amber is attention, and both of these are things that want a second look:
   a fault nobody has closed, and a move the app would not make. */
const ACT_WARN = {refused:1, fault:1};
function openActivity(){
  sheetWipe();
  const t = el("div");
  t.innerHTML = `<div class="n">Everything you have done</div>`
    + `<div class="m">${activity.length ? activity.length + " on this phone" : "nothing yet"}`
    + `${activity.length >= LOG_CAP ? " · the last " + LOG_CAP : ""}</div>`;
  const x = el("button", null, "‹"); x.setAttribute("aria-label","Back to your data");
  x.onclick = ()=> openDataSheet();
  sheetH.append(t, x);

  if(!activity.length){
    const e = el("div","blocked");
    e.style.margin = "14px 20px";
    e.innerHTML = `<b>Nothing recorded yet.</b> Every booking, cancellation, move, payment, `
      + `repair and expense you enter from now on appears here, with the time it happened.`;
    sheetB.append(e);
    sheet.classList.add("on"); scrim.classList.add("on");
    return;
  }

  /* Local time, and the operator's own day boundary — an ISO string is stored
     so the entry cannot drift, but it is READ in whatever zone they are in. */
  const when = iso => new Date(iso);
  const dayKey = d => d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const dayName = d =>{
    const k = new Date(d); k.setHours(0,0,0,0);
    const off = Math.round((k - t0) / 86400000);
    return off === 0 ? "Today" : off === -1 ? "Yesterday"
         : k.getDate() + " " + MON[k.getMonth()]
           + (k.getFullYear() !== t0.getFullYear() ? " " + k.getFullYear() : "");
  };
  const clock = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

  let last = null, card = null;
  activity.forEach(a=>{
    const d = when(a.on);
    if(isNaN(d)) return;
    const k = dayKey(d);
    if(k !== last){
      last = k;
      const h = el("div","sect");
      h.style.cssText = "margin:14px 20px 6px";
      h.append(el("span","lbl", dayName(d)));
      sheetB.append(h);
      card = el("div","card"); card.style.cssText = "margin:0 20px";
      sheetB.append(card);
    }
    const row = el("div","row bk actrow");
    const m = el("div","meta");
    m.innerHTML = `<b>${esc(a.s)}</b>`
      + (a.g || a.f ? `<em>${[a.g, a.f].filter(Boolean).map(esc).join(" · ")}</em>` : "");
    const e2 = el("div","rowend");
    e2.append(el("span","acttime", clock(d)));
    row.append(el("div","actk" + (ACT_WARN[a.k] ? " warn" : ""), ACT_ICON[a.k] || "·"), m, e2);
    card.append(row);
  });
  sheet.classList.add("on"); scrim.classList.add("on");
}
